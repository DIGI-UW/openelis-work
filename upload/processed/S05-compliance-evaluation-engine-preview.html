<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S-05 v2.0: Regulation-Scoped Reference Ranges — In Context</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #491d8b; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .oe-shell { background: #f4f4f4; min-height: 100vh; }
    .oe-topbar { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
    .oe-topbar .logo { font-weight: 600; font-size: 14px; }
    .oe-topbar .nav-item { font-size: 13px; opacity: 0.7; cursor: pointer; }
    .oe-topbar .spacer { flex: 1; }
    .oe-topbar .user { font-size: 12px; opacity: 0.7; }
    .oe-breadcrumb { background: #fff; padding: 8px 24px; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #525252; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-breadcrumb .sep { margin: 0 6px; color: #c6c6c6; }
    .oe-page { padding: 16px 24px; max-width: 1300px; margin: 0 auto; }
    .oe-page-header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; }
    .oe-page-title { font-size: 28px; font-weight: 300; margin: 0; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin: 4px 0 0 0; }
    .tile { background: #fff; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 0.75rem 0; }
    .form-field { margin-bottom: 0.75rem; }
    .form-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .form-field input, .form-field select {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d;
      font-size: 14px; background: #f4f4f4; outline: none; box-sizing: border-box;
    }
    .form-field input[readonly] { background: #e0e0e0; color: #525252; }
    .grid { display: grid; gap: 1rem; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .helper { font-size: 12px; color: #525252; }
    .btn { padding: 6px 14px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: #0f62fe; }
    .btn-primary { background: #0f62fe; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; background: #f4f4f4; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e0e0e0; }
    th.new-col { background: #fcf4d6; }
    td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    td code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #f4f4f4; padding: 2px 6px; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }
    .tag-purple { background: #e8daff; color: #491d8b; }
    .tag-green { background: #defbe6; color: #0e6027; }
    .tag-magenta { background: #ffd6e8; color: #740937; }
    .tag-red { background: #ffd7d9; color: #a2191f; }
    .tag-yellow { background: #fcf4d6; color: #684e00; }
    .tag-orange { background: #ffe2cc; color: #8a3800; }
    .tag-warm-gray { background: #e8e6e1; color: #525252; }
    .new-region { border: 2px dashed #f1c21b; border-radius: 6px; padding: 12px; position: relative; margin-bottom: 1rem; }
    .new-region::before {
      content: attr(data-label); position: absolute; top: -11px; left: 12px;
      background: #f1c21b; color: #000; font-size: 11px; font-weight: 700;
      padding: 1px 8px; border-radius: 4px; z-index: 2;
    }
    .existing-region { opacity: 0.72; position: relative; margin-bottom: 1rem; }
    .existing-region::before {
      content: 'EXISTING'; position: absolute; top: 4px; right: 8px; z-index: 1;
      background: #8d8d8d; color: #fff; font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 3px;
    }
    .scenes { background: #393939; color: #fff; display: flex; padding: 0; }
    .scene { padding: 10px 16px; cursor: pointer; font-size: 13px; border-right: 1px solid #525252; }
    .scene:hover { background: #525252; }
    .scene.active { background: #0f62fe; font-weight: 600; }
    .filter-bar { display: flex; gap: 12px; align-items: flex-end; padding: 12px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .info-tile { background: #edf5ff; border-left: 3px solid #0f62fe; padding: 12px 16px; margin-top: 16px; }
    .info-tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 8px 0; }
    .info-tile ul { margin: 0; padding-left: 20px; font-size: 13px; }
    .expanded-row { background: #f4f4f4; padding: 0; }
    .expanded-content { padding: 16px; }
    .threshold-source { display: inline-flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .threshold-source-text { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="preview-banner">⚡ S-05 v2.0 — Regulation-Scoped Reference Ranges — IN-CONTEXT preview (reframed from v1.0 Compliance Evaluation Engine)</div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const STANDARDS = [
      { id: 'std-001', regNumber: 'PP No. 22/2021', version: '2021-01' },
      { id: 'std-003', regNumber: 'WHO-DWG-4', version: '2011-01' },
      { id: 'std-005', regNumber: 'PMK No. 32/2017', version: '2017-01' },
    ];

    // 2026-04-28 amendment: ranges gain optional `component` scope; results carry `sources[]` per regulation
    const RANGES = [
      { id: 1, test: 'Turbidity', component: null, sampleType: 'Surface Water', min: null, max: 25, unit: 'NTU', standard: 'PP No. 22/2021' },
      { id: 2, test: 'Turbidity', component: null, sampleType: 'Drinking Water', min: null, max: 5, unit: 'NTU', standard: 'WHO-DWG-4' },
      { id: 3, test: 'Turbidity', component: null, sampleType: '(any)', min: null, max: 25, unit: 'NTU', standard: '(generic)' },
      { id: 4, test: 'pH', component: null, sampleType: 'Surface Water', min: 6.0, max: 9.0, unit: '—', standard: 'PP No. 22/2021' },
      { id: 5, test: 'pH', component: null, sampleType: 'Drinking Water', min: 6.5, max: 8.5, unit: '—', standard: 'WHO-DWG-4' },
      { id: 6, test: 'Total Coliform', component: null, sampleType: 'Surface Water', min: null, max: 5000, unit: 'MPN/100mL', standard: 'PP No. 22/2021' },
      { id: 7, test: 'Total Coliform', component: null, sampleType: 'Drinking Water', min: 0, max: 0, unit: 'MPN/100mL', standard: 'WHO-DWG-4' },
      { id: 8, test: 'Noise Pollution Survey', component: 'Heading (°)', sampleType: 'Ambient Air', min: 0, max: 360, unit: '°', standard: '(no eval — informational)' },
      { id: 9, test: 'Noise Pollution Survey', component: 'Sound Pressure (dB)', sampleType: 'Ambient Air (Daytime)', min: null, max: 70, unit: 'dB', standard: 'PP No. 41/1999' },
      { id: 10, test: 'Noise Pollution Survey', component: 'Sound Pressure (dB)', sampleType: 'Ambient Air (Daytime)', min: null, max: 65, unit: 'dB', standard: 'WHO Env Noise' },
    ];

    // 2026-04-29 (rewritten): structured by test session → reading groups → component results.
    // Per-regulation chips replace combined-status rollup. Reading groups are dynamic for tests
    // where allowsMultipleReadings === true.
    const INITIAL_RESULT_TESTS = [
      {
        id: 'rt-001', accession: 'ENV-2026-0412.001', test: 'Turbidity', unit: 'NTU',
        components: [null], allowsMultipleReadings: false,
        readingGroups: [
          { id: 'rg-001-1', label: null, results: [
            { component: null, value: '18', evaluations: [
              { reg: 'PP No. 22/2021', status: 'PASS', label: '≤ 25 NTU' },
              { reg: 'WHO-DWG-4', status: 'FAIL', label: '≤ 5 NTU' },
            ]},
          ]},
        ],
      },
      {
        id: 'rt-002', accession: 'ENV-2026-0412.001', test: 'pH', unit: '—',
        components: [null], allowsMultipleReadings: false,
        readingGroups: [
          { id: 'rg-002-1', label: null, results: [
            { component: null, value: '7.2', evaluations: [
              { reg: 'PP No. 22/2021', status: 'PASS', label: '6.0 – 9.0' },
              { reg: 'WHO-DWG-4', status: 'PASS', label: '6.5 – 8.5' },
            ]},
          ]},
        ],
      },
      {
        id: 'rt-003', accession: 'ENV-2026-0412.001', test: 'Total Coliform', unit: 'MPN/100mL',
        components: [null], allowsMultipleReadings: false,
        readingGroups: [
          { id: 'rg-003-1', label: null, results: [
            { component: null, value: '4900', evaluations: [
              { reg: 'PP No. 22/2021', status: 'BORDERLINE', label: '≤ 5000 MPN/100mL' },
              { reg: 'WHO-DWG-4', status: 'FAIL', label: '0 MPN/100mL' },
            ]},
          ]},
        ],
      },
      // Multi-component, multi-reading noise pollution
      {
        id: 'rt-noise', accession: 'ENV-2026-0412.005', test: 'Noise Pollution Survey', unit: 'mixed',
        components: ['Heading (°)', 'Sound Pressure (dB)'], allowsMultipleReadings: true,
        readingGroups: [
          { id: 'rg-noise-1', label: 'Reading 1 — North face', results: [
            { component: 'Heading (°)', value: '90', evaluations: [
              { reg: '(informational)', status: 'INFO', label: 'no threshold' },
            ]},
            { component: 'Sound Pressure (dB)', value: '72', evaluations: [
              { reg: 'PP No. 41/1999', status: 'FAIL', label: '≤ 70 dB' },
              { reg: 'WHO Env Noise', status: 'FAIL', label: '≤ 65 dB' },
            ]},
          ]},
          { id: 'rg-noise-2', label: 'Reading 2 — East face', results: [
            { component: 'Heading (°)', value: '180', evaluations: [
              { reg: '(informational)', status: 'INFO', label: 'no threshold' },
            ]},
            { component: 'Sound Pressure (dB)', value: '64', evaluations: [
              { reg: 'PP No. 41/1999', status: 'PASS', label: '≤ 70 dB' },
              { reg: 'WHO Env Noise', status: 'PASS', label: '≤ 65 dB' },
            ]},
          ]},
        ],
      },
      {
        id: 'rt-notes', accession: 'ENV-2026-0412.001', test: 'Field Notes (free text)', unit: '',
        components: [null], allowsMultipleReadings: false,
        readingGroups: [
          { id: 'rg-notes-1', label: null, results: [
            { component: null, value: 'Collected 50m downstream', evaluations: [] },
          ]},
        ],
      },
    ];

    const STATUS_CLS = {
      PASS: 'tag-green',
      FAIL: 'tag-red',
      BORDERLINE: 'tag-yellow',
      INFO: 'tag-warm-gray',
    };

    function Topbar() {
      return (
        <div className="oe-topbar">
          <span className="logo">OpenELIS Global</span>
          <span className="nav-item">Home</span>
          <span className="nav-item">Order</span>
          <span className="nav-item">Results</span>
          <span className="nav-item">Validation</span>
          <span className="nav-item">Admin</span>
          <span className="spacer"></span>
          <span className="user">caseyi · Admin</span>
        </div>
      );
    }

    function Breadcrumb({ trail }) {
      return (
        <div className="oe-breadcrumb">
          {trail.map((t, i) => (
            <span key={i}>
              {i > 0 && <span className="sep">›</span>}
              {i < trail.length - 1 ? <a href="#">{t}</a> : <strong>{t}</strong>}
            </span>
          ))}
        </div>
      );
    }

    function PageHeader({ title, subtitle }) {
      return (
        <div className="oe-page-header">
          <h1 className="oe-page-title">{title}</h1>
          {subtitle && <p className="oe-page-subtitle">{subtitle}</p>}
        </div>
      );
    }

    function Scene1_RangeAdmin() {
      // 2026-04-29 split: this admin page only shows STANDALONE ranges (compliance_standard_id IS NULL).
      // Regulation-scoped ranges live in Compliance Standard Admin (S-01).
      const standaloneRanges = useMemo(() =>
        RANGES.filter(r => r.standard === '(generic)' || r.standard?.startsWith('(no eval'))
      , []);
      return (
        <div>
          <Breadcrumb trail={['Admin', 'Reference Data', 'Reference Ranges']} />
          <PageHeader title="Reference Range Management" subtitle="2026-04-29 split: this admin only manages standalone (non-regulation) ranges. Regulation-scoped ranges are managed in Compliance Standard Admin (S-01)." />
          <div className="oe-page">

            {/* New banner: split direction */}
            <div className="info-tile" style={{ marginBottom: 16 }}>
              <h5>Where do regulation-scoped ranges live?</h5>
              <p style={{ fontSize: 13, margin: 0 }}>
                Reference ranges scoped to a compliance standard (e.g., PP No. 22/2021's Turbidity ≤ 25 NTU) are managed inside <strong>Compliance Standard Admin → Edit Standard → Ranges</strong> (see <strong>S-01</strong>). Borderline proximity is configured per standard there too.
                {' '}This screen only manages standalone (non-regulation) ranges, used when a test is ordered with no regulation attached.
              </p>
            </div>

            <div className="existing-region">
              <div className="tile">
                <h5>Reference Range Admin (existing OE page) — standalone only</h5>
                <p className="helper">Gates: <code>referenceRange.edit</code> · No new permission key · Filter: rows where <code>compliance_standard_id IS NULL</code></p>
              </div>
            </div>

            <div className="existing-region">
              <div className="tile" style={{ marginBottom: 0 }}>
                <div className="filter-bar" style={{ padding: 0, borderBottom: 'none' }}>
                  <button className="btn btn-primary">+ Add Standalone Reference Range</button>
                  <span className="helper" style={{ marginLeft: 12 }}>To add a regulation-scoped range, go to Compliance Standard Admin (S-01).</span>
                </div>

                <table style={{ marginTop: 12 }}>
                  <thead>
                    <tr>
                      <th>Test</th>
                      <th>Sample Type</th>
                      <th>Min</th>
                      <th>Max</th>
                      <th>Unit</th>
                    </tr>
                  </thead>
                  <tbody>
                    {standaloneRanges.length === 0 ? (
                      <tr><td colSpan="5" className="helper" style={{ padding: 24, textAlign: 'center', fontStyle: 'italic' }}>
                        No standalone ranges. Most env tests are regulation-scoped — check Compliance Standard Admin (S-01).
                      </td></tr>
                    ) : standaloneRanges.map(r => (
                      <tr key={r.id}>
                        <td>{r.test}</td>
                        <td>{r.sampleType}</td>
                        <td>{r.min ?? '—'}</td>
                        <td>{r.max ?? '—'}</td>
                        <td>{r.unit}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <p className="helper" style={{ marginTop: 8 }}>
                  Showing {standaloneRanges.length} standalone range{standaloneRanges.length === 1 ? '' : 's'}.
                  {' '}<strong>{RANGES.length - standaloneRanges.length}</strong> regulation-scoped ranges are hidden — manage them in Compliance Standard Admin (S-01).
                </p>
              </div>
            </div>

            <div className="info-tile">
              <h5>2026-04-29 admin split — what changed</h5>
              <ul>
                <li>✅ Existing OE Reference Range Admin stays clean (no new column, no compliance-standard filter)</li>
                <li>✅ Regulation-scoped ranges (compliance_standard_id IS NOT NULL) are owned by S-01's Compliance Standard editor</li>
                <li>✅ Borderline proximity is also configured per standard in S-01</li>
                <li>📋 Evaluator path: regulation supersedes standalone. Standalone only fires if the order has no regulation.</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function Scene2_ResultsEntry() {
      const [resultTests, setResultTests] = useState(INITIAL_RESULT_TESTS);

      const addReading = (testId) => {
        setResultTests(prev => prev.map(rt => {
          if (rt.id !== testId) return rt;
          const nextIdx = rt.readingGroups.length + 1;
          // Clone the first reading group's component shape but with empty values for the new reading
          const template = rt.readingGroups[0]?.results || [];
          return {
            ...rt,
            readingGroups: [
              ...rt.readingGroups,
              {
                id: `${rt.id}-rg-${nextIdx}`,
                label: `Reading ${nextIdx} — (new)`,
                results: template.map(r => ({ component: r.component, value: '', evaluations: [] })),
              },
            ],
          };
        }));
      };

      const removeReading = (testId, rgId) => {
        setResultTests(prev => prev.map(rt => {
          if (rt.id !== testId) return rt;
          if (rt.readingGroups.length <= 1) return rt; // keep at least one
          return { ...rt, readingGroups: rt.readingGroups.filter(rg => rg.id !== rgId) };
        }));
      };

      const renderEvaluationChips = (evaluations) => {
        if (!evaluations || evaluations.length === 0) {
          return <span className="helper">—</span>;
        }
        return (
          <div style={{ display:'flex', flexWrap:'wrap', gap: 4 }}>
            {evaluations.map((ev, j) => (
              <span key={j} className={`tag ${STATUS_CLS[ev.status]}`} style={{ fontSize: 11, whiteSpace: 'nowrap' }}>
                {ev.status} — {ev.reg}
              </span>
            ))}
          </div>
        );
      };

      return (
        <div>
          <Breadcrumb trail={['Results', 'Result Entry', 'ENV-2026-0412']} />
          <PageHeader
            title="Results Entry — Order ENV-2026-0412 (selected regulations: PP No. 22/2021 + WHO-DWG-4)"
            subtitle="2026-04-29 simplification: per-regulation status chips (PASS / FAIL / BORDERLINE — RegName) · dynamic reading groups for multi-reading tests · dropped threshold-source expanded detail."
          />
          <div className="oe-page">
            <div className="existing-region">
              <div className="tile">
                <h5>Existing Results Entry chrome — env compliance evaluation surfaces inline</h5>
                <p className="helper">Per-row chips show one chip per applicable regulation. PASS=green · BORDERLINE=yellow · FAIL=red · INFO=warm-gray (no threshold).</p>
              </div>
            </div>

            <div className="existing-region">
              <div className="tile" style={{ marginBottom: 0 }}>
                <table>
                  <thead>
                    <tr>
                      <th>Accession</th>
                      <th>Test / Component</th>
                      <th>Result</th>
                      <th className="new-col">Status — per regulation</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {resultTests.map(rt => (
                      <React.Fragment key={rt.id}>
                        {/* Test header row */}
                        <tr style={{ background: '#f4f4f4' }}>
                          <td><code>{rt.accession}</code></td>
                          <td colSpan="3" style={{ fontWeight: 600 }}>
                            {rt.test}
                            {rt.components.length > 1 && (
                              <span style={{ fontSize: 11, color: '#525252', fontWeight: 400, marginLeft: 8 }}>
                                · multi-component ({rt.components.length}) · {rt.readingGroups.length} reading{rt.readingGroups.length === 1 ? '' : 's'}
                              </span>
                            )}
                          </td>
                          <td style={{ textAlign: 'right' }}>
                            {rt.allowsMultipleReadings && (
                              <button className="btn btn-ghost" style={{ fontSize: 12 }} onClick={() => addReading(rt.id)}>
                                + Add reading
                              </button>
                            )}
                          </td>
                        </tr>
                        {/* Reading groups */}
                        {rt.readingGroups.map((rg, rgIdx) => (
                          <React.Fragment key={rg.id}>
                            {rg.label && (
                              <tr style={{ background: '#fff8e1' }}>
                                <td></td>
                                <td colSpan="3" style={{ fontSize: 12, fontWeight: 600, color: '#491d8b' }}>
                                  ↳ {rg.label}
                                </td>
                                <td style={{ textAlign: 'right' }}>
                                  {rt.readingGroups.length > 1 && (
                                    <button className="btn btn-ghost" style={{ fontSize: 11, color: '#a2191f' }}
                                            onClick={() => removeReading(rt.id, rg.id)}>
                                      ✕ Remove
                                    </button>
                                  )}
                                </td>
                              </tr>
                            )}
                            {rg.results.map((r, ri) => (
                              <tr key={`${rg.id}-${ri}`}>
                                <td></td>
                                <td>
                                  {r.component ? (
                                    <span style={{ paddingLeft: rg.label ? 16 : 0 }}>
                                      <span className="tag" style={{ background:'#bae6ff', color:'#003a6d' }}>{r.component}</span>
                                    </span>
                                  ) : <span style={{ color: '#525252', fontStyle: 'italic', fontSize: 12 }}>(single value)</span>}
                                </td>
                                <td>
                                  {r.value
                                    ? <span><strong>{r.value}</strong> <span style={{ color: '#525252', fontSize: 12 }}>{rt.unit !== 'mixed' ? rt.unit : ''}</span></span>
                                    : <span className="helper" style={{ fontStyle: 'italic' }}>— pending</span>}
                                </td>
                                <td>{renderEvaluationChips(r.evaluations)}</td>
                                <td></td>
                              </tr>
                            ))}
                          </React.Fragment>
                        ))}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="info-tile">
              <h5>2026-04-29 simplifications demonstrated above</h5>
              <ul>
                <li>✅ Per-regulation status chip — single chip per reg per result row, format <code>STATUS — RegName</code></li>
                <li>✅ Color rule: PASS green · BORDERLINE yellow · FAIL red · INFO warm-gray (informational, no threshold)</li>
                <li>✅ Reading groups stay (with header label) but are now dynamic — click <strong>+ Add reading</strong> on the multi-reading test header to append a new reading group with empty values</li>
                <li>✅ Dropped: threshold-source list in expanded detail · combined-status rollup chip · fancy multi-row threshold preview</li>
                <li>📋 Borderline trigger TBD per env evaluation policy — placeholder shown for Total Coliform (4900 of 5000 PP No. 22/2021 limit)</li>
                <li>📋 Categorical observations still in S-05a (OGC-639) — separate ticket</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [scene, setScene] = useState(0);
      const scenes = [
        { label: '1 — Reference Range Admin (new filter + form field)', cmp: <Scene1_RangeAdmin /> },
        { label: '2 — Results Entry (expanded detail with threshold source)', cmp: <Scene2_ResultsEntry /> },
      ];
      return (
        <div className="oe-shell">
          <Topbar />
          <div className="scenes">
            {scenes.map((s, i) => (
              <div key={i} className={`scene ${scene === i ? 'active' : ''}`} onClick={() => setScene(i)}>{s.label}</div>
            ))}
          </div>
          {scenes[scene].cmp}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
