<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-01 Vector Specimen Types & Taxonomy — OpenELIS Preview</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .oe-header { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 1rem; border-bottom: 1px solid #393939; position: sticky; top: 0; z-index: 10; }
    .oe-header-title { font-size: 14px; font-weight: 600; }
    .oe-header-sep { width: 1px; height: 24px; background: #393939; margin: 0 1rem; }
    .oe-header-context { font-size: 14px; color: #c6c6c6; }
    .oe-header-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; font-size: 12px; color: #c6c6c6; }
    .oe-user-chip { display: flex; align-items: center; gap: 8px; }
    .oe-avatar { width: 28px; height: 28px; border-radius: 50%; background: #0f62fe; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; }
    .oe-layout { display: flex; min-height: calc(100vh - 48px - 28px); }

    .oe-sidenav-header { font-size: 11px; letter-spacing: 0.4px; color: #8d8d8d; padding: 12px 1rem 8px; text-transform: uppercase; }
    .oe-sidenav-item { display: flex; align-items: center; gap: 12px; padding: 10px 1rem; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; color: #f4f4f4; }
    .oe-sidenav-item:hover { background: #353535; }
    .oe-sidenav-item.active { background: #393939; border-left-color: #0f62fe; color: #fff; font-weight: 600; }
    .oe-sidenav-item .chev { margin-left: auto; font-size: 11px; }
    .oe-sidenav-badge { display: inline-block; background: #da1e28; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 8px; margin-left: auto; }
    .oe-sidenav-submenu { background: #1e1e1e; }
    .oe-sidenav-submenu .oe-sidenav-item { padding-left: 3.25rem; font-size: 13px; color: #c6c6c6; }
    .oe-sidenav-submenu .oe-sidenav-item.active { background: #393939; color: #fff; border-left-color: #0f62fe; }
    .oe-main { flex: 1; background: #f4f4f4; padding: 1.5rem 2rem; overflow-x: auto; }
    .oe-breadcrumb { font-size: 12px; color: #525252; margin-bottom: 8px; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-page-title { font-size: 24px; font-weight: 400; color: #161616; margin: 0 0 4px; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin-bottom: 1.25rem; max-width: 900px; }
    .oe-toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; background: #fff; padding: 0.75rem 1rem; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
    .oe-toolbar-search { flex: 1; max-width: 320px; display: flex; align-items: center; background: #f4f4f4; padding: 0 12px; border-bottom: 1px solid #8d8d8d; }
    .oe-toolbar-search input { border: 0; background: transparent; padding: 8px 0; flex: 1; font-size: 14px; outline: none; }
    .oe-filter-chip { padding: 4px 10px; font-size: 12px; border: 1px solid #c6c6c6; border-radius: 12px; background: #fff; cursor: pointer; }
    .oe-filter-chip.active { background: #0f62fe; color: #fff; border-color: #0f62fe; }
    .oe-table-wrap { background: #fff; border: 1px solid #e0e0e0; }
    table.oe-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.oe-table thead th { background: #e0e0e0; text-align: left; padding: 10px 1rem; font-size: 12px; font-weight: 600; letter-spacing: 0.16px; color: #161616; border-bottom: 1px solid #c6c6c6; }
    table.oe-table tbody td { padding: 12px 1rem; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    table.oe-table tbody tr:hover { background: #f4f4f4; }
    table.oe-table tbody tr.expanded { background: #edf5ff; }
    table.oe-table tbody tr.new-row { background: #defbe6; }
    .oe-row-expand { background: #f4f4f4; padding: 1rem 1.5rem; }
    .cds--tag { margin: 0 4px 0 0; }
    .oe-accordion-panel { background: #fff; border: 1px solid #e0e0e0; margin-top: 1rem; }
    .oe-accordion-header { padding: 12px 1rem; cursor: pointer; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #161616; background: #f4f4f4; border-bottom: 1px solid #e0e0e0; }
    .oe-accordion-body { padding: 1rem 1.5rem; background: #fff; }
    .oe-field { margin-bottom: 1rem; }
    .oe-field label { display: block; font-size: 12px; color: #525252; margin-bottom: 4px; }
    .oe-field input, .oe-field select, .oe-field textarea { width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid #8d8d8d; background: #f4f4f4; font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .oe-field input:disabled, .oe-field select:disabled { background: #e8e8e8; color: #8d8d8d; }
    .oe-field input:focus, .oe-field select:focus, .oe-field textarea:focus { outline: 2px solid #0f62fe; outline-offset: -2px; }
    .oe-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .oe-combo { position: relative; }
    .oe-combo input { width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid #8d8d8d; background: #f4f4f4; font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .oe-combo-menu { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.15); max-height: 260px; overflow-y: auto; z-index: 100; }
    .oe-combo-item { padding: 8px 12px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .oe-combo-item:hover { background: #e5e5e5; }
    .oe-combo-create { background: #edf5ff; border-top: 1px solid #d0e2ff; flex-direction: column; align-items: flex-start; gap: 2px; }
    .oe-swatch { width: 16px; height: 16px; border-radius: 2px; border: 1px solid #c6c6c6; display: inline-block; }
    .oe-swatch[data-carbon="red"] { background: #da1e28; }
    .oe-swatch[data-carbon="magenta"] { background: #d02670; }
    .oe-swatch[data-carbon="purple"] { background: #8a3ffc; }
    .oe-swatch[data-carbon="blue"] { background: #0f62fe; }
    .oe-swatch[data-carbon="cyan"] { background: #1192e8; }
    .oe-swatch[data-carbon="teal"] { background: #009d9a; }
    .oe-swatch[data-carbon="green"] { background: #24a148; }
    .oe-swatch[data-carbon="warm-gray"] { background: #8f8b8b; }
    .oe-swatch[data-carbon="gray"] { background: #8d8d8d; }
    .oe-swatch[data-carbon="cool-gray"] { background: #878d96; }
    .oe-swatch[data-carbon="high-contrast"] { background: #161616; }
    .oe-modal-backdrop { position: fixed; inset: 0; background: rgba(22,22,22,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .oe-modal { background: #fff; width: 560px; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
    .oe-modal-header { padding: 1rem 1.5rem 0.5rem; border-bottom: 1px solid #e0e0e0; }
    .oe-modal-label { font-size: 12px; color: #525252; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
    .oe-modal-header h3 { font-size: 20px; font-weight: 400; margin: 0 0 0.5rem; }
    .oe-modal-body { padding: 1rem 1.5rem; font-size: 14px; }
    .oe-modal-footer { padding: 0.5rem 1.5rem 1rem; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #e0e0e0; }
    .oe-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .oe-help { font-size: 11px; color: #525252; margin-top: 4px; }
    .oe-banner { background: #fff; border-left: 3px solid #0f62fe; padding: 12px 1rem; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; }
    .oe-banner-icon { font-size: 16px; color: #0f62fe; }
    .oe-banner-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .oe-banner-body { font-size: 13px; color: #393939; }

    /* Hub status banner (matches OGC-447 pattern) */
    .oe-hub { display: flex; align-items: center; gap: 1rem; background: #fff; border: 1px solid #e0e0e0; border-left: 4px solid #24a148; padding: 12px 1.25rem; margin-bottom: 1rem; }
    .oe-hub.unreachable { border-left-color: #da1e28; }
    .oe-hub-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .oe-hub-dot { width: 8px; height: 8px; border-radius: 50%; background: #24a148; }
    .oe-hub.unreachable .oe-hub-dot { background: #da1e28; }
    .oe-hub-meta { font-size: 12px; color: #525252; display: flex; align-items: center; gap: 1.25rem; }
    .oe-hub-meta strong { color: #161616; }
    .oe-hub-actions { margin-left: auto; display: flex; gap: 8px; }
    .oe-pending-pill { display: inline-block; background: #fff1f1; color: #750e13; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid #ffd7d9; }

    /* System-protected badge */
    .oe-lock { display: inline-block; background: #edf5ff; color: #002d9c; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

    .preview-footer { background: #161616; color: #8d8d8d; padding: 4px 1rem; font-size: 11px; font-family: monospace; }
  </style>

<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — V-01 Vector Specimen Types & Taxonomy &nbsp;|&nbsp; v1.2 · Groups CRUD + Catalog Subscription (OGC-447)
  </div>
  <div id="root"></div>
  <div class="preview-footer">OpenELIS Global · v3.x design preview · Not a live application</div>

  <script type="text/babel">
    const { useState } = React;

    // ─── System-protected default groups (codes immutable, label/color editable, cannot delete) ───
    const BUILTIN_COLORS = [
      { id: 'red', label: 'Red', builtin: true },
      { id: 'magenta', label: 'Magenta', builtin: true },
      { id: 'purple', label: 'Purple', builtin: true },
      { id: 'blue', label: 'Blue', builtin: true },
      { id: 'cyan', label: 'Cyan', builtin: true },
      { id: 'teal', label: 'Teal', builtin: true },
      { id: 'green', label: 'Green', builtin: true },
      { id: 'warm-gray', label: 'Warm gray', builtin: true },
      { id: 'gray', label: 'Gray', builtin: true },
      { id: 'cool-gray', label: 'Cool gray', builtin: true },
      { id: 'high-contrast', label: 'High contrast', builtin: true },
    ];
    const DEFAULT_NEW_HEX = '#8a3ffc';

    // Small typeahead + create-new ComboBox for tag colors. If the user types
    // a value that doesn't match any existing color, an inline "+ Create" item
    // appears; selecting it calls onCreate(typed).
    function ColorCombo({ colors, value, onPick, onCreate, id }) {
      const [text, setText] = useState('');
      const [open, setOpen] = useState(false);
      const current = colors.find(c => c.id === value);
      const query = (text || '').trim().toLowerCase();
      const matches = query ? colors.filter(c => c.label.toLowerCase().includes(query)) : colors;
      const exact = colors.find(c => c.label.toLowerCase() === query);
      return (
        <div className="oe-combo" style={{position:'relative'}}>
          <input
            id={id}
            value={open ? text : (current ? current.label : '')}
            placeholder="Pick or type a new color..."
            onFocus={() => { setOpen(true); setText(current ? current.label : ''); }}
            onBlur={() => setTimeout(() => setOpen(false), 150)}
            onChange={e => setText(e.target.value)}
          />
          {open && (
            <div className="oe-combo-menu">
              {matches.map(c => (
                <div key={c.id} className="oe-combo-item" onMouseDown={() => { onPick(c); setOpen(false); setText(''); }}>
                  <span className="oe-swatch" style={{backgroundColor: c.hex || undefined}} data-carbon={c.builtin ? c.id : ''}></span>
                  {c.label} {!c.builtin && <span style={{color:'#6f6f6f', fontSize:'11px', marginLeft:'4px'}}>(custom)</span>}
                </div>
              ))}
              {query && !exact && (
                <div className="oe-combo-item oe-combo-create" onMouseDown={() => { onCreate(text.trim()); setOpen(false); setText(''); }}>
                  <strong>+ Create "{text.trim()}"</strong>
                  <div style={{fontSize:'11px', color:'#6f6f6f'}}>New color — you'll confirm the hex next.</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const INITIAL_GROUPS = [
      { code: 'MOSQUITO', label: 'Mosquito', colorKind: 'green', description: 'Culicidae family; arbovirus and malaria vectors', system: true, active: true, speciesCount: 18, trapCount: 4, sampleTypeCount: 2 },
      { code: 'TICK', label: 'Tick', colorKind: 'blue', description: 'Ixodidae and Argasidae; tick-borne pathogens', system: true, active: true, speciesCount: 10, trapCount: 2, sampleTypeCount: 1 },
      { code: 'RODENT', label: 'Rodent', colorKind: 'purple', description: 'Rats, mice, bandicoots; zoonotic reservoirs', system: true, active: true, speciesCount: 7, trapCount: 2, sampleTypeCount: 1 },
      { code: 'OTHER_ARTHROPOD', label: 'Other arthropod', colorKind: 'warm-gray', description: 'Sandflies, midges, triatomines, etc.', system: true, active: true, speciesCount: 3, trapCount: 1, sampleTypeCount: 0 },
      { code: 'OTHER_ANIMAL', label: 'Other animal', colorKind: 'gray', description: 'Non-rodent zoonotic hosts (bats, birds, etc.)', system: true, active: true, speciesCount: 2, trapCount: 0, sampleTypeCount: 0 },
    ];

    const INITIAL_SPECIES = [
      { id: 'sp1', genus: 'Aedes', species: 'aegypti', subspecies: null, groupCode: 'MOSQUITO', pathogens: ['Dengue', 'Zika', 'Chikungunya'], stages: ['ADULT', 'LARVA', 'PUPA', 'EGG'], active: true },
      { id: 'sp2', genus: 'Aedes', species: 'albopictus', subspecies: null, groupCode: 'MOSQUITO', pathogens: ['Dengue', 'Chikungunya'], stages: ['ADULT', 'LARVA'], active: true },
      { id: 'sp3', genus: 'Anopheles', species: 'sundaicus', subspecies: null, groupCode: 'MOSQUITO', pathogens: ['Plasmodium falciparum'], stages: ['ADULT'], active: true },
      { id: 'sp4', genus: 'Culex', species: 'quinquefasciatus', subspecies: null, groupCode: 'MOSQUITO', pathogens: ['Wuchereria bancrofti'], stages: ['ADULT', 'LARVA'], active: true },
      { id: 'sp5', genus: 'Rhipicephalus', species: 'sanguineus', subspecies: null, groupCode: 'TICK', pathogens: ['Ehrlichia canis'], stages: ['ADULT', 'NYMPH'], active: true },
      { id: 'sp6', genus: 'Rattus', species: 'rattus', subspecies: 'diardii', groupCode: 'RODENT', pathogens: ['Leptospira'], stages: ['ADULT'], active: true },
      { id: 'sp7', genus: 'Rattus', species: 'norvegicus', subspecies: null, groupCode: 'RODENT', pathogens: ['Leptospira', 'Hantavirus'], stages: ['ADULT'], active: true },
    ];

    const INITIAL_TRAPS = [
      { id: 'tr1', name: 'BG-Sentinel Trap', targetCode: 'MOSQUITO', description: 'CO\u2082-baited adult mosquito trap; widely used for Aedes surveillance', active: true },
      { id: 'tr2', name: 'CDC Light Trap', targetCode: 'MOSQUITO', description: 'UV-light trap for nocturnal mosquitoes (Culex, Anopheles)', active: true },
      { id: 'tr3', name: 'Ovitrap', targetCode: 'MOSQUITO', description: 'Oviposition trap for Aedes egg collection', active: true },
      { id: 'tr4', name: 'Sherman Live Trap', targetCode: 'RODENT', description: 'Folding aluminum live trap for small rodents', active: true },
      { id: 'tr5', name: 'Drag Cloth', targetCode: 'TICK', description: 'White flannel cloth dragged through vegetation to collect questing ticks', active: true },
    ];

    // Pending updates from upstream hub (mirrors OGC-447 pattern)
    const PENDING_COUNT = 4;

    // Hub status
    const HUB = { name: 'OpenELIS Community Hub', url: 'https://hub.openelis.org/fhir', status: 'CONNECTED', catalogs: 12, subscribed: 3, lastSync: '2026-04-13 06:00 UTC', pending: PENDING_COUNT };

    const SAMPLE_TYPES = [
      { id: 'st1', name: 'Serum', domain: 'CLINICAL', desc: 'Venous blood serum' },
      { id: 'st2', name: 'Surface Water', domain: 'ENVIRONMENTAL', desc: 'Surface water for potability or pollution testing' },
      { id: 'st3', name: 'Mosquito Pool \u2014 Aedes', domain: 'VECTOR', desc: 'Pool of up to 50 adult Aedes mosquitoes for arbovirus screening', vectorProfile: { strategy: 'POOL_FIXED', defaultPoolSize: 50, preservation: 'RNAlater', groups: ['MOSQUITO'], stages: ['ADULT'] } },
      { id: 'st4', name: 'Mosquito Pool \u2014 Anopheles', domain: 'VECTOR', desc: 'Variable pool for malaria vector identification', vectorProfile: { strategy: 'POOL_VARIABLE', defaultPoolSize: null, preservation: 'Silica gel', groups: ['MOSQUITO'], stages: ['ADULT'] } },
      { id: 'st5', name: 'Individual Rodent Tissue', domain: 'VECTOR', desc: 'Single rodent kidney/spleen for Leptospira testing', vectorProfile: { strategy: 'INDIVIDUAL', defaultPoolSize: null, preservation: 'Frozen (-80\u00b0C)', groups: ['RODENT'], stages: ['ADULT'] } },
    ];

    const DOMAIN_TAG = { CLINICAL: 'blue', ENVIRONMENTAL: 'teal', BOTH: 'purple', VECTOR: 'green' };

    // ─── Hub status banner (shared across pages) ───
    function HubBanner() {
      const unreachable = HUB.status !== 'CONNECTED';
      return (
        <div className={'oe-hub' + (unreachable ? ' unreachable' : '')}>
          <div className="oe-hub-status">
            <span className="oe-hub-dot"></span>
            {unreachable ? 'Unreachable' : 'Connected'}
          </div>
          <div className="oe-hub-meta">
            <span><strong>{HUB.name}</strong></span>
            <span>{HUB.catalogs} catalogs &middot; <strong>{HUB.subscribed}</strong> subscribed</span>
            <span>Last sync: {HUB.lastSync}</span>
            {HUB.pending > 0 && (
              <span className="oe-pending-pill">{HUB.pending} pending updates to review</span>
            )}
          </div>
          <div className="oe-hub-actions">
            <button className="cds--btn cds--btn--ghost cds--btn--sm">Sync now</button>
            <button className="cds--btn cds--btn--tertiary cds--btn--sm">Manage subscriptions</button>
          </div>
        </div>
      );
    }

    // ─── Header ───
    function Header({ page }) {
      const crumbs = {
        groups: 'Admin \u203a Vector Surveillance \u203a Groups',
        species: 'Admin \u203a Vector Surveillance \u203a Species',
        traps: 'Admin \u203a Vector Surveillance \u203a Trap Types',
        pending: 'Admin \u203a Vector Surveillance \u203a Pending Updates',
        sampleTypes: 'Admin \u203a Sample Types',
      };
      return (
        <div className="oe-header">
          <div className="oe-header-title">OpenELIS Global</div>
          <div className="oe-header-sep"></div>
          <div className="oe-header-context">{crumbs[page]}</div>
          <div className="oe-header-right">
            <span>EN / ID</span>
            <div className="oe-user-chip">
              <div className="oe-avatar">CI</div>
              <span>Casey I. \u00b7 Lab Admin</span>
            </div>
          </div>
        </div>
      );
    }

    // ─── Side Nav ───
    function SideNav({ page, setPage }) {
      const [vectorOpen, setVectorOpen] = useState(true);
      return (
        <div className="oe-sidenav">
          <div className="oe-sidenav-header">Workflow</div>
          <div className="oe-sidenav-item">Dashboard</div>
          <div className="oe-sidenav-item">Order Entry</div>
          <div className="oe-sidenav-item">Results</div>
          <div className="oe-sidenav-item">Validation</div>
          <div className="oe-sidenav-item">Reports</div>

          <div className="oe-sidenav-header" style={{marginTop: '8px'}}>Admin</div>
          <div className={'oe-sidenav-item' + (page === 'sampleTypes' ? ' active' : '')} onClick={() => setPage('sampleTypes')}>Sample Types</div>
          <div className="oe-sidenav-item">Test Catalog</div>
          <div className="oe-sidenav-item">Compliance Standards</div>
          <div className="oe-sidenav-item">Sampling Sites</div>
          <div className="oe-sidenav-item">Analyzers</div>

          <div className="oe-sidenav-item" onClick={() => setVectorOpen(!vectorOpen)} style={{fontWeight: 600}}>
            Vector Surveillance
            <span className="chev">{vectorOpen ? '\u25be' : '\u25b8'}</span>
          </div>
          {vectorOpen && (
            <div className="oe-sidenav-submenu">
              <div className={'oe-sidenav-item' + (page === 'groups' ? ' active' : '')} onClick={() => setPage('groups')}>Groups</div>
              <div className={'oe-sidenav-item' + (page === 'species' ? ' active' : '')} onClick={() => setPage('species')}>Species</div>
              <div className={'oe-sidenav-item' + (page === 'traps' ? ' active' : '')} onClick={() => setPage('traps')}>Trap Types</div>
              <div className={'oe-sidenav-item' + (page === 'pending' ? ' active' : '')} onClick={() => setPage('pending')}>
                Pending Updates
                {PENDING_COUNT > 0 && <span className="oe-sidenav-badge">{PENDING_COUNT}</span>}
              </div>
            </div>
          )}

          <div className="oe-sidenav-item">Users &amp; Permissions</div>
          <div className="oe-sidenav-item">System Configuration</div>
        </div>
      );
    }

    // ─── Groups page (full CRUD; defaults are system-protected) ───
    function GroupsPage() {
      const [groups, setGroups] = useState(INITIAL_GROUPS);
      const [expanded, setExpanded] = useState(null);
      const [adding, setAdding] = useState(false);
      const [colors, setColors] = useState(BUILTIN_COLORS);
      const [newFormColor, setNewFormColor] = useState('teal');
      const [colorModal, setColorModal] = useState(null); // { target: 'new' | groupCode, proposedLabel, hex }

      function handleAdd() {
        setAdding(true);
        setExpanded(null);
      }
      function applyColor(target, colorId) {
        if (target === 'new') setNewFormColor(colorId);
        else setGroups(gs => gs.map(g => g.code === target ? { ...g, colorKind: colorId } : g));
      }
      function requestCreateColor(target, typed) {
        setColorModal({ target, proposedLabel: typed, hex: DEFAULT_NEW_HEX });
      }
      function confirmCreateColor() {
        const raw = (colorModal.proposedLabel || '').trim();
        if (!raw) return;
        const id = raw.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        if (!id) return;
        const exists = colors.find(c => c.id === id);
        if (!exists) setColors([...colors, { id, label: raw, builtin: false, hex: colorModal.hex }]);
        applyColor(colorModal.target, id);
        setColorModal(null);
      }
      function renderTag(g) {
        const c = colors.find(x => x.id === g.colorKind);
        if (c && c.builtin) return <span className={'cds--tag cds--tag--' + c.id}>{g.label}</span>;
        if (c && !c.builtin && c.hex) return <span className="cds--tag" style={{backgroundColor: c.hex, color: '#fff'}}>{g.label}</span>;
        return <span className="cds--tag cds--tag--gray">{g.label}</span>;
      }
      function saveNew(e) {
        const code = e.target.querySelector('[data-f="code"]').value.trim().toUpperCase().replace(/\s+/g, '_');
        const label = e.target.querySelector('[data-f="label"]').value.trim();
        const description = e.target.querySelector('[data-f="desc"]').value.trim();
        if (!code || !label) return;
        setGroups([...groups, { code, label, colorKind: newFormColor, description, system: false, active: true, speciesCount: 0, trapCount: 0, sampleTypeCount: 0 }]);
        setNewFormColor('teal');
        setAdding(false);
      }

      return (
        <>
          <div className="oe-breadcrumb"><a href="#">Admin</a> \u203a <a href="#">Vector Surveillance</a> \u203a Groups</div>
          <h1 className="oe-page-title">Organism Groups</h1>
          <div className="oe-page-subtitle">
            Top-level classifications for vector organisms. Groups are referenced by Species, Trap Types, and Vector Sample Type profiles. Defaults are system-protected (their codes cannot be changed or deleted), but you may freely rename, recolor, or add new groups (e.g., SANDFLY, SNAIL, BAT).
          </div>

          <HubBanner />

          <div className="oe-toolbar">
            <div className="oe-toolbar-search"><span>\ud83d\udd0d</span><input placeholder="Search by code or label..." /></div>
            <button className="cds--btn cds--btn--primary cds--btn--sm" style={{marginLeft: 'auto'}} onClick={handleAdd}>+ Add group</button>
          </div>

          <div className="oe-table-wrap">
            <table className="oe-table">
              <thead>
                <tr>
                  <th style={{width: '40px'}}></th>
                  <th>Code</th><th>Label</th><th>Color tag</th><th>Description</th><th>Used by</th><th>Status</th><th style={{width:'80px'}}></th>
                </tr>
              </thead>
              <tbody>
                {adding && (
                  <>
                    <tr className="new-row"><td>+</td><td colSpan="7"><strong>New group (unsaved)</strong></td></tr>
                    <tr className="new-row">
                      <td colSpan="8" className="oe-row-expand">
                        <form onSubmit={(e) => { e.preventDefault(); saveNew(e); }}>
                          <div className="oe-grid-3">
                            <div className="oe-field"><label>Code* (A-Z, underscores)</label><input data-f="code" placeholder="e.g., SANDFLY" required /></div>
                            <div className="oe-field"><label>Label*</label><input data-f="label" placeholder="e.g., Sandfly" required /></div>
                            <div className="oe-field">
                              <label>Color tag* <span style={{color:'#6f6f6f', fontWeight:400, fontSize:'11px'}}>(type to search or create)</span></label>
                              <ColorCombo
                                id="ng-color"
                                colors={colors}
                                value={newFormColor}
                                onPick={(c) => applyColor('new', c.id)}
                                onCreate={(typed) => requestCreateColor('new', typed)}
                              />
                            </div>
                          </div>
                          <div className="oe-field"><label>Description</label><textarea data-f="desc" rows="2"></textarea></div>
                          <div style={{marginTop: '1rem', display: 'flex', gap: '8px'}}>
                            <button type="submit" className="cds--btn cds--btn--primary cds--btn--sm">Save group</button>
                            <button type="button" className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setAdding(false)}>Cancel</button>
                          </div>
                        </form>
                      </td>
                    </tr>
                  </>
                )}
                {groups.map(g => (
                  <React.Fragment key={g.code}>
                    <tr className={expanded === g.code ? 'expanded' : ''} onClick={() => setExpanded(expanded === g.code ? null : g.code)} style={{cursor:'pointer'}}>
                      <td>{expanded === g.code ? '\u25be' : '\u25b8'}</td>
                      <td><code>{g.code}</code>{g.system && <span className="oe-lock" title="System-protected">SYSTEM</span>}</td>
                      <td>{renderTag(g)}</td>
                      <td style={{color:'#525252', fontSize:'12px'}}>{g.colorKind}</td>
                      <td style={{color:'#525252'}}>{g.description}</td>
                      <td style={{fontSize: '12px', color: '#525252'}}>
                        {g.speciesCount} species &middot; {g.trapCount} traps &middot; {g.sampleTypeCount} sample types
                      </td>
                      <td><span className={'cds--tag cds--tag--' + (g.active ? 'green' : 'gray')}>{g.active ? 'Active' : 'Inactive'}</span></td>
                      <td><button className="cds--btn cds--btn--ghost cds--btn--sm">Edit</button></td>
                    </tr>
                    {expanded === g.code && (
                      <tr>
                        <td colSpan="8" className="oe-row-expand">
                          {g.system && (
                            <div className="oe-banner" style={{marginBottom: '1rem', borderLeftColor: '#6929c4'}}>
                              <span className="oe-banner-icon" style={{color:'#6929c4'}}>\ud83d\udd12</span>
                              <div>
                                <div className="oe-banner-title">System-protected group</div>
                                <div className="oe-banner-body">The code <code>{g.code}</code> and deletion are locked because this group is referenced by core reports and seed data. You may still edit the label, color, and description.</div>
                              </div>
                            </div>
                          )}
                          <div className="oe-grid-3">
                            <div className="oe-field">
                              <label>Code* {g.system && <span style={{color:'#6929c4'}}>(locked)</span>}</label>
                              <input defaultValue={g.code} disabled={g.system} />
                            </div>
                            <div className="oe-field"><label>Label*</label><input defaultValue={g.label} /></div>
                            <div className="oe-field">
                              <label>Color tag* <span style={{color:'#6f6f6f', fontWeight:400, fontSize:'11px'}}>(type to search or create)</span></label>
                              <ColorCombo
                                id={'gc-' + g.code}
                                colors={colors}
                                value={g.colorKind}
                                onPick={(c) => applyColor(g.code, c.id)}
                                onCreate={(typed) => requestCreateColor(g.code, typed)}
                              />
                            </div>
                          </div>
                          <div className="oe-field"><label>Description</label><textarea defaultValue={g.description} rows="2"></textarea></div>
                          <div style={{marginTop: '1rem', display: 'flex', gap: '8px', alignItems: 'center'}}>
                            <button className="cds--btn cds--btn--primary cds--btn--sm">Save</button>
                            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setExpanded(null)}>Cancel</button>
                            {!g.system && (
                              <button className="cds--btn cds--btn--danger cds--btn--sm" style={{marginLeft: 'auto'}}
                                disabled={g.speciesCount + g.trapCount + g.sampleTypeCount > 0}
                                title={g.speciesCount + g.trapCount + g.sampleTypeCount > 0 ? 'Cannot delete: group is still referenced' : ''}
                              >Delete group</button>
                            )}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>

          {colorModal && (
            <div className="oe-modal-backdrop" onClick={() => setColorModal(null)}>
              <div className="oe-modal" onClick={e => e.stopPropagation()}>
                <div className="oe-modal-header">
                  <div className="oe-modal-label">Color palette</div>
                  <h3>Create new tag color</h3>
                </div>
                <div className="oe-modal-body">
                  <p style={{marginBottom:'1rem'}}>
                    <strong>"{colorModal.proposedLabel}"</strong> isn't an existing color. New colors become reusable everywhere tag colors are picked. Confirm the name and hex value, then create.
                  </p>
                  <div className="oe-grid-2">
                    <div className="oe-field">
                      <label>Color name *</label>
                      <input value={colorModal.proposedLabel}
                        onChange={e => setColorModal({ ...colorModal, proposedLabel: e.target.value })} />
                    </div>
                    <div className="oe-field">
                      <label>Hex value *</label>
                      <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
                        <input type="color" value={colorModal.hex}
                          onChange={e => setColorModal({ ...colorModal, hex: e.target.value })}
                          style={{width:'3rem', height:'2.5rem', padding:0, border:'1px solid #8d8d8d'}} />
                        <input value={colorModal.hex}
                          onChange={e => setColorModal({ ...colorModal, hex: e.target.value })} />
                      </div>
                    </div>
                  </div>
                  <div className="oe-field" style={{marginTop:'1rem'}}>
                    <label>Preview</label>
                    <span className="cds--tag" style={{backgroundColor: colorModal.hex, color:'#fff'}}>
                      {colorModal.proposedLabel || 'Preview'}
                    </span>
                  </div>
                </div>
                <div className="oe-modal-footer">
                  <button className="cds--btn cds--btn--ghost" onClick={() => setColorModal(null)}>Cancel</button>
                  <button className="cds--btn cds--btn--primary"
                    disabled={!colorModal.proposedLabel || !colorModal.proposedLabel.trim()}
                    onClick={confirmCreateColor}>Create and apply</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // ─── Species page (with working Add species) ───
    function SpeciesPage() {

      const groups = INITIAL_GROUPS;

      const filtered = groupFilter === 'ALL' ? species : species.filter(s => s.groupCode === groupFilter);

      function saveNew(e) {
        const genus = e.target.querySelector('[data-f="genus"]').value.trim();
        const speciesName = e.target.querySelector('[data-f="species"]').value.trim();
        const subspecies = e.target.querySelector('[data-f="sub"]').value.trim() || null;

        const newRec = {
          id: 'sp' + (species.length + 1),

        };
        setSpecies([newRec, ...species]);

                {filtered.map(s => (

                          </div>

                ))}
              </tbody>
            </table>
          </div>
        </>
      );
    }

                    <td style={{color:'#525252', fontSize:'12px'}}>{p.source}</td>
                    <td>
                      <button className="cds--btn cds--btn--ghost cds--btn--sm">Review diff</button>
                      <button className="cds--btn cds--btn--primary cds--btn--sm">Accept</button>
                      <button className="cds--btn cds--btn--danger cds--btn--sm">Reject</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:'1rem', fontSize:'12px', color:'#525252'}}>
            Bulk actions and per-field Accept/Reject diff follow the same UI contract as <a href="#">OGC-447 Catalog Subscription</a>.
          </div>
        </>
      );
    }

    // ─── Sample Types page (V-01 integration via Vector Profile accordion) ───
    function SampleTypesPage() {
      const [expanded, setExpanded] = useState('st3');
      const [domainFilter, setDomainFilter] = useState('ALL');
      const filtered = domainFilter === 'ALL' ? SAMPLE_TYPES : SAMPLE_TYPES.filter(s => s.domain === domainFilter);
      const domainTag = (d) => <span className={'cds--tag cds--tag--' + DOMAIN_TAG[d]}>{d}</span>;
      const groupByCode = Object.fromEntries(INITIAL_GROUPS.map(g => [g.code, g]));
      const STRATEGY = {
        INDIVIDUAL: 'Individual (1 organism per sample)',
        POOL_FIXED: 'Pool \u2014 fixed size', POOL_VARIABLE: 'Pool \u2014 variable size',
      };

      return (
        <>
          <div className="oe-breadcrumb"><a href="#">Admin</a> \u203a Sample Types</div>
          <h1 className="oe-page-title">Sample Types</h1>
          <div className="oe-page-subtitle">Vector sample types are edited here via the <strong>Vector Profile</strong> section that appears when domain = Vector.</div>

          <div className="oe-banner">
            <span className="oe-banner-icon">\u2139</span>
            <div>
              <div className="oe-banner-title">How V-01 integrates with Sample Type Management</div>
              <div className="oe-banner-body">
                V-01 extends the existing <em>Sample Type</em> entity by adding <code>VECTOR</code> to the <code>sampleDomain</code> enum introduced in S-04. When a sample type's domain is set to <strong>Vector</strong>, a <strong>Vector Profile</strong> accordion appears below Basic Info holding pooling strategy, preservation, and allowed organism groups. Groups, Species, and Trap Types remain separate admin pages because they are independent reference tables.
              </div>
            </div>
          </div>

          <div className="oe-toolbar">
            <div className="oe-toolbar-search"><span>\ud83d\udd0d</span><input placeholder="Search sample type name..." /></div>
            {['ALL','CLINICAL','ENVIRONMENTAL','VECTOR'].map(d => (
              <span key={d} className={'oe-filter-chip' + (domainFilter === d ? ' active' : '')} onClick={() => setDomainFilter(d)}>{d === 'ALL' ? 'All domains' : d}</span>
            ))}
            <button className="cds--btn cds--btn--primary cds--btn--sm" style={{marginLeft: 'auto'}}>+ Add sample type</button>
          </div>

          <div className="oe-table-wrap">
            <table className="oe-table">
              <thead><tr><th style={{width:'40px'}}></th><th>Sample type</th><th>Domain</th><th>Description</th><th style={{width:'80px'}}></th></tr></thead>
              <tbody>
                {filtered.map(s => (
                  <React.Fragment key={s.id}>
                    <tr className={expanded === s.id ? 'expanded' : ''} onClick={() => setExpanded(expanded === s.id ? null : s.id)} style={{cursor:'pointer'}}>
                      <td>{expanded === s.id ? '\u25be' : '\u25b8'}</td>
                      <td style={{fontWeight:600}}>{s.name}</td>
                      <td>{domainTag(s.domain)}</td>
                      <td style={{color:'#525252'}}>{s.desc}</td>
                      <td><button className="cds--btn cds--btn--ghost cds--btn--sm">Edit</button></td>
                    </tr>
                    {expanded === s.id && (
                      <tr>
                        <td colSpan="5" className="oe-row-expand">
                          <div className="oe-accordion-panel">
                            <div className="oe-accordion-header">Basic Info</div>
                            <div className="oe-accordion-body">
                              <div className="oe-grid-2">
                                <div className="oe-field"><label>Sample type name*</label><input defaultValue={s.name} /></div>
                                <div className="oe-field">
                                  <label>Domain* <span style={{color:'#0f62fe', fontSize:'11px'}}>(from S-04)</span></label>
                                  <select defaultValue={s.domain}>
                                    <option>CLINICAL</option><option>ENVIRONMENTAL</option><option>BOTH</option><option>VECTOR</option>
                                  </select>
                                  <div className="oe-help">Selecting <strong>VECTOR</strong> reveals the Vector Profile section.</div>
                                </div>
                              </div>
                              <div className="oe-field"><label>Description</label><textarea rows="2" defaultValue={s.desc}></textarea></div>
                            </div>
                          </div>
                          {s.domain === 'VECTOR' && s.vectorProfile && (
                            <div className="oe-accordion-panel" style={{borderColor:'#0f62fe', borderLeft:'3px solid #0f62fe'}}>
                              <div className="oe-accordion-header">
                                \ud83e\udd9f Vector Profile <span style={{marginLeft:'8px', fontSize:'11px', color:'#0f62fe', fontWeight:400}}>Added by V-01</span>
                              </div>
                              <div className="oe-accordion-body">
                                <div className="oe-grid-2">
                                  <div className="oe-field">
                                    <label>Pooling strategy*</label>
                                    <select defaultValue={s.vectorProfile.strategy}>
                                      <option value="INDIVIDUAL">{STRATEGY.INDIVIDUAL}</option>
                                      <option value="POOL_FIXED">{STRATEGY.POOL_FIXED}</option>
                                      <option value="POOL_VARIABLE">{STRATEGY.POOL_VARIABLE}</option>
                                    </select>
                                  </div>
                                  {s.vectorProfile.strategy === 'POOL_FIXED' && (
                                    <div className="oe-field">
                                      <label>Default pool size*</label>
                                      <input type="number" defaultValue={s.vectorProfile.defaultPoolSize} />
                                    </div>
                                  )}
                                </div>
                                <div className="oe-grid-2">
                                  <div className="oe-field"><label>Preservation method*</label><input defaultValue={s.vectorProfile.preservation} /></div>
                                  <div className="oe-field">
                                    <label>Allowed organism groups* <span style={{color:'#0f62fe', fontSize:'11px'}}>(multi-select, FK to Groups)</span></label>
                                    <select multiple defaultValue={s.vectorProfile.groups} style={{height:'80px'}}>
                                      {INITIAL_GROUPS.map(g => <option key={g.code} value={g.code}>{g.label}</option>)}
                                    </select>
                                  </div>
                                </div>
                                <div className="oe-field"><label>Allowed lifecycle stages</label><input defaultValue={s.vectorProfile.stages.join(', ')} /></div>
                              </div>
                            </div>
                          )}
                          <div style={{marginTop:'1rem', display:'flex', gap:'8px'}}>
                            <button className="cds--btn cds--btn--primary cds--btn--sm">Save</button>
                            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setExpanded(null)}>Cancel</button>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </>
      );
    }

    function App() {
      const [page, setPage] = useState('groups');
      return (
        <>
          <Header page={page} />
          <div className="oe-layout">
            <SideNav page={page} setPage={setPage} />
            <div className="oe-main">
              {page === 'groups' && <GroupsPage />}
              {page === 'species' && <SpeciesPage />}
              {page === 'traps' && <TrapTypesPage />}
              {page === 'pending' && <PendingUpdatesPage />}
              {page === 'sampleTypes' && <SampleTypesPage />}
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
