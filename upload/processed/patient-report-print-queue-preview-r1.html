<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Report Print Queue — OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .preview-content { padding: 1rem 2rem 4rem; max-width: 1440px; margin: 0 auto; }
    .pq-filterbar { background:#fff; border:1px solid #e0e0e0; padding:1rem; display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-end; margin-bottom:0; }
    .pq-field { display:flex; flex-direction:column; gap:4px; }
    .pq-field label { font-size:12px; color:#525252; }
    .pq-field select { padding:7px 10px; border:none; border-bottom:1px solid #8d8d8d; background:#f4f4f4; font-size:14px; min-width:160px; }
    .pq-field select:disabled { color:#c6c6c6; }
    table.cds--data-table td { vertical-align: middle; }
    .pq-acc { font-family: 'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:#0f62fe; }
    .pq-tags { display:flex; gap:4px; flex-wrap:wrap; }
    .pq-toolbar { display:flex; align-items:center; justify-content:space-between; padding:0 1rem; min-height:48px; border:1px solid #e0e0e0; border-bottom:none; }
    .pq-toolbar.batch { background:#0f62fe; }
    .pq-toolbar.batch * { color:#fff; }
    .pq-pag { display:flex; align-items:center; justify-content:space-between; padding:10px 1rem; border:1px solid #e0e0e0; border-top:none; font-size:13px; background:#fff; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — Patient Report Print Queue (r1) &nbsp;|&nbsp; Route: /PatientReportPrintQueue &nbsp;|&nbsp; SideNav: Reports → Patient Report Print Queue &nbsp;|&nbsp; Not a live application
  </div>
  <div class="preview-content" id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const BATCH_LIMIT = 50;

    const FACILITIES = ['Hôpital Central Antananarivo','Clinique Urbaine Nord','Centre de Santé de Base Analamanga'];
    const WARDS = {
      'Hôpital Central Antananarivo': ['Médecine Interne','Pédiatrie','Maternité','Réanimation'],
      'Clinique Urbaine Nord': ['Urgences','Chirurgie','Consultation'],
      'Centre de Santé de Base Analamanga': ['Consultation Générale','Maternité'],
    };
    const REQUESTORS = ['Dr. Rabe','Dr. Rasoa','Dr. Randria','Dr. Rakoto'];

    const INITIAL = [
      { id:'1', acc:'LAB-2026-00891', patient:'Rakoto, Jean', facility:'Hôpital Central Antananarivo', ward:'Médecine Interne', requestor:'Dr. Rabe', validatedAt:'2026-03-18 08:42', status:'UNPRINTED', amended:false, critical:true },
      { id:'2', acc:'LAB-2026-00874', patient:'Andriantsoa, Marie', facility:'Hôpital Central Antananarivo', ward:'Pédiatrie', requestor:'Dr. Rasoa', validatedAt:'2026-03-18 07:15', status:'UNPRINTED', amended:true, critical:false },
      { id:'3', acc:'LAB-2026-00865', patient:'Razafy, Pierre', facility:'Clinique Urbaine Nord', ward:'Urgences', requestor:'Dr. Randria', validatedAt:'2026-03-17 14:30', status:'PRINTED', amended:false, critical:false },
      { id:'4', acc:'LAB-2026-00901', patient:'Rakotondrabe, Luc', facility:'Clinique Urbaine Nord', ward:'Chirurgie', requestor:'Dr. Rabe', validatedAt:'2026-03-18 09:05', status:'UNPRINTED', amended:false, critical:false },
      { id:'5', acc:'LAB-2026-00855', patient:'Raharinoro, Sylvie', facility:'Centre de Santé de Base Analamanga', ward:'Maternité', requestor:'Dr. Rakoto', validatedAt:'2026-03-16 08:55', status:'UNPRINTED', amended:false, critical:false },
    ];

    function StatusTags({ row }) {
      return (
        <div className="pq-tags">
          <span className={"cds--tag cds--tag--sm " + (row.status === 'UNPRINTED' ? 'cds--tag--purple' : 'cds--tag--green')}>
            <span className="cds--tag__label">{row.status === 'UNPRINTED' ? 'Unprinted' : 'Printed'}</span>
          </span>
          {row.amended && <span className="cds--tag cds--tag--sm cds--tag--blue"><span className="cds--tag__label">Amended</span></span>}
          {row.critical && <span className="cds--tag cds--tag--sm cds--tag--red"><span className="cds--tag__label">Critical Value</span></span>}
        </div>
      );
    }

    function App() {
      const [facility, setFacility] = useState('');
      const [ward, setWard] = useState('');
      const [requestor, setRequestor] = useState('');
      const [status, setStatus] = useState('ALL');
      const [timeWindow, setTimeWindow] = useState('7');
      const [selected, setSelected] = useState(new Set());
      const [queue, setQueue] = useState(INITIAL);
      const [notif, setNotif] = useState(null);

      const wards = facility ? (WARDS[facility] || []) : [];

      const filtered = useMemo(() => queue.filter(r => {
        if (facility && r.facility !== facility) return false;
        if (ward && r.ward !== ward) return false;
        if (requestor && r.requestor !== requestor) return false;
        if (status === 'UNPRINTED' && r.status !== 'UNPRINTED') return false;
        if (status === 'PRINTED' && r.status !== 'PRINTED') return false;
        return true;
      }), [queue, facility, ward, requestor, status]);

      const allChecked = filtered.length > 0 && filtered.every(r => selected.has(r.id));
      const overLimit = selected.size > BATCH_LIMIT;
      const batch = selected.size > 0;

      const toggleAll = () => {
        const next = new Set(selected);
        if (allChecked) filtered.forEach(r => next.delete(r.id));
        else filtered.forEach(r => next.add(r.id));
        setSelected(next);
      };
      const toggleOne = (id) => {
        const next = new Set(selected);
        next.has(id) ? next.delete(id) : next.add(id);
        setSelected(next);
      };
      const clearFilters = () => { setFacility(''); setWard(''); setRequestor(''); setStatus('ALL'); };

      // Single = one PDF/tab; batch = ONE combined PDF in a single tab (r1 change)
      const print = (ids) => {
        setQueue(prev => prev.map(r => ids.includes(r.id) ? { ...r, status:'PRINTED', amended:false } : r));
        setSelected(new Set());
        setNotif(`${ids.length} report(s) generated and marked as printed.` +
          (ids.length > 1 ? ' (combined into a single PDF)' : ''));
        setTimeout(() => setNotif(null), 5000);
      };

      return (
        <div>
          {/* Breadcrumb */}
          <div className="cds--breadcrumb" style={{ marginBottom: '0.5rem', fontSize: 12 }}>
            <span style={{ color:'#0f62fe' }}>Reports</span>
            <span style={{ margin:'0 8px', color:'#525252' }}>/</span>
            <span style={{ color:'#525252' }}>Patient Report Print Queue</span>
          </div>

          <h3 style={{ fontWeight: 400, margin: '0 0 1rem' }}>Patient Report Print Queue</h3>

          {notif && (
            <div className="cds--inline-notification cds--inline-notification--success cds--inline-notification--low-contrast" style={{ maxWidth:'100%', marginBottom:'1rem' }}>
              <div className="cds--inline-notification__details">
                <p className="cds--inline-notification__title" style={{ margin:0 }}>{notif}</p>
              </div>
            </div>
          )}

          {/* Filter bar */}
          <div className="pq-filterbar">
            <div className="pq-field">
              <label>Facility</label>
              <select value={facility} onChange={e => { setFacility(e.target.value); setWard(''); }}>
                <option value="">All Facilities</option>
                {FACILITIES.map(f => <option key={f}>{f}</option>)}
              </select>
            </div>
            <div className="pq-field">
              <label style={{ color: facility ? '#525252' : '#c6c6c6' }}>Ward / Dept / Unit</label>
              <select value={ward} onChange={e => setWard(e.target.value)} disabled={!facility}>
                <option value="">All Wards</option>
                {wards.map(w => <option key={w}>{w}</option>)}
              </select>
            </div>
            <div className="pq-field">
              <label>Requestor</label>
              <select value={requestor} onChange={e => setRequestor(e.target.value)}>
                <option value="">All Requestors</option>
                {REQUESTORS.map(r => <option key={r}>{r}</option>)}
              </select>
            </div>
            <div className="pq-field">
              <label>Print Status</label>
              <select value={status} onChange={e => setStatus(e.target.value)}>
                <option value="ALL">All</option>
                <option value="UNPRINTED">Unprinted</option>
                <option value="PRINTED">Printed</option>
              </select>
            </div>
            <div className="pq-field">
              <label>Time Window</label>
              <select value={timeWindow} onChange={e => setTimeWindow(e.target.value)}>
                <option value="1">Last 24 Hours</option>
                <option value="7">Last 7 Days</option>
                <option value="30">Last 30 Days</option>
                <option value="-1">All Time</option>
              </select>
            </div>
            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={clearFilters}>Clear Filters</button>
          </div>

          {/* Toolbar */}
          <div className={"pq-toolbar" + (batch ? " batch" : "")}>
            {batch ? (
              <React.Fragment>
                <div style={{ display:'flex', alignItems:'center', gap:16 }}>
                  <span style={{ fontSize:14 }}>{selected.size} item{selected.size>1?'s':''} selected</span>
                  <button className="cds--btn cds--btn--sm" disabled={overLimit}
                    title={overLimit ? 'Batch print is limited to 50 accessions. Please reduce your selection.' : ''}
                    style={{ background:'#fff', color:'#0f62fe', opacity: overLimit ? 0.5 : 1, border:'none', padding:'6px 14px', cursor: overLimit ? 'not-allowed':'pointer' }}
                    onClick={() => !overLimit && print([...selected])}>
                    Print Selected ({selected.size}) → combined PDF
                  </button>
                </div>
                <button onClick={() => setSelected(new Set())} style={{ background:'transparent', border:'none', cursor:'pointer', fontSize:13 }}>Cancel</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
                  <strong style={{ fontSize:14 }}>Print Queue</strong>
                  <span style={{ color:'#525252', fontSize:12 }}>({filtered.length} {filtered.length===1?'result':'results'})</span>
                </div>
                <button className="cds--btn cds--btn--ghost cds--btn--sm">Search Patient / Accession</button>
              </React.Fragment>
            )}
          </div>

          {/* Table */}
          <div className="cds--data-table-container" style={{ paddingTop: 0 }}>
            <table className="cds--data-table cds--data-table--lg">
              <thead>
                <tr>
                  <th style={{ width: 40 }}><input type="checkbox" checked={allChecked} onChange={toggleAll} /></th>
                  <th>Accession Number</th>
                  <th>Patient Name</th>
                  <th>Facility</th>
                  <th>Ward / Dept / Unit</th>
                  <th>Requestor</th>
                  <th>Validated At</th>
                  <th>Status</th>
                  <th style={{ width: 120 }}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr>
                    <td colSpan={9} style={{ textAlign:'center', padding:'3rem 1rem', color:'#525252' }}>
                      <div style={{ fontWeight:600, marginBottom:4 }}>No reports in queue</div>
                      <div style={{ fontSize:12 }}>All reports have been printed, or no results have been validated in the selected time window.</div>
                    </td>
                  </tr>
                )}
                {filtered.map(row => (
                  <tr key={row.id} style={{ background: selected.has(row.id) ? '#edf5ff' : undefined }}>
                    <td><input type="checkbox" checked={selected.has(row.id)} onChange={() => toggleOne(row.id)} /></td>
                    <td><span className="pq-acc">{row.acc}</span></td>
                    <td>{row.patient}</td>
                    <td style={{ color:'#525252', fontSize:13 }}>{row.facility}</td>
                    <td style={{ fontSize:13 }}>{row.ward}</td>
                    <td style={{ fontSize:13 }}>{row.requestor}</td>
                    <td style={{ fontSize:13, whiteSpace:'nowrap' }}>{row.validatedAt}</td>
                    <td><StatusTags row={row} /></td>
                    <td>
                      <button className="cds--btn cds--btn--primary cds--btn--sm" onClick={() => print([row.id])}>Print</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Pagination */}
          <div className="pq-pag">
            <div style={{ display:'flex', alignItems:'center', gap:8, color:'#525252' }}>
              <span>Items per page:</span>
              <select defaultValue="20" style={{ border:'none', borderBottom:'1px solid #8d8d8d', background:'#f4f4f4', padding:'4px 8px' }}>
                <option>10</option><option>20</option><option>50</option><option>100</option>
              </select>
            </div>
            <span style={{ color:'#525252' }}>1–{filtered.length} of {filtered.length}</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
