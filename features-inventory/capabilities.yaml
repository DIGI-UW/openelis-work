  # ── Core Lab Workflows ───────────────────────────────────
  - id: order-entry
    name: Order & sample entry
    area: Core Lab Workflows
    domain: [clinical, cross-cutting]
    maturity: production
    summary: Register patients, orders, and samples through a streamlined, decoupled workflow.
    enhancements:
      - Visual form builder for program-specific order entry (OGC-70, OGC-113)
      - Pre-analytical eligibility gate and required-by date (OGC-580, OGC-625)
      - Realignment to a unified three-workflow spec — clinical / environmental / vector (OGC-1066)
    since: v3.1
    jira: [OGC-356]
    gallery: {mockup: "https://digi-uw.github.io/openelis-work/#/sample-collection/sample-collection-redesign", frs: "https://github.com/DIGI-UW/openelis-work/blob/main/designs/sample-collection/sample-collection-redesign.md"}
    docs: {manual_page: "https://uwdigi.atlassian.net/wiki/spaces/oeg/pages/261423127", training_doc: null}
    website: {include: true, section: Clinical workflows}

  - id: results-entry
    name: Results entry
    area: Core Lab Workflows
    domain: [clinical, cross-cutting]
    maturity: production
    summary: One unified worklist to enter and review results — search by Lab Unit, date, or status, with inline editing, per-analysis save, and cross-domain (clinical/environmental/vector) rendering.
    enhancements:
      - Multi-component results — multiple result fields per analysis (OGC-1131)
      - Smart result suggestions based on test history
    since: v3.1
    jira: [OGC-811, OGC-1020, OGC-1170, OGC-1179]
