<style>
  body { background:#f4f4f4; margin:0; font-family:'IBM Plex Sans', sans-serif; }
  .preview-banner { background:#0f62fe; color:#fff; padding:6px 1rem; font-size:12px; font-family:monospace; }
  .shell { display:flex; min-height:calc(100vh - 30px); }
  .rail { width:240px; background:#fff; border-right:1px solid #e0e0e0; padding:1rem 0; flex-shrink:0; }
  .rail .grp { font-size:12px; color:#6f6f6f; padding:.5rem 1rem; }
  .rail .item { padding:.5rem 1rem .5rem 2rem; font-size:14px; cursor:pointer; color:#161616; }
  .rail .item.on { background:#e0e0e0; border-left:3px solid #0f62fe; font-weight:600; }
  .rail .item.dim { color:#8d8d8d; cursor:default; }
  .main { flex:1; padding:1rem 2rem 4rem; min-width:0; }
  .blk { background:#fff; border:1px solid #e0e0e0; }
  .pad { padding:.75rem 1rem; }
  .row-flex { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
  .sub { color:#6f6f6f; font-size:12px; }

  .expand { background:#f4f4f4; padding:.75rem 1rem; font-size:13px; border-bottom:1px solid #e0e0e0; }
  .cds--tag { max-width:none; }
  .cds--tag__label { overflow:visible; text-overflow:clip; white-space:nowrap; }
  .field { margin-bottom:.75rem; }
  .field label { display:block; font-size:12px; color:#525252; margin-bottom:2px; }
  .toast { position:fixed; right:1.5rem; bottom:1.5rem; max-width:560px; z-index:50; }
  .reason { padding:6px 0; border-top:1px solid #f4f4f4; font-size:13px; }
  .over { color:#da1e28; font-weight:600; }
  .soon { color:#8e6a00; font-weight:600; }
  @media (max-width: 760px) { .shell { display:block; } .rail { width:auto; border-right:0; border-bottom:1px solid #e0e0e0; } .main { padding:1rem 16px 4rem; } }
</style>
</head>

    location:'Molecular lab', units:['Molecular'], usedFor:['HIV-1 viral load','HBV viral load'],
    status:'Out of service', reasons:[{ k:'progress', text:'Calibration in progress since 18 Oct 2026 (sent to Afrilab Calibration Services)', link:'event' },
      { k:'manual', text:'Taken out of service by K. Barasa on 18 Oct 2026: "Sent for calibration, use P-18"', link:null }],
    nextDue:'2026-10-20', nextDueWhat:'Calibration' },

    location:'Bacteriology', units:['Microbiology'], usedFor:['Blood culture','Urine culture'], status:'In service', reasons:[], nextDue:'2026-10-22', nextDueWhat:'Performance check' },
  { id:'S1', name:'Spectrophotometer SP-1', kind:'Spectrophotometer', make:'Hach DR6000', serial:'DR6-1773', asset:'ENV-0081', conn:'Not connected', connState:null,
    location:'Environmental lab', units:['Environmental'], usedFor:['Nitrate','Phosphate'], status:'In service', reasons:[], nextDue:'2026-10-25', nextDueWhat:'Verification' },
  { id:'H1', name:'HemoCue bench unit 1', kind:'Analyzer', make:'HemoCue Hb 301', serial:'HB301-5521', asset:'CPHL-0602', conn:'Not connected', connState:null,
    location:'Phlebotomy', units:['Hematology'], usedFor:['Hemoglobin'], status:'In service', reasons:[], nextDue:'2027-02-10', nextDueWhat:'Verification' },
  { id:'Z1', name:'AAS PerkinElmer (retired)', kind:'Analyzer', make:'PerkinElmer AAnalyst 400', serial:'AA4-3310', asset:'ENV-0050', conn:'Not connected', connState:null,
    location:'Store', units:['Environmental'], usedFor:['Lead (AAS)'], status:'In service', reasons:[], nextDue:null, nextDueWhat:null, inactive:true },

const EVENTS = [

  { id:3, inst:'A1', date:'2026-10-21', type:'Calibration', who:'A. Wanjiru', vendor:'', outcome:'Completed', due:'2026-12-02', cert:null, verified:'J. Kiptoo', notes:'Potassium ISE recalibrated after L2 failure at 08:12. Lock lifts only when a potassium control passes in a run.' },
  { id:4, inst:'A4', date:'2026-04-26', type:'Module calibration', who:'Cepheid field engineer', vendor:'Cepheid', outcome:'Completed', due:'2026-10-26', cert:{ no:'GX-CAL-55190', issuer:'Cepheid', file:'GX-CAL-55190.pdf' }, verified:'M. Kamau', notes:'All four modules calibrated.' },

  { id:6, inst:'B2', date:'2025-10-14', type:'Calibration', who:'', vendor:'Kenya Bureau of Standards', outcome:'Completed', due:'2026-10-14', cert:{ no:'C-4471', issuer:'Kenya Bureau of Standards', file:'C-4471.pdf' }, verified:'R. Maina', notes:'Expired. Vendor visit booked for 24 Oct.' },
  { id:7, inst:'I3', date:'2026-10-21', type:'Performance check', who:'S. Chebet', vendor:'', outcome:'Completed', due:'2026-10-22', cert:null, verified:null, notes:'35.2 °C on calibrated thermometer T-04.' },
  { id:8, inst:'S1', date:'2026-09-25', type:'Verification', who:'R. Maina', vendor:'', outcome:'Completed', due:'2026-10-25', cert:null, verified:'P. Omondi', notes:'Holmium oxide filter, all wavelengths within ± 1 nm.' },
  { id:9, inst:'A3', date:'2026-05-30', type:'Service', who:'Sysmex engineer', vendor:'Sysmex East Africa', outcome:'Completed', due:'2026-11-30', cert:null, verified:null, notes:'Six-monthly preventive maintenance. Downtime 3 h.' },
  { id:10, inst:'A2', date:'2026-07-15', type:'Calibration', who:'L. Omondi', vendor:'', outcome:'Completed', due:'2027-01-15', cert:null, verified:'A. Wanjiru', notes:'' },

];

const CHECKS = {
  B2:[ { type:'Calibration', due:'Certificate validity', oos:'Yes', verify:'Yes', state:'Overdue', next:'2026-10-14' },
       { type:'Performance check', due:'Every 1 day', oos:'No', verify:'No', state:'Due soon', next:'2026-10-22' } ],
  A1:[ { type:'Calibration', due:'Every 6 weeks', oos:'Yes', verify:'Yes', state:'Current', next:'2026-12-02' },
       { type:'Service', due:'Every 6 months', oos:'No', verify:'No', state:'Current', next:'2027-01-08' } ],
  P17:[ { type:'Calibration', due:'Certificate validity', oos:'Yes', verify:'Yes', state:'In progress', next:'2026-10-20' } ],
};

const instById = id => INSTRUMENTS.find(i => i.id === id);
const serviceKind = s => s === 'In service' ? 'green' : s === 'Restricted' ? 'warm-gray' : 'red';
const serviceIcon = s => s === 'In service' ? '● ' : s === 'Restricted' ? '▲ ' : '■ ';
const stateKind = s => s === 'Current' ? 'green' : s === 'Overdue' ? 'red' : 'warm-gray';
const outcomeKind = o => o === 'Completed' ? 'green' : o === 'Failed' ? 'red' : 'warm-gray';
const dueClass = d => !d ? '' : d < TODAY ? 'over' : d <= '2026-10-28' ? 'soon' : '';
const fmt = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return Number(dd) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m)-1] + ' ' + y; };

const Tag = ({ kind, children, onClick }) => (
  <span className={'cds--tag cds--tag--' + kind} onClick={onClick} style={onClick ? {cursor:'pointer'} : null}>
    <span className="cds--tag__label"><strong>{children}</strong></span>
  </span>);
const Btn = ({ kind='primary', onClick, disabled, children, title }) => (
  <button title={title} className={'cds--btn cds--btn--sm cds--btn--' + kind} onClick={onClick} disabled={disabled}>{children}</button>);
const Status = ({ s }) => <Tag kind={serviceKind(s)}>{serviceIcon(s)}{s}</Tag>;
const Field = ({ label, children }) => <div className="field"><label>{label}</label>{children}</div>;
const Input = props => <input className="cds--text-input" {...props} />;

function ReuseBoundary({ title, owner, adds, children }) {
  return (
    <div style={{border:'2px dashed #8d8d8d', padding:'.5rem', margin:'.25rem 0'}}>
      <div className="row-flex" style={{marginBottom:4}}>
        <Tag kind="purple">Existing component: reuse, do not re-implement</Tag>
        <span style={{fontSize:12}}><strong>{title}</strong></span><span className="sub">{owner}</span>
      </div>
      <div className="sub" style={{marginBottom:8}}>Drawn abbreviated. <strong>This FRS adds only:</strong> {adds}</div>
      {children}
    </div>);
}

/* ----------------------------------------------------- Instruments list */
function InstrumentsList({ go, say }) {
  const [conn, setConn] = useState('All');
  const [stat, setStat] = useState('All');
  const [kind, setKind] = useState('All');
  const [q, setQ] = useState('');
  const [showDeact, setShowDeact] = useState(false);
  const [adding, setAdding] = useState(false);
  const [used, setUsed] = useState(['Total suspended solids']);
  const kinds = Array.from(new Set(INSTRUMENTS.map(i => i.kind)));
  const list = INSTRUMENTS.filter(i => (showDeact || !i.inactive) && (conn === 'All' || i.conn === conn)
    && (stat === 'All' || i.status === stat) && (kind === 'All' || i.kind === kind)
    && (!q || (i.name + i.serial + i.asset).toLowerCase().indexOf(q.toLowerCase()) >= 0));
  const Sel = ({ label, value, set, opts }) => (
    <div className="field" style={{marginBottom:0}}><label>{label}</label>
      <select className="cds--select-input" value={value} onChange={e => set(e.target.value)}>{['All'].concat(opts).map(o => <option key={o}>{o}</option>)}</select></div>);
  return (
    <div>
      <div className="sub" style={{marginBottom:6}}>Home / Instruments</div>
      <h1 style={{fontWeight:400, fontSize:28, margin:'0 0 .25rem'}}>Instruments</h1>
      <p className="sub" style={{marginBottom:'1rem'}}>Every instrument the lab uses, connected or not. Service status is computed from required checks, failed controls and manual decisions; connection is shown separately.</p>
      <div className="row-flex" style={{alignItems:'flex-end', marginBottom:'.75rem'}}>
        <div className="field" style={{marginBottom:0}}><label>Search name, serial or asset tag</label><Input value={q} onChange={e => setQ(e.target.value)} placeholder="Search" style={{width:220}} /></div>
        <Sel label="Connection" value={conn} set={setConn} opts={['Connected','Not connected']} />
        <Sel label="Service status" value={stat} set={setStat} opts={['In service','Restricted','Out of service']} />
        <Sel label="Kind" value={kind} set={setKind} opts={kinds} />
        <label style={{fontSize:13}}><input type="checkbox" checked={showDeact} onChange={() => setShowDeact(v => !v)} /> Show deactivated</label>
        <span style={{flex:1}} />
        <Btn onClick={() => setAdding(true)}>Add instrument</Btn>
      </div>
      {adding && (
        <div className="blk pad" style={{marginBottom:'.75rem', background:'#f4f4f4'}}>
          <div className="row-flex" style={{marginBottom:'.5rem'}}>
            <strong>Add a not-connected instrument</strong>
            <span className="sub">For a connected analyzer, use <a href="#" onClick={e => e.preventDefault()}>Add connected analyzer</a> (today's flow, unchanged).</span>
          </div>
          <div className="row-flex" style={{alignItems:'flex-start', gap:'1rem'}}>
            <Field label="Name (required)"><Input defaultValue="Balance B-03" style={{width:200}} /></Field>
            <Field label="Kind (required)"><select className="cds--select-input" defaultValue="Analytical balance">{kinds.map(k => <option key={k}>{k}</option>)}<option>Other</option></select></Field>
            <Field label="Manufacturer and model"><Input defaultValue="Mettler Toledo XPR205" style={{width:220}} /></Field>
            <Field label="Serial number"><Input defaultValue="B-2290117" style={{width:140}} /></Field>
            <Field label="Asset tag"><Input defaultValue="ENV-0091" style={{width:110}} /></Field>
            <Field label="Location (room)"><Input defaultValue="Environmental lab, weighing room" style={{width:240}} /></Field>
            <Field label="Lab units"><div className="row-flex" style={{gap:4}}><Tag kind="blue">Environmental ✕</Tag></div></Field>
            <Field label="Used for (search tests)">
              <div className="row-flex" style={{gap:4}}>{used.map(t => <Tag key={t} kind="blue" onClick={() => setUsed(u => u.filter(x => x !== t))}>{t} ✕</Tag>)}
                <Input placeholder="Search tests" style={{width:150}} onKeyDown={e => { if (e.key === 'Enter' && e.target.value) { const v = e.target.value; setUsed(u => u.concat([v])); e.target.value = ''; } }} /></div></Field>
          </div>
          <div className="sub" style={{marginBottom:'.5rem'}}>Used for is what lets an out-of-service status or a test lock reach the right results. Add required checks on the Maintenance page after saving.</div>
          <div className="row-flex"><Btn onClick={() => { setAdding(false); say('Balance B-03 added as Not connected, In service. Add its required checks on the Maintenance page.'); }}>Save</Btn><Btn kind="ghost" onClick={() => setAdding(false)}>Cancel</Btn></div>
        </div>
      )}
      <div className="cds--data-table-container" style={{overflowX:'auto'}}>
        <table className="cds--data-table cds--data-table--sm">
          <thead><tr><th>Name</th><th>Connection</th><th>Service status</th><th>Next due</th><th>Location</th><th>Lab units</th><th></th></tr></thead>
          <tbody>{list.map(i => (
            <tr key={i.id} style={i.inactive ? {color:'#8d8d8d'} : null}>
              <td><a href="#" onClick={e => { e.preventDefault(); go('maint', i.id); }}><strong>{i.name}</strong></a><div className="sub">{i.kind} · {i.make}</div></td>
              <td>{i.conn === 'Connected' ? <span>Connected <span className="sub">({i.connState})</span></span> : <span className="sub">Not connected</span>}</td>
              <td>{i.inactive ? <Tag kind="gray">Deactivated</Tag> : <Status s={i.status} />}
                {i.status === 'Restricted' && <div className="sub">Potassium locked</div>}
                {i.status === 'Out of service' && <div className="sub">{i.reasons[0].text.split(' (')[0]}</div>}</td>
              <td>{i.nextDue ? <span className={dueClass(i.nextDue)}>{fmt(i.nextDue)}</span> : ''}<div className="sub">{i.nextDueWhat}</div></td>
              <td>{i.location}</td>
              <td>{i.units.join(', ')}</td>
              <td><Btn kind="ghost" onClick={() => go('maint', i.id)}>Edit</Btn></td>
            </tr>))}
          </tbody>
        </table>
      </div>
    </div>);
}

/* ----------------------------------------------------- Maintenance page */
function StatusPanel({ inst, say }) {
  const [manualOut, setManualOut] = useState(inst.reasons.some(r => r.k === 'manual'));
  const [noteOpen, setNoteOpen] = useState(false);
  const reasons = inst.reasons.filter(r => r.k !== 'manual' || manualOut);
  const status = reasons.length === 0 ? 'In service' : reasons.some(r => r.k !== 'locked') ? 'Out of service' : 'Restricted';
  const checks = CHECKS[inst.id] || [];
  const [rows, setRows] = useState(checks);
  const [addOpen, setAddOpen] = useState(false);
  return (
    <div style={{marginBottom:'1rem'}}>
      <div className="blk pad">
        <div className="row-flex">
          <strong style={{fontSize:16}}>{inst.name}</strong><span className="sub">{inst.kind} · {inst.make} · S/N {inst.serial} · {inst.location}</span>
          <span style={{flex:1}} />
          <Status s={status} />
          {inst.conn === 'Connected' && <Tag kind="outline">Connection: {inst.connState}</Tag>}
        </div>
        {reasons.length === 0
          ? <div className="reason sub">No reason stands. Results produced on this instrument are not held for instrument reasons.</div>
          : reasons.map((r, i) => (
            <div key={i} className="reason row-flex">
              <Tag kind={r.k === 'locked' ? 'warm-gray' : 'red'}>{r.k === 'locked' ? 'Test locked' : r.k === 'manual' ? 'Manual' : r.k === 'cert' ? 'Certificate' : 'In progress'}</Tag>
              <span>{r.text}</span>
              {r.link && r.link.indexOf('RUN') === 0 && <a href="#" onClick={e => { e.preventDefault(); say('Opens /Results?run=' + r.link + ' with the QC block in view.'); }}>Open run</a>}
            </div>))}
        {inst.status === 'Restricted' && <div className="sub" style={{marginTop:4}}>A lock cannot be released by hand. It lifts when a potassium control passes on this analyzer in a later run. Held results are dispositioned per result on their run (Retest, Reject, or Accept despite with an NCE).</div>}
        {noteOpen && (
          <div style={{marginTop:'.5rem'}}>
            <Field label="Why is it out of service? (required, kept as a note)"><textarea className="cds--text-area" rows={2} style={{width:'100%'}} defaultValue="Display drifting; awaiting vendor." /></Field>
            <div className="row-flex"><Btn kind="danger" onClick={() => { setManualOut(true); setNoteOpen(false); say(inst.name + ' taken out of service. Results produced on it are held from now on.'); }}>Take out of service</Btn><Btn kind="ghost" onClick={() => setNoteOpen(false)}>Cancel</Btn></div>
          </div>)}
        <div className="row-flex" style={{marginTop:'.5rem'}}>
          {!manualOut && !noteOpen && <Btn kind="danger--tertiary" onClick={() => setNoteOpen(true)}>Take out of service</Btn>}
          {manualOut && <Btn kind="tertiary" onClick={() => { setManualOut(false); const rest = inst.reasons.filter(r => r.k !== 'manual');
            say(rest.length ? 'Manual reason cleared. Still out of service: ' + rest[0].text.split(' (')[0] + '.' : inst.name + ' returned to service.'); }}>Return to service</Btn>}
          <Btn kind="ghost" onClick={() => say('Opens the instrument configuration (today’s /analyzers/{id} pages, or the not-connected form).')}>Edit instrument</Btn>
        </div>
      </div>
      <div className="blk pad" style={{borderTop:0}}>
        <div className="row-flex"><strong>Required checks</strong><span className="sub">What this instrument must have, and whether being overdue takes it out of service.</span><span style={{flex:1}} />
          <Btn kind="ghost" onClick={() => setAddOpen(true)}>Add check</Btn></div>
        <div className="cds--data-table-container" style={{marginTop:'.5rem', overflowX:'auto'}}>
          <table className="cds--data-table cds--data-table--sm">
            <thead><tr><th>Event type</th><th>Due by</th><th>Out of service when overdue</th><th>Verification required</th><th>Next due</th><th>State</th><th></th></tr></thead>
            <tbody>
              {addOpen && (
                <tr><td colSpan={7} style={{padding:0}}><div className="expand row-flex" style={{alignItems:'flex-end'}}>
                  <Field label="Event type"><select className="cds--select-input"><option>Verification</option><option>Calibration</option><option>Performance check</option><option>Service</option></select></Field>
                  <Field label="Due by"><select className="cds--select-input"><option>Interval</option><option>Certificate validity</option></select></Field>
                  <Field label="Every"><span><Input type="number" defaultValue="3" style={{width:70, display:'inline-block'}} /> <select className="cds--select-input" style={{display:'inline-block', width:100}}><option>months</option><option>days</option></select></span></Field>
                  <Field label="Out of service when overdue"><select className="cds--select-input"><option>No</option><option>Yes</option></select></Field>
                  <Field label="Verification required"><select className="cds--select-input"><option>No</option><option>Yes</option></select></Field>
                  <Field label="First due date (optional)"><Input type="date" defaultValue="2026-11-01" /></Field>
                  <Btn onClick={() => { setRows(r => r.concat([{ type:'Verification', due:'Every 3 months', oos:'No', verify:'No', state:'Current', next:'2026-11-01' }])); setAddOpen(false); }}>Save</Btn>
                  <Btn kind="ghost" onClick={() => setAddOpen(false)}>Cancel</Btn>
                </div></td></tr>)}
              {rows.length === 0 && !addOpen && <tr><td colSpan={7} className="sub">No required checks yet. Without checks this instrument is never taken out of service automatically; failed controls can still lock a test.</td></tr>}
              {rows.map((c, i) => (
                <tr key={i}><td>{c.type}</td><td>{c.due}</td><td>{c.oos}</td><td>{c.verify}</td>
                  <td><span className={dueClass(c.next)}>{fmt(c.next)}</span></td>
                  <td><Tag kind={stateKind(c.state)}>{c.state}</Tag></td>
                  <td><Btn kind="ghost">Edit</Btn></td></tr>))}
            </tbody>
          </table>
        </div>
      </div>
    </div>);
}

function LogForm({ inst, onSave, onCancel }) {
  const [type, setType] = useState('Calibration');
  const [outcome, setOutcome] = useState('Completed');
  const certBased = type === 'Calibration' && inst && (CHECKS[inst.id] || []).some(c => c.type === 'Calibration' && c.due === 'Certificate validity');
  const [certNo, setCertNo] = useState('');
  const [file, setFile] = useState('');
  const err = certBased && outcome === 'Completed' && !certNo;
  return (
    <tr><td colSpan={7} style={{padding:0}}><div className="expand">
      <div className="row-flex" style={{alignItems:'flex-start', gap:'1rem'}}>
        <Field label="Instrument"><Input defaultValue={inst ? inst.name : ''} placeholder="Search instruments" style={{width:200}} /></Field>
        <Field label="Event type"><select className="cds--select-input" value={type} onChange={e => setType(e.target.value)}>
          {['Calibration','Verification','Performance check','Service','Repair','Inspection','Cleaning'].map(o => <option key={o}>{o}</option>)}</select></Field>
        <Field label="Date performed"><Input type="date" defaultValue="2026-10-24" /></Field>
        <Field label="Performed by, or vendor"><Input defaultValue="Kenya Bureau of Standards" style={{width:220}} /></Field>
        <Field label="Outcome"><select className="cds--select-input" value={outcome} onChange={e => setOutcome(e.target.value)}>
          {['Completed','In progress','Failed','Needs follow-up'].map(o => <option key={o}>{o}</option>)}</select></Field>
        <Field label={certBased ? 'Valid until (required)' : 'Next due'}><Input type="date" defaultValue="2027-10-24" /></Field>
      </div>
      {certBased && (
        <div className="row-flex" style={{alignItems:'flex-start', gap:'1rem', background:'#fff', padding:'.5rem', border:'1px solid #e0e0e0', marginBottom:'.5rem'}}>
          <Field label="Certificate number (required)"><Input value={certNo} onChange={e => setCertNo(e.target.value)} placeholder="e.g. KEBS-MC-26-0988" style={{width:200}} />
            {err && <div style={{color:'#da1e28', fontSize:12}}>A certificate-based check needs a certificate number and a valid-until date.</div>}</Field>
          <Field label="Issued by"><Input defaultValue="Kenya Bureau of Standards" style={{width:220}} /></Field>
          <Field label="Certificate file (PDF, up to 10 MB)">
            <div className="row-flex">{file ? <Tag kind="blue">{file} ✕</Tag> : <Btn kind="tertiary" onClick={() => setFile('KEBS-MC-26-0988.pdf')}>Add file</Btn>}</div></Field>
          <div className="sub" style={{maxWidth:320}}>This satisfies the required check "Calibration" once a second person verifies it. Until then the check shows Awaiting verification and the instrument stays out of service.</div>
        </div>)}
      <div className="row-flex" style={{alignItems:'flex-start', gap:'1rem'}}>
        <Field label="Downtime (hours)"><Input type="number" defaultValue="1.5" style={{width:90}} /></Field>
        <Field label="Cost"><Input type="number" defaultValue="4800" style={{width:110}} /></Field>
        <Field label="Parts replaced"><Input style={{width:180}} /></Field>
        <Field label="Notes"><Input defaultValue="Annual calibration, 5 points, as found and as left within tolerance." style={{width:360}} /></Field>
        <Field label="Verified by"><Input placeholder="Search users (not the performer)" style={{width:220}} /></Field>
      </div>
      <div className="row-flex"><Btn disabled={err} onClick={() => onSave(type, certNo, file)}>Save event</Btn><Btn kind="ghost" onClick={onCancel}>Cancel</Btn></div>
    </div></td></tr>);
}

function Maintenance({ scope, setScope, say }) {
  const [logOpen, setLogOpen] = useState(false);
  const [open, setOpen] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const [onlyCert, setOnlyCert] = useState(false);
  const [events, setEvents] = useState(EVENTS);
  const one = scope.length === 1 ? instById(scope[0]) : null;
  const list = events.filter(e => (scope.length === 0 || scope.indexOf(e.inst) >= 0) && (showArchived || !e.archived) && (!onlyCert || e.cert))
    .sort((a, b) => b.date.localeCompare(a.date));
  const active = INSTRUMENTS.filter(i => !i.inactive);
  const scoped = scope.length ? active.filter(i => scope.indexOf(i.id) >= 0) : active;
  const overdue = scoped.filter(i => i.nextDue && i.nextDue < TODAY).length;
  const soon = scoped.filter(i => i.nextDue && i.nextDue >= TODAY && i.nextDue <= '2026-11-20').length;
  const oos = scoped.filter(i => i.status === 'Out of service').length;
  return (
    <div>
      <div className="sub" style={{marginBottom:6}}>Home / Instruments / Maintenance</div>
      <h1 style={{fontWeight:400, fontSize:28, margin:'0 0 1rem'}}>Maintenance</h1>
      <div className="row-flex" style={{alignItems:'flex-end', marginBottom:'.75rem'}}>
        <div className="field" style={{marginBottom:0}}><label>Filter by instrument</label>
          <div className="row-flex" style={{gap:4, background:'#f4f4f4', padding:'4px 8px', minWidth:320, borderBottom:'1px solid #8d8d8d'}}>
            {scope.length === 0 && <span className="sub">All instruments</span>}
            {scope.map(id => <Tag key={id} kind="blue" onClick={() => setScope(scope.filter(x => x !== id))}>{instById(id).name} ✕</Tag>)}
            <input className="cds--text-input" list="instlist" placeholder="Search instruments" style={{width:180, background:'transparent'}}
              onChange={e => { const m = active.find(i => i.name === e.target.value); if (m && scope.indexOf(m.id) < 0) { setScope(scope.concat([m.id])); e.target.value = ''; } }} />
            <datalist id="instlist">{active.filter(i => scope.indexOf(i.id) < 0).map(i => <option key={i.id} value={i.name} />)}</datalist>
          </div></div>
        <span style={{flex:1}} />
        <Btn onClick={() => setLogOpen(true)}>Log new event</Btn>
      </div>
      {one ? <StatusPanel key={one.id} inst={one} say={say} /> : (
        <div className="blk pad" style={{marginBottom:'1rem'}}>
          <span style={{fontSize:14}}>{list.length} events shown · <span className="over">{overdue} overdue</span> · <span className="soon">{soon} due in the next 30 days</span> · <span className="over">{oos} instruments out of service</span></span>
        </div>)}
      <div className="row-flex" style={{marginBottom:'.5rem'}}>
        <label style={{fontSize:13}}><input type="checkbox" checked={onlyCert} onChange={() => setOnlyCert(v => !v)} /> Has certificate</label>
        <label style={{fontSize:13}}><input type="checkbox" checked={showArchived} onChange={() => setShowArchived(v => !v)} /> Show archived</label>
        <span className="sub">Other toolbar filters (date range, type, outcome, vendor) as in v1.0.</span>
      </div>
      <div className="cds--data-table-container" style={{overflowX:'auto'}}>
        <table className="cds--data-table cds--data-table--sm">
          <thead><tr>{!one && <th>Instrument</th>}<th>Date</th><th>Type</th><th>Outcome</th><th>Certificate</th><th>Valid until / Next due</th><th></th></tr></thead>
          <tbody>
            {logOpen && <LogForm inst={one} onCancel={() => setLogOpen(false)} onSave={(type, certNo, file) => {
              setEvents(ev => [{ id:99, inst: one ? one.id : 'B2', date:'2026-10-24', type, who:'', vendor:'Kenya Bureau of Standards', outcome:'Completed', due:'2027-10-24',
                cert: certNo ? { no:certNo, issuer:'Kenya Bureau of Standards', file: file || 'certificate.pdf' } : null, verified:null, notes:'Awaiting verification' }].concat(ev));
              setLogOpen(false); say('Event saved. The Calibration check shows Awaiting verification until a second person verifies it; then the status recalculates.'); }} />}
            {list.map(e => (
              <React.Fragment key={e.id}>
                <tr style={e.archived ? {color:'#8d8d8d', background:'#f4f4f4'} : null}>
                  {!one && <td><strong>{instById(e.inst).name}</strong><div className="sub">{instById(e.inst).kind}</div></td>}
                  <td>{fmt(e.date)}</td>
                  <td>{e.type}</td>
                  <td><Tag kind={outcomeKind(e.outcome)}>{e.outcome}</Tag>{e.archived && <Tag kind="gray">Archived</Tag>}</td>
                  <td>{e.cert ? <span>{e.cert.no} <a href="#" onClick={ev => { ev.preventDefault(); say('Opens ' + e.cert.file + ' in the browser (attachment view endpoint, D-086).'); }} title="View PDF">PDF</a></span> : ''}</td>
                  <td><span className={e.outcome === 'Completed' ? dueClass(e.due) : ''}>{fmt(e.due)}</span></td>
                  <td><Btn kind="ghost" onClick={() => setOpen(open === e.id ? null : e.id)}>Edit</Btn></td>
                </tr>
                {open === e.id && (
                  <tr><td colSpan={7} style={{padding:0}}><div className="expand">
                    <div className="row-flex" style={{alignItems:'flex-start', gap:'2rem'}}>
                      <div><div className="sub">Performed by</div>{e.who || 'Vendor'}{e.vendor && <div className="sub">{e.vendor}</div>}</div>
                      {e.cert && <div><div className="sub">Certificate</div>{e.cert.no}, issued by {e.cert.issuer}<div className="sub">{e.cert.file} (view, download; locked once verified)</div></div>}
                      <div><div className="sub">Verified by</div>{e.verified || <span>Not verified <Btn kind="ghost" onClick={() => say('You cannot verify an event you performed or logged. Another user with verification rights can.')}>Verify</Btn></span>}</div>
                      <div style={{maxWidth:420}}><div className="sub">Notes</div>{e.notes}</div>
                    </div>
                    <div className="row-flex" style={{marginTop:'.5rem'}}>
                      <Btn kind="tertiary">Edit fields</Btn>
                      <Btn kind="ghost" onClick={() => say(e.archived ? 'Event unarchived.' : 'Archive this event? It is hidden from the default view and kept in the audit trail. If it satisfied a required check, the check becomes due again and the status recalculates.')}>{e.archived ? 'Unarchive' : 'Archive'}</Btn>
                    </div>
                  </div></td></tr>)}
              </React.Fragment>))}
          </tbody>
        </table>
      </div>
    </div>);
}

/* ----------------------------------------------------- consumer view (FR-F2) */
function ConsumerView() {
  const [pick, setPick] = useState('B2');
  const opts = ['B1','B2'];
  const inst = instById(pick);
  return (
    <div>
      <div className="sub" style={{marginBottom:6}}>Home / Workplan / Results</div>
      <h1 style={{fontWeight:400, fontSize:28, margin:'0 0 1rem'}}>Instrument field on a result (FR-F2, FR-F3)</h1>
      <ReuseBoundary title="Results Entry row panel, Method and Analyzer fields" owner="Owned by results-entry-multicomponent.md (OGC-811) and Results Entry v4 D4."
        adds="the service status Tag on each instrument in the search, the inline will-be-held warning, and the required-instrument rule when the test asks for it.">
        <div className="row-flex" style={{alignItems:'flex-start', gap:'1.5rem'}}>
          <div><div className="sub">Sample</div><strong>24-01340</strong> · Total suspended solids</div>
          <div><div className="sub">Method</div>Gravimetric (SM 2540 D)</div>
          <div className="field"><label>Instrument (required for this test)</label>
            <div className="cds--tile" style={{padding:'.5rem', minWidth:360}}>
              {opts.map(id => { const i = instById(id); return (
                <div key={id} className="row-flex" style={{padding:'4px 0', cursor:'pointer', background: pick === id ? '#e0e0e0' : 'transparent'}} onClick={() => setPick(id)}>
                  <input type="radio" checked={pick === id} readOnly /> <span>{i.name}</span><span className="sub">{i.make}</span><Status s={i.status} />
                </div>); })}
            </div></div>
          <div className="field"><label>Result</label><Input defaultValue="14" style={{width:100}} /> <span className="sub">mg/L</span></div>
        </div>
        {inst.status !== 'In service' && (
          <div className="cds--inline-notification cds--inline-notification--warning" style={{maxWidth:'none'}}>
            <div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper">
              <p className="cds--inline-notification__title">{inst.name} is out of service: this result will be held</p>
              <p className="cds--inline-notification__subtitle">{inst.reasons[0].text}. You can still save it; it waits on the run until a new certificate is logged, or a user accepts it despite the hold with an NCE. Choose Balance B-01 if you weighed on it.</p>
            </div></div>
          </div>)}
      </ReuseBoundary>
    </div>);
}

/* ---------------------------------------------------------------------- app */
function App() {
  const [view, setView] = useState('list');
  const [scope, setScope] = useState([]);
  const [toast, setToast] = useState(null);
  const say = m => { setToast(m); setTimeout(() => setToast(null), 6500); };
  const go = (v, id) => { setView(v); if (id) setScope([id]); };
  const Item = ({ v, children, dim }) => <div className={'item' + (view === v ? ' on' : '') + (dim ? ' dim' : '')} onClick={() => !dim && go(v)}>{children}</div>;
  return (
    <div className="shell">
      <nav className="rail">
        <div className="grp">Instruments (relabelled from Analyzers)</div>
        <Item v="list">Instruments</Item>
        <Item v="types" dim>Analyzer Types</Item>
        <Item v="issues" dim>Import Issues</Item>
        <Item v="maint">Maintenance</Item>
        <div className="grp" style={{marginTop:'1rem'}}>Preview only</div>
        <Item v="consumer">Instrument field on a result</Item>
        <div className="sub" style={{padding:'.75rem 1rem'}}>Analyzer Types and Import Issues are unchanged pages (D-069) and are not drawn here. Tip: open Balance B-02, Pipette P-17 or Donatello from the list to see each status.</div>
      </nav>
      <main className="main">
        {view === 'list' && <InstrumentsList go={go} say={say} />}
        {view === 'maint' && <Maintenance scope={scope} setScope={setScope} say={say} />}
        {view === 'consumer' && <ConsumerView />}
      </main>
      {toast && (
        <div className="toast"><div className="cds--inline-notification cds--inline-notification--success">
          <div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper">
            <p className="cds--inline-notification__title">Done</p><p className="cds--inline-notification__subtitle">{toast}</p>
          </div></div></div></div>)}
    </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
