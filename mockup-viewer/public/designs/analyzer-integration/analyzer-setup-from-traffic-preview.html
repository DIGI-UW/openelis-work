<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyzer Setup From a Real Result - OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1.60.0/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .shell { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 28px); }
    .scenes { background: #161616; color: #c6c6c6; padding: 1rem 0; }
    .scenes h4 { color: #8d8d8d; font-size: 12px; text-transform: uppercase; letter-spacing: .32px; padding: 0 1rem .5rem; margin: 0; }
    .scenes button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #c6c6c6; padding: .6rem 1rem; font: inherit; font-size: 14px; cursor: pointer; border-left: 3px solid transparent; }
    .scenes button.on { background: #262626; color: #fff; border-left-color: #0f62fe; }
    .scenes small { display: block; color: #8d8d8d; font-size: 12px; }
    .main { padding: 1rem 2rem 3rem; max-width: 1200px; }
    .crumb { font-size: 12px; color: #525252; margin-bottom: .25rem; }
    .route { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6f6f6f; }
    h1 { font-size: 28px; font-weight: 400; margin: .25rem 0 1rem; }
    h2 { font-size: 20px; font-weight: 400; margin: 0 0 .75rem; }
    h3 { font-size: 16px; font-weight: 600; margin: 0 0 .5rem; }
    .sec { background: #fff; border: 1px solid #e0e0e0; margin-bottom: 1rem; }
    .sec-head { display: flex; align-items: center; gap: .75rem; padding: 1rem; border-bottom: 1px solid #e0e0e0; }
    .sec-body { padding: 1rem; }
    .num { width: 24px; height: 24px; border-radius: 50%; background: #0f62fe; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .num.done { background: #24a148; }
    .num.todo { background: #c6c6c6; }
    .summary { color: #525252; font-size: 14px; flex: 1; }
    .kv { display: grid; grid-template-columns: 200px 1fr auto; gap: .5rem 1rem; align-items: center; font-size: 14px; }
    .kv code { font-family: 'IBM Plex Mono', monospace; background: #f4f4f4; padding: 4px 8px; font-size: 14px; }
    .muted { color: #6f6f6f; font-size: 13px; }
    .row { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 280px; }
    .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #0f62fe; margin-right: .5rem; animation: p 1.4s infinite; }
    @keyframes p { 0%{opacity:1} 50%{opacity:.25} 100%{opacity:1} }
    .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .raw { background: #262626; color: #f4f4f4; padding: .75rem; white-space: pre; overflow-x: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 12px; color: #525252; margin-bottom: .25rem; }
    .req { color: #da1e28; }
    .err { color: #da1e28; font-size: 12px; margin-top: .25rem; }
    .warnt { color: #8e6a00; font-size: 12px; margin-top: .25rem; }
    .cds--text-input.invalid { outline: 2px solid #da1e28; outline-offset: -2px; }
    .option { padding: .6rem .75rem; border-bottom: 1px solid #e0e0e0; cursor: pointer; font-size: 14px; }
    .option:hover, .option.sel { background: #e8f1ff; }
    .option .facts { font-size: 12px; color: #525252; margin-top: 2px; }
    .evid { background: #edf5ff; border-left: 3px solid #0f62fe; padding: .75rem 1rem; font-size: 14px; }
    .inherit td:first-child { width: 220px; }
    .seg { display: inline-flex; border: 1px solid #8d8d8d; }
    .seg button { background: #fff; border: 0; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .seg button.on { background: #393939; color: #fff; }
    .toggle { display: inline-flex; align-items: center; gap: .5rem; font-size: 13px; cursor: pointer; }
    .cds--data-table td, .cds--data-table th { vertical-align: top; }
    .actions { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
    .note { font-size: 13px; color: #525252; background: #f4f4f4; padding: .5rem .75rem; margin-top: .75rem; }
    .acc-head { display:flex; justify-content: space-between; padding: .75rem 1rem; cursor: pointer; border-top: 1px solid #e0e0e0; font-size: 14px; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: #e0e0e0; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">Visual Preview: Analyzer Setup From a Real Result | OpenELIS Design Mockup | Not a live application | Routes: /analyzers, /analyzers/types, /analyzers/{id}/mappings, /analyzers/errors, /Alerts</div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const Tag = ({ kind = 'gray', children }) => <span className={`cds--tag cds--tag--${kind}`}>{children}</span>;
    const Btn = ({ kind = 'primary', size, children, onClick, disabled }) => (
      <button className={`cds--btn cds--btn--${kind} ${size ? 'cds--btn--' + size : ''}`} onClick={onClick} disabled={disabled}>{children}</button>
    );
    const Note = ({ kind = 'info', title, children }) => (
      <div className={`cds--inline-notification cds--inline-notification--${kind} cds--inline-notification--low-contrast`} style={{ maxWidth: 'none', marginBottom: '1rem' }}>
        <div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper">
          {title && <div className="cds--inline-notification__title">{title}</div>}
          <div className="cds--inline-notification__subtitle">{children}</div>
        </div></div>
      </div>
    );
    const Crumb = ({ trail, route }) => (<div><div className="crumb">{trail}</div><div className="route">{route}</div></div>);

    // ---------- Data: BX-3010 test message QA-T2-0001 ----------
    const CAPTURE = [
      { code: 'GLU', value: '132', unit: 'mg/dL', range: '70 to 110', flag: 'H', readAs: 'number', status: 'mapped', test: 'Glucose (Plasma)' },
      { code: 'CREA', value: '1.17', unit: 'mg/dL', range: '0.6 to 1.3', flag: '', readAs: 'number', status: 'mapped', test: 'Creatinine' },
      { code: 'NA', value: '141', unit: 'mmol/L', range: '135 to 145', flag: '', readAs: 'number', status: 'new', test: null },
      { code: 'K', value: '4.2', unit: 'mmol/L', range: '3.5 to 5.0', flag: '', readAs: 'number', status: 'new', test: null },
      { code: 'UREA', value: '28', unit: 'mg/dL', range: '15 to 45', flag: '', readAs: 'number', status: 'new', test: null },
      { code: 'TRIG', value: '', unit: 'mg/dL', range: '', flag: '>', readAs: 'none', status: 'unreadable', test: 'Triglicerides' },
    ];
    const NOT_SEEN = [['AMY','Amylase'], ['CHOL','Total cholesterol'], ['HDL','HDL cholesterol'], ['ALT','Transaminases ALTL'], ['AST','Transaminases ASTL']];
    const RAW = `H|\\^&|||BX-T2^BX-3010^1.0|||||LIS||P|1\nP|1||PID-88213||Wibowo^Adi||19780412|M\nO|1|QA-T2-0001||^^^GLU\\^^^CREA\\^^^NA\\^^^K\\^^^UREA|R||||||N||||SERUM\nR|1|^^^GLU|132|mg/dL|70-110|H||F\nR|2|^^^CREA|1.17|mg/dL|0.6-1.3|||F\nR|3|^^^NA|141|mmol/L|135-145|||F\nR|4|^^^K|4.2|mmol/L|3.5-5.0|||F\nR|5|^^^UREA|28|mg/dL|15-45|||F\nR|6|^^^TRIG||mg/dL||>||F\nL|1|N`;

    const CATALOG = [
      { name: 'Sodium', code: 'Na-Serum', loinc: '2951-2', sample: 'Serum', unit: 'Biochemistry', uom: 'mmol/L', active: true },
      { name: 'Synaptophysin', code: 'IHC-SYN', loinc: '', sample: 'Tissue', unit: 'Pathology', uom: '', active: true },
      { name: 'DNA PCR', code: 'DNAPCR', loinc: '44871-2', sample: 'DBS', unit: 'Molecular Biology', uom: '', active: true },
      { name: 'Napsin A', code: 'IHC-NAPA', loinc: '', sample: 'Tissue', unit: 'Pathology', uom: '', active: true },
      { name: 'Natremia (legacy)', code: 'NATR', loinc: '2951-2', sample: 'Serum', unit: 'Biochemistry', uom: 'mEq/L', active: false },
      { name: 'Potassium', code: 'K-Serum', loinc: '2823-3', sample: 'Serum', unit: 'Biochemistry', uom: 'mmol/L', active: true },
      { name: 'Urea', code: 'Urea-Serum', loinc: '3091-6', sample: 'Serum', unit: 'Biochemistry', uom: 'mg/dL', active: true },
      { name: 'BUN', code: 'BUN-Serum', loinc: '3094-0', sample: 'Serum', unit: 'Biochemistry', uom: 'mg/dL', active: true },
      { name: 'Glucose (Plasma)', code: 'GLU-P', loinc: '2345-7', sample: 'Plasma', unit: 'Biochemistry', uom: 'mg/dL', active: true },
      { name: 'Glycémie', code: 'GLY', loinc: '2345-7', sample: 'Serum', unit: 'Biochemistry', uom: '', active: true },
    ];

    // ---------- Scene 1: setup ----------
    function Setup() {
      const [stage, setStage] = useState('waiting'); // waiting | received
      const [showRaw, setShowRaw] = useState(false);
      const [view, setView] = useState('reconcile');
      const [asServer, setAsServer] = useState(false);
      const [dup, setDup] = useState(false);
      const [sheet, setSheet] = useState(false);
      const counts = { mapped: 2, new: 3, unreadable: 1, notSeen: NOT_SEEN.length };
      return (
        <div>
          <Crumb trail="Home / Analyzers" route="/analyzers  (setup expands inline on the row)" />
          <h1>Analyzers</h1>
          <div className="sec">
            <div className="sec-head"><span className="num done">1</span><h3 style={{margin:0}}>Instrument</h3>
              <span className="summary">QA BX-3010 02 · Sysmex BX-3010 (QA Sysmex BX-3010, revision 2) · Lab unit: Biochemistry</span>
              <Btn kind="ghost" size="sm">Edit</Btn></div>
          </div>
          <div className="sec">
            <div className="sec-head"><span className="num done">2</span><h3 style={{margin:0}}>Connect</h3>
              <span className="summary">Connection saved. Results only.</span></div>
            <div className="sec-body">
              <Note kind="info" title="Connecting an analyzer needs your IT person.">They make sure the analyzer and the OpenELIS server can reach each other: the address, the port through any firewall or VPN, and a fixed IP for the analyzer. <a href="#" onClick={e=>{e.preventDefault();setSheet(!sheet);}}>{sheet ? 'Hide the sheet for IT' : 'Share with IT'}</a></Note>
              {sheet && (<div className="sec" style={{marginBottom:'1rem'}}><div className="sec-body">
                <div style={{display:'flex',justifyContent:'space-between'}}><h3>Analyzer connection: what IT needs to set up</h3><span><Btn kind="ghost" size="sm">Copy</Btn><Btn kind="ghost" size="sm">Print</Btn></span></div>
                <div className="cds--data-table-container"><table className="cds--data-table cds--data-table--sm"><tbody>
                  <tr><td style={{width:260}}><b>Analyzer</b></td><td>QA BX-3010 02 · Sysmex BX-3010 · Biochemistry, Central Public Health Laboratory</td></tr>
                  <tr><td><b>Protocol</b></td><td>ASTM, E1381 framing. The analyzer connects to OpenELIS.</td></tr>
                  <tr><td><b>Address the analyzer should use</b></td><td>192.168.10.5 (lab network) or 10.8.0.2 (VPN)</td></tr>
                  <tr><td><b>Port to allow</b></td><td>TCP 12011 inbound on the OpenELIS server, its firewall, and any cloud security group or VPN</td></tr>
                  <tr><td><b>Analyzer network</b></td><td>Needs a fixed IP on a network that can reach the server. Analyzer IP: <i>to fill in</i></td></tr>
                  <tr><td><b>How to check</b></td><td>When the analyzer sends, setup lists the message with the address it came from and the time. A timeout on the analyzer usually means the port is closed or there is no route.</td></tr>
                </tbody></table></div></div></div>)}
              <label className="toggle" style={{float:'right'}}><input type="checkbox" checked={asServer} onChange={e=>setAsServer(e.target.checked)} /> Example: an analyzer that waits for OpenELIS to connect</label>
              {!asServer ? (<>
              <h3>Type these into the analyzer's LIS settings</h3>
              <div className="kv">
                <span>OpenELIS server address</span><code>192.168.10.5 (lab network)</code><Btn kind="ghost" size="sm">Copy</Btn>
                <span></span><code>10.8.0.2 (VPN)</code><Btn kind="ghost" size="sm">Copy</Btn>
                <span>Port for ASTM (E1381)</span><code>12011</code><Btn kind="ghost" size="sm">Copy</Btn>
              </div>
              <p className="muted" style={{marginTop:'.5rem'}}>Recorded by your IT person. If you don't see an address here, ask them for the one analyzers use to reach OpenELIS. If the analyzer sends results through its own software on a PC, enter these in that software. You don't need to set a sender name: we'll recognise the analyzer from the first message it sends.</p>
              </>) : (<>
              <h3>Where OpenELIS should connect</h3>
              <p className="muted">This analyzer waits for OpenELIS to connect. Find its address and port on the analyzer's network or LIS settings screen.</p>
              <div className="row">
                <div className="grow field"><label>Analyzer IP address <span className="req">*</span></label><input className="cds--text-input" defaultValue="192.168.10.41" /></div>
                <div className="grow field"><label>Analyzer port <span className="req">*</span></label><input className="cds--text-input" defaultValue="5100" /></div>
              </div>
              <Btn kind="tertiary" size="sm">Test connection</Btn>
              </>)}
              <div style={{marginTop:'1rem'}}>
                <Note kind="warning" title="Port 12011 isn't open on this server.">The analyzer will time out until it is. Ask your IT person to open port 12011, or choose LIS01-A framing (port 12000, open) if the analyzer's manual allows it.</Note>
              </div>
              <div className="muted">Data flow: <b>Results only</b>. Sending orders to the analyzer will be offered once OpenELIS can answer the analyzer's order queries.</div>
              <div className="muted" style={{marginTop:'.5rem'}}>3 tests still need a catalog match. You can connect now and match them from a real result.</div>
            </div>
          </div>
          <div className="sec">
            <div className="sec-head"><span className={`num ${stage === 'received' ? 'done' : ''}`}>3</span><h3 style={{margin:0}}>Send a test result</h3>
              <span className="summary">{stage === 'received' ? '1 message received 10:42 · QA-T2-0001 · 6 results' : stage === 'arrived' ? '2 messages from unknown analyzers' : 'Waiting'}</span></div>
            <div className="sec-body">
              {stage === 'waiting' ? (
                <div>
                  <p style={{fontSize:16}}><span className="pulse"></span>Run a control or one patient sample on the analyzer and send it. We'll show what arrives here.</p>
                  <p className="muted">Nothing here becomes a patient or QC result.</p>
                  <div className="actions"><Btn kind="tertiary" size="sm" onClick={() => setStage('arrived')}>Simulate: analyzer sends QA-T2-0001</Btn><Btn kind="ghost" size="sm">Skip for now</Btn></div>
                </div>
              ) : stage === 'arrived' ? (
                <div>
                  <h3>Messages from analyzers OpenELIS doesn't know yet</h3>
                  <p className="muted">Pick the one you just sent. Last 24 hours, newest first.</p>
                  <div className="cds--data-table-container"><table className="cds--data-table cds--data-table--sm">
                    <thead><tr><th>Received</th><th>From address</th><th>Listener</th><th>Sender (as sent)</th><th>Specimen</th><th>First result</th><th></th></tr></thead>
                    <tbody>
                      <tr><td>10:42:07</td><td className="mono">192.168.10.41</td><td>ASTM E1381 · 12011</td><td className="mono">BX-3010^1.0</td><td>QA-T2-0001</td><td>GLU 132 mg/dL</td><td><Btn kind="tertiary" size="sm" onClick={() => setStage('received')}>This is my analyzer</Btn></td></tr>
                      <tr><td>09:58:30</td><td className="mono">192.168.10.77</td><td>ASTM LIS01-A · 12000</td><td className="mono">GeneXpert PC^GeneXpert^6.4</td><td>TB-26-00412</td><td>MTB DETECTED LOW</td><td><Btn kind="ghost" size="sm">This is my analyzer</Btn></td></tr>
                    </tbody></table></div>
                  <p className="muted"><span className="pulse"></span>Still listening.</p>
                </div>
              ) : (
                <div>
                  <div className="cds--data-table-container"><table className="cds--data-table cds--data-table--sm">
                    <thead><tr><th>Received</th><th>Accession</th><th>Results</th><th>Patient sent</th><th></th></tr></thead>
                    <tbody><tr><td>10:42:07</td><td>QA-T2-0001</td><td>6</td><td>PID-88213 · Wibowo, Adi · 1978-04-12 · M</td><td><Btn kind="ghost" size="sm">Discard</Btn></td></tr></tbody>
                  </table></div>
                  <div className="note">
                    <b>Recognised by:</b> sender <span className="mono">BX-3010^1.0</span>{dup && <> and address <span className="mono">192.168.10.41</span></>} <a href="#">Change (Advanced)</a>
                    {dup && <div style={{marginTop:'.25rem'}}>Another analyzer (QA BX-3010 01) sends the same name, so we'll also use the address it connects from.</div>}
                  </div>
                  <label className="toggle" style={{marginTop:'.5rem'}}><input type="checkbox" checked={dup} onChange={e=>setDup(e.target.checked)} /> Example: a second BX-3010 already sends the same name</label>
                  <p className="muted"><span className="pulse"></span>Still listening. Send another sample or a control to add it here.</p>
                </div>
              )}
            </div>
          </div>
          <div className="sec" style={{opacity: stage === 'received' ? 1 : .55}}>
            <div className="sec-head"><span className={`num ${stage === 'received' ? '' : 'todo'}`}>4</span><h3 style={{margin:0}}>Verify</h3>
              <span className="summary">{stage === 'received' ? `${counts.mapped} verified · ${counts.new} not in this type yet · ${counts.unreadable} could not be read · ${counts.notSeen} not seen yet` : 'Opens when a result arrives, or after Skip for now'}</span></div>
            {stage === 'received' && (
              <div className="sec-body">
                <div className="seg" style={{marginBottom:'1rem'}}>
                  <button className={view==='reconcile'?'on':''} onClick={()=>setView('reconcile')}>Against this type</button>
                  <button className={view==='read'?'on':''} onClick={()=>setView('read')}>How we read it</button>
                </div>
                {view === 'reconcile' ? (
                  <div className="cds--data-table-container"><table className="cds--data-table">
                    <thead><tr><th>Analyzer code</th><th>Received</th><th>Catalog test</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                      {CAPTURE.map(r => (
                        <tr key={r.code}>
                          <td className="mono">{r.code}</td>
                          <td>{r.value ? `${r.value} ${r.unit}` : <span className="muted">no value</span>}{r.flag && <span className="muted"> · flag {r.flag}</span>}</td>
                          <td>{r.test || <span className="muted">none</span>}</td>
                          <td>{r.status==='mapped' && <Tag kind="green">Verified against a real result</Tag>}
                              {r.status==='new' && <Tag kind="purple">Not in this type yet</Tag>}
                              {r.status==='unreadable' && <Tag kind="red">Could not read a value</Tag>}</td>
                          <td>{r.status==='new' && <Btn kind="ghost" size="sm">Map this code</Btn>}{r.status==='unreadable' && <Btn kind="ghost" size="sm" onClick={()=>setView('read')}>See record</Btn>}</td>
                        </tr>))}
                      {NOT_SEEN.map(([c,t]) => (<tr key={c}><td className="mono">{c}</td><td className="muted">not in this message</td><td>{t}</td><td><Tag kind="gray">Not seen yet</Tag></td><td></td></tr>))}
                    </tbody></table></div>
                ) : (
                  <div>
                    <div className="cds--data-table-container"><table className="cds--data-table cds--data-table--sm">
                      <thead><tr><th>Record</th><th>Code (field)</th><th>Value (field)</th><th>Read as</th><th>Unit</th><th>Flag</th><th>Specimen ID (field)</th></tr></thead>
                      <tbody>{CAPTURE.map((r,i)=>(<tr key={r.code}>
                        <td>R {i+1}</td><td className="mono">{r.code} (R.3)</td><td className="mono">{r.value || '(empty)'} (R.4)</td>
                        <td>{r.readAs==='number' ? <Tag kind="green">number</Tag> : <Tag kind="red">could not read</Tag>}</td>
                        <td>{r.unit}</td><td>{r.flag || 'none'}</td><td className="mono">QA-T2-0001 (O.3)</td></tr>))}</tbody>
                    </table></div>
                    <Note kind="error" title="TRIG: could not read a value.">The analyzer sent flag "&gt;" (above range) with no number. After go-live this arrives as an off-scale result for the tech to review; it is never dropped.</Note>
                    <div className="note">Example of a layout problem this view catches: with a record layout copied from GeneXpert, CREA would show <b>read as text "1.17"</b> and the warning "This test expects a number; we read text. The record layout may be wrong."</div>
                    <div style={{marginTop:'.75rem'}}><Btn kind="ghost" size="sm" onClick={()=>setShowRaw(!showRaw)}>{showRaw?'Hide':'Show'} raw message</Btn></div>
                    {showRaw && <div className="raw">{RAW}</div>}
                  </div>
                )}
                <div className="actions">
                  <Btn kind="primary">Confirm verified rows</Btn>
                  <Btn kind="secondary">Activate analyzer</Btn>
                  <label className="toggle"><input type="checkbox" /> Also import these results</label>
                </div>
                <p className="muted">Unmatched codes don't block activation. After go-live they are held and listed in Alerts.</p>
              </div>)}
          </div>
        </div>
      );
    }

    // ---------- Scene 2: not listed ----------
    function NotListed() {
      const [protocol, setProtocol] = useState('ASTM');
      const [adv, setAdv] = useState(false);
      const [code, setCode] = useState('NA|K');
      const [loinc, setLoinc] = useState('2951-3');
      const [prefix, setPrefix] = useState('');
      const delim = /[|^&\\]/.test(code);
      const checkOk = (l) => { const m=/^(\d{1,5})-(\d)$/.exec(l); if(!m) return false; let sum=0; m[1].split('').reverse().map(Number).forEach((d,i)=>{ if(i%2===0){const x=d*2; sum+= x>9?x-9:x;} else sum+=d; }); return (10-(sum%10))%10===Number(m[2]); };
      const loincBad = loinc && !/^\d{1,5}-\d$/.test(loinc) ? 'format' : (loinc && !checkOk(loinc) ? 'check' : null);
      return (
        <div>
          <Crumb trail="Home / Analyzers" route="/analyzers  ·  Instrument step  ·  My instrument isn't listed" />
          <h1>New analyzer type</h1>
          <Note kind="info">We filled the protocol and sender from the result you sent (received on the E1381 listener, header BX-T2). Check them and give the instrument a name.</Note>
          <div className="sec"><div className="sec-body">
            <div className="row">
              <div className="grow">
                <div className="field"><label>Name <span className="req">*</span></label><input className="cds--text-input" defaultValue="Sysmex BX-3010 (Biochemistry)" /><div className="muted">29 / 120</div></div>
                <div className="field"><label>Manufacturer and model <span className="req">*</span></label><input className="cds--text-input" defaultValue="Sysmex BX-3010" /></div>
                <div className="field"><label>Protocol <span className="req">*</span> <span className="muted">(fixed after the first save)</span></label>
                  <div className="seg">{['ASTM','HL7','Flat file'].map(p=>(<button key={p} className={protocol===p?'on':''} onClick={()=>setProtocol(p)}>{p}</button>))}</div>
                </div>
              </div>
              <div className="grow"><div className="note">
                <b>What the {protocol} starter fills in for you</b>
                <ul style={{margin:'.5rem 0 0 1rem', listStyle:'disc'}}>
                  {protocol==='ASTM' && <><li>Connection fields with help: server, port, sender</li><li>Framing: E1381 (from the listener that received your result)</li><li>Standard ASTM record layout</li><li>Controls: order field 12 equals Q; specimen ID starts with QC- or CTRL-</li></>}
                  {protocol==='HL7' && <><li>Connection fields with help: server, MLLP port 2575, sending application</li><li>Codes from OBX-3, values from OBX-5, units OBX-6</li><li>Controls: specimen ID starts with QC- or CTRL-</li></>}
                  {protocol==='Flat file' && <><li>Watched folder and file pattern</li><li>Column headers from the first file you drop in</li><li>Controls: specimen ID starts with QC- or CTRL-</li></>}
                </ul></div></div>
            </div>
            <div className="acc-head" onClick={()=>setAdv(!adv)}><span>Advanced, for IT</span><span>{adv?'−':'+'}</span></div>
            {adv && (<div style={{padding:'1rem'}}>
              <div className="row">
                <div className="grow field"><label>How the analyzer frames messages</label>
                  <select className="cds--select-input" defaultValue="e"><option value="l">LIS01-A, used by most analyzers (port 12000 on this server)</option><option value="e">E1381, only if the analyzer's manual says so (port 12011)</option></select></div>
                <div className="grow field"><label>Decimal separator</label>
                  <select className="cds--select-input"><option>Point (1.17)</option><option>Comma (1,17)</option></select></div>
              </div>
              <div className="field"><label>Record layout</label><div className="muted">Standard ASTM: code R.3, value R.4, unit R.5, flag R.7, specimen O.3. <a href="#">Change</a></div></div>
            </div>)}
          </div></div>
          <h2>Tests (filled from your result)</h2>
          <div className="cds--data-table-container"><table className="cds--data-table">
            <thead><tr><th>Analyzer code <span className="req">*</span></th><th>LOINC (optional)</th><th>Unit</th><th>Result</th></tr></thead>
            <tbody>
              <tr><td><input className={`cds--text-input ${delim?'invalid':''}`} value={code} onChange={e=>setCode(e.target.value)} />
                {delim && <div className="err">Codes can't contain | ^ &amp; or \ ; the analyzer uses them to separate fields.</div>}</td>
                <td><input className={`cds--text-input ${loincBad?'invalid':''}`} value={loinc} onChange={e=>setLoinc(e.target.value)} />
                {loincBad==='check' && <div className="err">The last digit is a check digit and doesn't match. Check the code on loinc.org.</div>}
                {loincBad==='format' && <div className="err">Enter a LOINC like 2345-7.</div>}
                {!loincBad && !loinc && <div className="muted">Without a LOINC this test is matched by name instead.</div>}</td>
                <td>mmol/L</td><td>Number</td></tr>
              <tr><td><input className="cds--text-input invalid" defaultValue="GLU" /><div className="err">Another test in this type already uses code GLU (row 1).</div></td><td><input className="cds--text-input" defaultValue="2345-7" /></td><td>mg/dL</td><td>Number</td></tr>
            </tbody></table></div>
          <h2 style={{marginTop:'1.5rem'}}>Control recognition</h2>
          <div className="row">
            <div className="grow field"><label>Condition</label><select className="cds--select-input"><option>Specimen ID starts with</option><option>Order field 12 equals</option><option>Order field 12 contains</option></select></div>
            <div className="grow field"><label>Value <span className="req">*</span></label><input className={`cds--text-input ${!prefix?'invalid':''}`} value={prefix} placeholder="SCC-" onChange={e=>setPrefix(e.target.value)} />{!prefix && <div className="err">Enter the prefix.</div>}</div>
          </div>
          <Note kind="warning" title="3 things to fix before publishing">
            <a href="#">Row 1: code contains a separator</a> · <a href="#">Row 1: LOINC check digit</a> · <a href="#">Row 2: duplicate code GLU</a>
          </Note>
          <div className="actions"><Btn kind="secondary">Save draft</Btn><Btn kind="primary" disabled={delim||!!loincBad}>Publish</Btn></div>
        </div>
      );
    }

    // ---------- Scene 3: start from similar ----------
    function StartSimilar() {
      const parts = [
        { k: 'conn', label: 'Connection fields and help', desc: 'Server, port, sender, with GeneXpert help text', def: 'keep' },
        { k: 'layout', label: 'Record layout', desc: 'Reads the result call from the first part of the value (R.4.1) and the number from the second part (R.4.2), as GeneXpert does. Chemistry analyzers usually send the number in R.4.', def: 'clear' },
        { k: 'qc', label: 'Control rules', desc: 'Order field 12 equals Q; specimen ID starts with QC-', def: 'keep' },
        { k: 'tests', label: 'Tests and result values', desc: '4 tests (MTB-RIF, HIV-VL, HPV, SARS-CoV-2), 11 result values', def: 'clear' },
      ];
      const [sel, setSel] = useState(Object.fromEntries(parts.map(p=>[p.k,p.def])));
      return (
        <div>
          <Crumb trail="Home / Analyzers / Analyzer Types" route="/analyzers/types  ·  Start from a similar instrument" />
          <h1>Start from a similar instrument</h1>
          <div className="field" style={{maxWidth:480}}><label>Start from</label><input className="cds--text-input" defaultValue="Cepheid GeneXpert (ASTM), revision 3" /></div>
          <p className="muted">Different manufacturer (Cepheid vs Sysmex): record layout and tests are cleared by default and replaced by the ASTM starter. Keep them only if you know the new analyzer formats messages the same way.</p>
          <div className="cds--data-table-container"><table className="cds--data-table inherit">
            <thead><tr><th>What is copied</th><th>Details</th><th>Keep or clear</th></tr></thead>
            <tbody>{parts.map(p=>(<tr key={p.k}><td><b>{p.label}</b></td><td>{p.desc}</td>
              <td><div className="seg"><button className={sel[p.k]==='keep'?'on':''} onClick={()=>setSel({...sel,[p.k]:'keep'})}>Keep</button><button className={sel[p.k]==='clear'?'on':''} onClick={()=>setSel({...sel,[p.k]:'clear'})}>Clear</button></div></td></tr>))}</tbody>
          </table></div>
          {sel.layout==='keep' && <Note kind="warning" title="Keeping GeneXpert's record layout.">Numbers sent in R.4 will be read as text. Send a test result after saving and check "How we read it".</Note>}
          <div className="note">Clearing tests also removes their hidden translations and value codes, so publish never fails on values you can't see. The new type records "Started from Cepheid GeneXpert (ASTM) revision 3".</div>
          <div className="actions"><Btn kind="primary">Create type</Btn><Btn kind="ghost">Cancel</Btn></div>
        </div>
      );
    }

    // ---------- Scene 4: map this code ----------
    function MapCode() {
      const [q, setQ] = useState('NA');
      const [all, setAll] = useState(false);
      const [pick, setPick] = useState(null);
      const [shared, setShared] = useState(false);
      const [alsoType, setAlsoType] = useState(true);
      const lu = 'Biochemistry';
      let list = CATALOG.filter(t => all ? true : (t.active && t.unit === lu));
      const ql = q.trim().toLowerCase();
      if (ql) {
        list = list.filter(t => [t.name, t.code, t.loinc].some(s => s && s.toLowerCase().split(/[\s\-()]+/).some(w => w.startsWith(ql)) || (s && s.toLowerCase().startsWith(ql))));
        list.sort((a,b) => (b.code.toLowerCase().startsWith(ql+'-')||b.code.toLowerCase()===ql) - (a.code.toLowerCase().startsWith(ql+'-')||a.code.toLowerCase()===ql) || a.name.localeCompare(b.name));
      }
      if (shared) list = CATALOG.filter(t => t.loinc === '2345-7');
      return (
        <div>
          <Crumb trail="Home / Analyzers / Field Mappings / QA BX-3010 02" route="/analyzers/10/mappings  ·  code NA" />
          <h1>Map code NA</h1>
          <div className="evid">
            <b>Received from QA BX-3010 02:</b> NA = 141 mmol/L · range 135 to 145 · sample SERUM · no flag · seen 3 times, first 10:42 today (QA-T2-0001)
          </div>
          <div className="row" style={{marginTop:'1rem'}}>
            <div className="grow">
              <div className="field"><label>Catalog test</label>
                <input className="cds--text-input" value={q} onChange={e=>{setQ(e.target.value);setShared(false);}} />
                <div style={{display:'flex',justifyContent:'space-between',marginTop:'.5rem'}}>
                  <span className="muted">{shared ? '2 tests in your catalog carry LOINC 2345-7' : all ? 'Searching all tests' : `Active tests in ${lu} (this analyzer's lab unit)`}</span>
                  <label className="toggle"><input type="checkbox" checked={all} onChange={e=>setAll(e.target.checked)} /> Search all tests</label>
                </div>
              </div>
              <div style={{border:'1px solid #e0e0e0', background:'#fff'}}>
                {list.length === 0 && <div className="option muted">No match in {lu}. Try "Search all tests", or add the test in Test Catalog.</div>}
                {list.map(t => {
                  const unitWarn = t.uom && t.uom !== 'mmol/L' && !shared;
                  return (<div key={t.code} className={`option ${pick===t.code?'sel':''}`} onClick={()=>setPick(t.code)}>
                    <b>{t.name}</b> <span className="mono">{t.code}</span> {!t.active && <Tag kind="gray">Inactive</Tag>}
                    <div className="facts">LOINC {t.loinc || 'none'} · {t.sample} · {t.unit} · unit {t.uom || 'none'}</div>
                    {unitWarn && <div className="warnt">Analyzer sends mmol/L; this test uses {t.uom}.</div>}
                    {!t.uom && !shared && t.unit===lu && <div className="warnt">Analyzer sends mmol/L; this test has no unit.</div>}
                  </div>);
                })}
              </div>
              <div className="actions">
                <Btn kind="ghost" size="sm" onClick={()=>{setShared(true);setQ('');}}>Example: shared LOINC 2345-7 (GLU)</Btn>
              </div>
            </div>
            <div className="grow">
              <div className="sec"><div className="sec-body">
                <h3>Save</h3>
                <p style={{fontSize:14}}>{pick ? <>NA → <b>{CATALOG.find(t=>t.code===pick).name}</b></> : 'Choose a test.'}</p>
                <label className="toggle"><input type="checkbox" checked={alsoType} onChange={e=>setAlsoType(e.target.checked)} /> Also add to the analyzer type <b>QA Sysmex BX-3010</b></label>
                <p className="muted">{alsoType ? 'Used by 2 analyzers (QA BX-3010 01, QA BX-3010 02). Both will map NA from now on; saved as revision 3.' : 'Only QA BX-3010 02 will map NA. The next analyzer of this type will ask again.'}</p>
                <div className="actions"><Btn kind="primary" disabled={!pick}>Save and retry 3 held results</Btn></div>
                <p className="muted">You'll see the 3 results that will move before anything changes.</p>
              </div></div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Scene 5: fix where it shows ----------
    function FixWhere() {
      const [confirm, setConfirm] = useState(false);
      const [retried, setRetried] = useState(false);
      return (
        <div>
          <Crumb trail="Home / Analyzers / Import Issues" route="/analyzers/errors" />
          <h1>Undelivered results</h1>
          {retried && <Note kind="success" title="Delivered to QA BX-3010 01.">2 results staged for review; 1 held for unmapped code NA.</Note>}
          <div className="cds--data-table-container"><table className="cds--data-table">
            <thead><tr><th>Received</th><th>Sender</th><th>Accession</th><th>Why it wasn't delivered</th><th>Actions</th></tr></thead>
            <tbody>
              <tr><td>10:51</td><td className="mono">BX-T3^1.0</td><td>QA-T3-0004</td><td>No analyzer is set up for this sender.</td>
                <td><Btn kind="tertiary" size="sm">Set up an analyzer from this result</Btn> <Btn kind="ghost" size="sm">Dismiss</Btn></td></tr>
              <tr><td>10:42</td><td className="mono">BX-T2^1.0</td><td>QA-T2-0001</td><td>QA BX-3010 02 is still in setup. This result is in its setup capture.</td>
                <td><Btn kind="ghost" size="sm">Continue setup</Btn></td></tr>
              {!retried && <tr><td>09:15</td><td className="mono">BX-3010^1.0</td><td>DEV01260000000001634</td><td>QA BX-3010 01 was inactive when this arrived. It is active now.</td>
                <td><Btn kind="tertiary" size="sm" onClick={()=>setRetried(true)}>Retry</Btn> <Btn kind="ghost" size="sm">Dismiss</Btn></td></tr>}
            </tbody></table></div>

          <h2 style={{marginTop:'2rem'}}>Alerts</h2>
          <div className="crumb route">/Alerts</div>
          <div className="cds--data-table-container"><table className="cds--data-table">
            <thead><tr><th>Alert</th><th>First seen</th><th>Last seen</th><th>Held</th><th></th></tr></thead>
            <tbody>
              <tr><td>QA BX-3010 01 sent code <b>NA</b> that isn't mapped</td><td>09:15</td><td>11:02</td><td>4</td><td><Btn kind="ghost" size="sm">Map this code</Btn></td></tr>
              <tr><td>QA EpiCenter 01 sent value <b>NEGATIVE</b> for STDAEF that isn't mapped</td><td>Yesterday 23:20</td><td>08:40</td><td>2</td><td><Btn kind="ghost" size="sm">Map this value</Btn></td></tr>
            </tbody></table></div>

          <h2 style={{marginTop:'2rem'}}>Analyzer results review</h2>
          <div className="crumb route">/Results?run=&lt;id&gt; (Runs) · held rows</div>
          <div className="cds--data-table-container"><table className="cds--data-table">
            <thead><tr><th></th><th>Accession</th><th>Test</th><th>Result</th><th>Status</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox" defaultChecked /></td><td>QA-T2-0005</td><td>Creatinine<div className="muted mono">CREA</div></td><td>1.17 mg/dL<div className="muted">Instrument reported: 1.17</div></td><td><Tag kind="green">Ready</Tag></td></tr>
              <tr><td><input type="checkbox" defaultChecked /></td><td>QA-T2-0005</td><td>Triglicerides<div className="muted mono">TRIG</div></td><td>&gt; 1000 mg/dL<div className="muted">Above the analyzer's range</div></td><td><Tag kind="warm-gray">Off-scale, review</Tag></td></tr>
              <tr><td><input type="checkbox" /></td><td>QA-T2-0005</td><td><span className="muted">not mapped</span><div className="muted mono">NA</div></td><td>141 mmol/L</td><td><Tag kind="purple">Held</Tag> <Btn kind="ghost" size="sm">Map this code</Btn></td></tr>
            </tbody></table></div>
          <div className="actions"><Btn kind="primary">Save selected</Btn><Btn kind="danger--ghost" onClick={()=>setConfirm(true)}>Remove from review</Btn></div>
          {confirm && <div className="sec" style={{marginTop:'1rem', maxWidth:520}}><div className="sec-body">
            <h3>Remove 2 results from review?</h3><p style={{fontSize:14}}>They won't be imported. The analyzer's message stays in the run's history.</p>
            <div className="actions"><Btn kind="secondary" size="sm" onClick={()=>setConfirm(false)}>Cancel</Btn><Btn kind="danger" size="sm" onClick={()=>setConfirm(false)}>Remove</Btn></div></div></div>}
        </div>
      );
    }

    // ---------- Scene 6: readiness ----------
    function Readiness() {
      return (
        <div>
          <Crumb trail="Home / Analyzers / Analyzer Types" route="/analyzers/types  ·  catalog readiness" />
          <h1>Analyzer Types</h1>
          <div className="row">
            <div className="sec grow"><div className="sec-body">
              <h3>Catalog readiness: Biochemistry</h3>
              <p style={{fontSize:32, margin:'.5rem 0'}}>48 <span style={{fontSize:16}}>of 52 active tests have a LOINC</span></p>
              <p className="muted">LOINC lets a new analyzer match its tests to your catalog without asking. Tests without one are matched by name.</p>
              <ul style={{listStyle:'disc', marginLeft:'1.25rem', fontSize:14}}><li><a href="#">Electrophoresis</a></li><li><a href="#">Bence Jones protein</a></li><li><a href="#">QA tmp test</a></li><li><a href="#">Integral</a></li></ul>
            </div></div>
            <div className="sec grow"><div className="sec-body">
              <h3>Tests that share a LOINC</h3>
              <div className="cds--data-table-container"><table className="cds--data-table cds--data-table--sm">
                <thead><tr><th>LOINC</th><th>Tests</th></tr></thead>
                <tbody>
                  <tr><td className="mono">2345-7</td><td>Glucose (Plasma, Biochemistry) · Glycémie (Serum, Biochemistry)<div className="muted">Choose which one analyzers use, or deactivate the duplicate in Test Catalog.</div></td></tr>
                  <tr><td className="mono">1742-6</td><td>ALT · Transaminases ALTL (both Serum, Biochemistry)</td></tr>
                  <tr><td className="mono">2160-0</td><td>Creatinine · Creatinine (Serum)</td></tr>
                </tbody></table></div>
            </div></div>
          </div>
          <div className="cds--data-table-container"><table className="cds--data-table">
            <thead><tr><th>Analyzer type</th><th>Protocol</th><th>Tests mapped</th><th>Used by</th><th>Status</th></tr></thead>
            <tbody>
              <tr><td>QA Sysmex BX-3010<div className="muted">Sysmex BX-3010 · started from Cepheid GeneXpert (ASTM) rev 3</div></td><td>ASTM</td><td>11 / 11 · 100%</td><td>2</td><td><Tag kind="green">Published rev 2</Tag> <Tag kind="blue">Your draft from 28 Oct</Tag></td></tr>
              <tr><td>QA BD EpiCenter<div className="muted">BD EpiCenter</div></td><td>ASTM</td><td>8 / 8 · 100%</td><td>1</td><td><Tag kind="green">Published rev 1</Tag></td></tr>
              <tr><td>Cepheid GeneXpert (ASTM)<div className="muted">Shipped</div></td><td>ASTM</td><td>4 / 4 · 100%</td><td>3</td><td><Tag kind="green">Published rev 3</Tag></td></tr>
            </tbody></table></div>
          <div className="actions"><Btn kind="primary">Add analyzer type</Btn><Btn kind="secondary">Start from a similar instrument</Btn><label className="toggle" style={{marginLeft:'1rem'}}><input type="checkbox" /> Show deactivated</label></div>
        </div>
      );
    }

    const SCENES = [
      { k: 'setup', t: 'Connect first, then verify', s: 'FR-A, FR-B', C: Setup },
      { k: 'notlisted', t: 'Instrument not listed', s: 'FR-C, FR-F', C: NotListed },
      { k: 'similar', t: 'Start from similar', s: 'FR-D', C: StartSimilar },
      { k: 'map', t: 'Map a code by evidence', s: 'FR-E, FR-G4', C: MapCode },
      { k: 'fix', t: 'Fix where it shows', s: 'FR-G, FR-I', C: FixWhere },
      { k: 'ready', t: 'Catalog readiness', s: 'FR-H', C: Readiness },
    ];
    function App() {
      const [k, setK] = useState('setup');
      const S = SCENES.find(s => s.k === k).C;
      return (
        <div className="shell">
          <nav className="scenes"><h4>Preview scenes</h4>
            {SCENES.map(s => (<button key={s.k} className={k===s.k?'on':''} onClick={()=>setK(s.k)}>{s.t}<small>{s.s}</small></button>))}
          </nav>
          <main className="main"><S /></main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
