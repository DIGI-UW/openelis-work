<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Menu — Final (v3–v12 cumulative end-state)</title>

  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    :root { --rail-w: 256px; --header-h: 48px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #f4f4f4; color: #161616; }

    .app-header { height: var(--header-h); background: #161616; color: #fff; display: flex; align-items: center; padding: 0 1rem; gap: 1rem; position: sticky; top: 0; z-index: 50; }
    .app-header .brand { font-size: 0.875rem; font-weight: 500; letter-spacing: 0.04em; }
    .app-header .brand .sub { opacity: 0.7; font-weight: 400; margin-left: 0.5rem; }
    .app-header .spacer { flex: 1; }
    .app-header .user-chip { font-size: 0.8125rem; opacity: 0.85; padding: 0.25rem 0.5rem; border: 1px solid #393939; }

    .layout { display: flex; min-height: calc(100vh - var(--header-h)); }
    .rail { width: var(--rail-w); flex: 0 0 var(--rail-w); background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; }
    .main { flex: 1; padding: 1.5rem 2rem; max-width: 100%; overflow-x: auto; }

    .rail-title { padding: 1rem 1rem 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.06em; color: #525252; text-transform: uppercase; }
    .rail-bucket { display: flex; align-items: center; width: 100%; padding: 0.625rem 1rem; font-size: 0.875rem; color: #161616; background: transparent; border: 0; border-left: 3px solid transparent; cursor: pointer; text-align: left; font-family: inherit; }
    .rail-bucket:hover { background: #e5e5e5; }
    .rail-bucket.current { background: #edf5ff; border-left-color: #0f62fe; font-weight: 600; }
    .rail-bucket .icon { margin-right: 0.625rem; flex: 0 0 20px; display: inline-flex; justify-content: center; }
    .rail-bucket .label { flex: 1; }
    .rail-bucket .chev { flex: 0 0 16px; opacity: 0.6; font-size: 0.75rem; transition: transform 0.12s; margin-left: 0.25rem; }
    .rail-bucket.expanded .chev { transform: rotate(180deg); }
    .rail-children { display: none; background: #fafafa; border-top: 1px solid #f0f0f0; }
    .rail-bucket.expanded + .rail-children { display: block; }

    .rail-pillar { display: flex; align-items: center; width: 100%; padding: 0.5rem 1rem 0.5rem 2.25rem; font-size: 0.8125rem; background: transparent; border: 0; cursor: pointer; text-align: left; font-family: inherit; color: #161616; font-weight: 500; }
    .rail-pillar:hover { background: #e8e8e8; }
    .rail-pillar.current { background: #e0e0e0; }
    .rail-pillar .chev { font-size: 0.625rem; margin-left: auto; opacity: 0.6; transition: transform 0.12s; }
    .rail-pillar.expanded .chev { transform: rotate(180deg); }

    .rail-pillar-children { display: none; }
    .rail-pillar.expanded + .rail-pillar-children { display: block; }
    .rail-page { display: flex; align-items: center; width: 100%; padding: 0.4375rem 1rem 0.4375rem 3.5rem; font-size: 0.8125rem; color: #525252; background: transparent; border: 0; border-left: 3px solid transparent; cursor: pointer; text-align: left; font-family: inherit; }
    .rail-page:hover { background: #ececec; }
    .rail-page.current { background: #edf5ff; border-left-color: #0f62fe; font-weight: 600; color: #161616; }

    .crumb { font-size: 0.8125rem; color: #525252; margin-bottom: 0.5rem; }
    .crumb a { color: #0f62fe; text-decoration: none; cursor: pointer; }
    .crumb a:hover { text-decoration: underline; }
    .crumb .sep { margin: 0 0.375rem; }
    .crumb .current { color: #161616; font-weight: 500; }

    h1.page-title { font-size: 1.75rem; font-weight: 300; margin: 0 0 0.25rem 0; letter-spacing: -0.01em; }
    p.page-sub { color: #525252; margin: 0 0 1.5rem 0; font-size: 0.9375rem; }

    /* Question strip */
    .question-strip { background: #fff; border: 1px solid #e0e0e0; padding: 0; margin-bottom: 1.25rem; }
    .question-strip h2 { font-size: 0.6875rem; letter-spacing: 0.08em; color: #525252; text-transform: uppercase; margin: 0; padding: 0.875rem 1rem 0.5rem; }
    .question-row { display: grid; grid-template-columns: auto 1fr auto; gap: 0.875rem; padding: 0.625rem 1rem; align-items: center; border-top: 1px solid #f0f0f0; cursor: pointer; transition: background 0.08s; }
    .question-row:hover { background: #fafafa; }
    .q-icon { font-size: 1rem; width: 24px; text-align: center; }
    .q-icon.green { color: #198038; } .q-icon.amber { color: #f1c21b; } .q-icon.red { color: #da1e28; }
    .q-text { display: flex; flex-direction: column; gap: 0.125rem; }
    .q-label { font-size: 0.875rem; font-weight: 500; }
    .q-answer { font-size: 0.8125rem; color: #525252; }
    .q-arrow { color: #a8a8a8; font-size: 0.875rem; }
    .strip-footer { padding: 0.5rem 1rem; font-size: 0.75rem; color: #6f6f6f; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
    .strip-footer .refresh { color: #0f62fe; cursor: pointer; }

    .pillar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .pillar-tile { background: #fff; padding: 1rem; border: 1px solid #e0e0e0; cursor: pointer; transition: background 0.12s, box-shadow 0.12s; display: flex; flex-direction: column; gap: 0.5rem; border-left: 3px solid transparent; min-height: 160px; }
    .pillar-tile:hover { background: #fafafa; border-left-color: #0f62fe; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .pillar-tile h3 { font-size: 0.9375rem; font-weight: 600; margin: 0; flex: 1; }
    .pillar-tile .head { display: flex; align-items: center; gap: 0.5rem; }
    .pillar-tile .info-icon { color: #a8a8a8; font-size: 0.875rem; }
    .pillar-tile .status-line { display: flex; align-items: center; gap: 0.375rem; font-size: 0.875rem; }
    .pillar-tile .status-line .icon.green { color: #198038; } .pillar-tile .status-line .icon.amber { color: #f1c21b; } .pillar-tile .status-line .icon.red { color: #da1e28; }
    .pillar-tile .secondary { font-size: 0.8125rem; color: #525252; }
    .pillar-tile .deep-link { font-size: 0.75rem; color: #0f62fe; margin-top: auto; padding-top: 0.5rem; }

    /* Leaf grid (pillar landings) */
    .leaf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .leaf-tile { background: #fff; padding: 1rem; border: 1px solid #e0e0e0; cursor: pointer; transition: background 0.12s; display: flex; flex-direction: column; gap: 0.5rem; }
    .leaf-tile:hover { background: #fafafa; border-color: #0f62fe; }
    .leaf-tile h3 { font-size: 0.9375rem; font-weight: 600; margin: 0; }
    .leaf-tile p { font-size: 0.8125rem; color: #525252; margin: 0; line-height: 1.5; }

    /* QI Dashboard tiles */
    .qi-header { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; background: #fff; border: 1px solid #e0e0e0; margin-bottom: 1rem; }
    .qi-header label { font-size: 0.75rem; color: #525252; text-transform: uppercase; letter-spacing: 0.04em; }
    .qi-header select { font-family: inherit; font-size: 0.875rem; padding: 0.25rem 0.5rem; border: 1px solid #c6c6c6; background: #fff; }
    .qi-header .timestamp { color: #6f6f6f; font-size: 0.8125rem; margin-left: auto; }
    .qi-header .config-btn { font-family: inherit; font-size: 0.8125rem; padding: 0.25rem 0.625rem; background: #fff; border: 1px solid #c6c6c6; cursor: pointer; color: #161616; }
    .qi-header .config-btn:hover { background: #f4f4f4; }
    .qi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .qi-tile { background: #fff; padding: 1.125rem; border: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 0.5rem; cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
    .qi-tile:hover { background: #fafafa; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .qi-tile.green { border-top: 3px solid #198038; }
    .qi-tile.amber { border-top: 3px solid #f1c21b; }
    .qi-tile.red { border-top: 3px solid #da1e28; }
    .qi-tile.blue { border-top: 3px solid #0f62fe; }
    .qi-tile .head { display: flex; align-items: center; }
    .qi-tile .head h3 { font-size: 0.875rem; font-weight: 600; margin: 0; flex: 1; }
    .qi-tile .head .icons { color: #a8a8a8; font-size: 0.8125rem; display: flex; gap: 0.375rem; }
    .qi-tile .head .icons .config { cursor: pointer; }
    .qi-tile .head .icons .config:hover { color: #0f62fe; }
    .qi-tile .primary { display: flex; align-items: baseline; gap: 0.5rem; }
    .qi-tile .primary .value { font-size: 1.75rem; font-weight: 300; letter-spacing: -0.01em; }
    .qi-tile .primary .delta { font-size: 0.8125rem; }
    .qi-tile .delta.good { color: #198038; } .qi-tile .delta.bad { color: #da1e28; } .qi-tile .delta.flat { color: #6f6f6f; }
    .qi-tile .progress-track { position: relative; background: #e8e8e8; height: 6px; }
    .qi-tile .progress-fill.green { background: #24a148; } .qi-tile .progress-fill.amber { background: #f1c21b; } .qi-tile .progress-fill.red { background: #da1e28; }
    .qi-tile .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; }
    .qi-tile .progress-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #161616; }
    .qi-tile .target-line { font-size: 0.75rem; color: #525252; }
    .qi-tile .secondary { font-size: 0.8125rem; color: #525252; }
    .qi-tile .deep-link { font-size: 0.75rem; color: #0f62fe; margin-top: auto; padding-top: 0.25rem; }

    /* Detail / list pages */
    .detail-placeholder { background: #fff; padding: 2rem; border: 1px solid #e0e0e0; }
    .detail-filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .detail-filters .filter { padding: 0.375rem 0.625rem; background: #f4f4f4; border: 1px solid #e0e0e0; font-size: 0.8125rem; color: #525252; }
    .detail-filters .filter.add { background: #fff; cursor: pointer; color: #0f62fe; border-color: #0f62fe; }
    .detail-filters .spacer { flex: 1; }
    .detail-filters .export-btn { padding: 0.375rem 0.75rem; background: #fff; border: 1px solid #c6c6c6; font-size: 0.8125rem; color: #161616; cursor: pointer; font-family: inherit; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .detail-table th { background: #f4f4f4; padding: 0.5rem 0.75rem; text-align: left; font-weight: 500; font-size: 0.8125rem; color: #525252; border-bottom: 1px solid #e0e0e0; }
    .detail-table td { padding: 0.625rem 0.75rem; border-bottom: 1px solid #f0f0f0; }
    .detail-table tr:hover td { background: #fafafa; }
    .detail-table tr.drillable { cursor: pointer; }
    .detail-table tr.drillable:hover td { background: #edf5ff; }
    .detail-table .nce-link { color: #0f62fe; cursor: pointer; }
    .detail-table .nce-link:hover { text-decoration: underline; }
    .detail-table .test-cat-pill { display: inline-block; font-size: 0.6875rem; background: #e8daff; color: #491d8b; padding: 0.0625rem 0.375rem; border-radius: 10px; }
    .detail-table .num-cell { text-align: right; font-variant-numeric: tabular-nums; }

    .detail-section-title { font-size: 0.875rem; font-weight: 600; margin: 1.25rem 0 0.625rem 0; color: #161616; }
    .detail-section-title:first-child { margin-top: 0; }

    .chart-row { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: 1.5rem; align-items: start; margin-bottom: 1.25rem; }
    @media (max-width: 800px) { .chart-row { grid-template-columns: 1fr; } }

    .pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .pie-svg { display: block; }
    .legend { display: flex; flex-direction: column; gap: 0.25rem; align-self: stretch; }
    .legend-row { display: flex; align-items: center; font-size: 0.8125rem; color: #393939; gap: 0.5rem; }
    .legend-swatch { width: 12px; height: 12px; flex: 0 0 12px; border-radius: 2px; }
    .legend-row .label { flex: 1; }
    .legend-row .value { color: #6f6f6f; font-variant-numeric: tabular-nums; }

    .bar-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .bar-row { display: grid; grid-template-columns: 140px 1fr 70px; gap: 0.75rem; align-items: center; font-size: 0.8125rem; }
    .bar-track { background: #e8e8e8; height: 14px; position: relative; }
    .bar-fill { background: #0f62fe; height: 100%; }
    .bar-fill.amber { background: #f1c21b; } .bar-fill.red { background: #da1e28; }
    .bar-value { color: #6f6f6f; font-variant-numeric: tabular-nums; text-align: right; }

    /* Heatmap */
    .heatmap { display: grid; gap: 1px; background: #e0e0e0; padding: 1px; }
    .heatmap-cell { background: #fff; padding: 0.5rem 0.75rem; font-size: 0.8125rem; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    .heatmap-cell.header { background: #f4f4f4; font-weight: 500; color: #525252; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .heatmap-cell.row-header { background: #f4f4f4; font-weight: 500; justify-content: flex-start; }
    .heatmap-cell.empty { color: #c6c6c6; }

    /* Levey-Jennings chart */
    .lj-chart { background: #fff; padding: 1rem; border: 1px solid #e0e0e0; }

    /* Action pills */
    .action-pill { display: inline-block; font-size: 0.6875rem; padding: 0.0625rem 0.375rem; border-radius: 10px; }
    .action-pill.validated { background: #d0e2ff; color: #002d9c; }
    .action-pill.released { background: #defbe6; color: #0e6027; }
    .action-pill.amended { background: #fff1c2; color: #6f4700; }
    .action-pill.rejected { background: #ffd7d9; color: #750e13; }
    .action-pill.acknowledged { background: #e8daff; color: #491d8b; }
    .action-pill.signed-off { background: #d1e0ff; color: #003a9b; }

    /* Severity pills */
    .severity-pill { display: inline-block; font-size: 0.6875rem; padding: 0.0625rem 0.375rem; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .severity-pill.critical { background: #ffd7d9; color: #750e13; }
    .severity-pill.major { background: #fff1c2; color: #6f4700; }
    .severity-pill.minor { background: #e8e8e8; color: #525252; }

    .status-pill { display: inline-block; font-size: 0.6875rem; padding: 0.0625rem 0.375rem; border-radius: 10px; }
    .status-pill.open { background: #ffd7d9; color: #750e13; }
    .status-pill.acknowledged { background: #fff1c2; color: #6f4700; }
    .status-pill.under-investigation { background: #d0e2ff; color: #002d9c; }
    .status-pill.corrective-action { background: #d1e0ff; color: #003a9b; }
    .status-pill.closed-pending { background: #e8daff; color: #491d8b; }
    .status-pill.closed-verified { background: #defbe6; color: #0e6027; }

    /* NCE Register row expansion */
    .nce-row-expanded { background: #f7f7f7 !important; }
    .nce-row-expanded td { border-bottom: none !important; }
    .nce-detail-panel { background: #f7f7f7; padding: 1rem 1.5rem; border-bottom: 1px solid #e0e0e0; }
    .nce-tabs { display: flex; gap: 1rem; border-bottom: 1px solid #e0e0e0; margin-bottom: 1rem; }
    .nce-tab { padding: 0.5rem 0; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 0.875rem; color: #525252; border-bottom: 2px solid transparent; }
    .nce-tab.active { color: #161616; font-weight: 600; border-bottom-color: #0f62fe; }

    .preview-note { background: #fdf6dd; border-left: 3px solid #f1c21b; padding: 0.625rem 0.875rem; margin-bottom: 1.25rem; font-size: 0.8125rem; color: #684e00; }

    /* QA Overview daily-focused redesign */
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin: 1.5rem 0 0.5rem 0; }
    .section-header:first-child { margin-top: 0; }
    .section-header h2 { font-size: 0.875rem; font-weight: 600; margin: 0; color: #161616; text-transform: uppercase; letter-spacing: 0.04em; }
    .section-header .meta { font-size: 0.75rem; color: #6f6f6f; }
    .section-header .meta a { color: #0f62fe; cursor: pointer; }

    /* Action Center */
    .action-center { background: #fff; border: 1px solid #e0e0e0; }
    .action-row { display: grid; grid-template-columns: 32px auto 1fr auto auto; gap: 0.875rem; padding: 0.75rem 1rem; align-items: center; border-top: 1px solid #f0f0f0; cursor: pointer; transition: background 0.08s; }
    .action-row:first-child { border-top: 0; }
    .action-row:hover { background: #fafafa; }
    .action-row .severity-dot { width: 10px; height: 10px; border-radius: 50%; }
    .action-row .severity-dot.red { background: #da1e28; }
    .action-row .severity-dot.amber { background: #f1c21b; }
    .action-row .severity-dot.blue { background: #0f62fe; }
    .action-row .severity-dot.gray { background: #a8a8a8; }
    .action-row .count-badge { font-size: 1rem; font-weight: 600; min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
    .action-row .count-badge.red { color: #da1e28; }
    .action-row .count-badge.amber { color: #f1c21b; }
    .action-row .count-badge.blue { color: #0f62fe; }
    .action-row .count-badge.gray { color: #525252; }
    .action-row .label-block { display: flex; flex-direction: column; gap: 0.125rem; }
    .action-row .label { font-size: 0.875rem; font-weight: 500; color: #161616; }
    .action-row .context { font-size: 0.75rem; color: #6f6f6f; }
    .action-row .age-pill { font-size: 0.6875rem; padding: 0.0625rem 0.375rem; background: #f4f4f4; color: #525252; border-radius: 8px; }
    .action-row .age-pill.urgent { background: #ffd7d9; color: #750e13; }
    .action-row .arrow { color: #a8a8a8; font-size: 0.875rem; }

    .action-toggle { display: flex; gap: 0.375rem; padding: 0.5rem 1rem; border-top: 1px solid #f0f0f0; background: #fafafa; align-items: center; font-size: 0.75rem; color: #525252; }
    .action-toggle .toggle-mini { width: 28px; height: 16px; background: #c6c6c6; border-radius: 8px; position: relative; cursor: pointer; transition: background 0.15s; }
    .action-toggle .toggle-mini.on { background: #0f62fe; }
    .action-toggle .toggle-mini .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: left 0.15s; }
    .action-toggle .toggle-mini.on .knob { left: 14px; }

    /* Today KPI mini-strip */
    .today-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }
    .today-tile { background: #fff; border: 1px solid #e0e0e0; padding: 0.75rem; cursor: pointer; transition: background 0.12s; }
    .today-tile:hover { background: #fafafa; }
    .today-tile .label { font-size: 0.6875rem; color: #525252; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.25rem; }
    .today-tile .value-row { display: flex; align-items: baseline; gap: 0.375rem; margin-bottom: 0.25rem; }
    .today-tile .value { font-size: 1.25rem; font-weight: 300; }
    .today-tile .delta { font-size: 0.75rem; }
    .today-tile .delta.good { color: #198038; }
    .today-tile .delta.bad { color: #da1e28; }
    .today-tile .delta.flat { color: #6f6f6f; }
    .today-tile .sub { font-size: 0.6875rem; color: #6f6f6f; margin-bottom: 0.375rem; }
    .today-tile .sparkline { width: 100%; height: 20px; }

    /* This Week stats */
    .week-stats { background: #fff; border: 1px solid #e0e0e0; padding: 1rem; }
    .week-stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem 1.5rem; }
    .week-stat { display: flex; flex-direction: column; gap: 0.125rem; }
    .week-stat .stat-label { font-size: 0.75rem; color: #525252; }
    .week-stat .stat-value { font-size: 1rem; font-weight: 500; }
    .week-stat .stat-sub { font-size: 0.6875rem; color: #6f6f6f; }

    /* Pillar status compressed */
    .pillar-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .pillar-mini { background: #fff; border: 1px solid #e0e0e0; padding: 0.625rem 0.75rem; cursor: pointer; transition: background 0.12s; border-left: 3px solid transparent; display: flex; align-items: center; gap: 0.5rem; }
    .pillar-mini:hover { background: #fafafa; }
    .pillar-mini.green { border-left-color: #198038; }
    .pillar-mini.amber { border-left-color: #f1c21b; }
    .pillar-mini.red { border-left-color: #da1e28; }
    .pillar-mini .pillar-name { font-size: 0.8125rem; font-weight: 500; flex: 1; }
    .pillar-mini .pillar-status { font-size: 0.75rem; color: #525252; }

    /* Activity feed */
    .activity-feed { background: #fff; border: 1px solid #e0e0e0; }

    .inspector-collapse-head .title { font-size: 0.8125rem; font-weight: 600; flex: 1; }
    .inspector-collapse-head .summary { font-size: 0.75rem; color: #525252; }

    /* ---------------------------------- Routing ---------------------------------- */

    function parseHash() {
      const raw = window.location.hash.replace(/^#/, '') || '/qa/overview';
      const parts = raw.split('/').filter(Boolean);

      if (parts.length === 1 || parts[1] === 'overview') return { kind: 'overview' };
      const [, pillar, leaf, ...rest] = parts;
      if (!leaf) return { kind: 'pillar-landing', pillar };
      return { kind: 'leaf', pillar, leaf, rest };
    }

    function useRoute() {
      const [route, setRoute] = useState(parseHash());
      useEffect(() => {
        const onHash = () => setRoute(parseHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      return route;

    /* ---------------------------------- Pie / bar / heatmap helpers ---------------------------------- */

    function PieDonut({ slices, size = 160, innerRatio = 0.55 }) {
      const cx = size / 2, cy = size / 2, r = size / 2 - 6, innerR = r * innerRatio;
      const total = slices.reduce((s, x) => s + x.value, 0) || 1;
      let acc = 0;
      const polar = (radius, angle) => [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
      const arc = (a1, a2) => {
        const [sx,sy] = polar(r,a1), [ex,ey] = polar(r,a2);
        const [sxi,syi] = polar(innerR,a2), [exi,eyi] = polar(innerR,a1);
        const large = (a2-a1) > Math.PI ? 1 : 0;
        return `M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey} L ${sxi} ${syi} A ${innerR} ${innerR} 0 ${large} 0 ${exi} ${eyi} Z`;
      };
      return (
        <svg className="pie-svg" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
          {slices.map((s, i) => {
            const a1 = -Math.PI/2 + (acc/total)*2*Math.PI;
            acc += s.value;
            const a2 = -Math.PI/2 + (acc/total)*2*Math.PI;
            return <path key={i} d={arc(a1, a2)} fill={s.color} />;
          })}
        </svg>
      );
    }

    function Legend({ slices, total }) {
      return (
        <div className="legend">

          ))}
        </div>
      );
    }

    function BarList({ rows, max, valueFormatter = v => v }) {

    /* ---------------------------------- QA Overview ---------------------------------- */

    function Sparkline({ points, kind, width = 80, height = 20 }) {
      const min = Math.min(...points), max = Math.max(...points);
      const range = max - min || 1;
      const stepX = width / (points.length - 1);
      const path = points.map((v, i) => `${i === 0 ? 'M' : 'L'} ${i * stepX} ${height - ((v - min) / range) * (height - 2) - 1}`).join(' ');
      const color = kind === 'good' ? '#198038' : kind === 'bad' ? '#da1e28' : kind === 'flat' ? '#6f6f6f' : '#0f62fe';
      return (
        <svg className="sparkline" viewBox={`0 0 ${width} ${height}`} width={width} height={height}>
          <path d={path} fill="none" stroke={color} strokeWidth="1.5" />
          <circle cx={(points.length - 1) * stepX} cy={height - ((points[points.length - 1] - min) / range) * (height - 2) - 1} r="2" fill={color} />
        </svg>
      );
    }

    function RunReview() {
      // Levey-Jennings chart for a single QC level
      const points = [4.32, 4.28, 4.31, 4.35, 4.27, 4.29, 4.33, 4.41, 4.30, 4.28, 4.34, 4.36, 4.29, 4.27, 4.32, 4.38, 4.35, 4.33, 4.29, 4.31];
      const target = 4.30, sd = 0.04;
      const xstep = 30, w = points.length * xstep + 60;
      const h = 220, midY = 110;
      const yFor = v => midY - ((v - target) / sd) * 30;

      return (
        <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'Statistical QC', target: '/qa/qc' }, { label: 'Run Review & L-J' }]} />
          <h1 className="page-title">Run Review &amp; Levey-Jennings</h1>
          <p className="page-sub">Potassium · Architect ci8200 · Lot 22417C · Level 1 · last 20 runs</p>

          <div className="detail-filters">
            <span className="filter">Test: Potassium</span>
            <span className="filter">Instrument: Architect ci8200</span>
            <span className="filter">Lot: 22417C</span>
            <span className="filter">Level: Level 1</span>
            <span className="filter">Window: last 20 runs</span>
          </div>

          <div className="lj-chart">
            <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ display: 'block' }}>
              {/* SD reference lines */}
              {[3,2,1,-1,-2,-3].map(n => {
                const y = midY - n*30;
                const isOuter = Math.abs(n) === 3;
                return <line key={n} x1="40" y1={y} x2={w-20} y2={y} stroke={isOuter ? '#da1e28' : '#e0e0e0'} strokeDasharray={isOuter ? '4 2' : '2 2'} strokeWidth="1" />;
              })}
              {/* Mean line */}
              <line x1="40" y1={midY} x2={w-20} y2={midY} stroke="#0f62fe" strokeWidth="1.5" />
              <text x="44" y={midY-4} fill="#0f62fe" fontSize="11">Target {target}</text>
              <text x="44" y={midY-30-4} fill="#525252" fontSize="10">+1SD</text>
              <text x="44" y={midY-60-4} fill="#525252" fontSize="10">+2SD</text>
              <text x="44" y={midY-90-4} fill="#da1e28" fontSize="10">+3SD</text>
              <text x="44" y={midY+30+12} fill="#525252" fontSize="10">−1SD</text>
              <text x="44" y={midY+60+12} fill="#525252" fontSize="10">−2SD</text>
              <text x="44" y={midY+90+12} fill="#da1e28" fontSize="10">−3SD</text>

              {/* Data line */}
              <polyline fill="none" stroke="#161616" strokeWidth="1.5"
                points={points.map((v,i) => `${50 + i*xstep},${yFor(v)}`).join(' ')} />
              {/* Data points */}
              {points.map((v,i) => {
                const x = 50 + i*xstep;
                const y = yFor(v);
                const z = (v - target) / sd;
                const isViolation = Math.abs(z) > 2;
                return (
                  <g key={i}>
                    <circle cx={x} cy={y} r="4" fill={isViolation ? '#da1e28' : '#0f62fe'} stroke="#fff" strokeWidth="1.5" />
                    <text x={x} y={h-6} fontSize="9" fill="#6f6f6f" textAnchor="middle">{i+1}</text>
                  </g>
                );
              })}
            </svg>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8125rem', color: '#525252', marginTop: '0.75rem' }}>
              <span>Mean: 4.32 mmol/L · SD: 0.04 · CV: 0.93%</span>
              <span>Sigma: 4.2 (acceptable)</span>
              <span style={{ color: '#da1e28' }}>1 violation: 1-3s on run 8</span>
            </div>
          </div>

          <div className="detail-section-title">Run history</div>
          <table className="detail-table">
            <thead><tr><th>Run #</th><th>Timestamp</th><th>Value</th><th>Z-score</th><th>Westgard</th><th>Operator</th><th>Sign-off</th></tr></thead>
            <tbody>
              {points.slice(-8).map((v,i) => {
                const z = (v - target) / sd;
                const flag = Math.abs(z) > 2 ? '1-3s' : Math.abs(z) > 1 ? 'within 2SD' : 'within 1SD';
                const violation = Math.abs(z) > 2;
                return (
                  <tr key={i}>
                    <td>{points.length - 7 + i}</td>
                    <td>2026-04-{20 + Math.floor(i/2)} {String(8 + i*2).padStart(2,'0')}:00</td>
                    <td className="num-cell">{v.toFixed(2)} mmol/L</td>
                    <td className="num-cell" style={{ color: violation ? '#da1e28' : '#161616' }}>{z.toFixed(2)}</td>
                    <td>{violation ? <span className="severity-pill major">{flag}</span> : <span style={{ color: '#198038' }}>{flag}</span>}</td>
                    <td>A. Johnson</td>
                    <td>{violation ? <span style={{ color: '#da1e28' }}>Pending</span> : <span className="action-pill signed-off">Signed</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Fragment>
      );
    }

    /* ---------------------------------- Accreditation Status (aligned to test-accreditation-frs.md v5) ----------------------------------
     *
     * The QMS Accreditation Status page is a READ-ONLY SUMMARY VIEW that mirrors the
     * data managed by the canonical Test Accreditation pages under Admin → Test Catalog
     * Management. CRUD lives there per test-accreditation-frs.md FR-1/FR-2:
     *   /admin/test-catalog/accreditation/bodies
     *   /admin/test-catalog/accreditation/test-accreditations
     *
     * The QMS view answers an inspector's "show me your accreditation status" question
     * without leaving the QA menu. Editing requires TEST_CATALOG_MANAGE and goes to Admin.
     *
     * Data model (per FRS v5):
     *   - accrediting_body: code, name, logo, expires_on, logo_visibility_mode,
     *     threshold_pct, display_order, active
     *   - test_accreditation: pure (test_id, body_id) join — body's expires_on governs status
     *   - Status chip carries the date inline: "Active · 2027-03-15"
     */

    // Mock data mirrors test-accreditation-mockup.jsx initialBodies + initialAccreditations
    const ACCRED_BODIES = [
      { id: 'b1', code: 'ISO15189', name: 'ISO 15189 (SANAS)',     expiresOn: '2027-03-15',
        logoVisibilityMode: 'ANY_ACCREDITED_TEST', thresholdPct: 80, displayOrder: 10, active: true,
        enrolledCount: 6, logoBg: '#0f62fe' },
      { id: 'b2', code: 'SANAS',    name: 'SANAS General',          expiresOn: '2026-06-02',
        logoVisibilityMode: 'PERCENTAGE',          thresholdPct: 50, displayOrder: 20, active: true,
        enrolledCount: 2, logoBg: '#198038' },
      { id: 'b3', code: 'RETIRED',  name: 'Regional (legacy)',      expiresOn: '2025-11-30',
        logoVisibilityMode: 'PERCENTAGE',          thresholdPct: 60, displayOrder: 30, active: false,
        enrolledCount: 0, logoBg: '#a8a8a8' },
    ];

    function statusForBody(body) {
      if (!body.active) return { kind: 'gray', label: 'Inactive' };
      const today = new Date('2026-04-30');
      const exp = new Date(body.expiresOn);
      const days = Math.round((exp - today) / 86400000);
      if (days < 0)   return { kind: 'red',   label: `Expired ${body.expiresOn}` };
      if (days <= 60) return { kind: 'amber', label: `Expiring ${body.expiresOn}` };
      return { kind: 'green', label: `Active · ${body.expiresOn}` };
    }

    function visibilitySummary(body) {
      return body.logoVisibilityMode === 'ANY_ACCREDITED_TEST'
        ? 'Any accredited test'
        : `≥ ${body.thresholdPct}%`;
    }

    function AccreditationStatus() {
      const expiredCount  = ACCRED_BODIES.filter(b => b.active && new Date(b.expiresOn) < new Date('2026-04-30')).length;
      const expiringCount = ACCRED_BODIES.filter(b => {
        if (!b.active) return false;
        const days = Math.round((new Date(b.expiresOn) - new Date('2026-04-30')) / 86400000);
        return days >= 0 && days <= 60;
      }).length;
      const totalEnrollments = ACCRED_BODIES.reduce((s, b) => s + (b.active ? b.enrolledCount : 0), 0);

      return (
        <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'QMS & Improvement', target: '/qa/qms' }, { label: 'Accreditation Status' }]} />
          <h1 className="page-title">Accreditation Status</h1>
          <p className="page-sub">Read-only summary of the lab's accreditation portfolio. Sourced from the same data as the canonical admin pages.</p>

          <div style={{ background: '#d0e2ff', borderLeft: '3px solid #0f62fe', padding: '0.75rem 1rem', marginBottom: '1.25rem', fontSize: '0.8125rem', color: '#002d9c' }}>
            <strong>Read-only view.</strong> Accrediting bodies and per-test enrollments are managed under
            <code style={{ background: 'rgba(0,0,0,0.06)', padding: '0.0625rem 0.25rem', margin: '0 0.25rem' }}>Admin → Test Catalog Management → Accrediting bodies</code>
            and
            <code style={{ background: 'rgba(0,0,0,0.06)', padding: '0.0625rem 0.25rem', margin: '0 0.25rem' }}>Test accreditations</code>
            (per <code>test-accreditation-frs.md</code> v5). Editing requires the <code>TEST_CATALOG_MANAGE</code> permission. This page surfaces the same data for inspectors and QA Officers from within the QA menu without granting edit rights.
          </div>

          {/* Summary banner (per test-accreditation-frs.md FR-22) */}
          {(expiredCount > 0 || expiringCount > 0) && (
            <div style={{ background: '#fff1c2', borderLeft: '3px solid #f1c21b', padding: '0.625rem 0.875rem', marginBottom: '1.25rem', fontSize: '0.8125rem', color: '#6f4700' }}>
              <strong>{expiredCount} bodies expired</strong> · <strong>{expiringCount} body expiring in the next 60 days</strong> · <strong>{totalEnrollments} test enrollments affected</strong>
            </div>
          )}

          {/* Accrediting bodies — body-level summary cards */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: '0.75rem' }}>
            <h2 style={{ fontSize: '1rem', fontWeight: 600, margin: 0 }}>Accrediting bodies</h2>
            <button className="export-btn">Manage in Admin ↗</button>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', marginBottom: '2rem' }}>
            {ACCRED_BODIES.map(b => {
              const status = statusForBody(b);
              const statusColor = status.kind === 'green' ? '#198038'
                                : status.kind === 'amber' ? '#f1c21b'
                                : status.kind === 'red'   ? '#da1e28'
                                : '#6f6f6f';
              const statusIcon  = status.kind === 'green' ? '✓'
                                : status.kind === 'amber' ? '⚠'
                                : status.kind === 'red'   ? '✗'
                                : '—';
              return (
                <div key={b.id} style={{ background: '#fff', border: '1px solid #e0e0e0', padding: '1rem', display: 'grid', gridTemplateColumns: '120px 1fr auto', gap: '1rem', alignItems: 'start' }}>
                  {/* Logo placeholder */}
                  <div style={{ width: 100, height: 60, background: b.logoBg, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.75rem', fontWeight: 600, opacity: b.active ? 1 : 0.4 }}>
                    {b.code}
                  </div>

                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '0.5rem', flexWrap: 'wrap' }}>
                      <h3 style={{ margin: 0, fontSize: '1rem' }}>{b.name}</h3>
                      <span className="severity-pill" style={{
                        background: status.kind === 'green' ? '#defbe6' : status.kind === 'amber' ? '#fff1c2' : status.kind === 'red' ? '#ffd7d9' : '#e8e8e8',
                        color: statusColor, fontWeight: 600, padding: '0.0625rem 0.5rem',
                      }}>
                        {statusIcon} {status.label}
                      </span>
                      <code style={{ background: '#f4f4f4', padding: '0.0625rem 0.375rem', fontSize: '0.75rem', color: '#525252' }}>{b.code}</code>
                    </div>
                    <div style={{ fontSize: '0.8125rem', color: '#525252', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.25rem 1rem' }}>
                      <div><strong>Logo visibility:</strong> {visibilitySummary(b)}</div>

                    </div>
                    <div style={{ fontSize: '0.75rem', color: '#6f6f6f', marginTop: '0.5rem' }}>

                  </div>

                  <button className="export-btn" style={{ alignSelf: 'flex-start' }}>View enrolled tests ↗</button>
                </div>
              );
            })}
          </div>

          {/* Test accreditations pivot — read-only summary */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: '0.75rem' }}>
            <h2 style={{ fontSize: '1rem', fontWeight: 600, margin: 0 }}>Test accreditations (pivot)</h2>
            <button className="export-btn">Open full pivot in Admin ↗</button>
          </div>
          <p style={{ fontSize: '0.8125rem', color: '#525252', margin: '0 0 0.75rem 0' }}>

          <table className="detail-table">
            <thead><tr><th>Code</th><th>Test</th><th>Section</th><th>Accrediting body</th><th>Status</th></tr></thead>
            <tbody>
              {[
                ['CBC',     'Complete Blood Count',           'Hematology',    'ISO 15189 (SANAS)', statusForBody(ACCRED_BODIES[0])],
                ['CBC',     'Complete Blood Count',           'Hematology',    'SANAS General',     statusForBody(ACCRED_BODIES[1])],
                ['HGB',     'Hemoglobin',                     'Hematology',    'ISO 15189 (SANAS)', statusForBody(ACCRED_BODIES[0])],
                ['GLUC',    'Glucose, serum',                 'Chemistry',     'ISO 15189 (SANAS)', statusForBody(ACCRED_BODIES[0])],
                ['GLUC',    'Glucose, serum',                 'Chemistry',     'SANAS General',     statusForBody(ACCRED_BODIES[1])],

                const status = r[4];
                const bg = status.kind === 'green' ? '#defbe6' : status.kind === 'amber' ? '#fff1c2' : status.kind === 'red' ? '#ffd7d9' : '#e8e8e8';

            <div className="leaf-tile">
              <h3>Internal audit</h3>
              <p>Last reviewed: 2025-Q4 · <a style={{ color:'#0f62fe' }}>Record review</a></p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/nce-register')}>
              <h3>Open critical NCEs <span style={{ color:'#da1e28', marginLeft: 'auto' }}>✗</span></h3>
              <p>5 pending acknowledgment</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/capa-register')}>
              <h3>Open CAPAs</h3>
              <p>12 in progress · 3 overdue</p>
            </div>
          </div>

          {/* FRS / spec reference */}
          <div style={{ marginTop: '2rem', padding: '1rem', background: '#fff', border: '1px solid #e0e0e0', fontSize: '0.8125rem', color: '#525252' }}>
            <h3 style={{ fontSize: '0.875rem', fontWeight: 600, margin: '0 0 0.5rem 0', color: '#161616' }}>Implementation reference</h3>
            <p style={{ margin: '0 0 0.5rem 0' }}>
              The canonical specification for accreditation management is <code style={{ background: '#f4f4f4', padding: '0.0625rem 0.25rem' }}>test-accreditation-frs.md</code> (v5). It defines:
            </p>
            <ul style={{ margin: '0 0 0.5rem 1.5rem', padding: 0 }}>
              <li>Two admin pages under Test Catalog Management (Accrediting bodies CRUD; Test accreditations pivot)</li>
              <li>Per-body <code>expires_on</code>; per-(test, body) pure join enrollment</li>
              <li>Logo visibility modes: <code>ANY_ACCREDITED_TEST</code> (default) and <code>PERCENTAGE</code> (with threshold)</li>
              <li>Conditional logo rendering on patient reports + automated notes line</li>
              <li>Audit logging on all create/edit/delete/enrollment changes</li>
            </ul>
            <p style={{ margin: 0 }}>
              This QMS view is purely a read-only window into the same <code>accrediting_body</code> + <code>test_accreditation</code> tables. No additional schema. Per the v0.5 versioning plan, accreditation lands in <strong>v2 — community may lead the build.</strong>
            </p>
          </div>
        </Fragment>
      );
    }

    /* ---------------------------------- E-Sig Log (carry from v2) ---------------------------------- */

    function ESigLog() {
      return (
        <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'QMS & Improvement', target: '/qa/qms' }, { label: 'E-Sig Log' }]} />
          <h1 className="page-title">Electronic Signature Log</h1>
          <p className="page-sub">Read-only log of every e-signature event. Reads from existing <code>electronic_signature</code> table.</p>

          <div className="detail-filters">
            <span className="filter">Date range: Rolling 30d</span>
            <span className="filter">Signer: All</span>
            <span className="filter">Action: All</span>
            <span className="filter">Artifact type: All</span>
            <span className="filter add">+ Add filter</span>
            <span className="spacer"></span>
            <button className="export-btn">⬇ Export CSV</button>
            <button className="export-btn">⬇ Export PDF</button>
          </div>

          <table className="detail-table">
            <thead><tr><th>When</th><th>Signer</th><th>Action</th><th>Artifact</th><th>Reason</th></tr></thead>
            <tbody>
              {[
                ['2026-04-23 10:14','A. Johnson · Lab Tech','Validated','validated','Result R-44218','Routine validation'],
                ['2026-04-23 09:52','M. Garcia · QA Officer','Acknowledged','acknowledged','NCE-20260423-007','Critical hemolysis — investigating'],
                ['2026-04-23 09:41','J. Smith · Lab Tech','Amended','amended','Result R-44209','Corrected calculation error'],
                ['2026-04-23 08:33','L. Tran · Lab Tech','Released','released','Result R-44196','Validated and released'],
                ['2026-04-22 17:08','J. Smith · Lab Tech','Rejected','rejected','Sample LAB-26-04388','Hemolysis'],
                ['2026-04-22 15:48','A. Johnson · Lab Tech','Signed off','signed-off','QC run QC-2026-04-22-AM','All within control limits'],
              ].map((r,i) => (
                <tr key={i}>
                  <td>{r[0]}</td>
                  <td>{r[1]}</td>
                  <td><span className={`action-pill ${r[3]}`}>{r[2]}</span></td>
                  <td><span className="nce-link">{r[4]}</span></td>
                  <td>{r[5]}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Fragment>
      );
    }

    /* ---------------------------------- Audit Trail (rehome stub) ---------------------------------- */

    function AuditTrail() {
      return (
        <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'QMS & Improvement', target: '/qa/qms' }, { label: 'Audit Trail' }]} />
          <h1 className="page-title">Audit Trail</h1>
          <p className="page-sub">Configuration / record audit log. Rehomed from Admin; cross-link preserved.</p>
          <div className="stub-app-frame">
            <div className="frame-title">Existing Audit Trail UI renders here</div>
            Same component, same data. Only the IA position changed.
          </div>
        </Fragment>
      );
    }

    function QMSLanding() {
      return (
        <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'QMS & Improvement' }]} />
          <h1 className="page-title">QMS &amp; Improvement</h1>
          <p className="page-sub">Quality management system pillar.</p>
          <div className="leaf-grid">
            <div className="leaf-tile" onClick={() => go('/qa/qms/nce-register')}>
              <h3>NCE Register</h3><p>Modern register UI. List, filter, detail, batch actions.</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/nce-analytics')}>
              <h3>NCE Analytics</h3><p>4 KPIs, 9 charts, 6 reports. Pareto root-cause analysis.</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/capa-register')}>
              <h3>CAPA Register</h3><p>All CAPAs across all NCEs. Bulk reassign + bulk mark complete.</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/accreditation')}>
              <h3>Accreditation Status</h3><p>Read-only summary of accrediting bodies + per-test enrollments. CRUD lives under Admin → Test Catalog Management (per <code>test-accreditation-frs.md</code> v5).</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/audit-trail')}>
              <h3>Audit Trail</h3><p>Configuration and record-change audit log.</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qms/esig-log')}>
              <h3>Electronic Signature Log</h3><p>Filterable log of every e-signature event. CSV/PDF export.</p>
            </div>
          </div>
        </Fragment>
      );
    }

    function QILanding() {
      return (
        <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'Quality Indicators' }]} />
          <h1 className="page-title">Quality Indicators</h1>
          <p className="page-sub">Pillar-3 indicators and configuration.</p>
          <div className="leaf-grid">
            <div className="leaf-tile" onClick={() => go('/qa/qi/dashboard')}>
              <h3>QI Dashboard</h3><p>5 KPI tiles incl. Critical Callback Compliance opt-in. Heatmap, Pareto, per-test breakdown on detail pages.</p>
            </div>
            <div className="leaf-tile" onClick={() => go('/qa/qi/config')}>
              <h3>QI Configuration</h3><p>Enable/disable indicators. Configure thresholds. Per-test overrides.</p>
            </div>
          </div>
        </Fragment>
      );
    }

    /* ---------------------------------- Routing dispatch ---------------------------------- */

    function App() {
      const route = useRoute();
      let body;

      if (route.kind === 'overview') body = <QAOverview />;
      else if (route.kind === 'pillar-landing') {
        if (route.pillar === 'qc') body = <QCLanding />;
        else if (route.pillar === 'eqa') body = <EQALanding />;
        else if (route.pillar === 'qi') body = <QILanding />;
        else if (route.pillar === 'qms') body = <QMSLanding />;
        else body = <QAOverview />;
      }
      else if (route.kind === 'leaf') {
        const key = `${route.pillar}/${route.leaf}`;
        if (key === 'qc/run-review') body = <RunReview />;
        else if (key === 'qc/westgard') body = <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'Statistical QC', target: '/qa/qc' }, { label: 'Westgard Rules' }]} />
          <h1 className="page-title">Westgard Rules</h1>
          <div className="stub-app-frame"><div className="frame-title">Westgard Rules configuration UI</div>Multi-rule per-test config (1-2s, 1-3s, 2-2s, R-4s, 4-1s, 10-x).</div>
        </Fragment>;
        else if (key === 'qc/qc-lots') body = <Fragment>
          <Crumb items={[{ label: 'Quality Assurance', target: '/qa/overview' }, { label: 'Statistical QC', target: '/qa/qc' }, { label: 'QC Lot Management' }]} />
          <h1 className="page-title">QC Lot Management</h1>
          <p className="page-sub">Target / SD governance per QC lot. Lot rollover, sigma metrics, shift detection.</p>
          <div className="stub-app-frame"><div className="frame-title">QC Lot Management</div>Lot inventory · target/SD by level · rollover wizard · sigma + shift detection (deferred from v1; v13+).</div>
        </Fragment>;
        else if (key === 'eqa/my-eqa') body = <MyEQA />;
        else if (key === 'eqa/lab-performance') body = <LabPerformance />;
        else if (key === 'eqa/follow-up') body = <FollowUpQueue />;
        else if (key === 'eqa/competency') body = <AnalystCompetency />;
        else if (key === 'eqa/program-mgmt') body = <ProgramMgmt />;
        else if (key === 'qi/dashboard') {
          // Dashboard tile detail drilling: /qa/qi/dashboard/<tile>
          if (route.rest && route.rest.length > 0) {
            const tile = route.rest[0];
            if (tile === 'tat') body = <TATDetail />;
            else if (tile === 'rejection-rate') body = <RejectionRateDetail />;
            else if (tile === 'amendment-rate') body = <AmendmentRateDetail />;
            else if (tile === 'callback') body = <CallbackDetail />;
            else body = <QIDashboard />;
          } else body = <QIDashboard />;
        }
        else if (key === 'qi/config') body = <QIConfig />;
        else if (key === 'qms/nce-register') body = <NCERegister rest={route.rest} />;
        else if (key === 'qms/nce-analytics') body = <NCEAnalytics />;
        else if (key === 'qms/capa-register') body = <CAPARegister />;
        else if (key === 'qms/accreditation') body = <AccreditationStatus />;
        else if (key === 'qms/audit-trail') body = <AuditTrail />;
        else if (key === 'qms/esig-log') body = <ESigLog />;
        else body = <QAOverview />;
      } else {
        body = <QAOverview />;
      }

      return (
        <Fragment>
          <AppHeader />
          <div className="layout">
            <Rail route={route} />
            <main className="main">{body}</main>
          </div>
        </Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
