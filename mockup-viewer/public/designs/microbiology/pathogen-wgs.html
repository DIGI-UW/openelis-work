/* ---------- The shared Genomic result detail (FR-G1) ---------- */
function FindingsTable({ rows, setRows, editable }) {
  const fmtF = f => f == null ? '' : (Math.round(f * 1000) / 10) + '%';
  return (
    <div style={{ overflowX: 'auto' }}>
      <table className="t">
        <thead><tr>
          <th>{t('genomics.col.target', 'Target')}</th><th>{t('microbiology.admin.genomicTargets.col.informs', 'Informs')}</th>
          <th>{t('genomics.col.call', 'Call')}</th><th>{t('genomics.col.change', 'Change')}</th>
          <th>{t('genomics.col.frequency', 'Frequency')}</th><th>{t('genomics.col.depth', 'Depth')}</th>
          <th>{t('genomics.col.grade', 'Grade')}</th><th>{t('genomics.col.report', 'Report')}</th>
        </tr></thead>
        <tbody>{rows.map((r, i) => (
          <tr key={i}>
            <td className="mono">{r.target}{r.notInLib && <><br /><Tag kind="cool-gray">{t('genomics.tag.notInLibrary', 'Not in library')}</Tag></>}</td>
            <td>{r.informs}</td>
            <td><Tag kind={callKind(r.call)}>{r.call}</Tag>{r.call === 'Below threshold' && <Tag kind="purple">{t('genomics.tag.heteroresistance', 'Possible heteroresistance')}</Tag>}</td>
            <td className="mono">{[r.nt, r.aa].filter(Boolean).join('; ') || <span className="muted">none</span>}</td>
            <td>{fmtF(r.freq)}</td>
            <td>{r.depth == null ? '' : r.depth + 'x'}</td>
            <td>{r.grade}</td>
            <td><input type="checkbox" aria-label={`Report ${r.target}`} checked={r.report} disabled={!editable || r.call === 'No finding'}
              onChange={e => setRows(rows.map((x, j) => j === i ? { ...x, report: e.target.checked } : x))} /></td>
          </tr>))}</tbody>
      </table>
    </div>
  );
}

function GenomicDetail({ res, editable = true }) {
  const [reported, setReported] = useState(res.reported);
  const [other, setOther] = useState(res.other);
  const [sub, setSub] = useState(res.sub);
  const [showOther, setShowOther] = useState(false);
  const [showSub, setShowSub] = useState(res.sub.length > 0);
  const firstNames = l => l.slice(0, 3).map(x => x.target + (x.aa ? ' ' + x.aa : '')).join(', ') + (l.length > 3 ? ', …' : '');
  return (
    <div className="detail newmark">
      <Anno>New: Genomic result detail (FR-G1). The same panel opens on Results Entry, Validation and in the microbiology case. It is an inline row after the result components (D-011), not an accordion or modal.</Anno>
      {res.holds.map(([m, v], i) => <Notif key={i} kind="err" title={t('run.state.held', 'Held')}>{t('genomics.hold.rule', `${m} ${v}`)}. Clear by retest, or Accept despite failure with a reason (Runs FR-C5).</Notif>)}
      {res.warns.map(([title, msg, k], i) => <Notif key={i} kind={k} title={title}>{msg}</Notif>)}

      <h4>{t('genomics.detail.qc', 'Sequencing quality')}</h4>
      <div className="qcstrip">{res.qc.map(([m, v, r, verdict]) => (
        <div className="qcm" key={m}><div>{m}</div><div className="v">{v}</div><div className="r">Rule: {r}</div><Tag kind={verdictKind(verdict)}>{verdict}</Tag></div>))}</div>

      <h4>{t('genomics.detail.reported', 'Reported targets')} ({reported.length})</h4>
      <FindingsTable rows={reported} setRows={setReported} editable={editable} />

      <div className="btnrow">
        {other.length > 0 && <Btn kind="ghost" size="sm" onClick={() => setShowOther(!showOther)} aria-expanded={showOther}>
          {showOther ? 'Hide ' : ''}{t('genomics.detail.other', `Other findings (${other.length})`)}{!showOther && ': ' + firstNames(other)}</Btn>}
        {sub.length > 0 && <Btn kind="ghost" size="sm" onClick={() => setShowSub(!showSub)} aria-expanded={showSub}>
          {showSub ? 'Hide ' : ''}{t('genomics.detail.subThreshold', `Below threshold (${sub.length})`)}{!showSub && ': ' + firstNames(sub)}</Btn>}
        {other.length === 0 && sub.length === 0 && <span className="muted" style={{ fontSize: 14 }}>No other findings and nothing below threshold.</span>}
      </div>
      {showOther && <><h4>Other findings <span className="muted" style={{ fontWeight: 400 }}>not linked to this test; unticked unless you choose to report them</span></h4><FindingsTable rows={other} setRows={setOther} editable={editable} /></>}
      {showSub && <><h4>Below threshold <span className="muted" style={{ fontWeight: 400 }}>never change a drug call; always shown to the validator</span></h4><FindingsTable rows={sub} setRows={setSub} editable={editable} /></>}

      <h4>{t('genomics.detail.provenance', 'Provenance')}</h4>
      <div className="tile" style={{ marginBottom: 0 }}>
        <dl className="kv">
          <dt>{t('genomics.provenance.pipeline', 'Pipeline')}</dt><dd>{res.prov.pipeline}</dd>
          <dt>{t('genomics.provenance.catalogue', 'Catalogue')}</dt><dd>{res.prov.catalogue}</dd>
          <dt>{t('genomics.provenance.analysed', 'Analysed')}</dt><dd>{res.prov.analysed}</dd>
          <dt>{t('genomics.provenance.run', 'Run and barcode')}</dt><dd><a href="#run">{res.prov.runbc}</a></dd>
          <dt>Instrument</dt><dd>{res.prov.instr}</dd>
          <dt>Basecaller</dt><dd>{res.prov.basecaller}</dd>
          <dt>{t('genomics.provenance.rawData', 'Raw data')}</dt><dd className="mono">{res.prov.raw} <span className="muted">(reference only; reads are not stored in OpenELIS)</span></dd>
          <dt>Import</dt><dd>{res.prov.status}</dd>
        </dl>
      </div>
    </div>
  );
}

        <p className="sub" style={{ marginBottom: '.75rem' }}>{t('catalog.test.genomicTargets.help', 'Targets this test reports. Other findings are kept and shown to the validator.')}</p>
        {missing.map(d => <Notif key={d} kind="warn" title="Hint">{t('catalog.test.genomicTargets.hint.noTarget', `${d} has no target: findings for it will appear under Other findings.`)}</Notif>)}
        {canEdit && <Combo label="Add targets" options={mtbTargets.map(x => x.name).filter(n => !links.some(l => l.name === n))} value=""
          onChange={v => v && setLinks([...links, { name: v, rep: true, ex: '' }])} placeholder="Search M. tuberculosis complex targets" helper="Only targets of this test's organism or group are listed" />}
        <table className="t" style={{ marginTop: '1rem' }}><thead><tr><th>Order</th><th>Target</th><th>Informs</th><th>{t('catalog.test.genomicTargets.reportByDefault', 'Report by default')}</th><th>{t('catalog.test.genomicTargets.rollsUpTo', 'Explains')}</th><th></th></tr></thead>
          <tbody>{links.map((l, i) => { const tg = TARGETS0.find(x => x.name === l.name); return (
            <tr key={l.name}><td>{i + 1}</td><td className="mono">{l.name}</td><td>{tg ? tg.informs.join(', ') : ''}</td>
              <td><Toggle on={l.rep} onChange={v => canEdit && setLinks(links.map((x, j) => j === i ? { ...x, rep: v } : x))} label={l.rep ? 'On' : 'Off'} /></td>
              <td><select value={l.ex} disabled={!canEdit} aria-label={`Explains for ${l.name}`} onChange={e => setLinks(links.map((x, j) => j === i ? { ...x, ex: e.target.value } : x))} style={{ height: 32 }}>
                <option value="">No component</option>{drugs.map(d => <option key={d}>{d}</option>)}</select></td>
              <td>{canEdit && <Btn kind="ghost" size="sm" onClick={() => setLinks(links.filter((_, j) => j !== i))}>Unlink</Btn>}</td></tr>); })}</tbody></table>
        <Anno>Unlinking a target only affects new results; findings already stored keep their target. "Explains" ties a target to the per-drug component it sets, which is how low coverage on pncA makes Pyrazinamide read Insufficient coverage (FR-G7).</Anno>
      </div>

      <h2 className="sec">QC Targets</h2>
      <Fence label="Existing (specced): QC Targets section, one QC authoring section per test (D-058). New: sequencing rule types (FR-B5).">
        <table className="t newmark"><thead><tr><th>Rule</th><th>Value</th><th>On failure</th></tr></thead>
          <tbody>{rules.map(([k, label, v, o], i) => (
            <tr key={k}><td>{t(k, label)}</td>
              <td><input className="bc" style={{ width: k.endsWith('Species') ? 280 : 110, fontFamily: 'inherit' }} defaultValue={v} disabled={!canEdit} aria-label={label} /></td>
              <td><select value={o} disabled={!canEdit} onChange={e => setRules(rules.map((x, j) => j === i ? [x[0], x[1], x[2], e.target.value] : x))} style={{ height: 32 }} aria-label={`On failure for ${label}`}>
                <option>Hold</option><option>Warn</option></select></td></tr>))}</tbody></table>
        <Anno>Values are this lab's. The ones shown follow TB-Profiler's published defaults as an example; nothing is seeded. A Hold follows Runs per-test hold rules (D-053, D-056).</Anno>
      </Fence>
      {canEdit && <div className="btnrow"><Btn kind="primary">{t('common.save', 'Save')}</Btn><Btn kind="ghost">{t('common.cancel', 'Cancel')}</Btn></div>}
    </>
  );
}

/* ---------- View 3: Sequencing run on the Results worklist (FR-D) ---------- */
function RunView({ ntcFail }) {
  const [rows, setRows] = useState([
    { lab: 'CPHL26-005120', who: 'Kila, Joseph', sample: 'Sputum', test: 'MTB WGS (sputum, direct)', org: 'M. tuberculosis complex', bc: 'NB07', st: 'Waiting' },
    { lab: 'CPHL26-004812-1.1', who: 'Tau, Michael (ISO-1)', sample: 'Isolate', test: 'MTB WGS (isolate)', org: 'M. tuberculosis complex', bc: 'NB08', st: 'Waiting' },
    { lab: 'CPHL26-004977-1.1', who: 'Kerowa, Anna (ISO-1)', sample: 'Isolate', test: 'MTB WGS (isolate)', org: 'M. tuberculosis complex', bc: '', st: 'Awaiting sequencing' },
    { lab: 'CPHL26-004831-2.1', who: 'Kaia, Ruth (ISO-1)', sample: 'Isolate', test: 'Bacterial WGS (isolate)', org: 'Enterobacterales', bc: 'NB09', st: 'Waiting' },
    { lab: 'CPHL26-005002-1.1', who: 'Sere, Peter (ISO-2)', sample: 'Isolate', test: 'Bacterial WGS (isolate)', org: 'Enterobacterales', bc: '', st: 'Awaiting sequencing' },
  ]);
  const dup = bc => bc && rows.filter(r => r.bc.toUpperCase() === bc.toUpperCase()).length > 1;
  const dups = rows.filter(r => dup(r.bc));
  const assign = () => { const used = new Set(rows.map(r => r.bc.toUpperCase()).filter(Boolean)); let n = 1; const next = () => { while (used.has('NB' + String(n).padStart(2, '0'))) n++; const v = 'NB' + String(n).padStart(2, '0'); used.add(v); return v; }; setRows(rows.map(r => r.bc ? r : { ...r, bc: next() })); };
  const held = ntcFail;
  return (
    <>
      <div className="route">Route: /Results?run=RUN-2026-0412 (existing Runs route, no new parameter)</div>
      <Crumbs items={['Home', 'Results']} />
      <h1 className="pt">Results</h1>
      <p className="sub">Run RUN-2026-0412 · Workplan batch · TB lab unit · opened 13 Oct 2026 08:40 by R. Opa</p>
      <Anno>Existing Runs header (OGC-1200 FR-E1): three Tiles, QC, Run settings, Exceptions. New for sequencing: flowcell, library and barcode kit in Run settings, the Barcode column, Assign barcodes and Download sample sheet. This run mixes MTB WGS and Bacterial WGS, allowed because both tests use a Sequencing method (FR-D2, a Runs change).</Anno>

      <div className="grid3">
        <div className="tile">
          <h3 className="sec3" style={{ marginTop: 0 }}>QC</h3>
          <div style={{ fontSize: 14, marginBottom: 6 }}>{t('run.control.negative', 'Negative control')} NTC-1 · {held ? '48,210 reads' : '312 reads'} (rule: at most 1,000) <Tag kind={held ? 'red' : 'green'}>{held ? 'Fail' : 'Pass'}</Tag></div>
          <div style={{ fontSize: 14 }}>{t('run.control.positive', 'Positive control')} H37Rv · species M. tuberculosis complex, all drugs susceptible <Tag kind="green">Pass</Tag></div>
          <p className="muted" style={{ fontSize: 12, marginBottom: 0 }}>Verdicts per test within the run (D-053). Covers: MTB WGS (isolate), MTB WGS (sputum, direct), Bacterial WGS (isolate).</p>
        </div>
        <div className="tile">
          <h3 className="sec3" style={{ marginTop: 0 }}>Run settings</h3>
          <dl className="kv">
            <dt>Method</dt><dd>Sequencing, Nanopore</dd>
            <dt>Instrument</dt><dd>MinION Mk1C MN42781</dd>
            <dt>{t('run.seq.flowcell', 'Flowcell')}</dt><dd>FLO-MIN114, lot 2026-0912-A</dd>
            <dt>{t('run.seq.libraryKit', 'Library kit')}</dt><dd>SQK-NBD114.24, lot 26-118</dd>
            <dt>{t('run.seq.barcodeKit', 'Barcode kit')}</dt><dd>Native Barcoding 24 (NB01 to NB24)</dd>
            <dt>{t('run.seq.loaded', 'Loaded')}</dt><dd>13 Oct 2026 11:15</dd>
          </dl>
          <p className="muted" style={{ fontSize: 12, marginBottom: 0 }}>Lots picked from Inventory (Runs reagent-lot provenance).</p>
        </div>
        <div className="tile">
          <h3 className="sec3" style={{ marginTop: 0 }}>Exceptions</h3>
          {held ? <Notif kind="err" title="Held: 5 rows.">Negative control NTC-1 had 48,210 reads (rule: at most 1,000). Retest, or Accept despite failure with a reason.</Notif>
            : <><div style={{ fontSize: 14 }}>CPHL26-005120: pncA 8x (rule: at least 30x per target) <Tag kind="warm-gray">Warn</Tag></div>
              <div style={{ fontSize: 14, marginTop: 6 }}>1 file in Stuck analyzer events: {t('genomics.unmatched.barcode', 'Barcode NB10 in file, barcode NB11 on run row')} (CPHL26-004990)</div></>}
          <p className="muted" style={{ fontSize: 12, marginBottom: 0 }}>3 of 5 rows have results waiting · 0 dispositioned</p>
        </div>
      </div>

      {dups.length > 1 && <Notif kind="err" title="Duplicate barcode.">{t('run.seq.duplicateBarcode', `Rows ${dups[0].lab} and ${dups[1].lab} both have barcode ${dups[0].bc}.`)} Each barcode can be used once per run.</Notif>}

      <div className="toolbar">
        <Fence label="Existing worklist filter chips (Runs FR-E1a)"><span><Tag kind="high-contrast">All 5</Tag><Tag kind="gray">Needs review 3</Tag><Tag kind="gray">Held {held ? 5 : 0}</Tag><Tag kind="gray">Exceptions {held ? 5 : 1}</Tag></span></Fence>
        <span style={{ flex: 1 }} />
        <Btn kind="tertiary" onClick={assign}>{t('run.seq.assignBarcodes', 'Assign barcodes in order')}</Btn>
        <Btn kind="secondary">{t('run.seq.sampleSheet', 'Download sample sheet')}</Btn>
      </div>
      <table className="t">
        <thead><tr><th>Lab number</th><th>Patient / isolate</th><th>Sample</th><th>Test</th><th>Expected organism</th><th>{t('run.seq.barcode', 'Barcode')}</th><th>State</th></tr></thead>
        <tbody>{rows.map((r, i) => (
          <tr key={r.lab}><td className="mono">{r.lab}</td><td>{r.who}</td><td>{r.sample}</td><td>{r.test}</td><td>{r.org}</td>
            <td><input className={`bc${dup(r.bc) ? ' bad' : ''}`} value={r.bc} aria-label={`Barcode for ${r.lab}`} aria-invalid={dup(r.bc)} onChange={e => setRows(rows.map((x, j) => j === i ? { ...x, bc: e.target.value } : x))} /></td>
            <td>{held ? <Tag kind="red">Held</Tag> : r.st === 'Waiting' ? <Tag kind="purple">Waiting in RUN-2026-0412</Tag> : <Tag kind="blue">Awaiting sequencing</Tag>}</td></tr>))}</tbody>
      </table>
      <div className="tile" style={{ marginTop: '1rem' }}>
        <h3 className="sec3" style={{ marginTop: 0 }}>Sample sheet (what Download gives the bioinformatician)</h3>
        <pre className="mono" style={{ margin: 0, whiteSpace: 'pre-wrap' }}>barcode,lab_number,sample_item,test,expected_organism{'\n'}{rows.map(r => `${r.bc || '(none)'},${r.lab.split('-').slice(0, 2).join('-')},${r.lab},${r.test},${r.org}`).join('\n')}</pre>
      </div>
    </>
  );
}

      <Fence label="Existing: Validation worklist rows, lanes and row QC slot (validation clearance rule, D-057, D-061). Abbreviated drawing; only the expanded genomic detail is new.">
        <table className="t">
          <thead><tr><th>Lab number</th><th>Patient</th><th>Test</th><th>Lab unit</th><th>Run</th><th>QC</th><th>State</th></tr></thead>

                <td>{r.holds.length ? <Tag kind="red">Held</Tag> : r.warns.some(w => w[2] === 'warn') ? <Tag kind="warm-gray">Warning</Tag> : <Tag kind="green">No failure</Tag>}</td>
                <td>{done[r.id] ? <Tag kind="teal">Validated</Tag> : <Tag kind="purple">Awaiting validation</Tag>}</td>
              </tr>
              {open === r.id && <tr className="exp"><td colSpan={7}>
                <div style={{ padding: '1rem 1rem 0' }}><Components comps={r.components} /></div>
                <GenomicDetail res={r} editable={canValidate && !done[r.id]} />
                <div className="btnrow" style={{ padding: '0 1rem 1rem' }}>
                  {canValidate ? <>
                    <Btn kind="primary" disabled={r.holds.length > 0 || done[r.id]} onClick={() => setDone({ ...done, [r.id]: true })}>Validate</Btn>
                    <Btn kind="secondary" disabled={done[r.id]}>Return with reason</Btn>
                    {r.holds.length > 0 && <span className="muted" style={{ alignSelf: 'center', fontSize: 14 }}>Held rows can't be validated until the hold is cleared.</span>}
                  </> : <span className="muted">Validating needs the result:validate privilege for this lab unit.</span>}
                </div>
              </td></tr>}
            </React.Fragment>))}</tbody>
        </table>
      </Fence>
    </>
  );
}

/* ---------- App shell ---------- */
const VIEWS = [
  ['targets', 'Admin', 'Genomic targets'],
  ['catalog', 'Admin', 'Test catalog: MTB WGS'],
  ['run', 'Results', 'Sequencing run'],
  ['validation', 'Results', 'Validation: WGS rows'],
  ['case', 'Microbiology', 'Case: Additional testing'],
  ['report', 'Reports', 'Patient report'],
];

function App() {
  const [view, setView] = useState('targets');
  const [notes, setNotes] = useState(true);
  const [role, setRole] = useState('manager');
  const [ntcFail, setNtcFail] = useState(false);
  const canEdit = role === 'manager';
  const canValidate = role !== 'reception';
  let group = '';
  return (
    <div className={notes ? '' : 'hide-anno'}>
      <div className="preview-banner">
        <span>Visual Preview · Pathogen WGS · OpenELIS design mockup · not a live application</span>
        <label><input type="checkbox" checked={notes} onChange={e => setNotes(e.target.checked)} /> Design notes</label>
        <label>Signed in as <select value={role} onChange={e => setRole(e.target.value)} style={{ fontSize: 12 }}>
          <option value="manager">Catalog manager + validator</option><option value="validator">Validator (no test:configure)</option><option value="reception">Reception (no result rights)</option></select></label>
        <label><input type="checkbox" checked={ntcFail} onChange={e => setNtcFail(e.target.checked)} /> Scenario: negative control failed</label>
      </div>
      <div className="topbar"><b>OpenELIS Global</b><span className="muted">· Central Public Health Laboratory, Port Moresby</span></div>
      <div className="shell">
        <nav className="sidenav" aria-label="Preview views">
          {VIEWS.map(([k, g, label]) => {
            const head = g !== group ? <div className="grp">{g}</div> : null; group = g;
            return <React.Fragment key={k}>{head}<button className={view === k ? 'on' : ''} onClick={() => setView(k)} aria-current={view === k ? 'page' : undefined}>{label}</button></React.Fragment>;
          })}
        </nav>
        <main className="content">
          {view === 'targets' && <TargetsView canEdit={canEdit} />}
          {view === 'catalog' && <CatalogView canEdit={canEdit} />}
          {view === 'run' && (role === 'reception' ? <Notif kind="info" title="No access.">Sequencing runs are on the Results worklist, which needs Results rights for the TB lab unit (D-043).</Notif> : <RunView ntcFail={ntcFail} />)}
          {view === 'validation' && <ValidationView canValidate={canValidate} key={role} />}
          {view === 'case' && <CaseView canValidate={canValidate} key={role} />}
          {view === 'report' && <ReportView />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
