<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu Configuration — Preview</title>
<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #f4f4f4;
    --surface: #ffffff;
    --surface-2: #f9f9f9;
    --surface-muted: #f4f4f4;
    --text: #161616;
    --text-secondary: #525252;
    --text-helper: #6f6f6f;
    --border: #e0e0e0;
    --border-strong: #8d8d8d;
    --accent-info: #0f62fe;
    --accent-warn: #f1c21b;
    --accent-warn-bg: #fcf4d6;
    --accent-info-bg: #edf5ff;
    --accent-success: #24a148;
    --accent-success-bg: #defbe6;
    --row-dirty: #d0e2ff;
    --cyan-bg: #dffaff;
    --cyan-fg: #08507a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--text); }
  .page-frame { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
  .crumbs { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
  .crumbs a { color: var(--accent-info); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  h1 { font-size: 2rem; font-weight: 300; margin: 0 0 0.25rem; color: var(--text); }
  h3 { font-size: 1.125rem; font-weight: 500; margin: 0; color: var(--text); }
  .subtitle { color: var(--text-secondary); margin: 0 0 1.5rem; font-size: 0.875rem; max-width: 820px; line-height: 1.5; }

  .notice { margin-bottom: 1rem; padding: 0.875rem 1rem; border-left: 4px solid var(--accent-info); background: var(--accent-info-bg); border-radius: 2px; }
  .notice.success { border-color: var(--accent-success); background: var(--accent-success-bg); }
  .notice.warn { border-color: var(--accent-warn); background: var(--accent-warn-bg); }
  .notice strong { font-size: 0.875rem; color: var(--text); }
  .notice .sub { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); }
  .notice a { color: var(--accent-info); }

  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  .toolbar-grid { display: grid; grid-template-columns: 2fr auto; gap: 1rem; align-items: end; margin-bottom: 0.75rem; }
  .field-label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
  .input-wrap { background: var(--surface-2); height: 2.5rem; border-bottom: 1px solid var(--border-strong); display: flex; align-items: center; padding: 0 0.75rem; }
  .input-wrap input { flex: 1; border: 0; background: transparent; font: inherit; outline: 0; color: var(--text); }
  .input-wrap .ico { color: var(--text-secondary); margin-right: 0.5rem; }
  .small-buttons { display: flex; gap: 0.5rem; }
  .btn { padding: 0.5rem 0.875rem; font-size: 0.8125rem; cursor: pointer; border: 0; font-family: inherit; border-radius: 2px; }
  .btn.ghost { background: transparent; color: var(--accent-info); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn.primary { background: var(--accent-info); color: white; padding: 0.625rem 1rem; font-size: 0.875rem; }
  .btn.primary:hover:not(:disabled) { background: #0050d9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Tree */
  .tree { border-top: 1px solid var(--border); padding-top: 0.5rem; }
  .tree-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; transition: background 0.1s; }
  .tree-row:hover { background: var(--surface-2); }
  .tree-row.dirty { background: var(--row-dirty) !important; }
  .chev-btn { background: transparent; border: 0; cursor: pointer; padding: 0; color: var(--text-secondary); font-size: 0.75rem; width: 1.25rem; height: 1.25rem; display: inline-flex; align-items: center; justify-content: center; }
  .chev-btn:hover { color: var(--text); }
  .leaf-spacer { display: inline-block; width: 1.25rem; }
  .cb { display: inline-flex; align-items: center; justify-content: center; width: 1.125rem; height: 1.125rem; border: 1px solid var(--border-strong); border-radius: 2px; cursor: pointer; background: var(--surface); flex-shrink: 0; }
  .cb.checked { background: var(--text); border-color: var(--text); color: white; }
  .cb.checked::after { content: '✓'; font-size: 0.875rem; line-height: 1; }
  .node-label { font-size: 0.875rem; }
  .node-label.depth-0 { font-weight: 600; }

  .tag { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 500; }
  .tag.gray { background: #e0e0e0; color: #393939; }
  .tag.cyan { background: var(--cyan-bg); color: var(--cyan-fg); }
  .tag.hidden { background: #e0e0e0; color: #6f6f6f; }

  /* Billing inline expansion */
  .billing-detail { padding: 0.875rem 1rem 0.875rem 3rem; background: var(--surface-2); border-left: 3px solid var(--accent-info); margin: 0.125rem 0 0.375rem; }
  .billing-detail input { width: 100%; max-width: 480px; font: inherit; font-size: 0.875rem; background: var(--surface); border: 0; border-bottom: 1px solid var(--border-strong); padding: 0.5rem 0.75rem; outline: 0; color: var(--text); }
  .billing-detail .helper { font-size: 0.75rem; color: var(--text-helper); margin-top: 0.25rem; }

  .actions-bar { display: flex; gap: 0.5rem; margin-top: 1.5rem; }

  .meta-panel { margin-top: 2rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-info); border-radius: 2px; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.6; }
  .meta-panel strong { color: var(--text); }
  .meta-panel code { background: var(--surface-muted); padding: 0.0625rem 0.375rem; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const MAIN_TREE = [
  { id: 'home', label: 'Home', active: true },
  { id: 'generic-sample', label: 'Generic Sample', active: true, children: [
    { id: 'create-order', label: 'Create Order', active: true },
    { id: 'edit-order', label: 'Edit Order', active: true },
    { id: 'import-samples', label: 'Import Samples', active: true },
    { id: 'enter-results', label: 'Enter Results', active: true },
    { id: 'sample-mgmt', label: 'Sample Management', active: true },
  ]},
  { id: 'order', label: 'Order', active: true, children: [
    { id: 'add-order', label: 'Add Order', active: true, children: [
      { id: 'dashboard', label: 'Dashboard', active: true },
      { id: 'enter-order', label: 'Enter Order', active: true },
      { id: 'collect-sample', label: 'Collect Sample', active: true },
      { id: 'label-store', label: 'Label & Store', active: true },
      { id: 'qa-review', label: 'QA Review', active: true },
    ]},
    { id: 'study-order', label: 'Study', active: true, children: [
      { id: 'study-initial-entry', label: 'Initial Entry', active: true },
      { id: 'study-double-entry', label: 'Double Entry', active: true },
      { id: 'study-view', label: 'View', active: true },
      { id: 'study-electronic', label: 'Electronic Orders', active: true },
    ]},
    { id: 'incoming-orders', label: 'Incoming Orders', active: true },
    { id: 'batch-order-entry', label: 'Batch Order Entry', active: true },
    { id: 'barcode-order', label: 'Barcode', active: true },
  ]},
  { id: 'patient', label: 'Patient', active: true, children: [
    { id: 'p-add-edit', label: 'Add/Edit Patient', active: true },
    { id: 'p-history', label: 'Patient History', active: true },
    { id: 'p-study', label: 'Study', active: true, children: [
      { id: 'p-initial', label: 'Initial Entry', active: true },
      { id: 'p-double', label: 'Double Entry', active: true },
      { id: 'p-edit', label: 'Edit', active: true },
      { id: 'p-view', label: 'View', active: true },
    ]},
    { id: 'p-merge', label: 'Merge Patient', active: true },
  ]},
  { id: 'storage', label: 'Storage', active: true, children: [
    { id: 'storage-mgmt', label: 'Storage Management', active: true },
    { id: 'sample-items', label: 'Sample Items', active: true },
    { id: 'cold-storage', label: 'Cold Storage Monitoring', active: false, children: [
      { id: 'cs-dashboard', label: 'Dashboard', active: false },
      { id: 'cs-corrective', label: 'Corrective Actions', active: false },
    ]},
  ]},
  { id: 'analyzers', label: 'Analyzers', active: true, children: [
    { id: 'analyzer-list', label: 'Analyzers List', active: true },
    { id: 'error-dashboard', label: 'Error Dashboard', active: true },
    { id: 'qc', label: 'Quality Control', active: true, children: [
      { id: 'qc-dashboard', label: 'QC Dashboard', active: true },
      { id: 'qc-rules', label: 'Rule Configuration', active: true },
      { id: 'control-lots', label: 'Control Lots', active: true },
    ]},
  ]},
  { id: 'non-conform', label: 'Non-Conform', active: true, children: [
    { id: 'all-nces', label: 'All NCEs', active: true },
    { id: 'report-nce', label: 'Report Non-Conforming Event', active: true },
    { id: 'view-new-nces', label: 'View New Non-Conforming Events', active: true },
    { id: 'corrective-actions', label: 'Corrective actions', active: true },
  ]},
  { id: 'workplan', label: 'Workplan', active: true, children: [
    { id: 'wp-test-type', label: 'By Test Type', active: true },
    { id: 'wp-panel', label: 'By Panel', active: true },
    { id: 'wp-unit', label: 'By Unit', active: true },
    { id: 'wp-priority', label: 'By Priority', active: true },
  ]},
  { id: 'results', label: 'Results', active: true, children: [
    { id: 'r-unit', label: 'By Unit', active: true },
    { id: 'r-patient', label: 'By Patient', active: true },
    { id: 'r-order', label: 'By Order', active: true },
  ]},
  { id: 'validation', label: 'Validation', active: true, children: [
    { id: 'v-routine', label: 'Routine', active: true },
  ]},
  { id: 'reports', label: 'Reports', active: true, children: [
    { id: 'rep-routine', label: 'Routine', active: true },
    { id: 'rep-audit', label: 'Audit Trail', active: true },
  ]},
  { id: 'admin', label: 'Admin', active: true },
  { id: 'billing', label: 'Billing', active: false, hasUrl: true },
  { id: 'inventory', label: 'Inventory', active: true, children: [
    { id: 'inv-mgmt', label: 'Inventory Management', active: true },
  ]},
  { id: 'help', label: 'Help', active: true, children: [
    { id: 'h-manual', label: 'User Manual', active: true },
    { id: 'h-process', label: 'Process Documentation', active: true },
  ]},
];

function deepHasMatch(node, search) {
  if (!search) return true;
  if (node.label.toLowerCase().includes(search.toLowerCase())) return true;
  if (!node.children) return false;
  return node.children.some(c => deepHasMatch(c, search));
}
function collectParentIds(tree, acc = new Set()) {
  for (const n of tree) {
    if (n.children && n.children.length > 0) acc.add(n.id);
    if (n.children) collectParentIds(n.children, acc);
  }
  return acc;
}

function App() {
  const [tree, setTree] = useState(MAIN_TREE);
  const [billingUrl, setBillingUrl] = useState('');
  const [expanded, setExpanded] = useState(new Set(['generic-sample', 'order', 'patient', 'non-conform']));
  const [billingExpanded, setBillingExpanded] = useState(false);
  const [dirty, setDirty] = useState(new Set());
  const [billingUrlDirty, setBillingUrlDirty] = useState(false);
  const [search, setSearch] = useState('');
  const [savedNotice, setSavedNotice] = useState(false);

  const toggleNode = (nodeId) => {
    const recurse = (nodes) => nodes.map(n => {
      if (n.id === nodeId) return { ...n, active: !n.active };
      if (n.children) return { ...n, children: recurse(n.children) };
      return n;
    });
    setTree(recurse(tree));
    setDirty(prev => { const n = new Set(prev); n.add(nodeId); return n; });
  };
  const toggleExpand = (nodeId) => setExpanded(prev => { const n = new Set(prev); if (n.has(nodeId)) n.delete(nodeId); else n.add(nodeId); return n; });
  const expandAll = () => setExpanded(prev => { const n = new Set(prev); collectParentIds(tree).forEach(id => n.add(id)); return n; });
  const collapseAll = () => setExpanded(new Set());

  const onSave = () => { setDirty(new Set()); setBillingUrlDirty(false); setSavedNotice(true); setTimeout(() => setSavedNotice(false), 3000); };
  const onDiscard = () => { setTree(MAIN_TREE); setBillingUrl(''); setDirty(new Set()); setBillingUrlDirty(false); };

  const totalDirty = dirty.size + (billingUrlDirty ? 1 : 0);

  const renderNode = (node, depth = 0) => {
    const hasChildren = node.children && node.children.length > 0;
    const isExpanded = expanded.has(node.id);
    const isBilling = node.hasUrl;
    const isBillingOpen = isBilling && billingExpanded;
    const isDirty = dirty.has(node.id);
    if (search && !deepHasMatch(node, search)) return null;

    return (
      <React.Fragment key={node.id}>
        <div className={`tree-row${isDirty ? ' dirty' : ''}`}
             style={{ paddingLeft: `${0.75 + depth * 1.25}rem` }}>
          {hasChildren ? (
            <button className="chev-btn" onClick={() => toggleExpand(node.id)} title={isExpanded ? 'Collapse' : 'Expand'}>
              {isExpanded ? '▾' : '▸'}
            </button>
          ) : isBilling ? (
            <button className="chev-btn" onClick={() => setBillingExpanded(!isBillingOpen)} title={isBillingOpen ? 'Hide URL' : 'Edit URL'}>
              {isBillingOpen ? '▾' : '▸'}
            </button>
          ) : (<span className="leaf-spacer" />)}
          <button type="button" role="checkbox" aria-checked={node.active} aria-label={`Toggle ${node.label}`}
            className={`cb${node.active ? ' checked' : ''}`} onClick={() => toggleNode(node.id)} />
          <span className={`node-label depth-${depth}`}>{node.label}</span>
          {isBilling && <span className="tag cyan" style={{ marginLeft: '0.375rem' }}>Has URL</span>}
          {!node.active && <span className="tag hidden" style={{ marginLeft: '0.375rem' }}>Hidden</span>}
        </div>
        {isBilling && isBillingOpen && (
          <div className="billing-detail" style={{ marginLeft: `${0.75 + depth * 1.25}rem` }}>
            <label className="field-label">Billing URL</label>
            <input value={billingUrl}
              onChange={(e) => { setBillingUrl(e.target.value); setBillingUrlDirty(true); }}
              placeholder="https://billing.example.org" />
            <p className="helper">External billing system URL the Billing menu link points to.</p>
          </div>
        )}
        {hasChildren && isExpanded && node.children.map(c => renderNode(c, depth + 1))}
      </React.Fragment>
    );
  };

  return (
    <div className="page-frame">
      <div className="crumbs">
        <a href="#">Admin</a> &nbsp;/&nbsp; <a href="#">System Administration</a> &nbsp;/&nbsp; <span>Menu Configuration</span>
      </div>

      <h1>Menu Configuration</h1>
      <p className="subtitle">
        Control which top-level menus and submenu items appear in the OpenELIS sidebar. Uncheck a node to hide it; expand a parent to drill into its children.
      </p>

      <div className="notice">
        <strong>ⓘ This page is a navigation-scoped feature-flag editor.</strong>
        <div className="sub">Each menu node is "show this item or don't." For non-menu toggles (modules, integrations, workflow flags), see <a href="#">System Administration › Feature Flags</a>.</div>
      </div>

      {savedNotice && (
        <div className="notice success">
          <strong>✓ Menu configuration saved.</strong>
          <div className="sub">Affected admins will see the new menu on next page load.</div>
        </div>
      )}
      {totalDirty > 0 && (
        <div className="notice">
          <strong>Unsaved changes</strong>
          <div className="sub">{totalDirty} change{totalDirty === 1 ? '' : 's'} pending. Save or discard before leaving.</div>
        </div>
      )}

      <div className="section">
        <div className="toolbar-grid">
          <div>
            <label className="field-label">Search menu items</label>
            <div className="input-wrap">
              <span className="ico">🔍</span>
              <input placeholder='Find an item by name (e.g. "Patient", "QC")' value={search} onChange={(e) => setSearch(e.target.value)} />
            </div>
          </div>
          <div className="small-buttons">
            <button className="btn ghost" onClick={expandAll}>↕ Expand all</button>
            <button className="btn ghost" onClick={collapseAll}>↕ Collapse all</button>
          </div>
        </div>
        <div className="tree">
          {tree.map(n => renderNode(n, 0))}
        </div>
      </div>

      <div className="notice warn">
        <strong>Looking for Study menu configuration?</strong>
        <div className="sub">
          Study workflows (ARV, EID, VL, Indeterminate, Patient Status Report) are now gated by the{' '}
          <code>useRetroCIStudyForms</code> feature flag. Configure it in{' '}
          <a href="#">System Administration › Feature Flags</a>.
        </div>
      </div>

      <div className="actions-bar">
        <button className="btn primary" disabled={totalDirty === 0} onClick={onSave}>
          💾 Save changes{totalDirty > 0 ? ` (${totalDirty})` : ''}
        </button>
        <button className="btn ghost" disabled={totalDirty === 0} onClick={onDiscard}>
          ↺ Discard changes
        </button>
      </div>

      <div className="meta-panel">
        <strong>About this preview.</strong> Try:<br />
        • Click the <strong>▸ chevron next to "Billing"</strong> — inline-expands to show the Billing URL field (unique to that node since it has extra data)<br />
        • Toggle the checkbox next to <strong>"Cold Storage Monitoring"</strong> — see the dirty highlight<br />
        • Search <strong>"ARV"</strong> — filters the tree to matching nodes; but ARV lives in the Study sub-menu which is now gated by a feature flag<br />
        • Click <strong>"Expand all"</strong> — see the full menu hierarchy (4+ levels deep)
        <br /><br />
        <strong>Story B.2 of the admin MVP.</strong> Retires Global / Billing / Non-Conform / Patient Menu Configuration pages (audit C029, C032, C033, C034) — ALL consolidated into this single tree. Also retires MenuStatement Configuration when shipped (per Q2 decision).
        <br /><br />
        <strong>Study Menu Configuration retired entirely</strong> — gated by <code>useRetroCIStudyForms</code> feature flag (per Casey 2026-05-13). The Study menu and its hardcoded forms appear only when that flag is on; off by default for new deployments.
        <br /><br />
        <strong>Simplification insight:</strong> the 4 sub-menu pages (Billing, Non-Conform, Patient, Study) were all redundant with their corresponding top-level nodes in the Main tree. Each was just a duplicate view of "is this menu visible?" with one exception — Billing has an additional URL field. Solution: ONE tree, with the Billing node getting an inline-expansion affordance for its URL. Sub-menu pages dissolve.
        <br /><br />
        <strong>Conceptual frame:</strong> this is a navigation-scoped feature-flag editor per Q7 of the MVP scope. The cross-link to <em>Feature Flags</em> is the bridge between menu visibility flags and module/integration/workflow flags.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
