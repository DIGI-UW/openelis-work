<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WorkPlan Configuration — Preview</title>
<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #f4f4f4; --surface: #ffffff; --surface-2: #f9f9f9; --surface-muted: #f4f4f4;
    --text: #161616; --text-secondary: #525252; --text-helper: #6f6f6f;
    --border: #e0e0e0; --border-strong: #8d8d8d;
    --accent-info: #0f62fe; --accent-success: #24a148;
    --accent-info-bg: #edf5ff; --accent-success-bg: #defbe6;
    --row-dirty: #d0e2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--text); }
  .page-frame { max-width: 1280px; margin: 0 auto; padding: 1.5rem 2rem 6rem; }
  .crumbs { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
  .crumbs a { color: var(--accent-info); text-decoration: none; }
  h1 { font-size: 2rem; font-weight: 300; margin: 0 0 0.25rem; }
  .subtitle { color: var(--text-secondary); margin: 0 0 1.5rem; font-size: 0.875rem; max-width: 820px; line-height: 1.5; }

  .notice { margin-bottom: 1rem; padding: 0.875rem 1rem; border-left: 4px solid var(--accent-info); background: var(--accent-info-bg); border-radius: 2px; }
  .notice.success { border-color: var(--accent-success); background: var(--accent-success-bg); }
  .notice strong { font-size: 0.875rem; }
  .notice .sub { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); }
  .notice a { color: var(--accent-info); }

  .page-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .recent-trigger { background: transparent; border: 1px solid var(--border); padding: 0.375rem 0.75rem; border-radius: 2px; cursor: pointer; font: inherit; font-size: 0.8125rem; color: var(--accent-info); display: inline-flex; align-items: center; gap: 0.375rem; }
  .recent-trigger:hover { background: var(--surface-2); }

  .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

  .toggle-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; transition: background 0.1s; }
  .toggle-card.dirty { background: var(--row-dirty); }
  .toggle-card .row { display: flex; gap: 0.875rem; align-items: flex-start; }
  .toggle-card .body { flex: 1; }
  .toggle-card .label { font-weight: 500; font-size: 0.9375rem; cursor: help; }
  .toggle-card .helper { margin: 0.375rem 0 0; font-size: 0.8125rem; color: var(--text-helper); line-height: 1.5; }

  .toggle { width: 2.5rem; height: 1.25rem; border-radius: 999px; background: #8d8d8d; position: relative; cursor: pointer; flex-shrink: 0; border: 0; padding: 0; margin-top: 0.125rem; }
  .toggle.on { background: var(--accent-success); }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 1rem; height: 1rem; border-radius: 50%; background: white; transition: left 0.15s; }
  .toggle.on::after { left: 1.25rem; }

  .preview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 1rem 1.25rem; position: sticky; top: 1rem; }
  .preview-card-title { font-weight: 600; font-size: 0.9375rem; }
  .preview-card-helper { margin: 0.25rem 0 0.75rem; font-size: 0.75rem; color: var(--text-helper); }

  /* Mock printed workplan */
  .printed-workplan {
    background: white; border: 1px solid #c0c0c0; padding: 1rem;
    border-radius: 2px; font-family: 'IBM Plex Sans', system-ui;
    margin-top: 0.5rem;
  }
  .printed-workplan .header { text-align: center; margin-bottom: 0.875rem; }
  .printed-workplan .title { font-weight: 600; font-size: 1rem; }
  .printed-workplan .meta { font-size: 0.75rem; color: #525252; }
  .printed-workplan table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  .printed-workplan thead tr { border-bottom: 2px solid #161616; text-align: left; }
  .printed-workplan thead th { padding: 0.375rem 0.5rem; }
  .printed-workplan tbody tr { border-bottom: 1px solid #e0e0e0; }
  .printed-workplan tbody td { padding: 0.5rem; }
  .printed-workplan td.result-space { border-left: 1px dashed #c0c0c0; border-right: 1px dashed #c0c0c0; width: 120px; }
  .printed-workplan .signature { margin-top: 1rem; font-size: 0.6875rem; color: #6f6f6f; text-align: right; }

  /* Sticky bottom action bar */
  .actions-bar {
    display: flex; gap: 0.75rem; align-items: center;
    position: sticky; bottom: 0;
    margin: 1.5rem -2rem -6rem;
    padding: 0.875rem 2rem; background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 6px rgba(0,0,0,0.04);
    z-index: 40;
  }
  .actions-bar .dirty-summary { margin-left: auto; font-size: 0.8125rem; color: var(--text-secondary); }
  .btn { padding: 0.625rem 1rem; font-size: 0.875rem; cursor: pointer; border: 0; font-family: inherit; border-radius: 2px; }
  .btn.primary { background: var(--accent-info); color: white; }
  .btn.primary:hover:not(:disabled) { background: #0050d9; }
  .btn.ghost { background: transparent; color: var(--accent-info); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Recent Changes drawer */
  .recent-drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 90; }
  .recent-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw; background: var(--surface); box-shadow: -2px 0 8px rgba(0,0,0,0.15); padding: 1.25rem; overflow: auto; z-index: 100; }
  .recent-row { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .recent-meta { font-size: 0.75rem; color: var(--text-secondary); }
  .recent-field { font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; margin: 0.25rem 0; }
  .recent-change { font-size: 0.75rem; }
  .tag { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 500; }
  .tag.warm-gray { background: #e0e0e0; color: #393939; }
  .tag.green { background: #defbe6; color: #044317; }

  .meta-panel { margin-top: 2rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-info); border-radius: 2px; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.6; }
  .meta-panel strong { color: var(--text); }
  .meta-panel code { background: var(--surface-muted); padding: 0.0625rem 0.375rem; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const FIELDS = [
  { key: 'next visit on workplan', label: 'Show next-visit date',
    helper: 'Adds a "Next visit" column to the printed Workplan, populated from the patient\'s next-scheduled-visit field. Used by labs that batch samples per visit and want bench techs to see when the patient returns.',
    defaultValue: false },
  { key: 'results on workplan', label: 'Include space for results',
    helper: 'Adds blank cells beside each test where the bench tech can write the result by hand before later entering it in OpenELIS. Used by labs that record results on paper first.',
    defaultValue: false },
  { key: 'subject on workplan', label: 'Show subject number',
    helper: 'Adds a "Subject #" column to the printed Workplan, populated from the patient\'s study subject identifier. Used by labs running clinical studies where samples are tracked by subject ID rather than by patient name.',
    defaultValue: false },
];

const SAMPLE_RECENT = [
  { user: 'casey@example.org', at: '2026-04-22 11:30', field: 'results on workplan', before: 'true',  after: 'false' },
  { user: 'admin@example.org', at: '2026-03-15 09:08', field: 'subject on workplan', before: 'false', after: 'true' },
];

const SAMPLE_WORKPLAN = [
  { sample: 'LAB-2026-0042', patient: 'Marie Dubois',     subject: 'STUDY-A-001', test: 'CBC',     nextVisit: '2026-05-21' },
  { sample: 'LAB-2026-0043', patient: 'Jean Andriantsoa', subject: 'STUDY-A-002', test: 'HbA1c',   nextVisit: '2026-05-28' },
  { sample: 'LAB-2026-0044', patient: 'Aïcha N\'Diaye',   subject: 'STUDY-B-014', test: 'CD4',     nextVisit: '2026-06-04' },
];

function WorkplanPreview({ values }) {
  const showSubject = values['subject on workplan'];
  const showResults = values['results on workplan'];
  const showNextVisit = values['next visit on workplan'];
  return (
    <div className="printed-workplan">
      <div className="header">
        <div className="title">Bench WorkPlan — Hematology</div>
        <div className="meta">2026-05-14 · Lab Unit: Hematology</div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Sample #</th>
            <th>Patient</th>
            {showSubject && <th>Subject #</th>}
            <th>Test</th>
            {showResults && <th>Result</th>}
            {showNextVisit && <th>Next visit</th>}
          </tr>
        </thead>
        <tbody>
          {SAMPLE_WORKPLAN.map((r, i) => (
            <tr key={i}>
              <td>{r.sample}</td>
              <td>{r.patient}</td>
              {showSubject && <td>{r.subject}</td>}
              <td>{r.test}</td>
              {showResults && <td className="result-space">&nbsp;</td>}
              {showNextVisit && <td>{r.nextVisit}</td>}
            </tr>
          ))}
        </tbody>
      </table>
      <div className="signature">
        Tech signature: ___________________   Date: ___________
      </div>
    </div>
  );
}

function App() {
  const [values, setValues] = useState(() => {
    const m = {}; FIELDS.forEach(f => { m[f.key] = f.defaultValue; }); return m;
  });
  const [dirty, setDirty] = useState(new Set());
  const [savedNotice, setSavedNotice] = useState(false);
  const [recentOpen, setRecentOpen] = useState(false);

  const setValue = (key, v) => {
    setValues(prev => ({ ...prev, [key]: v }));
    setDirty(prev => { const n = new Set(prev); n.add(key); return n; });
  };
  const onSave = () => { setDirty(new Set()); setSavedNotice(true); setTimeout(() => setSavedNotice(false), 3000); };
  const onDiscard = () => {
    const m = {}; FIELDS.forEach(f => { m[f.key] = f.defaultValue; });
    setValues(m); setDirty(new Set());
  };

  return (
    <div className="page-frame">
      <div className="crumbs">
        <a href="#">Admin</a> &nbsp;/&nbsp; <a href="#">Workflow Tuning</a> &nbsp;/&nbsp; <span>WorkPlan</span>
      </div>

      <div className="page-header-row">
        <div>
          <h1>WorkPlan</h1>
          <p className="subtitle">
            Choose which optional columns appear on the printed bench Workplan (the paper worksheet bench techs use to track samples through testing). The preview on the right updates as you toggle.
          </p>
        </div>
        <button className="recent-trigger" onClick={() => setRecentOpen(true)}>🕐 Recent changes</button>
      </div>

      <div className="notice">
        <strong>ⓘ See also</strong>
        <div className="sub">
          Other report-style printed outputs are configured on <a href="#">Printed Reports</a>.
        </div>
      </div>

      {savedNotice && (
        <div className="notice success">
          <strong>✓ WorkPlan layout saved.</strong>
          <div className="sub">The next printed Workplan will use the new layout.</div>
        </div>
      )}
      {dirty.size > 0 && (
        <div className="notice">
          <strong>Unsaved changes</strong>
          <div className="sub">{dirty.size} toggle{dirty.size === 1 ? '' : 's'} pending. Save or discard before leaving.</div>
        </div>
      )}

      <div className="grid">
        <div>
          {FIELDS.map(field => (
            <div className={`toggle-card${dirty.has(field.key) ? ' dirty' : ''}`} key={field.key}>
              <div className="row">
                <button role="switch" aria-checked={!!values[field.key]} aria-label={field.label}
                  className={`toggle${values[field.key] ? ' on' : ''}`}
                  onClick={() => setValue(field.key, !values[field.key])} />
                <div className="body">
                  <div className="label" title={`Key: ${field.key}`}>{field.label}</div>
                  <p className="helper">{field.helper}</p>
                </div>
              </div>
            </div>
          ))}
        </div>

        <div>
          <div className="preview-card">
            <div className="preview-card-title">Printed Workplan preview</div>
            <p className="preview-card-helper">Mock of what the printed bench worksheet will look like with the current toggles. Updates live.</p>
            <WorkplanPreview values={values} />
          </div>
        </div>
      </div>

      <div className="actions-bar">
        <button className="btn primary" disabled={dirty.size === 0} onClick={onSave}>💾 Save changes</button>
        <button className="btn ghost" disabled={dirty.size === 0} onClick={onDiscard}>↺ Discard changes</button>
        <span className="dirty-summary">
          {dirty.size === 0 ? 'No unsaved changes.' : `${dirty.size} unsaved change${dirty.size === 1 ? '' : 's'}.`}
        </span>
      </div>

      {recentOpen && (
        <>
          <div className="recent-drawer-backdrop" onClick={() => setRecentOpen(false)} />
          <div className="recent-drawer">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
              <h3 style={{ margin: 0 }}>Recent changes</h3>
              <button className="btn ghost" onClick={() => setRecentOpen(false)}>Close</button>
            </div>
            <p style={{ margin: '0 0 0.75rem', fontSize: '0.8125rem', color: 'var(--text-secondary)' }}>
              Last 2 changes on this page. Full audit history is queued for Phase 6.
            </p>
            {SAMPLE_RECENT.map((r, i) => (
              <div key={i} className="recent-row">
                <div className="recent-meta">{r.at} · {r.user}</div>
                <div className="recent-field">{r.field}</div>
                <div className="recent-change">
                  <span className="tag warm-gray">{r.before}</span>
                  {' → '}
                  <span className="tag green">{r.after}</span>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      <div className="meta-panel">
        <strong>About this preview.</strong> Try:<br />
        • Flip <strong>Show subject number</strong> on → "Subject #" column appears in the printed preview on the right<br />
        • Flip <strong>Include space for results</strong> on → blank cells appear beside each test for manual entry<br />
        • Flip <strong>Show next-visit date</strong> on → "Next visit" column appears<br />
        • All three off → minimal Workplan with just Sample # / Patient / Test<br />
        • Hover any toggle label → tooltip shows the raw key (<code>next visit on workplan</code>) for ops debugging<br />
        • Scroll → sticky bottom save bar; preview is sticky on the right so it stays visible
        <br /><br />
        <strong>Story B.5 of the admin MVP.</strong> Retires legacy WorkPlan Configuration page (audit C038 Medium). Lives in <em>Workflow Tuning</em> bucket at <code>/admin/workflow-tuning/workplan</code>.
        <br /><br />
        <strong>The fix:</strong> the legacy page was a 3-row Select-radio + Modify table with no preview. Admins toggled blind and only discovered the impact when they printed the next Workplan. The redesign shows the printed output live as toggles flip — same pattern as B.4's "Try a value" approach to charsets.
        <br /><br />
        <strong>Verified data model</strong> (testing.openelis-global.org, 2026-05-14): 3 boolean toggles. <code>next visit on workplan</code>, <code>results on workplan</code>, <code>subject on workplan</code>. All affect what appears on the printed bench worksheet. All booleans surface on Feature Flags as a cross-cutting view.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
