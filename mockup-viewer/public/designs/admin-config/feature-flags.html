<!doctype html>
<html lang="en">

<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">

<style>
  :root {
    --bg: #f4f4f4;
    --surface: #ffffff;
    --surface-2: #f9f9f9;
    --surface-muted: #f4f4f4;
    --text: #161616;
    --text-secondary: #525252;
    --text-helper: #6f6f6f;
    --border: #e0e0e0;
    --border-strong: #8d8d8d;
    --accent-info: #0f62fe;
    --accent-success: #24a148;
    --accent-warn: #f1c21b;
    --accent-danger: #da1e28;
    --accent-info-bg: #edf5ff;
    --accent-warn-bg: #fcf4d6;
    --accent-success-bg: #defbe6;
    --accent-danger-bg: #fff1f1;
    --row-dirty: #d0e2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--text); }
  .page-frame { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
  .crumbs { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
  .crumbs a { color: var(--accent-info); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  h1 { font-size: 2rem; font-weight: 300; margin: 0 0 0.25rem; color: var(--text); }
  h2 { font-size: 1.25rem; font-weight: 400; margin: 0; color: var(--text); }
  h3 { font-size: 1.125rem; font-weight: 500; margin: 0; color: var(--text); }
  .subtitle { color: var(--text-secondary); margin: 0 0 1.5rem; font-size: 0.875rem; max-width: 820px; line-height: 1.5; }
  .notice { margin-bottom: 1rem; padding: 0.875rem 1rem; border-left: 4px solid var(--accent-info); background: var(--accent-info-bg); border-radius: 2px; }
  .notice.success { border-color: var(--accent-success); background: var(--accent-success-bg); }
  .notice.info-banner strong { font-size: 0.875rem; color: var(--text); }
  .notice.info-banner p { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); }
  .notice .title { font-weight: 600; font-size: 0.875rem; color: var(--text); }
  .notice .sub { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); }
  .notice a { color: var(--accent-info); }

  /* Tile / section */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .section.toolbar { padding: 1rem 1.25rem; }
  .section.modules { border-left: 4px solid var(--accent-info); border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .section.uncurated { background: var(--surface-muted); }
  .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .section-header h3 { color: var(--text); }
  .section-header .desc { font-size: 0.8125rem; color: var(--text-secondary); }
  .count-pill { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; background: var(--surface-muted); color: var(--text-secondary); }
  .count-pill.cyan { background: #dffaff; color: #08507a; }
  .count-pill.blue { background: #d0e2ff; color: #0c3987; }
  .count-pill.teal { background: #d9fbfb; color: #003f3d; }
  .count-pill.purple { background: #e8daff; color: #3a1a73; }
  .count-pill.gray { background: #e0e0e0; color: #393939; }

  /* Toolbar */
  .toolbar-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 200px; gap: 1rem; align-items: end; }
  .field-label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
  .input-wrap { background: var(--surface-2); height: 2.5rem; border-bottom: 1px solid var(--border-strong); display: flex; align-items: center; padding: 0 0.75rem; }
  .input-wrap input { flex: 1; border: 0; background: transparent; font: inherit; outline: 0; color: var(--text); }
  .input-wrap .ico { color: var(--text-secondary); margin-right: 0.5rem; }
  .dropdown { background: var(--surface-2); height: 2.5rem; border-bottom: 1px solid var(--border-strong); display: flex; align-items: center; padding: 0 0.75rem; font-size: 0.875rem; cursor: pointer; position: relative; user-select: none; }
  .dropdown::after { content: '▾'; margin-left: auto; color: var(--text-secondary); font-size: 0.75rem; }
  .dropdown-menu { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 50; margin-top: 1px; }
  .dropdown-menu .item { padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.875rem; color: var(--text); }
  .dropdown-menu .item:hover { background: var(--surface-2); }
  .dropdown-menu .item.selected { background: var(--accent-info-bg); }
  .toggle-row { display: inline-flex; align-items: center; gap: 0.5rem; padding-bottom: 0.25rem; }

  /* Toggle switch */
  .toggle { width: 2.5rem; height: 1.25rem; border-radius: 999px; background: #8d8d8d; position: relative; cursor: pointer; transition: background 0.15s; flex-shrink: 0; border: 0; padding: 0; }
  .toggle.on { background: var(--accent-success); }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 1rem; height: 1rem; border-radius: 50%; background: white; transition: left 0.15s; }
  .toggle.on::after { left: 1.25rem; }
  .toggle.md { width: 3rem; height: 1.5rem; }
  .toggle.md::after { width: 1.25rem; height: 1.25rem; top: 2px; left: 2px; }
  .toggle.md.on::after { left: 1.5rem; }

  /* Flag rows */
  .flag-row { display: flex; gap: 1rem; padding: 0.875rem 1rem; align-items: flex-start; border-top: 1px solid var(--border); transition: background 0.1s; }
  .flag-row:first-of-type { border-top: 0; }
  .flag-row:hover { background: var(--surface-2); }
  .flag-row.dirty { background: var(--row-dirty) !important; }
  .flag-body { flex: 1; min-width: 0; }
  .flag-title { font-weight: 500; font-size: 0.9375rem; color: var(--text); }
  .flag-title.lg { font-size: 1rem; }
  .flag-key { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.75rem; color: var(--text-secondary); background: var(--surface-muted); padding: 0.0625rem 0.375rem; border-radius: 2px; }
  .flag-desc { margin: 0.375rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; }
  .last-edited { font-size: 0.75rem; color: var(--text-helper); white-space: nowrap; padding-top: 0.25rem; min-width: 6rem; text-align: right; }

  .tag { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 500; margin-left: 0.375rem; vertical-align: middle; }
  .tag.danger { background: #ffd7d9; color: #750e13; }
  .tag.locked { background: #ffd7d9; color: #750e13; }
  .tag.uncurated { background: #e0e0e0; color: #393939; }
  .tag.green { background: #defbe6; color: #044317; }
  .tag.warm-gray { background: #e0e0e0; color: #393939; }

  /* Modules grid — cards */
  .modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
  .module-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 2px; padding: 1rem; display: flex; gap: 0.875rem; align-items: flex-start; transition: border-color 0.1s, background 0.1s; }
  .module-card:hover { border-color: var(--border-strong); }
  .module-card.dirty { background: var(--row-dirty) !important; border-color: var(--accent-info); }
  .module-card .body { flex: 1; min-width: 0; }
  .module-card .title { font-weight: 600; font-size: 0.9375rem; color: var(--text); display: flex; gap: 0.375rem; align-items: center; flex-wrap: wrap; }
  .module-card .desc { margin: 0.5rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.45; }

  /* Uncurated rows */
  .flag-row.unc { opacity: 0.72; border-left: 3px solid var(--border); background: var(--surface-muted); padding-left: 0.625rem; }
  .flag-row.unc .flag-key { background: var(--surface); }

  /* Action bar */
  .actions-bar { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
  .btn { padding: 0.625rem 1rem; font-size: 0.875rem; cursor: pointer; border-radius: 2px; border: 0; font-family: inherit; }
  .btn.primary { background: var(--accent-info); color: white; }
  .btn.primary:hover:not(:disabled) { background: #0050d9; }
  .btn.ghost { background: transparent; color: var(--accent-info); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  .modal { background: var(--surface); width: 560px; max-width: 100%; max-height: 90vh; overflow: auto; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .modal-header { padding: 1rem 1.25rem 0.5rem; }
  .modal-header h3 { font-size: 1rem; font-weight: 600; margin: 0; color: var(--accent-danger); }
  .modal-body { padding: 0.5rem 1.25rem 1rem; }
  .modal-body p { margin: 0.5rem 0; font-size: 0.875rem; color: var(--text); line-height: 1.5; }
  .modal-footer { display: flex; border-top: 1px solid var(--border); }
  .modal-footer .btn { flex: 1; padding: 1rem; border: 0; cursor: pointer; font-size: 0.875rem; border-radius: 0; }
  .modal-footer .secondary { background: var(--surface-2); color: var(--text); }
  .modal-footer .secondary:hover { background: var(--border); }
  .modal-footer .danger-primary { background: var(--accent-danger); color: white; }
  .modal-footer .danger-primary:hover:not(:disabled) { background: #b81921; }
  .impact-tile { background: var(--accent-warn-bg); padding: 0.875rem 1rem; margin: 1rem 0 0.5rem; border-left: 3px solid var(--accent-warn); border-radius: 2px; }
  .impact-tile strong { font-size: 0.875rem; color: var(--text); display: block; margin-bottom: 0.25rem; }
  .impact-tile p { margin: 0; font-size: 0.875rem; line-height: 1.5; color: var(--text); }
  .dependency-tile { background: #fff1f1; padding: 0.875rem 1rem; margin: 0.75rem 0 0.5rem; border-left: 3px solid var(--accent-danger, #da1e28); border-radius: 2px; }
  .dependency-tile strong { font-size: 0.875rem; color: var(--text); display: block; margin-bottom: 0.25rem; }
  .dependency-tile p { margin: 0 0 0.5rem; font-size: 0.8125rem; line-height: 1.4; color: var(--text); }
  .dependency-tile ul { margin: 0; padding-left: 1.25rem; font-size: 0.8125rem; }
  .dependency-tile li { margin: 0.125rem 0; }
  .dependency-tile code { font-size: 0.6875rem; color: var(--text-secondary); background: rgba(0,0,0,0.05); padding: 0 0.25rem; }
  .confirm-input { width: 100%; padding: 0.5rem 0.75rem; font: inherit; font-size: 0.875rem; background: var(--surface-2); border: 0; border-bottom: 1px solid var(--border-strong); outline: 0; color: var(--text); font-family: 'IBM Plex Mono', monospace; }
  .confirm-input:focus { border-bottom: 2px solid var(--accent-info); }
  .invalid-text { font-size: 0.75rem; color: var(--accent-danger); margin-top: 0.25rem; }

  /* Meta panel */
  .meta-panel { margin-top: 2rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-info); border-radius: 2px; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.6; }
  .meta-panel strong { color: var(--text); }
  .meta-panel code { background: var(--surface-muted); padding: 0.0625rem 0.375rem; border-radius: 2px; }

  .coverage { font-size: 0.75rem; color: var(--text-secondary); margin: 0.75rem 0 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const CURATED_FLAGS = {
  useFhirAuthentication: { label: 'FHIR authentication', description: 'Enable SSO and FHIR-based authentication via an external identity provider (Keycloak / OAuth).', category: 'Module', destructive: true, requireTypeToConfirm: true,
    impact: 'Disabling FHIR authentication will log out all SSO users immediately and prevent further FHIR-based logins until re-enabled. Users with local accounts will continue to log in normally.' },
  usePathology: { label: 'Pathology module', description: 'Enable the Pathology workflow — slide tracking, case management, and pathologist sign-off.', category: 'Module', destructive: true,
    impact: 'Disabling the Pathology module hides Pathology menus and prevents new pathology orders. Existing pathology cases remain in the database but are unreachable through the UI.',
    affects: ['useImmunohistochemistry'] },
  useImmunohistochemistry: { label: 'Immunohistochemistry', description: 'Enable IHC-specific workflows and test types. Depends on the Pathology module being enabled.', category: 'Module', destructive: true,
    impact: 'Disabling IHC hides Immunohistochemistry menu items and prevents new IHC orders.',
    dependsOn: ['usePathology'] },
  usePatientReferring: { label: 'Patient referrals', description: 'Enable inter-lab referral workflows — sending samples to or receiving from referring labs via FHIR.', category: 'Module', destructive: false },
  useExternalConnections: { label: 'External connections', description: 'Enable connections to external systems (EMR, billing, reference labs). Configure individual endpoints in Integrations.', category: 'Module', destructive: true,
    impact: 'Disabling external connections suspends all outbound and inbound integration traffic. In-flight messages will fail until re-enabled.' },
  useBilling: { label: 'Billing module', description: 'Enable the Billing menu and inventory-billing integration.', category: 'Module', destructive: false },
  usePolyclinic: { label: 'Polyclinic mode', description: 'Enable multi-clinic patient routing — used at deployments where one OpenELIS instance serves multiple sub-clinics.', category: 'Module', destructive: false },
  useRetroCIStudyForms: { label: 'RETROCI Study Forms', description: 'Enable the RETROCI study workflows — hardcoded forms for ARV, EID, VL, and Indeterminate programs. Used at one specific lab; off by default for new deployments.', category: 'Module', destructive: true,
    impact: 'Disabling RETROCI Study Forms hides the Study menu and prevents new RETROCI orders. Existing study data is preserved in storage but unreachable through the UI.' },
  useFhirAuditTrail: { label: 'FHIR audit trail', description: 'Write authentication and authorization events to the FHIR audit log endpoint.', category: 'Integration', destructive: false },
  useTwoFactorAuthentication: { label: 'Two-factor authentication', description: 'Require a second authentication factor (TOTP) for users with admin privileges.', category: 'Integration', destructive: true,
    impact: 'Enabling 2FA will lock out admin users who have not yet enrolled an authenticator. Have at least one admin enroll first to avoid lockout.' },
  enableSmsNotifications: { label: 'SMS notifications', description: 'Send result notifications via SMS through the configured SMS gateway.', category: 'Integration', destructive: false },
  enableEmailNotifications: { label: 'Email notifications', description: 'Send result notifications via email through the configured SMTP server.', category: 'Integration', destructive: false },
  autoPrintResults: { label: 'Auto-print results', description: 'Automatically print result reports when a result is validated.', category: 'Workflow', destructive: false },
  requireProviderForOrders: { label: 'Require provider on orders', description: 'Make the provider field mandatory when creating a new order.', category: 'Workflow', destructive: false },
  enableBarcodes: { label: 'Sample barcodes', description: 'Print barcodes on sample labels and accept barcode input for sample lookup.', category: 'Workflow', destructive: false },
  enableCriticalResultAck: { label: 'Critical result acknowledgment', description: 'Require providers to acknowledge critical results before they can be validated.', category: 'Workflow', destructive: false },
  notifyOnSampleRejection: { label: 'Notify on sample rejection', description: 'Send a notification to the ordering provider when a sample is rejected.', category: 'Notification', destructive: false },
  notifyOnCriticalResult: { label: 'Notify on critical result', description: 'Send an immediate notification to the ordering provider when a critical result is produced.', category: 'Notification', destructive: false },
  showWelcomeBanner: { label: 'Welcome banner', description: 'Show the configured welcome banner on the login and home pages.', category: 'Other', destructive: false },
  disableFreezerLogging: { label: 'Disable freezer logging', description: 'Suspend cold-storage event logging. Use only during scheduled maintenance.', category: 'Other', destructive: false },
};

const FLAG_ROWS = [
  { key: 'useFhirAuthentication',          value: true,  lastEdited: '2026-04-12' },
  { key: 'usePathology',                   value: true,  lastEdited: '2026-03-28' },
  { key: 'useImmunohistochemistry',        value: true,  lastEdited: '2026-04-02' },
  { key: 'usePatientReferring',            value: false, lastEdited: '2026-04-15' },
  { key: 'useExternalConnections',         value: true,  lastEdited: '2026-04-18' },
  { key: 'useBilling',                     value: false, lastEdited: '2026-04-01' },
  { key: 'usePolyclinic',                  value: false, lastEdited: '2025-11-04' },
  { key: 'useRetroCIStudyForms',           value: false, lastEdited: '2025-10-22' },
  { key: 'useFhirAuditTrail',              value: true,  lastEdited: '2026-04-20' },
  { key: 'useTwoFactorAuthentication',     value: false, lastEdited: '2026-04-15' },
  { key: 'enableSmsNotifications',         value: true,  lastEdited: '2026-04-10' },
  { key: 'enableEmailNotifications',       value: true,  lastEdited: '2026-04-10' },
  { key: 'autoPrintResults',               value: false, lastEdited: '2026-03-15' },
  { key: 'requireProviderForOrders',       value: true,  lastEdited: '2026-04-08' },
  { key: 'enableBarcodes',                 value: true,  lastEdited: '2026-04-22' },
  { key: 'enableCriticalResultAck',        value: false, lastEdited: '2026-04-01' },
  { key: 'notifyOnSampleRejection',        value: true,  lastEdited: '2026-04-12' },
  { key: 'notifyOnCriticalResult',         value: true,  lastEdited: '2026-04-12' },
  { key: 'showWelcomeBanner',              value: true,  lastEdited: '2026-04-05' },
  { key: 'disableFreezerLogging',          value: false, lastEdited: '2026-04-18' },
  { key: 'showSampleTimeReceivedFromLab',  value: true,  lastEdited: '2025-12-01' },
  { key: 'usePatientWiseValidationCheck',  value: false, lastEdited: '2025-09-14' },
  { key: 'allowResultEntryWithoutTechnician', value: false, lastEdited: '2025-11-30' },
  { key: 'enableCriticalAlertAuditLog',    value: true,  lastEdited: '2026-01-12' },
  { key: 'useLegacyOrderNumberFormat',     value: false, lastEdited: '2025-08-22' },
];

const CATEGORY_ORDER = ['Module', 'Integration', 'Workflow', 'Notification', 'Other'];
const CATEGORY_META = {
  Module:       { pill: 'cyan',   desc: 'Major modules that can be enabled or disabled for this deployment' },
  Integration:  { pill: 'blue',   desc: 'Connections to external systems and identity providers' },
  Workflow:     { pill: 'teal',   desc: 'Behavior toggles for order, result, and validation flows' },
  Notification: { pill: 'purple', desc: 'Default channel and event toggles for outbound notifications' },
  Other:        { pill: 'gray',   desc: 'Settings that do not fit elsewhere' },
};
const FILTER_VALUES = [
  { id: 'all',     label: 'All values' },
  { id: 'enabled', label: 'Enabled only' },
  { id: 'disabled', label: 'Disabled only' },
];
const FILTER_CATEGORIES = [
  { id: 'all', label: 'All categories' },
  ...CATEGORY_ORDER.map(c => ({ id: c, label: c })),
  { id: 'Uncurated', label: 'Uncurated only' },
];

function FlagRow({ flag, dirty, requestFlip }) {
  const isDirty = dirty.has(flag.key);
  const dict = flag.dict;
  if (!dict) {
    return (
      <div className={`flag-row unc${isDirty ? ' dirty' : ''}`}>
        <button role="switch" aria-checked={flag.value} aria-label={`Toggle ${flag.key}`}
          className={`toggle${flag.value ? ' on' : ''}`} onClick={() => requestFlip(flag)} />
        <div className="flag-body">
          <span className="flag-key">{flag.key}</span>
          <span className="tag uncurated">Uncurated</span>
          <p className="flag-desc" style={{ fontStyle: 'italic' }}>No dictionary entry yet — add label/description/category to surface this properly.</p>
        </div>
        <span className="last-edited">{flag.lastEdited}</span>
      </div>
    );
  }
  return (
    <div className={`flag-row${isDirty ? ' dirty' : ''}`}>
      <button role="switch" aria-checked={flag.value} aria-label={`Toggle ${dict.label}`}
        className={`toggle${flag.value ? ' on' : ''}`} onClick={() => requestFlip(flag)} />
      <div className="flag-body">
        <span className="flag-title">{dict.label}</span>
        {dict.destructive && <span className="tag danger">⚠ High impact</span>}
        {dict.requireTypeToConfirm && <span className="tag locked">🔒 Type to confirm</span>}
        {' '}<span className="flag-key">{flag.key}</span>
        {dict.description && <p className="flag-desc">{dict.description}</p>}
      </div>
      <span className="last-edited">{flag.lastEdited}</span>
    </div>
  );
}

function ModuleCard({ flag, dirty, requestFlip }) {
  const isDirty = dirty.has(flag.key);
  const dict = flag.dict;
  return (
    <div className={`module-card${isDirty ? ' dirty' : ''}`}>
      <button role="switch" aria-checked={flag.value} aria-label={`Toggle ${dict.label}`}
        className={`toggle md${flag.value ? ' on' : ''}`} onClick={() => requestFlip(flag)} />
      <div className="body">
        <div className="title">
          {dict.label}
          {dict.destructive && <span className="tag danger">⚠ High impact</span>}
          {dict.requireTypeToConfirm && <span className="tag locked">🔒 Type to confirm</span>}
        </div>
        <p className="desc">{dict.description}</p>
        <p style={{ margin: '0.5rem 0 0', fontSize: '0.6875rem', color: 'var(--text-helper)' }}>
          <code style={{ background: 'transparent', padding: 0 }}>{flag.key}</code> · edited {flag.lastEdited}
        </p>
      </div>
    </div>
  );
}

function App() {
  const [rows, setRows] = useState(FLAG_ROWS);
  const [search, setSearch] = useState('');
  const [valueFilter, setValueFilter] = useState('all');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [showUncurated, setShowUncurated] = useState(true);
  const [dirty, setDirty] = useState(new Set());
  const [savedNotice, setSavedNotice] = useState(false);
  const [pendingFlip, setPendingFlip] = useState(null);
  const [typeToConfirm, setTypeToConfirm] = useState('');
  const [openMenu, setOpenMenu] = useState(null); // 'cat' | 'val' | null

  const flagsByCategory = useMemo(() => {
    const grouped = {};
    CATEGORY_ORDER.forEach(c => { grouped[c] = []; });
    grouped['Uncurated'] = [];
    rows.forEach(r => {
      const dict = CURATED_FLAGS[r.key];
      if (dict) grouped[dict.category].push({ ...r, dict });
      else grouped['Uncurated'].push({ ...r, dict: null });
    });
    return grouped;
  }, [rows]);

  const matchesFilters = (flag) => {
    if (search) {
      const hay = `${flag.key} ${flag.dict?.label || ''} ${flag.dict?.description || ''}`.toLowerCase();
      if (!hay.includes(search.toLowerCase())) return false;
    }
    if (valueFilter === 'enabled' && !flag.value) return false;
    if (valueFilter === 'disabled' && flag.value) return false;
    return true;
  };

  const requestFlip = (flag) => {
    if (flag.dict?.destructive) {
      setPendingFlip(flag);
      setTypeToConfirm('');
    } else {
      flipNow(flag.key);
    }
  };
  const flipNow = (key) => {
    setRows(prev => prev.map(r => r.key === key ? { ...r, value: !r.value } : r));
    setDirty(prev => { const n = new Set(prev); n.add(key); return n; });
  };
  const confirmFlip = () => {
    if (!pendingFlip) return;
    flipNow(pendingFlip.key);
    setPendingFlip(null);
    setTypeToConfirm('');
  };
  const onSave = () => { setDirty(new Set()); setSavedNotice(true); setTimeout(() => setSavedNotice(false), 3000); };
  const onDiscard = () => { setRows(FLAG_ROWS); setDirty(new Set()); };

  const dictCoverage = useMemo(() => {
    const total = rows.length;
    const curated = rows.filter(r => CURATED_FLAGS[r.key]).length;
    return { total, curated, pct: Math.round((curated / total) * 100) };
  }, [rows]);

  const moduleFlags = flagsByCategory['Module'].filter(matchesFilters);

  return (
    <div className="page-frame">
      <div className="crumbs">
        <a href="#">Admin</a> &nbsp;/&nbsp; <a href="#">System Administration</a> &nbsp;/&nbsp; <span>Feature Flags</span>
      </div>

      <h1>Feature Flags</h1>
      <p className="subtitle">
        Turn modules, integrations, and behaviors on or off for this deployment. Module switches at the top toggle entire features. High-impact flips will ask for confirmation before they take effect.
      </p>

      <div className="notice info-banner">
        <strong>ⓘ See also</strong>
        <p>Non-boolean settings (URLs, identifiers, file paths, page sizes) live on <a href="#">Application Properties</a>. Menu visibility lives on <a href="#">Menu Configuration</a>. This page covers only the on/off flags.</p>
      </div>

      {savedNotice && (
        <div className="notice success">
          <div className="title">✓ Feature flags saved.</div>
          <div className="sub">Changes are live.</div>
        </div>
      )}
      {dirty.size > 0 && (
        <div className="notice">
          <div className="title">Unsaved changes</div>
          <div className="sub">{dirty.size} flag{dirty.size === 1 ? '' : 's'} pending. Save or discard before leaving the page.</div>
        </div>
      )}

      {/* TOOLBAR */}
      <div className="section toolbar">
        <div className="toolbar-grid">
          <div>
            <label className="field-label">Search flags</label>
            <div className="input-wrap">
              <span className="ico">🔍</span>
              <input placeholder="Search by name, key, or description" value={search} onChange={(e) => setSearch(e.target.value)} />
            </div>
          </div>
          <div>
            <label className="field-label">Category</label>
            <div className="dropdown" onClick={() => setOpenMenu(m => m === 'cat' ? null : 'cat')}>
              {FILTER_CATEGORIES.find(o => o.id === categoryFilter).label}
              {openMenu === 'cat' && (
                <div className="dropdown-menu">
                  {FILTER_CATEGORIES.map(o => (
                    <div key={o.id} className={`item${categoryFilter === o.id ? ' selected' : ''}`}
                         onClick={(e) => { e.stopPropagation(); setCategoryFilter(o.id); setOpenMenu(null); }}>
                      {o.label}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
          <div>
            <label className="field-label">Value</label>
            <div className="dropdown" onClick={() => setOpenMenu(m => m === 'val' ? null : 'val')}>
              {FILTER_VALUES.find(o => o.id === valueFilter).label}
              {openMenu === 'val' && (
                <div className="dropdown-menu">
                  {FILTER_VALUES.map(o => (
                    <div key={o.id} className={`item${valueFilter === o.id ? ' selected' : ''}`}
                         onClick={(e) => { e.stopPropagation(); setValueFilter(o.id); setOpenMenu(null); }}>
                      {o.label}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
          <div className="toggle-row">
            <button role="switch" aria-checked={showUncurated} aria-label="Show uncurated"
              className={`toggle${showUncurated ? ' on' : ''}`} onClick={() => setShowUncurated(!showUncurated)} />
            <span style={{ fontSize: '0.8125rem' }}>{showUncurated ? 'Show uncurated' : 'Curated only'}</span>
          </div>
        </div>
        <p className="coverage">
          Curated dictionary coverage: <strong>{dictCoverage.curated} of {dictCoverage.total}</strong> flags ({dictCoverage.pct}%). Add dictionary entries to surface uncurated flags properly.
        </p>
      </div>

      {/* MODULE SWITCHES — pinned */}
      {(categoryFilter === 'all' || categoryFilter === 'Module') && moduleFlags.length > 0 && (
        <div className="section modules">
          <div className="section-header">
            <h3>Modules</h3>
            <span className="count-pill cyan">{moduleFlags.length}</span>
            <span className="desc">{CATEGORY_META.Module.desc}</span>
          </div>
          <p style={{ margin: '0 0 0.75rem', fontSize: '0.875rem', color: 'var(--text-secondary)' }}>
            Turn whole features of OpenELIS on or off. The most common admin task lives here.
          </p>
          <div className="modules-grid">
            {moduleFlags.map(f => <ModuleCard key={f.key} flag={f} dirty={dirty} requestFlip={requestFlip} />)}
          </div>
        </div>
      )}

      {/* OTHER CATEGORIES */}
      {CATEGORY_ORDER.filter(c => c !== 'Module').map(c => {
        const flags = flagsByCategory[c].filter(matchesFilters);
        if (flags.length === 0) return null;
        if (categoryFilter !== 'all' && categoryFilter !== c) return null;
        const meta = CATEGORY_META[c];
        return (
          <div className="section" key={c}>
            <div className="section-header">
              <h3>{c}</h3>
              <span className={`count-pill ${meta.pill}`}>{flags.length}</span>
              <span className="desc">{meta.desc}</span>
            </div>
            <div>
              {flags.map(f => <FlagRow key={f.key} flag={f} dirty={dirty} requestFlip={requestFlip} />)}
            </div>
          </div>
        );
      })}

      {/* UNCURATED */}
      {showUncurated && (categoryFilter === 'all' || categoryFilter === 'Uncurated') && (() => {
        const uncFlags = flagsByCategory['Uncurated'].filter(matchesFilters);
        if (uncFlags.length === 0) return null;
        return (
          <div className="section uncurated">
            <div className="section-header">
              <h3 style={{ color: 'var(--text-secondary)' }}>Uncurated</h3>
              <span className="count-pill">{uncFlags.length}</span>
              <span className="desc">Boolean settings that exist in the database but have no dictionary entry yet. Functional but unlabelled — a visible backlog signal.</span>
            </div>
            <div>
              {uncFlags.map(f => <FlagRow key={f.key} flag={f} dirty={dirty} requestFlip={requestFlip} />)}
            </div>
          </div>
        );
      })()}

      <div className="actions-bar">
        <button className="btn primary" disabled={dirty.size === 0} onClick={onSave}>
          💾 Save changes{dirty.size > 0 ? ` (${dirty.size})` : ''}
        </button>
        <button className="btn ghost" disabled={dirty.size === 0} onClick={onDiscard}>
          ↺ Discard changes
        </button>
      </div>

      <div className="meta-panel">
        <strong>About this preview.</strong> Try:<br />
        • Toggle <strong>"FHIR authentication"</strong> in Modules — highest-risk modal with type-to-confirm (type <code>useFhirAuthentication</code> to enable Confirm)<br />
        • Toggle <strong>"Pathology module"</strong> or <strong>"RETROCI Study Forms"</strong> — destructive modal without type-to-confirm<br />
        • Toggle <strong>"Welcome banner"</strong> in Other — non-destructive, saves inline (row highlights blue)<br />
        • Filter to <strong>Category = Uncurated</strong> to see only the muted backlog flags<br />
        • Search <strong>"FHIR"</strong> to find FHIR-related flags across categories<br />
        • Toggle the <strong>"Curated only"</strong> switch to hide the Uncurated section
        <br /><br />
        <strong>Story B.9 of the admin MVP.</strong> NEW page (no legacy equivalent). Lives in <em>System Administration</em> bucket at <code>/admin/system-admin/feature-flags</code> — sidenav peer of Application Properties.
        <br /><br />
        <strong>Pattern:</strong> auto-aggregates booleans from <code>SystemConfiguration</code> at runtime; curated dictionary (i18n keys <code>flag.&lt;key&gt;.label/.description/.category/.destructive/.impact</code>) provides metadata for known flags; uncurated flags render muted with a visible "Uncurated" Tag as a backlog signal.
        <br /><br />
        <strong>The "hide a module" journey</strong> lands as the pinned Modules section at the top — labelled toggle cards make the most-common admin task a single click. Per critique decision 1 (2026-05-13).
        <br /><br />
        <strong>Destructive modal</strong> (per critique decision 2): flags with <code>destructive: true</code> trigger a confirmation Modal with impact copy; flags with <code>requireTypeToConfirm: true</code> additionally require the admin to type the flag key.
      </div>

      {pendingFlip && (
        <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) { setPendingFlip(null); setTypeToConfirm(''); } }}>
          <div className="modal">
            <div className="modal-header">
              <h3>
                {pendingFlip.dict.requireTypeToConfirm
                  ? '🔒 High-risk flag — type the flag key to confirm'
                  : '⚠ Confirm this change'}
              </h3>
            </div>
            <div className="modal-body">
              <p>
                <strong>{pendingFlip.dict.label}</strong>{' '}
                <span className="flag-key">{pendingFlip.key}</span>
              </p>
              <p>
                Change: <span className="tag warm-gray">{pendingFlip.value ? 'Enabled' : 'Disabled'}</span>
                {' → '}
                <span className="tag green">{!pendingFlip.value ? 'Enabled' : 'Disabled'}</span>
              </p>
              <div className="impact-tile">
                <strong>What this changes</strong>
                <p>{pendingFlip.dict.impact || 'No impact statement is recorded for this flag. Proceed with caution.'}</p>
              </div>
              {/* Cascade — flags this turn-off will also disable */}
              {pendingFlip.value && pendingFlip.dict.affects && pendingFlip.dict.affects.length > 0 && (
                <div className="dependency-tile">
                  <strong>Also affected</strong>
                  <p>Disabling this will auto-disable these dependent flags:</p>
                  <ul>
                    {pendingFlip.dict.affects.map(k => (
                      <li key={k}>
                        <strong>{CURATED_FLAGS[k]?.label || k}</strong>{' '}
                        <code>{k}</code>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
              {/* Prerequisites — flags that must be on before this one can enable */}
              {!pendingFlip.value && pendingFlip.dict.dependsOn && (() => {
                const missing = pendingFlip.dict.dependsOn.filter(k => !rows.find(r => r.key === k)?.value);
                if (missing.length === 0) return null;
                return (
                  <div className="dependency-tile">
                    <strong>Required dependencies</strong>
                    <p>Enabling this flag requires these to be enabled first:</p>
                    <ul>
                      {missing.map(k => (
                        <li key={k}>
                          <strong>{CURATED_FLAGS[k]?.label || k}</strong>{' '}
                          <span className="cds--tag cds--tag--red cds--tag--sm">Currently OFF</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })()}
              {pendingFlip.dict.requireTypeToConfirm && (
                <div style={{ marginTop: '1rem' }}>
                  <label className="field-label">Type the flag key to confirm: <code>{pendingFlip.key}</code></label>
                  <input className="confirm-input" value={typeToConfirm} onChange={(e) => setTypeToConfirm(e.target.value)} placeholder={pendingFlip.key} />
                  {typeToConfirm.length > 0 && typeToConfirm !== pendingFlip.key && (
                    <div className="invalid-text">Key doesn't match.</div>
                  )}
                </div>
              )}
            </div>
            <div className="modal-footer">
              <button className="btn secondary" onClick={() => { setPendingFlip(null); setTypeToConfirm(''); }}>Cancel</button>
              <button className="btn danger-primary"
                disabled={pendingFlip.dict.requireTypeToConfirm && typeToConfirm !== pendingFlip.key}
                onClick={confirmFlip}>Confirm and apply</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
