<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reagent Usage v1 Preview — OpenELIS Result Entry</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; color: #161616; font-size: 14px; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .preview-content { padding: 1rem 2rem; max-width: 1280px; margin: 0 auto; }

    /* ----- Results table top header + row ----- */
    .results-table { background: #fff; border: 1px solid #e0e0e0; }
    .results-table-header, .results-table-row {
      display: grid;
      grid-template-columns: 24px 2fr 0.9fr 1fr 1.6fr 0.9fr 0.7fr 1.2fr;
      gap: 1rem; align-items: center;
      padding: 0.625rem 1rem;
    }
    .results-table-header { font-size: 0.75rem; color: #525252; border-bottom: 1px solid #e0e0e0; background: #f4f4f4; }
    .results-table-row { background: #fff; border-bottom: 1px solid #e0e0e0; font-size: 0.875rem; }
    .results-table-row .sample-info {
      display: flex; gap: 0.5rem; align-items: center;
    }
    .results-table-row .sample-info .icon-copy { color: #525252; cursor: pointer; }
    .results-table-row .avatar {
      width: 32px; height: 32px; background: #d4bbcb; color: #6f0a48;
      display: inline-flex; align-items: center; justify-content: center; font-weight: 600;
      font-size: 0.875rem;
    }
    .row-expand-toggle {
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; color: #525252;
    }
    .results-table-row select {
      padding: 0.375rem 0.5rem; border: 1px solid #8d8d8d; background: #f4f4f4;
      font-family: inherit; font-size: 0.875rem; min-height: 32px;
    }

    /* ----- Expanded panel ----- */
    .expanded-panel {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 0;
    }
    .panel-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 1rem;
      padding: 0.875rem 1rem;
      align-items: flex-start;
    }
    .panel-row + .panel-row { border-top: 1px solid #e8e8e8; }
    .panel-row .row-label {
      font-size: 0.75rem; font-weight: 600; color: #525252; padding-top: 0.5rem;
    }
    .panel-row .row-fields {
      display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;
    }

    /* The Methods row (unchanged from screenshot) */
    .methods-row .field { display: flex; flex-direction: column; min-width: 140px; }
    .methods-row .field label {
      font-size: 0.75rem; color: #525252; margin-bottom: 0.25rem;
    }
    .methods-row .field select, .methods-row .field input[type="text"] {
      padding: 0.375rem 0.5rem; border: 1px solid #8d8d8d; background: #f4f4f4;
      font-family: inherit; font-size: 0.875rem; min-width: 140px;
    }
    .methods-row .field input[type="text"]:disabled,
    .methods-row .field select:disabled {
      background: #e8e8e8; color: #8d8d8d; border-color: #c6c6c6;
    }
    .methods-row .upload-btn {
      padding: 0.375rem 0.875rem; background: #0f62fe; color: #fff;
      border: none; cursor: pointer; font-size: 0.875rem; align-self: flex-end;
    }
    .methods-row .refer-cb { display: flex; align-items: center; gap: 0.5rem; align-self: center; padding-top: 0.875rem; }

    /* Storage row */
    .storage-row { align-items: center; }
    .storage-row .row-fields {
      align-items: center;
      gap: 1.5rem;
    }
    .storage-row .label-block {
      font-size: 0.875rem;
    }
    .storage-row .label-block strong { color: #161616; }
    .assign-btn {
      padding: 0.375rem 0.875rem; background: #fff; color: #0f62fe;
      border: 1px solid #0f62fe; cursor: pointer; font-size: 0.875rem;
    }
    .nce-btn {
      padding: 0.375rem 0.875rem; background: #fff; color: #da1e28;
      border: 1px solid #da1e28; cursor: pointer; font-size: 0.875rem;
      display: inline-flex; align-items: center; gap: 0.375rem;
    }
    .nce-btn .err-icon { color: #da1e28; }

    /* ----- Reagent row (NEW) ----- */
    .reagent-row .row-fields { flex-direction: column; align-items: stretch; gap: 0.5rem; }
    .reagent-entry {
      display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;
      padding: 0.25rem 0;
    }
    .reagent-entry-search { flex: 1; max-width: 480px; min-width: 280px; position: relative; }
    .search-input {
      width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #8d8d8d; background: #f4f4f4;
      font-family: inherit; font-size: 0.875rem; box-sizing: border-box;
    }
    .search-input:focus { outline: 2px solid #0f62fe; outline-offset: -2px; }
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
      background: #fff; border: 1px solid #e0e0e0; max-height: 280px; overflow-y: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .search-item { padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.875rem; border-bottom: 1px solid #f4f4f4; }
    .search-item:hover { background: #edf5ff; }
    .search-item strong.lot-mono { font-family: 'IBM Plex Mono', monospace; }
    .search-item .meta { color: #525252; font-size: 0.75rem; margin-top: 0.125rem; }

    /* Lot picker (state 2) */
    .lot-picker {
      flex: 1; max-width: 640px; padding: 0.625rem; background: #f4f4f4; border: 1px solid #e0e0e0;
    }
    .lot-picker-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600;
    }
    .lot-picker-header .subdued { color: #525252; font-weight: 400; margin-left: 0.5rem; }
    .lot-card {
      padding: 0.5rem; background: #fff; border: 1px solid #e0e0e0;
      margin-bottom: 0.375rem; cursor: pointer;
    }
    .lot-card.fifo { border: 1px dashed #009d9a; }
    .lot-card.expired { opacity: 0.45; cursor: not-allowed; background: #fff1f1; }
    .lot-card-line1 { display: flex; align-items: center; gap: 0.5rem; }
    .lot-card-line1 input[type="radio"] { margin: 0; }
    .lot-card-line1 strong { font-family: 'IBM Plex Mono', monospace; font-size: 0.875rem; }
    .lot-card-line2 { font-size: 0.75rem; color: #525252; margin-top: 0.25rem; }
    .cancel-btn {
      padding: 0.125rem 0.5rem; background: transparent; border: none; color: #0f62fe;
      cursor: pointer; font-size: 0.75rem;
    }

    /* Resolved chip (state 3) */
    .resolved-chip {
      display: inline-flex; align-items: center; gap: 0.375rem;
      padding: 0.375rem 0.625rem; background: #f4f4f4; border: 1px solid #e0e0e0;
      font-size: 0.875rem;
    }
    .resolved-chip strong.lot-mono { font-family: 'IBM Plex Mono', monospace; }
    .resolved-chip .change-btn {
      background: transparent; border: none; cursor: pointer; padding: 0.125rem;
      color: #0f62fe; font-size: 0.75rem; display: inline-flex; align-items: center;
    }
    .resolved-chip .change-btn:hover { background: #e8e8e8; }

    .qty-input { display: flex; flex-direction: column; }
    .qty-input label { font-size: 0.75rem; color: #525252; margin-bottom: 0.25rem; }
    .qty-input input {
      padding: 0.375rem 0.5rem; border: 1px solid #8d8d8d; background: #f4f4f4;
      font-family: inherit; font-size: 0.875rem; width: 100px;
    }
    .qty-input input.invalid { border-color: #da1e28; background: #fff5f5; }
    .qty-error { font-size: 0.75rem; color: #da1e28; margin-top: 0.25rem; }
    .qty-static-unit { padding: 0.375rem 0; font-size: 0.875rem; align-self: flex-end; }

    .remove-btn {
      background: transparent; border: none; cursor: pointer; padding: 0.375rem;
      color: #525252; align-self: flex-end;
    }
    .remove-btn:hover { color: #da1e28; }
    .add-btn {
      padding: 0.375rem 0.5rem; background: transparent; border: none; color: #0f62fe;
      cursor: pointer; font-size: 0.875rem; font-family: inherit; align-self: flex-start;
    }
    .add-btn:hover { background: #e8e8e8; }
    .add-btn:disabled { color: #c6c6c6; cursor: not-allowed; }

    /* Save bar */
    .save-bar { display: flex; gap: 0.5rem; justify-content: flex-end; padding: 1rem 0 0; }
    .btn { padding: 0.5rem 1rem; font-size: 0.875rem; border: none; cursor: pointer; font-family: inherit; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .btn-secondary { background: #393939; color: #fff; }
    .save-toast {
      margin-top: 1rem; padding: 0.75rem 1rem; background: #defbe6; border-left: 3px solid #198038;
      font-size: 0.875rem;
    }

    /* Help card */
    .help-card {
      background: #fff; border: 1px solid #e0e0e0; padding: 1rem 1.25rem; margin-bottom: 1rem;
      font-size: 0.8125rem; color: #525252;
    }
    .help-card strong { color: #161616; }
    .help-card code { background: #f4f4f4; padding: 0.125rem 0.25rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; }
    .demo-hint { font-size: 0.75rem; color: #0f62fe; margin-top: 0.5rem; font-style: italic; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — Reagent Usage v1 (interim) &nbsp;|&nbsp; OpenELIS Result Entry &nbsp;|&nbsp; Reagent row inserted between Methods and Storage &nbsp;|&nbsp; Not a live application
  </div>
  <div class="preview-content" id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // -------------------------------------------------------------------
    // Mock reagent inventory
    // -------------------------------------------------------------------
    const REAGENTS = [
      {
        reagentId: 'r-cellpack-dcl', reagentName: 'Cellpack DCL', unit: 'mL',
        lots: [
          { lotId: 'l1', lotNumber: 'LOT-2024-0892', expires: '12/20/2026', received: '06/15/2024',
            remainingQuantity: 30, lotSize: 200, reorderThreshold: 50, unit: 'mL', fifoRank: 1, status: 'expiring-soon' },
          { lotId: 'l2', lotNumber: 'LOT-2024-1234', expires: '01/15/2027', received: '09/01/2024',
            remainingQuantity: 170, lotSize: 200, reorderThreshold: 50, unit: 'mL', fifoRank: 2, status: 'ok' },
          { lotId: 'l3', lotNumber: 'LOT-2024-1567', expires: '02/28/2027', received: '11/12/2024',
            remainingQuantity: 200, lotSize: 200, reorderThreshold: 50, unit: 'mL', fifoRank: 3, status: 'ok' },
        ],
      },
      {
        reagentId: 'r-cellpack-ii', reagentName: 'Cellpack II', unit: 'mL',
        lots: [
          { lotId: 'l4', lotNumber: 'CPL2-2025-088', expires: '10/01/2026', received: '04/03/2025',
            remainingQuantity: 425, lotSize: 500, reorderThreshold: 100, unit: 'mL', fifoRank: 1, status: 'ok' },
        ],
      },
      {
        reagentId: 'r-lyser-wnr', reagentName: 'Lysercell WNR', unit: 'mL',
        lots: [
          { lotId: 'l5', lotNumber: 'LOT-2024-5678', expires: '12/25/2026', received: '07/18/2024',
            remainingQuantity: 90, lotSize: 200, reorderThreshold: 50, unit: 'mL', fifoRank: 1, status: 'expiring-soon' },
        ],
      },
      {
        reagentId: 'r-rt-mix', reagentName: 'COVID-19 PCR RT mix', unit: 'µL',
        lots: [
          { lotId: 'l6', lotNumber: 'RT-2026-118', expires: '08/01/2027', received: '01/12/2026',
            remainingQuantity: 1850, lotSize: 5000, reorderThreshold: 500, unit: 'µL', fifoRank: 1, status: 'ok' },
        ],
      },
      {
        reagentId: 'r-primer', reagentName: 'COVID-19 N1/N2 primer probe', unit: 'µL',
        lots: [
          { lotId: 'l7', lotNumber: 'PR-2026-N12-04', expires: '07/15/2027', received: '02/03/2026',
            remainingQuantity: 920, lotSize: 1000, reorderThreshold: 100, unit: 'µL', fifoRank: 1, status: 'ok' },
          { lotId: 'l8', lotNumber: 'PR-2025-N12-22', expires: '04/30/2026', received: '09/14/2025',
            remainingQuantity: 80, lotSize: 1000, reorderThreshold: 100, unit: 'µL', fifoRank: 2, status: 'expired' },
        ],
      },
    ];

    function searchProvider(rawQuery) {
      const q = (rawQuery || '').toLowerCase().trim();
      if (q.length < 2) return [];
      const results = [];
      REAGENTS.forEach(r => {
        r.lots.forEach(lot => {
          if (lot.lotNumber.toLowerCase().includes(q)) {
            results.push({ matchType: 'lot', reagentId: r.reagentId, reagentName: r.reagentName, lot });
          }
        });
      });
      REAGENTS.forEach(r => {
        if (r.reagentName.toLowerCase().includes(q)) {
          results.push({ matchType: 'name', reagentId: r.reagentId, reagentName: r.reagentName, lots: r.lots });
        }
      });
      return results.slice(0, 20);
    }

    // -------------------------------------------------------------------
    // Reagent Entry — three states
    // -------------------------------------------------------------------
    function ReagentEntry({ entry, onChange, onRemove, canRemove }) {
      const [searchValue, setSearchValue] = useState('');
      const [showResults, setShowResults] = useState(false);
      const [pendingReagent, setPendingReagent] = useState(null);

      const results = useMemo(() => searchProvider(searchValue), [searchValue]);

      const pickResult = (item) => {
        if (item.matchType === 'lot') {
          onChange({
            ...entry,
            reagentId: item.reagentId,
            reagentName: item.reagentName,
            lotId: item.lot.lotId,
            lotNumber: item.lot.lotNumber,
            unit: item.lot.unit,
            lotMeta: item.lot,
          });
          setPendingReagent(null);
        } else {
          setPendingReagent(item);
        }
        setSearchValue('');
        setShowResults(false);
      };

      const pickLot = (lot) => {
        if (lot.status === 'expired') return;
        onChange({
          ...entry,
          reagentId: pendingReagent.reagentId,
          reagentName: pendingReagent.reagentName,
          lotId: lot.lotId,
          lotNumber: lot.lotNumber,
          unit: lot.unit,
          lotMeta: lot,
        });
        setPendingReagent(null);
      };

      const isResolved = entry.lotId && entry.lotMeta;
      const exceedsRemaining = isResolved && entry.quantityUsed != null
        && entry.quantityUsed > entry.lotMeta.remainingQuantity;
      const lowStock = isResolved && entry.quantityUsed
        && (entry.lotMeta.remainingQuantity - entry.quantityUsed) < entry.lotMeta.reorderThreshold;
      const projectedRemaining = lowStock
        ? (entry.lotMeta.remainingQuantity - entry.quantityUsed).toFixed(1)
        : null;

      // -------- State 1: empty search --------
      if (!isResolved && !pendingReagent) {
        return (
          <div className="reagent-entry">
            <div className="reagent-entry-search">
              <input
                className="search-input"
                type="text"
                placeholder="Search reagent or lot number"
                value={searchValue}
                onChange={e => { setSearchValue(e.target.value); setShowResults(true); }}
                onFocus={() => setShowResults(true)}
                onBlur={() => setTimeout(() => setShowResults(false), 200)}
              />
              {showResults && results.length > 0 && (
                <div className="search-results">
                  {results.map((item, idx) => (
                    <div
                      key={idx}
                      className="search-item"
                      onMouseDown={() => pickResult(item)}
                    >
                      {item.matchType === 'lot' ? (
                        <>
                          <strong className="lot-mono">{item.lot.lotNumber}</strong>
                          <div className="meta">{item.reagentName} · exp {item.lot.expires} · {item.lot.remainingQuantity} {item.lot.unit} remaining</div>
                        </>
                      ) : (
                        <>
                          <strong>{item.reagentName}</strong>{' '}
                          <span style={{color:'#525252'}}>· {item.lots.length} lot{item.lots.length === 1 ? '' : 's'}</span>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              )}
              {showResults && searchValue.length >= 2 && results.length === 0 && (
                <div className="search-results">
                  <div className="search-item" style={{color:'#525252', cursor:'default'}}>No matches.</div>
                </div>
              )}
            </div>
            {canRemove && (
              <button className="remove-btn" onClick={onRemove} title="Remove">✕</button>
            )}
          </div>
        );
      }

      // -------- State 2: picking a lot --------
      if (pendingReagent) {
        return (
          <div className="reagent-entry">
            <div className="lot-picker">
              <div className="lot-picker-header">
                <span>
                  Available lots (FIFO order)<span className="subdued">· {pendingReagent.reagentName}</span>
                </span>
                <button className="cancel-btn" onClick={() => setPendingReagent(null)}>Cancel</button>
              </div>
              {pendingReagent.lots.map(lot => {
                const cls = ['lot-card'];
                if (lot.fifoRank === 1 && lot.status !== 'expired') cls.push('fifo');
                if (lot.status === 'expired') cls.push('expired');
                return (
                  <div
                    key={lot.lotId}
                    className={cls.join(' ')}
                    onClick={() => pickLot(lot)}
                    title={lot.status === 'expired' ? `Lot expired on ${lot.expires} and cannot be selected.` : undefined}
                  >
                    <div className="lot-card-line1">
                      <input type="radio" disabled={lot.status === 'expired'} readOnly />
                      <strong>{lot.lotNumber}</strong>
                      {lot.fifoRank === 1 && lot.status !== 'expired' && (
                        <span className="cds--tag cds--tag--teal">FIFO Suggested</span>
                      )}
                      {lot.status === 'expiring-soon' && <span className="cds--tag cds--tag--warm-gray">Expiring</span>}
                      {lot.status === 'expired' && <span className="cds--tag cds--tag--red">Expired</span>}
                    </div>
                    <div className="lot-card-line2">
                      Exp: {lot.expires} · {lot.remainingQuantity} {lot.unit} remaining
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // -------- State 3: resolved --------
      return (
        <>
          <div className="reagent-entry">
            <div className="resolved-chip">
              <strong className="lot-mono">{entry.lotNumber}</strong>
              <span style={{color:'#525252'}}>· {entry.reagentName}</span>
              <button
                className="change-btn"
                onClick={() => onChange({ id: entry.id })}
                title="Change reagent"
              >
                ✎
              </button>
            </div>
            <div className="qty-input">
              <label>Quantity Used</label>
              <input
                type="number"
                min="0"
                step={entry.unit === 'mL' || entry.unit === 'µL' ? '0.1' : '1'}
                value={entry.quantityUsed ?? ''}
                placeholder="0"
                className={exceedsRemaining ? 'invalid' : ''}
                onChange={e => onChange({
                  ...entry,
                  quantityUsed: e.target.value === '' ? null : Number(e.target.value),
                })}
              />
              {exceedsRemaining && (
                <div className="qty-error">
                  Cannot exceed remaining ({entry.lotMeta.remainingQuantity} {entry.unit}).
                </div>
              )}
            </div>
            <div className="qty-static-unit">{entry.unit}</div>
            <button className="remove-btn" onClick={onRemove} title="Remove">✕</button>
          </div>
          {lowStock && (
            <div className="cds--inline-notification cds--inline-notification--warning cds--inline-notification--low-contrast" style={{maxWidth:'none', marginTop:'-0.25rem'}}>
              <div className="cds--inline-notification__details">
                <div className="cds--inline-notification__text-wrapper">
                  <p className="cds--inline-notification__subtitle">
                    Saving this result will leave {entry.lotNumber} below reorder threshold ({projectedRemaining} {entry.unit} remaining). Notify your inventory officer.
                  </p>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // -------------------------------------------------------------------
    // App
    // -------------------------------------------------------------------
    let ENTRY_ID = 1;
    const newEntry = () => ({ id: `entry-${ENTRY_ID++}` });

    function App() {
      const [rowExpanded, setRowExpanded] = useState(true);
      const [entries, setEntries] = useState([newEntry()]);
      const [savedToast, setSavedToast] = useState(null);

      const updateEntry = (id, patch) => {
        setEntries(entries.map(e => e.id === id ? { ...e, ...patch } : e));
      };
      const removeEntry = (id) => {
        const next = entries.filter(e => e.id !== id);
        setEntries(next.length > 0 ? next : [newEntry()]);
      };
      const addEntry = () => setEntries([...entries, newEntry()]);

      const isOnlyEmptyEntry = (e) => entries.length === 1 && !e.lotId && !e.reagentId;

      const handleSave = () => {
        const events = entries
          .filter(e => e.lotId && e.quantityUsed > 0)
          .map(e => ({
            reagentLotId: e.lotMeta.lotId,
            quantityUsed: e.quantityUsed,
            unit: e.unit,
          }));
        setSavedToast({
          count: events.length,
          summary: events.map(e => `${e.reagentLotId} −${e.quantityUsed} ${e.unit}`).join(' · ') || 'No reagent events.',
        });
      };

      return (
        <div>
          <h2 style={{margin: '1rem 0', fontSize: '1.25rem', fontWeight: 600}}>
            Result Entry — Reagent Usage v1 (interim)
          </h2>

          <div className="help-card">
            <strong>Try the search.</strong> Type <code>Cellpack</code> or <code>COVID</code> to see name matches with lot counts. Pick a name to open the FIFO lot picker. Or search by lot like <code>RT-2026-118</code> to skip the picker. Try <code>PR-2025</code> to see an expired lot rendered but disabled. Once a row is resolved, enter a quantity above the lot's remaining stock for an inline error; below the reorder threshold for a low-stock warning.
            <div className="demo-hint">↓ The "Reagent" row sits between the existing Methods row and the Storage / NCE row, exactly matching the screenshot you shared.</div>
          </div>

          <div className="results-table">
            <div className="results-table-header">
              <div></div>
              <div>Sample Info</div>
              <div>Test Date</div>
              <div>Analyzer R...</div>
              <div>Test Name</div>
              <div>Normal Range</div>
              <div>Accept</div>
              <div>Result</div>
            </div>

            <div className="results-table-row">
              <div className="row-expand-toggle" onClick={() => setRowExpanded(!rowExpanded)}>
                {rowExpanded ? '▾' : '▸'}
              </div>
              <div className="sample-info">
                <span className="icon-copy" title="Copy sample info">⎘</span>
                <div>
                  DEV01262000000000-001-1<br/>
                  <span style={{color:'#525252', fontSize:'0.8125rem'}}>TEST-Smith, John E2E-PAT-001, M, 01/03/1991</span>
                </div>
                <div className="avatar">TJ</div>
              </div>
              <div>01/05/2026</div>
              <div>MANUAL</div>
              <div>COVID-19 PCR (Respiratory Swab)</div>
              <div>Any value</div>
              <div><input type="checkbox" /></div>
              <div>
                <select style={{width:'100%'}}>
                  <option value="">—</option>
                  <option>Detected</option>
                  <option>Not Detected</option>
                  <option>Inconclusive</option>
                </select>
              </div>
            </div>

            {rowExpanded && (
              <div className="expanded-panel">
                {/* ===== Methods row (existing) ===== */}
                <div className="panel-row methods-row">
                  <div className="row-label">Methods</div>
                  <div className="row-fields">
                    <div className="field">
                      <label>Methods</label>
                      <select>
                        <option>—</option>
                        <option>RT-PCR</option>
                        <option>Antigen rapid</option>
                      </select>
                    </div>
                    <button className="upload-btn">Upload file</button>
                    <div className="refer-cb">
                      <input type="checkbox" />
                      <span>Refer test to a reference lab</span>
                    </div>
                    <div className="field">
                      <label>Referral Reason</label>
                      <select disabled><option></option></select>
                    </div>
                    <div className="field">
                      <label>Institute</label>
                      <select disabled><option></option></select>
                    </div>
                    <div className="field">
                      <label>Test to Perform</label>
                      <input type="text" disabled value="COVID-19 PCR(Respira..." />
                    </div>
                  </div>
                </div>

                {/* ===== Reagent row (NEW v1) ===== */}
                <div className="panel-row reagent-row">
                  <div className="row-label">Reagent</div>
                  <div className="row-fields">
                    {entries.map(entry => (
                      <ReagentEntry
                        key={entry.id}
                        entry={entry}
                        onChange={(patch) => updateEntry(entry.id, patch)}
                        onRemove={() => removeEntry(entry.id)}
                        canRemove={!isOnlyEmptyEntry(entry)}
                      />
                    ))}
                    <button
                      className="add-btn"
                      onClick={addEntry}
                      disabled={entries.length >= 12}
                    >
                      + Add another reagent
                    </button>
                  </div>
                </div>

                {/* ===== Storage / NCE row (existing) ===== */}
                <div className="panel-row storage-row">
                  <div className="row-label">Storage</div>
                  <div className="row-fields">
                    <div className="label-block">
                      <strong>Storage location:</strong> Unassigned
                    </div>
                    <button className="assign-btn">Assign storage location</button>
                    <button className="nce-btn">
                      Report NCE <span className="err-icon">ⓘ</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="save-bar">
            <button className="btn btn-secondary">Cancel</button>
            <button className="btn btn-primary" onClick={handleSave}>Save Result</button>
          </div>

          {savedToast && (
            <div className="save-toast">
              <strong>Saved.</strong> {savedToast.count > 0
                ? `${savedToast.count} ReagentConsumptionEvent${savedToast.count === 1 ? '' : 's'} would be issued: ${savedToast.summary}`
                : 'No reagent rows captured (capture is optional in v1).'
              }
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
