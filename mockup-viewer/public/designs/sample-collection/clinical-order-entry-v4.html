<style>

  .yn { display: inline-flex; border: 1px solid #8d8d8d; }

/* One user action sends one write (FR-K5). Simulated connectivity comes from getSim(). */
function useSave(getSim, labNo) {
  const [saving, setSaving] = useState(false);
  const [pinned, setPinned] = useState(null);
  const busy = useRef(false);
  const start = () => { busy.current = true; setSaving(true); setPinned(null); };
  const stop = () => { busy.current = false; setSaving(false); };
  const unreachable = (fn, cont) => ({ kind: 'error', title: 'Nothing was saved', sub: 'Could not reach the server. Nothing was saved. Your entries are still here.', actions: [{ label: 'Retry', go: () => run(fn, cont) }] });
  const confirmSaved = (fn, cont) => {
    if (busy.current) return;
    start();
    setTimeout(() => {
      stop();
      const s = (getSim && getSim()) || {};
      if (s.down) { setPinned(unreachable(fn, cont)); return; }
      setPinned({ kind: 'success', title: 'Order ' + (labNo || LAB) + ' saved', sub: 'The first save had reached the server. Retry returned that result; no second order or sample was created.', actions: cont ? [{ label: cont, go: fn }] : [] });
    }, 700);
  };
  const run = (fn, cont) => {
    if (busy.current) return;
    start();
    const s = (getSim && getSim()) || {};
    setTimeout(() => {
      stop();
      if (s.down) { setPinned(unreachable(fn, cont)); return; }
      if (s.lost) { setPinned({ kind: 'warning', title: 'We could not confirm the save. Retry to check.', sub: 'The connection dropped before the server answered. Your entries are still here.', actions: [{ label: 'Retry', go: () => confirmSaved(fn, cont) }] }); return; }
      fn();
    }, 700);
  };
  return { saving, pinned, setPinned, run };
}

        <div style={{ display: 'grid', gap: 16, marginTop: 16 }}>
          <div className="chooser" id="list-panels">
            <div className="list-h"><strong>Order Panels</strong><span className="muted">{selPanels.length} selected</span></div>
            <div style={{ padding: '8px 12px' }}>
              <div className="tagset" style={{ marginBottom: 8, minHeight: 24 }}>
                {selPanels.length === 0 && <span className="muted">No panels selected</span>}
                {selPanels.map(pid => { const pi = panelInfo(ot, pid); return <span key={pid} className="chipx panel" title={pi.modified ? pi.removed.map(e => T[e.id].code).join(', ') + ' removed' : undefined}>{pi.modified ? P[pid].name + ' ' + pi.on + '/' + pi.total : P[pid].name + ' (' + pi.total + ' tests)'}<button type="button" aria-label={'Remove panel ' + P[pid].name} onClick={() => onRemovePanel(pid)}>{'✕'}</button></span>; })}
              </div>
              <TextInput size="sm" label="Search panels by name or LOINC" value={pq} onChange={v => { setPq(v); setPPage(0); }} placeholder="For example Liver or 24325-3" />
            </div>
            <div className="opts" role="group" aria-label="Order panels">
              {pShown.length === 0 && <div className="opt"><span></span><span className="muted">No panel matches these filters.</span><span></span></div>}
              {pShown.map(p => (
                <div key={p.id} className="opt">
                  <Checkbox label={'Select ' + p.name} hideLabel checked={selPanels.includes(p.id)} onChange={v => togglePanel(p.id, v)} />
                  <span><strong>{p.name}</strong><div className="meta"><span className="mono">{p.code}</span>{p.loinc ? ' | LOINC ' + p.loinc : ''} | {p.members.length} tests: {p.members.map(tname).join(', ')}</div></span>
                  <span className="meta" style={{ textAlign: 'right' }}>{p.unit}<br />{p.sts.join(', ')}</span>
                </div>
              ))}
            </div>
            <Pager page={pPage} per={PER} total={pMatch.length} onPage={setPPage} label="Order Panels" />
          </div>
          <div className="chooser" id="list-tests">
            <div className="list-h"><strong>Order Tests</strong><span className="muted">{ownTests.length} chosen on their own</span></div>
            <div style={{ padding: '8px 12px' }}>
              <div className="tagset" style={{ marginBottom: 8, minHeight: 24 }}>
                {ownTests.length === 0 && <span className="muted">No single tests selected. Tests from panels are listed in the Ordered tests table below.</span>}
                {ownTests.map(e => <span key={e.id} className="chipx">{tname(e.id)}<button type="button" aria-label={'Remove test ' + tname(e.id)} onClick={() => onRemoveTest(e.id)}>{'✕'}</button></span>)}
              </div>
              <TextInput size="sm" label="Search tests by name, code or LOINC" value={tq} onChange={v => { setTq(v); setTPage(0); }} placeholder="For example Creatinine, CREA or 2160-0" />
            </div>
            <div className="opts" role="group" aria-label="Order tests">
              {tShown.length === 0 && <div className="opt"><span></span><span className="muted">No active test matches these filters. Inactive tests and tests of a deactivated lab unit are never offered.</span><span></span></div>}
              {tShown.map(t => {
                const e = entry(t.id);
                return (
                  <div key={t.id} className="opt">
                    <Checkbox label={'Select ' + t.name} hideLabel checked={!!(e && e.own)} onChange={v => toggleTest(t.id, v)} />
                    <span>{t.name} {e && !e.own && <Tag c="blue">In {P[e.panels[0]].name}</Tag>}<div className="meta"><span className="mono">{t.code}</span>{t.loinc ? ' | LOINC ' + t.loinc : ''} | {t.unit}</div></span>
                    <span className="meta" style={{ textAlign: 'right' }}>{t.st}</span>
                  </div>
                );
              })}
            </div>
            <Pager page={tPage} per={PER} total={tMatch.length} onPage={setTPage} label="Order Tests" />
          </div>
          <div className="muted">Choosing a single test never attaches the panel it belongs to. Removing a panel removes the tests that came only from it, with Undo. Removing one member test keeps the panel, marked Modified (for example "Liver Function Panel 4/5"). Paged on the server, 25 per page; selections stay as chips across pages and filters.</div>
        </div>
      )}
    </div>
  );
}

/* ============================== Ordered tests table (FR-B18 to FR-B21), shared by both steps ============================== */
/* Expected container and required volume (FR-B18), for example "1 × K2EDTA 4 mL, min 2 mL" */
const ctText = x => x.n + ' × ' + C[x.c].short + (x.min ? ', min ' + x.min + ' ' + (x.unit || 'mL') : '');
function expectedCell(t) {
  if (!t.ct.length) return <span className="muted">No container set in the test catalog</span>;
  return (
    <div style={{ fontSize: 13 }}>
      <div style={{ whiteSpace: 'nowrap' }}><Swatch c={t.ct[0].c} />{ctText(t.ct[0])}</div>
      {t.ct[0].def && <div className="muted">Sample type default</div>}
      {t.ct.slice(1).map(x => <div key={x.c} className="muted">or {ctText(x)}{x.usedAs ? ' (used as ' + t.st + ')' : ''}</div>)}
      {t.own && <div style={{ marginTop: 2 }}><Tag c="warm-gray">Own container</Tag></div>}
    </div>
  );
}
function OrderedTestsTable({ mode, ot, rows, setRows, cfg, received, filt, onClearFilt, onRemoveTest, onRemovePanel, onRestoreTest, cancelReq, setCancelReq, onCancel, onUpdEntry, existingRefs = {}, patient, prov, fac, onMsg }) {
  const [showCancelled, setShowCancelled] = useState(false);
  const [warn, setWarn] = useState(null);
  const [nce, setNce] = useState(null);
  const [reason, setReason] = useState('');
  const prep = mode === 'prepare';
  const ro = mode === 'readonly';
  const us = usableRows(rows);
  const fk = filt && TEST_FILTERS.includes(filt) ? filt : null;
  /* Removed panel members always stay listed in their panel, struck through (FR-B16a) */
  const vis = ot.filter(e => (showCancelled || !e.cancelled || e.removed) && (!fk || e.cancelled ? !fk : testMatchesFilter(e, fk, rows, received)));
  const pids = [];
  vis.forEach(e => { if (e.panels.length && !pids.includes(e.panels[0])) pids.push(e.panels[0]); });
  const groups = pids.map(pid => ({ pid, items: vis.filter(e => e.panels[0] === pid) }));
  const solo = vis.filter(e => !e.panels.length);
  if (solo.length) groups.push({ pid: null, items: solo });
  const cancelledN = ot.filter(e => e.cancelled && !e.removed).length;
  const cols = 6 + (cfg.billingRefNumber ? 1 : 0) + (cfg.notifications ? 1 : 0);
  const refLab = (fac ? fac.n : 'Port Moresby General Hospital') + ' laboratory';

  const assign = (e, num) => {
    setWarn(null);
    const row = rows.find(r => r.num === num);
    if (!row || row.tests.includes(e.id)) return;
    if (compatible(e.id, row)) { moveTest(setRows, e.id, num, { manual: true }); onMsg && onMsg({ kind: 'success', text: tname(e.id) + ' is now on ' + num + '. Marked "Assigned by you"; automatic assignment will not change it.' }); }
    else setWarn({ tid: e.id, num });
  };
  /* FR-B19: the sample the test is actually on, as a solid suffix badge; an unconfirmed proposal is an outlined badge with "Proposed" */
  const isProposal = (h, tid) => !h.saved && !h.edited && !h.confirmed && !h.manual[tid];
  const hostBadge = (e, h) => {
    const prop = isProposal(h, e.id);
    return (
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
        <SfxBadge num={h.num} proposed={prop} title={h.num + ', ' + C[h.c].short + ', ' + h.st + (prop ? '. ' + (h.reason || 'Proposed') : '')} />
        {!prop && <span className="muted">{C[h.c].short}</span>}
        {prop && !ro && <button type="button" className="linkbtn" style={{ fontSize: 12 }} onClick={() => setRows(rs => rs.map(r => r.num === h.num ? { ...r, confirmed: true } : r))} aria-label={'Confirm proposed sample ' + h.num}>Confirm</button>}
      </span>
    );
  };
  const sampleCell = e => {
    if (e.removed) return <Tag c="gray">{e.saved ? 'Cancelled' : 'Removed'}</Tag>;
    if (e.cancelled) return <div><Tag c="gray">Cancelled</Tag><div className="muted">{e.cancelReason}</div></div>;
    if (e.up && e.up.on) return <Tag c="purple">Tested elsewhere: {refShort(e.up.lab)}</Tag>;
    const h = hostOf(e.id, rows);
    const ref = isReferred(e.id, rows);
    const extra = <>
      {ref && <div style={{ marginTop: 2 }}><Tag c="purple">Referred to {refShort(h.referTo)}</Tag></div>}
      {existingRefs[e.id] && <div className="muted">{existingRefs[e.id]}</div>}
    </>;
    if (mode === 'enter' || ro) {
      if (mode === 'enter' && !received) return <span className="muted">Not yet collected</span>;
      if (!h) return <Tag c="purple">Awaiting sample</Tag>;
      return <div>{hostBadge(e, h)}{extra}</div>;
    }
    const comp = us.filter(r => compatible(e.id, r));
    const others = us.filter(r => !compatible(e.id, r));
    const optL = r => sfxOf(r.num) + '  ' + C[r.c].short + ', ' + r.st;
    const opts = [{ v: '', l: h ? 'Move to another sample' : comp.length >= 2 ? 'Choose a sample' : 'Awaiting sample', disabled: true }];
    if (comp.filter(r => !h || r.num !== h.num).length) opts.push({ group: 'Compatible', options: comp.filter(r => !h || r.num !== h.num).map(r => ({ v: r.num, l: optL(r) })) });
    if (others.length) opts.push({ group: 'Not expected for this test', options: others.map(r => ({ v: r.num, l: optL(r) })) });
    const choose = !h && comp.length >= 2;
    return (
      <div id={'tsel-' + e.id} style={{ minWidth: 230 }}>
        {choose && (
          <div style={{ marginBottom: 4 }}>
            <Tag c="warm-gray">Choose a sample</Tag>
            <div className="tagset" style={{ marginTop: 4 }}>
              {comp.map(r => { const sp = T[e.id].ct.find(x => x.c === r.c); return <Btn key={r.num} kind="tertiary" onClick={() => assign(e, r.num)} style={{ minHeight: 28 }}><Swatch c={r.c} />{sfxOf(r.num)} {C[r.c].short}{sp && sp.usedAs ? ', used as ' + T[e.id].st : ''}</Btn>; })}
            </div>
          </div>
        )}
        {!h && !comp.length && <div style={{ marginBottom: 4 }}><Tag c="purple">Awaiting sample</Tag></div>}
        {h && <div style={{ marginBottom: 4 }}>{hostBadge(e, h)}</div>}
        <Select cell style={{ maxWidth: 320 }} label={'Sample for ' + tname(e.id)} value="" onChange={v => assign(e, v)} options={opts.length > 1 ? opts : [{ v: '', l: 'No samples yet' }]} />
        {h && h.manual[e.id] && <div className="muted" style={{ marginTop: 2 }}>Assigned by you</div>}
        {h && h.dev[e.id] && <div style={{ marginTop: 2 }}><Tag c="red">Deviation recorded</Tag></div>}
        {extra}
      </div>
    );
  };
  const removeBtn = e => {
    if (ro) return null;
    if (e.removed && !e.saved && onRestoreTest) return <IconBtn icon={I.undo} className="tip-left" label={'Undo removing ' + tname(e.id)} tip="Undo" onClick={() => onRestoreTest(e.id)} />;
    if (e.cancelled) return null;
    const member = e.panels.length > 0;
    return <IconBtn icon={I.trash} className="tip-left" label={(e.saved ? 'Cancel ' : 'Remove ') + tname(e.id)} tip={e.saved ? (member ? 'Remove from ' + P[e.panels[0]].name + ' (reason required)' : 'Cancel test (reason required)') : member ? 'Remove from ' + P[e.panels[0]].name + ' (panel stays, marked Modified)' : 'Remove test (Undo available)'} onClick={() => onRemoveTest(e.id)} />;
  };
  const renderRow = e => {
    const t = T[e.id];
    const up = e.up || {};
    const match = fk && fk !== 'tests';
    const cls = (e.cancelled ? 'cancelled ' : '') + (match ? 'fhl' : '');
    return (
      <React.Fragment key={e.id + (e.cancelled ? ':x' : '')}>
        <tr id={'trow-' + e.id + (e.cancelled ? '-x' : '')} className={cls}>
          <td style={{ minWidth: 220 }}>
            <div className="tagset" style={{ paddingLeft: e.panels.length ? 12 : 0 }}>
              <span className="strike"><strong style={{ fontWeight: 600 }}>{t.name}</strong> <span className="mono muted">{t.code}</span></span>
              {e.panels.map(pid => <Tag key={pid} c="gray">{P[pid].name}</Tag>)}
              {e.own && e.panels.length > 0 && <Tag c="gray">Also ordered on its own</Tag>}
              {prep && !e.saved && !e.cancelled && <Tag c="blue">Add-on, not saved</Tag>}
            </div>
            {e.removed && <div className="muted" style={{ paddingLeft: 12, marginTop: 2 }}>{removedText(e)}{!e.saved ? '. Undo is available until the order is saved.' : ''}</div>}
          </td>
          <td>{t.st}</td>
          <td style={{ minWidth: 170 }}>{expectedCell(t)}</td>
          <td style={{ minWidth: prep ? 240 : 160 }}>{sampleCell(e)}</td>
          <td><Checkbox label={'Tested elsewhere: ' + t.name} hideLabel checked={!!up.on} disabled={ro || e.cancelled} onChange={v => onUpdEntry(e.id, { up: { ...up, on: v, lab: up.lab || refLab, val: up.val || '' } })} /></td>
          {cfg.billingRefNumber && <td>{e.paidExt ? <span data-tip="Set by the billing system"><Tag c="green">Paid</Tag></span> : <Switch sm checked={!!e.paid} disabled={ro || e.cancelled} onChange={v => onUpdEntry(e.id, { paid: v })} label={e.paid ? 'Paid' : 'Unpaid'} hideState />}</td>}
          {cfg.notifications && <td style={{ minWidth: 190, fontSize: 12 }}>
            <Checkbox label={'Patient' + (patient && patient.phone ? ' (SMS ' + patient.phone + ')' : ' (no contact details)')} checked={e.notify.patient} disabled={ro || e.cancelled || !(patient && patient.phone)} onChange={v => onUpdEntry(e.id, { notify: { ...e.notify, patient: v } })} />
            <Checkbox label={'Provider' + (prov && prov.em ? ' (email ' + prov.em + ')' : ' (no contact details)')} checked={e.notify.provider && !!(prov && prov.em)} disabled={ro || e.cancelled || !(prov && prov.em)} onChange={v => onUpdEntry(e.id, { notify: { ...e.notify, provider: v } })} />
          </td>}
          <td style={{ width: 48 }}>{removeBtn(e)}</td>
        </tr>
        {up.on && !e.cancelled && (
          <tr className="exp-row"><td colSpan={cols}>
            <div className="grid g3" style={{ maxWidth: 900 }}>
              <TextInput size="sm" label={'Reported value for ' + t.name} value={up.val} onChange={v => onUpdEntry(e.id, { up: { ...up, val: v } })} placeholder={e.id === 'HBA1C' ? '7.2 %' : 'Value and unit'} readOnly={ro} />
              <Typeahead label="Performing laboratory" value={up.lab} onPick={o => onUpdEntry(e.id, { up: { ...up, lab: o.v } })} options={[refLab, ...ORG_LABS.filter(x => x !== refLab)].map(l => ({ v: l, l, meta: 'Organization' }))} placeholder="Search organizations" disabled={ro} helper="Search over organizations; defaults to the referring facility's laboratory" />
              <div className="muted" style={{ paddingTop: 20 }}>Result reported by another laboratory. A test tested elsewhere needs no sample. Behaviour owned by the External Lab IDs FRS.</div>
            </div>
          </td></tr>
        )}
        {cancelReq && cancelReq.kind === 'test' && cancelReq.id === e.id && (
          <tr className="exp-row"><td colSpan={cols}>
            <div style={{ maxWidth: 560 }}>
              <TextInput label={(e.panels.length ? 'Reason for removing ' + t.name + ' from ' + P[e.panels[0]].name : 'Reason for cancelling ' + t.name)} required value={reason} onChange={setReason} placeholder="For example: requested in error by the ward" />
              <p className="muted">{e.panels.length ? 'This order was saved, so removing a member test is a cancel with a reason. ' + P[e.panels[0]].name + ' stays on the order, marked Modified, and ' + t.code + ' stays listed in it, struck through.' : 'This test was saved, so it is cancelled, not deleted. It stays visible, struck through, under "Show cancelled".'}</p>
              <div style={{ display: 'flex', gap: 8 }}><Btn kind="danger" disabled={!reason.trim()} onClick={() => { onCancel('test', e.id, reason.trim()); setReason(''); }}>Confirm</Btn><Btn kind="ghost" onClick={() => { setCancelReq(null); setReason(''); }}>Keep test</Btn></div>
            </div>
          </td></tr>
        )}
        {warn && warn.tid === e.id && (() => {
          const r = rows.find(x => x.num === warn.num);
          return (
            <tr className="exp-row"><td colSpan={cols}>
              <Notif kind="warning" title={t.name + ' expects ' + (t.ct.length ? C[t.ct[0].c].art : 'another container') + '. This is ' + C[r.c].art + '.'} sub={'You can still assign it to ' + r.num + '. The deviation is recorded as a non-conformity (ISO 15189:2022 7.2.6.2).'}>
                <div style={{ display: 'flex', gap: 8 }}>
                  <Btn kind="secondary" onClick={() => setWarn(null)}>Cancel</Btn>
                  <Btn onClick={() => { moveTest(setRows, e.id, r.num, { manual: true, dev: true }); setNce({ tid: e.id, num: r.num, prefill: { category: 'Container', reason: 'Deviation: ' + t.name + ' assigned to ' + C[r.c].short + ' ' + r.num + ' (expects ' + (t.ct.length ? C[t.ct[0].c].art : 'another container') + ')', outcome: 'Continue with a flag' } }); setWarn(null); }}>Assign and record deviation</Btn>
                </div>
              </Notif>
            </td></tr>
          );
        })()}
        {nce && nce.tid === e.id && (
          <tr className="exp-row"><td colSpan={cols}>
            <NcePanel nums={[nce.num]} tests={[e.id]} prefill={nce.prefill} onCancel={() => setNce(null)} onApply={() => { setRows(rs => rs.map(r => r.num === nce.num ? { ...r, status: withStatus(withStatus(r, 'Non-conformity'), 'Pending save') } : r)); setNce(null); onMsg && onMsg({ kind: 'info', text: 'Deviation recorded on ' + nce.num + '. It is saved with this step.' }); }} />
          </td></tr>
        )}
      </React.Fragment>
    );
  };
  const totalShown = vis.filter(e => !e.cancelled).length;
  return (
    <NewBlock style={{ padding: '28px 12px 12px' }} id="tbl-tests">
      <div className="mono" style={{ position: 'absolute', top: 8, left: 14, fontSize: 11, color: '#0043ce', fontWeight: 600 }}>Shared component: ordered tests table | mode: {mode}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 8, flexWrap: 'wrap' }}>
        <strong style={{ fontSize: 15 }}>Ordered tests</strong>
        <span className="muted">{ot.filter(e => !e.cancelled).length} tests, grouped by panel. {prep ? 'The Sample cell shows the sample each test is on; move it from the picker, compatible samples first.' : received ? 'The Sample column shows the sample each test is on. An outlined badge is a proposal, not yet confirmed.' : 'Samples have not been received yet.'}</span>
        {cancelledN > 0 && <div style={{ marginLeft: 'auto' }}><Checkbox label={'Show cancelled (' + cancelledN + ')'} checked={showCancelled} onChange={setShowCancelled} /></div>}
      </div>
      <FilterBar k={fk} shown={totalShown} total={ot.filter(e => !e.cancelled).length} onClear={onClearFilt} />
      <div className="cds--data-table-container table-scroll">
        <table className="cds--data-table cds--data-table--xs otbl" style={{ width: '100%' }}>
          <thead><tr>
            <th>Test</th><th>Sample type</th><th>Expected container and volume</th><th>Sample</th><th><span data-tip="Result reported by another laboratory" tabIndex={0}>Tested elsewhere</span></th>
            {cfg.billingRefNumber && <th>Paid</th>}
            {cfg.notifications && <th>Notify</th>}
            <th><span className="cds--visually-hidden">Remove</span></th>
          </tr></thead>
          <tbody>
            {ot.length === 0 && <tr><td colSpan={cols} className="muted" style={{ padding: 16 }}>No tests yet. Add a panel or test above, or type a code.</td></tr>}
            {ot.length > 0 && vis.length === 0 && <tr><td colSpan={cols} className="muted" style={{ padding: 16 }}>No test matches this filter.</td></tr>}
            {groups.map(g => (
              <React.Fragment key={g.pid || 'solo'}>
                <tr className="grp">
                  <td colSpan={cols - 1}>
                    {g.pid ? <><strong>{P[g.pid].name}, {panelCountText(ot, g.pid)}</strong> <Tag c="gray">Panel</Tag>{panelInfo(ot, g.pid).modified && <> <Tag c="warm-gray">Modified</Tag></>} <span className="mono muted">{P[g.pid].code}</span></> : <strong>Individual tests</strong>}
                    {g.pid && cancelReq && cancelReq.kind === 'panel' && cancelReq.id === g.pid && (
                      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', marginTop: 8, maxWidth: 700 }}>
                        <div style={{ flex: 1 }}><TextInput size="sm" label={'Reason for cancelling ' + P[g.pid].name} required value={reason} onChange={setReason} /></div>
                        <Btn kind="danger" disabled={!reason.trim()} onClick={() => { onCancel('panel', g.pid, reason.trim()); setReason(''); }}>Confirm</Btn>
                        <Btn kind="ghost" onClick={() => { setCancelReq(null); setReason(''); }}>Keep panel</Btn>
                      </div>
                    )}
                  </td>
                  <td>{g.pid && !ro && ot.some(e => !e.cancelled && e.panels.includes(g.pid)) && <IconBtn icon={I.trash} className="tip-left" label={'Remove panel ' + P[g.pid].name} tip="Remove panel and its tests" onClick={() => onRemovePanel(g.pid)} />}</td>
                </tr>
                {g.items.map(renderRow)}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </NewBlock>
  );
}

/* ============================== Per-sample action panels (fenced shipped components) ============================== */
function StoragePanel({ nums, taken, onApply, onCancel }) {
  const [q, setQ] = useState('Rack R4');
  const free = POSITIONS.filter(p => !taken[p] || nums.includes(taken[p]));
  const [pos, setPos] = useState(free[0] || '');
  const multi = nums.length > 1;
  const plan = multi ? nums.map((n, i) => [n, free[i]]) : [[nums[0], pos]];
  const short = plan.some(x => !x[1]);
  return (
    <Fence label="Existing: storage location picker (OGC-657)">
      <div className="h3" style={{ fontSize: 14 }}>{multi ? 'Store ' + nums.length + ' samples' : <>Set storage for <SfxBadge num={nums[0]} /></>}</div>
      <div className="grid g2">
        <TextInput label="Search room, device, shelf, rack or box" value={q} onChange={setQ} helper="Abbreviated drawing. Hierarchy, search and storage locks are defined by OGC-657 and OGC-979." />
        <div>
          <span className="lbl">Location</span>
          <div className="tagset"><Tag c="cool-gray">Specimen Reception</Tag>&gt;<Tag c="cool-gray">Fridge 2</Tag>&gt;<Tag c="cool-gray">Shelf B</Tag>&gt;<Tag c="blue">Rack R4</Tag></div>
        </div>
      </div>
      {multi ? (
        <div style={{ marginTop: 12 }}>
          <span className="lbl">Consecutive free positions, shown for confirmation</span>
          <div className="tagset">{plan.map(([n, p]) => <Tag key={n} c={p ? 'gray' : 'red'}>{sfxOf(n)} &gt; {p || 'no free position'}</Tag>)}</div>
          {short && <Notif kind="warning" title="Rack R4 has no more free positions." sub="Choose another rack for the remaining samples." style={{ marginTop: 8 }} />}
        </div>
      ) : (
        <>
          <span className="lbl" style={{ marginTop: 12 }}>Position in Rack R4</span>
          <div className="posgrid">
            {POSITIONS.map(p => <button key={p} type="button" disabled={!!taken[p] && taken[p] !== nums[0]} className={pos === p ? 'sel' : ''} onClick={() => setPos(p)}>{p}{taken[p] ? <div style={{ fontSize: 9 }}>{sfxOf(taken[p])}</div> : null}</button>)}
          </div>
        </>

/* ============================== Labels (section I) ==============================
   One label state per step, shared by the Labels section, the samples table Printer icons and the Order section shortcut.
   OpenELIS generates label files (PDF). It keeps no label status: nothing records whether a file was generated,
   printed or put on a tube (FR-I6). Print opens the file; a quantity above the preset maximum needs the label override (FR-I7). */
function labelRowsOf(rows) {
  const prim = rows.filter(r => !r.parent && !r.gone && !r.voided && !r.status.includes('Rejected')).sort((a, b) => a.pos - b.pos);
  const out = [];
  prim.forEach(p => { out.push(p); rows.filter(r => r.parent === p.num && !r.gone && !r.voided).forEach(c => out.push(c)); });
  return out;
}
function useLabels({ rows, setRows, ot, psim, orderSaved, me, cfg, labNo }) {
  const [orderQty, setOrderQty] = useState({});
  const [orderBy, setOrderBy] = useState({});
  const [extra, setExtra] = useState([]);
  const [showAll, setShowAll] = useState(false);
  const [msg, setMsg] = useState(null);
  const [over, setOver] = useState(null);
  const oMap = orderLabelMap(ot);
  const lrows = labelRowsOf(rows);
  const maps = {};
  lrows.forEach(r => { maps[r.num] = rowLabelMap(r, ot); });
  const cellOf = (r, p) => labelCell(maps[r.num] || rowLabelMap(r, ot), p, r.lblQty, r.lblBy, extra.includes(p), cfg);
  const orderCell = p => labelCell(oMap, p, orderQty, orderBy, extra.includes(p), cfg);
  /* FR-I3: columns are the presets linked to the order's tests or with a default above zero; Add label type and Show all add the rest */
  const inUse = level => ACTIVE_PRESETS.filter(k => PRESETS[k].level === level && (showAll || extra.includes(k) ||
    (level === 'order' ? !!(oMap[k] && oMap[k].n > 0) : lrows.some(r => maps[r.num][k] && maps[r.num][k].n > 0))));
  const orderCols = inUse('order');
  const sampleCols = inUse('sample');
  const num = c => parseInt(c.v, 10) || 0;
  const rowCount = (r, only) => (only ? [only] : sampleCols).reduce((s, p) => s + num(cellOf(r, p)), 0);
  const orderCount = only => (only ? [only] : orderCols).reduce((s, p) => s + num(orderCell(p)), 0);
  const total = orderCount() + lrows.reduce((s, r) => s + rowCount(r), 0);
  const setQty = (n, p, v) => setRows(rs => rs.map(r => r.num === n ? { ...r, lblQty: { ...(r.lblQty || {}), [p]: v }, lblBy: { ...(r.lblBy || {}), [p]: me } } : r));
  const setOQty = (p, v) => { setOrderQty(q => ({ ...q, [p]: v })); setOrderBy(b => ({ ...b, [p]: me })); };
  const addable = ACTIVE_PRESETS.filter(k => !(PRESETS[k].level === 'order' ? orderCols : sampleCols).includes(k));

  const run = (job, isRetry) => {
    const rs = job.nums.map(n => rows.find(x => x.num === n)).filter(Boolean);
    const count = rs.reduce((s, r) => s + rowCount(r, job.only), 0) + (job.order ? orderCount(job.only) : 0);
    const who = [rs.length === 1 ? rs[0].num : rs.length ? rs.length + ' samples' : '', job.order ? 'the order' : ''].filter(Boolean).join(' and ');
    const what = (job.only ? PRESETS[job.only].name.toLowerCase() + 's on ' : '') + who;
    const say = m => setMsg({ ...m, src: job.src });
    const unsaved = rs.some(r => !r.saved) || (job.order && !orderSaved);
    if (unsaved) {
      say({ kind: 'info', text: 'Save the step to print ' + count + ' labels for ' + what + '.', sub: 'Labels print only from saved samples. Save and exit or Save and next saves the step; then print.' });
      return;
    }
    if (psim && psim.printFail && !isRetry) {
      say({ kind: 'error', text: 'The label file could not be generated. The order is saved.', sub: count + ' labels for ' + what + '.', retry: () => run(job, true) });
      return;
    }
    if (psim && psim.printBlocked && !isRetry) {
      say({ kind: 'warning', text: 'The print window was blocked, so the label file was downloaded instead.', sub: 'labels-' + (labNo || LAB) + '.pdf (' + count + ' labels for ' + what + ') is in your downloads. Open it to print.', retry: () => run(job, true), retryLabel: 'Open the print window again' });
      return;
    }
    say({ kind: 'success', text: 'Label file opened in the print window: ' + count + ' labels for ' + what + '.' });
  };
  /* FR-I7: printing asks nothing, except that a quantity above the preset maximum needs the existing label override */
  const overOf = job => {
    const out = [];
    job.nums.forEach(n => { const r = lrows.find(x => x.num === n); if (r) (job.only ? [job.only] : sampleCols).forEach(p => { const c = cellOf(r, p); if (num(c) > c.max) out.push(sfxOf(r.num) + ' ' + PRESETS[p].name.toLowerCase() + ' ' + num(c) + ' (maximum ' + c.max + ')'); }); });
    if (job.order) (job.only ? [job.only] : orderCols).forEach(p => { const c = orderCell(p); if (num(c) > c.max) out.push('order ' + PRESETS[p].name.toLowerCase() + ' ' + num(c) + ' (maximum ' + c.max + ')'); });
    return out;
  };
  const print = job => {
    const o = overOf(job);
    if (o.length) { setMsg(null); setOver({ job, items: o, reason: '' }); return; }
    setOver(null); run(job);
  };
  const printAll = src => print({ nums: lrows.map(r => r.num), order: true, src });
  return { rows: lrows, orderCols, sampleCols, cellOf, orderCell, rowCount, orderCount, total, setQty, setOQty, extra, setExtra, showAll, setShowAll, addable,
    msg, setMsg, over, setOver, run, print, printAll };
}

      {setCfg && <div className="pvc pvc-inline"><Checkbox label="Preview: Allow label override at order entry (global setting)" checked={cfg.labelOverride !== false} onChange={v => setCfg(c => ({ ...c, labelOverride: v }))} /></div>}
      <LabelMsgs lab={lab} src="labels" />
      <div className="lbl-part">
        <div className="lbl-part-h">Order labels</div>
        <div className="table-scroll">
          <table className="cds--data-table cds--data-table--xs ltbl" id="tbl-order-labels">
            <thead><tr><th>Order</th>{lab.orderCols.map(p => <PresetHead key={p} p={p} />)}<th className="lh-print">Print</th></tr></thead>
            <tbody><tr>
              <td className="mono" style={{ whiteSpace: 'nowrap' }}>{labNo}</td>
              {lab.orderCols.map(p => <td key={p}><QtyCell c={lab.orderCell(p)} label={presetFull(p) + ', order'} ro={ro} onChange={v => lab.setOQty(p, v)} /></td>)}
              <td><IconBtn icon={I.print} label="Print order labels row" tip="Print row" onClick={() => lab.print({ nums: [], order: true, src: 'labels' })} /></td>
            </tr></tbody>
          </table>
        </div>
      </div>
      {orderOnly ? <p className="muted" style={{ margin: '8px 0 0' }}>Sample labels appear here once samples are added to the order.</p> : (
        <div className="lbl-part" style={{ marginTop: 12 }}>
          <div className="lbl-part-h">Sample labels</div>
          <div className="table-scroll">
            <table className="cds--data-table cds--data-table--xs ltbl" id="tbl-sample-labels">
              <thead><tr><th>Sample</th>{cols.map(p => <PresetHead key={p} p={p} onPrint={ro ? null : () => lab.print({ nums: lab.rows.map(r => r.num), only: p, src: 'labels' })} />)}<th className="lh-print">Print</th></tr></thead>
              <tbody>
                {lab.rows.length === 0 && <tr><td colSpan={cols.length + 2} className="muted">No samples yet.</td></tr>}
                {lab.rows.map(r => (
                  <tr key={r.num} id={'lrow-' + r.num}>
                    <td style={{ whiteSpace: 'nowrap', paddingLeft: r.parent ? 28 : undefined }}><SfxBadge num={r.num} /> <span className="muted">{r.parent ? 'Aliquot, ' + r.st : C[r.c].short}</span></td>
                    {cols.map(p => <td key={p}><QtyCell c={lab.cellOf(r, p)} label={presetFull(p) + ', ' + sfxOf(r.num)} ro={ro} onChange={v => lab.setQty(r.num, p, v)} /></td>)}
                    <td><IconBtn icon={I.print} label={'Print row ' + r.num} tip="Print row" onClick={() => lab.print({ nums: [r.num], src: 'labels' })} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      <div className="lbl-foot">
        {!ro && <div style={{ width: 280 }}><Select cell label="Add label type" value={addK} onChange={v => { if (v) lab.setExtra(x => [...x, v]); setAddK(''); }} options={[{ v: '', l: lab.addable.length ? 'Add label type...' : 'Every active label type is shown' }, ...lab.addable.map(k => ({ v: k, l: presetFull(k) + (PRESETS[k].level === 'order' ? ' (per order)' : ' (per sample)') }))]} /></div>}
        <Switch sm checked={lab.showAll} onChange={lab.setShowAll} label="Show all label types" hideState />
        <span style={{ flex: 1 }}></span>
        <span className="muted" id="lbl-total">{lab.total} labels in total</span>
        {!ro && <Btn kind="primary" onClick={() => lab.printAll('labels')}>Print all labels {I.print}</Btn>}
      </div>
      <p className="muted" style={{ margin: '6px 0 0' }}>{ACTIVE_PRESETS.length} active label presets in Label Presets (system and custom); inactive presets never appear. Hover a quantity to see where it came from.</p>
    </div>
  );
}

/* ============================== Shared samples table (section C): one implementation ============================== */
/* Storage path truncated from the left, full path in the tooltip (FR-C11) */
const storeShort = path => { const p = path.split(' > '); return p.length > 2 ? '… > ' + p.slice(-2).join(' > ') : path; };
function SamplesTable({ mode, rows, setRows, ot, cfg, labNo = LAB, recAt = RECEIVED, filt, onClearFilt, pre = {}, cmd, existingRefs = {}, onAliquotFirst, hl, lab }) {
  const ro = mode === 'readonly';
  const prep = mode === 'prepare';
  const me = prep || ro ? ME_TECH : ME_RECEPTION;
  const [sel, setSel] = useState(pre.sel || []);
  const [panel, setPanel] = useState(pre.panel || {});
  const [det, setDet] = useState(pre.details || {});
  const [bulk, setBulk] = useState(null);
  const [adding, setAdding] = useState(false);
  const [addQ, setAddQ] = useState('');
  const [addC, setAddC] = useState('');
  const [addN, setAddN] = useState('1');
  const [scan, setScan] = useState('');
  const [scanErr, setScanErr] = useState('');
  const [flash, setFlash] = useState(null);
  const [showVoided, setShowVoided] = useState(false);
  const [msg, setMsg] = useState(null);
  const [fill, setFill] = useState(false);
  const [editC, setEditC] = useState(null);

  useEffect(() => {
    if (!cmd) return;
    if (cmd.type === 'panel') { setPanel(p => ({ ...p, [cmd.num]: { type: cmd.ptype, prefill: cmd.prefill } })); setTimeout(() => { const el = document.getElementById('row-' + cmd.num); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); }
    if (cmd.type === 'editColl') { setEditC(cmd.num); setTimeout(() => flashEl('cell-coll-' + cmd.num, 'input,select'), 60); }
    if (cmd.type === 'site') setTimeout(() => flashEl('cell-site-' + cmd.num, 'select,input'), 60);
    if (cmd.type === 'details') setDet(d => ({ ...d, [cmd.num]: true }));
  }, [cmd]);

  const upd = (num, f) => setRows(rs => rs.map(r => r.num === num ? { ...r, ...(typeof f === 'function' ? f(r) : f) } : r));
  const openPanel = (num, type, extra) => setPanel(p => ({ ...p, [num]: { type, ...(extra || {}) } }));
  const closePanel = num => setPanel(p => { const n = { ...p }; delete n[num]; return n; });
  const fk = ['samples', 'stored'].includes(filt) ? filt : null;

  const live = liveRows(rows);
  const actionable = live.filter(r => !r.status.includes('Rejected'));
  const primaries = rows.filter(r => !r.parent && !r.gone).sort((a, b) => a.pos - b.pos);
  const ordered = [];
  primaries.forEach(p => { ordered.push(p); rows.filter(r => r.parent === p.num && !r.gone).forEach(c => ordered.push(c)); });
  const visible = ordered.filter(r => (showVoided || !r.voided) && rowMatchesFilter(r, fk));
  const voidedN = rows.filter(r => r.voided).length;
  const showSite = live.some(r => !r.parent && stSite(r.st) !== 'Not used');
  const taken = {};
  rows.forEach(r => { if (r.storage && r.storage.startsWith(STORE_PATH)) taken[r.storage.split(' > ').pop()] = r.num; });
  const remainingOf = p => (parseFloat(p.qty) || 0) - rows.filter(r => r.parent === p.num && !r.voided && !r.gone).reduce((s, r) => s + (parseFloat(r.qty) || 0), 0);
  const cols = (ro ? 0 : 1) + 8 + (showSite ? 1 : 0);
  const say = m => setMsg(m);
  const printRows = nums => lab && lab.print({ nums, src: 'samples' });

  const onScan = e => {
    if (e.key !== 'Enter') return;
    const v = normNum(scan);
    const hit = rows.find(r => !r.gone && (r.num.toUpperCase() === v || sfxOf(r.num) === v));
    if (hit) { setSel(s => s.includes(hit.num) ? s : [...s, hit.num]); setFlash(hit.num); setScanErr(''); setScan(''); setTimeout(() => setFlash(null), 1600); const el = document.getElementById('row-' + hit.num); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    else setScanErr('No sample ' + scan.trim() + ' on this order.');
  };
  const addMatches = CLIN_C.filter(k => !addQ.trim() || (C[k].name + ' ' + C[k].code + ' ' + C[k].cat).toLowerCase().includes(addQ.trim().toLowerCase()));
  const addSamples = () => {
    const n = parseInt(addN, 10) || 1;
    const k = addC;
    setRows(rs => {
      let max = nextPos(rs) - 1;
      const add = [];
      for (let i = 0; i < n; i++) { max += 1; add.push(mkRow({ num: labNo + '-' + max, pos: max, key: 'user:' + max, c: k, st: C[k].yields[0], reason: 'Added by you', edited: true, saved: false, qty: C[k].vol, unit: C[k].unit || 'swab', status: [] })); }
      return [...rs, ...add];
    });
    setAdding(false); setAddC(''); setAddQ('');
    say({ kind: 'info', text: 'Added ' + n + ' ' + C[k].short + '. Rows you add are marked Edited and are never changed by the proposal.' + (prep ? ' Tests are assigned automatically where only one sample fits.' : '') });
  };
  const removeRow = r => {
    if (r.saved) { openPanel(r.num, 'void'); return; }
    const snap = rows;
    setRows(rs => rs.map(x => (x.num === r.num || x.parent === r.num) ? { ...x, gone: true } : x));
    setSel(s => s.filter(n => n !== r.num));
    say({ kind: 'info', text: 'Removed ' + r.num + ' (' + C[r.c].short + ').' + (r.tests.length ? ' Its tests return to Awaiting sample.' : ''), undo: () => setRows(snap) });
  };
  /* Holding time (FR-D3): only near the limit or past it is an exception worth a Tag */
  const holdInfo = r => {
    if (r.parent || r.voided || r.status.includes('Rejected')) return null;
    const hs = r.tests.filter(t => T[t] && T[t].hold).map(t => ({ t, h: T[t].hold }));
    if (!hs.length) return null;
    const lim = hs.reduce((a, b) => b.h < a.h ? b : a);
    const c = effColl(r, cfg, recAt);
    const fromReceipt = !c.at;
    const from = c.at || recAt;
    const left = lim.h * 60 - minsBetween(from, NOW);
    return { lim, from, fromReceipt, left, near: left > 0 && left <= lim.h * 60 * 0.2, exceeded: left <= 0, title: 'Limit ' + lim.h + ' h (' + tname(lim.t) + '), counted from ' + (fromReceipt ? 'receipt ' : 'collection ') + fmtDT(from) };
  };
  /* Status: exceptions only (FR-C2, FR-C2a, FR-C11), at most two Tags then "+n" */
  const statusTags = r => {
    const out = [];
    if (r.voided) out.push({ k: 'Voided', c: 'gray', tip: 'Voided: ' + r.voidReason });
    if (r.status.includes('Rejected')) out.push({ k: 'Rejected', c: 'red' });
    const h = (prep || ro) ? holdInfo(r) : null;
    if (h && h.exceeded) out.push({ k: 'Holding time exceeded', c: 'red', tip: h.title });
    if (r.status.includes('Non-conformity')) out.push({ k: 'Non-conformity', c: 'warm-gray', warn: true });
    if (h && h.near) out.push({ k: fmtDur(h.left) + ' left', c: 'warm-gray', warn: true, tip: h.title + (h.fromReceipt ? '. Counted from receipt (collection time unknown)' : '') });
    if (r.status.includes('Referred') && !r.voided) out.push({ k: 'Referred', c: 'purple', tip: 'Referred to ' + r.referTo });
    const proposed = !r.saved && !r.edited && !r.confirmed && !r.parent;
    if (proposed) out.push({ k: 'Proposed', c: 'blue', tip: r.reason || 'Proposed' });
    else if (!r.voided && (!r.saved || r.status.includes('Pending save'))) out.push({ k: 'Pending save', c: 'blue' });
    return { out, hold: h };
  };
  const renderStatus = r => {
    const { out, hold } = statusTags(r);
    const shown = out.slice(0, 2), rest = out.slice(2);
    return (
      <div className="tagset">
        {shown.map(t => <Tag key={t.k} c={t.c} warn={t.warn} tip={t.tip}>{t.k}</Tag>)}
        {rest.length > 0 && <Tag c="gray" tip={rest.map(t => t.k).join(', ')}>+{rest.length}</Tag>}
        {hold && hold.exceeded && !r.status.includes('Non-conformity') && !ro && <button type="button" className="linkbtn" style={{ fontSize: 12, width: '100%' }} onClick={() => openPanel(r.num, 'nce', { prefill: { category: 'Specimen quality', reason: 'Holding time exceeded: ' + tname(hold.lim.t) + ' limit ' + hold.lim.h + ' h, collected ' + fmtDT(hold.from), outcome: 'Reject and request a new sample' } })}>Report non-conformity</button>}
      </div>
    );
  };
  const testTags = r => {
    const out = []; const used = new Set();
    panelsOf(ot).forEach(pid => {
      const mem = ot.filter(e => !e.cancelled && e.panels.includes(pid)).map(e => e.id);
      const pi = panelInfo(ot, pid);
      if (mem.length > 1 && mem.every(m => r.tests.includes(m) && !r.dev[m])) { out.push({ k: pid, label: P[pid].name + (pi.modified ? ' ' + pi.on + '/' + pi.total + ', modified' : ' (' + mem.length + ')'), title: mem.map(tname).join(', ') + (pi.modified ? '. Removed: ' + pi.removed.map(e => tname(e.id)).join(', ') : ''), c: pi.modified ? 'warm-gray' : 'gray' }); mem.forEach(m => used.add(m)); }
    });
    r.tests.forEach(t => { if (!used.has(t)) out.push({ k: t, label: tname(t) + (r.manual[t] ? ' (by you)' : '') + (r.dev[t] ? ', deviation' : ''), title: r.manual[t] ? 'Assigned by you' : 'Assigned automatically', c: r.dev[t] ? 'red' : 'gray' }); });
    return out;
  };
  const collCell = r => {
    if (r.parent) return <span className="muted">From {sfxOf(r.parent)}</span>;
    const c = effColl(r, cfg, recAt);
    if (editC === r.num && !ro && !r.voided) return <div id={'cell-coll-' + r.num}><CollEditor value={c} me={me} recAt={recAt} onCancel={() => setEditC(null)} onDone={v => { upd(r.num, x => ({ coll: { ...(x.coll || {}), ...v, afterOk: false } })); setEditC(null); }} /></div>;
    const who = c.elsewhere ? 'Collected elsewhere, collector unknown' : c.by;
    const after = c.at && !c.defaulted && c.at > recAt;
    return (
      <div id={'cell-coll-' + r.num} style={{ minWidth: 130 }}>
        <button type="button" className="cellbtn" disabled={ro || r.voided} onClick={() => setEditC(r.num)} aria-label={'Edit collection date, time and collector for ' + r.num}>
          <div>{c.at ? fmtDT(c.at) : <span className="err-text">No date or time</span>} {!ro && !r.voided && I.edit}</div>
          <div style={{ fontSize: 12 }}>{who ? who : <span className="err-text">No collector</span>}</div>
        </button>
        {c.defaulted && !ro && <div style={{ marginTop: 2 }}><Tag c="warm-gray">Defaulted, confirm</Tag> <button type="button" className="linkbtn" style={{ fontSize: 12 }} onClick={() => upd(r.num, x => ({ coll: { ...(x.coll || {}), at: recAt } }))}>Confirm</button></div>}
        {after && <div className="warn-text" style={{ display: 'block' }}>Collection time is after receipt ({fmtDT(recAt)}).{!ro && <Checkbox label="Confirm: collection time is after receipt" checked={!!(r.coll && r.coll.afterOk)} onChange={v => upd(r.num, x => ({ coll: { ...(x.coll || {}), afterOk: v } }))} />}</div>}
      </div>
    );
  };
  const siteCell = r => {
    if (r.parent) return <span className="muted">From parent</span>;
    const m = stSite(r.st);
    if (m === 'Not used') return <span className="muted" title={'Body site is not used for ' + r.st}>Not used</span>;
    const lock = siteLockOf(r.tests);
    if (lock) return <div id={'cell-site-' + r.num} data-tip={'Set by ' + lock.by + ' in the test catalog'}><div>{I.lock} {SITE[lock.site].name}</div><div className="muted">Set by {lock.by} in the test catalog</div></div>;
    if (ro || r.voided) return <span>{r.site ? (SITE[r.site].side && r.side ? r.side + ' ' : '') + (r.site === 'other' ? r.other : SITE[r.site].name.toLowerCase()) : <span className="muted">None</span>}</span>;
    const s = SITE[r.site];
    const miss = m === 'Required' && (!r.site || (s && s.side && !r.side) || (r.site === 'other' && !r.other.trim()));
    return (
      <div id={'cell-site-' + r.num} style={{ minWidth: 120 }}>
        <Select cell label={'Body site for ' + r.num} required={m === 'Required'} value={r.site} onChange={v => upd(r.num, x => ({ site: v, side: SITE[v] && SITE[v].side ? x.side : '' }))} options={[{ v: '', l: m === 'Required' ? 'Choose a site' : 'Choose a site (optional)' }, ...ST_SITE[r.st].allowed.map(id => ({ v: id, l: SITE[id].name }))]} />
        {s && s.side && <div style={{ marginTop: 4 }}><Select cell label={'Side for ' + r.num} value={r.side} onChange={v => upd(r.num, { side: v })} options={[{ v: '', l: 'Side' }, ...SIDES]} /></div>}
        {r.site === 'other' && <input className="cds--text-input cell-input" style={{ marginTop: 4 }} maxLength={40} aria-label={'Other site for ' + r.num} placeholder="Other site (up to 40 characters)" value={r.other} onChange={e => upd(r.num, { other: e.target.value })} />}
        {miss && <div className="err-text" style={{ marginTop: 2 }}>{!r.site ? 'Required for ' + r.st : s && s.side && !r.side ? 'Choose the side' : 'Describe the site'}</div>}
        {!miss && r.site && <div className="muted" style={{ marginTop: 2 }}>{specimenString(r)}</div>}
      </div>
    );
  };
  /* Storage cell: the location is the Stored state (FR-C2), truncated from the left with the full path on hover */
  const storageCell = r => {
    const body = r.storage
      ? <span data-tip={r.storage} className="store-t"><CIcon n="Box" size={14} style={{ flex: 'none', fill: '#525252' }} /> {storeShort(r.storage)}</span>
      : <span className="muted store-t"><CIcon n="Box" size={14} style={{ flex: 'none', fill: '#8d8d8d' }} /> Not stored</span>;
    if (ro || r.voided) return body;
    return <button type="button" className="cellbtn" onClick={() => openPanel(r.num, 'storage')} aria-label={(r.storage ? 'Change storage for ' : 'Set storage for ') + r.num}>{body}</button>;
  };
  const renderPanel = r => {
    const p = panel[r.num];
    if (!p) return null;
    let body = null;
    if (p.type === 'storage') body = <StoragePanel nums={[r.num]} taken={taken} onCancel={() => closePanel(r.num)} onApply={plan => { upd(r.num, x => ({ storage: STORE_PATH + ' > ' + plan[0][1], status: withStatus(x, 'Pending save') })); closePanel(r.num); }} />;
    if (p.type === 'nce') body = <NcePanel key={JSON.stringify(p.prefill || {})} nums={[r.num]} tests={r.tests} prefill={p.prefill} onCancel={() => closePanel(r.num)} onApply={outcome => {
      if (outcome === 'Continue with a flag') upd(r.num, x => ({ status: withStatus(withStatus(x, 'Non-conformity'), 'Pending save') }));
      else { upd(r.num, x => ({ status: withStatus(withStatus(withStatus(x, 'Non-conformity'), 'Rejected'), 'Pending save'), tests: [], manual: {}, dev: {} })); say({ kind: 'warning', text: r.num + ' rejected' + (outcome.includes('new sample') ? ' and a new sample requested' : '') + '. Its tests return to Awaiting sample.' }); }
      closePanel(r.num);
    }} />;
    if (p.type === 'refer') body = <ReferPanel nums={[r.num]} rows={rows} existingRefs={existingRefs} canAliquot={prep} onCancel={() => closePanel(r.num)}
      onAliquotFirst={num => { closePanel(r.num); if (prep) openPanel(num, 'aliquot'); else onAliquotFirst && onAliquotFirst(num); }}
      onApply={(lab2, per) => { applyRefer(lab2, per); closePanel(r.num); }} />;
    if (p.type === 'aliquot') body = <AliquotPanel row={{ ...r, nextAliquot: rows.filter(x => x.parent === r.num).length + 1 }} remaining={remainingOf(r)} onCancel={() => closePanel(r.num)} onApply={items => {
      setRows(rs => {
        const start = rs.filter(x => x.parent === r.num).length;
        return [...rs, ...items.map((it, i) => mkRow({ num: r.num + '.' + (start + i + 1), pos: r.pos, parent: r.num, c: r.c, st: it.st, qty: it.qty, unit: it.unit, reason: 'Aliquot of ' + r.num, saved: false, status: [] }))];
      });
      closePanel(r.num);
      say({ kind: 'success', text: items.length + (items.length === 1 ? ' aliquot' : ' aliquots') + ' of ' + r.num + ' added. They can take tests, get their own row in Labels, and are saved with this step.' });
    }} />;
    if (p.type === 'void') body = (
      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', flexWrap: 'wrap', maxWidth: 800 }}>
        <div style={{ flex: 1, minWidth: 280 }}><TextInput label={'Reason for voiding ' + r.num} required value={p.reason || ''} onChange={v => setPanel(pp => ({ ...pp, [r.num]: { ...pp[r.num], reason: v } }))} placeholder="For example: tube broken in transit" helper="Saved samples are voided, never deleted. The number is never reused." /></div>
        <div style={{ paddingBottom: 22, display: 'flex', gap: 8 }}>
          <Btn kind="danger" disabled={!(p.reason || '').trim()} onClick={() => { upd(r.num, x => ({ voided: true, voidReason: p.reason.trim(), tests: [], status: ['Voided'] })); closePanel(r.num); setSel(s => s.filter(n => n !== r.num)); say({ kind: 'info', text: r.num + ' voided. ' + (r.tests.length ? 'Its tests return to Awaiting sample. ' : '') + 'It stays visible, struck through, under "Show voided".' }); }}>Confirm</Btn>
          <Btn kind="ghost" onClick={() => closePanel(r.num)}>Cancel</Btn>
        </div>
      </div>
    );
    return <tr className="exp-row"><td colSpan={cols}>{body}</td></tr>;
  };
  const applyRefer = (refLab, per) => {
    setRows(rs => rs.map(r => per[r.num] && per[r.num].length ? { ...r, referTo: refLab, referred: [...new Set([...(r.referred || []), ...per[r.num]])], status: withStatus(withStatus(r, 'Referred'), 'Pending save') } : r));
    const n = Object.values(per).filter(x => x.length).length;
    say({ kind: 'success', text: 'Referral to ' + refShort(refLab) + ' added for ' + n + (n === 1 ? ' sample' : ' samples') + '. Saved with this step; dispatch the shipment afterwards from Sample Shipment.' });
  };
  const startBulk = type => {
    if (sel.length) {
      if (type === 'print') { printRows(sel); return; }
      setBulk({ type, nums: [...sel], stage: 'go' });
    } else setBulk({ type, nums: actionable.map(r => r.num), stage: 'confirm' });
  };
  const BULK_NAME = { print: 'Print labels', store: 'Store', refer: 'Refer out', nce: 'Report non-conformity' };
  const bulkPanel = () => {
    if (!bulk) return null;
    const nums = bulk.nums;
    if (bulk.stage === 'confirm') return (
      <NewBlock style={{ marginBottom: 8 }} id="bulk-confirm">
        <div className="h3" style={{ fontSize: 14 }}>{BULK_NAME[bulk.type]}: apply to these samples</div>
        <p className="muted" style={{ marginTop: -6 }}>Nothing was selected, so every sample is preselected. Untick any to leave out.</p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px 20px' }}>
          {actionable.map(r => <Checkbox key={r.num} label={sfxOf(r.num) + ' (' + C[r.c].short + ')'} checked={nums.includes(r.num)} onChange={v => setBulk({ ...bulk, nums: v ? [...nums, r.num] : nums.filter(n => n !== r.num) })} />)}
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
          <Btn disabled={!nums.length} onClick={() => { if (bulk.type === 'print') { setBulk(null); printRows(nums); } else setBulk({ ...bulk, stage: 'go' }); }}>{bulk.type === 'print' ? 'Print ' + nums.length + ' samples' : 'Continue with ' + nums.length + ' samples'}</Btn>
          <Btn kind="ghost" onClick={() => setBulk(null)}>Cancel</Btn>
        </div>
      </NewBlock>
    );
    const done = () => { setBulk(null); setSel([]); };
    if (bulk.type === 'store') return <div style={{ marginBottom: 12 }}><StoragePanel nums={nums} taken={taken} onCancel={() => setBulk(null)} onApply={plan => { setRows(rs => rs.map(r => { const hit = plan.find(x => x[0] === r.num); return hit ? { ...r, storage: STORE_PATH + ' > ' + hit[1], status: withStatus(r, 'Pending save') } : r; })); done(); say({ kind: 'success', text: 'Storage set for ' + plan.length + ' samples in Rack R4. Saved with this step.' }); }} /></div>;
    if (bulk.type === 'refer') return <div style={{ marginBottom: 12 }}><ReferPanel nums={nums} rows={rows} existingRefs={existingRefs} canAliquot={prep} onCancel={() => setBulk(null)} onAliquotFirst={num => { setBulk(null); if (prep) openPanel(num, 'aliquot'); else onAliquotFirst && onAliquotFirst(num); }} onApply={(l2, per) => { applyRefer(l2, per); done(); }} /></div>;
    if (bulk.type === 'nce') {
      const tests = [...new Set(rows.filter(r => nums.includes(r.num)).flatMap(r => r.tests))];
      return <div style={{ marginBottom: 12 }}><NcePanel nums={nums} tests={tests} onCancel={() => setBulk(null)} onApply={outcome => { setRows(rs => rs.map(r => nums.includes(r.num) ? (outcome === 'Continue with a flag' ? { ...r, status: withStatus(withStatus(r, 'Non-conformity'), 'Pending save') } : { ...r, tests: [], status: withStatus(withStatus(withStatus(r, 'Non-conformity'), 'Rejected'), 'Pending save') }) : r)); done(); }} /></div>;
    }
    return null;
  };
  const collEmpties = live.filter(r => !r.parent && (!(r.coll && r.coll.at) || !(r.coll && (r.coll.by || r.coll.elsewhere)))).length;
  const applyFill = v => {
    setRows(rs => rs.map(r => {
      if (r.parent || r.voided || r.gone) return r;
      const c = r.coll || {};
      const needAt = !c.at, needBy = !c.by && !c.elsewhere;
      if (!needAt && !needBy) return r;
      return { ...r, coll: { ...c, at: needAt ? v.at : c.at, by: needBy ? v.by : c.by, elsewhere: needBy ? v.elsewhere : c.elsewhere } };
    }));
    setFill(false);
    say({ kind: 'success', text: 'Filled the empty Collected cells on ' + collEmpties + ' samples with ' + fmtDT(v.at) + ', ' + (v.elsewhere ? 'collected elsewhere, collector unknown' : v.by) + '. Each cell shows the value itself.' });
  };
  return (
    <NewBlock style={{ padding: '28px 12px 12px' }} id="tbl-samples">
      <div className="mono" style={{ position: 'absolute', top: 8, left: 14, fontSize: 11, color: '#0043ce', fontWeight: 600 }}>Shared component: samples table (one implementation) | mode: {mode}</div>

          <Btn kind="primary" onClick={() => setAdding(!adding)} aria-expanded={adding}>Add sample {I.add}</Btn>

          <Btn kind="ghost" onClick={() => startBulk('print')}>Print labels {I.print}</Btn>
          <Btn kind="ghost" onClick={() => startBulk('store')}>Store {I.store}</Btn>
          <Btn kind="ghost" onClick={() => startBulk('refer')}>Refer out {I.refer}</Btn>
          <Btn kind="ghost" onClick={() => startBulk('nce')}>Report non-conformity {I.nce}</Btn>
          <span className="muted" style={{ paddingBottom: 8 }}>{sel.length ? sel.length + ' selected' : 'Nothing selected: actions ask which samples'}</span>
          {sel.length > 0 && <div style={{ paddingBottom: 2 }}><Btn kind="ghost" onClick={() => setSel([])}>Clear selection</Btn></div>}
          {voidedN > 0 && <div style={{ marginLeft: 'auto', paddingBottom: 6 }}><Checkbox label={'Show voided (' + voidedN + ')'} checked={showVoided} onChange={setShowVoided} /></div>}
        </div>
      )}
      {adding && !ro && (
        <div className="toolbar" style={{ background: '#e8e8e8', borderTop: '1px solid #c6c6c6', alignItems: 'flex-start' }}>
          <div style={{ width: 320 }}>
            <TextInput size="sm" label="Container type" value={addC ? C[addC].name : addQ} onChange={v => { setAddQ(v); setAddC(''); }} placeholder="Search container types" helper="Clinical container types from the test catalog" />
            {!addC && <div className="results" style={{ maxHeight: 180, overflowY: 'auto' }}>{addMatches.slice(0, 8).map(k => <button key={k} type="button" className="res" onClick={() => setAddC(k)}><span><Swatch c={k} />{C[k].name}</span><span className="muted">{C[k].yields.join(', ')}</span></button>)}</div>}
          </div>
          <div style={{ width: 110 }}><Select label="Number of samples" value={addN} onChange={setAddN} options={['1', '2', '3', '4']} /></div>
          <div style={{ paddingTop: 22, display: 'flex', gap: 8 }}><Btn disabled={!addC} onClick={addSamples}>Add</Btn><Btn kind="ghost" onClick={() => setAdding(false)}>Cancel</Btn></div>
        </div>
      )}
      {bulkPanel()}
      <FilterBar k={fk} shown={visible.length} total={ordered.filter(r => !r.voided).length} onClear={onClearFilt} />
      <div className="cds--data-table-container table-scroll" style={{ minWidth: 0 }}>
        <table className="cds--data-table cds--data-table--xs stbl" style={{ width: '100%' }} aria-labelledby="samples-heading">
          <thead><tr>
            {!ro && <th style={{ width: 40 }}><Checkbox label="Select all samples" hideLabel checked={actionable.length > 0 && sel.length === actionable.length} onChange={v => setSel(v ? actionable.map(r => r.num) : [])} /></th>}
            <th>Sample</th><th>Container</th><th>Sample type</th><th>Tests</th>
            <th style={{ whiteSpace: 'nowrap' }}>Collected {!ro && <button type="button" className="linkbtn" style={{ marginLeft: 6, fontWeight: 400 }} onClick={() => setFill(!fill)} aria-expanded={fill}>Fill all</button>}</th>
            {showSite && <th>Body site <NewChip /></th>}
            <th>Storage</th><th>Status</th><th className="sticky-r">Actions</th>
          </tr></thead>
          <tbody>
            {fill && !ro && <tr className="exp-row"><td colSpan={cols}><FillAll empties={collEmpties} me={me} recAt={recAt} onApply={applyFill} onCancel={() => setFill(false)} /></td></tr>}
            {ordered.filter(r => !r.voided).length === 0 && (
              <tr><td colSpan={cols} style={{ padding: 24, textAlign: 'center' }}>
                <div style={{ marginBottom: 8 }}>No samples yet. Add a sample or scan a label.</div>
                {!ro && <Btn onClick={() => setAdding(true)}>Add sample {I.add}</Btn>}
              </td></tr>
            )}
            {visible.map(r => {
              const isHl = hl === r.num || flash === r.num;
              const cls = (isHl ? 'hl ' : fk && fk !== 'samples' ? 'fhl ' : '') + (r.voided ? 'voided ' : '') + (r.parent ? 'child' : '');
              const editable = !ro && !r.voided && !r.saved;
              return (
                <React.Fragment key={r.num}>
                  <tr id={'row-' + r.num} className={cls}>
                    {!ro && <td><Checkbox label={'Select ' + r.num} hideLabel checked={sel.includes(r.num)} disabled={r.voided || r.status.includes('Rejected')} onChange={v => setSel(v ? [...sel, r.num] : sel.filter(x => x !== r.num))} /></td>}
                    <td style={{ minWidth: 120 }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 4, paddingLeft: r.parent ? 14 : 0 }}>
                        {!ro && <Chevron open={!!det[r.num]} disabled={r.voided} label={'Optional details for ' + r.num} onClick={() => setDet({ ...det, [r.num]: !det[r.num] })} />}
                        <div className="strike">
                          <SfxBadge num={r.num} lg />
                          <div className="sfx-full" title="Select to copy">{r.num}</div>
                          {r.parent && <div className="muted">Aliquot of {sfxOf(r.parent)}</div>}
                          {r.edited && !r.saved && <div className="muted">Edited</div>}
                        </div>
                      </div>
                    </td>
                    <td style={{ minWidth: 120 }}>
                      {editable && !r.parent ? (
                        <div style={{ display: 'flex', alignItems: 'center' }}><Swatch c={r.c} />
                          <Select cell label={'Container for ' + r.num} value={r.c} onChange={v => upd(r.num, x => ({ c: v, st: C[v].yields.includes(x.st) ? x.st : C[v].yields[0], edited: true }))} options={CLIN_C.map(k => ({ v: k, l: C[k].short }))} style={{ flex: 1 }} />
                        </div>
                      ) : <div title={C[r.c].name}><span style={{ display: 'inline-flex', alignItems: 'center' }}><Swatch c={r.c} />{C[r.c].short}</span>{r.parent && <div className="muted">{r.qty} {r.unit} taken</div>}</div>}
                    </td>
                    <td style={{ minWidth: 100 }}>{editable ? <Select cell label={'Sample type for ' + r.num} value={r.st} onChange={v => upd(r.num, x => ({ st: v, edited: x.parent ? x.edited : true }))} options={C[r.c].yields} /> : r.st}</td>
                    <td style={{ minWidth: 130 }}>
                      <div className="tagset">
                        {testTags(r).map(g => <Tag key={g.k} c={g.c} title={g.title}>{g.label}</Tag>)}
                        {!r.tests.length && <span className="muted">{r.status.includes('Rejected') ? 'Tests returned to Awaiting sample' : r.voided ? 'None' : r.parent ? 'No tests yet' : 'No tests'}</span>}
                      </div>
                    </td>
                    <td>{collCell(r)}</td>
                    {showSite && <td>{siteCell(r)}</td>}
                    <td style={{ minWidth: 100, fontSize: 13 }}>{storageCell(r)}</td>
                    <td style={{ minWidth: 96 }}>{renderStatus(r)}</td>
                    <td className="sticky-r">
                      {!r.voided && (
                        <div className="acts">
                          {!ro && <IconBtn icon={I.print} label={'Print label for ' + r.num} tip="Print label" onClick={() => printRows([r.num])} />}
                          {!ro && <IconBtn icon={I.refer} label={'Refer out ' + r.num} tip="Refer out" onClick={() => openPanel(r.num, 'refer')} on={panel[r.num] && panel[r.num].type === 'refer'} />}
                          <IconBtn icon={I.nce} label={'Report non-conformity for ' + r.num} tip="Report non-conformity" onClick={() => openPanel(r.num, 'nce')} on={panel[r.num] && panel[r.num].type === 'nce'} />
                          {prep && !r.parent && <IconBtn icon={I.aliquot} label={'Aliquot ' + r.num} tip="Aliquot" onClick={() => openPanel(r.num, 'aliquot')} on={panel[r.num] && panel[r.num].type === 'aliquot'} />}
                          {!ro && (r.saved
                            ? <IconBtn icon={I.voidI} danger className="tip-left" label={'Void ' + r.num} tip="Void (saved sample: reason required)" onClick={() => removeRow(r)} />
                            : <IconBtn icon={I.trash} danger className="tip-left" label={'Remove ' + r.num} tip="Remove (Undo available)" onClick={() => removeRow(r)} />)}
                        </div>
                      )}
                    </td>
                  </tr>
                  {det[r.num] && !r.voided && <tr className="exp-row"><td colSpan={cols}><DetailsPanel row={r} upd={f => upd(r.num, f)} remaining={r.parent ? null : remainingOf(r)} cfg={cfg} ro={ro} /></td></tr>}
                  {renderPanel(r)}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="muted" style={{ margin: '8px 0 0' }}>Every required value is a column on the row; the arrow opens optional detail only. Status shows exceptions only. Labels are edited in the Labels section below this table.</p>
    </NewBlock>
  );
}

  if (cfg.billingRefNumber) filters.push(['unpaid', 'Unpaid']);
  const cancelledCount = orders.filter(o => o.status === 'Cancelled').length;
  const list = orders.filter(o => (showCancelled || o.status !== 'Cancelled') && (!filter || (o.status !== 'Cancelled' && hasFlag(o, filter))) && (!q.trim() || [o.lab, o.pat, o.nid, o.ref].some(x => x.toLowerCase().includes(q.trim().toLowerCase()))));
  const complete = o => o.status === 'Ready for testing' || (o.status === 'Samples prepared' && acc === 'Off');
  const confirmCancel = o => {
    setOrders(os => os.map(x => x.lab === o.lab ? { ...x, status: 'Cancelled', flags: [], cancelReason: reasonSel + (reasonTxt ? ': ' + reasonTxt : '') } : x));
    setNote('Order ' + o.lab + ' cancelled. The order and its ' + o.t + ' tests are marked Cancelled and its ' + o.n + ' samples voided, with your reason. Nothing was deleted.');
    setCancelFor(null); setReasonSel(''); setReasonTxt('');
  };
  return (
    <div>
      <PageHead route="/order/clinical" crumbs={['Home', 'Orders', 'Clinical Orders']} title="Clinical Orders" sub="Central Public Health Laboratory (CPHL), Port Moresby. Orders entered today."
        actions={<Btn size="md" onClick={() => go(2)}>New order</Btn>} />
      {note && <Notif kind="success" title={note} onClose={() => setNote(null)} style={{ marginBottom: 16 }} />}
      {modNote && <Notif kind="info" title="Modify Order has moved here. Open an order to change it." sub="Every change after entry is made on the order's own steps. The Modify Order menu row is removed, and old Modify Order links open Enter Order for the same order." onClose={() => setModNote(false)} style={{ marginBottom: 16 }} />}

        <div className="h3" style={{ fontSize: 14, marginBottom: 8 }}>Quick filters</div>
        <div className="tagset" style={{ gap: 8 }}>
          {filters.map(([k, l]) => (
            <button key={k} type="button" className={'cds--tag ' + (filter === k ? 'cds--tag--blue' : 'cds--tag--cool-gray')} style={{ cursor: 'pointer', border: filter === k ? '1px solid #0f62fe' : '1px solid transparent', height: 28 }} aria-pressed={filter === k} onClick={() => setFilter(filter === k ? null : k)}>
              {l} <strong style={{ marginLeft: 6 }}>{cnt(k)}</strong>
            </button>
          ))}
          <button type="button" className={'cds--tag ' + (showCancelled ? 'cds--tag--gray' : 'cds--tag--warm-gray')} style={{ cursor: 'pointer', height: 28, border: showCancelled ? '1px solid #525252' : '1px dashed #8d8d8d' }} aria-pressed={showCancelled} onClick={() => setShowCancelled(!showCancelled)}>
            Show cancelled <strong style={{ marginLeft: 6 }}>{cancelledCount}</strong>
          </button>
        </div>

      </NewBlock>
      <div className="toolbar" style={{ background: '#fff', padding: '0 0 8px' }}>
        <div style={{ width: 420 }}><TextInput size="sm" label="Search by lab number, patient or referring lab number" value={q} onChange={setQ} placeholder="For example 26CPHL00469, Siaguru or PMGH-MW3-1187" newMark helper="Matches lab number, patient name or identifier, and referring laboratory number" /></div>

      <div className="cds--data-table-container table-scroll">

                {o.refer && o.status !== 'Cancelled' && (
                  <tr className={'ref-line' + (dash.hl === o.lab ? ' hl' : '')}><td></td><td colSpan={7}>
                    <span className="ref-t">{I.refer}<span>{o.refer.n} {o.refer.n === 1 ? 'test' : 'tests'} referred to {o.refer.to}, {o.refer.st.charAt(0).toLowerCase() + o.refer.st.slice(1)}</span><Tag c={o.refer.done ? 'green' : 'purple'}>{o.refer.done ? 'Referral results received' : 'Referral open'}</Tag>{complete(o) && !o.refer.done && <span className="muted">In-laboratory work is complete; the referral is still open.</span>}</span>
                  </td></tr>
                )}
                {cancelFor === o.lab && (
                  <tr className="exp-row"><td colSpan={8}>
                    <NewBlock>
                      <div className="h3" style={{ fontSize: 14 }}>Cancel order {o.lab} ({o.pat})</div>
                      <div className="grid g2">
                        <Select label="Reason for cancelling" required value={reasonSel} onChange={setReasonSel} options={[{ v: '', l: 'Choose a reason' }, 'Duplicate order', 'Entered in error', 'Patient left before collection', 'Requester withdrew the request', 'Other']} />
                        <TextInput label="Details" required={reasonSel === 'Other'} value={reasonTxt} onChange={setReasonTxt} placeholder="Optional unless Other" />
                      </div>
                      <p className="muted" style={{ marginTop: 8 }}>The order and its tests are marked Cancelled and its {o.n} samples voided with the same reason. Nothing is deleted.</p>
                      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                        <Btn kind="danger" disabled={!reasonSel || (reasonSel === 'Other' && !reasonTxt)} onClick={() => confirmCancel(o)}>Cancel order</Btn>
                        <Btn kind="ghost" onClick={() => setCancelFor(null)}>Keep order</Btn>
                      </div>
                    </NewBlock>
                  </td></tr>
                )}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
      <p className="muted" style={{ margin: '8px 0 32px' }}>Open goes to the order's next unfinished step with ?id= (for example {stepRoute(orders[0])}). Select a lab number to open the saved order's Enter Order, where Change lab number is. In this preview every row opens the example order 26CPHL00471.</p>
    </div>
  );
}

/* ============================== Screens 2 and 3: Enter Order (FR-B1 to FR-B30) ============================== */
const PROGRAM_QUESTIONS = {
  'Routine clinical testing': [],
  'Antenatal care': [{ k: 'gest', l: 'Gestation (weeks)', t: 'text' }, { k: 'visit', l: 'Antenatal visit', t: 'select', o: ['First visit', 'Follow-up visit'] }],
  'HIV care and treatment': [{ k: 'art', l: 'Current ART regimen', t: 'select', o: ['TLD', 'TEE', 'Not on ART'] }, { k: 'vlr', l: 'Reason for viral load', t: 'select', o: ['Routine monitoring', 'Suspected treatment failure', 'Repeat after adherence support'] }],
