}

/* ============================== Screen 7: Container Types admin (FR-G1 to FR-G4) ============================== */
const usedText = r => r.usedN ? r.usedN + ' tests' + (r.used.length ? ': ' + r.used.slice(0, 3).join(', ') + (r.usedN > 3 ? ', and ' + (r.usedN - Math.min(3, r.used.length)) + ' more' : '') : '') : 'Not used';
function ContainerTypes() {
  const [list, setList] = useState(() => Object.keys(C).map(k => ({ id: k, ...C[k], active: !C[k].inactive, std: k === 'edta4' ? 'SNOMED CT 1179252003' : '' })));
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('All');
  const [dom, setDom] = useState('All');
  const [showDeact, setShowDeact] = useState(false);
  const [open, setOpen] = useState(null);
  const [draft, setDraft] = useState(null);
  const [deact, setDeact] = useState(false);
  const [yAdd, setYAdd] = useState('');
  const [msg, setMsg] = useState(null);
  const ALL_ST = ['Whole blood', 'Plasma', 'Serum', 'Plasma (citrated)', 'Blood (culture)', 'Swab', 'Swab, wound', 'Urine', 'Urine (24 h)', 'Sputum', 'Stool', 'CSF', 'Pleural fluid', 'Tissue', 'Drinking water', 'Soil', 'Mosquito pool', 'Tick'];
  const rows = list.filter(r => (showDeact || r.active) && (cat === 'All' || r.cat === cat) && (dom === 'All' || r.dom.includes(dom)) && (!q || (r.name + r.add + r.code).toLowerCase().includes(q.toLowerCase())));
  const edit = r => { setOpen(open === r.id ? null : r.id); setDraft({ ...r, dom: [...r.dom], yields: [...r.yields] }); setDeact(false); setYAdd(''); };
  const save = () => {
    setList(l => draft.id === 'new' ? [{ ...draft, id: 'c' + l.length, used: [], usedN: 0, samples: 0 }, ...l] : l.map(x => x.id === draft.id ? draft : x));
    setMsg((draft.id === 'new' ? 'Created ' : 'Saved ') + draft.name + '.'); setOpen(null);
  };
  const form = () => (
    <NewBlock>
      <div className="grid g4">
        <TextInput label="Name" required value={draft.name} onChange={v => setDraft({ ...draft, name: v })} />
        <TextInput label="Code" required value={draft.code} onChange={v => setDraft({ ...draft, code: v })} />
        <div>
          <span className="lbl">Domain<Req /></span>
          <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>{['Clinical', 'Environmental', 'Vector'].map(d => <Checkbox key={d} label={d} checked={draft.dom.includes(d)} onChange={v => setDraft({ ...draft, dom: v ? [...draft.dom, d] : draft.dom.filter(x => x !== d) })} />)}</div>
          <div className="cds--form__helper-text">One or more; never a combined value (D-004)</div>
        </div>
        <TextInput label="Additive" required value={draft.add} onChange={v => setDraft({ ...draft, add: v })} helper="The preservative, for environmental containers" />
        <Select label="Material" value={draft.mat} onChange={v => setDraft({ ...draft, mat: v })} options={['PET plastic', 'Polypropylene', 'Polyethylene', 'Plastic', 'Glass', 'Paper card', 'Any']} />
        <div style={{ display: 'flex', gap: 8 }}>
          <TextInput label="Nominal volume" value={draft.vol} onChange={v => setDraft({ ...draft, vol: v })} style={{ flex: 1 }} />
          <Select label="Unit" value={draft.unit || 'mL'} onChange={v => setDraft({ ...draft, unit: v })} options={['mL', 'uL', 'L']} style={{ width: 90 }} />
        </div>
        <div>
          <span className="lbl">Cap colour</span>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <input type="color" value={draft.cap || '#ffffff'} onChange={e => setDraft({ ...draft, cap: e.target.value })} aria-label="Cap colour picker" style={{ width: 40, height: 40, border: '1px solid #8d8d8d', padding: 2, background: '#fff' }} />
            <TextInput value={draft.capName} onChange={v => setDraft({ ...draft, capName: v })} placeholder="Colour name" ariaLabel="Colour name" />
          </div>
          <div className="cds--form__helper-text">Display only. Default is ISO 6710; editable per site.</div>
        </div>
        <Select label="Category" required value={draft.cat} onChange={v => setDraft({ ...draft, cat: v })} options={['Blood', 'Blood culture', 'Swab', 'Urine', 'Stool', 'Respiratory', 'Water', 'Other']} />
        <div style={{ gridColumn: 'span 3' }}>
          <span className="lbl">Sample types it yields<Req /></span>
          <div className="tagset">
            {draft.yields.map(y => <span key={y} className="cds--tag cds--tag--sm cds--tag--blue">{y}<button type="button" className="linkbtn" style={{ marginLeft: 6, color: '#0043ce', textDecoration: 'none' }} aria-label={'Remove ' + y} onClick={() => setDraft({ ...draft, yields: draft.yields.filter(x => x !== y) })}>{'✕'}</button></span>)}
            <div style={{ width: 200 }}><Select cell label="Add sample type" value={yAdd} onChange={v => { if (v) setDraft({ ...draft, yields: [...draft.yields, v] }); setYAdd(''); }} options={[{ v: '', l: 'Add sample type...' }, ...ALL_ST.filter(s => !draft.yields.includes(s))]} /></div>
          </div>
        </div>
        <TextInput label="Standard code (optional)" value={draft.std || ''} onChange={v => setDraft({ ...draft, std: v })} helper="For FHIR SpecimenDefinition" />
        <div style={{ paddingTop: 22 }}><Checkbox label="Active" checked={draft.active} onChange={v => { if (!v && draft.usedN) setDeact(true); else setDraft({ ...draft, active: v }); }} /></div>
      </div>
      {deact && (
        <Notif kind="warning" title={'Used by ' + draft.usedN + ' tests (' + draft.used.slice(0, 2).join(', ') + (draft.usedN > 2 ? ', ... and ' + (draft.usedN - 2) + ' more' : '') + ') and ' + n2(draft.samples) + ' samples. Existing samples keep it; it can no longer be proposed or chosen.'} sub="Container types are deactivated, never deleted." style={{ marginTop: 12 }}>
          <div style={{ display: 'flex', gap: 8 }}><Btn kind="danger" onClick={() => { setDraft({ ...draft, active: false }); setDeact(false); }}>Deactivate</Btn><Btn kind="secondary" onClick={() => setDeact(false)}>Keep active</Btn><Btn kind="ghost" onClick={() => setMsg('View all: ' + draft.used.join(', ') + (draft.usedN > draft.used.length ? ', and ' + (draft.usedN - draft.used.length) + ' more in the test catalog' : '') + '.')}>View all</Btn></div>
        </Notif>
      )}
      <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
        <Btn disabled={!draft.name || !draft.yields.length || !draft.dom.length} onClick={save}>Save</Btn>
        <Btn kind="ghost" onClick={() => setOpen(null)}>Cancel</Btn>
        {draft.id !== 'new' && draft.active && <Btn kind="danger--ghost" onClick={() => setDeact(true)} style={{ marginLeft: 'auto' }}>Deactivate</Btn>}
      </div>
    </NewBlock>
  );
  return (
    <div>
      <PageHead route="/admin/TestCatalogList?entity=containertypes" crumbs={['Home', 'Admin Management', 'Test Catalog', 'Container Types']} title={<span>Container Types <NewChip /></span>}
        sub="Tubes, bottles, swabs and containers a sample can arrive in. Listed after Sample Types. Editable by Test Catalog Manager and Admin."
        actions={<Btn size="md" onClick={() => { setOpen('new'); setDraft({ id: 'new', name: '', code: '', dom: ['Clinical'], add: '', mat: 'PET plastic', vol: '', unit: 'mL', cap: '#ffffff', capName: '', cat: 'Blood', yields: [], std: '', active: true, used: [], usedN: 0, samples: 0 }); }}>Add container type</Btn>} />
      {msg && <Notif kind="success" title={msg} onClose={() => setMsg(null)} style={{ marginBottom: 12 }} />}
      <div className="toolbar" style={{ background: '#fff', padding: '0 0 8px', alignItems: 'flex-end' }}>
        <div style={{ width: 280 }}><TextInput size="sm" label="Search" value={q} onChange={setQ} placeholder="Name, additive or code" /></div>
        <div style={{ width: 180 }}><Select label="Domain" value={dom} onChange={setDom} options={['All', 'Clinical', 'Environmental', 'Vector']} /></div>
        <div style={{ width: 180 }}><Select label="Category" value={cat} onChange={setCat} options={['All', 'Blood', 'Blood culture', 'Swab', 'Urine', 'Respiratory', 'Stool', 'Water', 'Other']} /></div>
        <div style={{ paddingBottom: 6 }}><Switch checked={showDeact} onChange={setShowDeact} label="Show deactivated" /></div>
      </div>
      {open === 'new' && <div style={{ marginBottom: 12 }}>{form()}</div>}
      <div className="cds--data-table-container table-scroll">
        <table className="cds--data-table cds--data-table--sm">
          <thead><tr><th style={{ width: 32 }}></th><th>Name</th><th>Domain</th><th>Additive</th><th>Material</th><th>Nominal volume</th><th>Cap colour</th><th>Sample types it yields</th><th>Category</th><th>Used by</th><th>Status</th></tr></thead>
          <tbody>{rows.map(r => (
            <React.Fragment key={r.id}>
              <tr style={{ cursor: 'pointer' }} onClick={() => edit(r)}>
                <td>{open === r.id ? '▾' : '▸'}</td>
                <td><strong>{r.name}</strong><div className="muted mono">{r.code}</div></td>
                <td><div className="tagset">{r.dom.map(d => <Tag key={d} c={d === 'Clinical' ? 'blue' : d === 'Environmental' ? 'green' : 'purple'}>{d}</Tag>)}</div></td>
                <td>{r.add}</td><td>{r.mat}</td><td>{r.vol ? r.vol + ' ' + r.unit : 'n/a'}</td>
                <td style={{ whiteSpace: 'nowrap' }}><span className={'swatch' + (r.cap ? '' : ' none')} style={r.cap ? { background: r.cap } : null}></span>{r.capName}</td>
                <td><div className="tagset">{r.yields.map(y => <Tag key={y} c="cool-gray">{y}</Tag>)}</div></td>
                <td>{r.cat}</td>
                <td style={{ minWidth: 220, fontSize: 13 }}>{usedText(r)}</td>
                <td>{r.active ? <Tag c="green">Active</Tag> : <Tag c="gray">Deactivated</Tag>}</td>
              </tr>
              {open === r.id && <tr className="exp-row"><td colSpan={11}>{form()}</td></tr>}
            </React.Fragment>
          ))}</tbody>
        </table>
      </div>
      <p className="muted" style={{ margin: '8px 0 32px' }}>{rows.length} of {list.length} container types. Pre-seeded from Appendix A with ISO 6710 cap colours; upgrades never overwrite an edited type. The environmental container dictionary is imported under the Environmental domain.</p>
    </div>
  );
}

function ExampleSwitch({ value, options, onChange }) {
  return (
    <div className="pvc" role="group" aria-label="Preview control: example record" style={{ marginTop: 0 }}>
      <div className="pvc-title">PREVIEW CONTROL: EXAMPLE RECORD (not part of the product)</div>
      <div className="pvc-ex">{options.map(([k, l]) => <button key={k} type="button" aria-pressed={value === k} onClick={() => onChange(k)}>{l}</button>)}</div>

/* ============================== Screen 8: Test editor, Containers and Body site (FR-G5, FR-G6, FR-N3) ============================== */
const ACCEPTABLE_AS = { Serum: ['lihep', 'pst'] };
function TestEditor() {
  const [tab, setTab] = useState('CREA');
  const [data, setData] = useState({
    CREA: { st: 'Serum', own: false, list: [{ c: 'sst', role: 'Preferred', n: '1', min: '0.5', unit: 'mL' }, { c: 'pst', role: 'Alternate', n: '1', min: '', unit: 'mL', usedAs: true }], site: '', lock: false },
    WCUL: { st: 'Swab, wound', own: false, list: [{ c: 'amies', role: 'Preferred', n: '1', min: '', unit: 'mL' }, { c: 'eswab', role: 'Alternate', n: '1', min: '', unit: 'mL' }, { c: 'dry', role: 'Alternate', n: '1', min: '', unit: 'mL' }], site: '', lock: false },
    TCUL: { st: 'Swab', own: false, list: [{ c: 'eswab', role: 'Preferred', n: '1', min: '', unit: 'mL' }, { c: 'amies', role: 'Alternate', n: '1', min: '', unit: 'mL' }], site: 'throat', lock: true },
  });
  const [add, setAdd] = useState('');
  const [saved, setSaved] = useState(false);
  const d = data[tab];
  const setD = patch => { setData({ ...data, [tab]: { ...d, ...patch } }); setSaved(false); };
  const setRow = (i, patch) => setD({ list: d.list.map((x, j) => j === i ? { ...x, ...patch } : x) });
  const reRole = l => l.map((x, k) => ({ ...x, role: k === 0 ? 'Preferred' : 'Alternate' }));
  const move = (i, dir) => { const l = [...d.list]; const j = i + dir; if (j < 0 || j >= l.length) return; if ((j === 0 && l[i].usedAs) || (i === 0 && l[j].usedAs)) return; [l[i], l[j]] = [l[j], l[i]]; setD({ list: reRole(l) }); };
  const inList = k => d.list.some(x => x.c === k);
  const yieldsSt = CLIN_C.filter(k => C[k].yields.includes(d.st) && !inList(k));
  const acceptable = (ACCEPTABLE_AS[d.st] || []).filter(k => CLIN_C.includes(k) && !C[k].yields.includes(d.st) && !inList(k));
  const hidden = CLIN_C.filter(k => !C[k].yields.includes(d.st) && !(ACCEPTABLE_AS[d.st] || []).includes(k)).length;
  const name = T[tab].name;
  const siteMode = stSite(d.st);
  const opts = [{ v: '', l: yieldsSt.length + acceptable.length ? 'Choose a container type' : 'No more eligible containers' }];
  if (yieldsSt.length) opts.push({ group: 'Yield ' + d.st, options: yieldsSt.map(k => ({ v: k, l: C[k].name })) });
  if (acceptable.length) opts.push({ group: 'Can be used as ' + d.st + ' for this test', options: acceptable.map(k => ({ v: k, l: C[k].name + ' (yields ' + C[k].yields.join(', ') + ')' })) });
  const sections = ['General', 'Sample type', 'Result type and units', 'Reference ranges', 'Label settings', 'Containers', 'Body site'];
  return (
    <div>
      <PageHead route={'/MasterListsPage/TestCatalogEditor/' + { CREA: 'TEST-0142', WCUL: 'TEST-0318', TCUL: 'TEST-0322' }[tab]} crumbs={['Home', 'Admin Management', 'Test Catalog', 'Tests', name]} title={name} sub="Test editor, hosted by Test Catalog Completion v2. Existing sections are unchanged; this design adds Sample types (primary and secondary), Containers and Body site." />
      <ExampleSwitch value={tab} onChange={k => { setTab(k); setAdd(''); }} options={[['CREA', 'Creatinine (Serum)'], ['WCUL', 'Wound Culture (Swab, wound)'], ['TCUL', 'Throat Culture (Swab)']]} />
      <div className="grid" style={{ gridTemplateColumns: '220px minmax(0,1fr)' }}>
        <nav aria-label="Test editor sections" style={{ borderLeft: '1px solid #e0e0e0' }}>
          {sections.map(s => {
            const on = s === 'Containers' || s === 'Body site';
            if (s === 'General') return <div key={s}><div className="mono" style={{ fontSize: 11, color: '#525252', padding: '0 12px 4px' }}>Existing: Test Catalog Completion v2</div><div style={{ padding: '8px 12px', fontSize: 14, color: '#525252', borderLeft: '3px solid transparent', marginLeft: -2 }}>{s}</div></div>;
            return <div key={s} style={{ padding: '8px 12px', fontSize: 14, borderLeft: on ? '3px solid #0f62fe' : '3px solid transparent', marginLeft: -2, fontWeight: on ? 600 : 400, color: on ? '#161616' : '#525252' }}>{s}{on && <NewChip />}{s === 'Body site' && siteMode === 'Not used' && <div className="muted" style={{ fontWeight: 400 }}>Hidden for {d.st}</div>}</div>;
          })}
        </nav>
        <div>
          <Fence label="Existing: Test Catalog Completion v2" style={{ marginTop: 0, marginBottom: 16 }}>
            <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', fontSize: 14 }}><span><span className="muted">Test name</span><br /><strong>{name}</strong></span><span><span className="muted">Code</span><br /><span className="mono">{T[tab].code}</span></span><span><span className="muted">Sample type</span><br /><strong>{d.st}</strong></span><span><span className="muted">Lab unit</span><br />{T[tab].unit}</span><span><span className="muted">Sample types on this test</span><br />One (D-028 unchanged)</span></div>
            <p className="muted" style={{ marginBottom: 0 }}>General, Sample type, Result type and units, Reference ranges and Label settings are the existing sections, unchanged and abbreviated here. Body site for {d.st} is {siteMode} (Sample Type settings, screen 9).</p>
          </Fence>
          <NewBlock style={{ marginBottom: 16 }} id="te-sampletypes">
            <h3>Sample types</h3>
            <p className="muted" style={{ marginTop: -4 }}>The test keeps exactly one sample type. Secondary sample types come from containers that can be used as it; a sample in one keeps its true type.</p>
            <dl className="kv" style={{ gridTemplateColumns: '120px 1fr' }}>
              <dt>Primary</dt><dd><Tag c="gray" md>{d.st}</Tag></dd>
              <dt>Secondary</dt><dd>{d.list.filter(x => x.usedAs).length ? <div className="tagset">{d.list.filter(x => x.usedAs).map(x => <Tag key={x.c} c="gray" md>{C[x.c].yields[0]}, via {C[x.c].abbr || C[x.c].short}, used as {d.st}</Tag>)}</div> : <span className="muted">None. Add a container from "Can be used as {d.st} for this test" to accept another sample type.</span>}</dd>
            </dl>
          </NewBlock>
          <NewBlock>
            <h3>Containers</h3>
            <p className="muted" style={{ marginTop: -4 }}>Ordered list. The first is Preferred; the rest are Alternates. Reception gets container proposals from this list.</p>
            <div className="cds--data-table-container">
              <table className="cds--data-table cds--data-table--sm">
                <thead><tr><th style={{ width: 70 }}>Order</th><th>Container</th><th>Role</th><th style={{ width: 90 }}>Count</th><th style={{ width: 200 }}>Minimum volume</th><th style={{ width: 90 }}></th></tr></thead>
                <tbody>{d.list.map((x, i) => (
                  <tr key={x.c}>
                    <td><button type="button" className="linkbtn" aria-label={'Move ' + C[x.c].name + ' up'} disabled={i === 0} onClick={() => move(i, -1)} style={{ textDecoration: 'none', marginRight: 8 }}>{'▲'}</button><button type="button" className="linkbtn" aria-label={'Move ' + C[x.c].name + ' down'} disabled={i === d.list.length - 1} onClick={() => move(i, 1)} style={{ textDecoration: 'none' }}>{'▼'}</button></td>
                    <td style={{ minWidth: 260 }}>
                      <div style={{ whiteSpace: 'nowrap' }}><Swatch c={x.c} />{C[x.c].name}</div>
                      <div className="muted">{C[x.c].add}; yields {C[x.c].yields.join(', ')}</div>
                      {x.usedAs && <div className="cds--form__helper-text" style={{ maxWidth: 380 }}>A sample in this container keeps its true sample type ({C[x.c].yields[0]}) on the sample, labels and reports. This test still has one sample type: {d.st}.</div>}
                    </td>
                    <td><div className="tagset"><Tag c={x.role === 'Preferred' ? 'green' : 'cool-gray'}>{x.role}</Tag>{x.usedAs && <Tag c="teal">Used as {d.st}</Tag>}</div></td>
                    <td><TextInput size="sm" value={x.n} onChange={v => setRow(i, { n: v })} ariaLabel={'Count for ' + C[x.c].name} /></td>
                    <td><div style={{ display: 'flex', gap: 4 }}><TextInput size="sm" value={x.min} onChange={v => setRow(i, { min: v })} placeholder="Optional" ariaLabel={'Minimum volume for ' + C[x.c].name} /><Select cell label="Unit" value={x.unit} onChange={v => setRow(i, { unit: v })} options={['mL', 'uL']} style={{ width: 70 }} /></div></td>
                    <td><Btn kind="ghost" onClick={() => setD({ list: reRole(d.list.filter((_, j) => j !== i)) })}>Remove</Btn></td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', marginTop: 12 }}>
              <div style={{ width: 400 }}><Select label="Add container" value={add} onChange={setAdd} options={opts} helper={'Only containers that yield ' + d.st + ', or that can be used as ' + d.st + ' for this test, are listed. ' + hidden + ' other container types are hidden.'} /></div>
              <div style={{ paddingBottom: 22 }}><Btn kind="secondary" disabled={!add} onClick={() => { const ua = !C[add].yields.includes(d.st); setD({ list: [...d.list, { c: add, role: d.list.length ? 'Alternate' : 'Preferred', n: '1', min: '', unit: 'mL', usedAs: ua }] }); setAdd(''); }}>Add</Btn></div>
            </div>
            {acceptable.length > 0 && <p className="muted" style={{ marginTop: 0 }}>A container added from "Can be used as {d.st} for this test" is saved as an Alternate marked "Used as {d.st}". It can never be Preferred.</p>}
            <div style={{ marginTop: 8 }}><Checkbox label="Needs its own container" checked={d.own} onChange={v => setD({ own: v })} /></div>
            <div className="cds--form__helper-text">Shares a container only with tests of its own panel</div>
            <div className="muted">For example PT/INR and APTT in the Coagulation Screen share one citrate tube, and never share with other tests (FR-B25).</div>
          </NewBlock>
          <div style={{ marginTop: 16 }}>
            {siteMode === 'Not used' ? (
              <Annot>Body site section not shown: body site is Not used for {d.st} (Sample Type settings, screen 9). Open Wound Culture or Throat Culture to see it.</Annot>
            ) : (
              <NewBlock>
                <h3>Body site</h3>
                <p className="muted" style={{ marginTop: -4 }}>Shown because {d.st} uses body site ({siteMode}). The default is picked from the sample type's allowed sites.</p>

                  <div style={{ paddingTop: 22 }}>
                    <Checkbox label="Lock at order entry" checked={d.lock} disabled={!d.site} onChange={v => setD({ lock: v })} />
                    <div className="cds--form__helper-text">{d.lock ? 'The site cannot be changed at order entry. Reception sees "' + SITE[d.site].name + '" with a lock and "Set by ' + name + ' in the test catalog".' : 'Reception can change the default.'}</div>
                  </div>
                </div>
              </NewBlock>
            )}
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}><Btn onClick={() => setSaved(true)}>Save test</Btn>{saved && <Tag c="green">Saved</Tag>}</div>
          <PanelCodeNote />
        </div>
      </div>
      <div style={{ height: 32 }}></div>
    </div>
  );
}

function PanelCodeNote() {
  return (

/* ============================== Screen 10: Body Sites admin (FR-N1) ============================== */
function BodySites() {
  const [list, setList] = useState(() => BODY_SITES0.map(s => ({ ...s, sys: s.code ? 'SNOMED CT' : '' })));

  const rows = list.filter(s => (showDeact || s.active) && (!q || (s.name + ' ' + s.code).toLowerCase().includes(q.toLowerCase()))).sort((a, b) => a.sort - b.sort);
  const edit = s => { setOpen(open === s.id ? null : s.id); setDraft({ ...s }); };

  const exportCsv = () => setCsv('name,code,code_system,has_side,sort_order,active\n' + list.filter(s => s.active).sort((a, b) => a.sort - b.sort).slice(0, 8).map(s => [s.name, s.code, s.sys, s.side ? 'Y' : 'N', s.sort, 'Y'].join(',')).join('\n') + '\n...');
  const form = () => (
    <NewBlock>
      <div className="grid g4">
        <TextInput label="Name" required value={draft.name} onChange={v => setDraft({ ...draft, name: v })} helper="Translated through the existing localization mechanism" maxLength={40} />

          </div>
        </div>
      </NewBlock>
      <div className="toolbar" style={{ background: '#fff', padding: '0 0 8px', alignItems: 'flex-end' }}>

                <td>{open === s.id ? '▾' : '▸'}</td>

                <td>{s.sys || <span className="muted">None</span>}</td>

                <td>{s.sort}</td>
                <td>{s.active ? <Tag c="green">Active</Tag> : <Tag c="gray">Deactivated</Tag>}</td>
                <td style={{ fontSize: 13 }}>{s.active ? Object.keys(ST_SITE).filter(k => ST_SITE[k].allowed.includes(s.id)).join(', ') || 'Not allowed on any sample type' : 'Legacy samples only'}</td>
              </tr>
              {open === s.id && <tr className="exp-row"><td colSpan={8}>{form()}</td></tr>}
            </React.Fragment>
          ))}</tbody>
        </table>
      </div>
      <p className="muted" style={{ margin: '8px 0 32px' }}>{rows.length} of {list.length} body sites. Laterality qualifiers sent to FHIR: Left {LATERALITY.Left}, Right {LATERALITY.Right}, Bilateral {LATERALITY.Bilateral} (SNOMED CT). Full SNOMED CT body-structure search is out of scope.</p>
    </div>
  );
}

              <tr><td className="mono" style={{ fontSize: 12 }}>requireProviderEntry</td><td>Order Entry (added by OGC-1143, in progress)</td><td>Provider required at the complete level</td><td className="mono" style={{ fontSize: 12 }}>FR-B13</td><td><Tag c="warm-gray">Pending OGC-1143</Tag></td></tr>

              <tr><td className="mono" style={{ fontSize: 12 }}>numDefault*Labels, numMax*Labels</td><td>Barcode Configuration</td><td>Migrated into Label Presets defaults and maximums</td><td className="mono" style={{ fontSize: 12 }}>FR-I4</td><td><Tag c="cool-gray">Migrated</Tag></td></tr>
              <tr><td className="mono" style={{ fontSize: 12 }}>Patient ID required, supportPatientNationality</td><td>Patient Entry</td><td>No effect anywhere today; removed with a migration note</td><td className="mono" style={{ fontSize: 12 }}>Dep. 18</td><td><Tag c="gray">Removed</Tag></td></tr>
            </tbody>
          </table>
        </div>
      </NewBlock>
      <div style={{ display: 'flex', gap: 8, margin: '16px 0 32px' }}><Btn size="md" onClick={() => setSaved(true)}>Save</Btn>{saved && <Tag c="green">Saved</Tag>}</div>
    </div>
  );
}

/* ============================== Screen 13: Site Information (FR-K8a) ============================== */
function SiteInfo() {
  return (
    <div>
      <PageHead route="/MasterListsPage/SiteInformationMenu" crumbs={['Home', 'Admin Management', 'Site Information']} title="Site Information" sub="Admin only. Existing site-wide settings; this design adds one read-only row." />
      <div className="cds--data-table-container" style={{ maxWidth: 1000 }}>
        <table className="cds--data-table cds--data-table--md">
          <thead><tr><th>Setting</th><th>Value</th></tr></thead>
          <tbody>
            <tr><td style={{ width: '40%' }}><strong>Site name</strong><div className="muted">Existing</div></td><td>Central Public Health Laboratory (CPHL), Port Moresby</td></tr>
            <tr><td><strong>Site code</strong><div className="muted">Existing</div></td><td className="mono">CPHL</td></tr>
            <tr><td><strong>Date format</strong><div className="muted">Existing. Used to show and enter dates in clinical, environmental and vector order entry.</div></td><td><span className="mono">dd/MM/yyyy</span><div className="muted">For example 25/09/2026</div></td></tr>
            <tr><td><strong>24 hour clock</strong><div className="muted">Existing</div></td><td><Tag c="green">On</Tag></td></tr>
            <tr><td><strong>consentRequiredForCollection</strong><div className="muted">Existing. Consent section on Prepare Samples.</div></td><td><Tag c="gray">Off</Tag></td></tr>
            <tr style={{ background: '#edf5ff' }}>
              <td><strong>Laboratory time zone</strong><NewChip /><div className="muted">Every default date and time in order entry is the server's current moment in this time zone.</div></td>
              <td style={{ maxWidth: 420 }}><TextInput label="Laboratory time zone" value={LAB_TZ} readOnly onChange={() => {}} helper="Set by the distribution configuration" /></td>
            </tr>
            <tr style={{ background: '#edf5ff' }}>
              <td><strong>Current laboratory time</strong><NewChip /><div className="muted">From the laboratory server's clock, kept accurate by network time synchronisation.</div></td>
              <td><span className="mono">{fmtDT(NOW)}</span> <span className="muted">(UTC+10:00)</span></td>
            </tr>
          </tbody>
        </table>
      </div>
      <Notif kind="info" title="The laboratory time zone is set in the distribution's configuration files, not on this page." sub="Each national distribution ships with it. When the distribution leaves it unset, the server's time zone is used." style={{ marginTop: 16, maxWidth: 1000 }} />
      <div style={{ height: 32 }}></div>
    </div>
  );
}

/* ============================== App shell ============================== */
const SCREENS = [
  { n: 1, g: 'Order entry', label: 'Order dashboard', route: '/order/clinical', user: 'Mary Kila (Reception)' },
  { n: 2, label: 'Enter Order (new, tubes not yet received)', route: '/order/clinical/enter', user: 'Mary Kila (Reception)' },
  { n: 3, label: 'Enter Order (samples received with order)', route: '/order/clinical/enter', user: 'Mary Kila (Reception)' },
  { n: 4, label: 'Prepare Samples', route: '/order/clinical/collect?id=' + LAB, user: 'John Wari (Laboratory technician)' },
  { n: 5, label: 'Prepare Samples, incomplete (To continue checklist)', route: '/order/clinical/collect?id=' + LAB, user: 'John Wari (Laboratory technician)' },
  { n: 6, label: 'Sample check (optional step)', route: '/order/clinical/qa?id=' + LAB, user: 'John Wari (Sample Receiver)' },
  { n: 7, g: 'Test catalog', label: 'Container Types', route: '/admin/TestCatalogList?entity=containertypes', user: 'Admin (Test Catalog Manager)' },
  { n: 8, label: 'Test editor: Containers and Body site', route: '/MasterListsPage/TestCatalogEditor/TEST-0142', user: 'Admin (Test Catalog Manager)' },
  { n: 9, label: 'Sample Type settings', route: '/admin/TestCatalogList?entity=sampletypes', user: 'Admin (Test Catalog Manager)' },
  { n: 10, label: 'Body Sites', route: '/admin/TestCatalogList?entity=bodysites', user: 'Admin (Test Catalog Manager)' },
  { n: 11, label: 'Downstream: where body site appears (illustrative)', route: '(illustrative)', user: 'Design review' },
  { n: 12, g: 'Configuration', label: 'Order Entry Configuration', route: '/MasterListsPage/SampleEntryConfigurationMenu', user: 'Admin' },
  { n: 13, label: 'Site Information (laboratory time zone)', route: '/MasterListsPage/SiteInformationMenu', user: 'Admin' },
];
function App() {
  const [screen, setScreen] = useState(1);
  const [nonce, setNonce] = useState(0);
  const [acc, setAcc] = useState('Optional');
  const [orders, setOrders] = useState(ORDERS0);
  const [dash, setDash] = useState({ hl: null, note: null });
  const [net, setNet] = useState(false);
  const [stat, setStat] = useState(false);
  const [cfg, setCfg] = useState(CFG0);
  const [psim, setPsim] = useState({ printBlocked: false, printFail: false });
  const go = (s, d) => { setDash(d || { hl: null, note: null }); setScreen(s); setNonce(n => n + 1); window.scrollTo(0, 0); };
  const onSaved = (status, n, t) => setOrders(os => os.map(o => o.lab === LAB ? { ...o, status, n, t: t || o.t, open: status === 'Entered' ? 4 : 6, flags: status === 'Ready for testing' ? [] : o.flags } : o));
  const meta = SCREENS[screen - 1];
  const route = screen === 3 && dash.id ? '/order/clinical/enter?id=' + dash.id : meta.route;
  const common = { go, acc, onSaved, net, stat, cfg, setCfg, psim, setPsim };
  let body;
  if (screen === 1) body = <Dashboard go={go} orders={orders} setOrders={setOrders} dash={dash} acc={acc} cfg={cfg} />;
  if (screen === 2) body = <EnterOrder {...common} received0={false} setNet={setNet} setStat={setStat} />;
  if (screen === 3) body = <EnterOrder {...common} received0={true} savedId={dash.id} setNet={setNet} setStat={setStat} />;
  if (screen === 4) body = <Prepare {...common} variant="demo" dash={dash} />;
  if (screen === 5) body = <Prepare {...common} variant="incomplete" dash={dash} />;
  if (screen === 6) body = <SampleCheck {...common} />;
  if (screen === 7) body = <ContainerTypes />;
  if (screen === 8) body = <TestEditor />;
  if (screen === 9) body = <SampleTypes />;
  if (screen === 10) body = <BodySites />;
  if (screen === 11) body = <Downstream />;
  if (screen === 12) body = <OrderConfig acc={acc} setAcc={setAcc} cfg={cfg} setCfg={setCfg} />;
  if (screen === 13) body = <SiteInfo />;
  return (
    <div>
      <div className="pv-banner"><span>Visual Preview: Clinical Order Entry v4 (FRS v0.7) | OpenELIS Design Mockup | Not a live application</span><span>Screen {screen}: {route}</span></div>
      <header className="app-header">
        <div className="brand">OpenELIS Global <span>| Central Public Health Laboratory (CPHL), Port Moresby</span></div>
        {net && <span className="net-pill" role="status" title="The server is not answering. The page keeps retrying with growing gaps; nothing you entered is lost."><span className="dot"></span>Reconnecting...</span>}
        <div className="right"><span>Orders &amp; Patients</span><span>Signed in: {meta.user}</span></div>
      </header>
      <div className="shell">
        <aside className="rail" aria-label="Preview navigation">
          <h4>Preview navigation (not part of the product)</h4>
          {SCREENS.map(s => (
            <React.Fragment key={s.n}>
              {s.g && <div className="grp">{s.g}</div>}
              <button type="button" className={'nav-item' + (s.n === screen ? ' active' : '')} onClick={() => go(s.n)}><span className="num">{s.n}</span><span>{s.label}</span></button>
            </React.Fragment>
          ))}
          <div className="legend">
            <div style={{ fontWeight: 600, marginBottom: 8 }}>Legend</div>
            <div className="row"><span style={{ width: 28, height: 18, borderLeft: '3px solid #0f62fe', background: '#edf5ff', flex: 'none' }}></span><span>Blue left border and tint, plus a <span className="chip-new">new</span> chip: what this design adds.</span></div>
            <div className="row"><span style={{ width: 24, height: 16, border: '2px dashed #8d8d8d', flex: 'none' }}></span><span>"Existing component, reuse" fence: shipped UI owned by another spec (D-063). The fenced drawing is abbreviated.</span></div>
            <div className="row"><span style={{ width: 24, height: 16, border: '1px dashed #b28600', background: '#fffbeb', flex: 'none' }}></span><span>Preview controls and notes: simulate configuration and failures. Not product UI.</span></div>
            <div className="muted">Sample check: <strong>{acc}</strong>. Configuration switches: screen 12 or the preview controls on Enter Order. {net ? 'Server outage is ON.' : ''}</div>
          </div>
        </aside>
        <main className="main" key={screen + '-' + nonce}>{body}</main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
