};
const DEFAULT_SPEC = ['P:FBC', 'HBA1C', 'P:LFT', 'CREA', 'P:COAG', 'WCUL'];
function EnterOrder({ go, received0, acc, onSaved, savedId, net, setNet, stat, setStat, cfg, setCfg, psim, setPsim }) {
  const saved = !!savedId;
  const full = received0 || saved;
  const [labNo, setLabNo] = useState(LAB);
  const [labScan, setLabScan] = useState('');
  const [chg, setChg] = useState(null);
  const [chgDone, setChgDone] = useState(null);
  const [eqa, setEqa] = useState(false);
  const [eqaF, setEqaF] = useState({ prog: 'RCPAQAP General Chemistry', sid: 'RCPA-CH-2026-09-04', deadline: '2026-10-09', pri: 'Standard' });
  const [noPat, setNoPat] = useState(false);
  const [sim, setSim] = useState({ patientReq: false, searchFail: false, lost: false, restored: false, drift: false, catalogFail: false });
  const [patQ, setPatQ] = useState('Morea');
  const [search, setSearch] = useState('idle');
  const [patient, setPatient] = useState(full ? PATIENTS[0] : null);
  const [newPat, setNewPat] = useState(null);
  const [facQ, setFacQ] = useState(FACS[0].n);
  const [fac, setFac] = useState(FACS[0]);
  const [addFac, setAddFac] = useState(false);
  const [ward, setWard] = useState('Medical Ward 3');
  const [provQ, setProvQ] = useState(full ? 'Dr Agnes Tau' : 'Tau');
  const [prov, setProv] = useState(full ? PROVS[0] : null);
  const [np, setNp] = useState(null);
  const [remember, setRemember] = useState(false);
  const [contact, setContact] = useState('+675 324 8210 (Medical Ward 3 nurses\' station)');
  const [refNo, setRefNo] = useState('PMGH-MW3-1187');
  const [reqAt, setReqAt] = useState('2026-09-25T09:40');
  const [reqBy, setReqBy] = useState('2026-09-27');
  const [program, setProgram] = useState('Antenatal care');
  const [pq, setPq] = useState({ gest: '24', visit: 'First visit', art: 'TLD', vlr: 'Routine monitoring', tbn: '' });
  const [diag, setDiag] = useState('Anaemia in pregnancy, query cause');
  const [nextVisit, setNextVisit] = useState('2026-10-23');
  const [testLoc, setTestLoc] = useState('Medical Ward 3 treatment room');
  const [ot, setOt] = useState(() => buildOt(full ? DEFAULT_SPEC : ['P:FBC', 'HBA1C', 'CREA'], saved));
  const [received, setReceived] = useState(full);
  const [recAt, setRecAt] = useState(RECEIVED);
  const [recBy, setRecBy] = useState(ME_RECEPTION);
  const [rows, setRows] = useState(() => {
    if (!full) return [];
    const base = reconcile([], buildOt(DEFAULT_SPEC), LAB).rows;
    return saved ? base.map(r => ({ ...r, saved: true, status: [], coll: { at: '2026-09-25T08:05', by: 'Sr Ruth Kewa' }, site: r.st === 'Swab, wound' ? 'lowerleg' : r.site, side: r.st === 'Swab, wound' ? 'Left' : '' })) : base;
  });
  /* FR-B1a: completed Patient, Requester and Request details fold to one line once the user moves past them */
  const [folded, setFolded] = useState(() => full ? { patient: true, requester: true, details: true } : {});
  const [chOpen, setChOpen] = useState(false);
  const [billRef, setBillRef] = useState('INV-2026-0931');
  const [pay, setPay] = useState('Exempt');
  const [idx, setIdx] = useState({ name: '', no: '' });
  const [files, setFiles] = useState(full ? [{ n: 'request-form-26CPHL00471.jpg', s: '412 KB', saved }] : []);
  const [fileRm, setFileRm] = useState(null);
  const [showRmFiles, setShowRmFiles] = useState(false);
  const [note, setNote] = useState(received0 && !saved ? 'Proposed 4 samples from ' + buildOt(DEFAULT_SPEC).length + ' tests. Try removing ALP from the Liver Function Panel (the panel stays, marked Modified), adding UREA by code (it shares the proposed SST) or GLU (adds a fluoride oxalate tube).' : null);
  const [testMsg, setTestMsg] = useState(null);
  const [filt, setFilt] = useState(null);
  const [cancelReq, setCancelReq] = useState(null);
  const [offAsk, setOffAsk] = useState(false);
  const [discard, setDiscard] = useState(false);
  const [cmd, setCmd] = useState(null);
  const priority = stat ? 'STAT' : 'Routine';
  const reqReq = cfg.requesterRequired;
  useEffect(() => { if (!saved) setStat(false); }, []);

  const simRef = useRef({});
  simRef.current = { down: net, lost: sim.lost };
  const { saving, pinned, setPinned, run } = useSave(() => simRef.current, labNo);
  const reqByBad = reqBy && reqAt && reqBy < reqAt.slice(0, 10);
  const lab = useLabels({ rows, setRows, ot, psim, orderSaved: saved, me: ME_RECEPTION, cfg, labNo });

  const extOn = cfg.useExternalPatientSource;
  const patResults = patQ.trim() ? PATIENTS.filter(p => (p.name + p.nid + p.dob).toLowerCase().includes(patQ.trim().toLowerCase())).concat(extOn && 'kila morea png-8814-2209'.includes(patQ.trim().toLowerCase()) ? [EXT_PATIENT] : []) : [];
  const facMatches = facQ.length >= 2 && (!fac || fac.n !== facQ) ? FACS.filter(f => f.n.toLowerCase().includes(facQ.toLowerCase())) : [];
  const provMatches = provQ.length >= 2 && !prov ? PROVS.filter(p => provName(p).toLowerCase().includes(provQ.toLowerCase())) : [];

  /* Tests change: untouched proposed rows follow (FR-B26) and say so */
  const applyOt = next => {
    const before = activeIds(ot);
    setOt(next);
    if (received) {
      const res = reconcile(rows, next, labNo);
      setRows(res.rows);
      let msgs = res.msgs;
      const added = activeIds(next).filter(id => !before.includes(id));
      if (!msgs.length && added.length) {
        const host = res.rows.find(r => !r.gone && r.tests.includes(added[0]));
        msgs = [host ? joinNames(added, next) + ' shares the proposed ' + C[host.c].short + ' (' + host.num + '). No sample added.' : joinNames(added, next) + ': no container set in the test catalog. Add a sample by hand if one arrived.'];
      }
      setNote(msgs.length ? msgs.join(' ') : null);
    }
  };
  const snapshot = () => { const o = ot, r = rows; return () => { setOt(o); setRows(r); setNote(null); }; };
  const scrollTo = id => setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
  const onAdd = next => { setTestMsg(null); applyOt(next); };
  const unOwn = id => {
    const e = ot.find(x => x.id === id && !x.cancelled);
    if (!e) return;
    if (e.panels.length) { applyOt(ot.map(x => x === e ? { ...x, own: false } : x)); setTestMsg({ kind: 'info', text: tname(id) + ' stays on the order as part of ' + P[e.panels[0]].name + '.' }); return; }
    removeEntry(id);
  };
  const removeEntry = id => {
    const e = ot.find(x => x.id === id && !x.cancelled);
    if (!e) return;
    if (e.saved) { setCancelReq({ kind: 'test', id }); scrollTo('trow-' + id); return; }
    if (e.panels.length) {
      /* FR-B16a: removing one member keeps the panel, marked Modified; the member stays listed, struck through */
      const undo = snapshot();
      const next = ot.map(x => x === e ? { ...x, own: false, cancelled: true, removed: { by: ME_RECEPTION, at: NOW.slice(11, 16) } } : x);
      applyOt(next);
      setTestMsg({ kind: 'info', text: 'Removed ' + tname(id) + ' from ' + P[e.panels[0]].name + '. The panel stays, marked Modified (' + panelCountText(next, e.panels[0]) + ').', undo });
      return;
    }
    const undo = snapshot();
    applyOt(ot.filter(x => x !== e));
    setTestMsg({ kind: 'info', text: 'Removed ' + tname(id) + '.', undo });
  };
  const dropPanel = pid => {
    const { next, gone } = removePanel(ot, pid);
    if (ot.some(e => gone.includes(e.id) && e.saved)) { setCancelReq({ kind: 'panel', id: pid }); scrollTo('tbl-tests'); return; }
    const kept = ot.filter(e => !e.cancelled && e.panels.includes(pid) && !gone.includes(e.id)).length;
    const undo = snapshot();
    applyOt(next);
    setTestMsg({ kind: 'info', text: 'Removed ' + P[pid].name + ' and ' + gone.length + ' of its tests.' + (kept ? ' ' + kept + (kept === 1 ? ' test' : ' tests') + ' also chosen on its own or in another panel stay.' : ''), undo });
  };
  const restoreEntry = id => applyOt(ot.map(x => x.id === id && x.removed && !x.saved ? { ...x, cancelled: false, removed: null } : x));
  const onCancel = (kind, id, reason) => {
    let ids = [id];
    let next;
    if (kind === 'panel') {
      const { gone } = removePanel(ot, id);
      ids = gone;
      next = ot.map(e => gone.includes(e.id) && !e.cancelled ? { ...e, cancelled: true, cancelReason: reason } : e.panels.includes(id) && !e.cancelled ? { ...e, panels: e.panels.filter(p => p !== id) } : e);
    } else next = ot.map(e => e.id === id && !e.cancelled ? { ...e, cancelled: true, cancelReason: reason, removed: e.panels.length ? { by: ME_RECEPTION, at: NOW.slice(11, 16), reason } : null } : e);
    setOt(next);
    setRows(rs => rs.map(r => ({ ...r, tests: r.tests.filter(t => !ids.includes(t)) })));
    setCancelReq(null);
    setTestMsg({ kind: 'info', text: 'Cancelled ' + (kind === 'panel' ? P[id].name + ' (' + ids.length + ' tests)' : tname(id)) + '. Reason recorded: ' + reason + '. Shown under "Show cancelled".' });
  };
  const onUpdEntry = (id, patch) => {
    const next = ot.map(e => e.id === id && !e.cancelled ? { ...e, ...patch } : e);
    if (patch.up !== undefined) applyOt(next); else setOt(next);
  };
  const toggleReceived = v => {
    if (v) { setReceived(true); const res = reconcile([], ot, labNo); setRows(res.rows); setNote('Proposed ' + res.rows.length + ' samples from ' + activeIds(ot).length + ' tests. Correct them to what actually arrived.'); }
    else if (liveRows(rows).length) setOffAsk(true);
    else setReceived(false);
  };
  const runSearch = () => setSearch(sim.searchFail ? 'failed' : 'ok');
  const toggleEqa = v => { setEqa(v); setNoPat(v); };
  const pickFilter = k => {
    const nk = filt === k ? null : k;
    setFilt(nk);
    const tbl = TEST_FILTERS.includes(k) ? 'tbl-tests' : received ? 'tbl-samples' : 'sec-received';
    scrollTo(tbl);
  };
  const scanBad = cfg.validateAccessionNumber && labScan.trim() && !/^\d{2}CPHL\d{5}$/.test(labScan.trim().toUpperCase());
  const scanTaken = labScan.trim().toUpperCase() === '26CPHL00388';

  const items = [];
  if (!patient && !noPat) items.push({ label: 'Select or create the patient', go: () => flashEl('sec-patient') });
  if (patient && patient.isNew && !patient.nid) items.push({ label: 'National ID for the new patient', go: () => flashEl('sec-patient') });
  if (!activeIds(ot).length) items.push({ label: 'Add at least one test', go: () => flashEl('fld-addcode') });
  if (reqReq && !fac) items.push({ label: 'Add the requesting facility', go: () => flashEl('fld-facility') });
  if (reqReq && !prov) items.push({ label: 'Add the requesting provider', go: () => flashEl('fld-provider') });
  if (reqAt > NOW) items.push({ label: 'Order date and time cannot be in the future', go: () => flashEl('fld-reqat') });
  if (reqByBad) items.push({ label: 'Required by cannot be before the order date', go: () => flashEl('fld-reqby') });
  if (eqa && !eqaF.prog) items.push({ label: 'Choose the EQA program', go: () => flashEl('sec-order') });
  if (scanBad) items.push({ label: 'Lab number format', go: () => flashEl('fld-labscan') });
  if (received && (!recAt || recAt > NOW)) items.push({ label: 'Received date and time', go: () => flashEl('fld-recat') });
  if (received && !recBy) items.push({ label: 'Received by', go: () => flashEl('fld-recby') });
  const saveOk = (patient || noPat) && activeIds(ot).length;
  const save = dest => {
    if (!saveOk) {
      const probs = [!(patient || noPat) && 'select or create the patient (or tick No patient)', !activeIds(ot).length && 'add at least one test or panel'].filter(Boolean);
      setPinned({ kind: 'error', title: 'Nothing was saved', sub: 'Fix these before saving: ' + probs.join('; ') + '. No request was sent.' });
      return;
    }
    run(() => {
      onSaved('Entered', liveRows(rows).length, activeIds(ot).length);
      if (dest === 'exit') go(1, { hl: labNo, note: 'Order ' + labNo + ' saved. Status: Entered. ' + (liveRows(rows).length ? liveRows(rows).length + ' samples saved in the same transaction.' : 'No samples yet.') + (chgDone ? ' Lab number changed from ' + LAB + '; labels reprint now.' : '') });
      else go(4, { id: labNo, fresh: !liveRows(rows).length, ot, patient, prov, fac, ward });
    }, dest === 'exit' ? 'Go to the dashboard' : 'Continue to Prepare Samples');
  };
  const onAliquotFirst = num => {
    if (!saveOk) { setPinned({ kind: 'error', title: 'Nothing was saved', sub: 'Aliquot first saves this step, then opens Prepare Samples. Select the patient and add a test first.' }); return; }
    run(() => { onSaved('Entered', liveRows(rows).length, activeIds(ot).length); go(4, { id: labNo, aliquot: num }); }, 'Continue to Prepare Samples');
  };
  const discardBody = saved
    ? 'The changes made on this step since the last save will be lost. The order was saved earlier, so the step goes back to its last saved state.'
    : 'Discard ' + activeIds(ot).length + ' tests and ' + liveRows(rows).length + ' samples entered on this page? This order has never been saved, so the whole order is discarded and you return to the dashboard. Lab number ' + labNo + ' is recorded as unused, with your name and the time.';
  const chgTaken = chg && chg.no.trim() === '26CPHL00388';
  const applyChange = () => {
    const old = labNo, nw = chg.no.trim();
    setRows(rs => rs.map(r => ({ ...r, num: r.num.replace(old, nw), parent: r.parent ? r.parent.replace(old, nw) : null })));
    setLabNo(nw); setChg(null);
    setChgDone({ old, nw, reason: chg.reason + (chg.detail ? ': ' + chg.detail : '') });
  };
  const printOrder = () => lab.print({ nums: [], order: true, src: 'order' });
  /* Folding (FR-B1a): a section never folds while anything in it is missing or invalid */
  const SEC_ORDER = ['order', 'patient', 'requester', 'details', 'tests', 'received', 'billing', 'attach'];
  const done = {
    patient: !!(noPat || (patient && !(patient.isNew && !patient.nid))) && !newPat,
    requester: (!reqReq || (fac && prov)) && !np && !addFac,
    details: !!reqAt && reqAt <= NOW && !reqByBad,
  };
  const isFold = k => !!folded[k] && done[k];
  const onMove = ev => {
    const el = ev.target && ev.target.closest ? ev.target.closest('[data-sec]') : null;
    if (!el) return;
    const j = SEC_ORDER.indexOf(el.getAttribute('data-sec'));
    const add = ['patient', 'requester', 'details'].filter(k => SEC_ORDER.indexOf(k) < j && done[k] && !folded[k]);
    if (add.length) setFolded(f => { const n = { ...f }; add.forEach(k => { n[k] = true; }); return n; });
  };
  const unfold = k => setFolded(f => ({ ...f, [k]: false }));
  const age = patient ? ageOf(patient.dob) : null;
  const foldText = {
    patient: noPat ? (eqa ? 'EQA sample, no patient' : 'No patient (override recorded)') : patient ? [patient.name, patient.sex, age != null ? age + ' y' : null, patient.nid].filter(Boolean).join(', ') : '',
    requester: [fac ? fac.n + (ward ? ', ' + ward : '') : 'No facility', prov ? provName(prov) : 'No provider', refNo ? 'Referring lab no. ' + refNo : null].filter(Boolean).join(' · '),
    details: ['Ordered ' + fmtDT(reqAt), reqBy ? 'required by ' + fmtD(reqBy) : null, program, diag || null].filter(Boolean).join(' · '),
  };
  const Fold = ({ k }) => <div className="fold-line"><span className="fold-t">{I.check}<span>{foldText[k]}</span></span><Btn kind="ghost" onClick={() => unfold(k)} aria-label={'Edit ' + { patient: 'Patient', requester: 'Requester', details: 'Request details' }[k]}>Edit {I.editBtn}</Btn></div>;
  const chooserFolded = activeIds(ot).length > 0 && !chOpen;
  const billingOn = cfg.billingRefNumber || cfg.trackPayment || cfg.contactTracingEnabled || cfg.notifications;

  return (
    <div onClickCapture={onMove} onFocusCapture={onMove}>
      <PageHead route={'/order/clinical/enter' + (saved ? '?id=' + labNo : '')} crumbs={['Home', 'Orders', 'Clinical Orders', 'Enter Order']}
        title={<span>Enter Order{stat && <> <Tag c="red" md>STAT</Tag></>}</span>}
        sub={saved ? 'Saved order ' + labNo + '. Every change after entry is made on these steps.' : 'Step 1 of the clinical order. Work top to bottom, in the order of the paper request form.'}
        actions={saved ? <Btn kind="danger--ghost" size="md" onClick={() => go(1, { note: 'Use Cancel order on the dashboard row, or here, to cancel with a reason (FR-A4). Shown on the dashboard for this preview.' })}>Cancel order</Btn> : null} />
      <PreviewControls note="A simulated failure applies to the next action; Retry then succeeds, except while the server outage is on."
        items={[
          { label: 'Patient required by configuration', on: sim.patientReq, set: v => { setSim({ ...sim, patientReq: v }); if (v && noPat && !eqa) setNoPat(false); } },
          { label: 'Patient search fails', on: sim.searchFail, set: v => setSim({ ...sim, searchFail: v }) },
          { label: 'Test catalog search fails', on: sim.catalogFail, set: v => setSim({ ...sim, catalogFail: v }) },
          { label: 'Server outage (Reconnecting...)', on: net, set: setNet },
          { label: 'Save reply lost', on: sim.lost, set: v => setSim({ ...sim, lost: v }) },
          { label: 'Restored unsaved work', on: sim.restored, set: v => setSim({ ...sim, restored: v }) },
          { label: 'Computer clock 14 minutes off', on: sim.drift, set: v => setSim({ ...sim, drift: v }) },
          { label: 'Browser blocks the print window', on: psim.printBlocked, set: v => setPsim(s => ({ ...s, printBlocked: v })) },
          { label: 'Label file cannot be generated', on: psim.printFail, set: v => setPsim(s => ({ ...s, printFail: v })) },
        ]}
        cfgItems={cfgControls(cfg, setCfg, ['labelOverride', 'requesterRequired', 'eqaEnabled', 'restrictFreeTextProviderEntry', 'restrictFreeTextRefSiteEntry', 'validateAccessionNumber', 'useExternalPatientSource', 'nextVisit', 'testLocationCode', 'billingRefNumber', 'trackPayment', 'contactTracingEnabled', 'notifications', 'autoFill', 'gpsCoordinatesEnabled'])} />
      <NewBlock style={{ padding: '10px 14px 2px' }}>
        <Progress steps={orderSteps(acc, 0, [stCur(items.length), saved ? stProg(PREP_TODO) : stNot(), stNot()])} onOpen={saved ? s => go(s.screen, { id: labNo }) : null} />
        {!saved && <p className="muted" style={{ margin: '-6px 0 8px', fontSize: 12 }}>Steps open from the indicator once the order is saved.</p>}
      </NewBlock>
      <SummaryStrip patient={patient} noPat={noPat} eqa={eqa} fac={fac} ward={ward} prov={prov} stat={stat} ot={ot} rows={rows} received={received} onPick={pickFilter} active={filt} reqReq={reqReq} />
      {sim.restored && <Notif kind="info" title="Unsaved entries from 10:42 were restored." sub="They were kept only on this computer and only for you. They are cleared when this step is saved or discarded, or after 24 hours." onClose={() => setSim({ ...sim, restored: false })} style={{ marginTop: 12 }} />}
      {sim.drift && <Notif kind="warning" title="This computer's clock is 14 minutes off. Times are taken from the laboratory server." sub="Default dates and times are not affected." onClose={() => setSim({ ...sim, drift: false })} style={{ marginTop: 12 }} />}

      {/* 1. Order */}
      <div className="section" id="sec-order" data-sec="order">
        <SecHead n="1" title="Order" />
        <div className="grid" style={{ gridTemplateColumns: 'minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr)' }}>
          <div className="cds--tile" style={{ background: '#f4f4f4' }}>
            <span className="lbl">Lab number</span>
            <div className="mono" style={{ fontSize: 24 }}>{saved ? labNo : (labScan.trim().toUpperCase() || labNo)}</div>
            {saved ? (
              <div>
                <div className="muted" style={{ marginBottom: 8 }}>Saved order. Sample numbers follow it ({labNo}-1, {labNo}-2 and so on; aliquots {labNo}-1.1).</div>
                {!chg && <Btn kind="tertiary" onClick={() => { setChg({ no: '', reason: '', detail: '', step: 'edit' }); setChgDone(null); }}>Change lab number</Btn>}
              </div>
            ) : (
              <div id="fld-labscan">
                <div className="muted" style={{ marginBottom: 12 }}>{labScan.trim() ? 'Scanned label. Checked for uniqueness when saved; ' + LAB + ' is then recorded as unused.' : 'Reserved when this page opened. Never reused.'}</div>
                <TextInput size="sm" label="Or scan a pre-printed label" value={labScan} onChange={setLabScan} placeholder="Scan barcode"
                  invalid={scanTaken || scanBad} invalidText={scanTaken ? 'Lab number 26CPHL00388 is already used by order 26CPHL00388 (Tom Kaupa, 24/09/2026).' : 'Lab numbers here look like 26CPHL00472 (year, site code, 5 digits). Checked because validateAccessionNumber is on.'}
                  helper='Try "26CPHL00388" (already used) or "12345" (wrong format).' />
              </div>
            )}
          </div>
          <div className="cds--tile" style={{ background: '#f4f4f4' }}>
            <RadioGroup legend="Priority" value={priority} onChange={v => setStat(v === 'STAT')} options={['Routine', 'STAT']} helper="A STAT order shows a red STAT Tag in the order summary on every step." />
            <div style={{ marginTop: 16 }}>
              <Fence label="Existing: EQA and No patient (PR #4282, OGC-1239)" style={{ marginTop: 0 }}>
                <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
                  {cfg.eqaEnabled && <Checkbox label="EQA sample" checked={eqa} onChange={toggleEqa} />}
                  <div>
                    <Checkbox label="This order has no patient" checked={noPat} disabled={eqa || sim.patientReq} onChange={setNoPat} title={sim.patientReq ? 'A patient is required by Order Entry Configuration.' : undefined} />
                    {eqa ? <div className="cds--form__helper-text">Ticked by EQA</div>
                      : sim.patientReq ? <div className="cds--form__helper-text">A patient is required by Order Entry Configuration.</div> : null}
                  </div>
                </div>
                {!cfg.eqaEnabled && <div className="muted" style={{ marginTop: 6 }}>EQA sample appears when eqaEnabled is on.</div>}
                {noPat && !eqa && <Notif kind="warning" title="Results will not be evaluated against a reference range" sub="Without a patient there is no age or sex, so results are not flagged normal or abnormal." style={{ marginTop: 12, marginBottom: 0 }} />}
              </Fence>
            </div>
          </div>
          <div className="cds--tile" style={{ background: '#f4f4f4' }} id="order-labels-shortcut">
            <span className="lbl">Order labels</span>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
              <Btn kind="tertiary" onClick={printOrder}>Print order labels {I.print}</Btn>
            </div>
            <div className="muted" style={{ marginTop: 8 }}>{lab.orderCount()} order labels. Quantities are in the Labels section. <button type="button" className="linkbtn" onClick={() => scrollTo('sec-labels')}>Go to Labels</button></div>
            <LabelMsgs lab={lab} src="order" style={{ marginTop: 8, marginBottom: 0 }} />
          </div>
        </div>
        {eqa && cfg.eqaEnabled && (
          <Fence label="Existing: EQA fields (PR #4282)">
            <div className="grid g4">
              <Select label="EQA program" required value={eqaF.prog} onChange={v => setEqaF({ ...eqaF, prog: v })} options={[{ v: '', l: 'Choose a program' }, 'RCPAQAP General Chemistry', 'RCPAQAP Haematology', 'WHO Malaria Microscopy EQA']} />
              <TextInput label="Provider sample ID" value={eqaF.sid} onChange={v => setEqaF({ ...eqaF, sid: v })} />
              <TextInput label="Deadline" type="date" value={eqaF.deadline} onChange={v => setEqaF({ ...eqaF, deadline: v })} />
              <Select label="EQA priority" value={eqaF.pri} onChange={v => setEqaF({ ...eqaF, pri: v })} options={['Standard', 'Urgent']} />
            </div>
            <p className="muted" style={{ marginBottom: 0 }}>EQA also ticks No patient and suppresses the no-patient warning.</p>
          </Fence>
        )}
        {chg && (
          <NewBlock style={{ marginTop: 12 }}>
            <div className="h3" style={{ fontSize: 14 }}>Change lab number</div>
            {chg.step === 'edit' ? (
              <div>
                <div className="grid g3">
                  <TextInput label="New lab number" required value={chg.no} onChange={v => setChg({ ...chg, no: v })} placeholder="Scan or type" invalid={chgTaken} invalidText="Lab number 26CPHL00388 is already used by order 26CPHL00388 (Tom Kaupa, 24/09/2026)." helper='Try "26CPHL00388" to see the clash.' />
                  <Select label="Reason for changing the lab number" required value={chg.reason} onChange={v => setChg({ ...chg, reason: v })} options={[{ v: '', l: 'Choose a reason' }, 'Pre-printed label used at collection', 'Number entered in error', 'Other']} />
                  <TextInput label="Details" required={chg.reason === 'Other'} value={chg.detail} onChange={v => setChg({ ...chg, detail: v })} placeholder="Optional unless Other" />
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <Btn disabled={!chg.no.trim() || chgTaken || chg.no.trim() === labNo || !chg.reason || (chg.reason === 'Other' && !chg.detail)} onClick={() => setChg({ ...chg, step: 'confirm' })}>Review change</Btn>
                  <Btn kind="ghost" onClick={() => setChg(null)}>Cancel</Btn>
                </div>
              </div>
            ) : (
              <Notif kind="warning" title={labNo + ' becomes ' + chg.no.trim() + '. Print new labels for every tube.'} sub={'Old: ' + labNo + '. New: ' + chg.no.trim() + '. Reason: ' + chg.reason + (chg.detail ? ': ' + chg.detail : '') + '.'}>
                <ul style={{ margin: '0 0 8px 18px', listStyle: 'disc' }}>
                  <li>All {liveRows(rows).length} sample numbers change with it, for example {labNo}-1 becomes {chg.no.trim()}-1. The old numbers are recorded against each sample and never reissued.</li>
                  <li>After you save, use Print all labels in the Labels section to print labels with the new numbers.</li>
                  <li>The change is recorded with your name, the time and the reason. {labNo} is retired and never reissued.</li>
                </ul>
                <div style={{ display: 'flex', gap: 8 }}><Btn kind="danger" onClick={applyChange}>Change lab number</Btn><Btn kind="secondary" onClick={() => setChg({ ...chg, step: 'edit' })}>Back</Btn></div>
              </Notif>
            )}
          </NewBlock>
        )}
        {chgDone && <Notif kind="success" title={'Lab number changes from ' + chgDone.old + ' to ' + chgDone.nw + ' when you save.'} sub={'Reason recorded: ' + chgDone.reason + '. Print new labels for every tube after you save (Print all labels).'} onClose={() => setChgDone(null)} style={{ marginTop: 12 }} />}
      </div>

      {/* 2. Patient */}
      <div className="section" id="sec-patient" data-sec="patient">
        <SecHead n="2" title="Patient" req={!noPat && !isFold('patient')}>{isFold('patient') && <Fold k="patient" />}</SecHead>
        {!isFold('patient') && <Fence label="Existing: shared patient search panel (OGC-1197), with FR-B5 and FR-B6 changes" style={{ marginTop: 0 }}>
          {noPat ? (
            <div className="card">
              <strong>{eqa ? 'EQA sample: no patient' : 'No patient'}</strong>
              <div className="muted">The order is saved with its no-patient override record, in the same save. Untick {eqa ? 'EQA sample' : 'No patient'} to search for a patient.</div>
            </div>
          ) : patient ? (
            <div className="card" style={{ display: 'flex', gap: 24, alignItems: 'center', flexWrap: 'wrap' }}>
              <div><strong style={{ fontSize: 16 }}>{patient.name}</strong> <Tag c="green">Selected</Tag>{patient.src === 'External patient source' && <> <Tag c="purple">From external patient source</Tag></>}{patient.isNew && <> <Tag c="blue">New patient, saved with the order</Tag></>}</div>
              <dl className="kv" style={{ gridTemplateColumns: 'repeat(8, max-content)' }}><dt>Sex</dt><dd>{patient.sex}</dd><dt>DOB</dt><dd>{fmtD(patient.dob) || 'Unknown'}</dd><dt>National ID</dt><dd className="mono">{patient.nid || 'None'}</dd><dt>Phone</dt><dd>{patient.phone || 'None'}</dd></dl>
              <Btn kind="ghost" onClick={() => { setPatient(null); setSearch('idle'); setNewPat(null); }}>Change patient</Btn>
            </div>
          ) : newPat ? (
            <div>
              <div className="h3" style={{ fontSize: 14 }}>New patient <span className="muted" style={{ fontWeight: 400 }}>Identifier, last name, first name and date of birth carried across from your search</span></div>
              <div className="grid g4">
                <TextInput label="National ID" required value={newPat.nid} onChange={v => setNewPat({ ...newPat, nid: v })} helper="Required by Patient Entry Configuration (National ID required)" />
                <TextInput label="Last name" required value={newPat.last} onChange={v => setNewPat({ ...newPat, last: v })} />
                <TextInput label="First name" value={newPat.first} onChange={v => setNewPat({ ...newPat, first: v })} />
                <TextInput label="Date of birth" type="date" value={newPat.dob} onChange={v => setNewPat({ ...newPat, dob: v })} />
                <Select label="Sex" required value={newPat.sex} onChange={v => setNewPat({ ...newPat, sex: v })} options={['F', 'M', 'Unknown']} />
                <TextInput label="Phone" value={newPat.phone} onChange={v => setNewPat({ ...newPat, phone: v })} placeholder="+675" />
              </div>
              <p className="muted">Abbreviated. The full form is the shared new-patient form, unchanged.</p>
              <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                <Btn disabled={!newPat.last} onClick={() => { setPatient({ name: (newPat.first + ' ' + newPat.last).trim(), sex: newPat.sex, dob: newPat.dob, nid: newPat.nid, phone: newPat.phone, isNew: true }); setNewPat(null); }}>Use this patient</Btn>
                <Btn kind="ghost" onClick={() => setNewPat(null)}>Back to search</Btn>
              </div>
            </div>
          ) : (
            <div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', maxWidth: 680 }}>
                <div style={{ flex: 1 }}><TextInput label="Search by national ID, name, date of birth or lab number" value={patQ} onChange={v => { setPatQ(v); setSearch('idle'); }} onKeyDown={e => e.key === 'Enter' && runSearch()} helper={extOn ? 'Also searching the external patient source (useExternalPatientSource is on)' : 'Searching OpenELIS patients'} /></div>
                <div style={{ paddingBottom: 22 }}><Btn size="md" onClick={runSearch}>Search</Btn></div>
              </div>
              {search === 'idle' && <p className="muted" style={{ marginTop: 0 }}>Search first. <strong>Create new patient</strong> appears after a search has succeeded, even when it finds nobody.</p>}
              {search === 'failed' && (
                <Notif kind="error" title="Search failed. Check the connection and try again." sub="This is not the same as no results. Create new patient becomes available after a search succeeds." style={{ marginTop: 12 }}>
                  <Btn kind="tertiary" onClick={() => { setSim(s => ({ ...s, searchFail: false })); setSearch('ok'); }}>Retry</Btn>
                </Notif>
              )}
              {search === 'ok' && (
                <div style={{ marginTop: 12 }}>
                  {patResults.length > 0 ? (
                    <table className="cds--data-table cds--data-table--sm" style={{ width: '100%' }}>
                      <thead><tr><th>Name</th><th>Sex</th><th>Date of birth</th><th>National ID</th><th>Last order</th>{extOn && <th>Source</th>}<th></th></tr></thead>
                      <tbody>{patResults.map(p => <tr key={p.nid + p.src}><td>{p.name}</td><td>{p.sex}</td><td>{fmtD(p.dob)}</td><td className="mono">{p.nid}</td><td>{p.last}</td>{extOn && <td><Tag c={p.src === 'OpenELIS' ? 'cool-gray' : 'purple'}>{p.src}</Tag></td>}<td><Btn kind="ghost" onClick={() => setPatient(p)}>Select</Btn></td></tr>)}</tbody>
                    </table>
                  ) : <Notif kind="info" title={'No patient matches "' + patQ.trim() + '".'} sub="The search succeeded and found nobody, so you can create the patient from these details." />}
                  <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 12 }}>
                    <span className="muted">{patResults.length ? patResults.length + ' found. Not the right person?' : ''}</span>
                    <Btn kind="tertiary" onClick={() => { const v = patQ.trim(); const isId = /^png-/i.test(v); const parts = v.split(' '); setNewPat({ nid: isId ? v : '', last: isId ? '' : parts[parts.length - 1], first: !isId && parts.length > 1 ? parts[0] : '', dob: '', sex: 'F', phone: '' }); }}>Create new patient</Btn>
                  </div>
                </div>
              )}
            </div>
          )}
        </Fence>}
      </div>

      {/* 3. Requester */}
      <div className="section" id="sec-requester" data-sec="requester">
        <SecHead n="3" title="Requester">
          {isFold('requester') ? <Fold k="requester" /> : <>
          <Checkbox label="Remember site and requester" checked={remember} onChange={setRemember} />
          {remember && <span className="muted">Facility, ward, provider and requestor contact are kept for your next new order in this browser session.</span>}
          </>}
        </SecHead>
        {!isFold('requester') && <div className="grid g2">
          <div id="fld-facility">
            <TextInput label="Requesting facility" required={reqReq} value={facQ} onChange={v => { setFacQ(v); setFac(null); setAddFac(false); }} placeholder="Search facilities" helper={fac ? 'Selected: ' + fac.n : 'Type at least 2 characters'} />
            {facMatches.length > 0 && <div className="results">{facMatches.map(f => <button key={f.n} type="button" className="res" onClick={() => { setFac(f); setFacQ(f.n); setWard(f.wards[0]); }}>{f.n}</button>)}</div>}
            {!fac && facQ.length >= 2 && facMatches.length === 0 && (
              <div className="card" style={{ marginTop: 4 }}>
                <span className="muted">No facility matches "{facQ}".</span>{' '}
                {cfg.restrictFreeTextRefSiteEntry
                  ? <span data-tip="Adding new entries here is turned off in Order Entry Configuration."><Btn kind="ghost" disabled aria-describedby="fac-why">Add new facility</Btn></span>
                  : !addFac ? <Btn kind="ghost" onClick={() => setAddFac(true)}>Add new facility</Btn> : (
                    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', marginTop: 8 }}>
                      <div style={{ flex: 1 }}><TextInput label="Facility name" required value={facQ} onChange={setFacQ} /></div>
                      <div style={{ paddingBottom: 2 }}><Btn onClick={() => { const f = { n: facQ, wards: ['Outpatients'] }; setFac(f); setWard('Outpatients'); setAddFac(false); }}>Use new facility</Btn></div>
                    </div>
                  )}
                {cfg.restrictFreeTextRefSiteEntry && <div className="muted" id="fac-why">Adding new entries here is turned off in Order Entry Configuration (restrictFreeTextRefSiteEntry).</div>}
              </div>
            )}
          </div>
          <Select label="Ward or department" value={ward} onChange={setWard} disabled={!fac} options={fac ? fac.wards : ['Choose a facility first']} helper="Searched within the chosen facility" />
          <div id="fld-provider" style={{ gridColumn: 'span 2' }}>
            <div className="grid g2">
              <div>
                <TextInput label="Requesting provider" required={reqReq} value={provQ} onChange={v => { setProvQ(v); setProv(null); setNp(null); }} placeholder="Search by name" helper={<span>Results show title, name and facility. Try <button type="button" className="linkbtn" onClick={() => { setProvQ('Tau'); setProv(null); setNp(null); }}>Tau</button> or <button type="button" className="linkbtn" onClick={() => { setProvQ('Nime'); setProv(null); setNp(null); }}>Nime</button> (no match).</span>} />
                {provMatches.length > 0 && <div className="results">{provMatches.map(p => <button key={p.l + p.f} type="button" className="res" onClick={() => { setProv(p); setProvQ(provName(p)); }}><span>{provName(p)}</span><span className="muted">{p.fac}</span></button>)}</div>}
                {!prov && provQ.length >= 2 && provMatches.length === 0 && !np && (
                  <div className="card" style={{ marginTop: 4 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                      <span className="muted">No provider matches "{provQ}".</span>
                      {cfg.restrictFreeTextProviderEntry
                        ? <span data-tip="Adding new entries here is turned off in Order Entry Configuration."><Btn kind="tertiary" disabled aria-describedby="prov-why">Add new provider</Btn></span>
                        : <Btn kind="tertiary" onClick={() => setNp({ t: '', f: '', l: provQ.trim(), ph: '', fax: '', em: '' })}>Add new provider</Btn>}
                    </div>
                    {cfg.restrictFreeTextProviderEntry && <div className="muted" id="prov-why" style={{ marginTop: 4 }}>Adding new entries here is turned off in Order Entry Configuration (restrictFreeTextProviderEntry, on by default). Ask an administrator to add the provider, or choose another.</div>}
                  </div>
                )}
              </div>
              <div>
                {prov && (
                  <div className="card">
                    <div style={{ marginBottom: 8 }}><strong>{provName(prov)}</strong> <Tag c="green">Selected</Tag></div>
                    <dl className="kv"><dt>Facility</dt><dd>{prov.fac}</dd><dt>Phone</dt><dd>{prov.ph || 'None'}</dd><dt>Fax</dt><dd>{prov.fax || 'None'}</dd><dt>Email</dt><dd>{prov.em || 'None'}</dd></dl>
                  </div>
                )}
                {!prov && !np && <p className="muted" style={{ paddingTop: 24 }}>Name, phone, fax and email appear after you pick a provider or choose Add new provider.</p>}
              </div>
            </div>
            {np && !cfg.restrictFreeTextProviderEntry && (
              <NewBlock style={{ marginTop: 12 }}>
                <div className="h3" style={{ fontSize: 14 }}>Add new provider</div>
                <div className="grid g3">
                  <Select label="Title" newMark value={np.t} onChange={v => setNp({ ...np, t: v })} options={[{ v: '', l: 'No title' }, 'Dr', 'Sr', 'Mr', 'Mrs', 'Ms', 'Prof']} helper="Optional. The provider title list used by the Providers admin page" />
                  <TextInput label="First name" value={np.f} onChange={v => setNp({ ...np, f: v })} />
                  <TextInput label="Last name" required value={np.l} onChange={v => setNp({ ...np, l: v })} />
                  <TextInput label="Phone" value={np.ph} onChange={v => setNp({ ...np, ph: v })} placeholder="+675" />
                  <TextInput label="Fax" value={np.fax} onChange={v => setNp({ ...np, fax: v })} invalid={!!np.fax && !/^[+0-9 ()-]{6,}$/.test(np.fax)} invalidText="Enter a fax number, for example +675 324 8201" />
                  <TextInput label="Email" value={np.em} onChange={v => setNp({ ...np, em: v })} invalid={!!np.em && !/^\S+@\S+\.\S+$/.test(np.em)} invalidText="Enter an email address, for example name@pomgh.gov.pg" />
                </div>
                <p className="muted" style={{ marginTop: 8 }}>Saved with the title, so reports print "{provName({ t: np.t, f: np.f || 'First', l: np.l || 'Last' })}".</p>
                <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                  <Btn disabled={!np.l} onClick={() => { setProv({ ...np, fac: fac ? fac.n : '' }); setProvQ(provName(np)); setNp(null); }}>Use new provider</Btn>
                  <Btn kind="ghost" onClick={() => setNp(null)}>Cancel</Btn>
                </div>
              </NewBlock>
            )}
          </div>
          <TextInput label="Requestor contact" value={contact} onChange={setContact} helper="Phone or email for questions about this request" />
          <div>
            <TextInput label="Referring laboratory number" value={refNo} onChange={setRefNo} helper="The existing requester sample ID, relabelled: the number the sending facility wrote on its form." />
            <Tag c="purple">Owned by External Lab IDs FRS</Tag>
          </div>
        </div>}
      </div>

      {/* 4. Request details */}
      <div className="section" id="sec-details" data-sec="details">
        <SecHead n="4" title="Request details">{isFold('details') && <Fold k="details" />}</SecHead>
        {!isFold('details') && <>
        <div className="grid g2" style={{ maxWidth: 820 }}>
          <div id="fld-reqat"><TextInput label="Order date and time" required type="datetime-local" value={reqAt} onChange={setReqAt} helper={'When the clinician ordered the tests. Defaults to now in laboratory time (' + LAB_TZ + ').'} invalid={reqAt > NOW} invalidText="Order date and time cannot be in the future." /></div>
          <div id="fld-reqby"><TextInput label="Required by" type="date" value={reqBy} onChange={setReqBy} invalid={!!reqByBad} invalidText="Required by cannot be before the order date." helper="Optional" /></div>
        </div>
        <div className="grid g3" style={{ marginTop: 16 }}>
          <Select label="Program" value={program} onChange={setProgram} options={Object.keys(PROGRAM_QUESTIONS)} />
          <div style={{ gridColumn: 'span 2' }}><TextInput label="Provisional diagnosis" value={diag} onChange={setDiag} /></div>
        </div>
        <div className="card" style={{ marginTop: 12, borderLeft: '3px solid #8a3ffc' }}>
          <div className="h3" style={{ fontSize: 14 }}>Additional questions for {program} <Tag c="purple">Owned by OGC-1144</Tag></div>
          {PROGRAM_QUESTIONS[program].length ? (
            <div className="grid g3">
              {PROGRAM_QUESTIONS[program].map(q => q.t === 'select'
                ? <Select key={q.k} label={q.l} value={pq[q.k]} onChange={v => setPq({ ...pq, [q.k]: v })} options={q.o} />
                : <TextInput key={q.k} label={q.l} value={pq[q.k]} onChange={v => setPq({ ...pq, [q.k]: v })} />)}
            </div>
          ) : <div className="muted">This program has no additional order questions.</div>}
        </div>
        {(cfg.nextVisit || cfg.testLocationCode) ? (
          <div className="grid g3" style={{ marginTop: 16 }}>
            {cfg.nextVisit && <TextInput label="Next visit date" type="date" value={nextVisit} onChange={setNextVisit} helper="Shown because the Next visit date field is on" />}
            {cfg.testLocationCode && <Select label="Sampling performed at" value={testLoc} onChange={setTestLoc} options={['Medical Ward 3 treatment room', 'CPHL collection room', 'Outpatients phlebotomy', 'Community outreach']} helper="Test location code, shown because its field is on" />}
          </div>
        ) : <p className="muted" style={{ marginBottom: 0 }}>Next visit date and Sampling performed at appear only when their configuration switches are on (both off here).</p>}
        </>}
      </div>

      {/* 5. Tests */}
      <div className="section" id="sec-tests" data-sec="tests">
        <SecHead n="5" title="Tests" req><span className="muted">{n2(CATALOG.length)} active tests and {PANEL_LIST.length} panels in the catalog</span></SecHead>
        <TestChooser ot={ot} onAdd={onAdd} onRemovePanel={dropPanel} onRemoveTest={unOwn} failed={sim.catalogFail} onRetry={() => setSim(s => ({ ...s, catalogFail: false }))}
          folded={chooserFolded} onExpand={() => setChOpen(true)} onFold={activeIds(ot).length ? () => setChOpen(false) : null} />
        <MsgBar msg={testMsg} onClose={() => setTestMsg(null)} style={{ marginTop: 12 }} />
        {note && <Notif kind="info" title={note} onClose={() => setNote(null)} style={{ marginTop: 12 }} />}
        <div style={{ marginTop: 12 }}>
          <OrderedTestsTable mode="enter" ot={ot} rows={rows} setRows={setRows} cfg={cfg} received={received} filt={filt} onClearFilt={() => setFilt(null)}
            onRemoveTest={removeEntry} onRemovePanel={dropPanel} onRestoreTest={restoreEntry} cancelReq={cancelReq} setCancelReq={setCancelReq} onCancel={onCancel} onUpdEntry={onUpdEntry} patient={patient} prov={prov} fac={fac} onMsg={setTestMsg} />
        </div>
      </div>

      {/* 6. Samples received with this order */}
      <div className="section" id="sec-received" data-sec="received">
        <SecHead n="6" title="Samples received with this order">
          <Switch checked={received} onChange={toggleReceived} label="Samples received" disabled={saved} title={saved ? 'Locked on: samples on this order are saved. Void them individually.' : undefined} />
          {saved && <span className="muted">Locked on because samples are saved; void them individually.</span>}
        </SecHead>
        {offAsk && (
          <Notif kind="warning" title={'Remove the ' + liveRows(rows).length + ' samples entered?'} sub="Switching off removes the proposed and added samples from this page." style={{ marginTop: 12 }}>
            <div style={{ display: 'flex', gap: 8 }}><Btn kind="danger" onClick={() => { setRows([]); setReceived(false); setOffAsk(false); }}>Remove samples</Btn><Btn kind="secondary" onClick={() => setOffAsk(false)}>Keep them</Btn></div>
          </Notif>
        )}
        {!received ? (
          <p className="muted" style={{ marginTop: 8, marginBottom: 0 }}>Off: the tubes have not arrived. Switch on if they are on the desk now; OpenELIS proposes the containers it expects from the tests, and you correct them to what actually arrived.</p>
        ) : (
          <div>
            <div className="grid g3" style={{ marginBottom: 16 }}>
              <div id="fld-recat"><TextInput label="Received date and time" required type="datetime-local" value={recAt} onChange={setRecAt} helper={'Defaults to now in laboratory time (' + LAB_TZ + ').'} invalid={recAt > NOW} invalidText="Received date and time cannot be in the future." /></div>
              <div id="fld-recby"><Typeahead label="Received by" required value={recBy} options={USERS.map(u => ({ v: u, l: u, meta: 'User' }))} onPick={o => setRecBy(o.v)} onClear={() => setRecBy('')} placeholder="Search users" helper="Defaults to you. Type to search users." /></div>
              <div className="muted" style={{ paddingTop: 22 }}>Collection can be recorded here at the desk, in the Collected column. If it is left empty, Prepare Samples asks for it.</div>
            </div>
            <SamplesTable mode="enter" rows={rows} setRows={setRows} ot={ot} cfg={cfg} labNo={labNo} recAt={recAt} filt={filt} onClearFilt={() => setFilt(null)} onAliquotFirst={onAliquotFirst} cmd={cmd} existingRefs={{}} lab={lab} />
          </div>
        )}
        <LabelsSection lab={lab} labNo={labNo} cfg={cfg} setCfg={setCfg} orderOnly={!received || !liveRows(rows).length} />
      </div>

      {/* 7. Billing and notifications */}
      <div className="section" id="sec-billing" data-sec="billing">
        <SecHead n="7" title="Billing and notifications" />
        {billingOn ? (
          <div>
            <div className="grid g3">
              {cfg.billingRefNumber && <TextInput label="Billing reference" value={billRef} onChange={setBillRef} helper="Label follows billingRefNumberLocalization. Paid is set per test in the Ordered tests table." newMark />}
              {cfg.trackPayment && <Select label="Payment status" value={pay} onChange={setPay} options={['Paid', 'Not paid', 'Exempt']} helper="Order level. Shown because trackPayment is on." />}
            </div>
            {cfg.contactTracingEnabled && (
              <div className="grid g3" style={{ marginTop: 16 }}>
                <TextInput label="Index case name" value={idx.name} onChange={v => setIdx({ ...idx, name: v })} placeholder="For example Morea, Tau" helper="Prints on the report, as today" />
                <TextInput label="Index case record number" value={idx.no} onChange={v => setIdx({ ...idx, no: v })} placeholder="For example 26CPHL00312" />
              </div>
            )}
            {cfg.notifications && <Notif kind="info" title="Result notifications are chosen on each ordered test row (Notify column)." sub="Defaults come from Test Notification Configuration. Channels offered are the ones set up: SMS for the patient, email for the provider." style={{ marginTop: 16 }} />}
          </div>
        ) : <Annot>Section 7 is hidden in the product: billingRefNumber, trackPayment, contactTracingEnabled and result notifications are all off. Switch one on in the preview controls to see it.</Annot>}
      </div>

      {/* 8. Attachments */}
      <div className="section" id="sec-attach" data-sec="attach">
        <SecHead n="8" title="Attachments" />
        <Fence label="Existing: order attachments" style={{ marginTop: 0 }}>
          {files.some(f => f.removed) && <div style={{ marginBottom: 6 }}><Checkbox label={'Show removed (' + files.filter(f => f.removed).length + ')'} checked={showRmFiles} onChange={setShowRmFiles} /></div>}
          {files.filter(f => showRmFiles || !f.removed).length > 0 && (
            <ul style={{ margin: '0 0 8px', padding: 0, listStyle: 'none' }}>
              {files.filter(f => showRmFiles || !f.removed).map(f => (
                <li key={f.n} style={{ padding: '6px 0', borderBottom: '1px solid #e0e0e0', fontSize: 14 }}>
                  <div style={{ display: 'flex', gap: 12, alignItems: 'center', color: f.removed ? '#8d8d8d' : undefined }}>
                    <span className="mono" style={f.removed ? { textDecoration: 'line-through' } : null}>{f.n}</span><span className="muted">{f.s}</span>
                    {f.removed ? <span className="muted">Removed by {f.removed.by}: {f.removed.reason}. Deactivated, not deleted.</span> : !f.saved ? <Tag c="blue">Pending save</Tag> : null}
                    {!f.removed && <Btn kind="ghost" style={{ marginLeft: 'auto' }} aria-label={'Remove ' + f.n} onClick={() => { if (f.saved) setFileRm({ n: f.n, reason: '' }); else { setFiles(files.filter(x => x.n !== f.n)); } }}>Remove</Btn>}
                  </div>
                  {fileRm && fileRm.n === f.n && (
                    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', marginTop: 8, flexWrap: 'wrap' }}>
                      <div style={{ width: 360 }}><TextInput size="sm" label={'Reason for removing ' + f.n} required value={fileRm.reason} onChange={v => setFileRm({ ...fileRm, reason: v })} placeholder="For example: wrong patient's form attached" helper="This attachment is saved, so it is deactivated with your reason, never deleted." /></div>
                      <div style={{ paddingBottom: 22, display: 'flex', gap: 8 }}>
                        <Btn kind="danger" disabled={!fileRm.reason.trim()} onClick={() => { setFiles(files.map(x => x.n === f.n ? { ...x, removed: { by: ME_RECEPTION, reason: fileRm.reason.trim() } } : x)); setFileRm(null); }}>Confirm</Btn>
                        <Btn kind="ghost" onClick={() => setFileRm(null)}>Keep attachment</Btn>
                      </div>
                    </div>
                  )}
                </li>
              ))}
            </ul>
          )}
          <div className="drop">Drag and drop files here, or <button type="button" className="linkbtn" onClick={() => setFiles([...files, { n: 'referral-letter-' + (files.length + 1) + '.pdf', s: '96 KB', saved: false }])}>choose a file</button>. JPG, PNG or PDF, up to 10 MB.</div>
          <p className="muted" style={{ marginBottom: 0 }}>An upload not yet saved is removed at once. On a saved order, Remove asks for a reason and keeps the file under "Show removed" (FR-B31).</p>
        </Fence>
      </div>

      <ContinuePanel step="Prepare Samples" items={items} />
      <Footer missing={items.length} nextLabel="Save and next" saving={saving} pinned={pinned} onPin={setPinned}
        onDiscard={() => setDiscard(true)} onExit={() => save('exit')} onNext={() => save('next')} />
      <Modal open={discard} title="Discard unsaved changes?" primary={saved ? 'Discard changes' : 'Discard order'} danger onClose={() => setDiscard(false)} onPrimary={() => { setDiscard(false); if (saved) go(3, { id: labNo }); else go(1, { hl: null, note: 'Order discarded. Lab number ' + labNo + ' recorded as unused (Mary Kila, 25/09/2026 10:55).' }); }}>
        {discardBody}
      </Modal>
    </div>
  );
}

/* ============================== Screens 4 and 5: Prepare Samples (section D) ============================== */
const PREP_SPEC = ['P:FBC', 'HBA1C', 'P:LFT', 'CREA', 'P:COAG', 'WCUL', 'TCUL'];
const FBC_M = P.FBC.members, LFT_M = P.LFT.members, COAG_M = P.COAG.members;
const COAG_REASON = 'Proposed for Coagulation Screen (PT/INR, APTT), not shared with other tests';
function prepInit(variant) {
  const inc = variant === 'incomplete';
  const L = n => LAB + '-' + n;
  const ruth = 'Sr Ruth Kewa';
  const r = inc ? [
    mkRow({ num: L(1), pos: 1, key: 'edta4#0', c: 'edta4', st: 'Whole blood', tests: [...FBC_M, 'HBA1C'], qty: '4.0', reason: 'Proposed for Full Blood Count, HbA1c', status: [] }),
    mkRow({ num: L(2), pos: 2, key: 'sst#0', c: 'sst', st: 'Serum', tests: [...LFT_M], qty: '5.0', reason: 'Proposed for Liver Function Panel, Creatinine', status: [] }),
    mkRow({ num: L(3), pos: 3, key: 'own:COAG#0', c: 'citrate', st: 'Plasma (citrated)', tests: [...COAG_M], qty: '2.7', reason: COAG_REASON, status: [], coll: { at: '2026-09-25T08:05', by: '' } }),
    mkRow({ num: L(4), pos: 4, key: 'amies#0', c: 'amies', st: 'Swab, wound', tests: ['WCUL'], qty: '1', unit: 'swab', method: 'Swab collection', reason: 'Proposed for Wound Culture', status: [], coll: { at: '2026-09-24T09:30', by: ruth + ' (Tokarara Health Centre)' } }),
    mkRow({ num: L(5), pos: 5, key: 'eswab#0', c: 'eswab', st: 'Swab', tests: ['TCUL'], qty: '1', unit: 'mL', method: 'Swab collection', reason: 'Proposed for Throat Culture', status: [], coll: { at: '2026-09-25T09:58', by: ME_TECH } }),
    mkRow({ num: L(6), pos: 6, key: 'user:6', c: 'pst', st: 'Plasma', tests: [], qty: '4.5', reason: 'Added by you on Enter Order', edited: true, status: [], coll: { at: '2026-09-25T08:05', by: ruth } }),
  ] : [
    mkRow({ num: L(1), pos: 1, key: 'edta4#0', c: 'edta4', st: 'Whole blood', tests: [...FBC_M, 'HBA1C'], qty: '4.0', reason: 'Proposed for Full Blood Count, HbA1c', status: ['Referred'], storage: STORE_PATH + ' > A1', coll: { at: '2026-09-25T08:05', by: ruth }, referTo: REF_LAB_DEFAULT, referred: ['HBA1C'] }),
    mkRow({ num: L(1) + '.1', pos: 1, parent: L(1), c: 'edta4', st: 'Plasma', qty: '1.0', reason: 'Aliquot of ' + L(1), saved: false, status: [] }),
    mkRow({ num: L(2), pos: 2, key: 'sst#0', c: 'sst', st: 'Serum', tests: [...LFT_M, 'CREA'], qty: '5.0', reason: 'Proposed for Liver Function Panel, Creatinine', status: [], storage: STORE_PATH + ' > A2', coll: { at: '2026-09-25T06:00', by: ruth } }),
    mkRow({ num: L(3), pos: 3, key: 'own:COAG#0', c: 'citrate', st: 'Plasma (citrated)', tests: [...COAG_M], qty: '2.7', reason: COAG_REASON, status: [], coll: { at: '2026-09-25T05:40', by: ruth } }),
    mkRow({ num: L(4), pos: 4, key: 'amies#0', c: 'amies', st: 'Swab, wound', tests: ['WCUL'], qty: '1', unit: 'swab', method: 'Swab collection', reason: 'Proposed for Wound Culture', status: [], site: 'lowerleg', side: 'Left', coll: { at: '2026-09-24T09:30', by: ruth + ' (Tokarara Health Centre)' } }),
    mkRow({ num: L(5), pos: 5, key: 'eswab#0', c: 'eswab', st: 'Swab', tests: ['TCUL'], qty: '1', unit: 'mL', method: 'Swab collection', reason: 'Proposed for Throat Culture', status: [], coll: { at: '2026-09-25T09:58', by: ME_TECH } }),
  ];
  const ot = buildOt(inc ? [...PREP_SPEC, 'BCUL'] : PREP_SPEC, true);
  return { rows: r, ot };
}
function Prepare({ go, variant, acc, onSaved, net, stat, cfg, setCfg, psim, setPsim, dash }) {
  const inc = variant === 'incomplete';
  const fresh = !!(dash && dash.fresh && dash.ot);
  const init = useRef(fresh ? { ot: dash.ot.map(e => ({ ...e, saved: true })), rows: reconcile([], dash.ot, LAB).rows } : prepInit(variant)).current;
  const [rows, setRows] = useState(init.rows);
  const [ot, setOt] = useState(init.ot);
  const [hl, setHl] = useState(null);
  const [cmd, setCmd] = useState(null);
  const [note, setNote] = useState(dash && dash.aliquot ? 'Enter Order was saved. Aliquot ' + dash.aliquot + ' before referring it, so the tests not referred stay in the laboratory.' : null);
  const [awNce, setAwNce] = useState(false);
  const [resample, setResample] = useState({});
  const [discard, setDiscard] = useState(false);
  const [sim, setSim] = useState({ consent: false });
  const [consent, setConsent] = useState({ given: '', by: 'Patient', ref: '' });
  const [filt, setFilt] = useState(null);
  const [cancelReq, setCancelReq] = useState(null);
  const [addOn, setAddOn] = useState(false);
  const [testMsg, setTestMsg] = useState(null);
  /* FR-D1, FR-D7: when the order was saved without samples received, the receipt is recorded here */
  const [recAt, setRecAt] = useState(fresh ? '' : RECEIVED);
  const [recBy, setRecBy] = useState(fresh ? ME_TECH : ME_RECEPTION);
  const recEff = recAt || NOW;
  const { saving, pinned, setPinned, run } = useSave(() => ({ down: net }), LAB);
  const lab = useLabels({ rows, setRows, ot, psim, orderSaved: true, me: ME_TECH, cfg, labNo: LAB });
  const existingRefs = inc || fresh ? {} : { HBA1C: 'Already referred to PNGIMR on 25/09/2026' };
  const pre = dash && dash.aliquot ? { panel: { [dash.aliquot]: { type: 'aliquot' } } } : {};
  const patient = fresh ? dash.patient : PATIENTS[0], fac = fresh ? dash.fac : FACS[0], prov = fresh ? dash.prov : PROVS[0];

  const us = usableRows(rows);
  const act = ot.filter(e => !e.cancelled && !(e.up && e.up.on));
  const assigned = new Set(us.flatMap(r => r.tests));
  const unassigned = act.map(e => e.id).filter(t => !assigned.has(t));
  const compatOf = t => us.filter(r => compatible(t, r));
  const choices = unassigned.filter(t => compatOf(t).length >= 2);
  const awaiting = unassigned.filter(t => compatOf(t).length === 0);
  const singles = unassigned.filter(t => compatOf(t).length === 1);

  /* Automatic assignment (FR-D5): exactly one compatible sample */
  useEffect(() => {
    if (!singles.length) return;
    setRows(rs => rs.map(r => { const add = singles.filter(t => compatible(t, r) && !r.voided && !r.gone && !r.status.includes('Rejected')); return add.length ? { ...r, tests: [...r.tests, ...add] } : r; }));
  }, [singles.join(',')]);
  useEffect(() => { if (dash && dash.aliquot) setTimeout(() => { const el = document.getElementById('row-' + dash.aliquot); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100); }, []);

  const pickFilter = k => { setFilt(filt === k ? null : k); setTimeout(() => { const el = document.getElementById(TEST_FILTERS.includes(k) ? 'tbl-tests' : 'tbl-samples'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); };
  const removeEntry = id => { const e = ot.find(x => x.id === id && !x.cancelled); if (!e) return; if (e.saved) { setCancelReq({ kind: 'test', id }); return; } const snap = ot;
    if (e.panels.length) { const next = ot.map(x => x === e ? { ...x, own: false, cancelled: true, removed: { by: ME_TECH, at: NOW.slice(11, 16) } } : x); setOt(next); setRows(rs => rs.map(r => ({ ...r, tests: r.tests.filter(t => t !== id) }))); setTestMsg({ kind: 'info', text: 'Removed ' + tname(id) + ' from ' + P[e.panels[0]].name + '. The panel stays, marked Modified (' + panelCountText(next, e.panels[0]) + ').', undo: () => setOt(snap) }); return; } setOt(ot.filter(x => x !== e)); setRows(rs => rs.map(r => ({ ...r, tests: r.tests.filter(t => t !== id) }))); setTestMsg({ kind: 'info', text: 'Removed ' + tname(id) + '.', undo: () => setOt(snap) }); };
  const dropPanel = pid => {
    const { next, gone } = removePanel(ot, pid);
    if (ot.some(e => gone.includes(e.id) && e.saved)) { setCancelReq({ kind: 'panel', id: pid }); return; }
    const snap = ot; setOt(next); setRows(rs => rs.map(r => ({ ...r, tests: r.tests.filter(t => !gone.includes(t)) })));
    setTestMsg({ kind: 'info', text: 'Removed ' + P[pid].name + ' and ' + gone.length + ' of its tests.', undo: () => setOt(snap) });
  };
  const onCancel = (kind, id, reason) => {
    let ids = [id];
    let next;
    if (kind === 'panel') { const { gone } = removePanel(ot, id); ids = gone; next = ot.map(e => gone.includes(e.id) && !e.cancelled ? { ...e, cancelled: true, cancelReason: reason } : e); }
    else next = ot.map(e => e.id === id && !e.cancelled ? { ...e, cancelled: true, cancelReason: reason, removed: e.panels.length ? { by: ME_TECH, at: NOW.slice(11, 16), reason } : null } : e);
    setOt(next); setRows(rs => rs.map(r => ({ ...r, tests: r.tests.filter(t => !ids.includes(t)) }))); setCancelReq(null);
    setTestMsg({ kind: 'info', text: 'Cancelled ' + (kind === 'panel' ? P[id].name : tname(id)) + '. Reason recorded: ' + reason + '.' });
  };
  const onUpdEntry = (id, patch) => setOt(o => o.map(e => e.id === id && !e.cancelled ? { ...e, ...patch } : e));
  const restoreEntry = id => setOt(o => o.map(x => x.id === id && x.removed && !x.saved ? { ...x, cancelled: false, removed: null } : x));

  /* Required levels (FR-D7) */
  const saveProblems = [];
  const items = [];
  if (sim.consent && !consent.given) items.push({ label: 'Record consent', go: () => flashEl('sec-consent') });
  if (fresh && (!recAt || recAt > NOW)) items.push({ label: 'Received date and time', go: () => flashEl('fld-prep-recat') });
  if (fresh && !recBy) items.push({ label: 'Received by', go: () => flashEl('fld-prep-recby') });
  const prim = rows.filter(r => !r.parent && !r.voided && !r.gone && !r.status.includes('Rejected')).sort((a, b) => a.pos - b.pos);
  prim.forEach(r => {
    const c = effColl(r, cfg, recEff);
    const edit = () => setCmd({ type: 'editColl', num: r.num, t: Date.now() });
    if (!c.by && !c.elsewhere) items.push({ label: 'Collector for ' + r.num, go: edit });
    if (!c.at) items.push({ label: 'Collection date and time for ' + r.num, go: edit });
    else if (c.defaulted) items.push({ label: 'Confirm the time for ' + r.num + ' (defaulted to the received time)', go: () => flashEl('cell-coll-' + r.num, 'button.linkbtn') });
    else if (recAt && c.at > recAt && !c.afterOk) items.push({ label: 'Confirm the time for ' + r.num + ': collection time is after receipt', go: () => flashEl('cell-coll-' + r.num, 'input[type=checkbox]') });
    if (stSite(r.st) === 'Required' && !siteLockOf(r.tests)) {
      const s = SITE[r.site];
      if (!r.site || (s && s.side && !r.side) || (r.site === 'other' && !r.other.trim())) items.push({ label: 'Body site for ' + r.num, go: () => setCmd({ type: 'site', num: r.num, t: Date.now() }) });
    }
    const isParent = rows.some(x => x.parent === r.num && !x.voided && !x.gone);
    if (!r.tests.length && !isParent) { const p = r.num + ' carries no test: assign a test to it or remove it'; saveProblems.push(p); items.push({ label: p, go: () => flashEl('row-' + r.num) }); }
  });
  choices.forEach(t => items.push({ label: 'Choose a sample for ' + tname(t), go: () => flashEl('tsel-' + t, 'button,select') }));
  const last = acc === 'Off';
  const doneState = () => items.length ? 'Entered' : 'Samples prepared';
  const saveGuard = fn => {
    if (saveProblems.length) { setPinned({ kind: 'error', title: 'Nothing was saved', sub: 'Fix these before saving: ' + saveProblems.join('; ') + '. No request was sent.' }); return; }
    fn();
  };
  const addForAwaiting = () => {
    const t = awaiting[0]; const c = T[t].ct.length ? T[t].ct[0].c : 'other';
    setRows(rs => { const max = nextPos(rs); return [...rs, mkRow({ num: LAB + '-' + max, pos: max, key: 'user:' + max, c, st: T[t].st, qty: C[c].vol, reason: 'Added by you for ' + tname(t), edited: true, saved: false, status: [] })]; });
    setNote('Added 1 ' + C[c].short + ' for ' + tname(t) + '. It was assigned automatically as the only compatible sample.');
  };

  return (
    <div>
      <PageHead route={'/order/clinical/collect?id=' + LAB} crumbs={['Home', 'Orders', 'Clinical Orders', 'Prepare Samples']} title={<span>Prepare Samples{stat && <> <Tag c="red" md>STAT</Tag></>}</span>}
        sub={fresh ? 'Order ' + LAB + '. No receipt was recorded on Enter Order: record it above the samples. Tests on top, tubes below; resolve only real choices.' : 'Order ' + LAB + '. Received ' + fmtDT(RECEIVED) + ' by ' + ME_RECEPTION + '. Tests on top, tubes below; resolve only real choices.'} />
      <PreviewControls note="Label file simulations apply to the next print of saved samples. Retry then succeeds."
        items={[
          { label: 'consentRequiredForCollection on (Site Information)', on: sim.consent, set: v => setSim({ ...sim, consent: v }) },
          { label: 'Browser blocks the print window', on: psim.printBlocked, set: v => setPsim(s => ({ ...s, printBlocked: v })) },
          { label: 'Label file cannot be generated', on: psim.printFail, set: v => setPsim(s => ({ ...s, printFail: v })) },
        ]}
        cfgItems={cfgControls(cfg, setCfg, ['labelOverride', 'autoFill', 'gpsCoordinatesEnabled', 'billingRefNumber', 'notifications'])} />
      <NewBlock style={{ padding: '10px 14px 2px' }}>
        <Progress steps={orderSteps(acc, 1, [stDone('10:42'), stCur(items.length), stNot()])} onOpen={s => go(s.screen, { id: LAB })} />
      </NewBlock>
      <SummaryStrip patient={patient} noPat={fresh && !dash.patient} fac={fac} ward={fresh ? dash.ward : 'Medical Ward 3'} prov={prov} stat={stat} ot={ot} rows={rows} received onPick={pickFilter} active={filt} />
      {note && <Notif kind="info" title={note} onClose={() => setNote(null)} style={{ marginTop: 12 }} />}
      {fresh && rows.some(r => !r.saved && !r.gone) && <Notif kind="info" title="Proposed, not yet confirmed" sub="No samples were received with this order, so OpenELIS proposes one sample per container the tests expect. Correct them to what was collected; nothing is saved until you save." style={{ marginTop: 12 }} />}

      <div className="section" id="sec-ordered">
        <div className="sec-h"><h3>Ordered tests</h3><span className="muted">Automatic assignment placed every test that has exactly one compatible sample.</span>
          <div style={{ marginLeft: 'auto' }}><Btn kind="tertiary" onClick={() => setAddOn(!addOn)} aria-expanded={addOn}>{addOn ? 'Close add-on tests' : 'Add tests (add-on)'}</Btn></div>
        </div>
        {addOn && <div style={{ marginBottom: 12 }}><NewBlock><div className="h3" style={{ fontSize: 14 }}>Add-on tests <span className="muted" style={{ fontWeight: 400 }}>Same chooser as Enter Order (FR-D11). New tests go through automatic assignment.</span></div>
          <TestChooser ot={ot} onAdd={next => { const added = activeIds(next).filter(id => !activeIds(ot).includes(id)); setOt(next); setTestMsg({ kind: 'success', text: 'Added ' + joinNames(added, next) + '. ' + (added.every(a => compatOf(a).length === 1) ? 'Assigned automatically.' : 'Check the Sample cell: it may need a choice or a new sample.') }); }} onRemovePanel={dropPanel} onRemoveTest={removeEntry} /></NewBlock></div>}
        <MsgBar msg={testMsg} onClose={() => setTestMsg(null)} />
        {awaiting.length > 0 && (
          <Notif kind="warning" title={'These tests have no sample yet and stay on the order as Awaiting sample: ' + awaiting.map(tname).join(', ') + '.'} sub={awaiting.map(t => tname(t) + ' expects ' + (T[t].ct.length ? C[T[t].ct[0].c].art : 'a sample') + (resample[t] ? '; new sample requested' : '')).join('. ') + '. This does not block saving or continuing.'} style={{ marginBottom: 12 }}>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn kind="secondary" onClick={addForAwaiting}>Add sample</Btn>
              <Btn kind="ghost" onClick={() => setAwNce(!awNce)}>Report non-conformity</Btn>
            </div>
            {awNce && <div style={{ marginTop: 8 }}><NcePanel nums={['(no sample)']} tests={awaiting} title={'Report non-conformity for ' + awaiting.map(tname).join(', ')} prefill={{ category: 'Specimen quality', reason: 'Sample not received with the order', outcome: 'Reject and request a new sample' }} onCancel={() => setAwNce(false)} onApply={() => { const n = { ...resample }; awaiting.forEach(t => { n[t] = true; }); setResample(n); setAwNce(false); }} /></div>}
          </Notif>
        )}
        <OrderedTestsTable mode="prepare" ot={ot} rows={rows} setRows={setRows} cfg={cfg} received filt={filt} onClearFilt={() => setFilt(null)} onRemoveTest={removeEntry} onRemovePanel={dropPanel} onRestoreTest={restoreEntry}
          cancelReq={cancelReq} setCancelReq={setCancelReq} onCancel={onCancel} onUpdEntry={onUpdEntry} existingRefs={existingRefs} patient={patient} prov={prov} fac={fac} onMsg={setTestMsg} />
      </div>

      {sim.consent && (
        <div className="section" id="sec-consent">
          <Fence label="Existing: consent section (shown when consentRequiredForCollection is on)">
            <h3>Consent</h3>
            <div className="grid g3">
              <RadioGroup legend="Consent for collection" required value={consent.given} onChange={v => setConsent({ ...consent, given: v })} options={['Given', 'Refused']} />
              <Select label="Given by" value={consent.by} onChange={v => setConsent({ ...consent, by: v })} options={['Patient', 'Parent or guardian', 'Next of kin']} />
              <TextInput label="Consent form reference" value={consent.ref} onChange={v => setConsent({ ...consent, ref: v })} placeholder="Optional" />
            </div>
            <p className="muted" style={{ marginBottom: 0 }}>Required to complete this step while the Site Information setting is on. Off by default, and then this section does not appear.</p>
          </Fence>
        </div>
      )}

      <div className="section" id="sec-samples">
        <div className="sec-h"><h3>Samples</h3><span className="muted">Collection, body site and storage are columns; labels are in the Labels section below. Holding time counts from collection time.</span></div>
        {fresh && (
          <NewBlock id="sec-receipt" style={{ marginBottom: 12 }}>
            <div className="h3" style={{ fontSize: 14 }}>Receipt <span className="muted" style={{ fontWeight: 400 }}>Enter Order was saved without samples received, so the receipt is recorded here (FR-D1).</span></div>

function volumeParts(r, ot) {
  const minOf = id => { const t = T[id]; const sp = t && t.ct.find(x => x.c === r.c); return sp && sp.min ? parseFloat(sp.min) : 0; };
  const groups = [];
  const used = new Set();
  const pids = panelsOf(ot).filter(pid => ot.some(e => !e.cancelled && e.panels.includes(pid) && r.tests.includes(e.id)));
  pids.forEach(pid => { const mem = r.tests.filter(id => !used.has(id) && ot.some(e => e.id === id && e.panels.includes(pid))); if (mem.length) { mem.forEach(m => used.add(m)); groups.push({ name: P[pid].name, min: Math.max(...mem.map(minOf)) }); } });
  r.tests.filter(id => !used.has(id)).forEach(id => { groups.push({ name: tname(id), min: minOf(id) }); used.add(id); });
  return groups.filter(g => g.min > 0);
}

            <thead><tr><th>Test</th><th>Sample type</th><th>Status</th></tr></thead>
            <tbody>
              {pids.map(pid => {
                const pi = panelInfo(ot, pid);
                return (
                  <React.Fragment key={pid}>
                    <tr className={'grp' + (pi.modified ? ' hl' : '')} id={'acc-panel-' + pid}>
                      <td colSpan={3}>
                        <strong>{P[pid].name}, {pi.modified ? pi.on + ' of ' + pi.total + ' tests' : pi.total + ' tests'}</strong> <Tag c="gray">Panel</Tag>{pi.modified && <> <Tag c="warm-gray">Modified</Tag> <span style={{ fontSize: 12 }}>{pi.removed.map(e => T[e.id].code).join(', ')} removed at entry. Check the change is intended before releasing.</span></>}
                      </td>
                    </tr>
                    {P[pid].members.map(m => memberRow(m, ot.find(e => e.id === m && e.panels.includes(pid)), pid + m, pi.modified))}
                  </React.Fragment>
                );
              })}
              {solo.length > 0 && <tr className="grp"><td colSpan={3}><strong>Individual tests</strong></td></tr>}
              {solo.map(e => memberRow(e.id, e, 'solo' + e.id))}
            </tbody>
          </table>
        </div>
      </NewBlock>
    </div>
