function DomainSwitch({ current, mode = 'new', kept, cleared, onGo, labNo }) {
  const [pending, setPending] = useState(null);
  const [note, setNote] = useState(null);
  const [noVec, setNoVec] = useState(DS_STATE.noVector);
  const [clean, setClean] = useState(DS_STATE.clean);
  const btns = useRef([]);
  const cur = DOMAINS.find(d => d.k === current);
  if (mode === 'saved') return (
    <div className="ds-row ds-saved">
      <span className="ds-lab">Order type</span>
      <Tag c="cool-gray" md tip="The order type is fixed once the order is saved. To change it, cancel the order and enter it again.">{cur.l}</Tag>
      <span className="chip-new">new</span>
      <span className="muted ds-hint">Fixed at first save (FR-A21). Wrong domain: cancel with "Registered in the wrong domain" and enter again.</span>
    </div>
  );
  const avail = DOMAINS.filter(d => !(noVec && d.k === 'vector') || d.k === current);
  const route = d => d.route + (mode === 'dashboard' ? '' : '/enter');
  const go = d => {
    setPending(null);
    if (onGo && onGo(d.k)) return;
    setNote('Opens ' + route(d) + (mode === 'dashboard' ? '' : ', keeping lab number ' + labNo) + '. The ' + d.l.toLowerCase() + ' form is drawn in its own preview.');
  };
  const pick = d => {
    if (d.k === current || mode === 'eorder') return;
    if (mode === 'dashboard' || clean) go(d); else setPending(d);

    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();

      <Checkbox label="No active vector tests in the catalog (FR-A18)" checked={noVec} onChange={v => { DS_STATE.noVector = v; setNoVec(v); }} />
    </div>
  );
  return (
    <NewBlock style={{ padding: '10px 14px', margin: '4px 0 12px' }}>
      <div className="ds-row">
        <span className="ds-lab" id={'ds-lab-' + current}>Order type</span>

                title={off ? 'Electronic orders keep the order type they arrived with.' : undefined}
                ref={el => { btns.current[i] = el; }} onKeyDown={e => onKey(e, i)} onClick={() => pick(d)}
                className={'cds--content-switcher-btn' + (on ? ' cds--content-switcher--selected' : '')}>
                <span className="cds--content-switcher__label">{d.l}</span>
              </button>
            );
          })}
        </div>
        <span className="muted ds-hint">SideNav: one <strong>Add Order</strong> item replaces Add Clinical, Add Environmental and Add Vector Order. Opens on the domain you last used.</span>
      </div>
      {avail.length < 2 && <Annot>With only one domain in the catalog, no switcher is shown and the page looks as it does today (FR-A18). Drawn here so the state can be reviewed.</Annot>}
      {note && <Notif kind="info" title={note} onClose={() => setNote(null)} style={{ marginTop: 8 }} />}
      {pv}
      <Modal open={!!pending} title={pending ? 'Switch to ' + pending.l + '?' : ''} primary="Switch" onClose={() => setPending(null)} onPrimary={() => go(pending)}>
        <p style={{ margin: '0 0 8px' }}><strong>Kept:</strong> {kept}</p>
        <p style={{ margin: '0 0 8px' }}><strong>Cleared:</strong> {cleared}</p>

      stop();

      if (s.down) { setPinned(unreachable(fn, cont)); return; }
      setPinned({ kind: 'success', title: 'Order ' + (labNo || LAB) + ' saved', sub: 'The first save had reached the server. Retry returned that result; no second order or sample was created.', actions: cont ? [{ label: cont, go: fn }] : [] });
    }, 700);
  };
  const run = (fn, cont) => {
    if (busy.current) return;
    start();
    const s = (getSim && getSim()) || {};
    setTimeout(() => {
      stop();
      if (s.down) { setPinned(unreachable(fn, cont)); return; }
      if (s.lost) { setPinned({ kind: 'warning', title: 'We could not confirm the save. Retry to check.', sub: 'The connection dropped before the server answered. Your entries are still here.', actions: [{ label: 'Retry', go: () => confirmSaved(fn, cont) }] }); return; }

const minsBetween = (a, b) => (Date.parse(b + ':00Z') - Date.parse(a + ':00Z')) / 60000;
const fmtDur = m => { m = Math.round(m); if (m >= 2880) return Math.floor(m / 1440) + ' days'; const h = Math.floor(m / 60), mm = m % 60; return h ? h + ' h ' + mm + ' min' : mm + ' min'; };
const fmtLim = h => h >= 48 ? (h / 24) + ' days' : h < 1 ? Math.round(h * 60) + ' min' : h + ' h';

/* Hold (EV-F1, EV-F2): counted from collection, shortest remaining among the row's tests */
function holdOf(tests, at) {
  const hs = tests.filter(t => ET[t] && ET[t].hold);
  if (!hs.length) return null;
  if (!at) return { needs: true };
  const all = hs.map(t => ({ t, lim: ET[t].hold, left: ET[t].hold * 60 - minsBetween(at, NOW) })).sort((a, b) => a.left - b.left);
  const m = all[0];
  return { ...m, all, exceeded: m.left <= 0, near: m.left > 0 && m.left < m.lim * 60 * 0.25 };
}

/* Time to test (EV-F1 to EV-F3): shortest time left, counted from collection (the end for a composite) */
const HOLD_OPTS = [{ v: '', l: 'Choose what to do', disabled: true }, { v: 'Proceed', l: 'Proceed (needs the customer instruction)' }, { v: 'Reject test', l: 'Reject the test (non-conformity)' }, { v: 'Ask for new sample', l: 'Ask for a new sample' }];
function HoldCell({ row, h, choice, onChoose, ro, awaiting, onInstr }) {
  if (!h) return <span className="muted cc">No limit</span>;
  if (h.needs) return <Tag c="warm-gray" warn>Needs collection time</Tag>;
  const from = row.kind === 'Composite' ? 'Counted from collection end.' : 'Counted from collection.';
  const tip = h.all.map(x => ET[x.t].name + ': ' + (x.left > 0 ? fmtDur(x.left) + ' left' : 'exceeded') + ' of ' + fmtLim(x.lim)).join('; ') + '. ' + from;
  if (h.exceeded) return (
    <div style={{ width: 100 }} id={'hold-' + row.num} className="cc">
      <Tag c="red" tip={tip}>Holding time exceeded</Tag>
      <div className="muted" style={{ marginTop: 2 }}>{ET[h.t].name}, limit {fmtLim(h.lim)}</div>
      {!ro && <div style={{ marginTop: 2 }}><Select cell label={'What to do with ' + ET[h.t].name + ' on ' + row.num} value={choice || ''} onChange={v => v && onChoose(v)} options={HOLD_OPTS} /></div>}
      {choice === 'Proceed' && awaiting && <div style={{ marginTop: 2 }}><button type="button" className="linkbtn" style={{ fontSize: 12 }} onClick={onInstr}>Record the customer instruction</button></div>}
      {choice && choice !== 'Proceed' && <div style={{ marginTop: 2 }}><Tag c="red">{choice === 'Reject test' ? 'Test rejected' : 'New sample requested'}</Tag></div>}
    </div>
  );
  return <div data-tip={tip} tabIndex={0} className="cc" style={{ width: 96 }}>
    {h.near ? <Tag c="warm-gray" warn>{fmtDur(h.left)} left, {ET[h.t].name}</Tag> : <><div style={{ whiteSpace: 'nowrap' }}>{I.time} {fmtDur(h.left)} left,</div><div className="muted">{ET[h.t].name}</div></>}
    {row.kind === 'Composite' && <div className="muted">From the end</div>}
  </div>;
}

/* Condition on receipt (EV-E1 to EV-E3, EV-H8). A shared component: no domain wording inside. */
const THERMS = [
  { v: 'IR-02', l: 'IR-02, infrared', meta: 'calibrated, due 03/2027' },
  { v: 'IR-03', l: 'IR-03, infrared', meta: 'calibration overdue', overdue: '14 Aug 2026' },
  { v: 'Probe TP-11', l: 'Probe TP-11', meta: 'calibrated, due 11/2026' },
];
const THERM_BY = Object.fromEntries(THERMS.map(t => [t.v, t]));
const shipOut = s => { const t = parseFloat(s.temp); return s.temp !== '' && !isNaN(t) && (t < s.min || t > s.max); };
const outWords = s => { const t = parseFloat(s.temp); return 'Received at ' + s.temp + ' °C, ' + (t > s.max ? 'above ' + s.max : 'below ' + s.min) + ' °C'; };
const qualT = s => 'T: ' + outWords(s);
const QUAL_H = 'H: Received outside holding time';
const QUAL_C = 'C: Chain-of-custody discrepancy';
function ReceiptPanel({ ships, setShips, rowsOf, affected, cooling, nceDone, instrDone, onNce, onInstr, domain, biosafety }) {
  const vec = domain === 'vector';
  const upd = (i, o) => setShips(ss => ss.map((s, j) => j === i ? { ...s, ...o } : s));
  const okOf = s => s.temp !== '' && !shipOut(s) && s.seals === 'Intact' && s.intact === 'Yes' && !(THERM_BY[s.therm] || {}).overdue;
  const [open, setOpen] = useState(() => ships.map(s => !okOf(s)));
  const setO = (i, v) => setOpen(o => ships.map((_, j) => j === i ? v : (o[j] != null ? o[j] : true)));
  return (
    <div>
      {biosafety && <Notif kind="warning" title={'Biosafety: ' + biosafety.text} sub={biosafety.from} style={{ marginBottom: 12 }} />}
      <div className="grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(420px, 1fr))', alignItems: 'start' }}>
        {ships.map((s, i) => {
          const out = !vec && shipOut(s);
          const mine = rowsOf(i + 1);
          const aff = affected ? affected(i) : [];
          const cool = cooling ? cooling(i) : [];
          const th = THERM_BY[s.therm];
          const ok = okOf(s);
          const coolant = s.ice === 'Yes' ? (vec ? 'on dry ice' : 'on ice') : s.ice === 'No' ? 'no coolant' : 'coolant not required';
          if (ok && open[i] === false) return (
            <div key={i} className="card" id={'ship-' + (i + 1)} style={{ borderLeft: '3px solid #198038' }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <CIcon n="CheckmarkFilled" size={16} style={{ fill: '#198038' }} />
                <strong style={{ fontSize: 14 }} className="ship-line">Shipment {i + 1}, {s.temp} °C, {coolant}, seals {s.seals.toLowerCase()}</strong>
                <Tag c="green">{vec ? 'Frozen, OK' : 'In range'}</Tag>
                <Btn kind="ghost" style={{ marginLeft: 'auto' }} aria-label={'Show details for Shipment ' + (i + 1)} onClick={() => setO(i, true)}>Show details</Btn>
              </div>
              <div className="muted" style={{ marginTop: 2 }}>{s.kind}. Thermometer {s.therm}. {mine.length} rows. Collapsed because every value is in range; it opens by itself when anything is not.</div>
            </div>
          );
          return (
            <div key={i} className="card" id={'ship-' + (i + 1)} style={{ borderLeft: out ? '3px solid #da1e28' : '3px solid #198038' }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 8, flexWrap: 'wrap' }}>
                <strong>Shipment {i + 1}</strong><span className="muted">{s.kind}</span>
                {out ? <Tag c="red" warn>Out of range</Tag> : <Tag c="green">{vec ? 'Frozen, OK' : 'In range'}</Tag>}
                {ok && <Btn kind="ghost" style={{ marginLeft: 'auto' }} onClick={() => setO(i, false)}>Collapse</Btn>}
              </div>
              <div className="grid g3">
                <TextInput label="Temperature on receipt (°C)" required value={s.temp} onChange={v => upd(i, { temp: v })} invalid={s.temp === ''} invalidText="Required to finish" warn={out} warnText={out ? outWords(s) : ''} helper={vec ? 'Acceptable: frozen (dry ice)' : 'Acceptable: ' + s.min + ' to ' + s.max + ' °C (from Sample Type settings)'} />
                <div>
                  <Select label="Thermometer" newMark value={s.therm} onChange={v => upd(i, { therm: v })} options={THERMS.map(t => ({ v: t.v, l: t.l + ' (' + t.meta + ')' }))} helper={th && th.overdue ? null : 'From the equipment list'} />
                  {th && th.overdue && <div className="warn-text" role="status"><CIcon n="WarningAlt" size={12} style={{ verticalAlign: '-1px', marginRight: 4 }} />Calibration overdue since {th.overdue}</div>}
                </div>
                <Select label="Ice or coolant present" value={s.ice} onChange={v => upd(i, { ice: v })} options={['Yes', 'No', 'Not required']} />
                <Select label="Custody seals" value={s.seals} onChange={v => upd(i, { seals: v })} options={['Intact', 'Broken', 'None']} />

/* A grid cell that is plain text until focused; typing opens an inline typeahead (EV-D9). Enter commits and moves down. */
function TypeCell({ value, display, options, onCommit, ariaLabel, col, ri, free, placeholder, invalid, width, title, parse }) {
  const [q, setQ] = useState(null);
  const [hi, setHi] = useState(0);
  const opts = (options || []).map(o => typeof o === 'string' ? { v: o, l: o } : o);
  const shown = q == null ? '' : q;
  const qq = shown.trim().toLowerCase();
  const hits = q == null ? [] : opts.filter(o => !qq || (o.l + ' ' + (o.meta || '')).toLowerCase().includes(qq)).slice(0, 8);
  const cur = opts.find(o => o.v === value);
  const text = display != null ? display : cur ? cur.l : (value || '');
  const moveDown = () => { const el = document.querySelector('[data-col="' + col + '"][data-ri="' + (ri + 1) + '"]'); if (el) el.focus(); };
  const commit = o => { onCommit(o); setQ(null); };
  const onKey = e => {
    if (e.key === 'Escape') { setQ(null); e.currentTarget.blur(); return; }
    if (e.key === 'ArrowDown' && q != null) { e.preventDefault(); setHi(Math.min(hi + 1, hits.length - 1)); return; }
    if (e.key === 'ArrowUp' && q != null) { e.preventDefault(); setHi(Math.max(hi - 1, 0)); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (q != null) {
        if (hits[hi]) commit(hits[hi]);
        else if (free && q.trim()) { const p = parse ? parse(q.trim()) : q.trim(); if (p != null) commit({ v: p, l: q.trim(), free: true }); else setQ(null); }
        else setQ(null);
      }
      moveDown();
    }
  };
  return (
    <span className="tc" style={{ width: width || '100%' }} title={q == null ? (title || text) : undefined}>
      <input className={'tc-in' + (invalid && q == null ? ' tc-bad' : '')} aria-label={ariaLabel} data-col={col} data-ri={ri} value={q == null ? text : q} placeholder={placeholder}
        onFocus={e => e.target.select()} onChange={e => { setQ(e.target.value); setHi(0); }} onKeyDown={onKey}
        onBlur={() => setTimeout(() => setQ(null), 150)} role="combobox" aria-expanded={q != null && hits.length > 0} aria-autocomplete="list" />
      {q != null && (hits.length > 0 || free) && (
        <span className="tc-list" role="listbox" aria-label={ariaLabel + ' options'}>
          {hits.map((o, i) => <React.Fragment key={o.v}>{o.grp && (i === 0 || hits[i - 1].grp !== o.grp) && <span className="res-grp" role="presentation" style={{ display: 'block' }}>{o.grp}</span>}
            <button type="button" role="option" aria-selected={i === hi} className={'tc-opt' + (i === hi ? ' on' : '')} onMouseDown={e => e.preventDefault()} onClick={() => commit(o)}><span>{o.l}</span>{o.meta && <span className="muted">{o.meta}</span>}</button></React.Fragment>)}
          {!hits.length && free && <span className="tc-opt muted" style={{ display: 'block' }}>Enter to use "{shown.trim()}"</span>}
        </span>
      )}
    </span>
  );
}

          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}><Btn onClick={applyPaste}>Paste {paste.rows.length} rows</Btn><Btn kind="ghost" onClick={() => setPaste(null)}>Cancel</Btn></div>

        <div className="cds--data-table-container etbl-wrap">
          <table className="cds--data-table cds--data-table--sm stbl etbl ctbl" style={{ '--th-top': (77 + tbH) + 'px' }} aria-label={'Samples for ' + ENV_LAB}>
            <colgroup>{colW.map((w, i) => <col key={i} style={{ width: w }} />)}</colgroup>
            <thead><tr>
              <th><Checkbox label="Select all samples" hideLabel checked={sel.length > 0 && sel.length === live.length} onChange={v => setSel(v ? live.map(rid) : [])} /></th>

            </tr></thead>
            <tbody>
              {!live.length && <tr><td colSpan={cols} style={{ padding: 16 }}>No rows with problems. <button type="button" className="linkbtn" onClick={() => setProbOnly(false)}>Show all rows</button></td></tr>}
              {live.map((r, ri) => renderRow(r, ri))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="section cmp" id="sec-receipt">
        <SecHead n="5" title="Receipt condition"><InfoTip text="Measured values only. Temperature is needed for a shipment that holds a row whose sample type has a receipt range. A problem shows once, on its row." /></SecHead>
        <ReceiptRows ships={shipsX} setShips={setShips} vec={false} needsTemp={needsTemp} rowsOf={n => received.filter(r => r.ship === n).map(r => r.num)} />
      </div>

      <div className="section cmp" id="sec-labels">
        <SecHead n="6" title="Labels" />
        <LabelsBlock rows={received} presets={[{ name: 'Sample label', short: 'sample', size: '50 × 25 mm', max: 4, def: r => 2 }, { name: 'Order label', short: 'order', size: '50 × 25 mm', max: 2, def: r => ['-1', '-3', '-6'].includes(sfxOf(r.num)) ? 2 : 0 }]}
          mock={<LabelMock num={ENV_LAB + '-1.1'} qc="QC Duplicate" fid="BTL-02" site="ERI-02" date="26/09/2026 07:40" />} />
      </div>

      <div className="section cmp" id="sec-att">
        <SecHead n="7" title="Attachments" />
        <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-end' }}>
          <div className="rc-line"><CIcon n="Document" size={16} /><span>chain-of-custody-PMWA-0917.pdf</span><Tag c="blue">Pending save</Tag><button type="button" className="linkbtn">Add a file</button></div>
          <span style={{ fontSize: 13 }}>Receiver: {ME} (recorded when you save)</span>
          <select className="cds--select-input cell-select" style={{ width: 280 }} aria-label="Chain-of-custody signed by receiver" value={cocSigned} onChange={e => setCocSigned(e.target.value)}><option value="Yes">Chain-of-custody signed by receiver: Yes</option><option value="No">Chain-of-custody signed by receiver: No</option></select>
        </div>
      </div>

      <Footer missing={items.length} noReason nextLabel="Save and next" saving={saving} pinned={pinned} onPin={setPinned}
        extra={<StickyChecklist items={items} note={heldTests ? <>{heldTests} tests held for a customer instruction; the order can still complete. <button type="button" className="linkbtn" onClick={() => openInstr(heldRows)}>Record instruction</button></> : null} />}
        onDiscard={() => setDiscard(true)}
        onExit={() => run(() => setPinned({ kind: 'success', title: 'Order ' + ENV_LAB + ' saved as Entered', sub: 'Everything on the page was saved in one transaction.' }))}
        onNext={() => run(() => go(4))} />
      {panel && <InstrPanel applies={panel} contact="Kila Vagi (Port Moresby Water Authority)" onClose={() => setPanel(null)} onRecord={recordInstr} />}
      <Toast t={toast} onClose={() => setToast(null)} />
      <Modal open={discard} title="Discard unsaved changes?" primary="Discard changes" danger onClose={() => setDiscard(false)} onPrimary={() => { setDiscard(false); setRows(envRows0()); }}>
        Everything entered on this page since the last save will be lost.
      </Modal>
    </div>
  );
}

};
function EvDashboard({ go }) {
  const [domain, setDomain] = useState('environmental');
  const [orders, setOrders] = useState(EV_ORDERS);
  const [filter, setFilter] = useState(null);
  const [showCancelled, setShowCancelled] = useState(false);
  const [cancelFor, setCancelFor] = useState(null);
  const [reasonSel, setReasonSel] = useState('');
  const [reasonTxt, setReasonTxt] = useState('');
  const [note, setNote] = useState(null);
  const [q, setQ] = useState('');
  const vec = domain === 'vector';
  const list0 = orders[domain];
  const live = o => o.status !== 'Cancelled';
  const cnt = k => list0.filter(o => live(o) && o.flags.includes(k)).length;
  const list = list0.filter(o => (showCancelled || live(o)) && (!filter || (live(o) && o.flags.includes(filter))) && (!q.trim() || [o.lab, o.req, o.ref, o.site].some(x => x.toLowerCase().includes(q.trim().toLowerCase()))));
  const base = vec ? '/order/vector' : '/order/environmental';
  const stepRoute = o => base + (o.open === 2 || o.open === 5 ? '/enter' : '/qa') + '?id=' + o.lab;
  const switchTo = k => {
    if (k === 'clinical') { setNote({ kind: 'info', text: 'Clinical opens the clinical order dashboard at /order/clinical. It is drawn in the clinical preview; this preview stays on environmental and vector.' }); return true; }
    setDomain(k); setFilter(null); setCancelFor(null); setNote(null); return true;
  };
  const confirmCancel = o => {
    setOrders(os => ({ ...os, [domain]: os[domain].map(x => x.lab === o.lab ? { ...x, status: 'Cancelled', flags: [], cancelReason: reasonSel + (reasonTxt ? ': ' + reasonTxt : '') } : x) }));
    setNote({ kind: 'success', text: 'Order ' + o.lab + ' cancelled. Its ' + o.t + ' tests are marked Cancelled and its ' + o.n + (vec ? ' catches and pools, with their organisms,' : ' samples') + ' voided, with your reason. Nothing was deleted.' });
    setCancelFor(null); setReasonSel(''); setReasonTxt('');
  };
  const nCols = vec ? 9 : 10;
  return (
    <div>
      <PageHead route={base} crumbs={['Home', 'Orders', vec ? 'Vector Orders' : 'Environmental Orders']}
        domainSwitch={<DomainSwitch key={domain} current={domain} mode="dashboard" onGo={switchTo} />}
        title={vec ? 'Vector Orders' : 'Environmental Orders'} sub={'Central Public Health Laboratory (CPHL), Port Moresby. ' + (vec ? 'Catches and pools received this week.' : 'Orders entered in the last two days.')}
        actions={<Btn size="md" onClick={() => go(vec ? 5 : 2)}>New order {I.add}</Btn>} />

      <NewBlock style={{ marginBottom: 16 }}>
        <div className="h3" style={{ fontSize: 14, marginBottom: 8 }}>Quick filters</div>
        <div className="tagset" style={{ gap: 8 }}>
          {EV_FILTERS[domain].map(([k, l]) => (

            Show cancelled <strong style={{ marginLeft: 6 }}>{list0.filter(o => !live(o)).length}</strong>
          </button>
        </div>
        <div className="muted" style={{ marginTop: 8 }}>{vec ? '"Awaiting sample check" appears while sampleAcceptCheck.vector is Mandatory or Optional.' : '"Has held tests" lists orders with tests On hold: awaiting customer instruction (EV-A7); the rest of those orders goes ahead. "Holding time short or exceeded" uses the shortest time to test on the order.'} "Has referred tests" follows the referral record, so an order split between this laboratory and a referral laboratory stays under it while the referral is open.</div>

                  <td>{o.n}</td>

                {cancelFor === o.lab && (
                  <tr className="exp-row"><td colSpan={nCols}>
                    <NewBlock>
                      <div className="h3" style={{ fontSize: 14 }}>Cancel order {o.lab} ({o.req})</div>
                      <div className="grid g2">
                        <Select label="Reason for cancelling" required value={reasonSel} onChange={setReasonSel} options={[{ v: '', l: 'Choose a reason' }, 'Duplicate order', 'Entered in error', 'Registered in the wrong domain', 'Requester withdrew the request', 'Other']} />
                        <TextInput label="Details" required={reasonSel === 'Other'} value={reasonTxt} onChange={setReasonTxt} placeholder="Optional unless Other" />
                      </div>
                      <p className="muted" style={{ marginTop: 8 }}>The order and its tests are marked Cancelled and its {vec ? 'catches, pools and organisms' : 'samples'} voided with the same reason. Nothing is deleted.</p>

                        <Btn kind="ghost" onClick={() => setCancelFor(null)}>Keep order</Btn>
                      </div>
                    </NewBlock>
                  </td></tr>
                )}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>

                  <div style={{ display: 'flex', gap: 8 }}>

        <Btn kind="ghost" onClick={() => go(2)}>Back to Enter Order</Btn>

    </div>
  );

      <div className="section cmp">
        <SecHead n="6" title="Labels" />

          mock={<LabelMock num={VEC_LAB + '-1'} lines={['Catch, not yet sorted, 25 mosquitoes', 'Field ID MOS-2026-113', 'Biosafety: open in the biosafety cabinet']} />} />
      </div>
      <div className="section cmp"><SecHead n="7" title="Attachments" /><div className="rc-line"><CIcon n="Document" size={16} /><span>submission-form-W39-gerehu-waigani.pdf</span><Tag c="blue">Pending save</Tag><button type="button" className="linkbtn">Add a file</button></div></div>
      <Footer missing={items.length} noReason nextLabel="Save and next" saving={saving} pinned={pinned} onPin={setPinned} extra={<StickyChecklist items={items} />} onDiscard={() => setRows(vecRows0())}
        onExit={() => run(() => setPinned({ kind: 'success', title: 'Order ' + VEC_LAB + ' saved as Entered', sub: 'The catches, sorted pools and their organisms were saved in one transaction.' }))}
        onNext={() => run(() => go(6))} />
      <Toast t={toast} onClose={() => setToast(null)} />
    </div>
  );
}

      ['26VEC00031', '26VEC00031-4', 'MOS-2026-116', 'Hohola market, trap 2', 'HOH-02', 'Sorted pool', 'Mosquito', 'Culex quinquefasciatus', 'Female', 'Unfed', '62', '26VEC00031-P03', '62', '24/09/2026 19:00', 'Japanese encephalitis virus RT-PCR', 'Not detected', '']] },

function Reports() {

  const p = PRESET_DEFS[pick];
  return (
    <div>
      <PageHead route="/reports/customDataExport" crumbs={['Home', 'Reports', 'Custom Data Export']} title="Custom Data Export" sub="Saved report definitions. Two presets for regulatory reporting ship with the distribution." />

          <div className="lbl">Columns</div>
          <div className="tagset" style={{ marginBottom: 12 }}>{p.cols.map(c => <Tag key={c} c="gray">{c}</Tag>)}</div>

/* ============================== App shell ============================== */
const SCREENS = [
  { n: 1, g: 'Orders', label: 'Environmental and vector dashboard', route: '/order/environmental', user: 'Mary Kila (Reception)' },
  { n: 2, g: 'Environmental', label: 'Enter Order', route: '/order/environmental/enter', user: 'Mary Kila (Reception)' },
  { n: 3, label: 'New sampling site flow', route: '/order/environmental/enter', user: 'Mary Kila (Reception)' },
  { n: 4, label: 'Sample check (optional step)', route: '/order/environmental/qa?id=' + ENV_LAB, user: 'John Wari (Sample Receiver)' },
  { n: 5, g: 'Vector', label: 'Enter Order', route: '/order/vector/enter', user: 'Mary Kila (Reception)' },
  { n: 6, label: 'Sample check (optional step)', route: '/order/vector/qa?id=' + VEC_LAB, user: 'John Wari (Sample Receiver)' },
  { n: 7, g: 'Reports', label: 'Custom Data Export presets', route: '/reports/customDataExport', user: 'Grace Pokana (Laboratory manager)' },
];
function ScopePanel() {
  return (
    <div className="legend" id="scope-panel">
      <div style={{ fontWeight: 600, marginBottom: 8 }}>MVP vs phase 2</div>
      <div style={{ fontSize: 12, marginBottom: 6 }}><strong>MVP (this preview):</strong> dashboard with the domain switcher, one Enter Order step plus optional Sample check, site search and create in the save, sampling sites and locations, submitted objects, field ID, grab or composite, condition on receipt with the equipment list, customer instruction, chain-of-custody reconciliation, holding time per test, qualifiers, field QC rows, sample purpose, catches and sorted pools, two export presets, and <strong>fast batch entry</strong> (Copy row, Fill down, paste from a spreadsheet, scan to add, Rows with problems; EV-D9, C-12).</div>
      <div style={{ fontSize: 12 }}><strong>Phase 2:</strong></div>
      <ul style={{ fontSize: 12, margin: '4px 0 0 16px', listStyle: 'disc' }}>
        <li>Container Types picker in the Container column (today: the "Sample Container" dictionary; preservative per container)</li>
      </ul>
      <div className="muted" style={{ marginTop: 6 }}>While this panel is open, the tables show where the phase 2 control will sit.</div>
    </div>
  );
}
function App() {
  const [screen, setScreen] = useState(1);
  const [nonce, setNonce] = useState(0);
  const [phase2, setPhase2] = useState(false);
  const go = s => { setScreen(s); setNonce(n => n + 1); window.scrollTo(0, 0); };
  const meta = SCREENS[screen - 1];
  let body;
  if (screen === 1) body = <EvDashboard go={go} />;
  if (screen === 2) body = <EnvEnter go={go} phase2={phase2} />;
  if (screen === 3) body = <EnvNewSite go={go} />;
  if (screen === 4) body = <SampleCheckScreen go={go} domain="environmental" />;
  if (screen === 5) body = <VecEnter go={go} phase2={phase2} />;
  if (screen === 6) body = <SampleCheckScreen go={go} domain="vector" />;
  if (screen === 7) body = <Reports />;
  return (
    <div>
      <div className="pv-banner"><span>Visual Preview: Environmental and Vector Order Entry v4 (FRS v0.3) | OpenELIS Design Mockup | Not a live application</span><span>Screen {screen}: {meta.route}</span></div>
      <header className="app-header">
        <div className="brand">OpenELIS Global <span>| Central Public Health Laboratory (CPHL), Port Moresby</span></div>
        <div className="right"><span>Orders &amp; Patients</span><span>Signed in: {meta.user}</span></div>
      </header>
      <div className="shell">
        <aside className="rail" aria-label="Preview navigation">
          <h4>Preview navigation (not part of the product)</h4>
          {SCREENS.map(s => (
            <React.Fragment key={s.n}>
              {s.g && <div className="grp">{s.g}</div>}
              <button type="button" className={'nav-item' + (s.n === screen ? ' active' : '')} onClick={() => go(s.n)}><span className="num">{s.n}</span><span>{s.label}</span></button>
            </React.Fragment>
          ))}
          <div style={{ margin: '12px 16px 0' }}><Switch sm checked={phase2} onChange={setPhase2} label="MVP vs phase 2 note" /></div>
          {phase2 && <ScopePanel />}
          <div className="legend">
            <div style={{ fontWeight: 600, marginBottom: 8 }}>Legend</div>
            <div className="row"><span style={{ width: 28, height: 18, borderLeft: '3px solid #0f62fe', background: '#edf5ff', flex: 'none' }}></span><span>Blue left border and tint, plus a <span className="chip-new">new</span> chip: what this design adds.</span></div>
            <div className="row"><span style={{ width: 24, height: 16, border: '2px dashed #8d8d8d', flex: 'none' }}></span><span>"Existing component, reuse" fence: shipped UI, abbreviated.</span></div>
            <div className="row"><span style={{ width: 24, height: 16, border: '1px dashed #b28600', background: '#fffbeb', flex: 'none' }}></span><span>Preview controls and notes. Not product UI.</span></div>
            <div className="muted">Shared rules (footer, checklist, numbering, one save) come from Clinical Order Entry v4.</div>
          </div>
        </aside>
        <main className="main" key={screen + '-' + nonce}>{body}</main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
