        ]);
        // remove valid rows from preview, leave mismatches behind
        setCsvPreview(p => ({ ...p, rows: p.rows.filter(r => r.status !== 'VALID') }));
      };
      const reconcileCsvRow = (rowId, field, value) => {
        setCsvPreview(p => ({ ...p, rows: p.rows.map(r => r.row === rowId
          ? { ...r, [field]:value, status:'VALID', mismatchField:null }
          : r) }));
      };
      const addManifestRow = () => {
        setSampleRowsManifest(prev => [...prev, {
          id:`m-${Date.now()}`, sampleType:'', container:'', gps:'', loc:'', addr:'', dt:'', notes:'',
        }]);
      };
      // 2026-05-01 (later same day): add N rows of a suggested sample type from regulation suggestions
      const [suggestQty, setSuggestQty] = useState({});  // { sampleTypeId: number }
      const addSuggestedRows = (sampleType, qty) => {
        if (qty <= 0) return;
        setSampleRowsManifest(prev => {
          const next = [...prev];
          for (let k = 0; k < qty; k++) {
            next.push({
              id:`m-${Date.now()}-${k}`,
              sampleType:sampleType.name, container:'', gps:'', loc:'', addr:'', dt:'', notes:'',
            });
          }
          return next;
        });
        setSuggestQty(prev => ({ ...prev, [sampleType.id]:0 }));
      };
      // Suggestions = deduped union of selected regulations' applicable sample types.
      const regulationSuggestions = useMemo(() => {
        if (branch !== 'REGULATION_DRIVEN' || standards.length === 0) return [];
        const ids = new Set();
        const out = [];
        standards.forEach(s => (s.sampleTypeIds || []).forEach(stId => {
          if (ids.has(stId)) return;
          ids.add(stId);
          const st = ALL_SAMPLE_TYPES.find(x => x.id === stId);
          if (!st) return;
          const coveringStds = standards.filter(x => (x.sampleTypeIds || []).includes(stId));
          out.push({ ...st, coveringStds });
        }));
        return out;
      }, [branch, standards]);
      const updateManifestRow = (id, p) => {
        setSampleRowsManifest(rows => rows.map(r => r.id === id ? { ...r, ...p } : r));
      };
      const removeManifestRow = (id) => {
        setSampleRowsManifest(rows => rows.filter(r => r.id !== id));
      };

      const [collMethod, setCollMethod] = useState('');
      const [waterT, setWaterT] = useState('');
      const [ambientT, setAmbientT] = useState('');
      const [weather, setWeather] = useState('');
      const [preserv, setPreserv] = useState('');
      const [notes, setNotes] = useState('');

      const [sampleRows, setSampleRows] = useState([]);
      const [bulkStorage, setBulkStorage] = useState('');

      const [qcSamples, setQcSamples] = useState([]);
      const [nces, setNces] = useState({});

      // ── Branch handlers ──
      const pickBranch = (b) => {
        if (branch && branch !== b && (standards.length || manifest.length || adhocRegRef)) {
          setShowSwitch({ from: branch, to: b });
          return;
        }
        setBranch(b);
      };
      const confirmSwitch = () => {
        setBranch(showSwitch.to);
        setStandards([]);
        setManifest([]);
        setAdhocRegRef('');
        setDeselected(new Set());
        setShowSwitch(null);
      };

      // ── Standard handlers — 2026-04-28: M:N multi-regulation ──
      const recomputeManifest = (currentStds) => {
        if (currentStds.length === 0) { setManifest([]); return; }
        const coverageMap = new Map();
        currentStds.forEach(std => std.sampleTypeIds.forEach(id => {
          if (!coverageMap.has(id)) coverageMap.set(id, []);
          coverageMap.get(id).push(std.id);
        }));
        setManifest(prev => {
          const unioned = Array.from(coverageMap.entries()).map(([id, coverageIds]) => {
            const existing = prev.find(r => r.sampleTypeId === id);
            return { sampleTypeId: id, quantity: existing?.quantity || 0, coverageStandardIds: coverageIds, isOverride: false };
          });
          const overrides = prev.filter(r => r.isOverride && !coverageMap.has(r.sampleTypeId));
          return [...unioned, ...overrides];
        });
      };
      const addStandard = (s) => {
        setStandards(prev => {
          if (prev.find(x => x.id === s.id)) return prev;
          const next = [...prev, s];
          recomputeManifest(next);
          return next;
        });
      };
      const removeStandard = (id) => {
        setStandards(prev => {
          const next = prev.filter(s => s.id !== id);
          recomputeManifest(next);
          return next;
        });
      };

      // ── Manifest handlers ──
      const setQty = (sid, q) => {
        const qty = Math.max(0, Math.min(999, parseInt(q) || 0));
        setManifest(m => m.map(r => r.sampleTypeId === sid ? { ...r, quantity:qty } : r));
      };
      const addType = (id) => {
        setManifest(m => {
          if (m.find(r => r.sampleTypeId === id)) return m;
          const coverageStandardIds = standards.filter(s => s.sampleTypeIds.includes(id)).map(s => s.id);
          return [...m, { sampleTypeId:id, quantity:1, coverageStandardIds, isOverride: coverageStandardIds.length === 0 }];
        });
        setShowAddType(false);
      };
      const removeRow = (sid) => setManifest(m => m.filter(r => r.sampleTypeId !== sid));

      // 2026-05-01: derive total + active sample types from new per-sample manifest rows.
      // Match by sample type NAME against ALL_SAMPLE_TYPES catalog, since CSV/free-text rows store names.
      const total = useMemo(() => sampleRowsManifest.length, [sampleRowsManifest]);
      const activeTypes = useMemo(() => {
        const seen = new Set();
        sampleRowsManifest.forEach(r => {
          const st = ALL_SAMPLE_TYPES.find(x => x.name.toLowerCase() === (r.sampleType || '').toLowerCase());
          if (st) seen.add(st.id);
        });
        return Array.from(seen);
      }, [sampleRowsManifest]);

      // 2026-04-29 (rewritten): Branch-aware test selection
      // — Regulation-driven: pre-loaded deduped Test Plan + blocked-by-missing-sample + add-extra
      // — Ad-hoc: existing OE Panels + Tests two-stack UI
      // Both gated behind ≥1 manifest row with quantity > 0.

      // Ad-hoc branch state
      const [selectedPanelIds, setSelectedPanelIds] = useState([]);
      const [selectedTestIds, setSelectedTestIds] = useState([]);
      const [panelSearch, setPanelSearch] = useState('');
      const [testSearch, setTestSearch] = useState('');

      // Regulation-driven branch state
      const [deselectedRegTestIds, setDeselectedRegTestIds] = useState(new Set());
      const [extraRegTestIds, setExtraRegTestIds] = useState([]);
      const [showAddExtra, setShowAddExtra] = useState(false);
      const [addExtraSearch, setAddExtraSearch] = useState('');

      // Reset selection state when branch or standards change
      useEffect(() => {
        setSelectedPanelIds([]);
        setSelectedTestIds([]);
        setPanelSearch('');
        setTestSearch('');
        setDeselectedRegTestIds(new Set());
        setExtraRegTestIds([]);
        setShowAddExtra(false);
        setAddExtraSearch('');
      }, [branch, standards]);

      // ── Regulation-driven memos ──
      // All tests linked to any selected standard (deduped, with covering reg ids)
      const regulationTests = useMemo(() => {
        if (branch !== 'REGULATION_DRIVEN' || standards.length === 0) return [];
        const stdIds = new Set(standards.map(s => s.id));
        return TEST_CATALOG
          .filter(t => t.stdIds.some(id => stdIds.has(id)))
          .map(t => ({ ...t, coveringStdIds: t.stdIds.filter(id => stdIds.has(id)) }));
      }, [branch, standards]);
      // Tests where at least one applicable sample type is active in manifest
      const regTestActive = useMemo(() => {
        const activeSet = new Set(activeTypes);
        return regulationTests.filter(t => t.sampleTypeIds.some(st => activeSet.has(st)));
      }, [regulationTests, activeTypes]);
      // Tests blocked because all their applicable sample types are at quantity 0 (or not in manifest)
      const regTestBlocked = useMemo(() => {
        const activeSet = new Set(activeTypes);
        return regulationTests.filter(t => !t.sampleTypeIds.some(st => activeSet.has(st)));
      }, [regulationTests, activeTypes]);
      // Final ordered tests on regulation branch = active included + extras
      const regulationOrderedTests = useMemo(() => {
        if (branch !== 'REGULATION_DRIVEN') return [];
        const list = regTestActive.filter(t => !deselectedRegTestIds.has(t.id))
          .map(t => ({ ...t, source: 'REGULATION' }));
        const includedIds = new Set(list.map(t => t.id));
        extraRegTestIds.forEach(id => {
          if (!includedIds.has(id)) {
            const t = TEST_CATALOG.find(x => x.id === id);
            if (t) list.push({ ...t, source: 'EXTRA' });
          }
        });
        return list;
      }, [branch, regTestActive, deselectedRegTestIds, extraRegTestIds]);

      // Add-extra picker: tests not already pre-loaded by regs, filtered by active sample types + search
      const addExtraCandidates = useMemo(() => {
        if (branch !== 'REGULATION_DRIVEN') return [];
        const activeSet = new Set(activeTypes);
        const regTestIdSet = new Set(regulationTests.map(t => t.id));
        const extraSet = new Set(extraRegTestIds);
        return TEST_CATALOG.filter(t =>
          !regTestIdSet.has(t.id) &&
          !extraSet.has(t.id) &&
          t.sampleTypeIds.some(st => activeSet.has(st)) &&
          (!addExtraSearch ||
            t.name.toLowerCase().includes(addExtraSearch.toLowerCase()) ||
            t.loinc.includes(addExtraSearch))
        );
      }, [branch, activeTypes, regulationTests, extraRegTestIds, addExtraSearch]);

      const toggleRegTest = (id) => setDeselectedRegTestIds(prev => {
        const n = new Set(prev);
        n.has(id) ? n.delete(id) : n.add(id);
        return n;
      });
      const removeExtra = (id) => setExtraRegTestIds(prev => prev.filter(x => x !== id));
      const addExtra = (id) => {
        setExtraRegTestIds(prev => prev.includes(id) ? prev : [...prev, id]);
        setAddExtraSearch('');
      };
      const skipBlocked = (id) => setDeselectedRegTestIds(prev => {
        const n = new Set(prev);
        n.add(id);
        return n;
      });

      // ── Ad-hoc branch memos (existing OE Panels + Tests two-stack) ──
      const testsFromPanels = useMemo(() => {
        const ids = new Set();
        selectedPanelIds.forEach(pid => {
          const p = PANELS.find(x => x.id === pid);
          if (p) p.testIds.forEach(tid => ids.add(tid));
        });
        return ids;
      }, [selectedPanelIds]);

      const visiblePanels = useMemo(() => {
        if (!activeTypes.length) return [];
        const activeSet = new Set(activeTypes);
        return PANELS.filter(p =>
          p.sampleTypeIds.some(id => activeSet.has(id)) &&
          (!panelSearch || p.name.toLowerCase().includes(panelSearch.toLowerCase()))
        );
      }, [activeTypes, panelSearch]);
      const visibleTests = useMemo(() => {
        if (!activeTypes.length) return [];
        const activeSet = new Set(activeTypes);
        return TEST_CATALOG.filter(t =>
          t.sampleTypeIds.some(id => activeSet.has(id)) &&
          (!testSearch || t.name.toLowerCase().includes(testSearch.toLowerCase()) || t.loinc.includes(testSearch))
        );
      }, [activeTypes, testSearch]);

      const togglePanel = (id) => setSelectedPanelIds(prev =>
        prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
      );
      const toggleTest = (id) => {
        if (testsFromPanels.has(id)) return;
        setSelectedTestIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };
      const removePanelChip = (id) => setSelectedPanelIds(prev => prev.filter(x => x !== id));
      const removeTestChip = (id) => {
        if (testsFromPanels.has(id)) return;
        setSelectedTestIds(prev => prev.filter(x => x !== id));
      };

      const adhocSelectedCount = useMemo(() => {
        const all = new Set([...selectedTestIds, ...Array.from(testsFromPanels)]);
        return all.size;
      }, [selectedTestIds, testsFromPanels]);

      // Combined for canAdvance
      const totalSelectedTests = branch === 'REGULATION_DRIVEN'
        ? regulationOrderedTests.length
        : adhocSelectedCount;

      // ── Step 2 handlers ──
      // 2026-05-01: advanceTo2 reads from per-sample manifest rows directly (one-to-one).
      const advanceTo2 = () => {
        const rows = [];
        let i = 1;
        sampleRowsManifest.forEach(r => {
          const st = ALL_SAMPLE_TYPES.find(s => s.name.toLowerCase() === (r.sampleType || '').toLowerCase());
          rows.push({
            id:`s-${i}`, idx:i, type:st || { name:r.sampleType, code:'?' },
            container:r.container, gps:r.gps, loc:r.loc, addr:r.addr,
            accession:`ENV-2026-0412.${String(i).padStart(3,'0')}`,
            barcode:'', dt:r.dt || '', cond:'', storage:'',
          });
          i++;
          // dummy loop boundary preserved for diff stability
          for (let k = 0; k < 0; k++) {
            i++;
          }
        });
        setSampleRows(rows);
        setStep(1);
      };
      const updRow = (id, p) => setSampleRows(r => r.map(x => x.id === id ? {...x, ...p} : x));
      const applyBulk = () => {
        if (!bulkStorage) return;
        setSampleRows(r => r.map(x => ({ ...x, storage:bulkStorage })));
      };

      // ── Step 3 handlers ──
      const addQc = (type) => {
        const idx = qcSamples.filter(q => q.type === type).length + 1;
        const prefix = type === 'BLANK' ? 'BLNK' : type === 'DUPLICATE' ? 'DUP' : 'CTRL';
        setQcSamples(q => [...q, {
          id:`qc-${q.length+1}`,
          qcId:`QC-${prefix}-${String(idx).padStart(3,'0')}`,
          type,
          subtype: type === 'BLANK' ? 'Field' : '',
          parent: '',
          materialName: '',
          materialSource: '',
          storage: '',
        }]);
      };
      const updQc = (id, p) => setQcSamples(q => q.map(x => x.id === id ? {...x, ...p} : x));
      const rmQc = (id) => setQcSamples(q => q.filter(x => x.id !== id));

      const flagNce = (sid) => {
        setNces(prev => {
          const cur = prev[sid];
          if (!cur) return { ...prev, [sid]:{ code:'COND-BROKEN', decision:'flag' } };
          if (cur.decision === 'flag') return { ...prev, [sid]:{ code:'HOLD-EXCEEDED', decision:'reject' } };
          const { [sid]:_, ...rest } = prev;
          return rest;
        });
      };

      const canAdvance1 = total > 0 && collMethod && totalSelectedTests > 0 &&
        (branch === 'AD_HOC' || (branch === 'REGULATION_DRIVEN' && standards.length > 0));

      return (
        <div>
          {/* ── Progress Indicator ─────────────────────────────── */}
          <div className="progress-bar">
            <div className={`progress-step ${step === 0 ? 'current' : step > 0 ? 'complete' : 'pending'}`} onClick={() => setStep(0)}>
              <span className="step-label">1 — Branch & Order Setup</span>
              <span className="step-desc">Branch, site, manifest, conditions</span>
            </div>
            <div className={`progress-step ${step === 1 ? 'current' : step > 1 ? 'complete' : 'pending'}`} onClick={() => sampleRows.length && setStep(1)}>
              <span className="step-label">2 — Label & Store</span>
              <span className="step-desc">Per-sample labeling, storage</span>
            </div>
            <div className={`progress-step ${step === 2 ? 'current' : 'pending'}`} onClick={() => sampleRows.length && setStep(2)}>
              <span className="step-label">3 — QA / QC + Intake</span>
              <span className="step-desc">NCE, QC samples, submit batch</span>
            </div>
          </div>

          {/* ── Action Bar — Lab Number + Domain Badge + Referral Tag + Report NCE button (2026-05-01) ─ */}
          <div className="tile" style={{ position:'sticky', top:0, zIndex:10, marginBottom:'1rem' }}>
            <div className="header-row" style={{ display:'flex', alignItems:'flex-end', gap:16 }}>
              <div className="lab-no form-field" style={{ marginBottom:0 }}>
                <label>Lab Number</label>
                <input type="text" value="ENV-2026-0412" readOnly />
                <span className="helper">Auto-generated</span>
              </div>
              <div className="badges" style={{ flex:1 }}>
                <span className={`tag ${DOMAIN_TAGS[LAB_UNIT.domain]}`} title={`This order belongs to ${LAB_UNIT.name} (${LAB_UNIT.domain})`}>
                  {LAB_UNIT.domain}
                </span>
                {REFERRAL && (
                  <span className="tag tag-cyan">📥 Referral: {REFERRAL.name}</span>
                )}
              </div>
              {/* 2026-05-01: Report NCE button — opens existing OE NCE dialog scoped to order (or sample if a row is highlighted) */}
              <button className="btn btn-ghost"
                      style={{ border:'1px solid #da1e28', color:'#da1e28', fontSize:13 }}
                      onClick={() => alert('Opens existing OE NCE dialog (scope: Order or Sample). No new dialog component — wires existing infra onto Step 1.')}>
                ⚠ Report NCE
              </button>
            </div>
          </div>

          {/* ════════════════════════════════════════════════════════
              STEP 1 — Branch & Order Setup (single page)
              ════════════════════════════════════════════════════════ */}
          {step === 0 && (
            <Fragment>
              {/* Branch Selector */}
              <div className="tile">
                <h4>Order Type</h4>
                <div className="grid grid-2">
                  <div className={`branch-tile ${branch === 'REGULATION_DRIVEN' ? 'selected' : ''}`}
                       onClick={() => pickBranch('REGULATION_DRIVEN')}>
                    <h5>Regulation-driven</h5>
                    <p>Order is governed by a compliance standard. Tests will be suggested based on the standard's linked thresholds.</p>
                  </div>
                  <div className={`branch-tile ${branch === 'AD_HOC' ? 'selected' : ''}`}
                       onClick={() => pickBranch('AD_HOC')}>
                    <h5>Ad-hoc</h5>
                    <p>Site-driven. Pick tests freely from the catalog. Optional regulatory reference for audit trail.</p>
                  </div>
                </div>
                {REFERRAL && (
                  <p className="branch-helper">ⓘ Auto-set when order arrives from referral. You can override.</p>
                )}
              </div>

              {/* ── Submitter (Organization) — NEW 2026-05-01 ───────────── */}
              {branch && (
                <div className="tile">
                  <h4>Requester</h4>
                  <p className="step-helper">The customer requesting this order: a <b>Requesting Organization</b> (the company) plus a <b>Requestor</b> (the contact person). At least one is required. Free-text is allowed or restricted per the Order Entry configuration; new values are saved for reuse.</p>
                  {!submitter ? (
                    <div className="form-field" style={{ position:'relative' }}>
                      <label>Requesting Organization</label>
                      <input type="text"
                             placeholder="Search organizations…"
                             value={submitterSearch}
                             onChange={(e) => setSubmitterSearch(e.target.value)} />
                      {submitterSearch && (
                        <div style={{ position:'absolute', top:'100%', left:0, right:0, background:'#fff', border:'1px solid #e0e0e0', borderTop:'none', maxHeight:200, overflowY:'auto', zIndex:5 }}>
                          {ORGANIZATIONS.filter(o => o.name.toLowerCase().includes(submitterSearch.toLowerCase())).map(o => (
                            <div key={o.id} style={{ padding:'8px 12px', cursor:'pointer', borderBottom:'1px solid #f4f4f4' }}
                                 onClick={() => { setSubmitter(o); setSubmitterSearch(''); setOrgEdit(false); }}>
                              <div style={{ fontWeight:500 }}>{o.name}</div>
                              <div style={{ fontSize:12, color:'#525252' }}>{o.address}</div>
                            </div>
                          ))}
                          {/* Add-new is gated by the Order Entry config. allowNewRequester=true → enabled link; false → disabled note. */}
                          <div style={{ padding:'8px 12px', borderTop:'1px solid #e0e0e0', background:'#f4f4f4' }}>
                            {allowNewRequester ? (
                              <a href="#" style={{ color:'#0f62fe', fontSize:13 }} onClick={(e) => { e.preventDefault(); setSubmitter({ id:'new', name: submitterSearch || 'New organization', address:'', recent:0, contact:'' }); setSubmitterSearch(''); setOrgEdit(true); }}>+ Add new organization</a>
                            ) : (
                              <span style={{ color:'#8d8d8d', fontSize:13, fontStyle:'italic' }} title="Enable free-text entry in Admin → General Configuration → Order Entry">+ Add new organization — disabled by your administrator</span>
                            )}
                          </div>
                        </div>
                      )}
                      <span className="helper">Same search/store mechanism as the clinical requesting provider. Adding a new organization is available only when the Order Entry configuration allows free-text entry; otherwise it is shown disabled with a clear admin message.</span>
                    </div>
                  ) : (
                    <div>
                      <div style={{ background:'#f4f4f4', padding:'12px 16px', borderRadius:4, display:'flex', gap:16 }}>
                        <div style={{ flex:1 }}>
                          <div style={{ fontWeight:600 }}>{submitter.name}</div>
                          <div style={{ fontSize:12, color:'#525252', marginTop:2 }}>{submitter.address}</div>
                          <div style={{ fontSize:11, color:'#525252', marginTop:6 }}>
                            <span className="tag tag-blue" style={{ fontSize:10 }}>{submitter.recent} orders in last 90 days</span>
                          </div>
                        </div>
                        <button className="btn btn-ghost" onClick={() => setSubmitter(null)}>Change</button>
                      </div>
                      {/* Full Organization field set — read-only when pulled from search; Edit unlocks (avoids accidental persisted changes). */}
                      <div style={{ marginTop:12 }}>
                        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                          <label>Organization details</label>
                          {submitter.id !== 'new' && (
                            <a href="#" style={{ color:'#0f62fe', fontSize:12 }} onClick={(e) => { e.preventDefault(); setOrgEdit(!orgEdit); }}>{orgEdit ? 'Done editing' : 'Edit details'}</a>
                          )}
                        </div>
                        <p className="helper" style={{ marginTop:0 }}>{orgEdit ? 'Editing — changes are saved to this organization for reuse.' : 'Pulled from the registry (read-only). Click Edit details to change — prevents accidental edits.'}</p>
                        <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
                          <div className="form-field" style={{ flex:2, minWidth:200 }}><label>Address / City</label><input type="text" defaultValue={submitter.address||''} placeholder="Street, city" disabled={!orgEdit} /></div>
                          <div className="form-field" style={{ flex:1, minWidth:120 }}><label>Phone</label><input type="text" placeholder="Organization phone" disabled={!orgEdit} /></div>
                          <div className="form-field" style={{ flex:1, minWidth:120 }}><label>Fax</label><input type="text" placeholder="Organization fax" disabled={!orgEdit} /></div>
                          <div className="form-field" style={{ flex:1, minWidth:160 }}><label>Email</label><input type="text" placeholder="org@example.org" disabled={!orgEdit} /></div>
                        </div>
                      </div>
                      {/* Requestor (contact person) — searched & stored exactly like the clinical requesting provider. */}
                      <div style={{ marginTop:12 }}>
                        <label>Requestor (contact person)</label>
                        <p className="helper" style={{ marginTop:0 }}>The person who placed the order. Search the contact registry (same mechanism as the clinical requesting provider); the full record is editable and saved for reuse. At least one of Requesting Organization or Requestor is required.</p>
                        {!contact ? (
                          <div className="form-field" style={{ position:'relative' }}>
                            <input type="text" placeholder="Search requestors by name…" value={contactSearch}
                                   onChange={(e) => setContactSearch(e.target.value)} />
                            {contactSearch && (
                              <div style={{ position:'absolute', top:'100%', left:0, right:0, background:'#fff', border:'1px solid #e0e0e0', borderTop:'none', maxHeight:200, overflowY:'auto', zIndex:5 }}>
                                {CONTACTS.filter(c => (c.first+' '+c.last).toLowerCase().includes(contactSearch.toLowerCase())).map(c => (
                                  <div key={c.id} style={{ padding:'8px 12px', cursor:'pointer', borderBottom:'1px solid #f4f4f4' }}
                                       onClick={() => { setContact(c); setContactSearch(''); setContactEdit(false); }}>
                                    <div style={{ fontWeight:500 }}>{c.first} {c.last}</div>
                                    <div style={{ fontSize:12, color:'#525252' }}>{c.dept} · {c.email || c.phone}</div>
                                  </div>
                                ))}
                                <div style={{ padding:'8px 12px', borderTop:'1px solid #e0e0e0', background:'#f4f4f4' }}>
                                  {allowNewRequester ? (
                                    <a href="#" style={{ color:'#0f62fe', fontSize:13 }} onClick={(e) => { e.preventDefault(); setContact({ id:'new', first:'', last:'', phone:'', fax:'', email:'', dept:'' }); setContactSearch(''); setContactEdit(true); }}>+ Add new requestor / contact</a>
                                  ) : (
                                    <span style={{ color:'#8d8d8d', fontSize:13, fontStyle:'italic' }} title="Enable free-text entry in Admin → General Configuration → Order Entry">+ Add new requestor — disabled by your administrator</span>
                                  )}
                                </div>
                              </div>

                          <button className="btn btn-ghost" style={{ fontSize:12, border:'1px solid #c6c6c6', color:'#525252' }}>10×10 Box</button>

                                {st.coveringStds.map(s => (

                              <input type="number" min={0} max={99}
                                     value={qty}
                                     onChange={(e) => setSuggestQty(p => ({ ...p, [st.id]:Math.max(0, parseInt(e.target.value) || 0) }))}

                                      style={{ fontSize:11, padding:'2px 8px',

                                               border:'1px solid ' + (qty > 0 ? '#0f62fe' : '#e0e0e0') }}

                                + Add {qty || ''}

                      </div>
                    </div>

                  {sampleRowsManifest.length === 0 ? (
                    <p className="step-helper" style={{ background:'#f4f4f4', padding:'12px 16px', borderRadius:4 }}>

                          <tr>
                            <th>#</th><th>Sample Type</th><th>Container</th><th>GPS</th><th>Location Details</th><th>Address</th><th>Collected</th><th></th>

                                <input type="text" value={r.container}

                  </div>

                  Regulation: pre-loaded deduped Test Plan + blocked-by-missing-sample + add-extra
                  Ad-hoc: existing OE Panels + Tests two-stack

                              <div style={{ fontWeight:500 }}>
                                {t.name} <span style={{ fontWeight:400, color:'#525252', fontSize:12 }}>· {t.unit} · LOINC <code>{t.loinc}</code></span>
                              </div>
                              <div style={{ fontSize:12, color:'#525252', marginTop:4, display:'flex', flexWrap:'wrap', gap:4 }}>
                                {isExtra ? (
                                  <span className="tag tag-warm-gray" style={{ fontSize:10 }}>Ad-hoc</span>
                                ) : (
                                  (t.coveringStdIds || t.stdIds.filter(sid => standards.some(s => s.id === sid))).map(sid => {
                                    const std = STANDARDS.find(s => s.id === sid);
                                    return std ? <span key={sid} className="tag tag-purple" style={{ fontSize:10 }}>{std.reg}</span> : null;
                                  })
                                )}
                              </div>
                            </div>
                          </label>
                        );
                      })}
                      {/* Show deselected reg tests as struck-through "add back" entries */}
                      {regTestActive.filter(t => deselectedRegTestIds.has(t.id)).map(t => (
                        <label key={t.id} style={{ display:'flex', alignItems:'flex-start', gap:8, padding:'10px 12px', borderBottom:'1px solid #f4f4f4', cursor:'pointer', opacity:0.5 }}>
                          <input type="checkbox" checked={false} onChange={() => toggleRegTest(t.id)} style={{ marginTop:3 }} />
                          <div style={{ flex:1 }}>
                            <div style={{ fontWeight:500, textDecoration:'line-through' }}>
                              {t.name} <span style={{ fontWeight:400, color:'#525252', fontSize:12 }}>· {t.unit} · LOINC <code>{t.loinc}</code></span>
                            </div>
                          </div>
                        </label>
                      ))}
                    </div>
                  )}

                  {/* ── Blocked tests (sample type quantity = 0) ── */}
                  {regTestBlocked.length > 0 && (
                    <div style={{ background:'#fff8e1', border:'1px solid #f1c21b', borderRadius:4, padding:'12px 16px', marginBottom:'1rem' }}>
                      <div style={{ fontWeight:600, marginBottom:8, fontSize:13 }}>
                        ⚠ {regTestBlocked.length} test{regTestBlocked.length === 1 ? '' : 's'} blocked by missing sample type{regTestBlocked.length === 1 ? '' : 's'}
                      </div>
                      {regTestBlocked.map(t => {
                        const missingSampleTypes = t.sampleTypeIds
                          .map(stId => ALL_SAMPLE_TYPES.find(st => st.id === stId))
                          .filter(Boolean)
                          .filter(st => !activeTypes.includes(st.id));
                        return (
                          <div key={t.id} style={{ padding:'8px 0', borderTop:'1px solid #f1c21b', fontSize:13 }}>
                            <div style={{ fontWeight:500 }}>{t.name} <span style={{ fontWeight:400, color:'#525252', fontSize:12 }}>· LOINC <code>{t.loinc}</code></span></div>
                            <div style={{ fontSize:12, color:'#525252', marginTop:4 }}>
                              Needs: {missingSampleTypes.map(st => st.name).join(' or ')} (quantity is 0)
                            </div>
                            <div style={{ display:'flex', gap:8, marginTop:6, alignItems:'center' }}>
                              {missingSampleTypes.map(st => (
                                <button key={st.id} className="btn btn-ghost" style={{ fontSize:12, padding:'2px 8px' }}
                                        onClick={() => addType(st.id)}>
                                  + Add 1 {st.name} to manifest
                                </button>
                              ))}
                              <span style={{ color:'#c6c6c6' }}>·</span>
                              <button className="btn btn-ghost" style={{ fontSize:12, padding:'2px 8px', color:'#525252' }}
                                      onClick={() => skipBlocked(t.id)}>
                                Skip this test
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* ── Add a test or panel not in the regulations ── */}
                  {!showAddExtra ? (
                    <button className="btn btn-ghost" style={{ fontSize:13 }} onClick={() => setShowAddExtra(true)}>
                      + Add a test or panel not in the regulations
                    </button>
                  ) : (
                    <div style={{ background:'#f4f4f4', border:'1px solid #e0e0e0', borderRadius:4, padding:'12px 16px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:8 }}>
                        <strong style={{ fontSize:13 }}>Add ad-hoc test (filtered to active sample types)</strong>
                        <span style={{ flex:1 }} />
                        <button className="btn btn-ghost" style={{ fontSize:12 }} onClick={() => { setShowAddExtra(false); setAddExtraSearch(''); }}>Done</button>
                      </div>
                      <input type="text" placeholder="🔍 Search by test name or LOINC…" value={addExtraSearch}
                             onChange={(e) => setAddExtraSearch(e.target.value)}
                             style={{ width:'100%', marginBottom:8 }} />
                      <div style={{ maxHeight:200, overflowY:'auto', background:'#fff', border:'1px solid #e0e0e0', borderRadius:4 }}>
                        {addExtraCandidates.length === 0 ? (
                          <p className="step-helper" style={{ padding:'8px 12px' }}>No additional tests match.</p>
                        ) : addExtraCandidates.slice(0, 25).map(t => (
                          <div key={t.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 12px', borderBottom:'1px solid #f4f4f4' }}>
                            <div style={{ flex:1 }}>
                              <div style={{ fontWeight:500, fontSize:13 }}>{t.name} <span style={{ fontWeight:400, color:'#525252', fontSize:12 }}>· {t.unit} · LOINC <code>{t.loinc}</code></span></div>
                            </div>
                            <button className="btn btn-ghost" style={{ fontSize:12, padding:'2px 8px' }} onClick={() => addExtra(t.id)}>+ Add</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {regulationOrderedTests.length === 0 && (
                    <div className="notification warning" style={{ marginTop:'1rem' }}>
                      No tests in this order. Add a test or fix a blocked one above.
                    </div>
                  )}
                </div>
              )}

              {/* ─── Ad-hoc branch: full OE Panels + Tests two-stack ─── */}
              {branch === 'AD_HOC' && activeTypes.length > 0 && (
                <div className="tile">
                  <h4>Test Selection</h4>
                  <p className="step-helper">
                    Pick order panels and/or individual tests from the catalog. Filtered to the {activeTypes.length} sample type{activeTypes.length === 1 ? '' : 's'} in this batch.
                  </p>

                  <div className="grid grid-2" style={{ alignItems:'start' }}>
                    {/* Order Panels */}
                    <div>
                      <div style={{ fontWeight:600, marginBottom:8 }}>
                        Order Panels <span style={{ color:'#525252', fontWeight:400 }}>({selectedPanelIds.length} selected)</span>
                      </div>
                      {selectedPanelIds.length > 0 && (
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:8, padding:8, background:'#f4f4f4', borderRadius:4 }}>
                          {selectedPanelIds.map(pid => {
                            const p = PANELS.find(x => x.id === pid);
                            return p ? (
                              <span key={pid} className="tag tag-blue" style={{ display:'inline-flex', alignItems:'center', gap:6 }}>
                                {p.name}
                                <button onClick={() => removePanelChip(pid)} style={{ background:'none', border:'none', cursor:'pointer', color:'#0f62fe', padding:0, fontSize:14, lineHeight:1 }}>✕</button>
                              </span>
                            ) : null;
                          })}
                        </div>
                      )}
                      <input type="text" placeholder="🔍 Search panels…" value={panelSearch}
                             onChange={(e) => setPanelSearch(e.target.value)}
                             style={{ width:'100%', marginBottom:8 }} />
                      <div style={{ maxHeight:240, overflowY:'auto', border:'1px solid #e0e0e0', borderRadius:4 }}>
                        {visiblePanels.length === 0 ? (
                          <p className="step-helper" style={{ padding:'1rem' }}>No panels match the selected sample types.</p>
                        ) : visiblePanels.map(p => {
                          const checked = selectedPanelIds.includes(p.id);
                          return (
                            <label key={p.id} style={{ display:'flex', alignItems:'flex-start', gap:8, padding:'8px 12px', borderBottom:'1px solid #f4f4f4', cursor:'pointer' }}>
                              <input type="checkbox" checked={checked} onChange={() => togglePanel(p.id)} style={{ marginTop:3 }} />
                              <div style={{ flex:1 }}>
                                <div style={{ fontWeight:500 }}>{p.name}</div>
                                <div style={{ fontSize:12, color:'#525252' }}>{p.testIds.length} tests</div>
                              </div>
                            </label>
                          );
                        })}
                      </div>
                    </div>

                    {/* Order Tests */}
                    <div>
                      <div style={{ fontWeight:600, marginBottom:8 }}>
                        Order Tests <span style={{ color:'#525252', fontWeight:400 }}>({adhocSelectedCount} total selected, {testsFromPanels.size} via panels)</span>
                      </div>
                      {selectedTestIds.length > 0 && (
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:8, padding:8, background:'#f4f4f4', borderRadius:4 }}>
                          {selectedTestIds.map(tid => {
                            const t = TEST_CATALOG.find(x => x.id === tid);
                            return t ? (
                              <span key={tid} className="tag tag-blue" style={{ display:'inline-flex', alignItems:'center', gap:6 }}>
                                {t.name}
                                <button onClick={() => removeTestChip(tid)} style={{ background:'none', border:'none', cursor:'pointer', color:'#0f62fe', padding:0, fontSize:14, lineHeight:1 }}>✕</button>
                              </span>
                            ) : null;
                          })}
                        </div>
                      )}
                      <input type="text" placeholder="🔍 Search tests by name or LOINC…" value={testSearch}
                             onChange={(e) => setTestSearch(e.target.value)}
                             style={{ width:'100%', marginBottom:8 }} />
                      <div style={{ maxHeight:240, overflowY:'auto', border:'1px solid #e0e0e0', borderRadius:4 }}>
                        {visibleTests.length === 0 ? (
                          <p className="step-helper" style={{ padding:'1rem' }}>No tests match the selected sample types.</p>
                        ) : visibleTests.map(t => {
                          const fromPanel = testsFromPanels.has(t.id);
                          const checked = fromPanel || selectedTestIds.includes(t.id);
                          return (
                            <label key={t.id} style={{ display:'flex', alignItems:'flex-start', gap:8, padding:'8px 12px', borderBottom:'1px solid #f4f4f4', cursor: fromPanel ? 'not-allowed' : 'pointer', opacity: fromPanel ? 0.7 : 1 }}>
                              <input type="checkbox" checked={checked} disabled={fromPanel} onChange={() => toggleTest(t.id)} style={{ marginTop:3 }} />
                              <div style={{ flex:1 }}>
                                <div style={{ fontWeight:500 }}>{t.name} <span style={{ fontWeight:400, color:'#525252', fontSize:12 }}>{t.unit && `· ${t.unit}`}</span></div>
                                <div style={{ fontSize:12, color:'#525252' }}>
                                  LOINC <code>{t.loinc}</code>
                                  {fromPanel && <> · <span className="tag tag-warm-gray" style={{ fontSize:10 }}>via panel</span></>}
                                </div>
                              </div>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {adhocSelectedCount === 0 && (
                    <div className="notification warning" style={{ marginTop:'1rem' }}>
                      No tests selected. Pick at least one panel or test before continuing.
                    </div>
                  )}
                </div>
              )}

              {/* Default Collection Conditions */}
              {branch && (
                <div className="tile">
                  <h4>Default Collection Conditions</h4>
                  <p className="step-helper">Defaults applied to all samples in this batch.</p>
                  <div className="grid grid-3">
                    <div className="form-field">
                      <label>Collection Method</label>
                      <select value={collMethod} onChange={(e) => setCollMethod(e.target.value)}>
                        <option value="">Select… (optional)</option>
                        {COLLECTION_METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                      <p className="step-helper">Optional — how the sample was/will be collected. Leave blank if not applicable.</p>
                    </div>
                    <div className="form-field">
                      <label>Water Temp (°C)</label>
                      <input type="number" min={-50} max={100} step={0.1} value={waterT} onChange={(e) => setWaterT(e.target.value)} />
                    </div>
                    <div className="form-field">
                      <label>Ambient Temp (°C)</label>
                      <input type="number" min={-50} max={100} step={0.1} value={ambientT} onChange={(e) => setAmbientT(e.target.value)} />
                    </div>
                    <div className="form-field">
                      <label>Weather</label>
                      <select value={weather} onChange={(e) => setWeather(e.target.value)}>
                        <option value="">Select…</option>
                        {WEATHER.map(w => <option key={w} value={w}>{w}</option>)}
                      </select>
                    </div>
                    <div className="form-field" style={{ gridColumn:'span 2' }}>
                      <label>Preservation Method</label>
                      <input type="text" maxLength={255} placeholder="e.g., HNO3 acidification, 4°C cooler"
                             value={preserv} onChange={(e) => setPreserv(e.target.value)} />
                    </div>
                    <div className="form-field" style={{ gridColumn:'span 3' }}>
                      <label>Field Notes</label>
                      <textarea rows={2} maxLength={1000} placeholder="Enter field observations…"
                                value={notes} onChange={(e) => setNotes(e.target.value)} />
                    </div>
                  </div>
                </div>
              )}

              {/* Pool/Aliquot subsection (only when referral has parent specimens) */}
              {HAS_PARENT_SPECIMENS && (
                <div className="tile">
                  <h4>Pool / Aliquot</h4>
                  <div className="notification">
                    Parent specimens detected in referral payload. Local aliquot LABNOs assigned automatically.
                  </div>
                  <table style={{ marginTop:'1rem' }}>
                    <thead>
                      <tr>
                        <th>Parent Specimen (sender)</th>
                        <th>Local Aliquot LABNO</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><code>POOL-XYZ-2026-09</code></td>
                        <td><code>ENV-2026-0412.1-3</code></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}

              {/* Footer */}
              {branch && (
                <div className="tile">
                  <div className="footer-actions">
                    <button className="btn btn-ghost">Cancel</button>
                    <button className="btn btn-secondary">💾 Save Draft</button>
                    <button className="btn btn-primary" disabled={!canAdvance1} onClick={advanceTo2}>
                      Continue to Label & Store →
                    </button>
                  </div>
                </div>
              )}
            </Fragment>
          )}

          {/* ════════════════════════════════════════════════════════
              STEP 2 — Label & Store
              ════════════════════════════════════════════════════════ */}
          {step === 1 && (
            <Fragment>
              {/* 2026-04-29 simplification: Step 2 reuses the existing OpenELIS labeling and storage pattern.
                  Placeholder tile shown below — no custom Env UI is designed in this spec.
                  Env-specific deltas: (a) Sample Type read-only from Step 1, (b) hold-time clock starts on collection date/time entry. */}
              <div className="tile" style={{ background:'#f4f4f4', border:'1px dashed #8d8d8d' }}>
                <h4>Label & Store</h4>
                <p className="step-helper">
                  This step reuses the existing OpenELIS labeling and storage UI for the {sampleRows.length} sample row{sampleRows.length === 1 ? '' : 's'} generated from Step 1. No custom Env UI is designed here.
                </p>
                <div style={{ background:'#fff', border:'1px solid #e0e0e0', padding:'12px 16px', fontSize:12, color:'#525252' }}>
                  <strong>Env-specific behaviors layered on the existing pattern:</strong>
                  <ul style={{ margin:'6px 0 0 18px', padding:0 }}>
                    <li>Sample Type for each row is sourced from the Step 1 manifest (read-only).</li>
                    <li>Hold-time clock starts when Collection Date/Time is entered (per-test hold-time × strictest standard).</li>
                    <li>Hold-time-exceeded rows show a red indicator; not blocked — flows to Step 3 for NCE decision.</li>
                  </ul>
                </div>
                <p style={{ fontSize:12, color:'#525252', marginTop:12, fontStyle:'italic' }}>
                  {sampleRows.length} sample row{sampleRows.length === 1 ? '' : 's'} ready for OE label/storage entry.
                </p>
              </div>

              <div className="tile">
                <div className="footer-actions">
                  <button className="btn btn-ghost" onClick={() => setStep(0)}>← Back</button>
                  <button className="btn btn-secondary">💾 Save Draft</button>
                  <button className="btn btn-primary" onClick={() => setStep(2)}>Continue to QA / QC →</button>
                </div>
              </div>
            </Fragment>
          )}

          {/* ════════════════════════════════════════════════════════
              STEP 3 — QA / QC + Intake
              ════════════════════════════════════════════════════════ */}
          {step === 2 && (
            <Fragment>
              <div className="tile">
                <h4>Sample Intake (NCE / Reject)</h4>
                <p className="step-helper">Click <strong>Flag NCE</strong> on any sample to assign a coded reason and accept-with-flag or reject. Reuses the existing OpenELIS NCE button pattern.</p>

                <table>
                  <thead>
                    <tr>
                      <th>#</th>
                      <th>Sample Type</th>
                      <th>Accession</th>
                      <th>Receipt</th>
                      <th>Hold-time</th>
                      <th>NCE</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sampleRows.map(r => {
                      const nce = nces[r.id];
                      const exceeded = r.idx % 3 === 0;
                      return (
                        <tr key={r.id}>
                          <td>{r.idx}</td>
                          <td>{r.type?.name}</td>
                          <td><code>{r.accession}</code></td>
                          <td>{r.cond || '—'}</td>
                          <td>
                            {exceeded
                              ? <span className="tag tag-red">Exceeded</span>
                              : <span className="tag tag-green">OK</span>}
                          </td>
                          <td>
                            {nce ? (
                              <span style={{ display:'inline-flex', alignItems:'center', gap:8 }}>
                                <span className={`tag ${nce.decision === 'reject' ? 'tag-red' : 'tag-magenta'}`}>{nce.code}</span>
                                <span style={{ fontSize:14 }}>{nce.decision === 'reject' ? '✕' : '⚠'}</span>
                                <button className="btn btn-ghost" style={{ padding:'2px 6px' }} onClick={() => flagNce(r.id)}>Edit</button>
                              </span>
                            ) : (
                              <button className="btn btn-tertiary" style={{ padding:'4px 10px', fontSize:12 }} onClick={() => flagNce(r.id)}>⚠ Flag NCE</button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <div className="tile">
                <div className="qc-buttons">
                  <h4>QC Samples</h4>
                  <button className="btn btn-primary" onClick={() => addQc('BLANK')}>+ Blank</button>
                  <button className="btn btn-primary" onClick={() => addQc('DUPLICATE')}>+ Duplicate</button>
                  <button className="btn btn-primary" onClick={() => addQc('CONTROL')}>+ Control</button>
                </div>

                {qcSamples.length > 0 ? (
                  <table style={{ marginTop:'1rem' }}>
                    <thead>
                      <tr>
                        <th>QC ID</th>
                        <th>Type</th>
                        <th>Detail</th>
                        <th>Expected Value(s)</th>
                        <th>Storage</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {qcSamples.map(q => (
                        <tr key={q.id}>
                          <td><code>{q.qcId}</code></td>
                          <td>
                            <span className={`tag ${q.type === 'BLANK' ? 'tag-gray' : q.type === 'DUPLICATE' ? 'tag-cyan' : 'tag-green'}`}>{q.type}</span>
                          </td>
                          <td>
                            {q.type === 'BLANK' && (
                              <select value={q.subtype} onChange={(e) => updQc(q.id, { subtype:e.target.value })}>
                                {BLANK_SUBTYPES.map(s => <option key={s} value={s}>{s}</option>)}
                              </select>
                            )}
                            {q.type === 'DUPLICATE' && (
                              <select value={q.parent} onChange={(e) => updQc(q.id, { parent:e.target.value })}>
                                <option value="">Pick parent…</option>
                                {sampleRows.map(s => <option key={s.id} value={s.id}>{s.accession}</option>)}
                              </select>
                            )}
                            {q.type === 'CONTROL' && (
                              <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                                <input type="text" placeholder="Material name (e.g., NIST 1640a)"
                                       value={q.materialName} onChange={(e) => updQc(q.id, { materialName:e.target.value })} />
                                <input type="text" placeholder="Source (vendor, lot)"
                                       value={q.materialSource} onChange={(e) => updQc(q.id, { materialSource:e.target.value })} />
                              </div>
                            )}
                          </td>
                          <td>
                            {q.type === 'CONTROL' && <span className="helper-inline">Edit per parameter →</span>}
                            {q.type === 'DUPLICATE' && <span className="helper-inline">inherits from parent</span>}
                            {q.type === 'BLANK' && <span className="helper-inline">—</span>}
                          </td>
                          <td>
                            <select value={q.storage} onChange={(e) => updQc(q.id, { storage:e.target.value })}>
                              <option value="">—</option>
                              {STORAGE.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                          </td>
                          <td><button className="btn-icon" onClick={() => rmQc(q.id)}>🗑</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                ) : (
                  <p className="step-helper">No QC samples added. Click a button above to add one.</p>
                )}
              </div>

              <div className="tile">
                <div className="footer-actions">
                  <button className="btn btn-ghost" onClick={() => setStep(1)}>← Back</button>
                  <button className="btn btn-secondary">💾 Save Draft</button>
                  <button className="btn btn-primary">Submit Batch →</button>
                </div>
              </div>
            </Fragment>
          )}

          {/* ── Branch Switch Modal ─────────────────────────────── */}
          {showSwitch && (
            <div style={{
              position:'fixed', top:0, left:0, right:0, bottom:0,
              background:'rgba(22,22,22,0.5)',
              display:'flex', alignItems:'center', justifyContent:'center',
              zIndex:100,
            }}>
              <div className="tile" style={{ maxWidth:480, margin:0 }}>
                <h4>Switch order type?</h4>
                <p style={{ fontSize:14, color:'#525252', marginBottom:'1rem' }}>
                  Switching order type will clear the standard, tests, manifest, and regulatory reference. Continue?
                </p>
                <div className="footer-actions">
                  <button className="btn btn-ghost" onClick={() => setShowSwitch(null)}>Keep current</button>
                  <button className="btn btn-primary" onClick={confirmSwitch}>Continue and clear</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
