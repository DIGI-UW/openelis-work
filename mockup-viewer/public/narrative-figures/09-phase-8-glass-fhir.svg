<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540"><rect width="1600" height="540" fill="#ffffff"/><rect x="0" y="0" width="1600" height="86" rx="0" fill="#f4f7fb"/><line x1="0" y1="86" x2="1600" y2="86" stroke="#dde3ea" stroke-width="1"/><rect x="0" y="0" width="8" height="86" rx="0" fill="#0f62fe"/><text x="40" y="34" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f62fe" text-anchor="start" letter-spacing="1.2">PHASE 8</text><text x="40" y="64" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#161616" text-anchor="start">Central surveillance — GLASS / consolidated-FHIR (M-15, the last module)</text><rect x="60" y="170" width="360" height="120" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/><rect x="60" y="170" width="6" height="120" rx="0" fill="#0f62fe"/><text x="243.0" y="230.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">OpenELIS deployment A</text><text x="243.0" y="248.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">finalized AMR + TB results</text><rect x="60" y="320" width="360" height="90" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/><rect x="60" y="320" width="6" height="90" rx="0" fill="#0f62fe"/><text x="243.0" y="365.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">OpenELIS deployment B …</text><text x="243.0" y="383.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">each pushes its own</text><rect x="560" y="220" width="360" height="120" rx="12" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="2"/><rect x="560" y="220" width="6" height="120" rx="0" fill="#8a3ffc"/><text x="743.0" y="271.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">FHIR push</text><text x="743.0" y="289.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">DiagnosticReport + per-drug Observations</text><text x="743.0" y="307.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">(WHO AMR profiles)</text><text x="574" y="240" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a3ffc" text-anchor="start" letter-spacing="0.5">REUSES OE FHIR STACK</text><rect x="1060" y="200" width="480" height="150" rx="12" fill="#defbe6" stroke="#198038" stroke-width="2"/><rect x="1060" y="200" width="6" height="150" rx="0" fill="#198038"/><text x="1303.0" y="266.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">Consolidated FHIR server</text><text x="1303.0" y="284.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">cross-lab first-isolate dedup</text><text x="1303.0" y="302.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">→ GLASS submission / WHONET extract</text><text x="1074" y="220" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#198038" text-anchor="start" letter-spacing="0.5">OUTSIDE ANY OE INSTANCE</text><line x1="420" y1="230.0" x2="549.6408389724568" y2="276.3002996330203" stroke="#0f62fe" stroke-width="2.4"/><polygon points="560,280.0 551.0266507484641,280.6921005779223 553.4952550176312,273.78000862425455" fill="#0f62fe"/><line x1="420" y1="365.0" x2="550.0229013547672" y2="304.6322243710009" stroke="#0f62fe" stroke-width="2.4"/><polygon points="560,300 554.0917941190395,306.78919017764144 551.0009684510874,300.13202720051396" fill="#0f62fe"/><line x1="920" y1="280.0" x2="1049.007008602177" y2="275.3926068356365" stroke="#8a3ffc" stroke-width="2.4"/><polygon points="1060,275.0 1051.918417824896,278.9608117283003 1051.6564531211577,271.62580002362637" fill="#8a3ffc"/><line x1="40" y1="444" x2="1560" y2="444" stroke="#e2e7ec" stroke-width="1"/><text x="40" y="470" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6672" text-anchor="start">Complementary to — not a replacement for — the manual WHONET file path (Phase 6); a deployment may use either or both.</text><text x="40" y="490" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6672" text-anchor="start">Cross-lab aggregation stays outside any OE instance, so single-tenancy is preserved. Reuses FhirTransformService + the EQA submission pattern.</text><text x="40" y="524" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6672" text-anchor="start">OpenELIS Global — Microbiology / AMR module · Workflow Walk-through v2.1</text><text x="1560" y="524" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6672" text-anchor="end">schematic — see narrative for detail</text></svg>