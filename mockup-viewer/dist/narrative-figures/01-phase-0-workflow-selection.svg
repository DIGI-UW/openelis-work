<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><rect width="1600" height="600" fill="#ffffff"/><rect x="0" y="0" width="1600" height="86" rx="0" fill="#f4f7fb"/><line x1="0" y1="86" x2="1600" y2="86" stroke="#dde3ea" stroke-width="1"/><rect x="0" y="0" width="8" height="86" rx="0" fill="#0f62fe"/><text x="40" y="34" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f62fe" text-anchor="start" letter-spacing="1.2">PHASE 0</text><text x="40" y="64" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#161616" text-anchor="start">Workflow selection — the routing rule everything hangs off</text><rect x="60" y="150" width="380" height="96" rx="12" fill="#eef1f4" stroke="#697077" stroke-width="2"/><rect x="60" y="150" width="6" height="96" rx="0" fill="#697077"/><text x="253.0" y="198.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">Ordered test</text><text x="253.0" y="216.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">carries workflow_type (data, not a clerk choice)</text><rect x="560" y="150" width="360" height="96" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/><rect x="560" y="150" width="6" height="96" rx="0" fill="#0f62fe"/><text x="743.0" y="198.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">M-03 resolver</text><text x="743.0" y="216.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">createCaseForSample(sampleId, workflowType)</text><text x="574" y="170" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f62fe" text-anchor="start" letter-spacing="0.5">AT SAMPLE-SAVE</text><line x1="440" y1="198.0" x2="549.0" y2="198.0" stroke="#0f62fe" stroke-width="2.4"/><polygon points="560,198.0 551.7821995371892,201.66984407753614 551.7821995371892,194.33015592246386" fill="#0f62fe"/><text x="500.0" y="191.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#5a6672" text-anchor="middle">reads</text><rect x="1040" y="70" width="500" height="70" rx="12" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="2"/><rect x="1040" y="70" width="6" height="70" rx="0" fill="#8a3ffc"/><text x="1293.0" y="114.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">BACTERIOLOGY → M-04 bacterial profile</text><rect x="1040" y="165" width="500" height="70" rx="12" fill="#fff6e0" stroke="#a06a00" stroke-width="2"/><rect x="1040" y="165" width="6" height="70" rx="0" fill="#a06a00"/><text x="1293.0" y="209.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">MYCOBACTERIOLOGY_TB → M-14 TB profile</text><rect x="1040" y="260" width="500" height="70" rx="12" fill="#eef1f4" stroke="#697077" stroke-width="2"/><rect x="1040" y="260" width="6" height="70" rx="0" fill="#697077"/><text x="1293.0" y="304.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">MYCOLOGY → future (M-15)</text><line x1="920" y1="198.0" x2="1031.3054344260722" y2="111.73828831979395" stroke="#c1c7cd" stroke-width="2.4"/><polygon points="1040,105.0 1035.7525693168877,112.93469171374393 1031.2564843199557,107.13329171770246" fill="#c1c7cd"/><line x1="920" y1="198.0" x2="1029.0015274595644" y2="199.81669212432607" stroke="#c1c7cd" stroke-width="2.4"/><polygon points="1040,200.0 1031.722185085917,203.5323901608101 1031.8444962353549,196.19372119454442" fill="#c1c7cd"/><line x1="920" y1="198.0" x2="1031.445328176194" y2="288.0849736090901" stroke="#c1c7cd" stroke-width="2.4"/><polygon points="1040,295.0 1031.3020313891316,292.68800042293566 1035.9160438703473,286.979943745143" fill="#c1c7cd"/><text x="60" y="374" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">The selected Case profile is the single source of truth — it drives:</text><rect x="60" y="390" width="144.1" height="38" rx="8" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.4"/><text x="72" y="414" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f62fe" text-anchor="start">Sections rendered</text><rect x="222.1" y="390" width="144.1" height="38" rx="8" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.4"/><text x="234.1" y="414" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f62fe" text-anchor="start">Breakpoint family</text><rect x="384.2" y="390" width="187.9" height="38" rx="8" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.4"/><text x="396.2" y="414" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f62fe" text-anchor="start">Culture-protocol Method</text><rect x="590.1" y="390" width="122.2" height="38" rx="8" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.4"/><text x="602.1" y="414" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f62fe" text-anchor="start">Reflex cascade</text><rect x="730.3" y="390" width="166.0" height="38" rx="8" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.4"/><text x="742.3" y="414" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f62fe" text-anchor="start">WHONET export flavor</text><line x1="40" y1="504" x2="1560" y2="504" stroke="#e2e7ec" stroke-width="1"/><text x="40" y="530" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6672" text-anchor="start">One-protocol-per-case: a specimen needing routine culture AND TB = two ordered tests → two Cases,</text><text x="40" y="550" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6672" text-anchor="start">keyed (sample_item_id, workflow_type), sharing one SampleItem (no double accessioning), cross-linked as siblings.</text><text x="40" y="584" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6672" text-anchor="start">OpenELIS Global — Microbiology / AMR module · Workflow Walk-through v2.1</text><text x="1560" y="584" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6672" text-anchor="end">schematic — see narrative for detail</text></svg>