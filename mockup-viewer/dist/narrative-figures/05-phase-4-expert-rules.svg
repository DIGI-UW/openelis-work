672" text-anchor="start">Rules are evaluated server-side after AST results land and surface as flags on the Case&#x27;s inline Expert Review panel.</text><text x="40" y="570" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6672" text-anchor="start">A failed rule application auto-creates an NCE; critical resistance raises an alert via the existing dashboard.</text><text x="40" y="604" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6672" text-anchor="start">OpenELIS Global — Microbiology / AMR module · Workflow Walk-through v2.1</text><text x="1560" y="604" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6672" text-anchor="end">schematic — see narrative for detail</text></svg>