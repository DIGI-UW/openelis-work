, sans-serif" font-size="14" font-weight="400" fill="#161616" text-anchor="start">MRSA inference</text><rect x="540" y="176" width="360" height="44" rx="8" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="1.4"/><text x="560" y="204" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#161616" text-anchor="start">D-test required</text><rect x="540" y="232" width="360" height="44" rx="8" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="1.4"/><text x="560" y="260" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#161616" text-anchor="start">ESBL screen / confirm</text><rect x="540" y="288" width="360" height="44" rx="8" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="1.4"/><text x="560" y="316" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#161616" text-anchor="start">Cascade reporting</text><rect x="540" y="344" width="360" height="44" rx="8" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="1.4"/><text x="560" y="372" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#161616" text-anchor="start">Intrinsic resistance</text><rect x="980" y="150" width="280" height="110" rx="12" fill="#f6f0ff" stroke="#8a3ffc" stroke-width="2"/><rect x="980" y="150" width="6" height="110" rx="0" fill="#8a3ffc"/><text x="1123.0" y="196.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">Flags on</text><text x="1123.0" y="214.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">Expert Review panel</text><text x="1123.0" y="232.0" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="middle">(inline, not modal)</text><rect x="980" y="300" width="280" height="90" rx="12" fill="#edf5ff"