<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient ID Card Scanning — OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', Arial, sans-serif; }
    .preview-banner {
      background: #0f62fe; color: #fff;
      padding: 6px 1rem; font-size: 12px; font-family: monospace;
      position: sticky; top: 0; z-index: 100;
    }
    .preview-content { padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }

    /* View tabs */
    .view-tab-bar {
      display: flex;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 1.5rem;
    }
    .view-tab {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      font-size: 0.875rem;
      border: none;
      background: none;
      color: #525252;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-family: inherit;
      transition: color 0.15s;
    }
    .view-tab:hover { color: #161616; }
    .view-tab.active {
      color: #0f62fe;
      border-bottom-color: #0f62fe;
      font-weight: 600;
    }

    /* Document grid */
    .doc-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 800px) {
      .doc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Thumbnail */
    .doc-thumbnail {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      margin-bottom: 0.75rem;
      font-size: 2.5rem;
      position: relative;
    }
    .doc-thumb-label {
      position: absolute;
      bottom: 6px; right: 6px;
      font-size: 0.65rem;
      background: rgba(0,0,0,0.45);
      color: #fff;
      padding: 1px 5px;
      border-radius: 2px;
      font-family: monospace;
    }

    /* Tile action row */
    .tile-actions {
      display: flex;
      gap: 0.25rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    /* Inline edit panel inside tile */
    .tile-edit-form {
      border-top: 1px solid #e0e0e0;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
    }

    /* Upload drag zone */
    .upload-zone {
      border: 2px dashed #8d8d8d;
      padding: 2rem 1.5rem;
      text-align: center;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-top: 0.75rem;
    }
    .upload-zone:hover, .upload-zone.dragging {
      border-color: #0f62fe;
      background: #edf5ff;
    }

    /* Success notification */
    .inline-success {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #defbe6;
      border-left: 3px solid #24a148;
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      color: #161616;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(22, 22, 22, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9000;
    }
    .modal-box {
      background: #fff;
      width: 600px;
      max-width: 92vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e0e0e0;
      background: #f4f4f4;
    }
    .modal-body { padding: 1.5rem 1.25rem; }
    .modal-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid #e0e0e0;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      background: #f4f4f4;
    }
    .doc-viewer-image {
      width: 100%;
      height: 280px;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 1rem;
      border: 1px solid #c6c6c6;
    }
    .doc-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .doc-meta-label { font-size: 0.75rem; color: #525252; margin-bottom: 2px; }
    .doc-meta-value { font-size: 0.875rem; color: #161616; }

    /* Page header */
    .page-header {
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .breadcrumb-row {
      display: flex;
      gap: 0.4rem;
      list-style: none;
      padding: 0; margin: 0 0 0.4rem 0;
      font-size: 0.8rem;
    }
    .breadcrumb-row a { color: #0f62fe; text-decoration: none; }
    .breadcrumb-row a:hover { text-decoration: underline; }
    .breadcrumb-row .sep { color: #8d8d8d; }

    /* Patient form stubs */
    .form-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 700px) {
      .form-grid-3 { grid-template-columns: 1fr 1fr; }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 2rem;
      background: #f4f4f4;
      margin-top: 1rem;
      color: #525252;
      font-size: 0.875rem;
      border: 1px dashed #c6c6c6;
    }

    /* Accordion overrides for custom rendering */
    .acc-heading {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem 1rem;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      color: #161616;
      border-top: 1px solid #e0e0e0;
      text-align: left;
    }
    .acc-heading:hover { background: #e8e8e8; }
    .acc-arrow {
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .acc-content { padding: 0.5rem 1rem 1.25rem 1rem; }

    /* Search results */
    .patient-docs-panel {
      background: #fff;
      border: 1px solid #c6c6c6;
      padding: 1rem;
      margin-top: 1rem;
    }
    .search-toolbar {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — Patient ID Card Scanning &nbsp;|&nbsp; OGC-66 &nbsp;|&nbsp; OpenELIS Design Mockup &nbsp;|&nbsp; Not a live application
  </div>
  <div class="preview-content" id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const t = (key, fallback) => fallback || key;

    /* ── Constants ────────────────────────────────────────────── */
    const DOC_TYPES = ['National ID', 'Insurance Card', 'Other'];

    const TAG_KINDS = { 'National ID': 'blue', 'Insurance Card': 'teal', 'Other': 'gray' };

    const INITIAL_DOCS = [
      {
        id: 1, type: 'National ID',
        uploadDate: '2025-11-14', uploadedBy: 'jsmith',
        size: '2.3 MB', color: '#d0e2ff', icon: '🪪',
        filename: 'national_id_front.jpg',
      },
      {
        id: 2, type: 'Insurance Card',
        uploadDate: '2025-11-14', uploadedBy: 'jsmith',
        size: '1.8 MB', color: '#d9fbfb', icon: '🏥',
        filename: 'cnaps_insurance.jpg',
      },
      {
        id: 3, type: 'Other', description: 'Vaccination certificate',
        uploadDate: '2025-10-05', uploadedBy: 'adiallo',
        size: '3.1 MB', color: '#e8daff', icon: '📄',
        filename: 'vaccination_cert.pdf',
      },
    ];

    const PATIENTS = [
      { id: 'P123456', lastName: 'Rakotomalala', firstName: 'Jean-Baptiste', gender: 'M', dob: '1985-03-15', healthId: 'H123456', docCount: 2 },
      { id: 'P234567', lastName: 'Rasendrahasina', firstName: 'Marie',        gender: 'F', dob: '1990-07-22', healthId: 'H234567', docCount: 0 },
      { id: 'P345678', lastName: 'Randrianandraina', firstName: 'Hery',       gender: 'M', dob: '1978-11-30', healthId: 'H345678', docCount: 3 },
      { id: 'P456789', lastName: 'Rabeharisoa',    firstName: 'Sylvie',       gender: 'F', dob: '2001-04-08', healthId: 'H456789', docCount: 1 },
    ];

    /* ── Small atoms ──────────────────────────────────────────── */
    function DocTag({ type }) {
      return (
        <span className={`cds--tag cds--tag--${TAG_KINDS[type] || 'gray'}`} style={{ fontSize: '0.72rem' }}>
          {t(`label.docType.${type}`, type)}
        </span>
      );
    }

    function ChevronIcon({ open }) {
      return (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"
          className="acc-arrow" style={{ transform: open ? 'rotate(90deg)' : 'rotate(0deg)' }}>
          <path d="M11 8L6 13 5.3 12.3 9.6 8 5.3 3.7 6 3z"/>
        </svg>
      );
    }

    /* ── Document Tile ────────────────────────────────────────── */
    function DocumentTile({ doc, onView, onDeleteRequest }) {
      const [editing, setEditing]   = useState(false);
      const [docType, setDocType]   = useState(doc.type);
      const [desc, setDesc]         = useState(doc.description || '');

      return (
        <div className="cds--tile" style={{ padding: '1rem', position: 'relative' }}>
          {/* Thumbnail */}
          <div className="doc-thumbnail" style={{ background: doc.color }}>
            <span>{doc.icon}</span>
            <span className="doc-thumb-label">{doc.filename.split('.').pop().toUpperCase()}</span>
          </div>

          {/* Type badge + filename */}
          <div style={{ marginBottom: '0.35rem' }}>
            <DocTag type={docType} />
          </div>
          <div style={{ fontSize: '0.75rem', color: '#525252', marginBottom: '0.2rem', wordBreak: 'break-all' }}>
            {doc.filename}
          </div>
          <div style={{ fontSize: '0.72rem', color: '#6f6f6f' }}>
            {t('label.uploaded', 'Uploaded')} {doc.uploadDate} · {doc.size}
          </div>
          {!editing && desc && (
            <div style={{ fontSize: '0.72rem', color: '#6f6f6f', fontStyle: 'italic', marginTop: '2px' }}>
              {desc}
            </div>
          )}

          {/* Action buttons — shown when not editing */}
          {!editing && (
            <div className="tile-actions">
              <button
                className="cds--btn cds--btn--ghost cds--btn--sm"
                style={{ padding: '0.25rem 0.5rem', minHeight: 'unset' }}
                onClick={() => onView(doc)}
              >
                👁 {t('button.view', 'View')}
              </button>
              <button
                className="cds--btn cds--btn--ghost cds--btn--sm"
                style={{ padding: '0.25rem 0.5rem', minHeight: 'unset' }}
                onClick={() => setEditing(true)}
              >
                ✏️ {t('button.edit', 'Edit')}
              </button>
              <button
                className="cds--btn cds--btn--ghost cds--btn--sm"
                style={{ padding: '0.25rem 0.5rem', minHeight: 'unset', color: '#da1e28' }}
                onClick={() => onDeleteRequest(doc)}
              >
                🗑 {t('button.delete', 'Delete')}
              </button>
            </div>
          )}

          {/* Inline edit form */}
          {editing && (
            <div className="tile-edit-form">
              <div className="cds--select" style={{ marginBottom: '0.75rem' }}>
                <label className="cds--label" style={{ fontSize: '0.75rem' }}>
                  {t('label.documentType', 'Document Type')} <span style={{ color: '#da1e28' }}>*</span>
                </label>
                <div className="cds--select-input-wrapper">
                  <select
                    className="cds--select-input"
                    value={docType}
                    onChange={e => setDocType(e.target.value)}
                    style={{ fontSize: '0.875rem' }}
                  >
                    {DOC_TYPES.map(dt => <option key={dt} value={dt}>{dt}</option>)}
                  </select>
                </div>
              </div>

              {(docType === 'Other') && (
                <div className="cds--form-item" style={{ marginBottom: '0.75rem' }}>
                  <div className="cds--text-input-wrapper">
                    <label className="cds--label" style={{ fontSize: '0.75rem' }}>
                      {t('label.description', 'Description')}
                    </label>
                    <input
                      className="cds--text-input"
                      value={desc}
                      onChange={e => setDesc(e.target.value)}
                      placeholder={t('placeholder.description', 'e.g., Vaccination certificate')}
                      style={{ fontSize: '0.875rem' }}
                    />
                  </div>
                </div>
              )}

              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <button
                  className="cds--btn cds--btn--primary cds--btn--sm"
                  style={{ minHeight: 'unset' }}
                  onClick={() => setEditing(false)}
                >
                  {t('button.save', 'Save')}
                </button>
                <button
                  className="cds--btn cds--btn--ghost cds--btn--sm"
                  style={{ minHeight: 'unset' }}
                  onClick={() => { setDocType(doc.type); setDesc(doc.description || ''); setEditing(false); }}
                >
                  {t('button.cancel', 'Cancel')}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── Upload Zone ──────────────────────────────────────────── */
    function UploadZone({ onUpload }) {
      const [dragging, setDragging] = useState(false);
      const [docType, setDocType]   = useState('National ID');

      return (
        <div style={{ background: '#fff', border: '1px solid #e0e0e0', padding: '1rem', marginTop: '0.75rem' }}>
          <div style={{ display: 'flex', gap: '1rem', alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: '0.75rem' }}>
            <div className="cds--select" style={{ minWidth: '200px' }}>
              <label className="cds--label">
                {t('label.documentType', 'Document Type')} <span style={{ color: '#da1e28' }}>*</span>
              </label>
              <div className="cds--select-input-wrapper">
                <select
                  className="cds--select-input"
                  value={docType}
                  onChange={e => setDocType(e.target.value)}
                >
                  {DOC_TYPES.map(dt => <option key={dt} value={dt}>{dt}</option>)}
                </select>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '0.5rem' }}>
              <button
                className="cds--btn cds--btn--tertiary cds--btn--sm"
                onClick={() => onUpload(docType)}
              >
                📷 {t('button.scanIdCard', 'Scan ID Card')}
              </button>
              <button
                className="cds--btn cds--btn--ghost cds--btn--sm"
                onClick={() => onUpload(docType)}
              >
                📋 {t('button.pasteClipboard', 'Paste from Clipboard')}
              </button>
            </div>
          </div>

          <div
            className={`upload-zone ${dragging ? 'dragging' : ''}`}
            onDragOver={e => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={e => { e.preventDefault(); setDragging(false); onUpload(docType); }}
            onClick={() => onUpload(docType)}
          >
            <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>📂</div>
            <p style={{ margin: '0 0 0.25rem', color: '#0f62fe', fontWeight: 600, fontSize: '0.875rem' }}>
              {t('label.dragDrop', 'Drag and drop files here or click to browse')}
            </p>
            <p style={{ margin: 0, fontSize: '0.75rem', color: '#525252' }}>
              {t('label.fileFormats', 'JPEG, PNG, PDF · Max 10 MB per file')}
            </p>
          </div>
        </div>
      );
    }

    /* ── Identification Documents Accordion Section ───────────── */
    function IdentificationDocumentsSection() {
      const [open, setOpen]             = useState(true);
      const [showUpload, setShowUpload] = useState(false);
      const [docs, setDocs]             = useState(INITIAL_DOCS);
      const [viewDoc, setViewDoc]       = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [notification, setNotification] = useState(null);

      function flash(msg) {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      }

      function handleUpload(type) {
        const icons = { 'National ID': '🪪', 'Insurance Card': '🏥', 'Other': '📄' };
        const colors = { 'National ID': '#d0e2ff', 'Insurance Card': '#d9fbfb', 'Other': '#e8daff' };
        setDocs(prev => [...prev, {
          id: Date.now(),
          type,
          uploadDate: '2026-04-13',
          uploadedBy: 'ciiams',
          size: '1.2 MB',
          color: colors[type],
          icon: icons[type],
          filename: `new_${type.toLowerCase().replace(/ /g, '_')}_${Date.now()}.jpg`,
        }]);
        setShowUpload(false);
        flash(`"${type}" document uploaded successfully.`);
      }

      function handleDelete(doc) {
        setDocs(prev => prev.filter(d => d.id !== doc.id));
        setDeleteTarget(null);
        flash(`"${doc.type}" document deleted. Audit record retained.`);
      }

      return (
        <>
          {/* Accordion Item */}
          <div style={{ border: '1px solid #e0e0e0', marginTop: '1.5rem' }}>
            <button className="acc-heading" onClick={() => setOpen(o => !o)} aria-expanded={open}>
              <span style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                {t('heading.identificationDocuments', 'Identification Documents')}
                {docs.length > 0 && (
                  <span className="cds--tag cds--tag--blue" style={{ fontSize: '0.72rem' }}>
                    {docs.length}
                  </span>
                )}
              </span>
              <ChevronIcon open={open} />
            </button>

            {open && (
              <div className="acc-content">
                {/* Success notification */}
                {notification && (
                  <div className="inline-success">
                    <span>✅</span>
                    <span>{notification}</span>
                  </div>
                )}

                {/* Toolbar */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <p style={{ margin: 0, fontSize: '0.875rem', color: '#525252' }}>
                    {docs.length === 0
                      ? t('message.noDocuments', 'No identification documents attached.')
                      : `${docs.length} document${docs.length !== 1 ? 's' : ''} attached`}
                  </p>
                  <button
                    className={`cds--btn cds--btn--sm ${showUpload ? 'cds--btn--secondary' : 'cds--btn--tertiary'}`}
                    onClick={() => setShowUpload(v => !v)}
                  >
                    {showUpload
                      ? `✕ ${t('button.cancelUpload', 'Cancel Upload')}`
                      : `+ ${t('button.addDocument', 'Add Document')}`}
                  </button>
                </div>

                {/* Upload zone */}
                {showUpload && <UploadZone onUpload={handleUpload} />}

                {/* Document grid */}
                {docs.length > 0 ? (
                  <div className="doc-grid">
                    {docs.map(doc => (
                      <DocumentTile
                        key={doc.id}
                        doc={doc}
                        onView={setViewDoc}
                        onDeleteRequest={setDeleteTarget}
                      />
                    ))}
                  </div>
                ) : (
                  !showUpload && (
                    <div className="empty-state">
                      <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>📋</div>
                      {t('message.emptyDocs', 'No identification documents attached to this patient.')}
                      <br />
                      <span style={{ fontSize: '0.8rem' }}>
                        {t('message.emptyDocsHint', 'Click "Add Document" above to attach a National ID, Insurance Card, or other document.')}
                      </span>
                    </div>
                  )
                )}
              </div>
            )}
          </div>

          {/* ── Document Viewer Modal ── */}
          {viewDoc && (
            <div className="modal-overlay" onClick={() => setViewDoc(null)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h4 style={{ margin: 0, fontSize: '1rem', fontWeight: 600 }}>
                    {t('heading.viewDocument', 'View Document')}
                  </h4>
                  <button
                    className="cds--btn cds--btn--ghost cds--btn--sm"
                    style={{ minHeight: 'unset', padding: '0.25rem 0.5rem' }}
                    onClick={() => setViewDoc(null)}
                  >✕</button>
                </div>
                <div className="modal-body">
                  <div className="doc-viewer-image">
                    <span style={{ fontSize: '5rem' }}>{viewDoc.icon}</span>
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center', marginBottom: '0.75rem' }}>
                    <DocTag type={viewDoc.type} />
                    <span style={{ fontSize: '0.875rem', color: '#525252' }}>{viewDoc.filename}</span>
                  </div>
                  <div className="doc-meta-row">
                    <div>
                      <div className="doc-meta-label">{t('label.uploadDate', 'Upload Date')}</div>
                      <div className="doc-meta-value">{viewDoc.uploadDate}</div>
                    </div>
                    <div>
                      <div className="doc-meta-label">{t('label.uploadedBy', 'Uploaded By')}</div>
                      <div className="doc-meta-value">{viewDoc.uploadedBy}</div>
                    </div>
                    <div>
                      <div className="doc-meta-label">{t('label.fileSize', 'File Size')}</div>
                      <div className="doc-meta-value">{viewDoc.size}</div>
                    </div>
                    <div>
                      <div className="doc-meta-label">{t('label.mimeType', 'Format')}</div>
                      <div className="doc-meta-value">{viewDoc.filename.split('.').pop().toUpperCase()}</div>
                    </div>
                  </div>
                  {viewDoc.description && (
                    <div style={{ marginTop: '0.75rem', padding: '0.75rem', background: '#f4f4f4' }}>
                      <div className="doc-meta-label">{t('label.description', 'Description')}</div>
                      <div className="doc-meta-value">{viewDoc.description}</div>
                    </div>
                  )}
                  <p style={{ fontSize: '0.75rem', color: '#8d8d8d', marginTop: '1rem', marginBottom: 0 }}>
                    {t('message.viewAudit', 'This view has been logged in the audit trail.')}
                  </p>
                </div>
                <div className="modal-footer">
                  <button
                    className="cds--btn cds--btn--ghost cds--btn--sm"
                    onClick={() => setViewDoc(null)}
                  >{t('button.close', 'Close')}</button>
                  <button className="cds--btn cds--btn--primary cds--btn--sm">
                    ⬇ {t('button.download', 'Download')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ── Delete Confirmation Modal ── */}
          {deleteTarget && (
            <div className="modal-overlay">
              <div className="modal-box" style={{ maxWidth: '480px' }}>
                <div className="modal-header" style={{ background: '#fff2f2' }}>
                  <h4 style={{ margin: 0, fontSize: '1rem', fontWeight: 600, color: '#da1e28' }}>
                    {t('heading.deleteDocument', 'Delete Document?')}
                  </h4>
                </div>
                <div className="modal-body">
                  <p style={{ margin: '0 0 0.75rem' }}>
                    Are you sure you want to delete the{' '}
                    <strong>{deleteTarget.type}</strong> document ({deleteTarget.filename})?
                  </p>
                  <p style={{ margin: 0, fontSize: '0.875rem', color: '#525252' }}>
                    {t('message.softDelete', 'The record will be retained in the audit trail for compliance purposes, but will no longer appear in the patient record.')}
                  </p>
                </div>
                <div className="modal-footer">
                  <button
                    className="cds--btn cds--btn--ghost cds--btn--sm"
                    onClick={() => setDeleteTarget(null)}
                  >{t('button.cancel', 'Cancel')}</button>
                  <button
                    className="cds--btn cds--btn--danger cds--btn--sm"
                    onClick={() => handleDelete(deleteTarget)}
                  >🗑 {t('button.confirmDelete', 'Delete Document')}</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    /* ── Add/Edit Patient View ────────────────────────────────── */
    function AddEditPatientView() {
      return (
        <div>
          {/* Patient Information section stub */}
          <h5 style={{ margin: '0 0 0.75rem', fontSize: '0.875rem', fontWeight: 600, color: '#161616', borderBottom: '1px solid #e0e0e0', paddingBottom: '0.4rem' }}>
            {t('heading.patientInfo', 'Patient Information')}
          </h5>
          <div className="form-grid-3">
            {[
              ['label.lastName',    'Last Name',   'Rakotomalala'],
              ['label.firstName',   'First Name',  'Jean-Baptiste'],
              ['label.dateOfBirth', 'Date of Birth','1985-03-15'],
              ['label.gender',      'Gender',      'Male'],
              ['label.healthId',    'Health ID',   'H123456'],
              ['label.phone',       'Phone',       '+261 34 56 789'],
            ].map(([key, label, val]) => (
              <div key={key} className="cds--form-item">
                <div className="cds--text-input-wrapper">
                  <label className="cds--label" style={{ fontSize: '0.75rem' }}>{t(key, label)}</label>
                  <input className="cds--text-input" defaultValue={val} style={{ fontSize: '0.875rem' }} />
                </div>
              </div>
            ))}
          </div>

          {/* Additional Information stub */}
          <div style={{ border: '1px solid #e0e0e0', marginTop: '0.5rem' }}>
            <button className="acc-heading" style={{ fontWeight: 400, color: '#525252' }}>
              <span>{t('heading.additionalInfo', 'Additional Information')}</span>
              <ChevronIcon open={false} />
            </button>
          </div>

          {/* ★ Identification Documents — the new section ★ */}
          <IdentificationDocumentsSection />

          {/* Save row */}
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.5rem', marginTop: '1.5rem', paddingTop: '1rem', borderTop: '1px solid #e0e0e0' }}>
            <button className="cds--btn cds--btn--ghost cds--btn--sm">
              {t('button.cancel', 'Cancel')}
            </button>
            <button className="cds--btn cds--btn--secondary cds--btn--sm">
              {t('button.saveAndAddOrder', 'Save and Add Order')}
            </button>
            <button className="cds--btn cds--btn--primary cds--btn--sm">
              {t('button.savePatient', 'Save Patient')}
            </button>
          </div>
        </div>
      );
    }

    /* ── Patient Search View ──────────────────────────────────── */
    function PatientSearchView() {
      const [expanded, setExpanded] = useState(null);

      return (
        <div>
          {/* Search toolbar */}
          <div className="search-toolbar">
            <div className="cds--text-input-wrapper" style={{ flex: 1, maxWidth: '420px' }}>
              <label className="cds--label" style={{ fontSize: '0.75rem' }}>
                {t('label.searchPatient', 'Search patients')}
              </label>
              <input
                className="cds--text-input"
                placeholder={t('placeholder.searchPatient', 'Last name, first name, Health ID…')}
                defaultValue="Rako"
                style={{ fontSize: '0.875rem' }}
              />
            </div>
            <button className="cds--btn cds--btn--primary cds--btn--sm">
              {t('button.search', 'Search')}
            </button>
          </div>

          {/* Results table */}
          <div className="cds--data-table-container">
            <div className="cds--data-table-header">
              <h4 className="cds--data-table-header__title">{t('heading.patientResults', 'Patient Results')}</h4>
              <p className="cds--data-table-header__description">
                {t('message.resultCount', `${PATIENTS.length} patients found`)}
              </p>
            </div>
            <table className="cds--data-table">
              <thead>
                <tr>
                  <th><span className="cds--table-header-label">{t('label.lastName',   'Last Name')}</span></th>
                  <th><span className="cds--table-header-label">{t('label.firstName',  'First Name')}</span></th>
                  <th><span className="cds--table-header-label">{t('label.gender',     'Gender')}</span></th>
                  <th><span className="cds--table-header-label">{t('label.dob',        'Date of Birth')}</span></th>
                  <th><span className="cds--table-header-label">{t('label.healthId',   'Health ID')}</span></th>
                  <th><span className="cds--table-header-label">{t('label.idDocuments','ID Documents')}</span></th>
                  <th><span className="cds--table-header-label">{t('label.actions',    'Actions')}</span></th>
                </tr>
              </thead>
              <tbody>
                {PATIENTS.map(p => (
                  <tr key={p.id}>
                    <td>{p.lastName}</td>
                    <td>{p.firstName}</td>
                    <td>{p.gender}</td>
                    <td>{p.dob}</td>
                    <td><span style={{ fontFamily: 'monospace', fontSize: '0.875rem' }}>{p.healthId}</span></td>
                    <td>
                      {p.docCount > 0 ? (
                        <button
                          className="cds--btn cds--btn--ghost cds--btn--sm"
                          style={{ padding: '0.2rem 0.5rem', minHeight: 'unset' }}
                          onClick={() => setExpanded(expanded === p.id ? null : p.id)}
                          title={t('label.viewDocuments', 'Click to preview attached documents')}
                        >
                          <span className="cds--tag cds--tag--blue" style={{ fontSize: '0.72rem', cursor: 'pointer' }}>
                            📄 {p.docCount}
                          </span>
                        </button>
                      ) : (
                        <span style={{ color: '#8d8d8d', fontSize: '0.875rem' }}>—</span>
                      )}
                    </td>
                    <td>
                      <div style={{ display: 'flex', gap: '0.25rem' }}>
                        <button className="cds--btn cds--btn--primary cds--btn--sm" style={{ minHeight: 'unset', padding: '0.25rem 0.75rem' }}>
                          {t('button.select', 'Select')}
                        </button>
                        <button className="cds--btn cds--btn--ghost cds--btn--sm" style={{ minHeight: 'unset', padding: '0.25rem 0.5rem' }}>
                          {t('button.edit', 'Edit')}
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Document preview panel — expands below table row */}
          {expanded && (() => {
            const patient = PATIENTS.find(p => p.id === expanded);
            const patientDocs = INITIAL_DOCS.slice(0, patient.docCount);
            return (
              <div className="patient-docs-panel">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem' }}>
                  <h5 style={{ margin: 0, fontSize: '0.875rem', fontWeight: 600 }}>
                    {t('heading.documentsFor', 'Documents for')} {patient.firstName} {patient.lastName}
                    <span className="cds--tag cds--tag--blue" style={{ marginLeft: '0.5rem', fontSize: '0.72rem' }}>
                      {patientDocs.length}
                    </span>
                  </h5>
                  <button
                    className="cds--btn cds--btn--ghost cds--btn--sm"
                    style={{ minHeight: 'unset', padding: '0.25rem 0.5rem' }}
                    onClick={() => setExpanded(null)}
                  >✕ {t('button.close', 'Close')}</button>
                </div>

                <div className="doc-grid" style={{ gridTemplateColumns: 'repeat(3, minmax(0, 1fr))' }}>
                  {patientDocs.map(doc => (
                    <div key={doc.id} className="cds--tile" style={{ padding: '0.75rem' }}>
                      <div className="doc-thumbnail" style={{ background: doc.color, height: '80px' }}>
                        <span>{doc.icon}</span>
                        <span className="doc-thumb-label">{doc.filename.split('.').pop().toUpperCase()}</span>
                      </div>
                      <div style={{ margin: '0.35rem 0' }}><DocTag type={doc.type} /></div>
                      <div style={{ fontSize: '0.72rem', color: '#6f6f6f' }}>{doc.uploadDate}</div>
                      <button className="cds--btn cds--btn--ghost cds--btn--sm" style={{ minHeight: 'unset', padding: '0.25rem 0.5rem', marginTop: '0.5rem' }}>
                        👁 {t('button.view', 'View')}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    /* ── App Shell ────────────────────────────────────────────── */
    function App() {
      const [activeTab, setActiveTab] = useState(0);

      const TABS = [
        t('tab.addEditPatient', 'Add / Edit Patient'),
        t('tab.patientSearch',  'Patient Search'),
      ];

      return (
        <div>
          {/* Page header */}
          <div className="page-header">
            <ol className="breadcrumb-row">
              <li><a href="#">{t('nav.testRequest', 'Test Request')}</a></li>
              <li className="sep">/</li>
              <li><a href="#">{t('nav.patientInfo', 'Patient Info')}</a></li>
            </ol>
            <h1 style={{ margin: 0, fontSize: '1.5rem', fontWeight: 600, color: '#161616' }}>
              {t('heading.patientManagement', 'Patient Management')}
            </h1>
            <p style={{ margin: '0.2rem 0 0', color: '#525252', fontSize: '0.875rem' }}>
              {t('heading.featureSub', 'Identification Document Scanning — OGC-66')}
            </p>
          </div>

          {/* Tab bar */}
          <div className="view-tab-bar">
            {TABS.map((label, i) => (
              <button
                key={i}
                className={`view-tab ${activeTab === i ? 'active' : ''}`}
                onClick={() => setActiveTab(i)}
              >
                {label}
              </button>
            ))}
          </div>

          {/* Tab content */}
          <div className="cds--tile" style={{ padding: '1.5rem' }}>
            {activeTab === 0 && <AddEditPatientView />}
            {activeTab === 1 && <PatientSearchView />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
