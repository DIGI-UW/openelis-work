<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Redesign: OpenELIS Preview</title>
<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
 :root{--blue:#0f62fe;--blue-hover:#0353e9;--blue-10:#edf5ff;--gray-10:#f4f4f4;--gray-20:#e0e0e0;--gray-30:#c6c6c6;--gray-50:#8d8d8d;--gray-60:#6f6f6f;--gray-70:#525252;--gray-80:#393939;--gray-100:#161616;--red:#da1e28;--red-10:#fff1f1;--green:#24a148;--white:#fff}
 *{box-sizing:border-box}
 body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--gray-100);background:var(--white)}
 .ic{width:16px;height:16px;flex:none}
 .tile .ic{width:20px;height:20px;color:var(--gray-70)}
 .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
 .bnr{background:var(--blue);color:#fff;font:12px 'IBM Plex Mono',ui-monospace,monospace;padding:6px 16px;display:flex;gap:16px;flex-wrap:wrap}
 .hdr{background:var(--gray-100);color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;font-size:14px}
 .hdr b{font-weight:600}
 .hdr .sp{flex:1}
 .shell{display:flex;min-height:calc(100vh - 78px)}
 .nav{width:272px;flex:none;background:var(--gray-10);border-right:1px solid var(--gray-20);padding:8px 0 24px;overflow-y:auto;max-height:calc(100vh - 78px);position:sticky;top:0}
 .nav .pin{display:block;padding:10px 16px;font-size:14px;color:var(--gray-80);cursor:pointer;border:0;background:none;width:100%;text-align:left}
 .nav .pin:hover{background:var(--gray-20)}
 .nav h2{font-size:12px;letter-spacing:.32px;text-transform:none;color:var(--gray-70);font-weight:600;margin:16px 16px 4px;padding-top:12px;border-top:1px solid var(--gray-20)}
 .nav .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 16px;font-size:14px;color:var(--gray-80);cursor:pointer;font-family:inherit;border-left:3px solid transparent}
 .nav .it:hover{background:var(--gray-20);color:var(--gray-100)}
 .nav .it.on{background:var(--gray-20);border-left-color:var(--blue);color:var(--gray-100);font-weight:600}
 .nav .it .ic{width:16px;height:16px;flex:none;color:var(--gray-70)}
 .nav .it .chev{margin-left:auto;font-size:11px;color:var(--gray-60)}
 .nav .ch{padding-left:42px;font-size:13.5px}
 .nav .trans{font-size:11px;color:var(--gray-60);margin-left:4px}
 main{flex:1;min-width:0;padding:16px 32px 64px}
 .crumb{font-size:12px;color:var(--gray-70);margin-bottom:8px}
 .crumb a{color:var(--blue);text-decoration:none;cursor:pointer}
 .crumb span.t{color:var(--gray-70)}
 h1{font-size:28px;font-weight:400;margin:0 0 4px}
 .sub{color:var(--gray-70);font-size:14px;margin:0 0 20px;max-width:72ch}
 .btn{font:14px 'IBM Plex Sans',system-ui,sans-serif;border:0;cursor:pointer;padding:0 16px;height:32px;display:inline-flex;align-items:center;gap:6px}
 .btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-hover)}
 .btn.sec{background:var(--gray-80);color:#fff}
 .btn.gh{background:none;color:var(--blue)}.btn.gh:hover{background:var(--gray-20)}
 .btn.dan{background:var(--red);color:#fff}
 .btn[disabled]{background:var(--gray-30);color:var(--gray-50);cursor:not-allowed}
 .btn.sm{height:28px;padding:0 12px;font-size:13px}
 .tag{display:inline-flex;align-items:center;font-size:12px;padding:1px 8px;border-radius:12px;background:var(--gray-20);color:var(--gray-80);margin-left:6px;white-space:nowrap}
 .tag.blue{background:#d0e2ff;color:#0043ce}.tag.red{background:#ffd7d9;color:#a2191f}.tag.green{background:#a7f0ba;color:#0e6027}.tag.purple{background:#e8daff;color:#6929c4}
 input.ti,select.ti,textarea.ti{font:14px 'IBM Plex Sans',system-ui,sans-serif;background:var(--gray-10);border:0;border-bottom:1px solid var(--gray-50);height:36px;padding:0 12px;min-width:240px;color:var(--gray-100)}
 textarea.ti{height:72px;padding:8px 12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;width:100%}
 input.ti:focus,select.ti:focus,textarea.ti:focus{outline:2px solid var(--blue);outline-offset:-2px}
 .search{position:relative;flex:1;min-width:260px;max-width:520px}
 .search input{width:100%;height:40px;padding-left:36px}
 .search .mag{position:absolute;left:10px;top:11px;color:var(--gray-60)}
 .seg{display:inline-flex;border:1px solid var(--gray-80)}
 .seg button{font:14px 'IBM Plex Sans',system-ui,sans-serif;border:0;background:#fff;padding:0 16px;height:38px;cursor:pointer;color:var(--gray-80)}
 .seg button.on{background:var(--gray-100);color:#fff}
 .tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
 .tog .sw{width:40px;height:22px;border-radius:11px;background:var(--gray-50);position:relative;transition:.15s;flex:none}
 .tog .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
 .tog.on .sw{background:var(--green)}.tog.on .sw::after{left:21px}
 .tog.dis{opacity:.45;cursor:not-allowed}
 .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:5}
 .count{font-size:13px;color:var(--gray-70)}
 .count a{color:var(--blue);cursor:pointer;margin-left:6px}
 .note{display:flex;gap:10px;padding:12px 16px;border-left:3px solid var(--blue);background:var(--blue-10);font-size:14px;margin:8px 0 16px;align-items:flex-start}
 .note.warn{border-left-color:#f1c21b;background:#fcf4d6}.note.err{border-left-color:var(--red);background:var(--red-10)}
 .note b{font-weight:600}
 .cols{display:flex;gap:28px;align-items:flex-start}
 .areas{width:232px;flex:none;position:sticky;top:64px}
 .areas .lab{font-size:12px;color:var(--gray-70);margin:4px 0 6px}
 .areas button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:7px 10px;font:14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;color:var(--gray-80);text-align:left;border-left:2px solid transparent}
 .areas button:hover{background:var(--gray-10)}
 .areas button.on{border-left-color:var(--blue);background:var(--gray-10);font-weight:600;color:var(--gray-100)}
 .areas button .n{color:var(--gray-60);font-weight:400;font-size:12.5px}
 .list{flex:1;min-width:0}
 .ah{font-size:12px;letter-spacing:.32px;text-transform:uppercase;color:var(--gray-70);font-weight:600;padding:20px 0 6px;border-bottom:1px solid var(--gray-30);display:flex;justify-content:space-between}
 .row{border-bottom:1px solid var(--gray-20);padding:12px 12px 12px 16px;position:relative}
 .row.mk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
 .row .top{display:flex;gap:12px;align-items:flex-start}
 .row .main{flex:1;min-width:0}
 .row .lbl{font-size:14px;font-weight:600}
 .row .desc{font-size:13.5px;color:var(--gray-70);margin-top:2px}
 .row .mks{font-size:13px;color:var(--red);margin-top:4px;font-weight:500}
 .row .val{font-size:14px;text-align:right;min-width:140px;max-width:300px;word-break:break-word}
 .row .dflt{font-size:12px;color:var(--gray-60)}
 .row.open{background:var(--gray-10)}
 .mem{display:grid;grid-template-columns:minmax(160px,260px) 1fr;gap:4px 16px;font-size:13.5px;margin-top:8px;max-width:640px}
 .mem .k{color:var(--gray-70);word-break:break-word}
 .mem span{min-width:0;overflow-wrap:anywhere}
 .exp{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-20)}
 .fld{display:grid;grid-template-columns:220px 1fr;gap:8px 16px;align-items:center;margin:10px 0;max-width:760px}
 .fld label{font-size:13px;color:var(--gray-80)}
 .fld .help{grid-column:2;font-size:12px;color:var(--gray-60);margin-top:-4px}
 .guide{font-size:13.5px;color:var(--gray-80);line-height:1.55;max-width:78ch;margin:4px 0 8px}
 .meta{font-size:12px;color:var(--gray-60);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
 .meta a{color:var(--blue);cursor:pointer}
 .foot{display:flex;gap:8px;align-items:center;margin-top:14px;position:sticky;bottom:0;background:var(--gray-10);padding:10px 0}
 .foot .sp{flex:1}
 .lnk{border-bottom:1px solid var(--gray-20);padding:12px 16px;display:flex;justify-content:space-between;font-size:14px}
 .lnk a{color:var(--blue);cursor:pointer}
 .empty{padding:40px 16px;text-align:center;color:var(--gray-70);font-size:14px}
 .empty a{color:var(--blue);cursor:pointer}
 .toast{position:fixed;top:92px;right:24px;background:var(--gray-100);color:#fff;padding:12px 16px;font-size:14px;border-left:3px solid var(--green);z-index:50;display:flex;gap:16px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
 .toast a{color:#78a9ff;cursor:pointer}
 .scrim{position:fixed;inset:0;background:rgba(22,22,22,.5);display:flex;align-items:center;justify-content:center;z-index:60}
 .modal{background:#fff;width:min(560px,92vw);box-shadow:0 4px 16px rgba(0,0,0,.3)}
 .modal .mb{padding:16px 16px 24px}
 .modal .lab{font-size:12px;color:var(--gray-70)}
 .modal h3{font-size:20px;font-weight:400;margin:4px 0 12px}
 .modal p{font-size:14px;line-height:1.5;margin:0 0 12px}
 .modal .mf{display:flex}
 .modal .mf .btn{flex:1;height:56px;align-items:flex-start;padding-top:14px}
 .modal.dng h3{color:var(--red)}
 .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:8px 0 8px}
 .tile{background:var(--gray-10);padding:16px;cursor:pointer;border:1px solid transparent;min-height:96px}
 .tile:hover{background:var(--gray-20)}
 .tile .tt{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
 .tile .td{font-size:13px;color:var(--gray-70);margin-top:6px}
 .tile .tk{font-size:12.5px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}
 .tile .tk a{color:var(--blue);cursor:pointer}
 .sec h2{font-size:16px;font-weight:600;margin:24px 0 2px}
 .sec .sd{font-size:13px;color:var(--gray-70);margin-bottom:8px}
 table.dt{width:100%;border-collapse:collapse;font-size:14px}
 table.dt th{background:var(--gray-20);text-align:left;font-weight:600;padding:10px 12px;font-size:13px}
 table.dt td{padding:10px 12px;border-bottom:1px solid var(--gray-20);vertical-align:middle}
 table.dt tr.inact td{color:var(--gray-60)}
 table.dt tr.open>td{background:var(--gray-10)}
 table.dt td.act{white-space:nowrap;text-align:right}
 .tile2{background:#fff;border:1px solid var(--gray-20);padding:16px;margin-bottom:16px}
 .tile2 h3{font-size:16px;font-weight:600;margin:0 0 10px}
 .radio{display:flex;gap:24px;font-size:14px;align-items:center;flex-wrap:wrap}
 .radio label{display:flex;gap:6px;align-items:center;cursor:pointer}
 .thumb{width:72px;height:72px;border:1px dashed var(--gray-50);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gray-60);background:#fff}
 .thumb.sig{width:144px;height:36px}
 .img{display:flex;gap:16px;align-items:center;margin:8px 0}
 .tree .node{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--gray-20);font-size:14px;position:relative}
 .tree .node.chg{background:var(--blue-10)}
 .tree .node.chg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
 .tree .node.sec{background:var(--gray-10);font-size:12px;letter-spacing:.32px;text-transform:uppercase;font-weight:600;color:var(--gray-70)}
 .tree .tw{width:18px;border:0;background:none;cursor:pointer;color:var(--gray-70);font-size:12px}
 .tree .eid{font:12px 'IBM Plex Mono',ui-monospace,monospace;color:var(--gray-60)}
 .tree .sp{flex:1}
 .tree .hb{font-size:12px;color:var(--gray-60);font-style:italic}
 .stick{position:sticky;bottom:0;background:var(--gray-100);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;margin-top:12px;z-index:5}
 .stick .sp{flex:1}
 .reg{display:grid;grid-template-columns:180px 1fr;gap:10px 20px;font-size:14px;max-width:880px;margin-top:8px}
 .reg .k{color:var(--gray-70);font-size:13px}
 .hist{background:#fff;border:1px solid var(--gray-20);padding:8px 12px;margin-top:10px;font-size:13px;max-width:640px}
 .hist div{padding:4px 0;border-bottom:1px solid var(--gray-10)}
 .pager{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--gray-70);padding:8px 12px;background:var(--gray-10)}
 a:focus,button:focus{outline:2px solid var(--blue);outline-offset:-2px}
 @media (max-width:900px){.nav{display:none}.cols{flex-direction:column}.areas{width:100%;position:static}main{padding:16px}}
</style>
</head>

l","src":"Site Information","type":"text","area":"patients","life":"S","comp":"Address & geographic labels","mark":"","switch":false,"secret":false,"file":false,"label":"Address line 2","default":"Camp/Commune","desc":"label name for a place","governs":false},{"key":"Address line 3 label","src":"Site Information","type":"text","area":"patients","life":"S","comp":"Address & geographic labels","mark":"","switch":false,"secret":false,"file":false,"label":"Address line 3","default":"Town","desc":"label name for a place","governs":false},{"key":"allowLanguageChange","src":"Site Information","type":"boolean","area":"lang","life":"R","comp":"Language & date defaults","mark":"","switch":false,"secret":false,"file":false,"label":"Allow language change at login","default":"true","desc":"Lets each user pick their language on the sign-in page.","governs":false},{"key":"bannerHeading","src":"Site Information","type":"text (per language)","area":"identity","life":"R","comp":"","mark":"","switch":false,"secret":false,"file":false,"label":"Banner heading","default":"2 [Test LIMS (en / fr)]","desc":"The laboratory name in the header bar at the top of every screen.","governs":false},{"key":"BarCodeType","src":"Site Information","type":"choice: BARCODE, QR","area":"labels","life":"S","comp":"","mark":"","switch":false,"secret":false,"file":false,"label":"Barcode symbology","default":"BARCODE","desc":"Configure Bar Code Type","governs":false},{"key":"boxLabelPrefix","src":"Site Information","type":"text","area":"labels","life":"S","comp":"","mark":"","switch":false,"secret":false,"file":false,"label":"Shipping box label prefix","default":"BOX","desc":"Prefix used for shipping box label IDs (e.g., BOX, SHP). Format: PREFIX-YYYY-NNNN","governs":false},{"key":"consentRequiredForCollection","src":"Site Information","type":"boolean","area":"orders","life":"R","comp":"","mark":"","switch":false,"secret":false,"file":false,"label":"Require consent before collection","default":"false","desc":" /* find the path of a route in NAV, for the breadcrumb */
function findPath(route) {
  for (const s of NAV) for (const it of s.items) {
    if (it.route === route) return { item: it, group: null, section: s };
    if (it.children) for (const c of it.children) if (c.route === route) return { item: c, group: it, section: s };
  }
  return null;
}

function Crumb({ route, go, extra }) {

    <div className="crumb">
      <a onClick={() => go('')}>{t('home.label', 'Home')}</a> / <a onClick={() => go('')}>{t('breadcrums.admin.managment', 'Admin Management')}</a>
      {p && p.group && <> / <span className="t">{p.group.label}</span></>}
      {p && <> / {extra ? <a onClick={() => go(route)}>{p.item.label}</a> : <span className="t">{p.item.label}</span>}</>}
      {extra && <> / <span className="t">{extra}</span></>}
    </div>
  );
}
function Header({ route, go, title, sub }) {
  return (<><Crumb route={route} go={go} /><h1>{title}</h1><p className="sub">{sub}</p></>);
}
function Toggle({ on, onChange, label, disabled }) {
  return (
    <span className={'tog' + (on ? ' on' : '') + (disabled ? ' dis' : '')} role="switch" aria-checked={on} tabIndex={0}
      onClick={() => !disabled && onChange(!on)} onKeyDown={(e) => { if (!disabled && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); onChange(!on); } }}>
      <span className="sw" />{label && <span>{label}</span>}
    </span>
  );
}
function Modal({ danger, label, title, children, primary, onPrimary, onCancel, primaryDisabled }) {
  return (
    <div className="scrim" onClick={onCancel}>
      <div className={'modal' + (danger ? ' dng' : '')} role="dialog" aria-modal="true" onClick={(e) => e.stopPropagation()}>
        <div className="mb">{label && <div className="lab">{label}</div>}<h3>{title}</h3>{children}</div>
        <div className="mf"><button className="btn sec" onClick={onCancel} autoFocus>{t('common.cancel', 'Cancel')}</button>
          <button className={'btn ' + (danger ? 'dan' : 'pri')} disabled={primaryDisabled} onClick={onPrimary}>{primary}</button></div>
      </div>
    </div>
  );
}
function useToast() {
  const [toast, setToast] = useState(null);
  const show = (msg, action) => { setToast({ msg, action }); };
  useEffect(() => { if (!toast) return; const h = setTimeout(() => setToast(null), toast.action ? 10000 : 5000); return () => clearTimeout(h); }, [toast]);
  const node = toast && <div className="toast" role="status" aria-live="polite"><span>{toast.msg}</span>{toast.action && <a onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</a>}</div>;
  return [node, show];
}

    for (const a of AREAS) for (const s of all.filter((x) => x.area === a[0])) {
      if (s.comp) { const id = a[0] + ':' + s.comp; if (!seen[id]) { seen[id] = { id, area: a[0], title: s.comp, members: [], life: s.life }; out.push(seen[id]); } seen[id].members.push(s); if (s.life === 'R') seen[id].life = 'R'; }
      else out.push({ id: s.key, area: a[0], title: s.label, members: [s], life: s.life, single: true });
    }
    return out;
  }, []);
  const qq = q.trim().toLowerCase();
  const matchQ = (u) => !qq || u.title.toLowerCase().includes(qq) || u.members.some((s) => [s.key, s.label, s.desc, GUIDE[s.key] || ''].some((x) => (x || '').toLowerCase().includes(qq)));
  const inLife = (u) => life === 'A' || u.members.some((s) => s.life === life);
  const isSw = (u) => u.members.some((s) => s.switch);
  const visible = units.filter((u) => (qq ? true : inLife(u)) && matchQ(u) && (!switches || isSw(u)) && (!area || u.area === area));
  const inViewHits = qq ? visible.filter(inLife) : visible;
  const nSettings = (us) => us.reduce((a, u) => a + u.members.length, 0);
  const totalInView = nSettings(units.filter((u) => inLife(u) && (!switches || isSw(u))));
  const outside = qq ? units.filter((u) => matchQ(u) && !inLife(u)) : [];

  const startEdit = (u) => {
    const dirty = open && Object.keys(draft).length > 0;
    if (dirty) { setGuard(open === u.id ? { id: null } : u); return; }
    setOpen(u.id === open ? null : u.id); setDraft({}); setHist(null);
  };
  const doSave = (u) => {
    const changed = u.members.filter((s) => s.key in draft && JSON.stringify(draft[s.key]) !== JSON.stringify(curOf(s, store)));
    const marked = changed.find((s) => s.mark);
    if (marked && !confirm) { setConfirm({ u, s: marked }); setTyped(''); return; }
    const next = { ...store }; changed.forEach((s) => { next[s.key] = draft[s.key]; }); setStore(next);
    setOpen(null); setDraft({}); setConfirm(null);
    toast(u.single ? `Saved ${u.title}.` : `Saved ${changed.length} of ${u.members.length} settings.`);
  };

  const control = (s) => {
    const v = s.key in draft ? draft[s.key] : curOf(s, store);
    const set = (x) => setDraft({ ...draft, [s.key]: x });
    if (s.file) return <span className="mono" style={{ fontSize: 13 }}>{fmt(s, v)} <span className="tag">Server file</span></span>;
    if (s.secret) return <span>{v ? 'Set' : 'Not set'} <input className="ti" type="password" placeholder="Replace password" style={{ minWidth: 200, marginLeft: 8 }} onChange={(e) => set(e.target.value ? '__set__' : v)} /></span>;
    if (s.type === 'boolean') return <Toggle on={v === 'true'} onChange={(x) => set(x ? 'true' : 'false')} label={v === 'true' ? 'On' : 'Off'} />;
    if (s.type.startsWith('choice')) { const o = OPTIONS[s.key] || s.type.replace('choice: ', '').split(', '); return <select className="ti" value={v} onChange={(e) => set(e.target.value)}>{o.map((x) => <option key={x}>{x}</option>)}</select>; }
    if (s.type === 'number') return <input className="ti" type="number" value={v} style={{ minWidth: 120, width: 140 }} onChange={(e) => set(e.target.value)} />;
    if (s.type.startsWith('text (per')) return <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{['en', 'fr'].map((l) => <input key={l} className="ti" aria-label={l === 'en' ? 'English' : 'French'} placeholder={l === 'en' ? 'English' : 'French'} value={v[l]} onChange={(e) => set({ ...v, [l]: e.target.value })} />)}</span>;
    if (s.type.includes('JSON')) return <textarea className="ti" value={v} onChange={(e) => set(e.target.value)} />;
    return <input className="ti" value={v} onChange={(e) => set(e.target.value)} />;
  };

  const blockOff = (u) => { const sw = u.members.find((s) => s.governs && s.type === 'boolean' && !s.file); if (!sw) return null; const v = sw.key in draft ? draft[sw.key] : curOf(sw, store); return v === 'true' ? null : sw; };

  const renderUnit = (u) => {
    const marked = u.members.find((s) => s.mark);
    const s0 = u.members[0];
    const isOpen = open === u.id;
    const allFile = u.members.every((s) => s.file);
    const offSw = blockOff(u);
    const atDefault = u.members.every((s) => JSON.stringify(curOf(s, store)) === JSON.stringify(dfl(s)) || s.file);
    return (
      <div key={u.id} className={'row' + (marked ? ' mk' : '') + (isOpen ? ' open' : '')} id={'set-' + u.id}>
        <div className="top">
          <div className="main">
            <div className="lbl">{u.title}
              {(qq || life === 'A' || area) && life !== u.life && <span className="tag">{u.life === 'R' ? 'Routine' : 'Setup'}</span>}
              {life === 'S' && atDefault && <span className="tag">Default</span>}
              {u.members.some((s) => s.switch) && <span className="tag purple">Module switch</span>}
              {qq && <span className="tag">{AREAS.find((a) => a[0] === u.area)[1]}</span>}
            </div>
            <div className="desc">{u.single ? (s0.desc || (s0.file ? 'Server property, read-only here.' : '')) : (BLOCKDESC[u.title] || `${u.members.length} settings that are set together.`)}</div>
            {marked && <div className="mks">{marked.mark}</div>}
            {!u.single && !isOpen && <div className="mem">{u.members.map((s) => <React.Fragment key={s.key}><span className="k">{s.label}</span><span>{fmt(s, curOf(s, store))}</span></React.Fragment>)}</div>}
          </div>
          {u.single && !isOpen && <div className="val">{fmt(s0, curOf(s0, store))}{!s0.file && !s0.secret && JSON.stringify(curOf(s0, store)) !== JSON.stringify(dfl(s0)) && <div className="dflt">Default: {fmt(s0, dfl(s0))}</div>}</div>}
          <button className="btn gh sm" aria-expanded={isOpen} onClick={() => startEdit(u)}>{allFile ? t('common.view', 'View') : t('common.edit', 'Edit')}</button>
        </div>
        {isOpen && (
          <div className="exp">
            {u.single && GUIDE[s0.key] && <p className="guide">{GUIDE[s0.key]}</p>}
            {allFile && <div className="note" style={{ margin: '4px 0 8px' }}>{t('admin.configuration.serverFile', "Set in the server's properties file. Ask your server administrator to change it.")}</div>}
            {offSw && <div className="note warn" style={{ margin: '4px 0 8px' }}>Turn on {offSw.label} to set the other settings in this block.</div>}
            {u.members.map((s) => (
              <div className="fld" key={s.key}>
                <label htmlFor={s.key}>{s.label}{s.mark && !u.single && <div style={{ color: 'var(--red)', fontSize: 12 }}>{s.mark}</div>}</label>
                <div style={{ opacity: offSw && offSw !== s ? .45 : 1, pointerEvents: offSw && offSw !== s ? 'none' : 'auto' }}>{control(s)}</div>
                <div className="help mono">{s.key} · Default: {s.file ? (s.default || '(blank)') : fmt(s, dfl(s))} · Was on {s.src}{s.file && <> · <a style={{ color: 'var(--blue)', cursor: 'pointer' }} onClick={() => toast('Copied ' + s.key)}>Copy key</a></>}</div>
              </div>))}
            <div className="meta"><a onClick={() => setHist(hist === u.id ? null : u.id)}>{t('admin.common.history', 'History')}</a><a onClick={() => toast('Link copied: /MasterListsPage/configuration?' + (u.single ? 'setting=' + encodeURIComponent(s0.key) : 'block=' + encodeURIComponent(u.id)))}>Copy link</a></div>
            {hist === u.id && <div className="hist"><div><b>2026-09-14 10:22</b> · m.kila changed {s0.label} from {s0.type === 'boolean' ? 'Off to On' : '"' + (s0.default || 'blank') + '" to "' + fmt(s0, curOf(s0, store)) + '"'}</div><div><b>2026-03-02 08:05</b> · installer set the value at installation</div></div>}
            {!allFile && <div className="foot"><button className="btn pri" onClick={() => doSave(u)}>{t('common.save', 'Save')}</button><button className="btn gh" onClick={() => { if (Object.keys(draft).length) setGuard({ id: null }); else { setOpen(null); setDraft({}); } }}>{t('common.cancel', 'Cancel')}</button></div>}
          </div>)}
      </div>
    );
  };

  const shownAreas = AREAS.filter((a) => !area || a[0] === area);
  return (
    <div>
      {toastNode}
      <Header route="configuration" go={go} title={t('admin.configuration.title', 'Configuration')} sub={t('admin.configuration.subtitle', 'Every laboratory setting in one place. Search, or narrow the list by area.')} />
      <div className="toolbar">
        <div className="search"><span className="mag">{IC.search}</span><input className="ti" value={q} onChange={(e) => setQ(e.target.value)} placeholder={t('admin.configuration.search', 'Search by name, description or key')} aria-label="Search settings" /></div>
        <div className="seg" role="group" aria-label="Lifecycle">{[['R', 'Routine'], ['S', 'Setup'], ['A', 'All']].map(([k, l]) => <button key={k} className={life === k ? 'on' : ''} aria-pressed={life === k} onClick={() => setLife(k)}>{l}</button>)}</div>
        <label className="tog" style={{ gap: 6 }}><input type="checkbox" checked={switches} onChange={(e) => setSwitches(e.target.checked)} /> {t('admin.configuration.switchesOnly', 'Module switches only')}</label>
      </div>
      <div className="count" style={{ marginBottom: 8 }}>
        {qq ? <>{nSettings(visible)} settings match "{q}" across all areas and lifecycles<a onClick={() => setQ('')}>Clear search</a></>
          : (life !== 'A' || switches || area) ? <>Showing {nSettings(visible)} of {all.length} settings<a onClick={() => { setLife('A'); setSwitches(false); setArea(null); }}>Show all</a></> : <>All {all.length} settings</>}
      </div>
      <div className="cols">
        <div className="areas" aria-label="Areas filter">
          <div className="lab">{t('admin.configuration.areas', 'Areas')}</div>
          <button className={!area ? 'on' : ''} onClick={() => setArea(null)}><span>All areas</span><span className="n">{totalInView} of {all.length}</span></button>
          {AREAS.map((a) => { const n = nSettings(units.filter((u) => u.area === a[0] && inLife(u) && (!switches || isSw(u)))); const N = all.filter((s) => s.area === a[0]).length;
            return <button key={a[0]} className={area === a[0] ? 'on' : ''} onClick={() => setArea(a[0])}><span>{a[1]}</span><span className="n">{n} of {N}</span></button>; })}
        </div>
        <div className="list">
          {visible.length === 0 && <div className="empty">No settings match "{q}". <a onClick={() => setQ('')}>Clear search</a></div>}
          {qq && life !== 'A' && inViewHits.length === 0 && visible.length > 0 && <div className="note">No {life === 'R' ? 'routine' : 'setup'} settings match "{q}". {nSettings(visible)} {life === 'R' ? 'setup' : 'routine'} setting{nSettings(visible) > 1 ? 's match' : ' matches'}:</div>}
          {shownAreas.map((a) => {
            const us = visible.filter((u) => u.area === a[0]); if (!us.length) return null;
            const N = all.filter((s) => s.area === a[0]).length;
            return (<div key={a[0]}>
              <div className="ah"><span>{a[1]}</span><span>{nSettings(us)} of {N}</span></div>
              {us.map((u) => renderUnit(u))}
              {!qq && (AREA_LINKS[a[0]] || []).map(([l, r]) => <div className="lnk" key={r}><span>{l}<span className="desc" style={{ marginLeft: 8, color: 'var(--gray-60)', fontSize: 13 }}>Its own page</span></span><a onClick={() => go(r)}>Open {l}</a></div>)}
            </div>);
          })}
        </div>
      </div>
      {guard && <Modal label="Unsaved changes" title={t('admin.common.discard.title', 'Discard changes?')} primary={t('admin.common.discard.confirm', 'Discard')} danger onCancel={() => setGuard(null)} onPrimary={() => { setOpen(guard.id); setDraft({}); setGuard(null); }}><p>{t('admin.common.discard.body', 'Your changes have not been saved.')}</p></Modal>}
      {confirm && <Modal danger label={confirm.s.label} title={t('admin.configuration.confirm.title', 'Confirm this change')} primary={t('common.save', 'Save')} primaryDisabled={typed !== confirm.s.label} onCancel={() => setConfirm(null)} onPrimary={() => doSave(confirm.u)}>
        <p><b>{confirm.s.mark}.</b></p><p>{t('admin.common.typeToConfirm', 'Type "{0}" to confirm').replace('{0}', confirm.s.label)}</p>
        <input className="ti" style={{ width: '100%' }} value={typed} onChange={(e) => setTyped(e.target.value)} aria-label="Type the setting name" /></Modal>}
    </div>
  );
}

];
function flat(nodes, path, out) { nodes.forEach((n) => { const p = [...path, n.l]; out.push({ ...n, path: p }); if (n.kids) flat(n.kids, p, out); }); return out; }

function MenuConfig({ go, route }) {
  const [q, setQ] = useState('');
  const [show, setShow] = useState('all');
  const [exp, setExp] = useState(() => new Set(TREE.map((s) => s.s)));
  const [base, setBase] = useState(() => Object.fromEntries(flat(TREE.flatMap((s) => s.kids), [], []).map((n) => [n.e, !!n.on])));
  const [pend, setPend] = useState({});

  const val = (e) => (e in pend ? pend[e] : base[e]);

  const all = flat(TREE.flatMap((s) => s.kids.map((k) => ({ ...k, sec: s.s }))), [], []);
  const qq = q.toLowerCase();
  const hit = (n) => !qq || n.l.toLowerCase().includes(qq) || n.e.includes(qq);
  const subtreeHit = (n) => hit(n) || (n.kids || []).some(subtreeHit);
  const passShow = (n) => show === 'all' || (show === 'on' ? val(n.e) : !val(n.e)) || (n.kids || []).some(passShow);
  const toggle = (n, x) => setPend({ ...pend, [n.e]: x });
  const countOn = (n) => `${(n.kids || []).filter((k) => val(k.e)).length} of ${(n.kids || []).length} on`;
  const Node = ({ n, depth, hiddenBy }) => {
    if (!subtreeHit(n) || !passShow(n)) return null;
    const isExp = qq ? true : exp.has(n.e);
    const changed = n.e in pend && pend[n.e] !== base[n.e];
    return (<>
      <div className={'node' + (changed ? ' chg' : '')} style={{ paddingLeft: 12 + depth * 24 }}>
        {n.kids ? <button className="tw" aria-expanded={isExp} onClick={() => { const s = new Set(exp); isExp ? s.delete(n.e) : s.add(n.e); setExp(s); }}>{isExp ? '▾' : '▸'}</button> : <span style={{ width: 18 }} />}
        <span>{n.l}</span><span className="eid">{n.e}</span>
        {n.kids && <span className="tag">{countOn(n)}</span>}
        {changed && <span className="tag blue">Changed</span>}
        <span className="sp" />
        {hiddenBy ? <span className="hb">Hidden by {hiddenBy}</span> : null}
        {n.lock ? <span className="hb" title="locked">{t('admin.menuConfig.locked', 'Switching this off would remove the way into Admin.')}</span> : null}
        <Toggle on={val(n.e)} disabled={!!n.lock} onChange={(x) => toggle(n, x)} />
      </div>
      {n.kids && isExp && n.kids.map((k) => <Node key={k.e} n={k} depth={depth + 1} hiddenBy={hiddenBy || (!val(n.e) ? n.l : null)} />)}
    </>);
  };
  const pathOf = (e) => all.find((n) => n.e === e).path.join(' › ');
  const matchCount = qq ? all.filter(hit).length : null;
  return (
    <div>
      {toastNode}
      <Header route={route} go={go} title={label} sub={`Switch ${label === 'Main Menu' ? 'main menu' : label.toLowerCase().replace(' menu', '')} entries on or off. Changes are reviewed together before they are saved.`} />
      <div className="toolbar">
        <div className="search"><span className="mag">{IC.search}</span><input className="ti" value={q} onChange={(e) => setQ(e.target.value)} placeholder={t('admin.menuConfig.search', 'Search menu entries')} aria-label="Search menu entries" /></div>
        <select className="ti" style={{ minWidth: 140 }} value={show} onChange={(e) => setShow(e.target.value)} aria-label="Show"><option value="all">Show: All</option><option value="on">Show: On</option><option value="off">Show: Off</option></select>
        <button className="btn gh sm" onClick={() => setExp(new Set([...TREE.map((s) => s.s), ...all.filter((n) => n.kids).map((n) => n.e)]))}>{t('admin.menuConfig.expandAll', 'Expand all')}</button>
        <button className="btn gh sm" onClick={() => setExp(new Set())}>{t('admin.menuConfig.collapseAll', 'Collapse all')}</button>
        {matchCount !== null && <span className="count">{matchCount} {matchCount === 1 ? 'match' : 'matches'}</span>}
      </div>
      <div className="tree" style={{ border: '1px solid var(--gray-20)' }}>
        {TREE.map((s) => {
          const kids = s.kids.filter((k) => subtreeHit(k) && passShow(k)); if (!kids.length) return null;
          const isExp = qq ? true : exp.has(s.s);
          return (<React.Fragment key={s.s}>
            {s.s && <div className="node sec"><button className="tw" aria-expanded={isExp} onClick={() => { const x = new Set(exp); isExp ? x.delete(s.s) : x.add(s.s); setExp(x); }}>{isExp ? '▾' : '▸'}</button>{s.s}</div>}
            {(isExp || !s.s) && kids.map((k) => <Node key={k.e} n={k} depth={1} />)}
          </React.Fragment>);
        })}
      </div>
      {flips.length > 0 && <div className="stick"><span>{flips.length} change{flips.length > 1 ? 's' : ''}</span><span className="sp" /><button className="btn gh" style={{ color: '#fff' }} onClick={() => setPend({})}>{t('admin.menuConfig.discard', 'Discard')}</button><button className="btn pri" onClick={() => setReview(true)}>{t('admin.menuConfig.review', 'Review and save')}</button></div>}
      {review && <Modal label={label} title={`Save ${flips.length} menu change${flips.length > 1 ? 's' : ''}?`} primary={t('common.save', 'Save')} onCancel={() => setReview(false)} onPrimary={() => { const b = { ...base }; flips.forEach((e) => { b[e] = pend[e]; }); setBase(b); setPend({}); setReview(false); toast(`Saved ${flips.length} menu changes. Users see them the next time a page loads.`); }}>
        {['on', 'off'].map((w) => { const xs = flips.filter((e) => (w === 'on') === pend[e]); return xs.length ? <div key={w}><p style={{ fontWeight: 600, margin: '8px 0 4px' }}>{w === 'on' ? 'Turned on' : 'Turned off'}</p>{xs.map((e) => <p key={e} style={{ margin: '0 0 4px' }}>{pathOf(e)}</p>)}</div> : null; })}
      </Modal>}
    </div>
  );
}

      <div className="fld"><label>Billing entry</label><Toggle on={on} onChange={setOn} label={on ? 'On' : 'Off'} /></div>
      <div className="note" style={{ margin: '8px 0' }}>{saved.url && saved.on ? 'Billing shows in the main menu.' : 'Billing is hidden from the main menu: ' + (!saved.url ? 'no address is set.' : 'the entry is off.')}</div>
      <div className="foot" style={{ background: '#fff' }}><button className="btn pri" disabled={bad} onClick={() => { setSaved({ url, on }); toast('Saved Billing Menu.'); }}>Save</button><button className="btn gh" onClick={() => { setUrl(saved.url); setOn(saved.on); }}>Cancel</button></div>
    </div></div>);
}

/* ---------------- Report Management (§13) ---------------- */
const REPORTS = [
  { n: 'Patient Status Report', c: 'Clinical', tpl: 'patient_letter / patient_a4', cfg: true },
  { n: 'Pathology Report', c: 'Clinical', tpl: 'PatientPathologyReport' }, { n: 'Cytology Report', c: 'Clinical', tpl: 'PatientCytologyReport' },
  { n: 'TB Report', c: 'Clinical', tpl: 'PatientTBReport' }, { n: 'Activity Report by Test', c: 'Management', tpl: 'ActivityReportByTest' },
  { n: 'Turnaround Time', c: 'Management', tpl: 'TurnaroundTime' }, { n: 'Environmental Compliance Report', c: 'Environmental', tpl: 'LaporanHasil' },
];
function ReportManagement({ go }) {
  const [paper, setPaper] = useState('A4'); const [pn, setPn] = useState(true); const [savedD, setSavedD] = useState({ paper: 'A4', pn: true });
  const [q, setQ] = useState(''); const [showAll, setShowAll] = useState(false); const [open, setOpen] = useState(false); const [hist, setHist] = useState(false);
  const [lines, setLines] = useState({ title: 'Chief Scientist', given: 'Rose', sur: 'Kila', info: 'Lock Bag 3, Boroko, NCD · +675 324 8200' });
  const [toastNode, toast] = useToast();
  const rows = REPORTS.filter((r) => (showAll || r.cfg) && (!q || (r.n + r.c).toLowerCase().includes(q.toLowerCase())));
  const hidden = REPORTS.filter((r) => !r.cfg).length;
  const dirtyD = paper !== savedD.paper || pn !== savedD.pn;
  return (<div>{toastNode}
    <Header route="reportManagement" go={go} title={t('admin.reports.title', 'Report Management')} sub={t('admin.reports.subtitle', 'Choose how OpenELIS prints reports for this lab.')} />
    <div className="tile2"><h3>{t('admin.reports.defaults.title', 'Print defaults')}</h3>
      <div className="fld"><label>Paper size</label><div className="radio" role="radiogroup">{[['LETTER', 'US Letter (8.5 × 11 in)'], ['A4', 'A4 (210 × 297 mm)']].map(([k, l]) => <label key={k}><input type="radio" name="paper" checked={paper === k} onChange={() => setPaper(k)} />{l}</label>)}</div>
        <div className="help">Applies to every report that has a Letter and an A4 layout.</div></div>
      <div className="fld"><label>Page numbers on other reports</label><Toggle on={pn} onChange={setPn} label={pn ? 'On' : 'Off'} /><div className="help">For reports still managed in code. The patient report always numbers its pages.</div></div>
      <div className="foot" style={{ background: '#fff' }}><button className="btn pri" disabled={!dirtyD} onClick={() => { setSavedD({ paper, pn }); toast('Print defaults saved. New reports use them from now on.'); }}>Save</button><button className="btn gh" disabled={!dirtyD} onClick={() => { setPaper(savedD.paper); setPn(savedD.pn); }}>Cancel</button></div>
    </div>
    <div className="toolbar"><div className="search"><span className="mag">{IC.search}</span><input className="ti" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search reports" aria-label="Search reports" /></div>
      <label className="tog" style={{ gap: 6 }}><input type="checkbox" checked={showAll} onChange={(e) => setShowAll(e.target.checked)} /> Show not configurable</label></div>
    {!showAll && <div className="count" style={{ marginBottom: 8 }}>{hidden} reports are managed in code and hidden.</div>}
    <table className="dt"><thead><tr><th>Report</th><th>Category</th><th>Template</th><th></th></tr></thead><tbody>
      {rows.map((r) => (<React.Fragment key={r.n}>
        <tr className={r.cfg && open ? 'open' : ''}><td>{r.n}</td><td><span className="tag" style={{ marginLeft: 0 }}>{r.c}</span></td>
          <td><span className="mono" style={{ fontSize: 13 }}>{r.tpl}</span>{r.cfg ? <><span className="tag">Shipped default</span><span className="tag">{savedD.paper === 'A4' ? 'A4' : 'Letter'}</span></> : <span className="tag">Managed in code</span>}{!r.cfg && <span className="tag">Letter only</span>}</td>
          <td className="act">{r.cfg && <button className="btn gh sm" aria-expanded={open} onClick={() => setOpen(!open)}>{open ? 'Close' : 'Edit'}</button>}</td></tr>
        {r.cfg && open && <tr className="open"><td colSpan={4}>
          <h3 style={{ fontSize: 14, margin: '8px 0' }}>Header and branding</h3>
          <div className="img"><div className="thumb">CPHL logo</div><div><div style={{ fontSize: 13 }}>Left header logo</div><div className="help" style={{ fontSize: 12, color: 'var(--gray-60)' }}>Square works best, at least 300 × 300 px. Other shapes are scaled to fit the square.</div><button className="btn gh sm">Replace</button><button className="btn gh sm">Remove</button></div></div>
          <div className="img"><div className="thumb">NDoH crest</div><div><div style={{ fontSize: 13 }}>Right header logo</div><button className="btn gh sm">Replace</button><button className="btn gh sm">Remove</button></div></div>
          <div className="img"><div className="thumb sig">signature</div><div><div style={{ fontSize: 13 }}>Lab director signature</div><div style={{ fontSize: 12, color: 'var(--gray-60)' }}>At least 800 × 200 px on a white background.</div><button className="btn gh sm">Replace</button><button className="btn gh sm">Remove</button></div></div>
          <h3 style={{ fontSize: 14, margin: '16px 0 4px' }}>Header lines</h3>
          <div className="fld"><label>Lab name</label><span>Central Public Health Laboratory <a style={{ color: 'var(--blue)', cursor: 'pointer', marginLeft: 8, fontSize: 13 }} onClick={() => go('configuration?setting=SiteName')}>Edit in Configuration</a></span></div>
          {[['title', 'Lab director title'], ['given', 'Lab director given name'], ['sur', 'Lab director surname'], ['info', 'Additional site information line']].map(([k, l]) => <div className="fld" key={k}><label>{l}</label><input className="ti" style={{ width: '100%' }} value={lines[k]} onChange={(e) => setLines({ ...lines, [k]: e.target.value })} /></div>)}
          <div className="fld"><label></label><span style={{ fontSize: 12, color: 'var(--gray-60)' }}>Pages are always numbered "Page x of y".</span></div>
          <h3 style={{ fontSize: 14, margin: '16px 0 4px' }}>Accreditation</h3>
          <p style={{ fontSize: 13.5, margin: '0 0 4px' }}>Active accrediting bodies: PNG NATA (ISO 15189). <a style={{ color: 'var(--blue)', cursor: 'pointer' }}>Manage accreditation</a></p>
          <p style={{ fontSize: 12.5, color: 'var(--gray-60)', margin: 0 }}>Marks print in the report header, up to three. Results outside the accredited scope are marked with †.</p>
          <h3 style={{ fontSize: 14, margin: '16px 0 4px' }}>Signatures</h3><p style={{ fontSize: 13.5, color: 'var(--gray-70)', margin: 0 }}>Electronic signature settings will appear here.</p>
          <div className="meta"><a onClick={() => setHist(!hist)}>History</a></div>
          {hist && <div className="hist"><div><b>2026-09-30 14:02</b> · r.kila changed Paper size from US Letter to A4</div><div><b>2026-09-30 13:58</b> · r.kila replaced Left header logo</div></div>}
          <div className="foot"><button className="btn pri" onClick={() => { setOpen(false); toast('Report settings saved.'); }}>Save</button><button className="btn gh" onClick={() => setOpen(false)}>Cancel</button></div>
        </td></tr>}
      </React.Fragment>))}
      {!rows.length && <tr><td colSpan={4}><div className="empty">No reports match your search.</div></td></tr>}
    </tbody></table>
  </div>);
}

/* ---------------- Provider Titles: reference type B list after its consistency pass (§8.3 to §8.8) ---------------- */
const TITLES0 = [
  { id: 1, n: 'Doctor', d: 'Dr', o: 1, used: 214, on: true }, { id: 2, n: 'Professor', d: 'Prof', o: 2, used: 7, on: true },
  { id: 3, n: 'Health Extension Officer', d: 'HEO', o: 3, used: 58, on: true }, { id: 4, n: 'Nursing Sister', d: 'Sr', o: 4, used: 96, on: true },
  { id: 5, n: 'Nursing Officer', d: 'NO', o: 5, used: 22, on: true }, { id: 6, n: 'Community Health Worker', d: 'CHW', o: 6, used: 31, on: true },
  { id: 7, n: 'Mister', d: 'Mr', o: 7, used: 0, on: false }, { id: 8, n: 'Missus', d: 'Mrs', o: 8, used: 0, on: false },
];
function ProviderTitles({ go }) {
  const [rows, setRows] = useState(TITLES0); const [status, setStatus] = useState('active'); const [q, setQ] = useState('');
  const [open, setOpen] = useState(null); const [draft, setDraft] = useState(null); const [guard, setGuard] = useState(null); const [inUse, setInUse] = useState(null); const [hist, setHist] = useState(null);
  const [toastNode, toast] = useToast();
  const vis = rows.filter((r) => (status === 'all' || (status === 'active' ? r.on : !r.on)) && (!q || (r.n + ' ' + r.d).toLowerCase().includes(q.toLowerCase())));
  const dirty = draft && open && (open === 'new' ? (draft.n || draft.d) : JSON.stringify(draft) !== JSON.stringify(rows.find((r) => r.id === open)));
  const openRow = (id) => { if (dirty && id !== open) { setGuard(id); return; } setOpen(id); setDraft(id === 'new' ? { n: '', d: '', o: rows.length + 1, used: 0, on: true } : { ...rows.find((r) => r.id === id) }); setHist(null); };
  const save = () => {
    if (!draft.n.trim()) return;
    if (open === 'new') { const id = Date.now(); setRows([{ ...draft, id }, ...rows]); toast(`Saved provider title ${draft.n}.`); }
    else { setRows(rows.map((r) => (r.id === open ? { ...draft } : r))); toast(`Saved provider title ${draft.n}.`); }
    setOpen(null); setDraft(null);
  };
  const setActive = (r, on) => {
    if (!on && r.used > 0) { setInUse(r); return; }
    setRows(rows.map((x) => (x.id === r.id ? { ...x, on } : x)));
    if (!on) toast(`${r.n} switched off.`, { label: 'Undo', fn: () => setRows((rs) => rs.map((x) => (x.id === r.id ? { ...x, on: true } : x))) });
  };
  const form = () => (<td colSpan={5}>
    <div className="fld"><label htmlFor="pt-n">Title</label><input id="pt-n" className="ti" autoFocus value={draft.n} onChange={(e) => setDraft({ ...draft, n: e.target.value })} />{!draft.n.trim() && <div className="help" style={{ color: 'var(--red)' }}>Enter a title.</div>}</div>
    <div className="fld"><label htmlFor="pt-d">Abbreviation</label><input id="pt-d" className="ti" style={{ minWidth: 120, width: 160 }} value={draft.d} onChange={(e) => setDraft({ ...draft, d: e.target.value })} /></div>
    <div className="fld"><label htmlFor="pt-o">Sort order</label><input id="pt-o" type="number" className="ti" style={{ minWidth: 100, width: 120 }} value={draft.o} onChange={(e) => setDraft({ ...draft, o: e.target.value })} /></div>
    {open !== 'new' && <div className="meta"><span>Used by {draft.used} providers</span><a onClick={() => setHist(hist ? null : open)}>History</a></div>}
    {hist && <div className="hist"><div><b>2026-08-11 09:40</b> · j.wanpis changed Abbreviation from "Dr." to "Dr"</div><div><b>2026-02-03 15:12</b> · installer created the title</div></div>}
    <div className="foot"><button className="btn pri" disabled={!draft.n.trim()} onClick={save}>Save</button><button className="btn gh" onClick={() => { setOpen(null); setDraft(null); }}>Cancel</button></div>
  </td>);
  return (<div>{toastNode}
    <Header route="providerTitleMenu" go={go} title="Provider Titles" sub="The titles shown with a provider's name on orders and reports." />
    <div className="note"><span><b>Reference page for the admin standard.</b> Provider Titles is shown after its consistency pass (register O-10): Status filter, Add as an open row, Active switch and Edit on every row, editing in place, History, no modal except the in-use confirmation.</span></div>
    <div className="toolbar">
      <div className="search"><span className="mag">{IC.search}</span><input className="ti" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search titles" aria-label="Search titles" /></div>
      <select className="ti" style={{ minWidth: 150 }} value={status} onChange={(e) => setStatus(e.target.value)} aria-label="Status"><option value="active">Status: Active</option><option value="inactive">Status: Inactive</option><option value="all">Status: All</option></select>
      <span style={{ flex: 1 }} /><button className="btn pri" onClick={() => openRow('new')}>Add provider title</button>
    </div>
    {(q || status !== 'active') && <div className="count" style={{ marginBottom: 8 }}>Showing {vis.length} of {rows.length}<a onClick={() => { setQ(''); setStatus('active'); }}>Clear filters</a></div>}
    <table className="dt"><thead><tr><th>Title</th><th>Abbreviation</th><th>Sort order</th><th>Providers</th><th style={{ textAlign: 'right' }}>Active</th></tr></thead><tbody>
      {open === 'new' && <tr className="open">{form()}</tr>}
      {vis.map((r) => (<React.Fragment key={r.id}>
        <tr className={(r.on ? '' : 'inact') + (open === r.id ? ' open' : '')}><td>{r.n}{!r.on && <span className="tag">Inactive</span>}</td><td>{r.d}</td><td>{r.o}</td><td>{r.used}</td>
          <td className="act"><Toggle on={r.on} onChange={(x) => setActive(r, x)} /> <button className="btn gh sm" aria-expanded={open === r.id} onClick={() => openRow(r.id)}>Edit</button></td></tr>
        {open === r.id && <tr className="open">{form()}</tr>}
      </React.Fragment>))}
      {!vis.length && <tr><td colSpan={5}><div className="empty">No titles match {q ? `"${q}"` : 'this status'}. <a onClick={() => { setQ(''); setStatus('active'); }}>Clear filters</a></div></td></tr>}
    </tbody></table>
    {guard && <Modal danger label="Unsaved changes" title="Discard changes?" primary="Discard" onCancel={() => setGuard(null)} onPrimary={() => { const g = guard; setGuard(null); setOpen(g); setDraft(g === 'new' ? { n: '', d: '', o: rows.length + 1, used: 0, on: true } : { ...rows.find((r) => r.id === g) }); }}><p>Your changes to the open title have not been saved.</p></Modal>}
    {inUse && <Modal label="Provider title" title={`Switch off ${inUse.n}?`} primary="Switch off" danger onCancel={() => setInUse(null)} onPrimary={() => { setRows(rows.map((x) => (x.id === inUse.id ? { ...x, on: false } : x))); toast(`${inUse.n} switched off.`); setInUse(null); }}><p>Used by {inUse.used} providers. They keep it, but it can no longer be chosen for a new provider.</p></Modal>}
  </div>);
}

/* ---------------- Register view for pages specified elsewhere (Part C) ---------------- */
function RegisterPage({ route, go }) {
  const p = findPath(route); const r = regFor(route) || {};
  const trans = p && (p.item.trans || (p.group && p.group.trans));
  return (<div>
    <Header route={route} go={go} title={p ? p.item.label : route} sub={`/MasterListsPage/${route}`} />
    {trans && <div className="note"><span>These settings are also in Configuration, where you can search all settings. <a style={{ color: 'var(--blue)', cursor: 'pointer' }} onClick={() => go('configuration')}>Open in Configuration</a></span></div>}
    {r.disp !== 'Specified here' && <div className="note warn"><span>This preview does not redraw this page. It shows the page's entry in the register (§9, row {regNo(route)}): what it is, the spec that governs it, and what it must change to meet the admin standard.</span></div>}
    <div className="reg">
      <span className="k">Register</span><span>{regNo(route)}</span>
      <span className="k">Sidebar path</span><span>{p ? [p.section.label, p.group && p.group.label, p.item.label].filter(Boolean).join(' › ') : ''}</span>
      <span className="k">Route</span><span className="mono">/MasterListsPage/{route}</span>
      <span className="k">Page type</span><span>{r.type}</span>
      <span className="k">On develop</span><span>{r.dev}</span>
      <span className="k">Governing spec</span><span>{r.spec}</span>
      <span className="k">Disposition</span><span><b>{r.disp}</b></span>
      <span className="k">Gaps against Part B</span><span>{r.gaps}</span>
    </div>
  </div>);
}

/* ---------------- App shell ---------------- */
function Sidebar({ route, go }) {
  const [openG, setOpenG] = useState(() => { const p = findPath(route.split('?')[0]); return new Set(p && p.group ? [p.group.label] : []); });
  useEffect(() => { const p = findPath(route.split('?')[0]); if (p && p.group) setOpenG((s) => new Set([...s, p.group.label])); }, [route]);
  const r0 = route.split('?')[0];
  const act = (r) => route === r || (r === 'configuration' && r0 === 'configuration');
  return (
    <nav className="nav" aria-label="Admin">
      <button className="pin" onClick={() => go('')}>← Back to main menu</button>
      {NAV.map((s) => (<div key={s.id}><h2>{s.label}</h2>
        {s.items.map((it) => it.children ? (<div key={it.label}>
          <button className="it" aria-expanded={openG.has(it.label)} onClick={() => { const x = new Set(openG); x.has(it.label) ? x.delete(it.label) : x.add(it.label); setOpenG(x); }}>{IC[it.icon]}<span>{it.label}{it.trans && <span className="trans">merging</span>}</span><span className="chev">{openG.has(it.label) ? '▾' : '▸'}</span></button>
          {openG.has(it.label) && it.children.map((c) => <button key={c.route} className={'it ch' + (act(c.route) ? ' on' : '')} aria-current={act(c.route) ? 'page' : undefined} onClick={() => go(c.route)}>{c.label}</button>)}
        </div>) : (
          <button key={it.label} className={'it' + (act(it.route) ? ' on' : '')} aria-current={act(it.route) ? 'page' : undefined} onClick={() => go(it.route)}>{IC[it.icon]}<span>{it.label}{it.trans && <span className="trans">merging</span>}</span></button>))}
      </div>))}
      <h2 style={{ borderTop: '1px solid var(--gray-20)' }}> </h2>
      <button className="pin">Legacy Admin ↗</button>
    </nav>
  );
}

function App() {
  const [route, setRoute] = useState('configuration');
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };
  useEffect(() => { document.getElementById('route').textContent = '/MasterListsPage' + (route ? '/' + route : ''); }, [route]);
  const r0 = route.split('?')[0]; const qs = new URLSearchParams(route.split('?')[1] || '');
  let page;
  if (r0 === '') page = <AdminHome go={go} />;
  else if (r0 === 'configuration') page = <Configuration key={route} go={go} initialQ={qs.get('q') || ''} initialSetting={qs.get('setting') || ''} />;
  else if (r0 === 'reportManagement') page = <ReportManagement go={go} />;
  else if (r0 === 'globalMenuManagement') page = <MenuConfig key={r0} go={go} route={r0} />;
  else if (r0 === 'billingMenuManagement') page = <BillingMenu go={go} />;
  else if (r0 === 'providerTitleMenu') page = <ProviderTitles go={go} />;
  else page = <RegisterPage key={route} route={route} go={go} />;
  return (<>
    <div className="hdr"><b>OpenELIS Global</b><span style={{ color: '#c6c6c6' }}>Central Public Health Laboratory</span><span className="sp" /><span>English</span><span>r.kila</span></div>
    <div className="shell"><Sidebar route={route} go={go} /><main>{page}</main></div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
