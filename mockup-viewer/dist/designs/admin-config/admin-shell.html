<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Shell — Preview</title>

  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    :root { --rail-w: 256px; --header-h: 48px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #f4f4f4; color: #161616; }

    /* Fake OpenELIS header (visual anchor only) */
    .app-header {
      height: var(--header-h); background: #161616; color: #fff;
      display: flex; align-items: center; padding: 0 1rem; gap: 1rem;
      position: sticky; top: 0; z-index: 50;
    }
    .app-header .brand { font-size: 0.875rem; font-weight: 500; letter-spacing: 0.04em; }
    .app-header .brand .sub { opacity: 0.7; font-weight: 400; margin-left: 0.5rem; }
    .app-header .spacer { flex: 1; }
    .app-header .user-chip {
      font-size: 0.8125rem; opacity: 0.85; padding: 0.25rem 0.5rem; border: 1px solid #393939;
    }

    /* Layout */
    .layout { display: flex; min-height: calc(100vh - var(--header-h)); }
    .rail {
      width: var(--rail-w); flex: 0 0 var(--rail-w);
      background: #fff; border-right: 1px solid #e0e0e0;
      display: flex; flex-direction: column;
      position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h));
      overflow-y: auto;
    }
    .main { flex: 1; padding: 1.5rem 2rem; max-width: 100%; overflow-x: auto; }

    /* Rail header */
    .rail-title {
      padding: 1rem 1rem 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.06em;
      color: #525252; text-transform: uppercase;
    }

    /* Rail item */
    .rail-bucket {
      display: flex; align-items: center; width: 100%;
      padding: 0.625rem 1rem; font-size: 0.875rem; color: #161616;
      background: transparent; border: 0; border-left: 3px solid transparent;
      cursor: pointer; text-align: left; font-family: inherit;
      transition: background 0.08s;
    }
    .rail-bucket:hover { background: #e5e5e5; }
    .rail-bucket.current { background: #edf5ff; border-left-color: #0f62fe; font-weight: 600; }
    .rail-bucket .icon { margin-right: 0.625rem; flex: 0 0 20px; display: inline-flex; justify-content: center; }
    .rail-bucket .label { flex: 1; }
    .rail-bucket .chev {
      flex: 0 0 16px; opacity: 0.6; font-size: 0.75rem; transition: transform 0.12s;
      margin-left: 0.25rem;
    }
    .rail-bucket.expanded .chev { transform: rotate(180deg); }
    .rail-bucket .count {
      font-size: 0.6875rem; color: #6f6f6f; background: #f4f4f4;
      padding: 0.0625rem 0.375rem; border-radius: 8px; margin-left: 0.375rem;
    }

    /* Rail children */
    .rail-children { display: none; background: #fafafa; border-top: 1px solid #f0f0f0; }
    .rail-bucket.expanded + .rail-children { display: block; }
    .rail-page {
      display: flex; align-items: center; width: 100%;
      padding: 0.5rem 1rem 0.5rem 2.75rem; font-size: 0.8125rem; color: #393939;
      background: transparent; border: 0; border-left: 3px solid transparent;
      cursor: pointer; text-align: left; font-family: inherit;
    }
    .rail-page:hover { background: #e8e8e8; }
    .rail-page.current { background: #edf5ff; border-left-color: #0f62fe; font-weight: 600; color: #161616; }

    /* Legacy styling */
    .rail-divider {
      height: 1px; background: #e0e0e0; margin: 0.5rem 0; flex: none;
    }
    .rail-bucket.legacy .label { color: #6f6f6f; font-style: italic; }
    .rail-page.legacy { color: #6f6f6f; font-style: italic; }
    .rail-page.legacy .legacy-tag {
      margin-left: 0.5rem; background: #e0e0e0; color: #525252;
      font-size: 0.625rem; padding: 0.0625rem 0.375rem; border-radius: 8px;
      font-style: normal;
    }

    /* Breadcrumb */
    .crumb {
      font-size: 0.8125rem; color: #525252; margin-bottom: 0.5rem;
    }
    .crumb a { color: #0f62fe; text-decoration: none; }
    .crumb a:hover { text-decoration: underline; }
    .crumb span.sep { margin: 0 0.375rem; }
    .crumb .current { color: #161616; font-weight: 500; }

    /* Titles */
    h1.page-title { font-size: 1.75rem; font-weight: 300; margin: 0 0 0.25rem 0; letter-spacing: -0.01em; }
    p.page-sub { color: #525252; margin: 0 0 1.5rem 0; font-size: 0.9375rem; }

    /* Bucket grid */
    .bucket-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;
    }
    .bucket-card {
      background: #fff; padding: 1.25rem; border: 1px solid #e0e0e0;
      cursor: pointer; transition: background 0.12s, box-shadow 0.12s; display: block; text-align: left;
      border-left: 3px solid transparent;
    }
    .bucket-card:hover { background: #fafafa; border-left-color: #0f62fe; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .bucket-card.legacy { border-left-color: #a8a8a8; opacity: 0.82; }
    .bucket-card.legacy:hover { border-left-color: #8d8d8d; }
    .bucket-card .head {
      display: flex; align-items: center; gap: 0.625rem; margin-bottom: 0.5rem;
    }
    .bucket-card .icon {
      width: 32px; height: 32px; background: #edf5ff; color: #0f62fe;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.125rem;
    }
    .bucket-card.legacy .icon { background: #f4f4f4; color: #6f6f6f; }
    .bucket-card h3 { font-size: 1rem; font-weight: 600; margin: 0; flex: 1; }
    .bucket-card .count-badge {
      font-size: 0.6875rem; background: #f4f4f4; color: #525252;
      padding: 0.125rem 0.5rem; border-radius: 10px;
    }
    .bucket-card p { margin: 0; color: #525252; font-size: 0.8125rem; line-height: 1.4; }

    /* Bucket landing — page tile grid */
    .page-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;
      margin-top: 1rem;
    }
    .page-tile {
      background: #fff; padding: 1rem; border: 1px solid #e0e0e0;
      cursor: pointer; transition: background 0.12s;
    }
    .page-tile:hover { background: #fafafa; border-color: #0f62fe; }
    .page-tile h4 { margin: 0 0 0.25rem 0; font-size: 0.9375rem; font-weight: 600; display: flex; align-items: center; }
    .page-tile p { margin: 0; color: #525252; font-size: 0.8125rem; }
    .page-tile.legacy { background: #fafafa; }
    .page-tile.legacy h4 { color: #6f6f6f; }
    .page-tile .tag-inline {
      margin-left: auto; font-size: 0.625rem; font-weight: 400; letter-spacing: 0.04em;
      padding: 0.0625rem 0.375rem; border-radius: 8px; text-transform: uppercase;
    }
    .page-tile .tag-inline.legacy { background: #e0e0e0; color: #525252; }
    .page-tile .tag-inline.new { background: #defbe6; color: #0e6027; }

    /* Placeholder page */
    .placeholder {
      background: #fff; border: 1px dashed #c6c6c6; padding: 3rem 1.5rem;
      text-align: center; color: #525252;
    }
    .placeholder h2 { margin: 0 0 0.5rem 0; font-weight: 400; color: #161616; }
    .placeholder p { margin: 0; font-size: 0.875rem; }
    .placeholder .hint {
      display: inline-block; margin-top: 1rem; padding: 0.375rem 0.75rem;
      background: #edf5ff; color: #0043ce; font-size: 0.75rem;
    }

    /* Callout for preview-mode indicator */
    .preview-note {
      background: #fdf6dd; border-left: 3px solid #f1c21b;
      padding: 0.625rem 0.875rem; margin-bottom: 1.25rem;
      font-size: 0.8125rem; color: #684e00;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Fragment } = React;

    // ---- IA v2.3 bucket inventory (from Phase 5 roadmap) ----
    const BUCKETS = [
      { slug:'people-access', name:'People & Access', icon:'👥',
        desc:'Users, roles, providers, and organizations.',
        pages:[
          { slug:'users', name:'User Management', desc:'Login accounts and role assignments.' },
          { slug:'roles', name:'Role Management', desc:'Role definitions and permission composition.' },
          { slug:'providers', name:'Provider Management', desc:'External clinicians with FHIR link fields.' },
          { slug:'organizations', name:'Organization Management', desc:'Parent/child organization hierarchy.' },
        ] },
      { slug:'test-catalog', name:'Test Catalog', icon:'📖',
        desc:'Tests, methods, analyzers, and test logic.',
        pages:[
          { slug:'test-management', name:'Test Management', desc:'Core test definitions.' },
          { slug:'methods', name:'Methods', desc:'Analytical methods per test.' },
          { slug:'analyzer-test-name', name:'Analyzer Test Name', desc:'Test name mapping per analyzer.' },
          { slug:'program-entry', name:'Program Entry', desc:'Programs that group tests.' },
          { slug:'reflex-tests', name:'Reflex Tests', desc:'Rules that trigger follow-up tests.' },
          { slug:'calculated-values', name:'Calculated Value Tests', desc:'Tests whose value is computed from others.' },
        ] },
      { slug:'reference-data', name:'Reference Data', icon:'📕',
        desc:'Dictionaries, taxonomies, and vocabularies.',
        pages:[
          { slug:'dictionary', name:'Dictionary Menu', desc:'Categories and terms used across forms.' },
        ] },
      { slug:'workflow-tuning', name:'Workflow Tuning', icon:'🔀',
        desc:'Configure order, result, validation, and workflow behaviour.',
        pages:[
          { slug:'nonconformity', name:'NonConformity Configuration', desc:'Codes and rules for NCE events.' },
          { slug:'barcode', name:'Barcode Configuration', desc:'Barcode format and print preview.' },
          { slug:'batch-reassign', name:'Batch Test Reassignment & Cancelation', desc:'Bulk change pending tests.' },
          { slug:'validation', name:'Validation Configuration', desc:'Validation rules and levels.' },
          { slug:'result-entry', name:'Result Entry Configuration', desc:'Result entry UI behaviour.' },
          { slug:'order-entry', name:'Order Entry Configuration', desc:'Order entry UI behaviour.' },
          { slug:'patient-entry', name:'Patient Entry Configuration', desc:'Patient entry UI behaviour.' },
          { slug:'workplan', name:'WorkPlan Configuration', desc:'Workplan filters and grouping.' },
        ] },
      { slug:'subscriptions', name:'Subscriptions & Notifications', icon:'🔔',
        desc:'Notifications and test result subscriptions.',
        pages:[
          { slug:'test-notification', name:'Test Notification Configuration', desc:'Triggers and destinations for notifications.' },
        ] },
      { slug:'lab-setup', name:'Lab Setup', icon:'🏢',
        desc:'Site information, calendar, languages, translations.',
        pages:[
          { slug:'site-info', name:'Site Information', desc:'Lab name, address, and contact details.' },
          { slug:'calendar', name:'Calendar Management', desc:'Working days, holidays, cut-off times.' },
          { slug:'languages', name:'Language Management', desc:'Available languages per deployment.' },
          { slug:'translations', name:'Translation Management', desc:'Override copy for specific locales.' },
        ] },
      { slug:'lab-identity', name:'Lab Identity', icon:'🎨',
        desc:'Branding and lab-number conventions.',
        pages:[
          { slug:'branding', name:'Site Branding', desc:'Logo, colors, printed-report theming.' },
          { slug:'lab-number', name:'Lab Number Management', desc:'Format-once lab numbering convention.' },
        ] },
      { slug:'integrations', name:'Integrations', icon:'🔗',
        desc:'External systems and plugins.',
        pages:[
          { slug:'external-connections', name:'External Connections', desc:'FHIR, HL7, and partner endpoints.' },
          { slug:'plugins', name:'List Plugins', desc:'Installed plugins and their status.' },
        ] },
      { slug:'reporting-exchange', name:'Reporting & Exchange', icon:'📄',
        desc:'Report delivery and print configuration.',
        pages:[
          { slug:'result-reporting', name:'Result Reporting Configuration', desc:'Where and when result reports are delivered.' },
          { slug:'printed-reports', name:'Printed Report Configuration', desc:'Layout and content of printed reports.' },
        ] },
      { slug:'system-admin', name:'System Administration', icon:'⚙️',
        desc:'Application properties, broadcast, index, logging, menus.',
        pages:[
          { slug:'app-properties', name:'Application Properties', desc:'Global app configuration.' },
          { slug:'notify-user', name:'Notify User', desc:'Ad-hoc broadcast to signed-in users.' },
          { slug:'search-index', name:'Search Index Management', desc:'Reindex and monitor search health.' },
          { slug:'logging', name:'Logging Configuration', desc:'Log levels per component.' },
          { slug:'menu-global', name:'Global Menu Configuration', desc:'Top-level main menu.' },
          { slug:'menu-billing', name:'Billing Menu Configuration', desc:'Billing module menu.' },
          { slug:'menu-non-conform', name:'Non-Conform Menu Configuration', desc:'Non-conformity module menu.' },
          { slug:'menu-patient', name:'Patient Menu Configuration', desc:'Patient module menu.' },
          { slug:'menu-study', name:'Study Menu Configuration', desc:'Study module menu.' },
        ] },
      { slug:'legacy', name:'Legacy', icon:'📦', legacy:true,
        desc:'Old admin pages awaiting retirement or port.',
        pages:[
          { slug:'menu-statement', name:'MenuStatement Configuration', desc:'Legacy menu statement editor.' },
          { slug:'field-validation', name:'Field Validation Configuration', desc:'Legacy field validation rules.' },
          { slug:'legacy-admin', name:'Legacy Admin', desc:'Pointer to the pre-redesign admin menu.' },
        ] },
    ];

    // ---- Hash routing ----
    // '#/admin'                           → bucket grid
    // '#/admin/<bucketSlug>'              → bucket landing
    // '#/admin/<bucketSlug>/<pageSlug>'   → page placeholder
    function parseHash() {
      const raw = window.location.hash.replace(/^#/, '') || '/admin';
      const parts = raw.split('/').filter(Boolean);
      if (parts[0] !== 'admin') return { kind: 'root' };
      if (parts.length === 1) return { kind: 'root' };
      if (parts.length === 2) return { kind: 'bucket', bucket: parts[1] };
      return { kind: 'page', bucket: parts[1], page: parts[2] };
    }

    function useRoute() {
      const [route, setRoute] = useState(parseHash());
      useEffect(() => {
        const onHash = () => setRoute(parseHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      return route;
    }

    const go = (hash) => { window.location.hash = hash; };

    // ---- Components ----
    function AppHeader() {
      return (
        <div className="app-header">
          <span className="brand">OpenELIS Global <span className="sub">Admin</span></span>
          <span className="spacer"></span>
          <span className="user-chip">caseyi@uw.edu</span>
        </div>
      );
    }

    function Rail({ route }) {
      // Compute initial expansion: current bucket expanded; others collapsed.
      const [expanded, setExpanded] = useState(() => {
        const s = new Set();
        if (route.bucket) s.add(route.bucket);
        return s;
      });

      // When the route bucket changes via nav, ensure it's expanded.
      useEffect(() => {
        if (route.bucket) {
          setExpanded(prev => {
            if (prev.has(route.bucket)) return prev;
            const next = new Set(prev);
            next.add(route.bucket);
            return next;
          });
        }
      }, [route.bucket]);

      const toggle = (slug) => {
        setExpanded(prev => {
          const next = new Set(prev);
          if (next.has(slug)) next.delete(slug); else next.add(slug);
          return next;
        });
      };

      const clickBucket = (b) => {
        // Bucket click: navigate to landing AND expand.
        go(`/admin/${b.slug}`);
        setExpanded(prev => new Set([...prev, b.slug]));
      };

      const clickChevron = (e, slug) => {
        e.stopPropagation();
        toggle(slug);
      };

      const active = BUCKETS.filter(b => !b.legacy);
      const legacy = BUCKETS.filter(b => b.legacy);

      const renderBucket = (b) => {
        const isCurrent = route.bucket === b.slug && route.kind === 'bucket';
        const isExpanded = expanded.has(b.slug);
        return (
          <Fragment key={b.slug}>
            <button
              className={`rail-bucket ${b.legacy ? 'legacy' : ''} ${isExpanded ? 'expanded' : ''} ${isCurrent ? 'current' : ''}`}
              aria-expanded={isExpanded}
              aria-current={isCurrent ? 'page' : undefined}
              onClick={() => clickBucket(b)}
            >
              <span className="icon" aria-hidden="true">{b.icon}</span>
              <span className="label">{b.name}</span>
              <span className="count">{b.pages.length}</span>
              <span className="chev" onClick={(e)=>clickChevron(e, b.slug)} aria-hidden="true">▾</span>
            </button>
            <div className="rail-children" style={{ display: isExpanded ? 'block' : 'none' }}>
              {b.pages.map(p => {
                const isPageCurrent = route.kind === 'page' && route.bucket === b.slug && route.page === p.slug;
                return (
                  <button
                    key={p.slug}
                    className={`rail-page ${b.legacy ? 'legacy' : ''} ${isPageCurrent ? 'current' : ''}`}
                    aria-current={isPageCurrent ? 'page' : undefined}
                    onClick={() => go(`/admin/${b.slug}/${p.slug}`)}
                  >
                    <span>{p.name}</span>
                    {b.legacy && <span className="legacy-tag">Legacy</span>}
                  </button>
                );
              })}
            </div>
          </Fragment>
        );
      };

      return (
        <nav className="rail" aria-label="Admin navigation">
          <div className="rail-title">Admin</div>
          {active.map(renderBucket)}
          <div className="rail-divider"></div>
          {legacy.map(renderBucket)}
        </nav>
      );
    }

    function Crumb({ route }) {
      const bucket = route.bucket ? BUCKETS.find(b => b.slug === route.bucket) : null;
      const page = route.kind === 'page' && bucket
        ? bucket.pages.find(p => p.slug === route.page)
        : null;
      return (
        <div className="crumb">
          <a href="#/admin">Admin</a>
          {bucket && <><span className="sep">/</span>{
            page ? <a href={`#/admin/${bucket.slug}`}>{bucket.name}</a> : <span className="current">{bucket.name}</span>
          }</>}
          {page && <><span className="sep">/</span><span className="current">{page.name}</span></>}
        </div>
      );
    }

    function BucketGrid() {
      return (
        <>
          <h1 className="page-title">Admin</h1>
          <p className="page-sub">Choose a section to configure.</p>
          <div className="preview-note">
            <strong>Preview mode.</strong> Click any bucket card to open its landing, or use the left rail to jump in. All 11 IA-v2.3 buckets are real; individual pages are stubbed.
          </div>
          <div className="bucket-grid">
            {BUCKETS.map(b => (
              <button key={b.slug} className={`bucket-card ${b.legacy ? 'legacy' : ''}`}
                      onClick={() => go(`/admin/${b.slug}`)}>
                <div className="head">
                  <span className="icon" aria-hidden="true">{b.icon}</span>
                  <h3>{b.name}</h3>
                  <span className="count-badge">{b.pages.length} {b.pages.length === 1 ? 'page' : 'pages'}</span>
                </div>
                <p>{b.desc}</p>
              </button>
            ))}
          </div>
        </>
      );
    }

    function BucketLanding({ bucket }) {
      return (
        <>
          <Crumb route={{ kind:'bucket', bucket: bucket.slug }} />
          <h1 className="page-title">{bucket.name}</h1>
          <p className="page-sub">{bucket.desc}</p>
          <div className="page-grid">
            {bucket.pages.map(p => (
              <button key={p.slug} className={`page-tile ${bucket.legacy ? 'legacy' : ''}`}
                      onClick={() => go(`/admin/${bucket.slug}/${p.slug}`)}>
                <h4>
                  {p.name}
                  {bucket.legacy && <span className="tag-inline legacy">Legacy</span>}
                </h4>
                <p>{p.desc}</p>
              </button>
            ))}
          </div>
        </>
      );
    }

    function PagePlaceholder({ bucket, page }) {
      return (
        <>
          <Crumb route={{ kind:'page', bucket: bucket.slug, page: page.slug }} />
          <h1 className="page-title">{page.name}</h1>
          <p className="page-sub">{page.desc}</p>
          <div className="placeholder">
            <h2>Page not yet designed</h2>
            <p>This shell preview demonstrates navigation and layout only.<br/>
               Individual pages ship in the Phase 5 page-by-page pass.</p>
            <span className="hint">Phase 5 roadmap → page-by-page</span>
          </div>
        </>
      );
    }

    function App() {
      const route = useRoute();
      const bucket = route.bucket ? BUCKETS.find(b => b.slug === route.bucket) : null;
      const page = route.kind === 'page' && bucket ? bucket.pages.find(p => p.slug === route.page) : null;

      let content;
      if (route.kind === 'root') content = <BucketGrid />;
      else if (route.kind === 'bucket' && bucket) content = <BucketLanding bucket={bucket} />;
      else if (route.kind === 'page' && bucket && page) content = <PagePlaceholder bucket={bucket} page={page} />;
      else content = <BucketGrid />;

      return (
        <>
          <AppHeader />
          <div className="layout">
            <Rail route={route} />
            <main className="main">{content}</main>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
