      <div style={{ display: 'flex', gap: '.25rem', flexWrap: 'wrap', minHeight: 40, alignItems: 'center' }}>
        {options.map(([k, lab]) => {
          const on = value.includes(k);
          return <button key={k} disabled={disabled} className={`cds--tag cds--tag--sm ${on ? 'cds--tag--high-contrast' : 'cds--tag--outline'}`} style={{ cursor: disabled ? 'not-allowed' : 'pointer', border: on ? 0 : '1px solid #8d8d8d' }}
            aria-pressed={on} onClick={() => onChange(on ? value.filter(x => x !== k) : [...value, k])}><span className="cds--tag__label">{on ? '✓ ' : ''}{lab}</span></button>;
        })}
      </div>
      <div className="helper">None selected shows all</div>
    </div>
  );
}

function Tag({ kind, children }) { return <span className={`cds--tag cds--tag--${kind} cds--tag--sm`}><span className="cds--tag__label">{children}</span></span>; }

function MultiTypeahead({ label, options, value, onChange, disabled, helper }) {
  const [q, setQ] = useState(''); const [open, setOpen] = useState(false);
  const matches = options.filter(o => !value.includes(o) && (q.length >= 1 ? o.toLowerCase().includes(q.toLowerCase()) : options.length <= 25));
  return (
    <div className="f ms" style={{ minWidth: 220 }}>
      <label className="cds--label">{label}</label>
      <input disabled={disabled} value={q} placeholder={disabled ? '' : t('', 'Type to search')} onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 150)} onChange={e => setQ(e.target.value)} />
      {open && !disabled && matches.length > 0 && <div className="ms-list">{matches.map(o => <div key={o} onMouseDown={() => { onChange([...value, o]); setQ(''); }}>{o}</div>)}</div>}
      <div className="chips">{value.map(v => <span key={v} className="cds--tag cds--tag--filter cds--tag--high-contrast cds--tag--sm"><span className="cds--tag__label">{v}</span><button className="cds--tag__close-icon" aria-label={`Remove ${v}`} onClick={() => onChange(value.filter(x => x !== v))}>×</button></span>)}</div>
      {helper && <div className="helper">{helper}</div>}
    </div>
  );
}

function App() {
  const [rows, setRows] = useState(initialRows);
  const [scope, setScope] = useState('all');
  const [role, setRole] = useState('validator');
  const [type, setType] = useState('all');
  const [states, setStates] = useState([]);
  const [printF, setPrintF] = useState('all');
  const [win, setWin] = useState('7');
  const [labNo, setLabNo] = useState(''); const [labTo, setLabTo] = useState(''); const [range, setRange] = useState(false);
  const [lookup, setLookup] = useState(null);
  const [facility, setFacility] = useState([]); const [ward, setWard] = useState([]);
  const [standard, setStandard] = useState([]); const [compF, setCompF] = useState('all');
  const [expanded, setExpanded] = useState(null);
  const [selected, setSelected] = useState([]);
  const [notice, setNotice] = useState(null);
  const [reissue, setReissue] = useState({ id: null, text: '', touched: false });

  const inScope = SCOPES[scope];
  const effType = inScope.length === 1 ? inScope[0] : type;
  const isTargeted = !!lookup;

  const filtered = useMemo(() => rows.filter(r => {
    if (!inScope.includes(r.type)) return false;
    if (lookup) {
      if (isExport(r)) return false;
      const n = r.labNo.replace(/\D/g, ''); const a = lookup.from.replace(/\D/g, ''); const b = (lookup.to || lookup.from).replace(/\D/g, '');
      return lookup.to ? (n >= a && n <= b && r.labNo.slice(0, 3) === lookup.from.slice(0, 3)) : r.labNo.toLowerCase() === lookup.from.toLowerCase();
    }
    if (effType !== 'all' && r.type !== effType) return false;
    const age = (NOW - r.released) / 864e5;
    if (isExport(r)) {
      // FR-3.7, FR-3.7a, FR-3.8 for export rows
      if (effType === 'export') { if (states.length && !states.includes(r.job)) return false; }
      else if (states.length || printF !== 'all') return false;
      if (!['QUEUED', 'GENERATING'].includes(r.job) && win !== 'all' && age > Number(win)) return false;
      return true;
    }
    const pr = printOf(r);
    if (states.length && !states.includes(stateOf(r))) return false;
    if (printF !== 'all' && pr !== printF) return false;
    if (pr === 'printed' && win !== 'all' && age > Number(win)) return false;
    if (effType === 'patient') { if (facility.length && !facility.includes(r.facility)) return false; if (ward.length && !ward.includes(r.ward)) return false; }
    if (effType === 'environmental') {
      if (standard.length && !standard.includes(r.standard)) return false;
      if (compF !== 'all' && r.compliance !== compF) return false;
    }
    return true;
  }).sort((a, b) => b.released - a.released), [rows, scope, lookup, effType, states, printF, win, facility, ward, standard, compF]);

  const scoped = rows.filter(r => inScope.includes(r.type) && !isExport(r) && (effType === 'all' || r.type === effType));
  const toPrint = scoped.filter(r => printOf(r) === 'unprinted').length;
  const amendedN = scoped.filter(r => printOf(r) === 'unprinted' && stateOf(r) === 'amended').length;
  const exportsReady = rows.filter(r => inScope.includes('export') && isExport(r) && r.job === 'READY').length;
  const jobAction = (r) => {
    if (r.job === 'READY') setNotice(`${r.labNo}: CSV downloading. Downloading again is allowed until the file expires.`);
    if (r.job === 'QUEUED') setNotice('The shipped Cancel confirmation opens before the job is cancelled.');
    if (r.job === 'FAILED') { setRows(prev => [...prev.map(x => x.id === r.id ? x : x), { ...r, id: r.id + 'r', job: 'QUEUED', released: NOW, failure: null, rowsSize: '~2 min wait' }]); setNotice(`${r.labNo} resubmitted as a new job; the failed job stays in the list.`); }
    if (r.job === 'EXPIRED') setNotice('Re-run opens Custom Data Export with the same variables and filters and a blank date range.');
  };

  const printRows = (ids, mode) => {
    let done = 0, re = 0;
    setRows(prev => prev.map(r => {
      if (!ids.includes(r.id) || r.noTemplate) return r;
      if (r.printedContent === r.currentContent) { re++; const h = [...r.history]; const last = { ...h[h.length - 1] }; last.reprints = [...last.reprints, { at: NOW, by: 'You' }]; h[h.length - 1] = last; return { ...r, history: h }; }
      done++;
      const v = r.history.length + 1; const amended = r.pendingAmend;
      return { ...r, printedContent: r.currentContent, pendingAmend: false, amendCount: (r.amendCount || 0) + (amended ? 1 : 0),
        history: [...r.history, { v, at: NOW, by: 'You', change: v === 1 ? 'First issue' : r.pendingSummary, comp: `${r.rel}/${r.total}`, amended, reprints: [] }] };
    }));
    setSelected([]);
    const n = ids.filter(id => !rows.find(r => r.id === id)?.noTemplate).length;
    setNotice(mode === 'zip' ? `${n} report${n === 1 ? '' : 's'} downloaded as reports_2026-09-29_${n}.zip` : `${n} report${n === 1 ? '' : 's'} ready. Opened in a new tab as one PDF${n > 1 ? ', each report paged from 1' : ''}.`);
  };

  const doReissue = (r) => {
    if (!reissue.text.trim()) { setReissue({ ...reissue, touched: true }); return; }
    setRows(prev => prev.map(x => x.id !== r.id ? x : ({ ...x, currentContent: x.currentContent + 'c', printedContent: x.currentContent + 'c', amendCount: (x.amendCount || 0) + 1,
      history: [...x.history, { v: x.history.length + 1, at: NOW, by: 'You', change: 'Reissued: ' + reissue.text.trim(), comp: `${x.rel}/${x.total}`, amended: true, reissue: true, reprints: [] }] })));
    setReissue({ id: null, text: '', touched: false });
    setNotice(`${r.labNo} reissued as an amended version and opened in a new tab.`);
  };

  const applyLookup = () => { if (!labNo.trim()) return; setLookup({ from: labNo.trim(), to: range && labTo.trim() ? labTo.trim() : null }); setType('all'); setStates([]); setPrintF('all'); setFacility([]); setWard([]); setStandard([]); setCompF('all'); };
  const clearLookup = () => { setLookup(null); setLabNo(''); setLabTo(''); };
  const clearAll = () => { clearLookup(); setType('all'); setStates([]); setPrintF('all'); setFacility([]); setWard([]); setStandard([]); setCompF('all'); };

  const wardOptions = facility.flatMap(f => WARDS[f] || []);
  const canReissue = role !== 'reception';

  const versionCell = (r) => {
    if (!r.history.length) return <span className="sub2">{t('reportQueue.version.none', 'Not printed')}</span>;
    const last = r.history[r.history.length - 1];
    return <span>v{last.v}{r.type !== 'patient' && r.amendCount > 0 && <div className="sub2 mono">{r.labNo}/Am.{r.amendCount}</div>}</span>;
  };

  return (
    <div>
      <div className="preview-banner">
        <span>⚡ Visual Preview · Report Print Queue r4 (v2.2) · Route: /ReportPrintQueue · SideNav: Reports › Report Print Queue · Not a live application</span>
        <span>Preview controls:&nbsp;
          <select value={scope} onChange={e => { setScope(e.target.value); setType('all'); setSelected([]); }}>

            <option value="clinical">User's lab units: Clinical only</option>
            <option value="env">User's lab units: Environmental only</option>
            <option value="clinicalNoExport">Clinical only, no Custom Data Export access</option>
          </select>&nbsp;
          <select value={role} onChange={e => setRole(e.target.value)}>
            <option value="validator">Role: Validation</option>
            <option value="reception">Role: Reception (no reissue)</option>
          </select>
        </span>
      </div>
      <div className="shell">
        <nav className="sidenav">
          <div className="sec">Reports</div>
          <div className="item">Patient Status Report</div>
          <div className="item active">Report Print Queue</div>
          <div className="item">Routine</div>
          <div className="item">Custom Data Export</div>
          <div className="item">Turn Around Time</div>
          <div className="item">WHONET Export</div>
          <div className="item">Environmental</div>
          <div className="item sub">Compliance Dashboard</div>
          <div className="item">Vector Surveillance</div>
          <div className="note" style={{ padding: '1rem' }}>"Environmental › Compliance Report" is merged into this page; /LaporanHasil redirects here with Type = Environmental.</div>
        </nav>
        <main className="main">
          <div className="crumbs">Home <span>/</span> Reports <span>/ Report Print Queue</span></div>
          <h1 className="title">{t('reportQueue.title', 'Report Print Queue')}</h1>
          <p className="subtitle">{t('reportQueue.subtitle', 'Print, reprint and reissue released reports')}</p>

          <div className="notif info">
            <div>
              <strong>{t('reportQueue.guidance.lead', 'Reports land here when their first result is released.')}</strong> {t('reportQueue.guidance.body', 'Printed reports come back when more results are released or a printed result changes.')} {inScope.includes('export') && t('reportQueue.guidance.exports', 'Your own data exports show here too.')}
              <div className="legend">
                <span><span className="t"><Tag kind="warm-gray">Partial</Tag></span>Some results are not released yet</span>
                <span><span className="t"><Tag kind="teal">Final</Tag></span>Every result is released</span>
                <span><span className="t"><Tag kind="magenta">Amended</Tag></span>A printed result changed, or the report was reissued with a correction</span>
                <span style={{ borderLeft: '1px solid #c6c6c6', paddingLeft: '1rem' }}><span className="t"><Tag kind="purple">Unprinted</Tag></span>The current content has not been printed yet</span>
                <span><span className="t"><Tag kind="green">Printed</Tag></span>The last print matches what is released</span>
              </div>
            </div>
          </div>

          <div className="tiles">
            <div className="tile purple" onClick={() => { clearLookup(); setType('all'); setStates([]); setPrintF('unprinted'); }}><div className="n">{toPrint}</div><div>{t('reportQueue.tile.toPrint', 'To print')}</div></div>
            <div className="tile amber" onClick={() => { clearLookup(); setType('all'); setStates(['amended']); setPrintF('unprinted'); }}><div className="n">{amendedN}</div><div>{t('reportQueue.tile.amendedToPrint', 'Amended to print')}</div></div>
            {inScope.includes('export') && <div className="tile green" onClick={() => { clearLookup(); setType('export'); setStates(['READY']); setPrintF('all'); }}><div className="n">{exportsReady}</div><div>{t('reportQueue.tile.exportsReady', 'Exports ready')}</div></div>}
          </div>

          <div className="filters">
            <div className="f">
              <label className="cds--label">Lab No</label>
              <div style={{ display: 'flex', gap: '.5rem', alignItems: 'center' }}>

                {range && <input className="mono" style={{ width: 150 }} value={labTo} placeholder="To lab number" onChange={e => setLabTo(e.target.value)} onKeyDown={e => e.key === 'Enter' && applyLookup()} />}
                <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setRange(!range)}>{range ? 'Single' : 'Range'}</button>
              </div>

            </div>
            {inScope.includes('patient') && <div className="f"><label className="cds--label">&nbsp;</label><button className="cds--btn cds--btn--ghost cds--btn--sm" disabled={isTargeted} onClick={() => setNotice('Search by patient opens the existing SearchPatientForm inline under the filter bar (unchanged from r3 FR-2-004).')}>Search by patient</button></div>}
            {inScope.length > 1 && <div className="f"><label className="cds--label">Type</label>
              <select disabled={isTargeted} value={type} onChange={e => { setType(e.target.value); setStates([]); setPrintF('all'); setFacility([]); setWard([]); setStandard([]); setCompF('all'); }}>
                <option value="all">All</option>
                {inScope.includes('patient') && <option value="patient">Patient report</option>}
                {inScope.includes('environmental') && <option value="environmental">Environmental</option>}
                {inScope.includes('export') && <option value="export">Data export</option>}
              </select></div>}
            {effType === 'export'
              ? <StateChips label="State" disabled={isTargeted} value={states} onChange={setStates} options={Object.entries(JOB_TAG).map(([k, v]) => [k, v[1]])} />
              : <StateChips label="State" disabled={isTargeted} value={states} onChange={setStates} options={[['partial', 'Partial'], ['final', 'Final'], ['amended', 'Amended']]} />}
            {effType !== 'export' && <div className="f"><label className="cds--label">Print status</label>
              <select disabled={isTargeted} value={printF} onChange={e => setPrintF(e.target.value)}>

            <div className="f"><label className="cds--label">Time window</label>

              <div className="helper">{isTargeted ? 'Ignored while looking up a specific order' : 'Applies to printed reports and finished exports; unprinted reports always show'}</div></div>
            {effType === 'patient' && !isTargeted && <>

              <MultiTypeahead label="Requester" options={['dr. Andi Lubis', 'dr. Fitri Nasution', 'dr. Rudi Tarigan', 'Bidan Rosmawati']} value={[]} onChange={() => {}} helper="Type 2 or more characters to search" />
            </>}
            {effType === 'environmental' && !isTargeted && <>
              <MultiTypeahead label="Sampling Site" options={SITES} value={[]} onChange={() => {}} helper="Type 2 or more characters to search" />
              <MultiTypeahead label="Standard" options={STANDARDS} value={standard} onChange={setStandard} />
              <div className="f"><label className="cds--label">Compliance Status</label>

            <span className="cds--tag cds--tag--filter cds--tag--high-contrast"><span className="cds--tag__label">Lab No: {lookup.from}{lookup.to ? ` to ${lookup.to}` : ''}</span><button className="cds--tag__close-icon" onClick={clearLookup}>×</button></span>
            <span className="sub2">Other filters are off while you look up a specific order</span>
            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={clearLookup}>Clear search</button>
          </div>}

          {notice && <div className="notif success"><div style={{ flex: 1 }}>{notice}</div><button className="linkish" onClick={() => setNotice(null)}>Dismiss</button></div>}

          <div style={{ marginTop: '1rem' }}>
            {selected.length > 0 ? (
              <div className="batchbar">
                <span>{selected.length} item{selected.length > 1 ? 's' : ''} selected: <span className="mono">{selected.map(id => rows.find(r => r.id === id).labNo).join(', ')}</span></span>

                  <button className="cds--btn cds--btn--primary" onClick={() => printRows(selected, 'print')}>Print selected</button>
                  <button className="cds--btn cds--btn--primary" onClick={() => printRows(selected, 'zip')}>Download selected</button>

            ) : (

            <table className="q">

                {inScope.length > 1 && <th>Type</th>}
                <th>Lab No / Name</th><th>Subject</th><th>Details</th><th>Released / Submitted ↓</th><th>State</th><th>Print status</th><th>Version</th><th>Action</th>
              </tr></thead>
              <tbody>
                {filtered.length === 0 && <tr><td colSpan={11} style={{ padding: '2rem', textAlign: 'center', color: '#525252' }}>Nothing to print. Every released report in this view has been printed. <button className="linkish" onClick={clearAll}>Clear filters</button></td></tr>}
                {filtered.map(r => {

                        <td style={{ whiteSpace: 'nowrap' }}>{fmt(r.released)}</td>

                        <td className="sub2">-</td><td className="sub2">-</td>
                        <td>{JOB_ACTION[r.job] && <button className={`cds--btn cds--btn--sm ${r.job === 'READY' ? 'cds--btn--primary' : 'cds--btn--tertiary'}`} onClick={() => jobAction(r)}>{JOB_ACTION[r.job]}</button>}</td>
                      </tr>
                      {open && <tr className="expanded"><td colSpan={11}><div className="detail"><div style={{ gridColumn: 'span 12' }}>

                          r.type === 'environmental' ? <>{r.standard ? <span className="mono" style={{ fontSize: 12 }}>{r.standard}</span> : <span className="sub2">Not evaluated against a standard</span>}<div><Tag kind={COMP[r.compliance][0]}>{partial && r.compliance !== 'NOT_EVALUATED' ? 'Provisional: ' : ''}{COMP[r.compliance][1]}</Tag></div></> :
                          <span className="sub2">Vector surveillance</span>}</td>
                        <td style={{ whiteSpace: 'nowrap' }}>{fmt(r.released)}</td>
                        <td><Tag kind={STATE_TAG[stt][0]}>{STATE_TAG[stt][1]}{partial ? ` ${r.rel}/${r.total}` : ''}</Tag>{r.critical && <Tag kind="red">Critical</Tag>}</td>

                        <td>{versionCell(r)}</td>
                        <td><button className="cds--btn cds--btn--tertiary cds--btn--sm" disabled={r.noTemplate} title={r.noTemplate ? 'Vector certificate template not installed' : ''} onClick={() => printRows([r.id], 'print')}>Print</button>

                      </tr>

                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
            <div className="pager"><span>Items per page: 20</span><span>1 to {filtered.length} of {filtered.length} items</span></div>
          </div>
          <p className="note">Try: expand 26-004790 (Amended after a potassium correction), print 26-004812 (a completed partial report becomes v2, not amended), expand ENV-26-0091 (no standard linked), expand ENV-26-0071 (reissued with correction, /Am.1). 26-004410 was released 48 days ago and still shows under Last 7 days because it has never been printed. Try State = Amended with Print status = Unprinted, or the Exports ready tile. The four Data export rows are this user's own jobs.</p>
        </main>
      </div>
    </div>
  );
}

function History({ r }) {
  if (!r.history.length) return <p className="sub2">Nothing printed yet</p>;
  return (
    <table className="mini">
      <thead><tr><th>Version</th><th>Issued</th><th>By</th><th>Change</th><th>Completeness</th><th>Fingerprint</th><th></th></tr></thead>
      <tbody>{r.history.map(h => (
        <React.Fragment key={h.v}>
          <tr>
            <td>v{h.v}{h.amended && <> <Tag kind="magenta">Amended</Tag></>}{r.type !== 'patient' && h.amended && <div className="sub2 mono">/Am.{r.history.filter(x => x.amended && x.v <= h.v).length}</div>}</td>
            <td style={{ whiteSpace: 'nowrap' }}>{fmt(h.at)}</td>
            <td>{h.by}</td>
            <td>{h.change}</td>
            <td>{h.comp}</td>
            <td className="mono" title={h.notArchived ? '' : 'SHA-256 ' + sha(r.labNo + h.v) + '…'}>{h.notArchived ? '-' : sha(r.labNo + h.v)}</td>
            <td>{h.notArchived ? <span className="sub2">Not archived (issued before 15 Sep 2026)</span> : <button className="linkish">Open PDF</button>}</td>
          </tr>
          {h.reprints.map((p, i) => <tr key={i}><td></td><td colSpan={6} className="sub2">Reprinted {fmt(p.at)} by {p.by} (same file, same fingerprint)</td></tr>)}
        </React.Fragment>))}
        {printOf(r) !== 'printed' && r.history.length > 0 && <tr><td className="sub2">next</td><td colSpan={6} className="sub2">Next print creates v{r.history.length + 1}{r.pendingAmend ? ' (amended)' : ''}: {r.pendingSummary}</td></tr>}
      </tbody>
    </table>
  );
}

function ReissueBlock({ r, canReissue, reissue, setReissue, doReissue }) {
  if (!r.history.length || printOf(r) !== 'printed') return <p className="sub2" style={{ marginTop: '.75rem' }}>Reissue with correction is available once the current version has been printed; an Unprinted report uses Print.</p>;
  if (reissue.id !== r.id) return (
    <div style={{ marginTop: '.75rem' }}>
      <button className="cds--btn cds--btn--tertiary cds--btn--sm" disabled={!canReissue} title={canReissue ? '' : 'Only Results, Validation or Admin users can reissue a report.'} onClick={() => setReissue({ id: r.id, text: '', touched: false })}>Reissue with correction</button>
      {!canReissue && <span className="sub2" style={{ marginLeft: '.5rem' }}>Only Results, Validation or Admin users can reissue a report.</span>}
    </div>);
  const invalid = reissue.touched && !reissue.text.trim();
  return (
    <div className="reissue" style={{ marginTop: '.75rem' }}>
      <label className="cds--label">What was corrected</label>
      <textarea className={invalid ? 'invalid' : ''} value={reissue.text} placeholder="e.g. Collection date was entered as 12/09; the sample was collected 11/09" onChange={e => setReissue({ ...reissue, text: e.target.value })} />
      {invalid ? <div className="err">Enter what was corrected</div> : <div className="helper" style={{ maxWidth: 'none' }}>This prints on the report as the reason for the correction. Required for ISO 15189 7.4.1.6 and ISO/IEC 17025 7.8.8.</div>}
      <div style={{ marginTop: '.75rem', display: 'flex', gap: '.5rem' }}>
        <button className="cds--btn cds--btn--primary cds--btn--sm" onClick={() => doReissue(r)}>Reissue and print</button>
        <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setReissue({ id: null, text: '', touched: false })}>Cancel</button>
      </div>
    </div>);
}

function Detail({ r, canReissue, reissue, setReissue, doReissue }) {
  if (r.type === 'patient') return (
    <div className="detail">
      <div style={{ gridColumn: 'span 7' }}>
        <h5>Tests ({r.rel} of {r.total} released)</h5>
        <table className="mini"><thead><tr><th>Test</th><th>Result</th><th>Flag</th><th>Released</th><th>Validated by</th></tr></thead>
          <tbody>{r.tests.map(([n, v, f, at, by]) => <tr key={n}><td>{n}</td><td style={{ fontStyle: at ? 'normal' : 'italic' }}>{v}</td><td>{f ? <Tag kind={f.length === 2 ? 'red' : 'gray'}>{f}</Tag> : ''}</td><td>{at ? fmt(at) : '-'}</td><td>{by}</td></tr>)}</tbody></table>
      </div>
      <div style={{ gridColumn: 'span 5' }}>
        <h5>Order</h5>
        <div className="kv"><div>Facility</div><div>{r.facility}</div><div>Ward / Dept / Unit</div><div>{r.ward}</div><div>Requester</div><div>{r.requester}</div><div>Collected</div><div>{fmt(r.collected)}</div><div>Received</div><div>{fmt(r.received)}</div></div>
      </div>
      <div style={{ gridColumn: 'span 12' }}>
        <h5>Version history</h5><History r={r} />
        <ReissueBlock r={r} canReissue={canReissue} reissue={reissue} setReissue={setReissue} doReissue={doReissue} />
      </div>
    </div>);
  const noStd = !r.standard;
  return (
    <div className="detail">
      <div style={{ gridColumn: 'span 4' }}>
        <h5>Site Information</h5>
        <div className="kv"><div>Site</div><div>{r.subject} ({r.subjectSub})</div><div>GPS</div><div className="mono">{r.site.gps}</div><div>Collection Date/Time</div><div>{fmt(r.site.collected)}</div><div>Collection Method</div><div>{r.site.method}</div><div>Standard</div><div>{r.standard || <em>Not evaluated against a standard</em>}</div></div>
      </div>
      <div style={{ gridColumn: 'span 3' }}>
        <h5>Collection Conditions</h5>
        <div className="kv" style={{ gridTemplateColumns: '110px 1fr' }}><div>Water Temp</div><div>{r.site.water}</div><div>Ambient Temp</div><div>{r.site.ambient}</div><div>Weather</div><div>{r.site.weather}</div><div>Preservation</div><div>{r.site.preservation}</div></div>
      </div>
      <div style={{ gridColumn: 'span 5' }}>
        <h5>{noStd ? 'Results (printed without compliance evaluation)' : 'Compliance Summary'}</h5>
        <table className="mini"><thead><tr><th>Parameter</th><th>Result</th>{!noStd && <><th>Threshold</th><th>Status</th></>}</tr></thead>
          <tbody>{r.params.map(([p, v, th, s]) => <tr key={p}><td>{p}</td><td style={{ fontStyle: v === 'Pending' ? 'italic' : 'normal' }}>{v}</td>{!noStd && <><td>{th}</td><td>{s ? <Tag kind={COMP[s][0]}>{COMP[s][1]}</Tag> : <span className="sub2">Pending</span>}</td></>}</tr>)}</tbody></table>
        {noStd && r.type === 'environmental' && <p className="note">The report prints these results under "Not evaluated against a standard", with no threshold, status or conclusion. Linking a standard later makes the next print a new version (not amended): "Evaluated against {'{standard}'}".</p>}
        {!noStd && r.rel < r.total && <p className="note">Prints as a partial certificate: conclusion "Provisional: {r.total - r.rel} of {r.total} parameters pending".</p>}
      </div>
      {r.sigs.length > 0 && <div style={{ gridColumn: 'span 12' }}>
        <h5>Signatures</h5>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>{r.sigs.map(([role, n, at]) => <div className="sig" key={role}><strong>{role}</strong><div>{n}</div><div className="sub2">{fmt(at)}</div></div>)}</div>
      </div>}
      <div style={{ gridColumn: 'span 12' }}>
        <h5>Version history</h5><History r={r} />
        {!r.noTemplate && <ReissueBlock r={r} canReissue={canReissue} reissue={reissue} setReissue={setReissue} doReissue={doReissue} />}
        {r.noTemplate && <p className="note">Vector certificate template (S06d) is not installed yet, so this row cannot print. It shows so the clerk knows it is waiting.</p>}
      </div>
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
