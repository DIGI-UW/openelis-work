<style>
:root{--nav-w:17rem}
body{background:#f4f4f4;margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#161616}
.preview-banner{background:#0f62fe;color:#fff;padding:6px 1rem;font-size:12px;font-family:'IBM Plex Mono',monospace}
.shell{background:#161616;color:#f4f4f4;height:3rem;display:flex;align-items:center;gap:1.5rem;padding:0 1rem}
.shell-brand{font-weight:600;font-size:14px}.shell-crumb{font-size:12px;color:#c6c6c6}
.toolbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:.75rem 1rem;background:#fff;border-bottom:1px solid #e0e0e0}
.switcher{display:inline-flex;border:1px solid #8d8d8d}
.sw{background:#fff;border:0;border-right:1px solid #8d8d8d;padding:.5rem 1rem;font:inherit;font-size:14px;cursor:pointer;color:#525252}
.sw:last-child{border-right:0}.sw.on{background:#161616;color:#fff}
.sw:focus-visible,.nav-row:focus-visible{outline:2px solid #0f62fe;outline-offset:-2px}
.checks{display:flex;gap:1rem;font-size:14px}.chk{display:flex;gap:.35rem;align-items:center}
.body{display:flex;align-items:flex-start;gap:1rem;padding:1rem}
.navs{display:flex;gap:1rem;flex-shrink:0}
.sidenav{width:var(--nav-w);background:#fff;border-right:1px solid #e0e0e0;max-height:calc(100vh - 9rem);overflow:auto;position:sticky;top:1rem;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sidenav ul{list-style:none;margin:0;padding:0}
.sidenav-title{font-size:12px;letter-spacing:.32px;color:#525252;padding:.75rem 1rem;border-bottom:1px solid #e0e0e0;background:#f4f4f4;position:sticky;top:0;z-index:1}
.nav-row{display:flex;align-items:center;gap:.5rem;width:100%;min-height:2rem;border:0;background:none;text-align:left;font:inherit;font-size:14px;color:#161616;padding:.375rem 1rem;cursor:pointer}
.nav-row:hover{background:#e8e8e8}
.nav-row.lvl-0{font-weight:600}
.nav-row.lvl-1{padding-left:2.5rem;font-weight:400}
.nav-row.lvl-2{padding-left:3.5rem;font-weight:400;color:#393939}
.nav-row.lvl-3,.nav-row.lvl-4{font-weight:400;color:#525252;font-size:13px}
.nav-row.is-selected{background:#e0e0e0;box-shadow:inset 3px 0 0 #0f62fe}
.nav-row.is-off .nav-label{color:#8d8d8d;text-decoration:line-through}
.nav-row.muted{color:#6f6f6f;cursor:default;font-weight:400}
.nav-label{flex:1;min-width:0}
.nav-icon,.nav-icon-blank{width:16px;height:16px;flex-shrink:0;display:inline-flex}
.nav-chev{display:inline-flex;width:16px;height:16px;flex-shrink:0;transition:transform .15s}.nav-chev.open{transform:rotate(180deg)}
.nav-section{font-size:12px;font-weight:600;letter-spacing:.32px;text-transform:uppercase;color:#525252;padding:.75rem 1rem .25rem}
.nav-divider{border-top:1px solid #e0e0e0;margin:.5rem 0 0}
.nav-tag{margin:0;flex-shrink:0}
.nav-go{font-size:18px;line-height:1;color:#525252}
.nav-row.back{color:#0f62fe;font-weight:400}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem;max-width:56rem}
.content h2{margin:0}.lede{margin:0;color:#393939;font-size:14px;line-height:1.43}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.stat{padding:1rem}.stat-v{font-size:28px;font-weight:300}.stat-l{font-size:14px;font-weight:600}.stat-s{font-size:12px;color:#525252}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;align-items:center;font-size:12px;color:#393939}
.detail dl{display:grid;grid-template-columns:9rem 1fr;gap:.5rem 1rem;margin:.75rem 0 0;font-size:14px}
.detail dt{color:#525252}.detail dd{margin:0}
.detail.empty{color:#525252}
.eid{font-size:12px;color:#525252;margin-left:.5rem;font-weight:400}
.muted{color:#6f6f6f}.small{font-size:12px}
.where .cds--data-table-container{margin-top:.5rem}
.clickable{cursor:pointer}
.bucket-notes p{margin:.25rem 0;font-size:14px}
code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#f4f4f4;padding:0 .25rem}
@media (max-width:1100px){.body{flex-direction:column}.navs{flex-wrap:wrap}.sidenav{position:static;max-height:none}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script type="text/babel">
const { useState, useMemo } = React;
const D = window.NAV_DATA;
const t = (key, fallback) => fallback || key;
const NavCtx = React.createContext({ openAdmin: () => {}, backToMain: () => {} });

const TIER = {
  remove: { label: "Remove", kind: "red" },
  hide: { label: "Hide", kind: "purple" },
  merge: { label: "Merge", kind: "warm-gray" },
  keep: { label: "Keep", kind: "green" },
};

function Icon({ name }) {
  const svg = D.icons[name];
  if (!svg) return <span className="nav-icon-blank" />;
  return <span className="nav-icon" dangerouslySetInnerHTML={{ __html: svg }} />;
}

function Tag({ kind, children }) {
  return <span className={`cds--tag cds--tag--${kind} cds--tag--sm nav-tag`}>{children}</span>;
}

function flatten(nodes, path = [], out = []) {
  nodes.forEach((n) => {
    const p = n.section ? [] : [...path, n.label];
    out.push({ ...n, path: n.section ? [n.label] : p, sectionName: n.section ? n.label : undefined });
    flatten(n.kids || [], n.section ? [] : p, out);
  });
  return out;
}

/* ---------- Side nav renderers ---------- */

function NavItem({ node, level, selected, onSelect, mode, showOff, stockOnly }) {
  const [open, setOpen] = useState(false);
  const nav = React.useContext(NavCtx);
  const isAdmin = node.id === "menu_administration";
  const kids = (node.kids || []).filter((k) => visibleBefore(k, mode, showOff, stockOnly));
  const isSel = selected && selected.id === node.id;
  if (mode === "after" && node.section) {
    return (
      <>
        <li className="nav-divider" />
        <li className="nav-section">{node.label}</li>
        {node.kids.map((k) => (
          <NavItem key={k.id} node={k} level={0} selected={selected} onSelect={onSelect} mode={mode} />
        ))}
      </>
    );
  }
  const off = mode === "before" && !node.active;
  const tier = mode === "before" ? TIER[node.tier] : null;
  return (
    <li>
      <button
        className={`nav-row lvl-${Math.min(level, 4)} ${isSel ? "is-selected" : ""} ${off ? "is-off" : ""}`}
        style={{ paddingLeft: mode === "before" ? `${0.75 + level * 0.9}rem` : undefined }}
        onClick={() => {
          if (isAdmin) { nav.openAdmin(); return; }
          if (kids.length) setOpen(!open);
          onSelect(node);
        }}
        aria-expanded={kids.length && !isAdmin ? open : undefined}
        title={isAdmin ? "Opens the Admin sidebar in place of the main menu" : undefined}
      >
        {mode === "after" && level === 0 && <Icon name={node.icon} />}
        <span className="nav-label">{node.label}</span>
        {mode === "before" && node.tier !== "keep" && <Tag kind={tier.kind}>{tier.label}</Tag>}
        {mode === "before" && off && <Tag kind="gray">Off</Tag>}
        {mode === "after" && node.isNew && <Tag kind="blue">New</Tag>}
        {isAdmin && <span className="nav-go">›</span>}
        {!isAdmin && kids.length > 0 && <span className={`nav-chev ${open ? "open" : ""}`} dangerouslySetInnerHTML={{ __html: D.icons.chevron }} />}
      </button>
      {kids.length > 0 && open && (
        <ul>
          {kids.map((k) => (
            <NavItem key={k.id} node={k} level={level + 1} selected={selected} onSelect={onSelect} mode={mode} showOff={showOff} stockOnly={stockOnly} />
          ))}
        </ul>
      )}
    </li>
  );
}

function visibleBefore(n, mode, showOff, stockOnly) {
  if (mode !== "before") return true;
  if (!showOff && !n.active) return false;
  if (stockOnly && !n.inDefault) return false;
  return true;
}

function SideNavPanel({ title, nodes, mode, selected, onSelect, showOff, stockOnly }) {
  const roots = nodes.filter((n) => visibleBefore(n, mode, showOff, stockOnly));
  return (
    <nav className="sidenav" aria-label={title}>
      <div className="sidenav-title">{title}</div>
      <ul>
        {roots.map((n) => (
          <NavItem key={n.id} node={n} level={0} selected={selected} onSelect={onSelect} mode={mode} showOff={showOff} stockOnly={stockOnly} />
        ))}
      </ul>
    </nav>
  );
}

/* ---------- Admin ---------- */

function AdminBefore({ onSelect, selected }) {
  const nav = React.useContext(NavCtx);
  const [open, setOpen] = useState(() => Object.fromEntries(D.admin.current.map((g) => [g.label, true])));
  const retired = Object.fromEntries(D.admin.retire.map(([k, l, tier, why]) => [k, why]));
  return (
    <nav className="sidenav" aria-label="Current admin sidebar">
      <div className="sidenav-title">{t("preview.admin.current", "Current Admin sidebar")}</div>
      <ul>
        <li><button className="nav-row lvl-0 back" onClick={() => nav.backToMain()}>‹ Back to main menu</button></li>
        {D.admin.current.map((g) => (
          <li key={g.label}>
            <button className="nav-row lvl-0" onClick={() => { setOpen({ ...open, [g.label]: !open[g.label] }); onSelect({ admin: true, label: g.label, key: g.key }); }}>
              <span className="nav-label">{g.label}</span>
              {g.key && retired[g.key] && <Tag kind="red">Remove</Tag>}
              {g.kids.length > 0 && <span className={`nav-chev ${open[g.label] ? "open" : ""}`} dangerouslySetInnerHTML={{ __html: D.icons.chevron }} />}
            </button>
            {open[g.label] && (
              <ul>
                {g.kids.map((k) => (
                  <li key={k.key}>
                    <button className={`nav-row lvl-1 ${selected && selected.key === k.key ? "is-selected" : ""}`} onClick={() => onSelect({ admin: true, label: k.label, key: k.key, group: g.label })}>
                      <span className="nav-label">{k.label}</span>
                      {retired[k.key] && <Tag kind="red">Remove</Tag>}
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </li>
        ))}
      </ul>
    </nav>
  );
}

function AdminAfter({ onSelect, selected }) {
  const nav = React.useContext(NavCtx);
  const [open, setOpen] = useState(() => Object.fromEntries(D.admin.target.flatMap((b) => b.entries.filter((e) => e.group).map((e) => [e.group, true]))));
  const leaf = (it, bucket, group) => (
    <li key={it.key}>
      <button className={`nav-row ${group ? "lvl-1" : "lvl-0"} ${selected && selected.key === it.key ? "is-selected" : ""}`} onClick={() => onSelect({ admin: true, label: it.label, key: it.key, bucket, group, note: it.note })}>
        <span className="nav-label">{it.label}</span>
        {it.note && it.note.startsWith("Orphan") && <Tag kind="blue">Added</Tag>}
      </button>
    </li>
  );
  return (
    <nav className="sidenav" aria-label="Proposed admin sidebar">
      <div className="sidenav-title">{t("preview.admin.proposed", "Proposed Admin sidebar")}</div>
      <ul>
        <li><button className="nav-row lvl-0 back" onClick={() => nav.backToMain()}>‹ Back to main menu</button></li>
        {D.admin.target.map((b) => (
          <React.Fragment key={b.bucket}>
            <li className="nav-divider" />
            <li className="nav-section">{b.bucket}</li>
            {b.entries.map((e) =>
              e.group ? (
                <li key={e.group}>
                  <button className="nav-row lvl-0" onClick={() => setOpen({ ...open, [e.group]: !open[e.group] })}>
                    <span className="nav-label">{e.group}</span>
                    <span className={`nav-chev ${open[e.group] ? "open" : ""}`} dangerouslySetInnerHTML={{ __html: D.icons.chevron }} />
                  </button>
                  {open[e.group] && <ul>{e.items.map((it) => leaf(it, b.bucket, e.group))}</ul>}
                </li>
              ) : (
                leaf(e, b.bucket)
              )
            )}
          </React.Fragment>
        ))}
        <li className="nav-divider" />
        <li><div className="nav-row lvl-0 muted">Legacy Admin ↗</div></li>
      </ul>
    </nav>
  );
}

/* ---------- Detail + search ---------- */

function Detail({ item, flatAfter }) {
  if (!item) {
    return (
      <div className="cds--tile detail empty">
        <p className="cds--type-body-compact-01">{t("preview.detail.empty", "Select any menu entry to see where it came from, where it goes, and why.")}</p>
      </div>
    );
  }
  if (item.admin) {
    const moveTo = findAdminTarget(item.key);
    const ret = D.admin.retire.find((r) => r[0] === item.key);
    return (
      <div className="cds--tile detail">
        <h4 className="cds--type-heading-compact-02">{item.label}</h4>
        <dl>
          {item.key && <><dt>Route</dt><dd><code>/MasterListsPage/{item.key}</code></dd></>}
          {ret ? <><dt>Disposition</dt><dd><Tag kind="red">Remove</Tag> {ret[3]}</dd></> : null}
          {moveTo && <><dt>Proposed location</dt><dd>Admin › {moveTo}</dd></>}
          {item.note && <><dt>Note</dt><dd>{item.note}</dd></>}
        </dl>
      </div>
    );
  }
  const before = item.tier !== undefined;
  const tier = before ? TIER[item.tier] : null;
  return (
    <div className="cds--tile detail">
      <h4 className="cds--type-heading-compact-02">{item.label} <code className="eid">{item.id}</code></h4>
      <dl>
        {item.url ? <><dt>URL</dt><dd><code>{item.url}</code></dd></> : <><dt>URL</dt><dd className="muted">none (folder or heading)</dd></>}
        {before && (
          <>
            <dt>Disposition</dt>
            <dd><Tag kind={tier.kind}>{tier.label}</Tag> {item.reason}</dd>
            {item.newPath && <><dt>Proposed location</dt><dd>{item.newPath}</dd></>}
            {item.redirect && item.redirect !== "-" && <><dt>Redirect</dt><dd><code>{item.redirect}</code></dd></>}
            <dt>Current state</dt>
            <dd>{item.active ? "Active" : "Switched off"} · {item.inDefault ? "shown by the stock profile" : "not in the stock profile"} · source: {item.source}</dd>
          </>
        )}
        {!before && (
          <>
            {item.oldLabel && <><dt>Was labelled</dt><dd>{item.oldLabel}</dd></>}
            {item.flag === "unified-off" && <><dt>Visibility</dt><dd>Only when unified Results Entry is switched off</dd></>}
            {item.note && <><dt>Change</dt><dd>{item.note}</dd></>}
            {item.isNew && <><dt>Row</dt><dd><Tag kind="blue">New row</Tag></dd></>}
          </>
        )}
      </dl>
    </div>
  );
}

function findAdminTarget(key) {
  for (const b of D.admin.target) {
    for (const e of b.entries) {
      const items = e.group ? e.items : [e];
      for (const it of items) if (it.key === key) return [b.bucket, e.group, it.label].filter(Boolean).join(" › ");
    }
  }
  return null;
}

function WhereDidItGo({ flatBefore, onSelect }) {
  const [q, setQ] = useState("");
  const rows = useMemo(() => {
    if (q.trim().length < 2) return [];
    const s = q.toLowerCase();
    return flatBefore.filter((n) => n.label.toLowerCase().includes(s) || n.path.join(" ").toLowerCase().includes(s) || n.id.includes(s)).slice(0, 25);
  }, [q, flatBefore]);
  return (
    <div className="where">
      <div className="cds--text-input-wrapper">
        <label className="cds--label" htmlFor="where">{t("preview.where.label", "Where did it go?")}</label>
        <input id="where" className="cds--text-input" placeholder={t("preview.where.placeholder", "Type a current menu label, e.g. Activity, Study, WHONET")} value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      {rows.length > 0 && (
        <div className="cds--data-table-container">
          <table className="cds--data-table cds--data-table--sm">
            <thead><tr><th>Current location</th><th>Disposition</th><th>Proposed location / redirect</th></tr></thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.id} onClick={() => onSelect(r)} className="clickable">
                  <td>{r.path.join(" › ")}{!r.active && <span className="muted"> (off)</span>}</td>
                  <td><Tag kind={TIER[r.tier].kind}>{TIER[r.tier].label}</Tag></td>
                  <td>{r.newPath || (r.redirect && r.redirect !== "-" ? <code>{r.redirect}</code> : <span className="muted">no replacement</span>)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {q.trim().length >= 2 && rows.length === 0 && <p className="muted small">No current entry matches.</p>}
    </div>
  );
}

function Summary({ flatBefore }) {
  const count = (tier) => flatBefore.filter((n) => n.tier === tier).length;
  const tiles = [
    ["Current entries", flatBefore.length, "any state, main menu"],
    ["Keep", count("keep"), "regrouped or relabelled where needed"],
    ["Merge", count("merge"), "duplicates and single-child folders"],
    ["Hide", count("hide"), "ship switched off, can be re-enabled"],
    ["Remove", count("remove"), "row, route and code deleted"],
  ];
  return (
    <div className="summary">
      {tiles.map(([l, v, s]) => (
        <div key={l} className="cds--tile stat">
          <div className="stat-v">{v}</div>
          <div className="stat-l">{l}</div>
          <div className="stat-s">{s}</div>
        </div>
      ))}
    </div>
  );
}

function Switcher({ options, value, onChange, label }) {
  return (
    <div className="switcher" role="tablist" aria-label={label}>
      {options.map(([v, l]) => (
        <button key={v} role="tab" aria-selected={value === v} className={`sw ${value === v ? "on" : ""}`} onClick={() => onChange(v)}>{l}</button>
      ))}
    </div>
  );
}

function App() {
  const [menu, setMenu] = useState("main");
  const [view, setView] = useState("compare");
  const [showOff, setShowOff] = useState(true);
  const [stockOnly, setStockOnly] = useState(false);
  const [selected, setSelected] = useState(null);
  const flatBefore = useMemo(() => flatten(D.before), []);
  const flatAfter = useMemo(() => flatten(D.after), []);

  const navApi = { openAdmin: () => { setMenu("admin"); setSelected(null); }, backToMain: () => { setMenu("main"); setSelected(null); } };
  return (
    <NavCtx.Provider value={navApi}>
    <div className="app">
      <header className="shell">
        <span className="shell-brand">OpenELIS Global</span>
        <span className="shell-crumb">Navigation redesign · design preview</span>
      </header>
      <div className="toolbar">
        <Switcher label="Menu" value={menu} onChange={(v) => { setMenu(v); setSelected(null); }} options={[["main", "Main menu"], ["admin", "Admin sidebar"]]} />
        <Switcher label="View" value={view} onChange={setView} options={[["after", "Proposed"], ["before", "Current"], ["compare", "Side by side"]]} />
        {menu === "main" && view !== "after" && (
          <div className="checks">
            <label className="chk"><input type="checkbox" checked={showOff} onChange={(e) => setShowOff(e.target.checked)} /> Show switched-off rows</label>
            <label className="chk"><input type="checkbox" checked={stockOnly} onChange={(e) => setStockOnly(e.target.checked)} /> Only what a stock install shows</label>
          </div>
        )}
      </div>
      <div className="body">
        <div className="navs">
          {menu === "main" && (view === "before" || view === "compare") && (
            <SideNavPanel title="Current (develop, 2026-09-24)" nodes={D.before} mode="before" selected={selected} onSelect={setSelected} showOff={showOff} stockOnly={stockOnly} />
          )}
          {menu === "main" && (view === "after" || view === "compare") && (
            <SideNavPanel title="Proposed" nodes={D.after} mode="after" selected={selected} onSelect={setSelected} />
          )}
          {menu === "admin" && (view === "before" || view === "compare") && <AdminBefore onSelect={setSelected} selected={selected} />}
          {menu === "admin" && (view === "after" || view === "compare") && <AdminAfter onSelect={setSelected} selected={selected} />}
        </div>
        <main className="content">
          {menu === "main" ? (
            <>
              <h2 className="cds--type-heading-03">Main menu</h2>
              <p className="lede">Six workflow sections, three levels at most, one entry per destination. Admin opens its own sidebar in place of this one, as in the app: click Admin, or use the Admin sidebar tab. Click any entry on either side for its disposition. Tags on the current menu show what happens to each row.</p>
              <Summary flatBefore={flatBefore} />
              <div className="legend">
                <Tag kind="red">Remove</Tag><span>row, route and page code deleted; URL redirects</span>
                <Tag kind="purple">Hide</Tag><span>ships switched off; Admin can switch it on</span>
                <Tag kind="warm-gray">Merge</Tag><span>another entry already reaches this page</span>
                <Tag kind="blue">New</Tag><span>new heading or group row</span>
              </div>
              <Detail item={selected} flatAfter={flatAfter} />
              <WhereDidItGo flatBefore={flatBefore} onSelect={setSelected} />
            </>
          ) : (
            <>
              <h2 className="cds--type-heading-03">Admin sidebar</h2>
              <p className="lede">28 unordered top-level items become five buckets: Config, Organization, Resources, Automation, Compliance (D-010). Three routed pages that were missing from the sidebar are added; Study Menu and MenuStatement Configuration are removed. Every group is expanded so the whole structure is visible; Back to main menu returns to the main menu, as in the app.</p>
              <div className="summary">
                {[["Current top-level", 28, "no grouping"], ["Pages", 59, "58 today + 3 orphans - 2 removed"], ["Buckets", 5, "D-010"], ["Added", 3, "Barcode, Environmental Compliance Standards, Notification Triggers"], ["Removed", 2, "Study Menu, MenuStatement"]].map(([l, v, s]) => (
                  <div key={l} className="cds--tile stat"><div className="stat-v">{v}</div><div className="stat-l">{l}</div><div className="stat-s">{s}</div></div>
                ))}
              </div>
              <Detail item={selected} />
              <div className="cds--tile bucket-notes">
                {D.admin.target.map((b) => (
                  <p key={b.bucket}><strong>{b.bucket}</strong>: {b.note}.</p>
                ))}
              </div>
            </>
          )}
        </main>
      </div>
    </div>
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
