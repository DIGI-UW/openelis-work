<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S-08 v2.0: QC Result Evaluation & Validation Warning — In Context</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #491d8b; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .oe-shell { background: #f4f4f4; min-height: 100vh; }
    .oe-topbar { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
    .oe-topbar .logo { font-weight: 600; font-size: 14px; }
    .oe-topbar .nav-item { font-size: 13px; opacity: 0.7; cursor: pointer; }
    .oe-topbar .nav-item:hover { opacity: 1; }
    .oe-topbar .spacer { flex: 1; }
    .oe-topbar .user { font-size: 12px; opacity: 0.7; }
    .oe-breadcrumb { background: #fff; padding: 8px 24px; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #525252; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-breadcrumb .sep { margin: 0 6px; color: #c6c6c6; }
    .oe-page { padding: 16px 24px; max-width: 1300px; margin: 0 auto; }
    .oe-page-header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; }
    .oe-page-title { font-size: 28px; font-weight: 300; margin: 0; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin: 4px 0 0 0; }
    .tile { background: #fff; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 0.75rem 0; }
    .form-field { margin-bottom: 0.75rem; }
    .form-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .form-field input, .form-field textarea {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d;
      font-size: 14px; background: #f4f4f4; outline: none; box-sizing: border-box;
    }
    .grid { display: grid; gap: 1rem; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .helper { font-size: 12px; color: #525252; }
    .btn { padding: 6px 14px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: #0f62fe; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .btn-primary:disabled { background: #c6c6c6; color: #8d8d8d; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; background: #f4f4f4; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e0e0e0; }
    th.new-col { background: #fcf4d6; }
    td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    td code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #f4f4f4; padding: 2px 6px; }
    td input[type="number"] { width: 80px; padding: 4px 8px; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }
    .tag-purple { background: #e8daff; color: #491d8b; }
    .tag-gray { background: #e0e0e0; color: #161616; }
    .tag-cyan { background: #bae6ff; color: #003a6d; }
    .tag-green { background: #defbe6; color: #0e6027; }
    .tag-red { background: #ffd7d9; color: #a2191f; }
    .new-region { border: 2px dashed #f1c21b; border-radius: 6px; padding: 12px; position: relative; margin-bottom: 1rem; }
    .new-region::before {
      content: 'S-08 v2 NEW'; position: absolute; top: -11px; left: 12px;
      background: #f1c21b; color: #000; font-size: 11px; font-weight: 700;
      padding: 1px 8px; border-radius: 4px; z-index: 2;
    }
    .scenes { background: #393939; color: #fff; display: flex; padding: 0; }
    .scene { padding: 10px 16px; cursor: pointer; font-size: 13px; border-right: 1px solid #525252; }
    .scene:hover { background: #525252; }
    .scene.active { background: #0f62fe; font-weight: 600; }
    .notification.warning { padding: 12px 16px; border-left: 3px solid #f1c21b; background: #fff8e1; margin-bottom: 12px; font-size: 13px; }
    .notification.warning strong { font-weight: 600; display: block; margin-bottom: 4px; }
    .ack-box { margin-top: 16px; padding: 16px; border: 1px solid #e0e0e0; background: #fcf4d6; }
    .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
    .stack-h { display: flex; gap: 8px; align-items: center; }
    .badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .domain-badge.purple { background: #e8daff; color: #491d8b; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }
    .filter-bar { display: flex; gap: 12px; align-items: flex-end; padding: 12px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .cds-tabs { display: flex; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .cds-tab { padding: 12px 20px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
    .cds-tab.active { border-bottom-color: #0f62fe; font-weight: 600; color: #161616; background: #f4f4f4; }
  </style>
</head>
<body>
  <div class="preview-banner">⚡ S-08 v2.0 — QC Result Evaluation + Validation Warning — IN-CONTEXT preview (Protocol Config + Sample Creation removed)</div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const TESTS = [
      { id: 't-014', name: 'Lead (Pb)', unit: 'mg/L', blankThreshold: 0.003, rpd: 20, recovery: 20, domain: 'Environmental' },
      { id: 't-015', name: 'Mercury (Hg)', unit: 'mg/L', blankThreshold: 0.0001, rpd: 20, recovery: 20, domain: 'Environmental' },
      { id: 't-005', name: 'pH', unit: '—', blankThreshold: '', rpd: 5, recovery: 10, domain: 'Environmental' },
      { id: 't-008', name: 'COD', unit: 'mg/L', blankThreshold: 5, rpd: 25, recovery: 20, domain: 'Environmental' },
    ];

    const RESULTS = [
      { id: 1, accession: 'ENV-2026-0412.001', test: 'Lead (Pb)', result: '0.05 mg/L', qcType: null, qcEval: null, detail: null },
      { id: 2, accession: 'ENV-2026-0412.001', test: 'Mercury (Hg)', result: '0.0008 mg/L', qcType: null, qcEval: null, detail: null },
      { id: 3, accession: 'ENV-2026-0412.002', test: 'Lead (Pb)', result: '0.04 mg/L', qcType: null, qcEval: null, detail: null },
      { id: 4, accession: 'QC-BLNK-001', test: 'Lead (Pb)', result: '0.001 mg/L', qcType: 'BLANK', qcEval: 'PASS', detail: '0.001 ≤ 0.003 (threshold)' },
      { id: 5, accession: 'QC-BLNK-001', test: 'Mercury (Hg)', result: '0.0003 mg/L', qcType: 'BLANK', qcEval: 'FAIL', detail: '0.0003 > 0.0001 threshold (potential contamination)' },
      { id: 6, accession: 'QC-DUP-001', test: 'Lead (Pb)', result: '0.052 mg/L', qcType: 'DUPLICATE', qcEval: 'PASS', detail: 'RPD = 3.9% (threshold 20%); parent ENV-2026-0412.001' },
      { id: 7, accession: 'QC-CTRL-001', test: 'Lead (Pb)', result: '0.078 mg/L', qcType: 'CONTROL', qcEval: 'FAIL', detail: 'Recovery 78% (window 80–120%); expected 0.100' },
    ];

    const QC_TAG = {
      PASS: { cls: 'tag-green', label: 'QC Pass' },
      FAIL: { cls: 'tag-red', label: 'QC Fail' },
      N_A: { cls: 'tag-gray', label: 'QC N/A' },
    };

    function Topbar() {
      return (
        <div className="oe-topbar">
          <span className="logo">OpenELIS Global</span>
          <span className="nav-item">Home</span>
          <span className="nav-item">Order</span>
          <span className="nav-item">Results</span>
          <span className="nav-item">Validation</span>
          <span className="nav-item">Admin</span>
          <span className="spacer"></span>
          <span className="user">caseyi · Validator</span>
        </div>
      );
    }

    function Breadcrumb({ trail }) {
      return (
        <div className="oe-breadcrumb">
          {trail.map((t, i) => (
            <span key={i}>
              {i > 0 && <span className="sep">›</span>}
              {i < trail.length - 1 ? <a href="#">{t}</a> : <strong>{t}</strong>}
            </span>
          ))}
        </div>
      );
    }

    function PageHeader({ title, subtitle }) {
      return (
        <div className="oe-page-header">
          <h1 className="oe-page-title">{title}</h1>
          {subtitle && <p className="oe-page-subtitle">{subtitle}</p>}
        </div>
      );
    }

    function Scene1_TestCatalog() {
      return (
        <div>
          <Breadcrumb trail={['Admin', 'Test Catalog Management', 'Test Catalog Editor']} />
          <PageHeader title="Test Catalog" subtitle="S-08 v2 adds three QC threshold columns per env/vector test." />
          <div className="oe-page">
            <div className="filter-bar">
              <div className="form-field" style={{ minWidth: 280, marginBottom: 0 }}>
                <label>Search</label><input placeholder="Test name or LOINC..." />
              </div>
              <div className="form-field" style={{ marginBottom: 0 }}>
                <label>Domain</label>
                <select defaultValue="Environmental">
                  <option>All</option><option>Clinical</option><option>Environmental</option><option>Vector</option>
                </select>
              </div>
            </div>

            <div className="tile" style={{ marginTop: 16 }}>
              <table>
                <thead>
                  <tr>
                    <th>Test Name</th>
                    <th>Unit</th>
                    <th>Domain</th>
                    <th className="new-col">Blank Threshold (new)</th>
                    <th className="new-col">RPD Threshold % (new)</th>
                    <th className="new-col">Recovery Window ± % (new)</th>
                  </tr>
                </thead>
                <tbody>
                  {TESTS.map(t => (
                    <tr key={t.id}>
                      <td>{t.name}</td>
                      <td>{t.unit}</td>
                      <td><span className="tag tag-purple">{t.domain}</span></td>
                      <td><input type="number" defaultValue={t.blankThreshold} step={0.001} /></td>
                      <td><input type="number" defaultValue={t.rpd} min={0} max={100} /></td>
                      <td><input type="number" defaultValue={t.recovery} min={0} max={100} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="helper" style={{ marginTop: 8 }}>
                ⚠️ Yellow columns = new from S-08 v2. Visible only for env/vector tests. Drives <code>evaluateQc()</code> at result-save time.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function Scene2_ResultsEntry() {
      return (
        <div>
          <Breadcrumb trail={['Results', 'Result Entry', 'ENV-2026-0412']} />
          <PageHeader title="Results Entry — Order ENV-2026-0412" subtitle="Expanded results panel with QC Status column added by S-08 v2." />
          <div className="oe-page">
            <div className="tile">
              <div className="badge-row">
                <span className="domain-badge purple">Environmental</span>
                <span className="helper">Site: WS-001 Ciliwung · 3 client samples · 4 QC samples</span>
              </div>
            </div>

            <div className="cds-tabs">
              <div className="cds-tab active">Results</div>
              <div className="cds-tab">Compliance (S-05)</div>
              <div className="cds-tab">History</div>
            </div>

            <div className="tile">
              <h5>Results Table</h5>
              <table>
                <thead>
                  <tr>
                    <th>Accession</th><th>Test</th><th>Result</th><th>Sample Kind</th>
                    <th className="new-col">QC Status (new)</th>
                    <th className="new-col">Detail (new)</th>
                  </tr>
                </thead>
                <tbody>
                  {RESULTS.map(r => {
                    const tag = r.qcEval ? QC_TAG[r.qcEval] : null;
                    return (
                      <tr key={r.id}>
                        <td><code>{r.accession}</code></td>
                        <td>{r.test}</td>
                        <td><strong>{r.result}</strong></td>
                        <td>
                          {r.qcType
                            ? <span className={`tag ${r.qcType === 'BLANK' ? 'tag-gray' : r.qcType === 'DUPLICATE' ? 'tag-cyan' : 'tag-green'}`}>{r.qcType}</span>
                            : <span className="helper">Client sample</span>}
                        </td>
                        <td>{tag ? <span className={`tag ${tag.cls}`}>{tag.label}</span> : <span className="helper">—</span>}</td>
                        <td>
                          <span style={{ fontSize: 12, color: r.qcEval === 'FAIL' ? '#a2191f' : '#525252' }}>
                            {r.detail || '—'}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              <p className="helper" style={{ marginTop: 8 }}>
                ⚠️ Yellow columns = new from S-08 v2. <code>evaluateQc()</code> runs at result-save time. Failures surface as a warning on the validation screen (Scene 3).
              </p>
            </div>

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">Save Draft</button>
                <button className="btn btn-primary">Save Results</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Scene3_Validation() {
      const [ack, setAck] = useState(false);
      const [just, setJust] = useState('');
      const failures = RESULTS.filter(r => r.qcEval === 'FAIL');
      const canRelease = failures.length === 0 || (ack && just.trim().length > 0);
      return (
        <div>
          <Breadcrumb trail={['Validation', 'Pending Validation', 'ENV-2026-0412']} />
          <PageHeader title="Validation — Order ENV-2026-0412" subtitle="Validator review screen. QC failures block release until acknowledged." />
          <div className="oe-page">
            <div className="tile">
              <div className="badge-row">
                <span className="domain-badge purple">Environmental</span>
                <span className="helper">3 client results validated · 4 QC results auto-evaluated</span>
              </div>
            </div>

            <div className="tile">
              <h5>Client Results (existing validation flow)</h5>
              <table>
                <thead><tr><th>Accession</th><th>Test</th><th>Result</th><th>Compliance</th></tr></thead>
                <tbody>
                  {RESULTS.filter(r => !r.qcType).map(r => (
                    <tr key={r.id}>
                      <td><code>{r.accession}</code></td>
                      <td>{r.test}</td>
                      <td><strong>{r.result}</strong></td>
                      <td><span className="tag tag-green">Pass</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="new-region">
              <div className="tile" style={{ marginBottom: 0 }}>
                <div className="notification warning">
                  <strong>⚠ QC failures detected — {failures.length} of {RESULTS.filter(r => r.qcType).length} QC samples failed acceptance criteria</strong>
                  Review and acknowledge below before releasing results.
                </div>

                <h5 style={{ marginTop: 16 }}>Failed QC Samples</h5>
                <table>
                  <thead><tr><th>QC Sample</th><th>Type</th><th>Test</th><th>Result</th><th>Detail</th></tr></thead>
                  <tbody>
                    {failures.map(r => (
                      <tr key={r.id}>
                        <td><code>{r.accession}</code></td>
                        <td><span className={`tag ${r.qcType === 'BLANK' ? 'tag-gray' : 'tag-green'}`}>{r.qcType}</span></td>
                        <td>{r.test}</td>
                        <td><strong>{r.result}</strong></td>
                        <td><span style={{ fontSize: 12, color: '#a2191f' }}>{r.detail}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div className="ack-box">
                  <h5>Required Acknowledgment</h5>
                  <label style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 13, fontWeight: 'normal' }}>
                    <input type="checkbox" checked={ack} onChange={(e) => setAck(e.target.checked)} style={{ marginTop: 2 }} />
                    I have reviewed the QC failures and assessed their impact on the result release.
                  </label>
                  <div className="form-field" style={{ marginTop: 12 }}>
                    <label>Justification (required, max 500 chars)</label>
                    <textarea rows={2} maxLength={500} value={just} onChange={(e) => setJust(e.target.value)}
                              placeholder="Why are these results acceptable to release despite QC failure?"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">Return to Analyst</button>
                <button className="btn btn-primary" disabled={!canRelease}>
                  {canRelease ? 'Release Results' : 'Acknowledge + justify to release'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [scene, setScene] = useState(0);
      const scenes = [
        { label: '1 — Test Catalog (QC threshold columns)', cmp: <Scene1_TestCatalog /> },
        { label: '2 — Results Entry (QC Status)', cmp: <Scene2_ResultsEntry /> },
        { label: '3 — Validation (warning + acknowledgment)', cmp: <Scene3_Validation /> },
      ];
      return (
        <div className="oe-shell">
          <Topbar />
          <div className="scenes">
            {scenes.map((s, i) => (
              <div key={i} className={`scene ${scene === i ? 'active' : ''}`} onClick={() => setScene(i)}>{s.label}</div>
            ))}
          </div>
          {scenes[scene].cmp}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
