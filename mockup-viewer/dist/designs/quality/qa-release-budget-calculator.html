<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Release Budget Calculator</title>

  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #f4f4f4; color: #161616; }

    .header { background: #161616; color: #fff; padding: 1rem 1.5rem; border-bottom: 1px solid #393939; }
    .header h1 { margin: 0; font-size: 1.125rem; font-weight: 500; }
    .header .sub { margin: 0.25rem 0 0 0; font-size: 0.8125rem; opacity: 0.7; }

    .layout { display: grid; grid-template-columns: 1fr 320px; min-height: calc(100vh - 60px); }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

    .main-col { padding: 1.5rem; overflow-y: auto; }
    .side-col { background: #fff; border-left: 1px solid #e0e0e0; padding: 1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    @media (max-width: 1100px) { .side-col { position: static; height: auto; border-left: 0; border-top: 1px solid #e0e0e0; } }

    /* Budget panel */
    .budget-card { background: #fff; border: 1px solid #e0e0e0; padding: 1.25rem; margin-bottom: 1.25rem; }
    .budget-total { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.75rem; }
    .budget-total .num { font-size: 2.5rem; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
    .budget-total .unit { font-size: 0.875rem; color: #525252; }
    .budget-bar { background: #e8e8e8; height: 16px; display: flex; overflow: hidden; margin-bottom: 0.75rem; }
    .budget-bar-fill { height: 100%; transition: width 0.2s; min-width: 0; }
    .budget-bar-fill.senior { background: #0f62fe; }
    .budget-bar-fill.mid { background: #4589ff; }
    .budget-bar-fill.junior { background: #78a9ff; }
    .budget-bar-fill.community { background: #198038; }
    .budget-legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.25rem 0.75rem; font-size: 0.75rem; }
    .budget-legend-row { display: flex; align-items: center; gap: 0.375rem; }
    .legend-swatch { width: 10px; height: 10px; flex: 0 0 10px; }
    .legend-swatch.senior { background: #0f62fe; }
    .legend-swatch.mid { background: #4589ff; }
    .legend-swatch.junior { background: #78a9ff; }
    .legend-swatch.community { background: #198038; }
    .budget-legend-row .label { color: #525252; flex: 1; }
    .budget-legend-row .value { font-variant-numeric: tabular-nums; font-weight: 500; }

    /* What ships */
    .ships-card { background: #fff; border: 1px solid #e0e0e0; padding: 1rem 1.25rem; }
    .ships-card h2 { font-size: 0.6875rem; font-weight: 600; margin: 0 0 0.5rem 0; color: #525252; text-transform: uppercase; letter-spacing: 0.04em; }
    .ships-card ul { list-style: none; margin: 0; padding: 0; font-size: 0.8125rem; }
    .ships-card li { padding: 0.25rem 0; color: #161616; display: flex; align-items: flex-start; gap: 0.5rem; line-height: 1.4; }
    .ships-card li::before { content: '✓'; color: #198038; font-weight: 600; flex: 0 0 14px; }

    /* Presets */
    .presets-card { background: #fff; border: 1px solid #e0e0e0; padding: 1.25rem; margin-bottom: 1.25rem; }
    .presets-card h2 { font-size: 0.6875rem; font-weight: 600; margin: 0 0 0.75rem 0; color: #525252; text-transform: uppercase; letter-spacing: 0.04em; }
    .preset-btn { display: block; width: 100%; padding: 0.625rem 0.75rem; background: #fff; border: 1px solid #e0e0e0; cursor: pointer; text-align: left; font-family: inherit; font-size: 0.8125rem; margin-bottom: 0.375rem; transition: background 0.08s; }
    .preset-btn:hover { background: #f4f4f4; border-color: #0f62fe; }
    .preset-btn .preset-name { font-weight: 500; color: #161616; }
    .preset-btn .preset-meta { font-size: 0.75rem; color: #6f6f6f; margin-top: 0.125rem; }
    .preset-btn.reset { color: #da1e28; border-color: #da1e28; margin-top: 0.5rem; }

    /* Phase sections */
    .phase { background: #fff; border: 1px solid #e0e0e0; margin-bottom: 1rem; }
    .phase-header { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 0.75rem; align-items: center; padding: 0.875rem 1rem; cursor: pointer; border-bottom: 1px solid transparent; }
    .phase-header:hover { background: #fafafa; }
    .phase.expanded .phase-header { border-bottom-color: #f0f0f0; }
    .phase-header .toggle-checkbox { width: 16px; height: 16px; border: 1px solid #8d8d8d; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.625rem; line-height: 1; }
    .phase-header .toggle-checkbox.all { background: #0f62fe; border-color: #0f62fe; color: #fff; }
    .phase-header .toggle-checkbox.partial { background: #fff; border-color: #0f62fe; color: #0f62fe; }
    .phase-header .toggle-checkbox.partial::after { content: '−'; }
    .phase-header .toggle-checkbox.all::after { content: '✓'; }
    .phase-header .title-block { display: flex; flex-direction: column; gap: 0.125rem; }
    .phase-header .name { font-size: 0.9375rem; font-weight: 600; }
    .phase-header .desc { font-size: 0.75rem; color: #6f6f6f; }
    .phase-header .selected-count { font-size: 0.8125rem; color: #525252; font-variant-numeric: tabular-nums; }
    .phase-header .hours { font-size: 0.875rem; font-weight: 500; color: #161616; font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; }
    .phase-header .chev { font-size: 0.75rem; color: #6f6f6f; transition: transform 0.12s; margin-left: 0.5rem; }
    .phase.expanded .phase-header .chev { transform: rotate(90deg); }
    .phase-body { display: none; }
    .phase.expanded .phase-body { display: block; }

    .group-header { padding: 0.625rem 1rem 0.5rem 1rem; font-size: 0.75rem; font-weight: 600; color: #525252; text-transform: uppercase; letter-spacing: 0.04em; background: #fafafa; border-bottom: 1px solid #f0f0f0; display: grid; grid-template-columns: 24px 1fr auto auto; gap: 0.75rem; align-items: center; }
    .group-header .group-name { font-weight: 600; color: #161616; text-transform: none; letter-spacing: 0; font-size: 0.8125rem; }

    .item-row { display: grid; grid-template-columns: 24px 1fr 80px 120px; gap: 0.75rem; align-items: start; padding: 0.625rem 1rem 0.75rem; border-top: 1px solid #f7f7f7; cursor: pointer; transition: background 0.08s; }
    .item-row:hover { background: #fafafa; }
    .item-row.selected { background: #edf5ff; }
    .item-row .checkbox { width: 16px; height: 16px; border: 1px solid #8d8d8d; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.625rem; line-height: 1; margin-top: 2px; flex: none; }
    .item-row .checkbox.checked { background: #0f62fe; border-color: #0f62fe; color: #fff; }
    .item-row .checkbox.checked::after { content: '✓'; }
    .item-row .label-block { display: flex; flex-direction: column; gap: 0.1875rem; min-width: 0; }
    .item-row .label-row { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
    .item-row .label { font-size: 0.875rem; color: #161616; font-weight: 500; }
    .item-row .id { font-family: 'IBM Plex Mono', monospace; font-size: 0.6875rem; color: #6f6f6f; }
    .item-row .desc { font-size: 0.75rem; color: #525252; line-height: 1.4; }
    .item-row .hours { font-size: 0.8125rem; font-variant-numeric: tabular-nums; color: #525252; text-align: right; padding-top: 2px; }
    .item-row .role { display: flex; gap: 0.25rem; justify-content: flex-end; padding-top: 2px; flex-wrap: wrap; }
    .role-pill { font-size: 0.625rem; padding: 0.125rem 0.375rem; border-radius: 8px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
    .role-pill.senior { background: #d0e2ff; color: #002d9c; }
    .role-pill.mid { background: #b8c5e0; color: #002d9c; }
    .role-pill.junior { background: #e8eaef; color: #525252; }
    .role-pill.community { background: #defbe6; color: #0e6027; }
    .role-pill.tbd { background: #fff1c2; color: #6f4700; }

    /* Section title */
    .section-intro { padding: 1rem 1rem 0.5rem; background: #fff; border: 1px solid #e0e0e0; border-bottom: 0; }
    .section-intro h2 { margin: 0 0 0.25rem; font-size: 0.875rem; font-weight: 600; }
    .section-intro p { margin: 0; font-size: 0.8125rem; color: #525252; }

    /* Reset / all controls */
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .controls button { padding: 0.375rem 0.75rem; background: #fff; border: 1px solid #c6c6c6; cursor: pointer; font-family: inherit; font-size: 0.8125rem; }
    .controls button:hover { background: #f4f4f4; }

    .footnote { font-size: 0.75rem; color: #6f6f6f; margin-top: 1rem; padding: 0 0.25rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, Fragment } = React;

    /* ============================================================
       DATA — every item from qa-release-plan.md

       ============================================================ */

    const DATA = {

                { id: 'A.1.4',  label: 'Route mounts at new paths',                                            desc: 'Mount existing OpenELIS components (QC Dashboard, EQA pages, Audit Trail) at new URLs under /qa/. Components themselves are unchanged.',                                                                                                  low: 4,  high: 6,  role: 'junior' },

    /* ============================================================
       PRESETS
       ============================================================ */

    const PRESETS = [
      { id: 'foundation',      name: 'Foundation only',        desc: 'Phase A — ship something working',                     phaseIds: ['A'] },
      { id: 'workflow',        name: 'Foundation + Core Value', desc: 'Add Westgard Tier 1 + E-Sig Log',                     phaseIds: ['A'], extraGroups: ['B.1', 'B.2'] },
      { id: 'stretch',         name: 'Stretch goal',           desc: 'Add v8 QI full + Westgard Tier 2',                     phaseIds: ['A'], extraGroups: ['B.1','B.2','C.1','C.3'] },
      { id: 'with-community',  name: 'Stretch + community help', desc: 'Above + Test Accreditation + Westgard Tier 3 (community)', phaseIds: ['A'], extraGroups: ['B.1','B.2','C.1','C.3','D.1','D.2'] },
      { id: 'everything',      name: 'Everything (excl. wait & see)', desc: 'All of Phases A through D',                     phaseIds: ['A','B','C','D'] },
    ];

    /* ============================================================
       Helpers
       ============================================================ */

    function flattenItems(data) {
      const out = [];
      data.phases.forEach(p => p.groups.forEach(g => g.items.forEach(it => out.push({ ...it, phaseId: p.id, groupId: g.id }))));
      return out;
    }

    function selectAllInGroup(groupId, selected) {
      const next = { ...selected };
      const all = flattenItems(DATA);
      all.filter(it => it.groupId === groupId).forEach(it => next[it.id] = true);
      return next;
    }
    function deselectAllInGroup(groupId, selected) {
      const next = { ...selected };
      const all = flattenItems(DATA);
      all.filter(it => it.groupId === groupId).forEach(it => delete next[it.id]);
      return next;
    }
    function selectAllInPhase(phaseId, selected) {
      const next = { ...selected };
      const all = flattenItems(DATA);
      all.filter(it => it.phaseId === phaseId).forEach(it => next[it.id] = true);
      return next;
    }
    function deselectAllInPhase(phaseId, selected) {
      const next = { ...selected };
      const all = flattenItems(DATA);
      all.filter(it => it.phaseId === phaseId).forEach(it => delete next[it.id]);
      return next;
    }

    function applyPreset(preset, allItems) {
      const next = {};
      const phaseSet = new Set(preset.phaseIds || []);
      const groupSet = new Set(preset.extraGroups || []);
      allItems.forEach(it => {
        if (phaseSet.has(it.phaseId) && it.phaseId !== 'E') next[it.id] = true;
        if (groupSet.has(it.groupId)) next[it.id] = true;
        if (it.role === 'tbd') delete next[it.id];  // never auto-select TBD
      });
      return next;
    }

    function computeTotals(selected, allItems) {
      let lowSum = 0, highSum = 0;
      const byRole = { senior: [0,0], mid: [0,0], junior: [0,0], community: [0,0], tbd: [0,0] };
      allItems.forEach(it => {
        if (selected[it.id]) {
          lowSum += it.low; highSum += it.high;
          const r = it.role in byRole ? it.role : 'tbd';
          byRole[r][0] += it.low; byRole[r][1] += it.high;
        }
      });
      return { lowSum, highSum, byRole };
    }

    /* ============================================================
       Components
       ============================================================ */

    function App() {
      const allItems = useMemo(() => flattenItems(DATA), []);
      const [selected, setSelected] = useState(() => applyPreset(PRESETS[0], allItems));
      const [expanded, setExpanded] = useState({ A: true, B: false, C: false, D: false, E: false });

      const totals = useMemo(() => computeTotals(selected, allItems), [selected, allItems]);

      const toggleItem = (id) => {
        setSelected(prev => {
          const next = { ...prev };
          if (next[id]) delete next[id];
          else next[id] = true;
          return next;
        });
      };

      const togglePhase = (phaseId) => {
        const phaseItems = allItems.filter(it => it.phaseId === phaseId && it.role !== 'tbd');
        const allOn = phaseItems.every(it => selected[it.id]);
        setSelected(prev => allOn ? deselectAllInPhase(phaseId, prev) : selectAllInPhase(phaseId, prev));
      };

      const toggleGroup = (groupId) => {
        const groupItems = allItems.filter(it => it.groupId === groupId && it.role !== 'tbd');
        const allOn = groupItems.every(it => selected[it.id]);
        setSelected(prev => allOn ? deselectAllInGroup(groupId, prev) : selectAllInGroup(groupId, prev));
      };

      const phaseStateOf = (phaseId) => {
        const items = allItems.filter(it => it.phaseId === phaseId && it.role !== 'tbd');
        const onCount = items.filter(it => selected[it.id]).length;
        if (onCount === 0) return 'none';
        if (onCount === items.length) return 'all';
        return 'partial';
      };

      const groupStateOf = (groupId) => {
        const items = allItems.filter(it => it.groupId === groupId && it.role !== 'tbd');
        if (items.length === 0) return 'none';
        const onCount = items.filter(it => selected[it.id]).length;
        if (onCount === 0) return 'none';
        if (onCount === items.length) return 'all';
        return 'partial';
      };

      const togglePhaseExpand = (phaseId) => {
        setExpanded(prev => ({ ...prev, [phaseId]: !prev[phaseId] }));
      };

      const applyPresetClick = (preset) => {
        setSelected(applyPreset(preset, allItems));
      };

      const resetAll = () => setSelected({});

      // What ships — derive from selected items
      const whatShips = useMemo(() => {
        const ships = [];
        DATA.phases.forEach(p => {
          if (p.id === 'E') return;
          const phaseItems = allItems.filter(it => it.phaseId === p.id && it.role !== 'tbd');
          const onItems = phaseItems.filter(it => selected[it.id]);
          if (onItems.length === 0) return;
          if (onItems.length === phaseItems.length) {
            // Full phase — show its customer value
            p.customerValue.forEach(v => ships.push(v));
          } else {
            // Partial phase — show by group
            p.groups.forEach(g => {
              const groupItems = allItems.filter(it => it.groupId === g.id && it.role !== 'tbd');
              const onCount = groupItems.filter(it => selected[it.id]).length;
              if (onCount === 0) return;
              if (onCount === groupItems.length) ships.push(`${g.name} (full)`);
              else ships.push(`${g.name} (${onCount} of ${groupItems.length} items)`);
            });
          }
        });
        return ships;
      }, [selected, allItems]);

      // Bar widths — proportional to total
      const totalForBar = totals.highSum || 1;
      const barWidth = (low, high) => `${(((low + high) / 2) / totalForBar) * 100}%`;

      return (
        <Fragment>
          <div className="header">
            <h1>OpenELIS QA Release — Budget Calculator</h1>
            <p className="sub">Toggle items to see what fits in your hours. Defaults to Phase A — Foundation.</p>
          </div>

          <div className="layout">
            <main className="main-col">
              <div className="controls">
                <button onClick={resetAll}>Reset all</button>
                <button onClick={() => setSelected(applyPreset({ phaseIds: ['A','B','C','D'] }, allItems))}>
                  Select everything (excl. wait & see)
                </button>
                <button onClick={() => setExpanded({ A: true, B: true, C: true, D: true, E: true })}>
                  Expand all phases
                </button>
                <button onClick={() => setExpanded({ A: false, B: false, C: false, D: false, E: false })}>
                  Collapse all phases
                </button>
              </div>

              {DATA.phases.map(phase => {
                const phaseState = phaseStateOf(phase.id);
                const phaseItems = allItems.filter(it => it.phaseId === phase.id);
                const phaseTotals = phaseItems.filter(it => selected[it.id]).reduce(
                  (a, it) => ({ low: a.low + it.low, high: a.high + it.high }), { low: 0, high: 0 }
                );
                return (
                  <section key={phase.id} className={`phase ${expanded[phase.id] ? 'expanded' : ''}`}>
                    <div className="phase-header">
                      <span className={`toggle-checkbox ${phaseState === 'all' ? 'all' : phaseState === 'partial' ? 'partial' : ''}`}
                        onClick={(e) => { e.stopPropagation(); togglePhase(phase.id); }}></span>
                      <div className="title-block" onClick={() => togglePhaseExpand(phase.id)}>
                        <span className="name">{phase.name}</span>
                        <span className="desc">{phase.desc}</span>
                      </div>
                      <span className="hours" onClick={() => togglePhaseExpand(phase.id)}>
                        {phaseTotals.low === phaseTotals.high
                          ? phaseTotals.low === 0 ? '—' : `${phaseTotals.low}h`
                          : `${phaseTotals.low}–${phaseTotals.high}h`}
                      </span>
                      <span className="chev" onClick={() => togglePhaseExpand(phase.id)}>▶</span>
                    </div>

                    {expanded[phase.id] && (
                      <div className="phase-body">
                        {phase.groups.map(group => {
                          const groupState = groupStateOf(group.id);
                          return (
                            <Fragment key={group.id}>
                              <div className="group-header">
                                <span className={`toggle-checkbox ${groupState === 'all' ? 'all' : groupState === 'partial' ? 'partial' : ''}`}
                                  onClick={() => toggleGroup(group.id)}></span>
                                <div>
                                  <div className="group-name">{group.id} — {group.name}</div>
                                  <div style={{ fontSize: '0.6875rem', color: '#6f6f6f', textTransform: 'none', letterSpacing: 0, marginTop: '0.125rem', fontWeight: 400 }}>
                                    {group.desc}
                                  </div>
                                </div>
                              </div>
                              {group.items.map(item => (
                                <div key={item.id}
                                  className={`item-row ${selected[item.id] ? 'selected' : ''}`}
                                  onClick={() => item.role !== 'tbd' && toggleItem(item.id)}>
                                  <span className={`checkbox ${selected[item.id] ? 'checked' : ''}`}></span>
                                  <div className="label-block">
                                    <div className="label-row">
                                      <span className="label">{item.label}</span>
                                      <span className="id">{item.id}</span>
                                    </div>
                                    {item.desc && <span className="desc">{item.desc}</span>}
                                  </div>
                                  <span className="hours">
                                    {item.role === 'tbd' ? <span style={{ color: '#6f4700' }}>TBD</span>
                                      : item.low === item.high ? `${item.low}h` : `${item.low}–${item.high}h`}
                                  </span>
                                  <span className="role">
                                    <span className={`role-pill ${item.role}`}>{item.role}</span>
                                    {item.commAlt && <span className="role-pill community">comm alt</span>}
                                  </span>
                                </div>
                              ))}
                            </Fragment>
                          );
                        })}
                      </div>
                    )}
                  </section>
                );
              })}

              <div className="footnote">
                Hours show low–high estimates (not midpoint). Senior dev work cannot easily be replaced by junior dev work without rework risk; junior items are interchangeable. <strong>Community alt</strong> = item could be community-led with senior review only. <strong>TBD</strong> items don't auto-select via presets — they need scope confirmation first (mostly waiting on NCE v2 scope).
              </div>
            </main>

            <aside className="side-col">
              <div className="budget-card">
                <div style={{ fontSize: '0.6875rem', color: '#525252', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: '0.375rem' }}>Total budget</div>
                <div className="budget-total">
                  <span className="num">{totals.lowSum === totals.highSum ? totals.lowSum : `${totals.lowSum}–${totals.highSum}`}</span>
                  <span className="unit">hours</span>
                </div>
                <div className="budget-bar">
                  {totals.byRole.senior[1] > 0 && <div className="budget-bar-fill senior" style={{ width: barWidth(totals.byRole.senior[0], totals.byRole.senior[1]) }} title={`Senior: ${totals.byRole.senior[0]}–${totals.byRole.senior[1]}h`}></div>}
                  {totals.byRole.mid[1] > 0    && <div className="budget-bar-fill mid"    style={{ width: barWidth(totals.byRole.mid[0],    totals.byRole.mid[1]) }}    title={`Mid: ${totals.byRole.mid[0]}–${totals.byRole.mid[1]}h`}></div>}
                  {totals.byRole.junior[1] > 0 && <div className="budget-bar-fill junior" style={{ width: barWidth(totals.byRole.junior[0], totals.byRole.junior[1]) }} title={`Junior: ${totals.byRole.junior[0]}–${totals.byRole.junior[1]}h`}></div>}
                  {totals.byRole.community[1] > 0 && <div className="budget-bar-fill community" style={{ width: barWidth(totals.byRole.community[0], totals.byRole.community[1]) }} title={`Community: ${totals.byRole.community[0]}–${totals.byRole.community[1]}h`}></div>}
                </div>
                <div className="budget-legend">
                  <div className="budget-legend-row">
                    <span className="legend-swatch senior"></span>
                    <span className="label">Senior</span>
                    <span className="value">{totals.byRole.senior[0]}–{totals.byRole.senior[1]}h</span>
                  </div>
                  <div className="budget-legend-row">
                    <span className="legend-swatch mid"></span>
                    <span className="label">Mid</span>
                    <span className="value">{totals.byRole.mid[0]}–{totals.byRole.mid[1]}h</span>
                  </div>
                  <div className="budget-legend-row">
                    <span className="legend-swatch junior"></span>
                    <span className="label">Junior</span>
                    <span className="value">{totals.byRole.junior[0]}–{totals.byRole.junior[1]}h</span>
                  </div>
                  <div className="budget-legend-row">
                    <span className="legend-swatch community"></span>
                    <span className="label">Community</span>
                    <span className="value">{totals.byRole.community[0]}–{totals.byRole.community[1]}h</span>
                  </div>
                </div>
              </div>

              <div className="presets-card">
                <h2>Presets</h2>
                {PRESETS.map(p => (
                  <button key={p.id} className="preset-btn" onClick={() => applyPresetClick(p)}>
                    <div className="preset-name">{p.name}</div>
                    <div className="preset-meta">{p.desc}</div>
                  </button>
                ))}
                <button className="preset-btn reset" onClick={resetAll}>
                  <div className="preset-name">Reset (deselect all)</div>
                </button>
              </div>

              <div className="ships-card">
                <h2>What ships</h2>
                {whatShips.length === 0 ? (
                  <div style={{ fontSize: '0.8125rem', color: '#6f6f6f', fontStyle: 'italic' }}>
                    Nothing selected yet. Pick a preset or toggle items to see what ships at your budget.
                  </div>
                ) : (
                  <ul>
                    {whatShips.map((s, i) => <li key={i}>{s}</li>)}
                  </ul>
                )}
              </div>
            </aside>
          </div>
        </Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
