const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function addTime(str, n, unit) {
  const [d, m, hm] = String(str).split(' '); if (!hm) return str; const [h, mi] = hm.split(':');
  const dt = new Date(2026, MON.indexOf(m), +d, +h, +mi); dt.setTime(dt.getTime() + n * (unit === 'Hours' ? 3600e3 : 86400e3));
  const p2 = x => String(x).padStart(2, '0'); return `${p2(dt.getDate())} ${MON[dt.getMonth()]} ${p2(dt.getHours())}:${p2(dt.getMinutes())}`;
}
/* ---------- Positive at (FR-05.4b, D-180): exact date and time, default server time, editable; elapsed to the minute ---------- */
const SERVER_NOW = '02 Oct 10:15';
function parseT(str) { const [d, m, hm] = String(str || '').trim().split(/\s+/); if (!hm || MON.indexOf(m) < 0) return null; const [h, mi] = hm.split(':'); if (mi === undefined) return null; const dt = new Date(2026, MON.indexOf(m), +d, +h, +mi); return isNaN(dt) ? null : dt; }
function elapsed(a, b) {
  const s = parseT(a), e = parseT(b); if (!s || !e || e < s) return '';
  const mins = Math.round((e - s) / 60000), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  const u = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  return [d ? u(d, 'day') : null, u(h, 'hour'), u(m, 'minute')].filter(Boolean).join(' ');
}

// Every panel that opens under a row: a title naming the action and the record, Close, and on opening it scrolls into view
// (only as far as needed), takes keyboard focus on its title and shows a brief outline so the eye finds it.
function ExpandPanel({ title, sub, onClose, children }) {
  const ref = useRef(null);
  const [flash, setFlash] = useState(true);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const opener = document.activeElement;
    const r = el.getBoundingClientRect(); const top = 120;
    if (r.top < top || r.top > window.innerHeight - 160) window.scrollTo({ top: window.scrollY + r.top - top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const h = el.querySelector('.xp-title'); if (h) h.focus({ preventScroll: true });
    const tm = setTimeout(() => setFlash(false), 1600);
    return () => { clearTimeout(tm); if (opener && opener.isConnected && opener.focus) opener.focus({ preventScroll: true }); };
  }, []);
  return <div ref={ref} className={'inline-panel xp' + (flash ? ' xp-flash' : '')} role="region" aria-label={title}>
    <div className="xp-head"><div><b className="xp-title" tabIndex={-1}>{title}</b>{sub && <div className="muted" style={{ fontSize: 13 }}>{sub}</div>}</div>
      <Btn kind="ghost" onClick={onClose}>{t('common.close', 'Close')}</Btn></div>
    {children}
  </div>;
}

/* ---------- How the case prints in the patient report: grouped under four sub-headers (OGC-1111 FR-A42, FR-A42a, D-181) ---------- */

  const line = (r, k) => <div key={k} style={{ paddingLeft: r.ind ? 10 * r.ind : 0, borderLeft: r.bar ? '2px solid #161616' : 0, fontWeight: r.b ? 700 : 400, color: r.muted ? '#595959' : '#161616', fontStyle: r.i ? 'italic' : 'normal' }}>{r.t}{r.r && <span style={{ float: 'right', fontWeight: r.rb === false ? 400 : 700, fontStyle: r.ri ? 'italic' : 'normal' }}>{r.r}</span>}</div>;

}

const GRAM_LABEL = { neg: 'Gram-negative', pos: 'Gram-positive', yeast: 'Yeast', afb: 'Acid-fast' };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
// FR-1.3, FR-1.4, FR-3.3: band 0 exact name or code, 1 starts with, 2 word starts (abbreviated genus works), 3 anywhere.
function matchOrg(o, q) {
  const n = norm(q); if (!n) return { band: 4, on: '' };
  const toks = n.split(' ');
  const test = (text) => { const v = norm(text); if (v === n) return 0; if (v.startsWith(n)) return 1; const w = v.split(' '); let i = 0; for (const tk of toks) { while (i < w.length && !w[i].startsWith(tk)) i++; if (i >= w.length) { i = -1; break; } i++; } if (i !== -1) return 2; if (v.includes(n)) return 3; return 9; };
  let best = { band: test(o.name), on: '' };
  for (const [sys, code] of Object.entries(o.codes)) if (norm(code) === n) return { band: 0, on: `${sys} code ${code}` };
  for (const s of o.syn) { const b = test(s); if (b < best.band) best = { band: b, on: `Formerly ${s}` }; }
  return best;
}
function searchOrgs(q, f = {}) {
  return ORGS.map(o => ({ ...o, m: matchOrg(o, q) }))
    .filter(o => (q ? o.m.band < 9 : true) && (!f.gram || o.gram === f.gram) && (!f.level || o.rank === f.level) && (!f.group || o.group === f.group) && (!f.seen || o.seen > 0) && (!f.within || norm(o.name).startsWith(norm(f.within))))
    .sort((a, b) => a.m.band - b.m.band || (b.pinned - a.pinned) || (b.seen - a.seen) || (a.prev - b.prev) || a.name.localeCompare(b.name));
}
const seenLabel = n => n === 0 ? 'Not seen here' : n + ' in 12 months';

function interpDisk(drug, raw) {

const HIGH_DOSE = { 'Ciprofloxacin': '0.75 g x 2 oral or 0.4 g x 3 iv', 'Piperacillin-tazobactam': '4 g x 4 iv (by extended 3-hour infusion)', 'Cefepime': '2 g x 3 iv', 'Amoxicillin-clavulanate': '(2 g amoxicillin + 0.2 g clavulanic acid) x 3 iv' };
// Antimicrobial categories for MDR, XDR and PDR (Magiorakos et al. 2012), mapped from the antibiotic classes.
const MDR_CATS = { 'Penicillins': 'Penicillins', 'Beta-lactam/beta-lactamase inhibitor combinations': 'Penicillins + beta-lactamase inhibitors', 'Cephalosporins': 'Cephalosporins', 'Carbapenems': 'Carbapenems', 'Aminoglycosides': 'Aminoglycosides', 'Fluoroquinolones': 'Fluoroquinolones', 'Folate pathway inhibitors': 'Folate pathway inhibitors', 'Polymyxins': 'Polymyxins', 'Phosphonic acids': 'Phosphonic acids', 'Glycylcyclines': 'Glycylcyclines', 'Other antibacterials': 'Phenicols' };
// Number of categories the definitions list for each organism group; XDR and PDR need all of them tested.
const MDR_TOTAL = { 'Enterobacterales': 17 };
function resistanceClass(rows, org) {
  const tested = rows.filter(r => r.interp && !r.expected && !expectedR(org, r.drug) && MDR_CATS[classOf(r.drug)]);
  const cats = [...new Set(tested.map(r => MDR_CATS[classOf(r.drug)]))];
  const ns = [...new Set(tested.filter(r => /^(R|I)/.test(String(r.interp))).map(r => MDR_CATS[classOf(r.drug)]))];
  if (!cats.length) return null;
  const total = /Klebsiella|Escherichia|Enterobacter|Citrobacter|Salmonella|Serratia/.test(org || '') ? MDR_TOTAL.Enterobacterales : null;
  const all = total && cats.length >= total;
  const label = all && ns.length === cats.length ? 'PDR' : all && cats.length - ns.length <= 2 ? 'XDR' : ns.length >= 3 ? 'MDR' : null;
  return { label, ns: ns.length, cats: cats.length, total, all };
}

  const markChecked = (i, v) => { const c = [...inoc]; c[i] = { ...c[i], state: v === 'Significant growth' ? 'Positive' : 'Incubating', ...(v === 'Significant growth' ? { posAt: SERVER_NOW, posBy: ex.tech } : {}), next: v === 'Significant growth' ? 'n/a' : addTime(SERVER_NOW, c[i].every || 1, c[i].eunit || 'Days'), log: [...c[i].log, 'Day ' + c[i].day + ': ' + v.toLowerCase() + ' · ' + ex.tech] }; setInoc(c); setReading(null); };
  // FR-10.1g: a reflex rule adds a pending Gram stain under a blood culture bottle when it turns positive
  const markPositive = (cid, v) => {
    const r = inoc.find(x => x.cid === cid);
    setInoc(inoc.map(x => x.cid === cid ? { ...x, log: [...x.log, x.state === 'Positive' ? `Positive at changed from ${x.posAt} to ${v} · ${ex.tech}` : `Marked positive at ${v} (${elapsed(x.start, v)}) · ${ex.tech}`], state: 'Positive', next: 'n/a', posAt: v, posBy: x.state === 'Positive' && x.posBy && x.posBy.includes('signal') ? x.posBy + ', time edited by ' + ex.tech : ex.tech } : x));
    if (r && r.state !== 'Positive' && r.bottle && !micro.some(m => m.from === cid && m.test === 'Gram stain, culture')) setMicro(m => [...m, newChild('Gram stain, culture', cid, m.filter(x => x.test === 'Gram stain, culture').length + 1, { rule: 'Blood culture result = Positive: Gram stain, culture', inLabOnly: false, at: v })]);
  };
  const addChild = (test, cid) => { const n = micro.filter(x => (test.startsWith('Gram') ? x.test.startsWith('Gram') : !x.test.startsWith('Gram'))).length + 1; const c = newChild(test, cid, n, { at: SERVER_NOW }); setMicro(m => [...m, c]); return c.id; };
  const saveChild = (id, components) => setMicro(micro.map(x => x.id === id ? { ...x, components, display: compDisplay(components), state: 'Awaiting validation', at: SERVER_NOW, by: ex.tech } : x));
  // report items: the example's items plus the reportable Gram stains (from the culture rows) and any added isolates
  // tests on a culture that are not In lab only and have a result are culture results (FR-11.2); they print once validated
  const gramItems = micro.filter(m => m.kind === 'test' && !m.inLabOnly && m.display).map(m => ({ k: m.id, group: 'culture', sec: 'Culture · ' + m.id, label: m.test + ' on ' + m.from + ': ' + m.display, d: m.state === 'Validated' ? 'On' : 'On, prints once validated', on: true, order: 11, print: m.state === 'Validated' ? [{ t: m.test + ' (' + m.from + ')', r: m.display, ind: 1 }] : [] }));
  const allItems = [...ex.report.items, ...gramItems].filter(i => !i.hideIf || !labOnly[i.hideIf]).sort((a, b) => (a.order || 0) - (b.order || 0));
  const runNotes = Object.entries(notes).filter(([id]) => id.startsWith('RUN ')).flatMap(([id, ns]) => ns.filter(n => n.type === 'E').map((n, j) => ({ k: 'rn' + id + j, group: 'ast', order: 59, print: [{ t: 'Note', r: n.body, ri: true, ind: 1 }] })));
  const printed = [...allItems.filter(i => reportSel[i.k] !== false && (reportSel[i.k] || i.on)), ...runNotes].sort((a, b) => (a.order || 0) - (b.order || 0));

  const readingForm = recFor ? (<div className="inline-panel"><div style={{ fontWeight: 600, marginBottom: '.5rem' }}>{t('micro.ast.recordReading', 'Record reading')} <span className="muted anno" style={{ fontWeight: 400 }}>the v2 form; <span className="new3">v3</span> adds the Qualifier dropdown</span></div>
        <div className="grid" style={{ gridTemplateColumns: '220px 140px 200px 1fr' }}>
          <Field label="Antibiotic" req><select value={recFor} onChange={e => setRecFor(e.target.value)} aria-label="Antibiotic">{readings.map(r => <option key={r.drug}>{r.drug}</option>)}</select></Field>
          <Field label={t('micro.ast.qualifier', 'Qualifier')}><select value={recQ} onChange={e => setRecQ(e.target.value)} aria-label="Qualifier">{QUALS.map(q => <option key={q}>{q}</option>)}</select></Field>
          <Field label="Value" req><input value={recV} aria-label="Reading value" onChange={e => { const v = e.target.value; const m = v.match(/^(<=|>=|<|>|≤|≥)\s*(.*)$/); if (m) { setRecQ({ '<=': '≤', '>=': '≥' }[m[1]] || m[1]); setRecV(m[2]); } else setRecV(v); }} placeholder="e.g. 0.25" /><div className="helper">Typing &lt;= or &gt;= sets the qualifier</div></Field>
          <div className="muted anno" style={{ alignSelf: 'end' }}>Readings from an analyzer fill their row here with value, qualifier and source; accept or override them in place (D-Q7). A capped value that cannot decide the category returns "Result range does not allow interpretation".</div></div>
        <div className="row-actions"><Btn disabled={!recV} onClick={() => { setReadings(readings.map(r => r.drug === recFor ? { ...r, raw: (recQ === '=' ? '' : recQ) + recV + ' µg/mL', source: 'Manual', interp: 'S' } : r)); log(`Reading entered for ${recFor}: ${recQ === '=' ? '' : recQ}${recV} µg/mL`); setRecFor(null); }}>Save reading</Btn><Btn kind="ghost" onClick={() => setRecFor(null)}>Cancel</Btn></div></div>) : null;
  const missing = [...ex.report.checklist.filter(c => typeof c === 'string' && c.startsWith('✗')).map(c => c.slice(2)), ...ex.report.checklist.filter(c => Array.isArray(c) && c[0] === 'ast' && !validated).map(() => 'AST run 1 must be validated before final release.'), ...ex.report.checklist.filter(c => Array.isArray(c) && c[0] === 'program' && !program).map(() => 'Program is required before final release.')];
  // v3 (R-27): a section is complete when the final-release checks have nothing left for it (the same checks as Release final).
  const missFor = re => missing.filter(m => re.test(m));
  const SEC_DONE = {
    caseInfo: missFor(/program|history|origin|clinical|specimen type/i).length === 0,
    initial: missFor(/gram stain|smear|xpert|direct/i).length === 0,
    culture: missFor(/culture outcome|incubating/i).length === 0,
    isolates: missFor(/isolate|identif|dst|ast/i).length === 0 && validated,
  };
  const NEXT = incoming.length ? ['!', t('micro.next.incoming', 'Place {count} incoming results').replace('{count}', incoming.length)]
    : missing.length ? [/culture|incubating/i.test(missing[0]) ? '4' : /isolate|identif|dst|ast/i.test(missing[0]) ? '5' : /gram|smear|xpert/i.test(missing[0]) ? '2' : '1', missing[0]]
    : !validated ? ['5', t('micro.next.validateAst', 'Validate the AST run')] : status !== 'Final' ? ['10', t('micro.next.releaseFinal', 'Release the final report')] : null;
  const releasePartial = () => { setReleases([...releases, ['Partial', '02/10/2026 10:15 · ' + ex.tech]]); log(`Partial report released as version ${releases.length + 1}`); };
  const SECTIONS = [['1', 'Case information'], ['2', 'Initial testing'], ['4', 'Culture and readings'], ['5', 'Isolates and susceptibility'], ['7', 'Additional testing'], ['10', 'Report and release'], ['12', 'Timeline']];
  return <MediaCtx.Provider value={{ media, setMedia }}><NotesCtx.Provider value={{ notes, addNote }}><div>
    <div className="crumbs"><a href="#">Home</a> / <a href="#">Microbiology</a> / <a href="#">Worklist</a> / Case {ex.lab}</div>
    <div className="casebar" {...buildAttrs('header')} role="region" aria-label={t('micro.case.bar', 'Case summary')}>
      <b>{ex.lab}</b><span className="muted" style={{ fontSize: 13 }}>{ex.patient.split(' · ')[0]}</span>
      <Tag kind={STATUS_KIND[status]}>{status}</Tag>{(ex.statusTags || []).map(x => <Tag key={x} kind="purple">{x}</Tag>)}{ex.priority === 'STAT' && <Tag kind="red">STAT</Tag>}
      <nav className="jump" aria-label={t('micro.case.jumpTo', 'Jump to section')}>{SECTIONS.map(([n, l]) => <a key={n} href={'#sec-' + n} onClick={e => { e.preventDefault(); const el = document.getElementById('sec-' + n); if (el) el.scrollIntoView({ behavior: 'smooth' }); }}>{t('micro.case.section.' + n, l)}</a>)}</nav>
      <span style={{ flex: 1 }}></span>
      {NEXT && <span className="nextstep"><span className="muted">{t('micro.next.label', 'Next')}:</span> <a href={'#sec-' + NEXT[0]} onClick={e => { e.preventDefault(); const el = document.getElementById('sec-' + NEXT[0]); if (el) el.scrollIntoView({ behavior: 'smooth' }); }}>{NEXT[1]}</a> <span className="new3">v3</span></span>}
      <Btn kind="secondary" disabled={status === 'Final'} onClick={releasePartial}>{t('microbiology.case.report.releasePartial', 'Release partial report')}</Btn>
      <Btn disabled={missing.length > 0 || status === 'Final'} onClick={() => setConfirmFinal(true)}>{missing.length > 0 && status !== 'Final' ? t('micro.release.final.missingCount', 'Release final ({count} missing)').replace('{count}', missing.length) : t('micro.release.final', 'Release final')}</Btn>
      <span className="new3">v3 D-281</span>
    </div>
    {confirmFinal && <ReleaseConfirm count={printed.length} version={releases.length + 1} onCancel={() => setConfirmFinal(false)} onConfirm={() => { setReleases([...releases, ['Final', '02/10/2026 10:15 · ' + ex.tech]]); setConfirmFinal(false); log(`Final report released as version ${releases.length + 1}; case locked`); }} />}
    <h1 style={{ display: 'flex', gap: '.75rem', alignItems: 'center' }}>Case {ex.lab}{ex.priority === 'STAT' && <Tag kind="red">STAT</Tag>}</h1>

    <div className="hdr">
      <div><b>Patient</b>{ex.patient}</div>
      <div><b>{ex.samplesLabel}</b>{ex.sampleSummary}</div>
      <div><b>Body site</b>{ex.site}</div>
      {ex.setLines && <div><b>{t('microbiology.case.cultureSet.summary', '{test}: {sets} sets, {bottles} bottles').replace('{test}', 'Blood culture').replace('{sets}', String(ex.setLines.length)).replace('{bottles}', '4')}</b>{ex.setLines.map(l => <div key={l} className="muted" style={{ fontSize: 12 }}>{l}</div>)}</div>}
      <div><b>{t('microbiology.case.program', 'Program')}</b>{program || <span className="muted">{t('microbiology.case.programNotSet', 'Program not set')}</span>} {track && <Tag kind="gray">{track} track</Tag>} <span className="muted anno">(Case information; drives questions and exports, D-178)</span></div>
      <div><b>{t('microbiology.case.labUnit', 'Lab unit')}</b>{labUnit} <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setChangingLU(!changingLU)}>{t('microbiology.case.changeLabUnit', 'Change lab unit')}</button></div>
      <div {...buildAttrs('header')}><b>{t('micro.case.status', 'Status')} <span className="new3">v3</span></b><Tag kind={STATUS_KIND[status]}>{t('micro.case.status.' + status, status)}</Tag>{(ex.statusTags || []).map(x => <Tag key={x} kind="purple">{x}</Tag>)}<div style={{ fontSize: 12, color: '#525252' }}>{ex.stage.map(([k, l]) => l).join(', ')}</div><div className="muted anno" style={{ fontSize: 12 }}>Status worked out from the releases; Stage (the existing current step) is its subtitle; tags from open referrals and amendments; nothing stored (D-Q6, D-277, D-281)</div></div>
      {ex.related ? <div><b>{t('microbiology.case.relatedOnSpecimen', 'Also on this specimen')}</b><a href="#" style={{ color: '#0f62fe' }}>{ex.related}</a></div> : <div><b>Priority</b>{ex.priority}</div>}
      <div className="row-actions" style={{ marginTop: 0 }}><Btn kind="secondary">Log critical notification</Btn><Btn kind="tertiary">Report NCE</Btn><Btn kind="tertiary" onClick={() => setHistOpen(!histOpen)}>{t('microbiology.case.patientHistory', 'Patient history')} ({ex.history.length})</Btn></div>
    </div>
    {histOpen && <PatientHistory ex={ex} />}
    {changingLU && <div className="inline-panel" style={{ marginTop: '-0.5rem', marginBottom: '1rem', background: '#fff', border: '1px solid #e0e0e0' }}>
      <div className="grid"><Field label="New lab unit" req><select value={labUnit} onChange={e => setLabUnit(e.target.value)}><option>TB</option><option>Microbiology</option></select></Field>
        <div className="muted anno" style={{ alignSelf: 'end' }}>Relabels the case: it moves to that lab unit's Worklist and edit rights follow that lab unit. The Program and tests do not change; if that lab unit already has a case for this order and sample type, it offers to join it. Clinical lab units only (D-120). Recorded on the Timeline; no reason needed; not available after final release.</div></div>
      <div className="row-actions"><Btn onClick={() => setChangingLU(false)}>Save</Btn><Btn kind="ghost" onClick={() => setChangingLU(false)}>Cancel</Btn></div>
    </div>}
    {ex.why && <Anno style={{ marginBottom: '1rem' }}>{ex.why}</Anno>}

    {incoming.length === 0 && <Section bk="incoming" n="!" title={t('microbiology.case.section.incoming', 'Incoming results')} done summary={t('micro.incoming.none', 'None waiting. Results that arrive for tests not on this case appear here to be placed.')}><p className="muted">{t('micro.incoming.none', 'None waiting. Results that arrive for tests not on this case appear here to be placed.')}</p></Section>}
    {incoming.length > 0 && <Section bk="incoming" n="!" title={t('microbiology.case.section.incoming', 'Incoming results')} intro={t('micro.intro.incoming', 'Results that arrived for tests not yet on this case. Place each one where it belongs.')} isNew cls="incoming" tags={<Tag kind="warm-gray">{incoming.length} waiting</Tag>}>
      <p className="muted" style={{ marginBottom: '.75rem' }}>Results for tests not yet on this case. One click places a result where you choose; the system does not guess. Placed in the wrong place? Use Move result. A result for a test already on the case goes straight to its row.</p>
      <table className="t"><thead><tr><th>Test</th><th>Value</th><th>Source</th><th>Received</th><th>{t('microbiology.case.incoming.placeIn', 'Place in')}</th></tr></thead>
        <tbody>{incoming.map(i => { const opts = ['Initial testing', ...isolates.map(s => 'Isolate: ' + s.id), ...isolates.map(s => 'AST / DST: ' + s.id), 'Additional testing'];
          const plus = o => i.linked && !o.startsWith('Initial') && !o.startsWith('Additional') ? ` + ${i.linked.length} linked` : '';
          return <tr key={i.id}><td>{i.test}</td><td>{i.value}{i.linked && <div className="muted" style={{ marginTop: 4 }}>{t('microbiology.case.incoming.linkedResults', '{count} linked results from the same message').replace('{count}', i.linked.length)}: {i.linked.map(l => l[0] + ' ' + l[1]).join('; ')}</div>}</td><td>{i.source}</td><td>{i.at}</td>
          <td><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{opts.map(o => <Btn key={o} kind="tertiary" onClick={() => accept(i.id, o)}>{o}{plus(o)}</Btn>)}</div></td></tr>; })}</tbody></table>
      <p className="muted anno" style={{ marginTop: '.5rem' }}>Results from one message linked to one organism stay together (FR-09.6). A placed or moved result shows Placed by or Moved from, and the validator confirms the placement (FR-09.7).</p>
    </Section>}

    <Section bk="caseInfo" n="1" intro={t('micro.intro.caseInfo', 'Who the patient is and why the sample came in. Fields marked ◆ are needed before the final report.')} done={SEC_DONE.caseInfo} summary={(ex.program || 'No Program') + ' · ' + (ex.patient || '')} title={t('microbiology.case.section.caseInfo', 'Case information')} isNew tags={<span className="muted">&nbsp;moved from order entry · ◆ = needed before final report · Needed for surveillance never blocks</span>}>
      <div className="grid">
        {ex.received && <>
          <Field label="Sending laboratory"><input disabled value={ex.received.lab} /><div className="helper">From Tested elsewhere at order entry (Organizations list)</div></Field>
          <Field label={t('microbiology.case.reportedIdentification', 'Reported identification')}><input disabled value={ex.received.reportedId} /><div className="helper">The sender's organism; ISO-1 keeps it beside the identification made here</div></Field>
          <Field label={t('microbiology.case.originalSpecimenType', 'Original specimen type')} final><select defaultValue={ex.received.original} aria-label="Original specimen type"><option>Urine</option><option>Blood</option><option>Wound swab</option><option>Sputum</option><option>Cerebrospinal fluid</option></select></Field>
          <Field label="Collected"><input disabled value={ex.received.collected} /><div className="helper">The original specimen's collection date (from the line list)</div></Field>
          <Field label={t('microbiology.case.receivedAt', 'Received at {laboratory}').replace('{laboratory}', ex.received.lab)}><input value={rcvAt} onChange={e => setRcvAt(e.target.value)} aria-label="Received at sending laboratory" placeholder="DD/MM/YYYY" /><div className="helper">When the sending laboratory received the specimen (optional)</div></Field>
          <Field label={t('microbiology.case.receivedAt', 'Received at {laboratory}').replace('{laboratory}', 'CPHL')}><input disabled value={ex.received.here} /><div className="helper">The Isolate sample's received date</div></Field>
        </>}
        <Field label={t('microbiology.case.program', 'Program')} final><select value={program} onChange={e => setProgram(e.target.value)} aria-label="Program"><option value="">Select</option>{Object.keys(PROGRAM_TRACKS).map(p => <option key={p}>{p}</option>)}</select><div className="helper">Programs with Show on Microbiology case (Programs admin). Its questionnaire shows below; its track decides the exports.</div></Field>
        <Field label={t('microbiology.case.purpose', 'Culture purpose')} req><select defaultValue="Diagnostic"><option>Diagnostic</option><option>Screening</option><option>Treatment follow-up</option><option>Survey or study</option><option>EQA / proficiency</option></select><div className="helper">Default Diagnostic. Only Diagnostic counts in the antibiogram and GLASS.</div></Field>
        <Field label="Patient origin" final><select value={origin} onChange={e => setOrigin(e.target.value)} aria-label="Patient origin"><option>Outpatient</option><option>Inpatient</option><option>ICU</option><option>Emergency</option></select></Field>
        <Field label="Date of admission" surv={origin !== 'Outpatient'} missing={admMissing}>{origin !== 'Outpatient' ? <input value={admission} onChange={e => setAdmission(e.target.value)} placeholder="DD/MM/YYYY" aria-label="Date of admission" /> : <input disabled placeholder="Outpatients are not admitted" />}</Field>
        {ex.info.ward && <Field label="Ward"><input defaultValue={ex.info.ward} /></Field>}
        {track === 'Bacterial' && <Field label={t('microbiology.case.infectionOrigin', 'Infection origin (derived)')}><input disabled value={origin === 'Outpatient' ? 'Community origin' : admission ? 'Hospital origin (collected 5 days after admission)' : t('microbiology.case.infectionOrigin.unknown', 'Unknown (no admission date)')} /><div className="helper">GLASS rule: more than 2 days after admission is hospital origin. Shown for Bacterial-track Programs.</div></Field>}
        <Field label="Clinical diagnosis / reason for test"><input defaultValue={ex.info.diagnosis} /></Field>
        {(QUESTIONNAIRES[program] || []).length > 0 && <ProgramQuestionnaire key={program} program={program} />}
        {ex.setLines && <Field label="Number of sets"><input disabled value={ex.info.sets} /><div className="helper">Counted from the collected bottles</div></Field>}
        <div style={{ gridColumn: '1 / -1' }}><div className="muted anno" style={{ fontSize: 12, marginBottom: 4 }}>{t('microbiology.case.samples', 'Samples')} <span className="new">v2</span> one row per sample, each with its own body site and collection time (FR-04.3)</div>
          <table className="t" style={{ background: '#fff' }}><thead><tr><th>Sample</th><th>Type · container</th><th>Set</th><th>Body site · side</th><th>Collected</th><th>Collector</th><th></th></tr></thead>
            <tbody>{ex.info.samples.map(s => <tr key={s[0]}>{s.map((c, j) => <td key={j}>{c}</td>)}<td><Btn kind="ghost">Correct site</Btn></td></tr>)}</tbody></table>
          <div className="muted" style={{ marginTop: 4 }}>{ex.info.samplesNote}</div></div>
        <div className="field" style={{ gridColumn: '1 / -1' }}><label>{t('microbiology.orderDetail.clinicalHistory', 'Clinical history')}</label><textarea rows={4} maxLength={4000} defaultValue={ex.info.history} style={{ width: '100%', background: '#fff', border: 0, borderBottom: '1px solid #8d8d8d', padding: 8, fontFamily: 'inherit', fontSize: 14 }} /><div className="helper" style={{ textAlign: 'right' }}>{ex.info.history.length} of 4000 characters</div></div>
      </div>
      <div className="muted" style={{ marginTop: '.5rem' }}>{ex.info.appliesTo}</div>
      <div style={{ marginTop: '1rem' }}>
        <label className="muted">{t('microbiology.case.priorAntibiotics', 'Prior antibiotics')}</label>
        <table className="t" style={{ marginTop: 4 }}><thead><tr><th>Agent</th><th>Date started</th><th></th></tr></thead>
          <tbody>{ex.info.priorAb.map(a => <tr key={a[0]}><td>{a[0]}</td><td>{a[1]}</td><td><Btn kind="ghost">Remove</Btn></td></tr>)}</tbody></table>
        <div className="row-actions"><Btn kind="ghost">+ Add antibiotic</Btn></div>
      </div>
    </Section>

    <Section bk="initial" n="2" intro={t('micro.intro.initial', 'Tests done directly on the sample, such as Gram stain, smear or Xpert, before anything grows.')} done={SEC_DONE.initial} summary={t('micro.summary.initial', 'All direct tests have results')} title={t('microbiology.case.section.initialTesting', 'Initial testing')} isNew>
      {initial.length ? <CaseTestTable rows={initial} labOnly={labOnly} setLabOnly={setLabOnly} /> : <div className="muted">{ex.noInitial}</div>}
      <div className="muted" style={{ marginTop: '.4rem' }}>Every row enters its result the same way: Enter or Edit opens the full-width editor for the test's result type (coded list, graded observations, several components, or a number with unit). The same editor is used in Additional testing. Reagent lot is required when the test's M-12 link is Required.</div>
      {adding === 'initial' ? <TestChooser ch={ex.choosers.initial} onCancel={() => setAdding(null)} onAdd={p => { setInitial([...initial, ...p.map((x, k) => ({ id: 'add' + initial.length + k, test: x, type: 'components', components: GRAM_C.map(c => ({ c, v: '', opts: ['', ...GRADES] })), display: '', flag: '', by: '', state: 'Not started', addedBy: ex.tech }))]); p.forEach(x => log(`Added ${x} to Initial testing, on the specimen`)); setAdding(null); }} />
        : <div className="row-actions"><Btn kind="tertiary" onClick={() => setAdding('initial')}>+ {t('microbiology.case.addTestOrPanel', 'Add test or panel')}</Btn></div>}
    </Section>

    <Section bk="referral" n="3" intro={t('micro.intro.referral', 'Send remaining work to another laboratory and track it until results return.')} title="Referral point" isNew cls="ref" tags={<span className="muted anno">&nbsp;existing component (Clinical Order Entry v4 Refer out, built): reuse, do not re-implement. v2 adds only what to refer</span>}>
      <p className="muted" style={{ marginBottom: '.5rem' }}>Same Refer out section, form, fields and statuses as order entry. Saved referrals are dispatched from Sample Shipment.</p>
      <table className="t"><thead><tr><th>Sample</th><th>Sample type</th><th>Tests</th><th>Reference laboratory</th><th>Status</th><th></th></tr></thead>
        <tbody>
          {ex.referrals.map(r => <tr key={r[0] + r[2]}><td>{r[0]}{r[1] && <div className="muted">{r[1]}</div>}</td><td>{r[2]}</td><td>{r[3]}</td><td>{r[4]}</td><td><Tag kind="teal">{r[5]}</Tag></td><td><Btn kind="ghost">Edit</Btn></td></tr>)}
          {!ex.referrals.length && referOpen !== 'saved' && <tr><td colSpan={6} className="muted">Nothing referred.</td></tr>}
          {referOpen === 'saved' && <tr><td>{ex.sampleIds[0]}</td><td>{ex.sampleType}</td><td>{ex.referTests[0]}</td><td>{ex.refLabs[0]}</td><td><Tag kind="blue">Requested</Tag></td><td style={{ whiteSpace: 'nowrap' }}><Btn kind="ghost">Edit</Btn><Btn kind="ghost">Dispatch</Btn></td></tr>}
        </tbody></table>
      {referOpen === true ? <div className="inline-panel">
        <div className="grid">
          <Field label="Reference laboratory" req><input list="ref-labs" defaultValue={ex.refLabs[0]} /><datalist id="ref-labs">{ex.refLabs.map(l => <option key={l} value={l} />)}</datalist></Field>
          <Field label="Reason for referral" req><select defaultValue="Test not available"><option>Test not available</option><option>Confirmation</option><option>Quality control</option><option>Equipment failure</option></select></Field>
          <Field label="Referrer"><input list="refr" defaultValue={ex.tech} /><datalist id="refr"><option value={ex.tech} /></datalist></Field>
          <Field label="Hand-off date"><input defaultValue="02/10/2026" /></Field>
          <Field label="Hand-off time"><input defaultValue="10:30" /></Field>
          <Field label="Expected return date"><input defaultValue="09/10/2026" /></Field>
        </div>
        <div style={{ marginTop: '.75rem' }}><label className="muted">Tests to refer</label>

            : <>{r.start} → {r.ends}{r.log.length === 0 && r.state !== 'Positive' && <> <Btn kind="ghost" onClick={() => { setTimeFor(r.cid); setTimeVal(r.start); }}>{t('microbiology.case.inoc.editTime', 'Edit time')}</Btn></>}</>}<div className="muted">{t('microbiology.case.inoc.dayOf', 'Day')} {r.day} of {r.dur + (r.unit === 'Days' ? (r.ext || []).reduce((a, x) => a + (x.unit === 'Days' ? x.n : 0), 0) : 0)}</div></td><td>{r.next}</td>

            {(r.state === 'Check due' || r.state === 'Incubating') && <div><Btn kind="ghost" onClick={() => setPosFor(r.cid)}>{t('microbiology.case.inoc.markPositive', 'Mark positive')}</Btn><Btn kind="ghost" onClick={() => setOutcome(i, 'No growth')}>{t('microbiology.case.inoc.markNoGrowth', 'Mark no growth')}</Btn></div>}

          {!ordered.length && ex.received && <tr><td colSpan={8}><Tag kind="green">{t('microbiology.case.receivedIsolateOutcome', 'Growth (received isolate)')}</Tag> <span className="muted anno">No primary specimen is inoculated. A purity or identification subculture is added from ISO-1 as on any isolate (FR-02.13).</span></td></tr>}</tbody></table>

        {sugg.map(x => <div key={x.id} className="sugg-row"><b>{x.name}</b><span className="muted">on {x.on}</span><Tag kind="teal">{x.reason}</Tag><span className="muted">{x.why}</span><span style={{ flex: 1 }}></span>

          <td style={{ whiteSpace: 'nowrap' }}>{r.gone ? <Tag kind="green">{done[r.id] || 'Recorded since printing'}</Tag> : r.instr ? <Btn kind="ghost" onClick={() => { setDue(due.filter(x => x.id !== r.id)); say(`${r.cid}: instrument negative confirmed; row outcome No growth.`); }}>{t('microbiology.case.inoc.confirm', 'Confirm')}</Btn>
            : !r.growth && <Btn kind="tertiary" onClick={() => recordNoGrowth([r])}>{t('microbiology.worklist.noGrowth', 'No growth')}</Btn>}
            {r.kind === 'final' && !r.gone && !r.instr && <Btn kind="ghost" onClick={() => { setWlExt(r.id); setWlExtReason(''); }}>{t('microbiology.worklist.extend', 'Extend 24 h')}</Btn>}
            <Btn kind="ghost">{t('microbiology.worklist.openCase', 'Open case')}</Btn></td></>}
    </tr>{wlExt === r.id && <tr><td></td><td colSpan={6}><div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}><span className="muted">{t('microbiology.case.inoc.extend', 'Extend incubation')} {r.cid} by 24 Hours:</span><select value={wlExtReason} onChange={e => setWlExtReason(e.target.value)} aria-label="Extend reason"><option value="" disabled>Reason</option>{EXT_REASONS.filter(x => x !== 'Other').map(x => <option key={x}>{x}</option>)}</select><Btn disabled={!wlExtReason} onClick={() => { const keep = due; setDue(due.filter(x => x.id !== r.id)); setWlExt(null); say(`${r.cid}: incubation extended 24 Hours (${wlExtReason}); it comes back on Final read due tomorrow.`, () => setDue(keep)); }}>Extend</Btn><Btn kind="ghost" onClick={() => setWlExt(null)}>Cancel</Btn><span className="muted">Other lengths and reasons: Extend incubation on the case.</span></div></td></tr>}</React.Fragment>)}</tbody></table>{list.length === 0 && <p className="muted" style={{ padding: '1rem' }}>Nothing due.</p>}</div>}
    {chip === 'attention' && <div className="sec"><table className="t"><thead><tr><th>Lab number</th><th>Patient or site</th><th>Lab unit</th><th>Specimen</th><th>Why it needs attention</th><th>Incubation</th><th></th></tr></thead>
      <tbody>{rows.map(r => <tr key={r.lab}><td><a href="#" style={{ color: '#0f62fe' }}>{r.lab}</a><div><Tag kind={STATUS_KIND[r.status]}>{r.status}</Tag>{r.tags.map(x => <Tag key={x} kind="purple">{x}</Tag>)}</div></td><td>{r.who}</td><td>{r.lu}</td><td>{r.spec}</td>
        <td>{r.reasons.map(x => <Tag key={x} kind={x === 'Incubation complete' ? 'red' : x === 'Check due' ? 'warm-gray' : x === 'Program not set' ? 'warm-gray' : x.startsWith('Suggested') ? 'teal' : /Referr/.test(x) ? 'purple' : 'gray'}>{x}</Tag>)}</td><td>{r.day}</td>
        <td>{r.reasons.includes('Program not set') && <select defaultValue="" aria-label="Program" onChange={e => { setRows(rows.map(x => x.lab === r.lab ? { ...x, reasons: x.reasons.filter(y => y !== 'Program not set') } : x)); say(`${r.lab}: Program ${e.target.value} set (Timeline).`); }}><option value="" disabled>{t('microbiology.case.program', 'Program')}</option><option>Bacteriology (routine)</option><option>AMR surveillance</option><option>TB Program</option></select>}
          {r.reasons.includes('Instrument negative to confirm') && (neg ? <span className="muted">BC-004795-A to -D: No growth, protocol complete, confirmed by J. Kaupa</span> : <div><span className="muted">BACTEC FX: 4 bottles negative, protocol complete</span> <Btn kind="ghost" onClick={() => setNeg(true)}>{t('microbiology.case.inoc.confirm', 'Confirm')}</Btn></div>)}</td></tr>)}</tbody></table></div>}
    <p className="muted anno"><span className="new3">v3</span> Status is one of In progress, Partial, Final or Amended; Referred, Referral returned and Amendment open are tags (D-Q6). "Suggested" counts isolates with a suggestion nobody has added or dismissed (R-04). Final cases leave the bench lists; each culture test appears once; the lab unit filter lists active, visible units only (R-BENCH-2).</p>
    <p className="muted anno">Check due and Final read due list culture rows, STAT first, then the most overdue (D-199); an overdue row shows how late it is. Check due covers both due and overdue rows. No growth on a check records the reading and sets the next check; on a final read it also records the row outcome. Extend 24 h on a final read keeps the row open for another day, with a reason (colonies not mature enough to read or pick). Anything else is read on the case (Open case). Every write is the case's own, on its Timeline, with Undo in the toast. Disabled offline.</p>
    <div className="legend">Try: Final read due, Print bench sheet to see the paper (grouped by medium, name and lab number on every row); Open sheet, BS-261001-07, then No growth on a row and see it marked recorded; Check due, No growth on one row, then Undo; Final read due, select all, No growth (3), and see the skipped rows named; Awaiting inoculation, tick the four urines, Inoculate, choose the lots, Save; tick the wound swab too to see the refusal.</div>
    {toast && <div className="toast"><div className="cds--inline-notification cds--inline-notification--success" style={{ maxWidth: 520 }}><div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper"><div className="cds--inline-notification__title">Done</div><div className="cds--inline-notification__subtitle">{toast.msg} {toast.undo && <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => { toast.undo(); setToast(null); }}>{t('common.undo', 'Undo')}</button>}</div></div></div></div></div>}
    </>}
  </div>;
}

    <div className="note-box anno">On a case: a reading changed by an expert rule shows the source "Expert rule" and the rule's name; an inferred agent (flucloxacillin from cefoxitin) gets its own row marked "Inferred from cefoxitin". A measured S on an always-R agent also raises the intrinsic verification flag, because it may mean a misidentification. Flag rules (D-339) are the WHONET-style quality, microbiological and clinical alerts: they show in the isolate's alerts and join the run's expert flags, which the built Acknowledge flags step clears before validation. The starter flags come from the expected phenotypes (a measured S on an expected-R pair); labs add their own.</div>
  </div>;
}

/* ---------- ORDER ENTRY (built stepped Enter Order; v3 changes only, R-24) ---------- */
function OrderEntry() {
  const RCV_LAB = 'Port Moresby General Hospital Laboratory';
  const [rows, setRows] = useState([
    { test: 'Xpert MTB/RIF Ultra', micro: true, unit: 'TB unit', sample: '-1', type: 'Sputum', container: 'Sputum container', set: '', site: 'Lower respiratory tract', time: '28 Sep 07:10' },
    { test: 'Blood culture', micro: true, unit: 'Microbiology', sample: '-2', type: 'Blood (culture)', container: 'Aerobic blood culture bottle', set: '1', site: 'Venous blood, left arm', time: '28 Sep 07:25' },
    { test: 'Blood culture', micro: true, unit: 'Microbiology', sample: '-3', type: 'Blood (culture)', container: 'Anaerobic blood culture bottle', set: '1', site: 'Venous blood, left arm', time: '28 Sep 07:25' },
    { test: 'Blood culture', micro: true, unit: 'Microbiology', sample: '-4', type: 'Blood (culture)', container: 'Aerobic blood culture bottle', set: '2', site: 'Venous blood, right arm', time: '28 Sep 07:31' },
    { test: 'Blood culture', micro: true, unit: 'Microbiology', sample: '-5', type: 'Blood (culture)', container: 'Anaerobic blood culture bottle', set: '2', site: 'Venous blood, right arm', time: '28 Sep 07:31' },
    { test: 'RPR', micro: false, unit: 'Serology', sample: '-6', type: 'Serum', container: 'Plain tube', set: '', site: '', time: '28 Sep 07:25' },
    { test: 'Bacterial culture', micro: true, unit: 'Microbiology', sample: '-7', type: 'Wound swab', container: 'Swab, Amies', set: '', site: 'Wound, lower leg', time: '28 Sep 07:40' },
    { test: 'Bacterial culture', micro: true, unit: 'Microbiology', sample: '-8', type: 'Isolate', container: 'Agar slope', set: '', site: '', time: '27 Sep 15:00', elsewhere: { lab: RCV_LAB, organism: null } },
  ]);
  const [menu, setMenu] = useState(null);
  const [saved, setSaved] = useState(null);
  const setRow = (i, patch) => setRows(rows.map((r, k) => k === i ? { ...r, ...patch } : r));
  const groupsOf = () => { const g = {}; rows.filter(r => r.micro).forEach(r => { const key = r.type + '|' + r.unit; (g[key] = g[key] || { test: r.test, unit: r.unit, samples: [], iso: r.elsewhere }).samples.push(r.sample); }); return Object.values(g); };
  const save = () => {
    // Worked out once, by the save, from v2 FR-02.4 (one case per order, sample type and lab unit); nothing live.
    const groups = {};
    rows.filter(r => r.micro).forEach(r => { const key = r.type + '|' + r.unit; (groups[key] = groups[key] || { test: r.test, unit: r.unit, samples: [], iso: r.elsewhere }).samples.push(r.sample); });
    setSaved(Object.values(groups).map((g, k) => ({ ...g, caseId: 'MC-26-' + (4831 + k) })));
  };
  return <div>
    <div className="crumbs"><a href="#">Home</a> / <a href="#">Orders &amp; Patients</a> / Enter Order</div>
    <h1>Enter Order: Samples and tests</h1>
    <div className="note-box anno" style={{ marginBottom: '1rem' }}><b>Built:</b> the stepped Enter Order on develop (Clinical Order Entry v4), with micro tests picked like any other test, bottles recorded per sample with set number and container, and Tested elsewhere in the row overflow. Drawn here only to show the <span className="new3">v3</span> changes (R-24): a coded reported organism on a received isolate, shown in the built What this order will open panel, and links to the opened cases after Save. The test chooser is unchanged and never lists AST panels (AC-R-21).</div>
    <div className="sec"><div className="sec-b">
      <b style={{ fontSize: 14 }}>Ordered tests</b>
      <table className="t" style={{ marginTop: '.5rem' }}><thead><tr><th>Test</th><th>Sample</th><th>Container</th><th>{t('order.sample.setNumber', 'Set')}</th><th>Body site · collected</th><th></th></tr></thead>
        <tbody>{rows.map((r, i) => <React.Fragment key={r.sample + r.test}><tr>
          <td>{r.test} {r.elsewhere && <Tag kind="purple">{t('order.tests.tag.testedElsewhere', 'Tested elsewhere')}</Tag>}</td>
          <td>{r.sample} · {r.type}</td><td>{r.container}</td><td>{r.set ? t('order.sample.set.option', 'Set {0}').replace('{0}', r.set) : <span className="muted">n/a</span>}</td><td>{r.site || <span className="muted">No body site</span>}<div className="muted">{r.time}</div></td>
          <td style={{ position: 'relative' }}><Btn kind="ghost" onClick={() => setMenu(menu === i ? null : i)}>⋯</Btn>
            {menu === i && <div className="menu" style={{ right: 0 }}><button onClick={() => { setRow(i, { elsewhere: r.elsewhere ? undefined : { lab: '', organism: null } }); setMenu(null); }}>{r.elsewhere ? t('order.tests.action.unmarkTestedElsewhere', 'Not tested elsewhere') : t('order.tests.action.markTestedElsewhere', 'Mark tested elsewhere')}</button></div>}</td></tr>
          {r.elsewhere && <tr className="expand"><td colSpan={6}><div className="grid">
            <Field label={t('order.tests.testedElsewhere.lab', 'Performing laboratory')} req><input aria-label={'Performing laboratory for ' + r.sample} value={r.elsewhere.lab} placeholder="Search the Organizations list" onChange={e => setRow(i, { elsewhere: { ...r.elsewhere, lab: e.target.value } })} /><div className="helper anno">Built: Organizations list, no free text</div></Field>
            {!/culture/i.test(r.test) && <Field label={t('order.tests.testedElsewhere.value', 'Reported value')}><input aria-label={'Reported value for ' + r.sample} /><div className="helper anno">Built, unchanged: free text for tests whose result is not an organism</div></Field>}
            {/culture/i.test(r.test) && <Field label={t('order.tests.testedElsewhere.organism', 'Reported organism')}><OrgSearchField label={'Reported organism for ' + r.sample} value={r.elsewhere.organism ? r.elsewhere.organism.name : ''} onPick={o => setRow(i, { elsewhere: { ...r.elsewhere, organism: o } })} /><div className="helper"><span className="new3">v3</span> {t('order.tests.testedElsewhere.organismHelp', 'The organism the sending laboratory reported. It opens the case as ISO-1, Reported identification.')}</div></Field>}
            {r.type === 'Isolate' && <Field label={t('microbiology.case.receivedAt', 'Received at {laboratory}').replace('{laboratory}', r.elsewhere.lab || 'the sending laboratory')}><input aria-label="Received at sending laboratory" defaultValue="26 Sep 2026" /></Field>}
          </div><div className="muted anno">Today the reported value is a free-text field; for a test whose result is an organism it becomes the reference search (FR-R24.4). The sender's AST is entered on the case, never here (FR-R24.5).</div></td></tr>}
        </React.Fragment>)}</tbody></table>
      <div className="inline-panel"><b style={{ fontSize: 14 }}>{t('order.micro.summary.title', 'What this order will open')}</b> <span className="muted anno">built (MicroOrderPreview.jsx), reads the save's rules on the server; unchanged except the reported-organism line (FR-R24.1)</span>
        <table className="t" style={{ marginTop: '.5rem' }}><thead><tr><th>Case opens for</th><th>Samples</th><th>Lab unit</th></tr></thead>
          <tbody>{groupsOf().map(c => <tr key={c.test + c.samples[0]}><td><Tag kind="teal">{t('order.micro.tag.opensCase', 'Opens a case')}</Tag> {c.test}{c.iso && <div className="muted">{c.iso.organism ? <><span className="new3">v3</span> {t('order.micro.summary.reportedOrganism', 'ISO-1 reported as {organism}').replace('{organism}', c.iso.organism.name)}</> : 'Tested elsewhere: ISO-1 with no reported organism'}</div>}</td><td>{c.samples.length > 1 ? c.samples.join(', ') + ' (' + new Set(rows.filter(r => c.samples.includes(r.sample)).map(r => r.set)).size + ' sets, ' + c.samples.length + ' bottles)' : c.samples[0]}</td><td>{c.unit}</td></tr>)}
            <tr><td><Tag kind="gray">{t('order.micro.tag.staysInResults', 'Stays in Results')}</Tag> RPR</td><td>-6</td><td>Serology</td></tr></tbody></table></div>
      <div className="row-actions"><Btn onClick={save}>{t('common.save', 'Save')}</Btn></div>
      {saved && <Notice kind="success" style={{ marginTop: '.75rem' }}><b>{t('order.micro.saved.casesOpened', 'Saved. This order opened {count} microbiology cases:').replace('{count}', saved.length)}</b>
        <ul style={{ margin: '4px 0 0 1rem' }}>{saved.map(c => <li key={c.caseId}>{c.test}: case <a href="#">{c.caseId}</a> in {c.unit} <span className="muted">({c.samples.length > 1 ? c.samples.length + ' bottles, ' + new Set(rows.filter(r => c.samples.includes(r.sample)).map(r => r.set)).size + ' sets' : c.samples[0]}{c.iso ? ', ISO-1 ' + (c.iso.organism ? 'reported as ' + c.iso.organism.name : 'with no reported organism') : ''})</span></li>)}</ul>
        <span className="muted anno"><span className="new3">v3</span> links to the cases the save opened, from the save response (FR-R24.2).</span></Notice>}
    </div></div>
  </div>;
}

}
