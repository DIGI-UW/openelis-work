/* ---------------- signals view ---------------- */

function EpiCurve({curve}) {
  const max = Math.max(...curve.map(p=>p.c), 1);
  return (
    <div>
      <div className="curve">
        {curve.map((p,i)=>(
          <div className="bar" key={i}>
            <span className="cnt">{p.c}</span>
            <div className={"fill"+(p.hot?"":" base")}
                 style={{height:(p.c/max*100)+"%", minHeight:p.c===0?"2px":"6px"}}/>
            <span className="lbl">{p.w}</span>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:"1rem",marginTop:".75rem",fontSize:".75rem",color:"#525252"}}>
        <span><span style={{display:"inline-block",width:10,height:10,background:"#c6c6c6",marginRight:4}}/>
          Baseline weeks</span>
        <span><span style={{display:"inline-block",width:10,height:10,background:"#8a3ffc",marginRight:4}}/>
          Signal window</span>
      </div>
      <table className="cds--data-table" style={{marginTop:".75rem",width:"auto"}}>
        <thead><tr><th style={{fontSize:".75rem"}}>Week beginning</th><th style={{fontSize:".75rem"}}>Cases</th></tr></thead>
        <tbody>{curve.map((p,i)=>(
          <tr key={i}><td>{p.w} 2026</td><td>{p.c}</td></tr>))}</tbody>
      </table>
      <div className="note">Text-equivalent table shown beneath the chart — the curve is never the only
        representation of the data (WCAG 2.1 AA). <strong>Preview note:</strong> the real build renders this
        with <span className="mono">@carbon/charts-react</span>, already a frontend dependency. These bars are a
        CDN-free approximation for the preview only.</div>
    </div>
  );
}

function Investigation({sig, onSend}) {
  const [disp, setDisp] = useState(sig.disp);
  const [reason, setReason] = useState("");
  const [note, setNote] = useState("");
  const [saved, setSaved] = useState(false);

  React.useEffect(()=>{ setDisp(sig.disp); setReason(""); setNote(""); setSaved(false); },[sig.id]);

  const isWatch = sig.cls==="Watchlist alert";

  return (
    <div className="panel" style={{borderTop:"3px solid #0f62fe"}}>
      <h4 style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>
          <span className="mono" style={{color:"#525252",marginRight:".5rem"}}>{sig.id}</span>
          <em>{sig.agent}</em>{sig.pheno ? " · "+sig.pheno : ""} — {sig.location}
        </span>
        <span>
          <Tag kind={domKind(sig.domain)}>{sig.domain}</Tag>
          <Tag kind={clsKind(sig.cls)}>{sig.cls}</Tag>
          <Tag kind={dispKind(disp)}>{disp}</Tag>
        </span>
      </h4>

      <div className="body">
        <div className="kv" style={{marginBottom:"1rem"}}>
          <div><span>{t("surveillance.cluster.panel.comparison","Compared to normal")}</span>
            <strong>{isWatch ? "First ever occurrence" : sig.n+" vs ~"+sig.expected+" expected"}</strong></div>
          <div><span>Strength</span><strong>{sig.riText}</strong></div>
          {sig.riDays && <div><span>Recurrence interval</span><strong className="mono">{sig.riDays} days</strong></div>}
          <div><span>Window</span><strong>{sig.from} – {sig.to} ({sig.windowDays} d)</strong></div>
          <div><span>Signal age</span><strong>{sig.age} days {sig.overdue && <Tag kind="red">Overdue</Tag>}</strong></div>
        </div>

        {isWatch ? (
          <Notif kind="warning" title="Watchlist alert, not a statistical finding">
            First occurrence of a watched organism in this laboratory. Raised on a single case — no scan
            statistic can flag n = 1.
          </Notif>
        ) : (
          <div className="note" style={{borderLeftColor:"#8a3ffc"}}>
            {sig.n} cases where about {sig.expected} would be usual for this organism, place and period.
            A pattern this strong would be expected {sig.riText} by chance alone.
          </div>
        )}

      <div className="panel" style={{margin:"0 1rem 1rem",border:"1px solid #e0e0e0"}}>
        <h4>{t("surveillance.cluster.panel.curve","Cases over time")}</h4>
        <div className="body"><EpiCurve curve={sig.curve}/></div>
      </div>

      <div className="panel" style={{margin:"0 1rem 1rem"}}>
        <h4>{t("surveillance.cluster.panel.location","Where")}</h4>
        <div className="body"><LocationPanel sig={sig}/></div>
      </div>

      <div className="panel" style={{margin:"0 1rem 1rem"}}>
        <h4>{t("surveillance.cluster.panel.profile","Resistance patterns")}</h4>

      </div>

      <div className="panel" style={{margin:"0 1rem 1rem"}}>

        <div className="body" style={{padding:0}}>
          <table className="cds--data-table">
            <thead><tr>
              <th>Lab number</th><th>Collected</th>
              <th>{sig.domain==="Clinical"?"Patient":sig.domain==="Vector"?"Sampling site":"Sample coordinates"}</th>
              <th>{sig.domain==="Clinical"?"Specimen":"Sample type"}</th>
              <th>Location</th><th></th>
            </tr></thead>
            <tbody>

                <tr key={r.lab}>

                </tr>

      </div>

      <div className="panel" style={{margin:"0 1rem 1rem"}}>
        <h4>{t("surveillance.cluster.panel.notes","Investigation notes")}</h4>

          <div style={{fontSize:".8125rem",color:"#525252",marginBottom:".75rem"}}>
            <div><strong>4 Sep 2026, 08:12 — System</strong> · Signal raised by run RUN-2026-09-04-0200</div>
            {sig.disp==="Under investigation" &&
              <div><strong>4 Sep 2026, 09:40 — J. Okello</strong> · Set to Under investigation.
                District water office contacted; resampling the borehole at 0.3612, 32.5541 today.</div>}
          </div>
          <div className="cds--text-input-wrapper">
            <textarea className="cds--text-area" rows="2" placeholder="Add a note…"

              <select className="cds--select-input" value={disp}
                      onChange={e=>{setDisp(e.target.value); setSaved(false);}}

                              border:"none",borderBottom:"1px solid #8d8d8d",minWidth:"210px"}}>
                <option>Needs review</option>

                <option>Confirmed outbreak</option>
                <option>Ruled out</option>

              <label>{t("surveillance.cluster.action.ruledOut.reason","Why is this being ruled out?")} (required)</label>
              <input value={reason} onChange={e=>setReason(e.target.value)}
                     placeholder="e.g. repeat isolates from one patient, not transmission"
                     style={{width:"100%"}}/>

               disabled={disp==="Ruled out" && !reason.trim()}
               onClick={()=>setSaved(true)}>Save outcome</Btn>
        </div>
        {saved && <div style={{marginTop:".5rem"}}>
          <Notif kind="success" title="Outcome recorded">
            {sig.id} set to {disp}. The change is recorded with your name and the time.
            {disp!=="Needs review" && " This signal moves to Detection History and stays readable there permanently — signals are never deleted."}
          </Notif></div>}
      </div>

      <div className="actbar">
        <Btn kind="danger" size="sm" disabled={disp!=="Confirmed outbreak"} onClick={onSend}>
          {t("surveillance.cluster.action.notify","Notify infection prevention")}
        </Btn>
        <Btn kind="secondary" size="sm" disabled={disp!=="Confirmed outbreak"} onClick={onSend}>
          {t("surveillance.cluster.action.priorityExport","Flag isolates for priority export")}
        </Btn>
        <Btn kind="ghost" size="sm">{t("surveillance.cluster.action.exportList","Export line list")} (CSV)</Btn>
        <Btn kind="ghost" size="sm">Export line list (PDF)</Btn>
        {disp!=="Confirmed outbreak" &&
          <span style={{fontSize:".75rem",color:"#6f6f6f",alignSelf:"center"}}>
            Outbound actions unlock once the cluster is confirmed — nothing leaves the laboratory automatically.
          </span>}
      </div>
    </div>
  );
}

function ConfigView() {
  const [domains, setDomains] = useState({Clinical:true, Environmental:true, Vector:true});
  const [grid, setGrid] = useState(500);
  const [thresh, setThresh] = useState(365);
  const [maxWin, setMaxWin] = useState(60);
  const [baseline, setBaseline] = useState(365);
  const [reps, setReps] = useState(999);
  const [overdue, setOverdue] = useState(14);
  const [showDeact, setShowDeact] = useState(false);

  const projected = useMemo(()=>{
    let n = 5;
    n *= (365/Math.max(thresh,30));
    n *= (grid<=250?1.6: grid>=1000?0.7:1);
    n *= (maxWin>=90?1.3: maxWin<=30?0.8:1);
    return Math.max(0, Math.round(n));
  },[thresh,grid,maxWin]);

  const wl = WATCHLIST.filter(w=>showDeact||w.active);

  return (
    <div>
      <div className="crumbs">Home / Admin Management / Microbiology Reference Data / <span>Cluster Detection</span></div>
      <h1 className="page">{t("surveillance.cluster.config.title","Cluster Detection")}</h1>
      <div className="sub mono" style={{fontSize:".75rem"}}>/MasterListsPage/clusterDetection</div>

      <div className="panel">
        <h4>{t("surveillance.cluster.config.domains","Domains")}</h4>
        <div className="body">
          {["Clinical","Environmental","Vector"].map(d=>(
            <div key={d} style={{display:"flex",alignItems:"center",gap:"1rem",padding:".5rem 0",
                                 borderBottom:"1px solid #f0f0f0"}}>
              <input type="checkbox" checked={domains[d]}
                     onChange={()=>setDomains({...domains,[d]:!domains[d]})}/>
              <strong style={{fontSize:".875rem",minWidth:"120px"}}>{d}</strong>
              <span style={{fontSize:".8125rem",color:"#525252"}}>
                {d==="Clinical" && "Microbiology isolates — organism and resistance phenotype. De-duplicated to first isolate per patient per period."}
                {d==="Environmental" && "Positive results on the detection-eligible tests below. Repeat sampling of a point is not de-duplicated."}
                {d==="Vector" && "Pathogen-positive pools. One positive pool counts as one event, never as the number of insects in it."}
              </span>
              {d==="Vector" && <Tag kind="warm-gray">Baseline building — 143 d</Tag>}
            </div>
          ))}
          <div className="note">Domains are scanned as separate populations. A clinical
            <em> Escherichia coli</em> and an environmental <em>Escherichia coli</em> are the same species
            but not the same population, and are never pooled into one count.</div>
        </div>
      </div>

      <div className="panel">
        <h4>{t("surveillance.cluster.config.parameters","Detection settings")}</h4>
        <div className="body">
          <div className="setting">
            <label>{t("surveillance.cluster.config.threshold","Alert threshold (recurrence interval, days)")}</label>
            <input type="number" value={thresh} onChange={e=>setThresh(+e.target.value||0)}/>
            <span className="help">Default 365. Only patterns rarer than this raise a signal.
              Lowering it finds more, and asks the laboratory to read more.</span>
          </div>
          <div className="setting">
            <label>{t("surveillance.cluster.config.gridMetres","Location grid size (metres)")}</label>
            <input type="number" step="50" value={grid} onChange={e=>setGrid(+e.target.value||0)}/>
            <span className="help">Default 500. Smaller values find tighter clusters but may split real
              ones across cell boundaries; larger values suit rural catchments. In sparsely populated
              areas a very fine grid plus an organism name approaches identifying a household.</span>
          </div>
          <div className="setting">
            <label>{t("surveillance.cluster.config.maxWindow","Longest cluster considered (days)")}</label>
            <input type="number" value={maxWin} onChange={e=>setMaxWin(+e.target.value||0)}/>
            <span className="help">Default 60. The longest stretch of time the scan will treat as one
              cluster.</span>
          </div>
          <div className="setting">
            <label>{t("surveillance.cluster.config.baselineDays","Baseline period (days)")}</label>
            <input type="number" value={baseline} onChange={e=>setBaseline(+e.target.value||0)}/>
            <span className="help">Default 365. How much of the laboratory's own history counts as
              "normal". Statistical detection stays off for a domain until this much history exists.</span>
          </div>
          <div className="setting">
            <label>{t("surveillance.cluster.config.replications","Simulation runs")}</label>
            <input type="number" step="99" value={reps} onChange={e=>setReps(+e.target.value||0)}/>
            <span className="help">Default 999. More runs give a more precise strength estimate and take
              longer. This is the dominant cost of the nightly run.</span>
          </div>
          <div className="setting">
            <label>{t("surveillance.cluster.config.overdueDays","Mark unreviewed signals overdue after (days)")}</label>
            <input type="number" value={overdue} onChange={e=>setOverdue(+e.target.value||0)}/>
            <span className="help">Default 14.</span>
          </div>
          <div className="setting">
            <label>Detection schedule</label>
            <div className="cds--select"><select className="cds--select-input" defaultValue="Nightly at 02:00"
              style={{fontSize:".875rem",padding:".35rem",background:"#f4f4f4",border:"none",
                      borderBottom:"1px solid #8d8d8d"}}>
              <option>Nightly at 02:00</option><option>Twice weekly</option><option>Weekly</option>
            </select></div>
            <span className="help">Runs unattended. Nobody has to remember.</span>
          </div>
        </div>
      </div>

      <div className="panel" style={{borderLeft:"3px solid #8a3ffc"}}>
        <h4>{t("surveillance.cluster.config.tuning.title","What these settings would have done")}</h4>
        <div className="body">
          <p style={{fontSize:".875rem",marginTop:0}}>
            Over the past year these settings would have raised <strong>{projected} signals</strong>.
          </p>
          <div className="bar-track"><div style={{width:Math.min(100,projected/12*100)+"%",
            background: projected>10?"#da1e28": projected<2?"#8e6a00":"#0f62fe"}}/></div>
          <p style={{fontSize:".75rem",color:"#525252",marginTop:".5rem"}}>
            Design target is <strong>3–6 per year</strong>. Published evidence from an 82-hospital
            randomised trial found automated detection at roughly three alerts per hospital per year
            reduced outbreak size by 64%. A comparable WHONET evaluation produced 287 raw signals over
            three years, which nobody could read.
            {projected>10 && " At this setting the queue will be too noisy to act on."}
            {projected<2 && " At this setting real clusters will be missed."}
          </p>
          <div className="note">
            {t("surveillance.cluster.config.coverage","")}
            <strong>38%</strong> of recent clinical results have a usable location. Patient coordinate
            capture was switched on 21 June 2026; existing patients were not back-populated, so spatial
            detection improves as new registrations accumulate. Ward and department scanning works for
            all results regardless.
          </div>
        </div>
      </div>

      <div className="panel">
        <h4 style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>{t("surveillance.cluster.config.watchlist","Watchlist")} — first occurrence raises an alert at a single case</span>
          <label style={{fontSize:".75rem",fontWeight:400,display:"flex",gap:".375rem",alignItems:"center"}}>
            <input type="checkbox" checked={showDeact} onChange={()=>setShowDeact(!showDeact)}/>
            {t("surveillance.cluster.config.showDeactivated","Show deactivated")}
          </label>
        </h4>
        <div className="body" style={{padding:0}}>
          <table className="cds--data-table">
            <thead><tr><th>Organism</th><th>Phenotype watched</th><th>Added</th><th>Last fired</th>
              <th>Status</th><th></th></tr></thead>
            <tbody>
              {wl.map((w,i)=>(
                <tr key={i} style={{opacity:w.active?1:.55}}>
                  <td><em>{w.agent}</em></td><td>{w.pheno}</td><td>{w.added}</td><td>{w.fired}</td>
                  <td>{w.active?<Tag kind="green">Active</Tag>:<Tag kind="gray">Deactivated</Tag>}</td>
                  <td><Btn kind="ghost" size="sm">
                    {w.active
                      ? t("surveillance.cluster.config.action.deactivate","Deactivate")
                      : t("surveillance.cluster.config.action.reactivate","Reactivate")}</Btn></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="actbar">
          <Btn kind="secondary" size="sm">Add watchlist entry</Btn>
          <span style={{fontSize:".75rem",color:"#6f6f6f",alignSelf:"center"}}>
            Entries deactivate and reactivate; there is no delete. Organism and antibiotic pickers are
            search-based, not long dropdowns.
          </span>
        </div>
      </div>

      <div className="panel">
        <h4>{t("surveillance.cluster.config.eligibleTests","Tests counted as detections")} — environmental and vector</h4>
        <div className="body" style={{padding:0}}>
          <table className="cds--data-table">
            <thead><tr><th>Test</th><th>Domain</th><th>Event agent taken from</th><th></th></tr></thead>
            <tbody>
              {ELIGIBLE_TESTS.map((e,i)=>(
                <tr key={i}>
                  <td>{e.test}</td>
                  <td><Tag kind={domKind(e.domain)}>{e.domain}</Tag></td>
                  <td>{e.agentSrc}</td>
                  <td><Btn kind="ghost" size="sm">Remove</Btn></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="actbar">
          <div className="fld" style={{flex:1,maxWidth:"420px"}}>
            <label>Add a test</label>
            <input placeholder="Search the test catalogue…"/>
          </div>
          <span style={{fontSize:".75rem",color:"#6f6f6f",alignSelf:"flex-end",paddingBottom:".4rem"}}>
            Search-based, because a production catalogue runs to 500+ tests. New tests are created in the
            test catalogue, not here.
          </span>
        </div>
      </div>

      <div className="panel">
        <h4>{t("surveillance.cluster.config.recipients","Notification recipients")}</h4>
        <div className="body">
          <table className="cds--data-table" style={{width:"auto"}}>
            <thead><tr><th>Recipient</th><th>Role</th><th>Channel</th><th></th></tr></thead>
            <tbody>
              <tr><td>A. Nakato</td><td>IPC Focal Person</td><td>Email, SMS</td>
                <td><Btn kind="ghost" size="sm">Remove</Btn></td></tr>
              <tr><td>Dr M. Wanyama</td><td>IPC Lead</td><td>Email</td>
                <td><Btn kind="ghost" size="sm">Remove</Btn></td></tr>
              <tr><td>ipc@hospital.example</td><td>IPC shared inbox</td><td>Email</td>
                <td><Btn kind="ghost" size="sm">Remove</Btn></td></tr>
              <tr><td>National Reference Laboratory</td><td>Priority export destination</td><td>Export flag</td>
                <td><Btn kind="ghost" size="sm">Remove</Btn></td></tr>
            </tbody>
          </table>
          <div className="note">Message <em>delivery</em> reuses the existing notification channels and templates —
            no new messaging mechanism. The <strong>recipient list itself is new information</strong>: the built
            notification system addresses patients and providers and holds no standing infection-prevention
            contact list. Declared in the FRS Dependencies rather than assumed.</div>
        </div>
      </div>

      <div className="actbar" style={{background:"#fff",borderTop:"none"}}>
        <Btn kind="primary" size="sm">Save settings</Btn>
        <Btn kind="ghost" size="sm">Restore defaults</Btn>
      </div>
    </div>
  );
}

/* ---------------- shell ---------------- */

function App() {
  const [view, setView] = useState("signals");
  const open = SIGNALS.filter(s=>s.disp!=="Ruled out").length;
  return (
    <div className="shell">
      <nav className="sidenav">
        <h3>OpenELIS Global</h3>
        <div className="sn-item">Home</div>
        <div className="sn-item">Order</div>
        <div className="sn-item">Patient Tests</div>
        <div className="sn-item">Microbiology</div>
        <div className="sn-item">Analyzers</div>
        <div className="sn-item">Reports</div>
        <div className="sn-group" style={{background:"#f4f4f4",marginTop:".25rem"}}>
          Surveillance <Tag kind="red">{open}</Tag>
        </div>
        <div className={"sn-item sub"+(view==="signals"?" active":"")}
             onClick={()=>setView("signals")}>Cluster Detection — Signals</div>
        <div className={"sn-item sub"+(view==="history"?" active":"")}
             onClick={()=>setView("history")}>Cluster Detection — History</div>
        <div className="sn-item sub disabled" title="Not moved by this work">WHONET Export (M-09, today under Reports)</div>
        <div className="sn-item sub disabled" title="Not moved by this work">Surveillance Submission (M-15, today under Reports)</div>
        <div className="sn-item" style={{marginTop:".5rem"}}>Admin</div>
        <div className={"sn-item sub"+(view==="config"?" active":"")}
             onClick={()=>setView("config")}>Microbiology Reference Data — Cluster Detection</div>
        <div style={{padding:"1rem",fontSize:".6875rem",color:"#6f6f6f",lineHeight:1.5}}>
          A Microbiology Technician sees this group with the count, but the Signals item is
          <strong> disabled</strong> — the existence of a signal is never hidden from bench staff, only
          its clinical detail.
        </div>
      </nav>
      <main className="content">
        {view==="signals" && <SignalsView/>}
        {view==="history" && <HistoryView/>}
        {view==="config" && <ConfigView/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
