    <div className="sec"><table className="t"><thead><tr><th>Item</th><th>Type</th><th>{t('catalog.test.mediaLink.sampleType', 'Sample type')}</th><th>{t('catalog.test.mediaLink.order', 'Order')}</th><th>{t('catalog.test.mediaLink.duration', 'Duration')}</th><th>{t('catalog.test.mediaLink.checkEvery', 'Check every')}</th><th>Atmosphere, temperature</th><th>{t('catalog.test.mediaLink.loopVolume', 'Loop volume')}</th><th></th></tr></thead>
      <tbody>{links.map((r, i) => <tr key={r[0] + r[2] + i}><td>{r[0]}</td><td><Tag kind={r[1] === 'Medium' ? 'teal' : 'gray'}>{r[1]}</Tag></td><td>{r[2] === 'Any' ? <span className="muted">{t('catalog.test.mediaLink.anySampleType', 'Any sample type')}</span> : r[2]}</td><td>{r[3]}</td><td>{r[4]}</td><td>{r[5]}</td><td className="muted">{r[6]}</td><td>{r[7]}</td><td><Btn kind="ghost">Edit</Btn><Btn kind="ghost" onClick={() => setLinks(links.filter((x, k) => k !== i))}>Remove</Btn></td></tr>)}</tbody></table></div>
    <div className="sec" style={{ marginTop: '1.5rem' }}><div className="sec-b">
      <div style={{ fontWeight: 600, marginBottom: '.5rem' }}>Settings <span className="new">v2</span></div>
      <div className="grid">
        <Field label={t('microbiology.labUnit.requireTrackedMedia', 'Require tracked media') + ' (lab unit: Microbiology)'}><label style={{ color: '#161616', fontSize: 14 }}><input type="checkbox" checked={reqTracked} onChange={e => setReqTracked(e.target.checked)} style={{ width: 'auto', marginRight: 6 }} aria-label="Require tracked media" />{reqTracked ? 'On: only tracked media with a usable lot; Add new hidden' : 'Off'}</label><div className="helper">. Rows saved before keep their media.</div></Field>
        <Field label={t('siteInfo.blockSelfValidation', 'Block self-validation') + ' (site)'}><label style={{ color: '#161616', fontSize: 14 }}><input type="checkbox" checked={blockSelf} onChange={e => setBlockSelf(e.target.checked)} style={{ width: 'auto', marginRight: 6 }} aria-label="Block self-validation" />{blockSelf ? 'On: the person who entered a result cannot validate it' : 'Off'}</label><div className="helper">FR-06.5. Applies on the Validation page and on case validation.</div></Field>
      </div>
    </div></div>
  </div>;
}

/* ---------- WORKPLAN (existing page): Microbiology bench type, FR-12.7 ---------- */
function WorkplanView() {
  const [type, setType] = useState('Microbiology bench');
  const [chip, setChip] = useState('final');
  const [sheet, setSheet] = useState(null);
  if (sheet) return <BenchSheet sheet={sheet} onClose={() => setSheet(null)} />;
  const rows = chip === 'awaiting' ? AWAITING : DUE_ROWS.filter(r => r.kind === (chip === 'check' ? 'check' : 'final'));
  return <div>
    <div className="crumbs"><a href="#">Home</a> / Workplan</div>
    <h1>Workplan</h1>
    <div className="note-box" style={{ marginBottom: '1rem' }}>Existing Workplan page and print (by test section, test, panel, priority): reuse, do not re-implement. v2 adds the <b>Microbiology bench</b> type, its filters and the bench layout (FR-12.7). The Worklist's Print workplan opens the same print.</div>
    <div className="grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
      <Field label="Workplan type" req><select value={type} onChange={e => setType(e.target.value)} aria-label="Workplan type">{['Test section', 'Test', 'Panel', 'Priority', 'Microbiology bench'].map(x => <option key={x}>{x}</option>)}</select></Field>
      {type === 'Microbiology bench' && <Field label="Filter" req><select value={chip} onChange={e => setChip(e.target.value)} aria-label="Workplan filter"><option value="awaiting">Awaiting inoculation</option><option value="check">Check due</option><option value="final">Final read due</option></select></Field>}
      {type === 'Microbiology bench' && <Field label="Lab unit"><select><option>Microbiology</option><option>TB</option></select></Field>}
    </div>
    {type === 'Microbiology bench' ? <>
      <div className="sec" style={{ marginTop: '1rem' }}><table className="t"><thead><tr><th>Lab number</th><th>Patient or site</th><th>{chip === 'awaiting' ? 'Specimen' : 'Container · medium'}</th><th>{chip === 'awaiting' ? 'Received' : 'Due'}</th></tr></thead>
        <tbody>{rows.map(r => <tr key={r.id || r.lab}><td>{r.lab}</td><td>{r.who}</td><td>{chip === 'awaiting' ? r.spec : r.cid + ' · ' + r.med}</td><td>{chip === 'awaiting' ? r.rec : r.day}</td></tr>)}</tbody></table></div>
      <div className="row-actions"><Btn onClick={() => setSheet({ no: 'BS-261002-09', chip, title: SHEET_TITLES[chip], lu: 'Microbiology', by: 'J. Kaupa', at: '02 Oct 2026 08:20', scope: 'all rows in the filter', rows })}>Print workplan</Btn></div>
    </> : <p className="muted" style={{ marginTop: '1rem' }}>The existing workplan for this type is unchanged.</p>}
  </div>;
}

/* ---------- ORDER ENTRY ---------- */
function OrderEntry() {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const [samples, setSamples] = useState([
    { id: '-1', type: 'Sputum', site: 'Lower respiratory tract', time: '28 Sep 07:10', tests: ['Xpert MTB/RIF Ultra'] },
    { id: '-2', type: 'Blood, aerobic bottle', site: 'Venous blood, left arm', time: '28 Sep 07:25', tests: ['Blood culture'] },
    { id: '-3', type: 'Blood, anaerobic bottle', site: 'Venous blood, left arm', time: '28 Sep 07:25', tests: ['Blood culture'] },
    { id: '-4', type: 'Blood, aerobic bottle', site: 'Venous blood, right arm', time: '28 Sep 07:31', tests: ['Blood culture'] },
    { id: '-5', type: 'Blood, anaerobic bottle', site: 'Venous blood, right arm', time: '28 Sep 07:31', tests: ['Blood culture'] },
    { id: '-6', type: 'Serum', site: '', time: '28 Sep 07:25', tests: ['RPR'] },
    { id: '-7', type: 'Wound swab', site: 'Wound, lower leg', time: '28 Sep 07:40', tests: ['Microbiology case'] },
    { id: '-8', type: 'Isolate', site: '', time: '27 Sep 15:00', tests: ['Bacterial culture', 'VITEK 2 AST-N405'], elsewhere: { test: 'Bacterial culture', lab: 'Port Moresby General Hospital Laboratory', value: 'Escherichia coli' } },
  ]);
  const [sets, setSets] = useState({ '-2': '1', '-3': '1', '-4': '2', '-5': '2' });
  const bottles = samples.filter(sm => sets[sm.id]);
  const setWarn = [];
  ['1', '2', '3'].forEach(n => { const b = bottles.filter(sm => sets[sm.id] === n); if (b.length === 1) setWarn.push(t('order.sample.set.warn.single', 'Set {0} has one bottle').replace('{0}', n)); const ty = b.map(x => x.type); ty.forEach((x, i) => { if (ty.indexOf(x) !== i) setWarn.push(t('order.sample.set.warn.sameType', 'Set {0} has two {1} bottles').replace('{0}', n).replace('{1}', x.includes('aerobic') && !x.includes('anaerobic') ? 'aerobic' : 'anaerobic')); }); });
  const nSets = new Set(Object.values(sets)).size;

  const SITES = ['Lower respiratory tract', 'Venous blood, left arm', 'Venous blood, right arm', 'Central line', 'Wound, lower leg', 'Wound, forearm', 'Urethra'];
  const setSample = (si, patch) => { const c = [...samples]; c[si] = { ...c[si], ...patch }; setSamples(c); };
  const catalog = [['Microbiology case', 'Microbiology case test', 'test'], ['TB case', 'TB case test', 'test'], ['Bacterial culture', 'Microbiology', 'test'], ['TB culture', 'TB', 'test'], ['TB investigation', 'TB culture, AFB smear, Xpert MTB/RIF Ultra', 'panel'], ['Fungal culture', 'Microbiology', 'test'], ['Gram stain', 'Microbiology', 'test'], ['AFB smear (ZN)', 'TB', 'test']];
  const hits = catalog.filter(c => q && c[0].toLowerCase().includes(q.toLowerCase()));
  const add = name => { const c = [...samples]; if (!c[0].tests.includes(name)) c[0] = { ...c[0], tests: [...c[0].tests, name] }; setSamples(c); setQ(''); setOpen(false); };
  const remove = (si, name) => { const c = [...samples]; c[si] = { ...c[si], tests: c[si].tests.filter(x => x !== name) }; setSamples(c); };
  const generic = ['Microbiology case', 'TB case', 'TB culture', 'Bacterial culture', 'Blood culture', 'Fungal culture', 'Xpert MTB/RIF Ultra', 'AFB smear (ZN)', 'Gram stain'];
  const s1 = samples[0].tests;
  const cases = [];
  if (s1.some(x => ['Xpert MTB/RIF Ultra', 'AFB smear (ZN)', 'TB culture'].includes(x))) cases.push(['TB case (first micro test: ' + s1.find(x => ['Xpert MTB/RIF Ultra', 'AFB smear (ZN)', 'TB culture'].includes(x)) + ')', '-1 Sputum', 'TB', s1.includes('TB culture') ? 'Culture joins the same case' : 'No culture ordered: releases on the Xpert result; a reflex TB culture on RR joins it']);
  if (s1.includes('Bacterial culture') || s1.includes('Fungal culture')) cases.push([[s1.includes('Bacterial culture') && 'Bacterial culture', s1.includes('Fungal culture') && 'Fungal culture'].filter(Boolean).join(' + '), '-1 Sputum', 'Microbiology', 'Another lab unit than the TB case, so a related case on the same sample; bacterial and fungal cultures in Microbiology share it']);
  cases.push(['Blood culture case in Microbiology', `-2 to -5: ${nSets} sets, 4 bottles`, 'Microbiology', 'One case for the order; reception set the set numbers; site and time only warn .']);
  const iso = samples.find(sm => sm.elsewhere);
  if (iso) cases.push(['Bacterial culture case in Microbiology (received isolate)', `${iso.id} Isolate`, 'Microbiology', `Tested elsewhere: ${iso.elsewhere.lab}, reported ${iso.elsewhere.value}. Opens with ISO-1 Received from that laboratory; AST here .`]);
  samples.filter(sm => sm.tests.includes('Microbiology case') || sm.tests.includes('TB case')).forEach(sm => cases.push([`${sm.tests.includes('TB case') ? 'TB case' : 'Microbiology case'} (lab unit case test)`, `${sm.id} ${sm.type}`, sm.tests.includes('TB case') ? 'TB' : 'Microbiology', 'No tests yet: the technician sets the Program in Case information and adds the tests on the case']));
  return <div>
    <div className="crumbs"><a href="#">Home</a> / <a href="#">Orders &amp; Patients</a> / Enter Order</div>
    <h1>Enter Order: Samples and tests</h1>
    <div className="note-box" style={{ marginBottom: '1rem' }}>v2: there is no Microbiology section. Micro tests (cultures and direct tests such as Xpert, AFB smear and Gram stain) are picked here like any other test (Clinical Order Entry v4 FR-B14); the first one on a sample opens its case. To send a sample to a lab unit before the tests are known, add one of its case tests (for example "Microbiology case"). One case per order, sample type and lab unit; the case's own Program is set in Case information . The order's Program plays no part. Blood culture: one sample per bottle, each with its own body site and collection time.</div>
    <div className="sec"><div className="sec-b">
      <div className="grid" style={{ marginBottom: '1rem' }}>
        <Field label={t('common.program', 'Program')}><select defaultValue="TB Program"><option>None</option><option>TB Program</option><option>HIV Program</option></select><div className="helper">Never routes micro work; its questionnaire answers are the same record on the case </div></Field>
        <Field label="Provisional diagnosis"><input defaultValue="Presumptive TB, sepsis" /></Field>
      </div>
      <table className="t"><thead><tr><th style={{ width: '20%' }}>Sample</th><th style={{ width: '22%' }}>Body site · collected</th><th style={{ width: '9%' }}>{t('order.sample.setNumber', 'Set')}</th><th>Tests</th></tr></thead>
        <tbody>{samples.map((sm, si) => <tr key={sm.id}><td>{sm.id} · {sm.type}</td><td><div className="field"><select value={sm.site} onChange={e => setSample(si, { site: e.target.value })} aria-label={`Body site for ${sm.id}`}><option value="">No body site</option>{SITES.map(x => <option key={x}>{x}</option>)}</select></div><div className="field" style={{ marginTop: 4 }}><input value={sm.time} onChange={e => setSample(si, { time: e.target.value })} aria-label={`Collected at for ${sm.id}`} /></div></td>
          <td>{sets[sm.id] ? <select value={sets[sm.id]} onChange={e => setSets({ ...sets, [sm.id]: e.target.value })} aria-label={`Set for ${sm.id}`}>{['1', '2', '3'].map(n => <option key={n} value={n}>{t('order.sample.set.option', 'Set {0}').replace('{0}', n)}</option>)}</select> : <span className="muted">n/a</span>}</td>
          <td>{sm.elsewhere && <div style={{ marginBottom: 4 }}><Tag kind="purple">Tested elsewhere</Tag> <span className="muted">{sm.elsewhere.test}: {sm.elsewhere.lab} (Organizations list), reported {sm.elsewhere.value}</span></div>}{sm.tests.map(x => <span key={x} style={{ marginRight: 4 }}><Tag kind={generic.includes(x) ? 'teal' : 'gray'}>{x}{si === 0 && <button onClick={() => remove(si, x)} style={{ border: 0, background: 'none', cursor: 'pointer', marginLeft: 4 }}>×</button>}</Tag></span>)}
            {si === 0 && <div className="field" style={{ position: 'relative', marginTop: 6, maxWidth: 360 }}>
              <input value={q} placeholder="Search tests or panels" onFocus={() => setOpen(true)} onChange={e => { setQ(e.target.value); setOpen(true); }} />
              {open && hits.length > 0 && <div className="menu" style={{ left: 0, right: 'auto', width: '100%' }}>{hits.map(c => <button key={c[0]} onClick={() => add(c[0])}>{c[0]} <span className="muted">({c[2] === 'panel' ? 'panel: ' + c[1] : c[1]})</span></button>)}</div>}
              <div className="helper">Try "culture" or "smear". Same picker as every other test.</div></div>}</td></tr>)}</tbody></table>
      <div className="inline-panel">
        <b style={{ fontSize: 14 }}>{t('order.micro.summary.title', 'What this order will open')}</b> <span className="new">v2</span> <span className="muted">live, updates as tests and samples change; saves nothing </span>
        {setWarn.length > 0 && <div className="cds--inline-notification cds--inline-notification--warning" style={{ maxWidth: 'none', marginTop: '.5rem' }}><div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper"><div className="cds--inline-notification__title">Check the sets</div><div className="cds--inline-notification__subtitle">{setWarn.join('; ')}. You can still save.</div></div></div></div>}
        <table className="t" style={{ marginTop: '.5rem' }}><thead><tr><th>Case opens for</th><th>Samples</th><th>Lab unit</th><th>Note</th></tr></thead>
          <tbody>{cases.map(c => <tr key={c[0]}><td><Tag kind="teal">{t('order.micro.tag.opensCase', 'Opens a case')}</Tag> {c[0]}</td><td>{c[1]}</td><td>{c[2]}</td><td className="muted">{c[3]}</td></tr>)}
            <tr><td><Tag kind="gray">{t('order.micro.tag.staysInResults', 'Stays in Results')}</Tag> RPR</td><td>-6 Serum</td><td>Microbiology (serology)</td><td className="muted">RPR has Opens a Microbiology case: No, so it stays on Results even in the micro lab unit</td></tr>
            <tr><td colSpan={4} className="muted">{t('order.micro.summary.reflex', 'If {0}: adds {1}').replace('{0}', 'Blood culture result = Positive').replace('{1}', 'Gram stain, culture on that bottle')} (reflex rule)</td></tr></tbody></table>
        <div style={{ marginTop: '.75rem', background: '#fff', border: '1px solid #e0e0e0', padding: '.75rem' }}>
          <div className="note-box"><b>Order saved before sample arrival</b><div>MC-URINE-1 · Microbiology · Awaiting sample</div><div>Urine culture ordered; no physical sample or collection/receipt time recorded. The actual urine attaches to this same case when recorded. Repeated saves keep the same case and sample.</div></div>
          <div className="muted" style={{ fontSize: 12 }}>Blood culture case header</div>
          <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}><span><b>{t('microbiology.case.cultureSet.summary', '{test}: {sets} sets, {bottles} bottles').replace('{test}', 'Blood culture').replace('{sets}', '2').replace('{bottles}', '4')}</b> <span className="muted">Set 1: left arm, 07:25, aerobic and anaerobic | Set 2: right arm, 07:31, aerobic and anaerobic</span></span>
            <Btn kind="ghost">{t('microbiology.case.splitCases', 'Split into separate cases')} (reason)</Btn><span className="muted">Only a sample with no results on the case can be split off. Both cases keep a related-case link identifying the case, samples and current lab unit, including after transfer.</span></div>
        </div>
        <div className="note-box" style={{ marginTop: '.75rem' }}>Removed from order entry in v2: the Microbiology section, Culture rows, + Another culture, culture protocol, culture purpose, patient origin, admission date, number of sets as a typed field (it is counted from the Set numbers), clinical history, antibiotic exposure. Case details are entered on the case; Program questions are answered here or on the case, one record .</div>
      </div>
    </div></div>
  </div>;
}

function App() {
  const [view, setView] = useState('case');
  return <div className="shell">
    <div className="side">
      <h6>Microbiology</h6>
      <button className={view === 'case' ? 'on' : ''} onClick={() => setView('case')}>Case view (TB example)</button>
      <button className={view === 'bc' ? 'on' : ''} onClick={() => setView('bc')}>Case view (blood culture, AMR example)</button>
      <button className={view === 'wl' ? 'on' : ''} onClick={() => setView('wl')}>Worklist (Needs attention, bench work)</button>
      <h6 style={{ marginTop: '1rem' }}>Workplan</h6>
      <button className={view === 'wp' ? 'on' : ''} onClick={() => setView('wp')}>Workplan: Microbiology bench</button>
      <h6 style={{ marginTop: '1rem' }}>Admin</h6>
      <button className={view === 'adm' ? 'on' : ''} onClick={() => setView('adm')}>Test catalog, programs, media links, settings</button>
      <h6 style={{ marginTop: '1rem' }}>Orders &amp; Patients</h6>
      <button className={view === 'oe' ? 'on' : ''} onClick={() => setView('oe')}>Enter Order: samples and tests</button>
    </div>
    <div className="main">{view === 'case' ? <CaseView key="tb" ex={TB_EX} /> : view === 'bc' ? <CaseView key="bc" ex={BC_EX} /> : view === 'wl' ? <Worklist /> : view === 'wp' ? <WorkplanView /> : view === 'adm' ? <MediaLinksAdmin /> : <OrderEntry />}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
