<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microbiology v2 Case View: OpenELIS Preview</title>
<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  body { background:#f4f4f4; margin:0; font-family:'IBM Plex Sans', system-ui, sans-serif; }
  .preview-banner { background:#0f62fe; color:#fff; padding:6px 1rem; font-size:12px; font-family:monospace; }
  .shell { display:flex; min-height:calc(100vh - 28px); }
  .side { width:240px; background:#fff; border-right:1px solid #e0e0e0; padding:1rem 0; flex-shrink:0; }
  .side button { display:block; width:100%; text-align:left; padding:.6rem 1rem; border:0; background:none; font-size:14px; cursor:pointer; color:#161616; }
  .side button.on { background:#e5f6ff; border-left:3px solid #0f62fe; font-weight:600; }
  .side h6 { font-size:12px; color:#525252; padding:.5rem 1rem; margin:0; text-transform:uppercase; letter-spacing:.32px; }
  .main { flex:1; padding:1rem 2rem 4rem; max-width:1200px; }
  .crumbs { font-size:12px; color:#525252; margin-bottom:.5rem; }
  .crumbs a { color:#0f62fe; text-decoration:none; }
  h1 { font-size:24px; font-weight:400; margin:.25rem 0 1rem; }
  .sec { background:#fff; margin-bottom:1rem; border:1px solid #e0e0e0; }
  .sec-h { display:flex; align-items:center; justify-content:space-between; padding:.75rem 1rem; border-bottom:1px solid #e0e0e0; cursor:pointer; }
  .sec-h h3 { font-size:16px; font-weight:600; margin:0; display:flex; gap:.5rem; align-items:center; }
  .sec-b { padding:1rem; }
  .num { display:inline-flex; width:22px; height:22px; border-radius:50%; background:#e0e0e0; font-size:12px; align-items:center; justify-content:center; }
  .new { font-size:11px; background:#d0e2ff; color:#0043ce; padding:1px 6px; border-radius:8px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:1rem; }
  .field label { display:block; font-size:12px; color:#525252; margin-bottom:4px; }
  .field .req { color:#da1e28; margin-left:2px; }
  .field .helper { font-size:12px; color:#8a3ffc; margin-top:4px; }
  .field .helper.warn { color:#b28600; }
  .field input, .field select, .field textarea { width:100%; box-sizing:border-box; background:#f4f4f4; border:0; border-bottom:1px solid #8d8d8d; padding:8px; font-size:14px; font-family:inherit; }
  .field.missing input, .field.missing select { border-bottom:2px solid #f1c21b; }
  table.t { width:100%; border-collapse:collapse; font-size:14px; }
  table.t th { text-align:left; background:#e0e0e0; padding:8px; font-weight:600; font-size:13px; }
  table.t td { padding:8px; border-bottom:1px solid #e0e0e0; vertical-align:top; }
  .cds--tag { white-space:nowrap; }
  tr.sub td:first-child { padding-left:28px; }
  tr.sub td { background:#fafafa; }
  .row-actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.75rem; }
  .muted { color:#6f6f6f; font-size:12px; }
  .hdr { background:#fff; border:1px solid #e0e0e0; padding:1rem; margin-bottom:1rem; display:flex; gap:2rem; flex-wrap:wrap; align-items:flex-start; }
  .hdr div b { display:block; font-size:12px; color:#525252; font-weight:400; }
  .incoming { border-left:4px solid #f1c21b; }
  .note-box { background:#f2f4f8; padding:.75rem; font-size:13px; border-left:3px solid #8d8d8d; }
  .inline-panel { background:#f4f4f4; padding:1rem; margin-top:.75rem; }
  table.rt { table-layout:fixed; }
  table.rt td { word-wrap:break-word; }
  .seg { display:inline-flex; border:1px solid #8d8d8d; }
  .seg button { background:#fff; border:0; border-right:1px solid #e0e0e0; padding:4px 10px; font-size:13px; cursor:pointer; }
  .seg button.on { background:#0f62fe; color:#fff; }
  .menu { position:absolute; right:0; top:100%; z-index:5; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3); display:flex; flex-direction:column; min-width:190px; }
  .menu button { background:#fff; border:0; text-align:left; padding:8px 12px; font-size:14px; cursor:pointer; }
  .menu button:hover { background:#e8e8e8; }
  .cds--btn { min-height:32px; padding:6px 14px; }
  .cds--tag { margin:0 4px 0 0; }
  .card-row { display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap; }
  .card { background:#fff; border:1px solid #e0e0e0; padding:1rem; min-width:150px; cursor:pointer; }
  .card.on { border:2px solid #0f62fe; }
  .card .n { font-size:28px; }
  .ref { border-left:4px solid #8a3ffc; }
  /* Worklist filter chips and toast (same look as the Results worklist) */
  .subtitle { color:#525252; font-size:14px; margin-bottom:1rem; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
  .chip { border:1px solid #8d8d8d; background:#fff; border-radius:16px; padding:4px 12px; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .chip.on { background:#e0e0e0; border-color:#161616; font-weight:600; }
  .chip .count { background:#161616; color:#fff; border-radius:10px; padding:0 7px; font-size:11px; }
  .chip .count.red { background:#da1e28; }
  .chip .count.blue { background:#0043ce; }
  .runlist { background:#fff; border:1px solid #e0e0e0; padding:8px 0; margin-bottom:1rem; }
  .runlist-row { display:grid; grid-template-columns:120px 90px 1fr 90px 110px 100px; gap:8px; padding:8px 16px; font-size:13px; align-items:center; cursor:pointer; }
  .runlist-row:hover { background:#f4f4f4; }
  .runlist-head { font-weight:600; color:#525252; font-size:12px; cursor:default; }
  .header-stack { margin-bottom:1rem; border:1px solid #e0e0e0; }
  .tile { background:#fff; padding:1rem; border-bottom:1px solid #e0e0e0; }
  .tile h4 { font-size:14px; font-weight:600; margin:0 0 8px; letter-spacing:.16px; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px 24px; font-size:13px; }
  .kv .k { color:#525252; font-size:12px; }
  .verdict-row { display:grid; gap:12px; align-items:center; padding:8px 0; border-top:1px solid #e0e0e0; font-size:13px; }
  .icon-btn { background:none; border:none; cursor:pointer; font-size:14px; color:#0f62fe; padding:0; }
  .tag-batched { background:#e8daff; color:#6929c4; }
  .expand { background:#f4f4f4; padding:1rem; border-top:1px solid #e0e0e0; }
  .expand .zone { background:#fff; padding:12px; border:1px solid #e0e0e0; }
  .zone-title { font-size:12px; font-weight:600; color:#525252; margin-bottom:8px; }
  .toast { position:fixed; right:1.5rem; bottom:1.5rem; z-index:10; min-width:320px; }
  .mono { font-family:'IBM Plex Mono', monospace; font-size:13px; }
  .progress { font-size:13px; color:#525252; display:inline-flex; gap:8px; align-items:center; }
  .sel { width:16px; height:16px; }
  .dim { color:#8d8d8d; }
  .sheet-paper { background:#fff; width:794px; padding:28px 32px; box-shadow:0 1px 6px rgba(0,0,0,.25); color:#161616; }
  .sheet-t { width:100%; border-collapse:collapse; font-size:13px; }
  .sheet-t th { text-align:left; border-bottom:1.5px solid #161616; padding:4px; font-size:12px; }
  .sheet-t td { border-bottom:1px solid #c6c6c6; padding:7px 4px; vertical-align:top; }
  .sheet-t tr.grp td { background:#e0e0e0; font-weight:600; }
  @media print { body * { visibility:hidden; } .sheet-paper, .sheet-paper * { visibility:visible; } .sheet-paper { position:absolute; left:0; top:0; box-shadow:none; width:auto; } .no-print { display:none; } @page { size:A4 portrait; margin:12mm; } }
  .legend { font-size:12px; color:#525252; margin-top:2rem; padding-top:1rem; border-top:1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="preview-banner">Visual Preview: Microbiology V2 | OpenELIS Design Mockup | Not a live application</div>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const t = (k, f) => f || k;

function Tag({ kind, children }) { return <span className={`cds--tag cds--tag--${kind}`}>{children}</span>; }
function Btn({ kind = 'primary', children, onClick, disabled }) { return <button className={`cds--btn cds--btn--${kind} cds--btn--sm`} onClick={onClick} disabled={disabled}>{children}</button>; }
function Field({ label, req, final, missing, children }) {
  return <div className={`field ${missing ? 'missing' : ''}`}>
    <label>{label}{req && <span className="req">*</span>}{final && <span className="req">◆</span>}</label>
    {children}
    {final && <div className={`helper ${missing ? 'warn' : ''}`}>{missing ? t('microbiology.case.requiredBeforeFinal', 'Needed before final report') + ' (missing)' : t('microbiology.case.requiredBeforeFinal', 'Needed before final report')}</div>}
  </div>;
}
function Section({ n, title, isNew, tags, children, open = true, cls = '' }) {
  const [o, setO] = useState(open);
  return <div className={`sec ${cls}`}>
    <div className="sec-h" onClick={() => setO(!o)}>
      <h3><span className="num">{n}</span>{title}{isNew && <span className="new">v2</span>}{tags}</h3>
      <span className="muted">{o ? 'Collapse' : 'Expand'}</span>
    </div>
    {o && <div className="sec-b">{children}</div>}
  </div>;
}

/* ---------- CASE VIEW ---------- */
/* ---------- One result entry pattern for every case test row (FR-06.5) ---------- */
const GRADES = ['None', 'Rare', 'Few', 'Moderate', 'Many'];
function ComponentRows({ rows }) {
  return <table className="t" style={{ background: '#fff' }}><thead><tr><th style={{ width: '35%' }}>Component</th><th>Result</th><th>Flag</th></tr></thead>
    <tbody>{rows.map(r => <tr key={r.c}><td>{r.c}</td><td><select defaultValue={r.v} style={{ width: '100%' }}>{r.opts.map(o => <option key={o}>{o}</option>)}</select></td><td>{r.flag ? <Tag kind="red">{r.flag}</Tag> : <span className="muted">none</span>}</td></tr>)}</tbody></table>;
}
const NotesCtx = React.createContext(null);
const NOTE_SEED = {
  gram: [{ d: '23 Sep 09:12', a: 'J. Kaupa', type: 'I', body: 'Thick smear; re-stained once before reading.' }],
  'MGIT-004812-A': [{ d: '28 Sep 08:40', a: 'R. Opa', type: 'E', body: 'Positive signal on day 5; purity subculture set up.' }],
  'ISO-1': [{ d: '28 Sep 10:05', a: 'R. Opa', type: 'I', body: 'MPT64 read at 15 minutes; clear band.' }],
};
function NotesPanel({ id, printable = true, bare, underCulture }) {
  const { notes, addNote } = React.useContext(NotesCtx);
  const list = notes[id] || [];
  const [adding, setAdding] = useState(false);
  const [type, setType] = useState('I');
  const [body, setBody] = useState('');
  const save = () => { if (!body.trim()) return; addNote(id, { d: '30 Sep ' + '09:30', a: 'J. Kaupa', type, body: body.trim() }); setBody(''); setType('I'); setAdding(false); };
  return <div style={{ background: '#fff', border: '1px solid #e0e0e0', padding: '.75rem', marginTop: bare ? 0 : '.75rem' }}>
    <div style={{ fontWeight: 600, marginBottom: '.4rem' }}>{t('microbiology.case.notes.title', 'Notes')}</div>
    {list.length ? <table className="t"><thead><tr><th style={{ width: '16%' }}>Date/time</th><th style={{ width: '14%' }}>Author</th><th style={{ width: '18%' }}>Type</th><th>Note</th></tr></thead>
      <tbody>{list.map((n, i) => <tr key={i}><td>{n.d}</td><td>{n.a}</td><td>{n.type === 'E' ? <Tag kind="blue">{t('label.results.notes.sendWithResult', 'Send with Result')}</Tag> : <Tag kind="gray">{t('label.results.notes.inLabOnly', 'In Lab Only')}</Tag>}</td><td style={{ whiteSpace: 'normal' }}>{n.body}</td></tr>)}</tbody></table>
      : <div className="muted">No notes yet.</div>}
    {adding ? <div style={{ marginTop: '.5rem' }}>
      <div style={{ display: 'flex', gap: 16, marginBottom: 6, fontSize: 14 }}>
        <label><input type="radio" name={'nt-' + id} checked={type === 'I'} onChange={() => setType('I')} style={{ width: 'auto', marginRight: 4 }} />{t('label.results.notes.inLabOnly', 'In Lab Only')}</label>
        <label><input type="radio" name={'nt-' + id} checked={type === 'E'} onChange={() => setType('E')} style={{ width: 'auto', marginRight: 4 }} />{t('label.results.notes.sendWithResult', 'Send with Result')}</label></div>
      {underCulture && type === 'E' && <div className="helper" style={{ marginBottom: 6 }}>{t('microbiology.case.notes.printsUnderCulture', 'Prints under the culture result on the report.')}</div>}
      <div className="field"><textarea rows={3} value={body} onChange={e => setBody(e.target.value)} placeholder="Note text" style={{ width: '100%' }} /></div>
      {type === 'E' && !printable && <div className="note-box" style={{ margin: '.4rem 0' }}>{t('microbiology.case.notes.notPrinted', 'This result is not on the report, so this note will not print')}</div>}
      <div className="row-actions"><Btn onClick={save}>{t('microbiology.case.notes.save', 'Save note')}</Btn><Btn kind="ghost" onClick={() => setAdding(false)}>Cancel</Btn></div>
    </div> : <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '.4rem' }}><Btn kind="tertiary" onClick={() => setAdding(true)}>{t('button.results.notes.newNote', 'New Note')}</Btn></div>}
  </div>;
}
function NoteCount({ id }) { const { notes } = React.useContext(NotesCtx); const n = (notes[id] || []).length; return n ? <span className="muted" style={{ fontSize: 12 }}> · {n} note{n > 1 ? 's' : ''}</span> : null; }

function ResultEditor({ row, onClose, printable }) {
  const [prev, setPrev] = useState(!!row.external);
  return <div className="inline-panel" style={{ marginTop: 0 }}>
    <div style={{ fontWeight: 600, marginBottom: '.5rem' }}>{row.test} <span className="muted" style={{ fontWeight: 400 }}>· result type: {row.type === 'components' ? 'several components (graded observations use dictionary grades, FR-06.1a)' : row.type === 'numeric' ? 'number with unit' : 'coded list'} (from the test catalog)</span></div>
    {row.type === 'coded' && <Field label="Result" req><select defaultValue={row.result || ''} style={{ maxWidth: 520 }}><option value="">Select</option>{(row.opts || []).map(o => <option key={o}>{o}</option>)}</select></Field>}
    {row.type === 'components' && <ComponentRows rows={row.components} />}
    {row.type === 'numeric' && <div className="grid" style={{ gridTemplateColumns: '200px 120px 1fr' }}><Field label="Result" req><input defaultValue={row.result} /></Field><Field label="Unit"><input disabled defaultValue={row.unit} /></Field><div className="muted" style={{ alignSelf: 'end' }}>Reference range {row.range}</div></div>}
    <div className="grid" style={{ marginTop: '.75rem' }}>
      <div className="field"><label>&nbsp;</label><label style={{ color: '#161616', fontSize: 14 }}><input type="checkbox" style={{ width: 'auto', marginRight: 6 }} checked={prev} onChange={e => setPrev(e.target.checked)} />{t('microbiology.case.testedElsewhere', 'Tested elsewhere')} <span className="muted">(result reported by another laboratory, or earlier)</span></label></div>
      {prev && <Field label={t('microbiology.case.performedBy', 'Performed by')} req><input list="orgs" defaultValue={row.external ? 'Goroka Provincial Hospital Laboratory' : ''} placeholder="Search the Organizations list or a user" /><datalist id="orgs"><option value="Goroka Provincial Hospital Laboratory" /><option value="Mount Hagen Provincial Hospital Laboratory" /><option value="J. Kaupa (user)" /></datalist></Field>}
      {prev && <Field label={t('microbiology.case.datePerformed', 'Date performed')} req><input defaultValue="22/09/2026" /></Field>}
      {row.state && row.state !== 'Not started' && <div className="muted" style={{ gridColumn: '1 / -1' }}>{t('microbiology.case.history.enteredBy', 'Entered by {0}, {1}').replace('{0}', row.by || 'J. Kaupa').replace('{1}', '02 Oct 08:40')}{row.state === 'Validated' && <> · {t('microbiology.case.history.validatedBy', 'Validated by {0}, {1}').replace('{0}', 'R. Opa').replace('{1}', '02 Oct 09:15')}</>}</div>}
      {!prev && <Field label="Reagent lot" req={row.lotRequired}><select defaultValue={row.lot || ''}><option value="">Select lot</option><option>ZN stain kit, lot 22071, exp 03/2027</option><option>Xpert MTB/RIF Ultra cartridges, lot 1000-2231</option><option>Gram stain kit, lot 44120</option></select></Field>}
    </div>
    <NotesPanel id={row.id} printable={printable} />
    <p className="muted" style={{ margin: '.5rem 0' }}>Flags (High, Low, Abnormal, Critical) are applied from the test catalog as on Results Entry. Saving records the result as Awaiting validation; a validator validates or returns it (the OpenELIS analysis statuses, FR-06.5). With Block self-validation on, the person who entered it cannot validate it.</p>
    <div className="row-actions"><Btn onClick={onClose}>Save result</Btn><Btn kind="ghost" onClick={onClose}>Cancel</Btn></div>
  </div>;
}
function CaseTestTable({ rows, labOnly, setLabOnly, showOn }) {
  const [open, setOpen] = useState(null);
  const [menu, setMenu] = useState(null);
  const cols = showOn ? 7 : 7;
  return <table className="t rt">
    <colgroup><col style={{ width: '19%' }} /><col style={{ width: '29%' }} /><col style={{ width: '8%' }} /><col style={{ width: '15%' }} /><col style={{ width: '11%' }} /><col style={{ width: '8%' }} /><col style={{ width: '10%' }} /></colgroup>
    <thead><tr><th>Test</th><th>Result</th><th>Flag</th><th>{t('microbiology.case.performedBy', 'Performed by')}</th><th>Reagent lot</th><th>Status</th><th></th></tr></thead>
    <tbody>{rows.map(r => <React.Fragment key={r.id}>
      <tr>
        <td>{r.test}<NoteCount id={r.id} />{r.on && <div className="muted">On {r.on}</div>}
          <div>{r.external && <Tag kind="gray">{t('microbiology.case.external', 'External result')}</Tag>}{labOnly[r.id] && <Tag kind="purple">{t('microbiology.case.inLabOnly', 'In lab only')}</Tag>}</div></td>
        <td style={{ whiteSpace: 'normal' }}>{r.display ? r.display : <span className="muted">Not entered</span>}</td>
        <td>{r.flag ? <Tag kind="red">{r.flag}</Tag> : <span className="muted">none</span>}</td>
        <td>{r.by || <span className="muted">n/a</span>}</td>
        <td className="muted">{r.lot || (r.external ? 'n/a (external)' : 'n/a')}</td>
        <td><Tag kind={r.state === 'Validated' ? 'green' : r.state === 'Awaiting validation' ? 'warm-gray' : 'gray'}>{r.state}</Tag></td>
        <td style={{ whiteSpace: 'nowrap', position: 'relative' }}>
          <Btn kind="ghost" onClick={() => setOpen(open === r.id ? null : r.id)}>{r.display ? 'Edit' : 'Enter'}</Btn>
          <Btn kind="ghost" onClick={() => setMenu(menu === r.id ? null : r.id)}>⋯</Btn>
          {menu === r.id && <div className="menu"><button onClick={() => { setLabOnly({ ...labOnly, [r.id]: !labOnly[r.id] }); setMenu(null); }}>{labOnly[r.id] ? 'Turn off In lab only' : 'Mark In lab only'}</button><button onClick={() => setMenu(null)}>{t('microbiology.case.moveResult', 'Move result')}</button><button onClick={() => setMenu(null)}>Cancel test (reason)</button></div>}
        </td>
      </tr>
      {open === r.id && <tr><td colSpan={cols} style={{ padding: 0 }}><ResultEditor row={r} onClose={() => setOpen(null)} printable={!labOnly[r.id]} /></td></tr>}
    </React.Fragment>)}</tbody></table>;
}

const MEDIA_SEED = [
  { name: 'BBL MGIT 7 mL tube', tracked: true, unit: 'tube', atm: 'Aerobic (ambient air)', temp: 37, lots: [{ n: '5327611', exp: '01/2027', left: 212 }, { n: '5311020', exp: '08/2026', why: 'Expired' }] },
  { name: 'Löwenstein-Jensen slope', tracked: true, unit: 'slope', atm: 'Aerobic (ambient air)', temp: 37, lots: [{ n: 'LJ-2609 (prepared in-house)', exp: '11/2026', left: 40 }, { n: 'LJ-2608', exp: '10/2026', why: 'QC failed' }] },
  { name: 'Blood agar (sheep) plate', tracked: true, unit: 'plate', atm: 'CO₂-enriched (5 to 10%)', temp: 35, lots: [{ n: 'BA-26-117', exp: '10/2026', left: 64 }] },
  { name: 'Chocolate agar plate', tracked: true, unit: 'plate', atm: 'CO₂-enriched (5 to 10%)', temp: 35, lots: [{ n: 'CA-26-052', exp: '10/2026', left: 18 }] },
  { name: 'MacConkey agar plate', tracked: true, unit: 'plate', atm: 'Aerobic (ambient air)', temp: 35, lots: [{ n: 'MAC-26-090', exp: '11/2026', left: 51 }] },
  { name: 'CLED agar plate', tracked: true, unit: 'plate', atm: 'Aerobic (ambient air)', temp: 35, lots: [{ n: 'CLED-26-201', exp: '11/2026', left: 88 }] },
  { name: 'Selenite F broth', tracked: true, unit: 'tube', atm: 'Aerobic (ambient air)', temp: 35, lots: [{ n: 'SEL-26-014', exp: '12/2026', left: 30 }] },
  { name: 'BACTEC Plus Aerobic/F bottle', tracked: false, atm: 'Aerobic (ambient air)', temp: 35 },
  { name: 'BACTEC Lytic/10 Anaerobic/F bottle', tracked: false, atm: 'Anaerobic', temp: 35 },
  { name: 'Middlebrook 7H11 agar (from QMRL)', tracked: false, atm: 'CO₂-enriched (5 to 10%)', temp: 37 },
];
const ATMS = ['Aerobic (ambient air)', 'CO₂-enriched (5 to 10%)', 'Candle jar', 'Anaerobic', 'Microaerophilic'];
/* ---------- Extend incubation (FR-05.3a, FR-05.3a): from any open culture row, with a reason ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function addTime(str, n, unit) {
  const [d, m, hm] = String(str).split(' '); if (!hm) return str; const [h, mi] = hm.split(':');
  const dt = new Date(2026, MON.indexOf(m), +d, +h, +mi); dt.setTime(dt.getTime() + n * (unit === 'Hours' ? 3600e3 : 86400e3));
  const p2 = x => String(x).padStart(2, '0'); return `${p2(dt.getDate())} ${MON[dt.getMonth()]} ${p2(dt.getHours())}:${p2(dt.getMinutes())}`;
}
/* ---------- Positive at (FR-05.4b, FR-05.4b): exact date and time, default server time, editable; elapsed to the minute ---------- */
const SERVER_NOW = '02 Oct 10:15';
function parseT(str) { const [d, m, hm] = String(str || '').trim().split(/\s+/); if (!hm || MON.indexOf(m) < 0) return null; const [h, mi] = hm.split(':'); if (mi === undefined) return null; const dt = new Date(2026, MON.indexOf(m), +d, +h, +mi); return isNaN(dt) ? null : dt; }
function elapsed(a, b) {
  const s = parseT(a), e = parseT(b); if (!s || !e || e < s) return '';
  const mins = Math.round((e - s) / 60000), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  const u = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  return [d ? u(d, 'day') : null, u(h, 'hour'), u(m, 'minute')].filter(Boolean).join(' ');
}
function PosTag({ r, onEdit }) {
  return <div><Tag kind="green">Positive</Tag>
    <div style={{ fontSize: 12 }}><b>{r.posAt}</b>{r.posBy && <span className="muted"> · {r.posBy}</span>}</div>
    <div className="muted" style={{ fontSize: 12 }}>{t('microbiology.case.inoc.ttp', 'Time to positivity')}: {elapsed(r.start, r.posAt)}</div>
    {onEdit && <Btn kind="ghost" onClick={onEdit}>{t('microbiology.case.inoc.editPositiveAt', 'Edit positive time')}</Btn>}</div>;
}
function PositiveAtPanel({ row, onSave, onCancel }) {
  const editing = row.state === 'Positive';
  const [v, setV] = useState(row.posAt || SERVER_NOW);
  const dt = parseT(v), ok = dt && dt >= parseT(row.start) && dt <= parseT(SERVER_NOW);
  return <div className="inline-panel">
    <div style={{ fontWeight: 600, marginBottom: '.5rem' }}>{editing ? t('microbiology.case.inoc.editPositiveAt', 'Edit positive time') : t('microbiology.case.inoc.markPositive', 'Mark positive')}: {row.cid} <span className="new">v2</span> <span className="muted" style={{ fontWeight: 400 }}>Inoculated at {row.start}</span></div>
    <div className="grid">
      <Field label={t('microbiology.case.inoc.positiveAt', 'Positive at')} req><input value={v} onChange={e => setV(e.target.value)} aria-label="Positive at" /><div className={`helper ${ok ? '' : 'warn'}`}>{ok ? (editing ? 'The Timeline keeps the old and new times' : 'Defaults to now (server time); change it to when growth was seen') : 'Use DD Mon HH:MM, not before Inoculated at and not in the future'}</div></Field>
      <Field label={t('microbiology.case.inoc.ttp', 'Time to positivity')}><input disabled value={ok ? elapsed(row.start, v) : ''} aria-label="Time to positivity" /><div className="helper">From Inoculated at, in days, hours and minutes</div></Field>
    </div>
    <div className="row-actions"><Btn disabled={!ok} onClick={() => onSave(v)}>{editing ? t('common.save', 'Save') : t('microbiology.case.inoc.markPositive', 'Mark positive')}</Btn><Btn kind="ghost" onClick={onCancel}>Cancel</Btn></div>
  </div>;
}

function MediumPicker({ onPrefill, initial }) {
  const { media, setMedia } = React.useContext(MediaCtx);
  const [q, setQ] = useState(initial || '');
  const [open, setOpen] = useState(false);
  const [picked, setPicked] = useState(initial ? media.find(m => m.name === initial) : null);
  const [lot, setLot] = useState('');
  const hits = media.filter(m => m.name.toLowerCase().includes(q.toLowerCase()));
  const exact = media.some(m => m.name.toLowerCase() === q.trim().toLowerCase());
  const pick = m => { setPicked(m); setQ(m.name); setOpen(false); const first = (m.lots || []).find(l => !l.why); setLot(first ? first.n : ''); onPrefill && onPrefill(m); };
  const addNew = () => { const n = q.trim(); if (!n) return; const m = { name: n, tracked: false, atm: 'Aerobic (ambient air)', temp: 35 }; setMedia([...media, m]); pick(m); };
  return <>
    <Field label={t('microbiology.case.inoc.medium', 'Medium')} req>
      <div style={{ position: 'relative' }}>
        <input value={q} placeholder={t('microbiology.case.inoc.searchMedium', 'Search media')} onFocus={() => setOpen(true)} onChange={e => { setQ(e.target.value); setOpen(true); setPicked(null); }} />
        {open && <div className="menu" style={{ left: 0, right: 'auto', width: '100%' }}>
          {hits.map(m => <button key={m.name} onClick={() => pick(m)}>{m.name} {m.tracked ? <Tag kind="teal">{t('microbiology.case.inoc.tracked', 'Tracked')}</Tag> : <Tag kind="warm-gray">{t('microbiology.case.inoc.notTrackedTag', 'Not tracked')}</Tag>}</button>)}
          {q.trim() && !exact && <button onMouseDown={e => e.preventDefault()} onClick={addNew} style={{ color: '#0f62fe' }}>+ {t('microbiology.case.inoc.addMedium', 'Add new')}: "{q.trim()}" <span className="muted">(created not tracked)</span></button>}
        </div>}
      </div>
      <div className="helper">{t('microbiology.case.inoc.mediumHelp', 'Microbiology medium items. Tracked media need a lot; not tracked media have none.')}</div>
    </Field>
    {picked && !picked.tracked ? <Field label={t('microbiology.case.inoc.lot', 'Lot')}><div style={{ paddingTop: 6 }}><Tag kind="warm-gray">{t('microbiology.case.inoc.notTrackedTag', 'Not tracked')}</Tag></div><div className="helper">No lot and no stock change; the Timeline records it.</div></Field>
    : <Field label={t('microbiology.case.inoc.lot', 'Lot')} req>
      <select value={lot} onChange={e => setLot(e.target.value)} disabled={!picked}>
        <option value="">{picked ? (picked.lots.some(l => !l.why) ? 'Select a lot' : 'No usable lot') : 'Pick a medium first'}</option>
        {picked && picked.lots.map(l => <option key={l.n} value={l.n} disabled={!!l.why}>Lot {l.n}, exp {l.exp}{l.why ? ` (${l.why})` : `, ${l.left} ${picked.unit}s left`}</option>)}</select>
      <div className="helper">{picked && !picked.lots.some(l => !l.why) ? t('microbiology.case.inoc.noUsableLot', 'No usable lot in Inventory. Receive a lot, or choose another medium.') : picked ? `Last lot used in this lab unit preselected. Recorded on the row; stock is not changed here.` : 'Scan a lot barcode to fill Medium and Lot.'}</div>
    </Field>}
  </>;
}

/* ---------- How the case prints in the patient report: grouped under four sub-headers (OGC-1111 FR-A42, FR-A42a) ---------- */
const PRINT_GROUPS = [['initial', 'Initial testing'], ['culture', 'Culture'], ['ast', 'AST / DST'], ['additional', 'Additional testing']];
function ReportPrint({ ex, items }) {
  const line = (r, k) => <div key={k} style={{ paddingLeft: r.ind ? 10 * r.ind : 0, borderLeft: r.bar ? '2px solid #161616' : 0, fontWeight: r.b ? 700 : 400, color: r.muted ? '#595959' : '#161616', fontStyle: r.i ? 'italic' : 'normal' }}>{r.t}{r.r && <span style={{ float: 'right', fontWeight: r.rb === false ? 400 : 700, fontStyle: r.ri ? 'italic' : 'normal' }}>{r.r}</span>}</div>;
  return <div style={{ marginTop: '1rem', border: '1px solid #161616', padding: '.5rem', fontFamily: 'IBM Plex Sans', fontSize: 12, background: '#fff' }}>
    <div style={{ fontWeight: 700, borderBottom: '1px solid #161616', marginBottom: 4, textTransform: 'uppercase' }}>{ex.labUnit}</div>
    {PRINT_GROUPS.map(([g, label]) => {
      let lastIso = null; const rows = [];
      items.filter(i => i.group === g && !i.derived).forEach(i => { if (i.iso && i.iso !== lastIso) { rows.push({ t: i.isoLabel, b: true }); lastIso = i.iso; } rows.push(...i.print); });
      const derived = items.filter(i => i.group === g && i.derived).flatMap(i => i.print);
      if (!rows.length && !derived.length) return null;
      return <div key={g} className="print-group" data-group={g} style={{ marginBottom: 4 }}>
        <div style={{ fontWeight: 700, fontSize: 12, marginTop: 4 }}>{t('report.patient.micro.group.' + g, label)}</div>
        {rows.map(line)}{derived.map((r, k) => line(r, 'd' + k))}
      </div>;
    })}
    {ex.report.callback && <div style={{ color: '#595959', fontStyle: 'italic' }}>{ex.report.callback}</div>}
    <div className="muted" style={{ marginTop: 4 }}>How it prints inside the patient report (OGC-1111 §7.4, FR-A42a), black and white. Groups with nothing ticked are left out.</div>
  </div>;
}

    {qs.length ? <div className="grid">{qs.map(([q, type, opts, req]) => <Field key={q} label={q} final={req} missing={req}>{type === 'select' ? <select defaultValue="" aria-label={q}><option value="">Select</option>{opts.map(o => <option key={o}>{o}</option>)}</select> : <input aria-label={q} defaultValue={type === 'text' ? opts : ''} placeholder={type === 'number' ? 'e.g. 2' : ''} />}</Field>)}</div> : <div className="muted">This Program has no questionnaire.</div>}
  </div>;
}

function CaseView({ ex }) {

  const [subForm, setSubForm] = useState(false);
  const [subFrom, setSubFrom] = useState('');
  const subSuffix = (parent) => { const last = parent.split('-').pop(); return parent.includes('-SUB-') ? last + '.' : last; };
  const subIds = (parent, count) => { if (!parent) return []; const n0 = inoc.filter(r => r.from === parent).length; return Array.from({ length: count }, (_, k) => `BA-SUB-${ex.labShort}-${subSuffix(parent)}${n0 + k + 1}`); };
  const addSub = () => { if (!subFrom) return; const ids = subIds(subFrom, subCount); setInoc([...inoc, ...ids.map(cid => ({ cid, from: subFrom, purpose: subPurpose, medium: 'Blood agar (sheep) plate', lot: 'Lot BA-26-117', atm: subAtm, temp: 35, dur: 48, unit: 'Hours', every: 24, eunit: 'Hours', start: SERVER_NOW, ends: addTime(SERVER_NOW, 48, 'Hours'), next: addTime(SERVER_NOW, 24, 'Hours'), state: 'Incubating', day: 1, log: [] }))]); setSubForm(false); setSubFrom(''); setSubCount(1); setSubPurpose(''); };
  const ordered = (() => { const out = []; const walk = (parent, depth) => inoc.forEach((r, i) => { if ((r.from || '') === parent) { out.push({ r, i, depth }); walk(r.cid, depth + 1); } }); walk('', 0); return out; })();
  const [isoForm, setIsoForm] = useState(false);
  const [isoNew, setIsoNew] = useState({ from: '', gram: '', sig: 'Unknown' });
  const [referOpen, setReferOpen] = useState(false);
  const [labOnly, setLabOnly] = useState(ex.labOnly);
  const [reportSel, setReportSel] = useState(Object.fromEntries(ex.report.items.map(i => [i.k, i.on])));

  const accept = (id, where) => {
    const it = incoming.find(i => i.id === id);
    if (where.startsWith('Initial')) setInitial([...initial, { id: 'inc' + id, test: it.test, type: 'coded', opts: [it.value], result: it.value, display: it.value, flag: '', by: it.source, state: 'Awaiting validation' }]);
    setIncoming(incoming.filter(i => i.id !== id));
  };
  const [reading, setReading] = useState(null);
  const markChecked = (i, v) => { const c = [...inoc]; c[i] = { ...c[i], state: v === 'Significant growth' ? 'Positive' : 'Incubating', ...(v === 'Significant growth' ? { posAt: SERVER_NOW, posBy: ex.tech } : {}), next: v === 'Significant growth' ? 'n/a' : addTime(SERVER_NOW, c[i].every || 1, c[i].eunit || 'Days'), log: [...c[i].log, 'Day ' + c[i].day + ': ' + v.toLowerCase() + ' · ' + ex.tech] }; setInoc(c); setReading(null); };
  // FR-10.1g: a reflex rule adds a pending Gram stain under a blood culture bottle when it turns positive
  const markPositive = (cid, v) => {
    const r = inoc.find(x => x.cid === cid);
    setInoc(inoc.map(x => x.cid === cid ? { ...x, log: [...x.log, x.state === 'Positive' ? `Positive at changed from ${x.posAt} to ${v} · ${ex.tech}` : `Marked positive at ${v} (${elapsed(x.start, v)}) · ${ex.tech}`], state: 'Positive', next: 'n/a', posAt: v, posBy: x.state === 'Positive' && x.posBy && x.posBy.includes('signal') ? x.posBy + ', time edited by ' + ex.tech : ex.tech } : x));
    if (r && r.state !== 'Positive' && r.bottle && !micro.some(m => m.from === cid && m.test === 'Gram stain, culture')) setMicro(m => [...m, newChild('Gram stain, culture', cid, m.filter(x => x.test === 'Gram stain, culture').length + 1, { rule: 'Blood culture result = Positive: Gram stain, culture', inLabOnly: false, at: v })]);
  };
  const addChild = (test, cid) => { const n = micro.filter(x => (test.startsWith('Gram') ? x.test.startsWith('Gram') : !x.test.startsWith('Gram'))).length + 1; const c = newChild(test, cid, n, { at: SERVER_NOW }); setMicro(m => [...m, c]); return c.id; };
  const saveChild = (id, components) => setMicro(micro.map(x => x.id === id ? { ...x, components, display: compDisplay(components), state: 'Awaiting validation', at: SERVER_NOW, by: ex.tech } : x));
  // report items: the example's items plus the reportable Gram stains (from the culture rows) and any added isolates

  const gramItems = micro.filter(m => m.kind === 'test' && !m.inLabOnly && m.display).map(m => ({ k: m.id, group: 'culture', sec: 'Culture · ' + m.id, label: m.test + ' on ' + m.from + ': ' + m.display, d: m.state === 'Validated' ? 'On' : 'On, prints once validated', on: true, order: 11, print: m.state === 'Validated' ? [{ t: m.test + ' (' + m.from + ')', r: m.display, ind: 1 }] : [] }));
  const allItems = [...ex.report.items, ...gramItems].filter(i => !i.hideIf || !labOnly[i.hideIf]).sort((a, b) => (a.order || 0) - (b.order || 0));
  const printed = allItems.filter(i => reportSel[i.k] !== false && (reportSel[i.k] || i.on)).sort((a, b) => (a.order || 0) - (b.order || 0));

  return <MediaCtx.Provider value={{ media, setMedia }}><NotesCtx.Provider value={{ notes, addNote }}><div>
    <div className="crumbs"><a href="#">Home</a> / <a href="#">Microbiology</a> / <a href="#">Worklist</a> / Case {ex.lab}</div>

    <div className="hdr">

      {ex.setLines && <div><b>{t('microbiology.case.cultureSet.summary', '{test}: {sets} sets, {bottles} bottles').replace('{test}', 'Blood culture').replace('{sets}', String(ex.setLines.length)).replace('{bottles}', '4')}</b>{ex.setLines.map(l => <div key={l} className="muted" style={{ fontSize: 12 }}>{l}</div>)}</div>}
      <div><b>{t('microbiology.case.program', 'Program')}</b>{program || <span className="muted">{t('microbiology.case.programNotSet', 'Program not set')}</span>} {track && <Tag kind={track === 'TB' ? 'purple' : 'teal'}>{track} track</Tag>} <span className="muted">(Case information; drives questions and exports)</span></div>
      <div><b>{t('microbiology.case.labUnit', 'Lab unit')}</b>{labUnit} <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setChangingLU(!changingLU)}>{t('microbiology.case.changeLabUnit', 'Change lab unit')}</button></div>
      <div><b>Stage</b>{ex.stage.map(([k, l]) => <Tag key={l} kind={k}>{l}</Tag>)}</div>
      {ex.related ? <div><b>{t('microbiology.case.relatedCases', 'Related cases')}</b><a href="#" style={{ color: '#0f62fe' }}>{ex.related}</a><div className="helper">Shared sample or split relationship; retained after transfer, including within the same lab unit.</div></div> : <div><b>Priority</b><Tag kind="red">{ex.priority}</Tag> <span className="muted">from the order</span></div>}
      <div className="row-actions" style={{ marginTop: 0 }}><Btn kind="secondary">Log critical notification</Btn><Btn kind="tertiary">Report NCE</Btn><Btn kind="tertiary" onClick={() => setHistOpen(!histOpen)}>{t('microbiology.case.patientHistory', 'Patient history')} ({ex.history.length})</Btn></div>
    </div>
    {histOpen && <PatientHistory ex={ex} />}
    {changingLU && <div className="inline-panel" style={{ marginTop: '-0.5rem', marginBottom: '1rem', background: '#fff', border: '1px solid #e0e0e0' }}>
      <div className="grid"><Field label="New lab unit" req><select value={labUnit} onChange={e => setLabUnit(e.target.value)}><option>TB</option><option>Microbiology</option></select></Field>
        <div className="muted" style={{ alignSelf: 'end' }}>Relabels the case: it moves to that lab unit's Worklist and edit rights follow that lab unit. The Program and tests do not change; if that lab unit already has a case for this order and sample type, both cases remain separate. Joining existing cases is deferred. Clinical lab units only . Recorded on the Timeline; no reason needed; not available after final release.</div></div>
      <div className="row-actions"><Btn onClick={() => setChangingLU(false)}>Save</Btn><Btn kind="ghost" onClick={() => setChangingLU(false)}>Cancel</Btn></div>

          <td>{r.state === 'Check due' && (reading === i ? <div><select onChange={e => markChecked(i, e.target.value)} defaultValue="" title="Dictionary: Culture reading" aria-label="Reading"><option value="" disabled>Reading (Dictionary: Culture reading)</option><option>No growth</option><option>Normal flora</option><option>Mixed growth</option><option>Significant growth</option></select></div> : <Btn kind="ghost" onClick={() => setReading(i)}>{t('microbiology.case.inoc.recordReading', 'Record reading')}</Btn>)}
            {(r.state === 'Check due' || r.state === 'Incubating') && <div><Btn kind="ghost" onClick={() => setPosFor(r.cid)}>{t('microbiology.case.inoc.markPositive', 'Mark positive')}</Btn><Btn kind="ghost" onClick={() => setOutcome(i, 'No growth')}>{t('microbiology.case.inoc.markNoGrowth', 'Mark no growth')}</Btn></div>}
            <div style={{ position: 'relative' }}><Btn kind="ghost" onClick={() => setAddMenu(addMenu === r.cid ? null : r.cid)}>{t('microbiology.case.culture.add', 'Add')} ▾</Btn>{addMenu === r.cid && <div className="menu">
              <button onClick={() => { setEditChild(addChild('Gram stain, culture', r.cid)); setAddMenu(null); }}>{t('microbiology.case.gram.add', 'Gram stain')}</button>
              <button onClick={() => { setChooserFor(r.cid); setAddMenu(null); }}>{t('microbiology.case.growth.testOnCulture', 'Test on this culture')}</button>
              <button onClick={() => { setSubForm(true); setSubFrom(r.cid); setAddMenu(null); }}>{t('microbiology.case.subculture', 'Subculture')}</button></div>}</div>
            {r.state !== 'No growth' && r.state !== 'Contaminated' && !(r.bottle && r.state === 'Positive') && <div><Btn kind="ghost" onClick={() => setExtFor(r.cid)}>{t('microbiology.case.inoc.extend', 'Extend incubation')}</Btn></div>}
            <div><Btn kind="ghost">{t('microbiology.case.printLabel', 'Print label')}</Btn></div>
            <div><Btn kind="ghost" onClick={() => setNotesOpen(notesOpen === r.cid ? null : r.cid)}>{t('microbiology.case.notes.count', 'Notes ({count})').replace('{count}', (notes[r.cid] || []).length)}</Btn></div></td></tr>
          {micro.filter(m => m.from === r.cid).map(m => <React.Fragment key={m.id}><tr className="sub">
            <td style={{ paddingLeft: 12 + (depth + 1) * 20 }}><span className="muted">↳ Test </span><span className="muted">{m.id}</span>{m.rule && <div><span className="cds--tag cds--tag--teal" style={{ whiteSpace: 'normal' }}>{t('microbiology.case.addedByRule', 'Added by rule')}: {m.rule}</span></div>}</td>
            <td colSpan={3}>{m.test} {m.inLabOnly && <Tag kind="purple">{t('microbiology.case.inLabOnly', 'In lab only')}</Tag>}<div>{m.display ? <b>{m.display}</b> : <span className="muted">{t('microbiology.case.gram.noResult', 'No result yet')}</span>}</div></td>
            <td className="muted">{m.at}</td>
            <td><Tag kind={m.state === 'Validated' ? 'green' : m.state === 'Awaiting validation' ? 'warm-gray' : 'purple'}>{m.state}</Tag></td>
            <td className="muted">{m.by}</td>
            <td>{!m.display ? <Btn kind="tertiary" onClick={() => setEditChild(m.id)}>{t('microbiology.case.gram.enterResult', 'Enter result')}</Btn> : m.state !== 'Validated' && <><Btn kind="ghost" onClick={() => setEditChild(m.id)}>{t('common.edit', 'Edit')}</Btn><Btn kind="ghost" onClick={() => setMicro(micro.map(x => x.id === m.id ? { ...x, state: 'Validated' } : x))}>{t('label.validate', 'Validate')}</Btn></>}
              <div><Btn kind="ghost" onClick={() => setMicro(micro.map(x => x.id === m.id ? { ...x, inLabOnly: !x.inLabOnly } : x))}>{m.inLabOnly ? t('microbiology.case.inLabOnly.off', 'Turn off In lab only') : t('microbiology.case.inLabOnly.on', 'Mark In lab only')}</Btn></div>
              <Btn kind="ghost" onClick={() => setNotesOpen(notesOpen === m.id ? null : m.id)}>{t('microbiology.case.notes.count', 'Notes ({count})').replace('{count}', (notes[m.id] || []).length)}</Btn></td></tr>
            {editChild === m.id && <tr><td colSpan={8} style={{ padding: 0 }}><ChildEditor m={m} onCancel={() => setEditChild(null)} onSave={cs => { saveChild(m.id, cs); setEditChild(null); }} /></td></tr>}
          </React.Fragment>)}
          </React.Fragment>)}</tbody></table>
      {posFor && <PositiveAtPanel row={inoc.find(r => r.cid === posFor)} onCancel={() => setPosFor(null)} onSave={v => { markPositive(posFor, v); setPosFor(null); }} />}
      {extFor && <ExtendPanel row={inoc.find(r => r.cid === extFor)} onCancel={() => setExtFor(null)} onSave={x => { setInoc(inoc.map(r => r.cid === extFor ? { ...r, ends: x.ends, ext: [...(r.ext || []), x], log: [...r.log, `${t('microbiology.case.inoc.extendedLog', 'Incubation extended')} ${x.n} ${x.unit} (${x.reason}); now ends ${x.ends} · ${ex.tech}`] } : r)); setExtFor(null); }} />}
      {chooserFor && <div><div className="muted" style={{ marginTop: '.5rem' }}>{t('microbiology.case.growth.testOnCulture', 'Test on this culture')}: {chooserFor}</div><TestChooser ch={ex.choosers.culture} onCancel={() => setChooserFor(null)} onAdd={p => { p.forEach(x => addChild(x, chooserFor)); setChooserFor(null); }} /></div>}
      {subForm && <div className="inline-panel"><div className="grid">
        <Field label={t('microbiology.case.subculture.fromCulture', 'From culture')} req><select value={subFrom} onChange={e => setSubFrom(e.target.value)}>
          <option value="" disabled>Select a culture</option>
          {[...inoc.filter(r => r.state === 'Positive'), ...inoc.filter(r => r.state !== 'Positive')].map(r => <option key={r.cid} value={r.cid}>{r.cid}, {r.medium}, {r.state === 'Positive' ? 'positive' : r.state.toLowerCase()}</option>)}</select><div className="helper">Positive cultures first; any culture can be subcultured</div></Field>
        {subFrom && (inoc.find(r => r.cid === subFrom) || {}).state !== 'Positive' && <Field label={t('microbiology.case.subculture.purpose', 'Purpose')} req><select value={subPurpose} onChange={e => setSubPurpose(e.target.value)} aria-label="Purpose"><option value="" disabled>Select</option><option>Enrichment</option><option>Blind or terminal subculture</option><option>Purity</option><option>Other</option></select><div className="helper">Asked when the culture has no growth · Dictionary: Subculture purpose</div></Field>}
        <MediumPicker onPrefill={m => setSubAtm(m.atm)} />
        <Field label="Atmosphere" req><select value={subAtm} onChange={e => setSubAtm(e.target.value)}>{ATMS.map(a => <option key={a}>{a}</option>)}</select></Field>
        <Field label="Container identifiers" req>{subIds(subFrom, subCount).map(id => <input key={id} defaultValue={id} style={{ marginBottom: 4 }} />)}{!subFrom && <input disabled placeholder="Generated from the culture" />}<div className="helper">The next numbers for this culture; editable</div></Field></div>
        <Btn kind="ghost" onClick={() => setSubCount(subCount + 1)}>{t('microbiology.case.subculture.addMedium', '+ Add another medium')}</Btn>{subCount > 1 && <span className="muted"> {subCount} subcultures, one row each</span>}
        <div className="row-actions"><Btn onClick={addSub}>Add {subCount > 1 ? subCount + ' subcultures' : 'subculture'}</Btn><Btn kind="ghost" onClick={() => { setSubForm(false); setSubCount(1); }}>Cancel</Btn></div></div>}
      {notesOpen && micro.some(m => m.id === notesOpen) && <div><div className="muted" style={{ marginTop: '.5rem' }}>Notes on {notesOpen}</div><NotesPanel id={notesOpen} bare underCulture /></div>}
      {notesOpen && inoc.some(r => r.cid === notesOpen) && <div><div className="muted" style={{ marginTop: '.5rem' }}>Notes on culture row {notesOpen}</div><NotesPanel id={notesOpen} bare underCulture /></div>}
      <p className="muted" style={{ marginTop: '.4rem' }}>Every culture and subculture row has an Add menu: Gram stain (the chooser with Gram stain, culture already picked), Test on this culture (the standard chooser, filtered to tests set up for this sample type or Isolate: microscopy, rapid ID, Xpert on a culture), Subculture. Each test's results come from the test catalog; In lab only decides whether it reports, defaulted from the catalog (microscopy on, Gram off). A test with no result yet (added, or added by a reflex rule) shows Enter result.</p>
      <div className="inline-panel">
        <div className="muted" style={{ marginBottom: '.5rem' }}>+ Start inoculation</div>
        <TemplateProposal template={ex.template} onApply={() => {}} />
        <div className="muted" style={{ marginBottom: '.5rem' }}>Or add one row (pre-filled from the previous row):</div>
        <div className="grid">
          <MediumPicker onPrefill={m => { setInocAtm(m.atm); setInocTemp(String(m.temp)); }} />
          <Field label="Atmosphere" req><select value={inocAtm} onChange={e => setInocAtm(e.target.value)}>{ATMS.map(a => <option key={a}>{a}</option>)}</select><div className="helper">Pre-filled from the medium's usual atmosphere when Inventory records one · Dictionary: Culture atmosphere</div></Field>
          <Field label="Container identifier" req><input defaultValue={ex.nextContainer} /></Field>
          <Field label="Temperature (°C)"><input value={inocTemp} onChange={e => setInocTemp(e.target.value)} /></Field>
          <Field label={t('microbiology.case.inoc.duration', 'Incubation duration')} req><div style={{ display: 'flex', gap: 8 }}><input defaultValue={ex.template.rows[0].dur} style={{ width: '40%' }} /><select defaultValue={ex.template.rows[0].unit} style={{ width: '60%' }}><option>Days</option><option>Hours</option></select></div></Field>
          <Field label={t('microbiology.case.inoc.checkEvery', 'Check every') + ' (optional)'}><div style={{ display: 'flex', gap: 8 }}><input defaultValue={ex.template.rows[0].every} style={{ width: '40%' }} /><select defaultValue={ex.template.rows[0].unit} style={{ width: '60%' }}><option>Days</option><option>Hours</option></select></div></Field>
        </div>
      </div>
    </Section>

    <Section n="5" title="Isolates" tags={<span className="muted"></span>}>
      <table className="t"><thead><tr><th>Isolate</th><th>{t('microbiology.case.isolate.pickedFrom', 'Picked from')}</th><th>Gram / morphology</th><th>Organism</th><th>ID method · confidence</th><th>Significance</th><th></th></tr></thead>
        <tbody>{isolates.map(s => <tr key={s.id}><td>{s.id} {s.organism ? <Tag kind="green">Identified</Tag> : <Tag kind="warm-gray">Not identified</Tag>}</td><td className="muted">{s.from}</td><td>{s.gram}</td><td>{s.organism ? <i>{s.organism}</i> : <span className="muted">Identify</span>}</td><td>{s.idm}</td><td><Tag kind={s.sig === 'Clinically significant' ? 'green' : 'gray'}>{s.sig}</Tag></td>
          <td style={{ whiteSpace: 'nowrap' }}><Btn kind="ghost">{s.organism ? 'Re-identify' : 'Identify'}</Btn><Btn kind="ghost">Log critical</Btn><Btn kind="ghost">{t('microbiology.case.printLabel', 'Print label')}</Btn><Btn kind="ghost" onClick={() => setNotesOpen(notesOpen === s.id ? null : s.id)}>{t('microbiology.case.notes.count', 'Notes ({count})').replace('{count}', (notes[s.id] || []).length)} <span className="new">v2</span></Btn></td></tr>)}</tbody></table>
      {notesOpen && isolates.some(s => s.id === notesOpen) && <NotesPanel id={notesOpen} />}
      {ex.isoNote && <div className="note-box" style={{ marginTop: '.75rem' }}>{ex.isoNote}</div>}
      {isoForm ? <div className="inline-panel"><div className="grid">
        <Field label={t('microbiology.case.isolate.pickedFrom', 'Picked from')} req><select value={isoNew.from} onChange={e => setIsoNew({ ...isoNew, from: e.target.value })} aria-label="Picked from"><option value="" disabled>Select a culture with growth</option>{inoc.filter(r => r.state === 'Positive').map(r => <option key={r.cid} value={r.cid}>{r.cid}, {r.medium}</option>)}</select><div className="helper">One positive culture can give several isolates</div></Field>
        <Field label="Label" req><input value={'ISO-' + (isolates.length + 1)} readOnly /></Field>
        <Field label="Gram stain" req><select value={isoNew.gram} onChange={e => setIsoNew({ ...isoNew, gram: e.target.value })} aria-label="Isolate Gram stain"><option value="" disabled>Select</option>{ex.isoGrams.map(g => <option key={g}>{g}</option>)}</select></Field>
        <Field label="Significance" req><select value={isoNew.sig} onChange={e => setIsoNew({ ...isoNew, sig: e.target.value })}><option>Unknown</option><option>Clinically significant</option><option>Contaminant</option><option>Normal flora</option></select></Field></div>
        <div className="row-actions"><Btn disabled={!isoNew.from || !isoNew.gram} onClick={() => { setIsolates([...isolates, { id: 'ISO-' + (isolates.length + 1), from: isoNew.from, gram: isoNew.gram, organism: '', idm: '', sig: isoNew.sig }]); setIsoForm(false); setIsoNew({ from: '', gram: '', sig: 'Unknown' }); }}>Create isolate</Btn><Btn kind="ghost" onClick={() => setIsoForm(false)}>Cancel</Btn></div></div>
      : <div className="row-actions"><Btn kind="tertiary" onClick={() => setIsoForm(true)}>+ Add isolate</Btn></div>}
      <div className="muted" style={{ marginTop: '.5rem' }}>Identification history: none. Create and Identify forms unchanged: label, gram stain, colony morphology, significance (Unknown, Clinically significant, Contaminant, Normal flora), organism, ID method (MALDI-TOF, VITEK 2, manual biochemistry, PCR), confidence, reason during an amendment.</div>
    </Section>

    <Section n="6" title={t('microbiology.case.section.astDst', 'AST / DST')} tags={<span className="new">v2 add panel</span>}>
      <table className="t" style={{ marginBottom: '.75rem' }}><thead><tr><th>Panels</th><th>On</th><th>Added</th><th>Method · standard</th><th>Run</th><th>Validation</th></tr></thead>
        <tbody>{panels.map(p => <tr key={p.name + p.on}><td>{p.name}</td><td>{p.on}</td><td>{p.added === 'Organism default' ? <><Tag kind="teal">Organism default</Tag> {p.addedNote && <span className="muted">{p.addedNote}</span>}</> : p.added}</td><td>{p.method}</td><td>{p.run}</td><td>{p.val === 'Awaiting validation' ? (validated ? <Tag kind="green">Validated</Tag> : <Tag kind="warm-gray">Awaiting validation</Tag>) : <span className="muted">{p.val}</span>}</td></tr>)}</tbody></table>
      <p className="muted" style={{ marginBottom: '.75rem' }}>Each panel is its own run. One positive culture can give several isolates, and one isolate several panels (for a bacterial isolate, for example the VITEK card plus a disk diffusion supplement). When two runs test the same agent, the report uses the run marked Use for reporting for that agent.</p>
      <div className="grid" style={{ gridTemplateColumns: 'repeat(4, 1fr)', marginBottom: '.75rem' }}>
        <Field label="Isolate" req><select>{isolates.map(s => <option key={s.id}>{s.id} {s.organism || '(not identified)'}</option>)}</select></Field>
        <Field label="Panel" req><select>{panels.map(p => <option key={p.name + p.on}>{p.name}</option>)}</select><div className="helper" style={{ color: '#0f62fe' }}>Adjust panel (reason required if changed)</div></Field>
        <Field label="Method" req><select defaultValue={ex.ast.method}><option>MGIT 960 (critical concentration)</option><option>VITEK 2</option><option>Phoenix</option><option>Etest</option><option>Broth microdilution</option><option>Disk diffusion (zone)</option></select></Field>
        <Field label="Breakpoint standard" req><select value={bp} onChange={e => setBp(e.target.value)}><option>WHO critical concentrations 2024</option><option>CLSI M100 36th ed. (2026)</option><option>EUCAST v15.0 (2025)</option></select><div className="helper">{ex.ast.bpHelp}</div></Field>
        <Field label="Entry mode"><select value={mode} onChange={e => setMode(e.target.value)}><option>Analyzer</option><option>Manual</option></select></Field>
        {mode === 'Analyzer' && <Field label="Analyzer" req><select><option>{ex.ast.analyzer}</option></select></Field>}
        {mode === 'Analyzer' && <Field label="Card / tube set ID" req><input defaultValue={ex.ast.card} /></Field>}
        <Field label="Reagent lot"><select><option>{ex.ast.lot}</option></select></Field>
      </div>
      <div className="note-box" style={{ marginBottom: '.75rem' }}>{ex.ast.runNote}</div>
      <table className="t"><thead><tr><th>{ex.ast.agentLabel}</th><th>Method</th><th>Raw</th><th>Source</th><th>Matched by</th><th>Interpretation</th><th></th></tr></thead>
        <tbody>{ex.ast.readings.map(a => <tr key={a.drug}><td>{a.drug}{a.note && <div className="muted">{a.note}</div>}</td><td>{a.method}</td><td>{a.raw || <span className="muted">awaiting</span>}</td><td>{a.override ? <Tag kind="warm-gray">Override</Tag> : a.source}</td><td>{a.raw ? (a.matched || bp) : ''}</td>
          <td><Tag kind={a.interp === 'R' || a.interp === 'Positive' ? 'red' : a.interp === 'S' ? 'green' : a.interp === 'Pending' ? 'purple' : 'warm-gray'}>{a.interp}</Tag>{a.instr && <span className="muted"> (instrument: {a.instr})</span>}</td><td>{a.raw && <Btn kind="ghost">{a.override ? 'Revert override' : 'Override'}</Btn>}</td></tr>)}</tbody></table>
      <div className="row-actions"><Btn kind="secondary">Record reading</Btn>{ex.ast.blocked ? <button className="cds--btn cds--btn--primary cds--btn--sm" disabled>{ex.ast.blocked}</button> : <Btn kind={validated ? 'secondary' : 'primary'} onClick={() => setValidated(!validated)}>{validated ? 'Undo validation' : 'Validate run: Accept results'}</Btn>}<Btn kind="ghost">New attempt (Repeat or Retest)</Btn></div>
      <table className="t" style={{ marginTop: '.5rem' }}><thead><tr><th>Attempt</th><th>Method</th><th>Status</th><th>Reporting</th></tr></thead>
        <tbody><tr><td>1 <Tag kind="gray">Original</Tag></td><td>{ex.ast.method}</td><td>{validated ? 'Validated' : 'Results in'}</td><td>Included</td></tr></tbody></table>
      <div className="muted" style={{ marginTop: '.5rem' }}>Susceptibility history: QC failed handling (invalidate and repeat, or override QC with reason), organism mismatch warning, no-breakpoint warning, override history with show original, review gating, Use for reporting for each agent across attempts.</div>
      {ex.ast.rule && <div style={{ marginTop: '.75rem' }}><Tag kind="teal">{t('microbiology.case.addedByRule', 'Added by rule')}: {ex.ast.rule[0]}</Tag><span className="muted">{ex.ast.rule[1]}</span></div>}
      <div style={{ marginTop: '.75rem' }}><span className="muted">{ex.ast.classLabel} (derived from organism and results): </span>{ex.ast.classTags.map(c => <Tag key={c} kind="red">{c}</Tag>)}<span className="muted">{ex.ast.classNote}</span></div>
      {adding === 'ast' ? <TestChooser ch={ex.choosers.ast} onCancel={() => setAdding(null)} onAdd={(p, on) => { setPanels([...panels, ...p.map(x => ({ name: x, on: on.split(' ')[0], added: 'Added with the chooser', method: ex.ast.method + ' · ' + bp, run: 'Not started', val: 'n/a' }))]); setAdding(null); }} />
        : <div className="row-actions"><Btn kind="tertiary" onClick={() => setAdding('ast')}>+ {t('microbiology.case.addTestOrPanel', 'Add test or panel')}</Btn><span className="muted" style={{ alignSelf: 'center' }}>Opens the standard test and panel chooser on the isolate; breakpoints follow the panel, test or antibiotic.</span></div>}
    </Section>

    <Section n="7" title={t('microbiology.case.section.additionalTesting', 'Additional testing')} isNew>
      {additional.length ? <CaseTestTable rows={additional} labOnly={labOnly} setLabOnly={setLabOnly} showOn /> : <div className="muted">No additional tests.</div>}
      {adding === 'additional' ? <TestChooser ch={ex.choosers.additional} onCancel={() => setAdding(null)} onAdd={(p, on) => { setAdditional([...additional, ...p.map((x, k) => ({ id: 'addl' + additional.length + k, test: x, on, type: 'coded', opts: ['Detected', 'Not detected'], display: '', flag: '', by: '', state: 'Not started' }))]); setAdding(null); }} />
        : <div className="row-actions"><Btn kind="tertiary" onClick={() => setAdding('additional')}>+ {t('microbiology.case.addTestOrPanel', 'Add test or panel')}</Btn><span className="muted" style={{ alignSelf: 'center' }}>Any catalog test, on the specimen or an isolate. In lab only can be set on any added test and turned off again; changes go to the Timeline.</span></div>}
    </Section>

    <Section n="8" title="Critical communication" open={false} tags={<span className="muted"></span>}>
      <table className="t"><thead><tr><th>Target</th><th>Recipient</th><th>Method</th><th>Message</th><th>{t('microbiology.case.critical.outcome', 'Outcome')}</th><th>Status</th><th></th></tr></thead>
        <tbody>{ex.critical.map(c => <tr key={c[0]}><td>{c[0]}</td><td>{c[1]}</td><td>{c[2]}</td><td>{c[3]}</td><td>{c[4]}</td><td><Tag kind={c[5] === 'Open' ? 'warm-gray' : c[5] === 'Closed' ? 'green' : 'blue'}>{c[5]}</Tag></td><td>{c[5] !== 'Closed' && <Btn kind="ghost">{c[5] === 'Open' ? 'Acknowledge' : 'Close (resolution note)'}</Btn>}</td></tr>)}</tbody></table>
      <div className="muted" style={{ marginTop: '.5rem' }}>Each call also writes a row in the shared critical callback log, so it prints under the result on the patient report and counts in the callback reports.</div>
    </Section>
    <Section n="9" title="Nonconformance" open={false} tags={<span className="muted"></span>}>
      <div className="muted">No NCE on this case. Report NCE and Mark specimen lost keep their fields (category, type, reporting unit, severity, description, immediate action) and dispositions (Flag only, Reject tests, Retest a run or one antibiotic).</div>
    </Section>
    <Section n="10" title="Report" tags={<span className="new">v2 per-result choice, grouped</span>}>
      <div className="grid" style={{ gridTemplateColumns: '1fr 1fr' }}>
        <div>
          <table className="t"><thead><tr><th>{t('microbiology.case.report.include', 'Report')}</th><th>Result</th><th>Default</th></tr></thead>
            <tbody>{PRINT_GROUPS.map(([g, label]) => { const its = allItems.filter(i => i.group === g); if (!its.length) return null; return <React.Fragment key={g}>
              <tr><td colSpan={3} style={{ background: '#e0e0e0', fontWeight: 600 }}>{label}</td></tr>
              {its.map(i => <tr key={i.k}><td><input type="checkbox" aria-label={'Report ' + i.k} checked={reportSel[i.k] !== undefined ? reportSel[i.k] : i.on} onChange={e => setReportSel({ ...reportSel, [i.k]: e.target.checked })} /></td><td><span className="muted">{i.sec}</span><br />{i.label}</td><td className="muted">{i.d}</td></tr>)}
            </React.Fragment>; })}</tbody></table>
          <p className="muted" style={{ marginTop: '.5rem' }}>Grouped the way the report prints (FR-A42a): Initial testing, Culture, AST / DST, Additional testing. Microscopy exams, Gram stains with Report this result off and In lab only tests are never listed. Changing a default is recorded on the Timeline.</p>
        </div>
        <div>
          <div className="note-box"><b>Final report checklist</b>{ex.report.checklist.map((c, k) => <div key={k}>{c[0] === 'ast' ? (validated ? '✓ AST run 1 validated' : '✗ AST run 1 not validated') : c[0] === 'program' ? (program ? '✓ Program set' : '✗ Program not set') : c}</div>)}</div>
          <table className="t" style={{ marginTop: '1rem' }}><thead><tr><th>Version</th><th>Released</th></tr></thead>
            <tbody>{ex.report.releases.map(r => <tr key={r[0]}><td>{r[0]}</td><td>{r[1]}</td></tr>)}</tbody></table>
          <ReportPrint ex={{ ...ex, labUnit }} items={printed} />
          <div className="row-actions"><Btn kind="secondary">{t('microbiology.case.report.releasePartial', 'Release partial report')}</Btn><button className="cds--btn cds--btn--primary cds--btn--sm" disabled>Release final ({ex.report.blocking} blocking)</button></div>
          <div className="muted" style={{ marginTop: '.5rem' }}>Exports: {track === 'Bacterial' ? 'Bacterial track: eligible Diagnostic isolates can be selected for WHONET after final release. GLASS-AMR is future work.' : track === 'TB' ? 'TB track recorded for future NTP and GLASS-TB exports.' : 'no track until a Program is set.'}</div>
        </div>
      </div>
    </Section>

    <Section n="11" title="Amendment" open={false} tags={<span className="muted"></span>}>
      <div className="muted">Available after final release: Open amendment (reason), Cancel amendment (reason), Release amended report; history and report versions with "corrects version N".</div>
    </Section>
    <Section n="12" title="Timeline" open={false}>
      <table className="t"><tbody>{ex.timeline.map((r, k) => <tr key={k}><td className="muted">{r[0]}</td><td>{r[1]}</td></tr>)}</tbody></table>
    </Section>
