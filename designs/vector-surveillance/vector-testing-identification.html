<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-03 Vector Testing & Identification — OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', Arial, sans-serif; }
    .preview-banner {
      background: #0f62fe; color: #fff;
      padding: 6px 1rem; font-size: 12px; font-family: monospace;
      display: flex; justify-content: space-between; align-items: center;
    }
    .app-shell { display: flex; min-height: calc(100vh - 48px); }
    .sidebar {
      width: 240px; min-width: 240px; background: #161616; color: #f4f4f4;
      padding: 0; overflow-y: auto;
    }
    .sidebar-header {
      background: #0f62fe; padding: 12px 16px;
      font-size: 14px; font-weight: 600; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-section { padding: 8px 0; }
    .nav-section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #8d8d8d; padding: 8px 16px 4px;
    }
    .nav-item {
      display: block; padding: 8px 16px; font-size: 14px; color: #c6c6c6;
      cursor: pointer; border-left: 2px solid transparent;
      text-decoration: none; transition: background 0.15s;
    }
    .nav-item:hover { background: #2d2d2d; color: #f4f4f4; }
    .nav-item.active { background: #2d2d2d; color: #fff; border-left-color: #0f62fe; }
    .main-content { flex: 1; padding: 24px 32px; overflow-y: auto; max-width: 1100px; }

    /* Screen tabs */
    .screen-tabs { display: flex; gap: 0; border-bottom: 2px solid #e0e0e0; margin-bottom: 24px; }
    .screen-tab {
      padding: 10px 20px; font-size: 14px; cursor: pointer; color: #525252;
      border-bottom: 2px solid transparent; margin-bottom: -2px; font-weight: 500;
    }
    .screen-tab.active { color: #0f62fe; border-bottom-color: #0f62fe; font-weight: 600; }
    .screen-tab:hover:not(.active) { color: #161616; background: #f4f4f4; }

    /* Worklist tabs */
    .wl-tabs { display: flex; gap: 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 16px; }
    .wl-tab {
      padding: 8px 16px; font-size: 13px; cursor: pointer; color: #525252;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .wl-tab.active { color: #0f62fe; border-bottom-color: #0f62fe; font-weight: 600; }

    /* DataTable */
    .data-table-wrap { background: #fff; border: 1px solid #e0e0e0; }
    .cds--data-table thead th { background: #e0e0e0 !important; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .cds--data-table tbody tr:hover td { background: #f4f4f4; }
    .cds--data-table td, .cds--data-table th { padding: 10px 12px !important; vertical-align: middle; }

    /* Tags */
    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag-green { background: #defbe6; color: #0e6027; }
    .tag-blue { background: #edf5ff; color: #0043ce; }
    .tag-warm-gray { background: #f2f0ef; color: #565151; }
    .tag-gray { background: #e0e0e0; color: #393939; }
    .tag-red { background: #fff1f1; color: #a2191f; }
    .tag-purple { background: #f6f2ff; color: #491d8b; }
    .tag-teal { background: #d9fbfb; color: #005d5d; }
    .tag-orange { background: #fff2e8; color: #b45309; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; font-size: 14px; font-family: inherit; padding: 8px 16px; border-radius: 0; font-weight: 400; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .btn-primary:hover { background: #0353e9; }
    .btn-secondary { background: #393939; color: #fff; }
    .btn-ghost { background: transparent; color: #0f62fe; padding: 6px 12px; font-size: 13px; }
    .btn-ghost:hover { background: #edf5ff; }
    .btn-danger-ghost { background: transparent; color: #da1e28; font-size: 13px; padding: 6px 12px; }
    .btn-sm { padding: 5px 12px; font-size: 13px; }
    .btn-icon { background: transparent; border: none; cursor: pointer; color: #525252; padding: 4px; }

    /* Form */
    .form-field { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #525252; margin-bottom: 6px; letter-spacing: 0.02em; }
    .form-input { width: 100%; padding: 8px 12px; border: 1px solid #8d8d8d; background: #fff; font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .form-input:focus { outline: 2px solid #0f62fe; outline-offset: 0; border-color: #0f62fe; }
    .form-select { width: 100%; padding: 8px 32px 8px 12px; border: 1px solid #8d8d8d; background: #fff; font-size: 14px; font-family: inherit; appearance: none; cursor: pointer; }
    .form-textarea { width: 100%; padding: 8px 12px; border: 1px solid #8d8d8d; background: #fff; font-size: 14px; font-family: inherit; resize: vertical; box-sizing: border-box; }

    /* Tile */
    .tile { background: #fff; padding: 16px; border: 1px solid #e0e0e0; }

    /* Notification */
    .notif { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .notif-warning { background: #fff8e1; border-left: 4px solid #f1c21b; }
    .notif-success { background: #defbe6; border-left: 4px solid #24a148; }
    .notif-info { background: #edf5ff; border-left: 4px solid #0f62fe; }
    .notif-icon { font-size: 18px; margin-top: 1px; }
    .notif-content { flex: 1; }
    .notif-title { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
    .notif-subtitle { font-size: 13px; color: #525252; }

    /* Accordion */
    .accordion { border-top: 1px solid #e0e0e0; }
    .accordion-item { border-bottom: 1px solid #e0e0e0; }
    .accordion-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; background: #fff; }
    .accordion-header:hover { background: #f4f4f4; }
    .accordion-title { font-size: 14px; font-weight: 500; }
    .accordion-body { padding: 16px; background: #fff; }

    /* Modal overlay */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #fff; width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .modal-header { background: #161616; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 12px 20px; background: #e0e0e0; display: flex; justify-content: flex-end; gap: 8px; }

    /* Expanded row */
    .expanded-row-content { background: #f4f4f4; padding: 16px; }

    /* Grid */
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    /* Progress bar */
    .progress-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .progress-bar-bg { flex: 1; height: 6px; background: #e0e0e0; border-radius: 3px; }
    .progress-bar-fill { height: 6px; background: #0f62fe; border-radius: 3px; }

    /* Species dist bar */
    .species-bar { margin-bottom: 10px; }
    .species-bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .species-bar-bg { background: #e0e0e0; height: 8px; border-radius: 3px; }
    .species-bar-fill { height: 8px; border-radius: 3px; }

    /* Checkbox */
    .cb { width: 16px; height: 16px; cursor: pointer; }

    /* Batch bar */
    .batch-bar { background: #393939; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 0; }
    .batch-count { font-size: 13px; }

    /* Summary card */
    .summary-card { background: #fff; border: 1px solid #e0e0e0; padding: 12px 16px; }
    .summary-card-label { font-size: 11px; color: #6f6f6f; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .summary-card-value { font-size: 20px; font-weight: 600; color: #161616; }
    .summary-card-sub { font-size: 12px; color: #525252; margin-top: 2px; }

    /* Radio */
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    <span>⚡ Visual Preview — V-03 Vector Testing &amp; Identification &nbsp;|&nbsp; OpenELIS Design Mockup &nbsp;|&nbsp; Not a live application</span>
    <span>Spec: vector-testing-identification.md</span>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    // -------------------------------------------------------------------------
    // Seed data
    // -------------------------------------------------------------------------
    const SPECIES_CATALOG = [
      'Aedes aegypti', 'Aedes albopictus', 'Culex quinquefasciatus',
      'Culex tritaeniorhynchus', 'Anopheles barbirostris', 'Anopheles maculatus',
      'Ixodes ricinus', 'Rhipicephalus microplus', 'Rattus norvegicus', 'Rattus rattus',
    ];

    const WORKLIST_LOTS = [
      { id: 'BPP-01-LOT-042', site: 'Bojongsoang — BPP-01', trapType: 'BG-Sentinel',    date: '2026-04-14', group: 'MOSQUITO', total: 25, done: 0,  pool: true,  positiveTest: 'NS1 RT-PCR', decon: 'PENDING' },
      { id: 'BPP-02-LOT-043', site: 'Margahayu — BPP-02',    trapType: 'CDC Light Trap', date: '2026-04-14', group: 'MOSQUITO', total: 12, done: 7,  pool: true,  positiveTest: null, decon: 'NOT_APPLICABLE' },
      { id: 'CIL-02-LOT-019', site: 'Cileunyi — CIL-02',     trapType: 'Ovitramp',       date: '2026-04-13', group: 'MOSQUITO', total: 8,  done: 0,  pool: false, positiveTest: null, decon: 'NOT_APPLICABLE' },
      { id: 'JAT-01-LOT-031', site: 'Jatisari — JAT-01',     trapType: 'BG-Sentinel',    date: '2026-04-12', group: 'MOSQUITO', total: 30, done: 14, pool: true,  positiveTest: null, decon: 'NOT_APPLICABLE' },
    ];

    const SPECIMENS = Array.from({ length: 10 }, (_, i) => ({
      id: `S${String(i+1).padStart(2,'0')}`,
      label: `Specimen ${String(i+1).padStart(2,'0')}`,
      status: i < 3 ? 'CONFIRMED' : i === 3 ? 'PRESUMPTIVE' : 'NOT_IDENTIFIED',
      species: i < 3 ? 'Aedes aegypti' : i === 3 ? 'Culex quinquefasciatus' : '',
      method: i < 3 ? 'Morphological' : i === 3 ? 'Molecular' : '',
      confidence: i < 3 ? 'Confirmed' : i === 3 ? 'Presumptive' : '',
    }));

    const TEST_PANELS = [
      { id: 'p1', name: 'Dengue Surveillance Panel',    group: 'MOSQUITO', tests: 'NS1 ELISA, NS1 RT-PCR (multiplex)', active: true },
      { id: 'p2', name: 'Malaria Vector Panel',         group: 'MOSQUITO', tests: 'Plasmodium PCR, P. falciparum Ag RDT', active: true },
      { id: 'p3', name: 'Tick-Borne Panel (Basic)',     group: 'TICK',     tests: 'Rickettsia PCR, Borrelia PCR', active: true },
      { id: 'p4', name: 'Arbovirus Expanded Panel',     group: 'MOSQUITO', tests: 'NS1 RT-PCR, Chikungunya RT-PCR, Zika RT-PCR', active: false },
    ];

    const DECON_LOTS = [
      { id: 'BPP-03-LOT-011', site: 'Antapani — BPP-03', positiveTest: 'NS1 RT-PCR', child: 25, done: 18, status: 'IN_PROGRESS' },
      { id: 'JAT-01-LOT-007', site: 'Jatisari — JAT-01',  positiveTest: 'NS1 RT-PCR', child: 20, done: 20, status: 'COMPLETE', positive: 3 },
    ];

    // -------------------------------------------------------------------------
    // Tag helpers
    // -------------------------------------------------------------------------
    const Tag = ({ kind, children }) => (
      <span className={`tag tag-${kind}`}>{children}</span>
    );

    const GroupTag = ({ group }) => {
      const map = { MOSQUITO: 'blue', TICK: 'purple', RODENT: 'warm-gray', OTHER: 'gray' };
      return <Tag kind={map[group] || 'gray'}>{group}</Tag>;
    };

    const StatusTag = ({ status }) => {
      const map = {
        NOT_IDENTIFIED: ['gray',      'Not Identified'],
        PRESUMPTIVE:    ['warm-gray', 'Presumptive'],
        CONFIRMED:      ['green',     'Confirmed'],
        NOT_STARTED:    ['gray',      'Not Started'],
        IN_PROGRESS:    ['blue',      'In Progress'],
        COMPLETE:       ['green',     'Complete'],
        PENDING:        ['red',       'Decon Needed'],
        IN_PROG_DEC:    ['orange',    'Decon In Progress'],
        COMPLETE_DEC:   ['teal',      'Decon Complete'],
      };
      const [kind, label] = map[status] || ['gray', status];
      return <Tag kind={kind}>{label}</Tag>;
    };

    // -------------------------------------------------------------------------
    // Sidebar
    // -------------------------------------------------------------------------
    const Sidebar = ({ screen, setScreen }) => (
      <div className="sidebar">
        <div className="sidebar-header">
          🧬 OpenELIS Global
        </div>
        <div className="nav-section">
          <div className="nav-section-title">Worklist</div>
          <a className={`nav-item ${screen === 'worklist' ? 'active' : ''}`} onClick={() => setScreen('worklist')}>
            📋 Vector Identification
          </a>
        </div>
        <div className="nav-section">
          <div className="nav-section-title">Admin — Vector Surveillance</div>
          <a className={`nav-item ${screen === 'panelAdmin' ? 'active' : ''}`} onClick={() => setScreen('panelAdmin')}>
            🧪 Test Panels
          </a>
          <a className="nav-item">🦟 Species Catalog</a>
          <a className="nav-item">🪤 Trap Types</a>
        </div>
        <div className="nav-section">
          <div className="nav-section-title">Results</div>
          <a className="nav-item">📊 Results Entry</a>
          <a className="nav-item">✅ Validation</a>
        </div>
      </div>
    );

    // -------------------------------------------------------------------------
    // Screen 1 — Identification Worklist
    // -------------------------------------------------------------------------
    const WorklistScreen = ({ onSelectLot }) => {
      const [activeTab, setActiveTab] = useState('pending');

      return (
        <div>
          <div style={{ marginBottom: 20 }}>
            <h1 style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>Vector Identification Worklist</h1>
            <p style={{ color: '#525252', fontSize: 14 }}>Received vector lots awaiting species identification and pathogen testing.</p>
          </div>

          <div className="wl-tabs">
            {[
              { key: 'pending',   label: 'Pending ID (4)' },
              { key: 'decon',     label: 'Deconvolution (2)' },
              { key: 'complete',  label: 'Complete (14)' },
            ].map(tab => (
              <div key={tab.key} className={`wl-tab ${activeTab === tab.key ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.key)}>
                {tab.label}
              </div>
            ))}
          </div>

          {activeTab === 'pending' && (
            <div className="data-table-wrap">
              <div style={{ padding: '10px 16px', borderBottom: '1px solid #e0e0e0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <input className="form-input" style={{ width: 280 }} placeholder="🔍  Search lots…" />
              </div>
              <table className="cds--data-table" style={{ width: '100%' }}>
                <thead>
                  <tr>
                    <th>Lot ID</th>
                    <th>Sampling Site</th>
                    <th>Trap Type</th>
                    <th>Collection Date</th>
                    <th>Group</th>
                    <th>Progress</th>
                    <th>ID Status</th>
                    <th>Decon</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {WORKLIST_LOTS.map(lot => (
                    <tr key={lot.id}>
                      <td style={{ fontWeight: 600, fontSize: 13 }}>{lot.id}</td>
                      <td style={{ fontSize: 13 }}>{lot.site}</td>
                      <td style={{ fontSize: 13 }}>{lot.trapType}</td>
                      <td style={{ fontSize: 13 }}>{lot.date}</td>
                      <td><GroupTag group={lot.group} /></td>
                      <td>
                        <div className="progress-bar-wrap">
                          <div className="progress-bar-bg" style={{ width: 80 }}>
                            <div className="progress-bar-fill" style={{ width: `${(lot.done / lot.total) * 100}%` }} />
                          </div>
                          <span style={{ fontSize: 12, color: '#525252' }}>{lot.done}/{lot.total}</span>
                        </div>
                      </td>
                      <td><StatusTag status={lot.done === 0 ? 'NOT_STARTED' : lot.done < lot.total ? 'IN_PROGRESS' : 'COMPLETE'} /></td>
                      <td>
                        {lot.decon === 'PENDING'
                          ? <Tag kind="red">⚠ Decon Needed</Tag>
                          : <span style={{ color: '#8d8d8d', fontSize: 12 }}>—</span>
                        }
                      </td>
                      <td>
                        <button className="btn btn-ghost btn-sm" onClick={() => onSelectLot(lot)}>Open →</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {activeTab === 'decon' && <DeconWorklist />}
          {activeTab === 'complete' && (
            <div className="tile" style={{ color: '#525252', fontSize: 14 }}>14 lots with completed identification — archived view not shown in this preview.</div>
          )}
        </div>
      );
    };

    // -------------------------------------------------------------------------
    // Screen 2 — Lot Identification Detail
    // -------------------------------------------------------------------------
    const LotDetailScreen = ({ lot, onBack }) => {
      const [specimens, setSpecimens] = useState(SPECIMENS);
      const [expandedId, setExpandedId] = useState(null);
      const [selected, setSelected] = useState(new Set());
      const [bulkOpen, setBulkOpen] = useState(false);
      const [deconOpen, setDeconOpen] = useState(false);
      const [savedNotif, setSavedNotif] = useState(null);

      const activeLot = lot || WORKLIST_LOTS[0];
      const hasPositive = !!activeLot.positiveTest;

      const toggleSelect = (id) => {
        setSelected(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      const handleSave = (specimenId, species, method, confidence) => {
        setSpecimens(prev => prev.map(s =>
          s.id === specimenId
            ? { ...s, species, method, confidence, status: confidence === 'Confirmed' ? 'CONFIRMED' : 'PRESUMPTIVE' }
            : s
        ));
        setExpandedId(null);
        setSavedNotif(`Identification saved for Specimen ${specimenId}.`);
        setTimeout(() => setSavedNotif(null), 3000);
      };

      const confirmed   = specimens.filter(s => s.status === 'CONFIRMED').length;
      const presumptive = specimens.filter(s => s.status === 'PRESUMPTIVE').length;
      const total       = specimens.length;

      const speciesCounts = {};
      specimens.forEach(s => {
        if (s.species) speciesCounts[s.species] = (speciesCounts[s.species] || 0) + 1;
      });
      const unidentified = total - confirmed - presumptive;
      if (unidentified > 0) speciesCounts['Not yet identified'] = unidentified;

      return (
        <div>
          {/* Breadcrumb */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14, marginBottom: 16, color: '#525252' }}>
            <span style={{ color: '#0f62fe', cursor: 'pointer' }} onClick={onBack}>Vector Identification</span>
            <span>›</span>
            <span style={{ color: '#161616', fontWeight: 500 }}>{activeLot.id}</span>
          </div>

          {/* Positive pool deconvolution alert */}
          {hasPositive && (
            <div className="notif notif-warning" style={{ marginBottom: 20 }}>
              <div className="notif-icon">⚠️</div>
              <div className="notif-content">
                <div className="notif-title">Deconvolution Needed</div>
                <div className="notif-subtitle">{activeLot.positiveTest} returned <strong>POSITIVE</strong> for this pooled lot. Initiate deconvolution to trace individual infections.</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => setDeconOpen(true)} style={{ whiteSpace: 'nowrap', marginLeft: 12 }}>
                Initiate Deconvolution →
              </button>
            </div>
          )}

          {savedNotif && (
            <div className="notif notif-success" style={{ marginBottom: 16 }}>
              <div className="notif-icon">✅</div>
              <div className="notif-content"><div className="notif-title">{savedNotif}</div></div>
            </div>
          )}

          {/* Lot summary tile */}
          <div className="tile" style={{ marginBottom: 20 }}>
            <div className="grid grid-4">
              {[
                { label: 'Lot ID',        value: activeLot.id },
                { label: 'Sampling Site', value: activeLot.site },
                { label: 'Trap Type',     value: activeLot.trapType },
                { label: 'Collection',    value: activeLot.date },
              ].map(f => (
                <div key={f.label}>
                  <div style={{ fontSize: 11, color: '#6f6f6f', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 4 }}>{f.label}</div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{f.value}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Species distribution */}
          <div className="tile" style={{ marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Species Distribution</h3>
            <div className="grid grid-2" style={{ gap: 24 }}>
              <div>
                {Object.entries(speciesCounts).map(([sp, count]) => (
                  <div key={sp} className="species-bar">
                    <div className="species-bar-label">
                      <span style={{ fontSize: 13 }}>{sp}</span>
                      <span style={{ color: '#6f6f6f' }}>{count}/{total}</span>
                    </div>
                    <div className="species-bar-bg">
                      <div className="species-bar-fill"
                        style={{ width: `${(count/total)*100}%`, background: sp.includes('Not') ? '#c6c6c6' : sp.includes('Culex') ? '#8a3ffc' : '#0f62fe' }}
                      />
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Tag kind="green">{confirmed} Confirmed</Tag>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Tag kind="warm-gray">{presumptive} Presumptive</Tag>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Tag kind="gray">{unidentified} Not Identified</Tag>
                </div>
                <div style={{ marginTop: 8, padding: '8px 12px', background: '#f4f4f4', fontSize: 12, color: '#525252' }}>
                  Overall progress: {confirmed + presumptive}/{total} identified
                </div>
              </div>
            </div>
          </div>

          {/* Batch bar */}
          {selected.size > 0 && (
            <div className="batch-bar">
              <span className="batch-count">{selected.size} specimen{selected.size > 1 ? 's' : ''} selected</span>
              <button className="btn btn-secondary btn-sm" onClick={() => setBulkOpen(true)}>
                🔖 Bulk Apply ID
              </button>
              <button className="btn btn-ghost btn-sm" style={{ color: '#ccc' }} onClick={() => setSelected(new Set())}>
                Cancel
              </button>
            </div>
          )}

          {/* Specimen DataTable */}
          <div className="data-table-wrap">
            <table className="cds--data-table" style={{ width: '100%' }}>
              <thead>
                <tr>
                  <th style={{ width: 40 }}>
                    <input type="checkbox" className="cb"
                      onChange={e => setSelected(e.target.checked ? new Set(specimens.map(s => s.id)) : new Set())}
                    />
                  </th>
                  <th>Specimen</th>
                  <th>ID Status</th>
                  <th>Species</th>
                  <th>Method</th>
                  <th>Confidence</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {specimens.map(sp => (
                  <React.Fragment key={sp.id}>
                    <tr style={{ background: expandedId === sp.id ? '#edf5ff' : 'white' }}>
                      <td>
                        <input type="checkbox" className="cb"
                          checked={selected.has(sp.id)}
                          onChange={() => toggleSelect(sp.id)}
                        />
                      </td>
                      <td style={{ fontWeight: 600, fontSize: 13 }}>{sp.label}</td>
                      <td><StatusTag status={sp.status} /></td>
                      <td style={{ fontSize: 13 }}>{sp.species || <span style={{ color: '#8d8d8d' }}>—</span>}</td>
                      <td style={{ fontSize: 13 }}>{sp.method || <span style={{ color: '#8d8d8d' }}>—</span>}</td>
                      <td style={{ fontSize: 13 }}>{sp.confidence || <span style={{ color: '#8d8d8d' }}>—</span>}</td>
                      <td>
                        <button className="btn btn-ghost btn-sm"
                          onClick={() => setExpandedId(prev => prev === sp.id ? null : sp.id)}>
                          {expandedId === sp.id ? '▲ Close' : '▼ Identify'}
                        </button>
                      </td>
                    </tr>
                    {expandedId === sp.id && (
                      <tr>
                        <td colSpan={7} style={{ padding: 0 }}>
                          <SpecimenIdForm specimen={sp} onSave={handleSave} onCancel={() => setExpandedId(null)} />
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>

          {/* Bulk Apply Modal */}
          {bulkOpen && (
            <BulkApplyModal count={selected.size} onClose={() => setBulkOpen(false)} onApply={() => { setBulkOpen(false); setSelected(new Set()); setSavedNotif(`ID applied to ${selected.size} specimens.`); setTimeout(() => setSavedNotif(null), 3000); }} />
          )}

          {/* Deconvolution Modal */}
          {deconOpen && <DeconModal lotId={activeLot.id} onClose={() => setDeconOpen(false)} />}
        </div>
      );
    };

    // -------------------------------------------------------------------------
    // Specimen ID Form (inline expansion)
    // -------------------------------------------------------------------------
    const SpecimenIdForm = ({ specimen, onSave, onCancel }) => {
      const [species, setSpecies]         = useState(specimen.species || '');
      const [method, setMethod]           = useState(specimen.method || '');
      const [confidence, setConfidence]   = useState(specimen.confidence || '');
      const [showMol, setShowMol]         = useState(false);
      const [molOpen, setMolOpen]         = useState(false);
      const [speciesSearch, setSpeciesSearch] = useState('');
      const [showDropdown, setShowDropdown] = useState(false);

      const filtered = SPECIES_CATALOG.filter(s =>
        s.toLowerCase().includes(speciesSearch.toLowerCase()) && speciesSearch.length > 0
      );

      const handleMethodChange = (e) => {
        const v = e.target.value;
        setMethod(v);
        setShowMol(v === 'Molecular' || v === 'Both');
        if (v === 'Molecular' || v === 'Both') setMolOpen(true);
      };

      return (
        <div className="expanded-row-content">
          <div className="grid grid-3" style={{ marginBottom: 16 }}>
            {/* Species ComboBox */}
            <div className="form-field" style={{ position: 'relative' }}>
              <label className="form-label">Species *</label>
              <input
                className="form-input"
                value={speciesSearch || species}
                placeholder="Search by genus or species…"
                onChange={e => { setSpeciesSearch(e.target.value); setShowDropdown(true); }}
                onFocus={() => setShowDropdown(true)}
                onBlur={() => setTimeout(() => setShowDropdown(false), 200)}
              />
              {showDropdown && filtered.length > 0 && (
                <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: '#fff', border: '1px solid #8d8d8d', zIndex: 100, maxHeight: 180, overflowY: 'auto' }}>
                  {filtered.map(s => (
                    <div key={s} style={{ padding: '8px 12px', fontSize: 13, cursor: 'pointer' }}
                      onMouseDown={() => { setSpecies(s); setSpeciesSearch(s); setShowDropdown(false); }}>
                      {s}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Method */}
            <div className="form-field">
              <label className="form-label">Identification Method *</label>
              <select className="form-select" value={method} onChange={handleMethodChange}>
                <option value="">Select method…</option>
                <option>Morphological</option>
                <option>Molecular</option>
                <option>Both</option>
              </select>
            </div>

            {/* Confidence */}
            <div className="form-field">
              <label className="form-label">Confidence *</label>
              <select className="form-select" value={confidence} onChange={e => setConfidence(e.target.value)}>
                <option value="">Select confidence…</option>
                <option>Confirmed</option>
                <option>Presumptive</option>
              </select>
            </div>
          </div>

          {/* Notes */}
          <div className="form-field">
            <label className="form-label">Notes</label>
            <textarea className="form-textarea" rows={2} placeholder="Optional notes about this identification…" />
          </div>

          {/* Molecular Details Accordion */}
          <div className="accordion" style={{ marginBottom: 16 }}>
            <div className="accordion-item">
              <div className="accordion-header" onClick={() => setMolOpen(p => !p)}>
                <span className="accordion-title">🔬 Molecular Details {showMol ? '' : '(optional)'}</span>
                <span style={{ fontSize: 12, color: '#525252' }}>{molOpen ? '▲' : '▼'}</span>
              </div>
              {molOpen && (
                <div className="accordion-body">
                  <div className="grid grid-3">
                    <div className="form-field">
                      <label className="form-label">Target Gene</label>
                      <input className="form-input" placeholder="e.g. COI, ITS2, 28S rDNA" />
                    </div>
                    <div className="form-field">
                      <label className="form-label">Assay Name</label>
                      <input className="form-input" placeholder="e.g. Multiplex RT-PCR Dengue" />
                    </div>
                    <div className="form-field">
                      <label className="form-label">GenBank Accession</label>
                      <input className="form-input" placeholder="e.g. MW123456" />
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Actions */}
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-primary btn-sm"
              onClick={() => onSave(specimen.id, species || specimen.species, method || specimen.method, confidence || specimen.confidence)}
              disabled={!species && !specimen.species}>
              💾 Save Identification
            </button>
            <button className="btn btn-ghost btn-sm" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------------------
    // Bulk Apply Modal
    // -------------------------------------------------------------------------
    const BulkApplyModal = ({ count, onClose, onApply }) => (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" onClick={e => e.stopPropagation()}>
          <div className="modal-header">
            <span className="modal-title">Bulk Apply Species ID</span>
            <button className="btn-icon" onClick={onClose} style={{ color: '#fff', fontSize: 18 }}>✕</button>
          </div>
          <div className="modal-body">
            <div className="notif notif-info" style={{ marginBottom: 16 }}>
              <div className="notif-content">
                <div className="notif-subtitle">Applying identification to <strong>{count} specimens</strong>. Molecular detail fields (target gene, assay, accession) will not be copied.</div>
              </div>
            </div>
            <div className="form-field">
              <label className="form-label">Species *</label>
              <input className="form-input" placeholder="Search by genus or species name…" defaultValue="Aedes aegypti" />
            </div>
            <div className="grid grid-2" style={{ gap: 16 }}>
              <div className="form-field">
                <label className="form-label">Identification Method *</label>
                <select className="form-select">
                  <option>Morphological</option>
                  <option>Molecular</option>
                  <option>Both</option>
                </select>
              </div>
              <div className="form-field">
                <label className="form-label">Confidence *</label>
                <select className="form-select">
                  <option>Confirmed</option>
                  <option>Presumptive</option>
                </select>
              </div>
            </div>
            <div className="form-field">
              <label className="form-label">Notes (applied to all)</label>
              <textarea className="form-textarea" rows={2} placeholder="Optional…" />
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary btn-sm" onClick={onApply}>Apply to {count} Specimens</button>
          </div>
        </div>
      </div>
    );

    // -------------------------------------------------------------------------
    // Deconvolution Modal
    // -------------------------------------------------------------------------
    const DeconModal = ({ lotId, onClose }) => {
      const [strategy, setStrategy] = useState('INDIVIDUAL');
      const [done, setDone] = useState(false);

      if (done) return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-header" style={{ background: '#0e6027' }}>
              <span className="modal-title">✅ Deconvolution Initiated</span>
              <button className="btn-icon" onClick={onClose} style={{ color: '#fff', fontSize: 18 }}>✕</button>
            </div>
            <div className="modal-body">
              <div className="notif notif-success">
                <div className="notif-icon">✅</div>
                <div className="notif-content">
                  <div className="notif-title">25 child specimens created</div>
                  <div className="notif-subtitle">Re-test order <strong>ORD-2026-0892</strong> generated with Dengue Surveillance Panel. Lot {lotId} status → Deconvolution In Progress.</div>
                </div>
              </div>
              <p style={{ fontSize: 13, color: '#525252', marginTop: 12 }}>Child specimens are labelled BPP-01-LOT-042-D01 through -D25. They will appear in Results Entry for NS1 RT-PCR testing.</p>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary btn-sm" onClick={onClose}>Done</button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <span className="modal-title">Initiate Pool Deconvolution</span>
              <button className="btn-icon" onClick={onClose} style={{ color: '#fff', fontSize: 18 }}>✕</button>
            </div>
            <div className="modal-body">
              <div className="notif notif-warning" style={{ marginBottom: 16 }}>
                <div className="notif-icon">⚠️</div>
                <div className="notif-content">
                  <div className="notif-title">Positive result detected</div>
                  <div className="notif-subtitle"><strong>NS1 RT-PCR</strong> returned POSITIVE for lot {lotId} (25 specimens, BG-Sentinel, Bojongsoang).</div>
                </div>
              </div>

              <div className="form-field">
                <label className="form-label">Deconvolution Strategy</label>
                <div className="radio-group">
                  {[
                    { val: 'INDIVIDUAL', label: 'Individual specimens — test each separately' },
                    { val: 'SUB_POOL',   label: 'Sub-pools — split into smaller pools first' },
                  ].map(opt => (
                    <label key={opt.val} className="radio-item">
                      <input type="radio" name="strategy" value={opt.val}
                        checked={strategy === opt.val} onChange={() => setStrategy(opt.val)} />
                      {opt.label}
                    </label>
                  ))}
                </div>
              </div>

              {strategy === 'INDIVIDUAL' ? (
                <div className="form-field">
                  <label className="form-label">Number of Individual Specimens</label>
                  <input className="form-input" type="number" defaultValue={25} min={2} max={200} style={{ width: 120 }} />
                </div>
              ) : (
                <div className="grid grid-2" style={{ gap: 16 }}>
                  <div className="form-field">
                    <label className="form-label">Number of Sub-pools</label>
                    <input className="form-input" type="number" defaultValue={5} style={{ width: 120 }} />
                  </div>
                  <div className="form-field">
                    <label className="form-label">Specimens per Sub-pool</label>
                    <input className="form-input" type="number" defaultValue={5} style={{ width: 120 }} />
                  </div>
                </div>
              )}

              <div className="form-field">
                <label className="form-label">Test Panel *</label>
                <select className="form-select">
                  {TEST_PANELS.filter(p => p.active).map(p => (
                    <option key={p.id} value={p.id}>{p.name}</option>
                  ))}
                </select>
              </div>

              <div className="form-field">
                <label className="form-label">Notes</label>
                <textarea className="form-textarea" rows={2} placeholder="Optional notes…" />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary btn-sm" onClick={() => setDone(true)}>
                Confirm &amp; Generate Specimens
              </button>
            </div>
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------------------
    // Deconvolution Worklist (tab)
    // -------------------------------------------------------------------------
    const DeconWorklist = () => (
      <div className="data-table-wrap">
        <table className="cds--data-table" style={{ width: '100%' }}>
          <thead>
            <tr>
              <th>Lot ID</th>
              <th>Site</th>
              <th>Positive Test</th>
              <th>Child Specimens</th>
              <th>Results Received</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {DECON_LOTS.map(lot => (
              <tr key={lot.id}>
                <td style={{ fontWeight: 600, fontSize: 13 }}>{lot.id}</td>
                <td style={{ fontSize: 13 }}>{lot.site}</td>
                <td style={{ fontSize: 13 }}>{lot.positiveTest}</td>
                <td style={{ fontSize: 13 }}>{lot.child}</td>
                <td>
                  <div className="progress-bar-wrap">
                    <div className="progress-bar-bg" style={{ width: 80 }}>
                      <div className="progress-bar-fill" style={{ width: `${(lot.done/lot.child)*100}%`, background: lot.status === 'COMPLETE' ? '#24a148' : '#0f62fe' }} />
                    </div>
                    <span style={{ fontSize: 12, color: '#525252' }}>{lot.done}/{lot.child}</span>
                  </div>
                </td>
                <td>
                  {lot.status === 'COMPLETE'
                    ? <span><Tag kind="teal">Decon Complete</Tag> <span style={{ fontSize: 12, color: '#525252' }}>{lot.positive}/20 positive</span></span>
                    : <Tag kind="blue">In Progress</Tag>
                  }
                </td>
                <td><button className="btn btn-ghost btn-sm">View</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );

    // -------------------------------------------------------------------------
    // Screen 3 — Panel Admin
    // -------------------------------------------------------------------------
    const PanelAdminScreen = () => {
      const [panels, setPanels] = useState(TEST_PANELS);
      const [expandedId, setExpandedId] = useState(null);
      const [addingNew, setAddingNew] = useState(false);
      const [saved, setSaved] = useState(null);

      const handleSave = (id) => {
        setExpandedId(null);
        setAddingNew(false);
        setSaved('Test panel saved.');
        setTimeout(() => setSaved(null), 3000);
      };

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
            <div>
              <h1 style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>Vector Test Panels</h1>
              <p style={{ color: '#525252', fontSize: 14 }}>Configure pathogen screening panels for use at order entry.</p>
            </div>
            <button className="btn btn-primary" onClick={() => { setAddingNew(true); setExpandedId(null); }}>
              + Add Panel
            </button>
          </div>

          {saved && (
            <div className="notif notif-success" style={{ marginBottom: 16 }}>
              <div className="notif-icon">✅</div>
              <div className="notif-content"><div className="notif-title">{saved}</div></div>
            </div>
          )}

          {/* Add new panel inline form */}
          {addingNew && (
            <div className="tile" style={{ marginBottom: 16, borderLeft: '4px solid #0f62fe' }}>
              <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 16 }}>New Panel</h3>
              <PanelForm onSave={() => handleSave(null)} onCancel={() => setAddingNew(false)} />
            </div>
          )}

          <div className="data-table-wrap">
            <div style={{ padding: '10px 16px', borderBottom: '1px solid #e0e0e0', display: 'flex', gap: 12, alignItems: 'center' }}>
              <input className="form-input" style={{ width: 240 }} placeholder="🔍  Search panels…" />
              <select className="form-select" style={{ width: 160 }}>
                <option>All groups</option>
                <option>Mosquito</option>
                <option>Tick</option>
              </select>
            </div>
            <table className="cds--data-table" style={{ width: '100%' }}>
              <thead>
                <tr>
                  <th>Panel Name</th>
                  <th>Organism Group</th>
                  <th>Tests Included</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {panels.map(panel => (
                  <React.Fragment key={panel.id}>
                    <tr style={{ background: expandedId === panel.id ? '#edf5ff' : 'white' }}>
                      <td style={{ fontWeight: 600, fontSize: 13 }}>{panel.name}</td>
                      <td><GroupTag group={panel.group} /></td>
                      <td style={{ fontSize: 13, color: '#525252' }}>{panel.tests}</td>
                      <td>
                        {panel.active
                          ? <Tag kind="green">Active</Tag>
                          : <Tag kind="gray">Inactive</Tag>
                        }
                      </td>
                      <td>
                        <button className="btn btn-ghost btn-sm"
                          onClick={() => setExpandedId(prev => prev === panel.id ? null : panel.id)}>
                          {expandedId === panel.id ? '▲ Close' : '▼ Edit'}
                        </button>
                      </td>
                    </tr>
                    {expandedId === panel.id && (
                      <tr>
                        <td colSpan={5} style={{ padding: 0 }}>
                          <div className="expanded-row-content">
                            <PanelForm panel={panel} onSave={() => handleSave(panel.id)} onCancel={() => setExpandedId(null)} />
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    const PanelForm = ({ panel, onSave, onCancel }) => (
      <div>
        <div className="grid grid-3" style={{ marginBottom: 16 }}>
          <div className="form-field">
            <label className="form-label">Panel Name *</label>
            <input className="form-input" defaultValue={panel?.name || ''} placeholder="e.g. Dengue Surveillance Panel" />
          </div>
          <div className="form-field">
            <label className="form-label">Organism Group Filter</label>
            <select className="form-select" defaultValue={panel?.group || ''}>
              <option value="">Any group</option>
              <option value="MOSQUITO">Mosquito</option>
              <option value="TICK">Tick</option>
              <option value="RODENT">Rodent</option>
            </select>
          </div>
          <div className="form-field">
            <label className="form-label">Status</label>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 8 }}>
              <span style={{ fontSize: 13 }}>Inactive</span>
              <div style={{ position: 'relative', width: 40, height: 20 }}>
                <div style={{ background: panel?.active !== false ? '#0f62fe' : '#e0e0e0', borderRadius: 10, height: 20, width: 40 }} />
                <div style={{ position: 'absolute', top: 2, left: panel?.active !== false ? 22 : 2, width: 16, height: 16, background: '#fff', borderRadius: '50%', transition: 'left 0.2s' }} />
              </div>
              <span style={{ fontSize: 13 }}>Active</span>
            </div>
          </div>
        </div>

        <div className="form-field">
          <label className="form-label">Description</label>
          <textarea className="form-textarea" rows={2} placeholder="Optional description…" />
        </div>

        <div className="form-field">
          <label className="form-label">Tests Included</label>
          <div style={{ background: '#f4f4f4', border: '1px solid #e0e0e0', padding: 12, marginBottom: 8 }}>
            {(panel?.tests || '').split(', ').filter(Boolean).map((test, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0', borderBottom: '1px solid #e0e0e0', fontSize: 13 }}>
                <span>🧪 {test}</span>
                <button className="btn btn-ghost btn-sm" style={{ color: '#da1e28', fontSize: 12 }}>Remove</button>
              </div>
            ))}
            {(!panel?.tests) && <p style={{ fontSize: 13, color: '#8d8d8d' }}>No tests added yet.</p>}
          </div>
          <button className="btn btn-ghost btn-sm">+ Add Test from Catalog</button>
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
          <button className="btn btn-primary btn-sm" onClick={onSave}>💾 Save Panel</button>
          {panel && <button className="btn btn-danger-ghost btn-sm">🗑 Deactivate</button>}
          <button className="btn btn-ghost btn-sm" onClick={onCancel}>Cancel</button>
        </div>
      </div>
    );

    // -------------------------------------------------------------------------
    // Root App
    // -------------------------------------------------------------------------
    const App = () => {
      const [screen, setScreen]     = useState('worklist');
      const [selectedLot, setSelectedLot] = useState(null);

      const handleSelectLot = (lot) => {
        setSelectedLot(lot);
        setScreen('lotDetail');
      };

      return (
        <div>
          <div className="app-shell">
            <Sidebar screen={screen} setScreen={(s) => { setScreen(s); }} />
            <div className="main-content">
              {/* Screen tabs */}
              <div className="screen-tabs">
                {[
                  { key: 'worklist',   label: '📋 ID Worklist' },
                  { key: 'lotDetail',  label: '🔬 Lot Detail (BPP-01-LOT-042)' },
                  { key: 'panelAdmin', label: '🧪 Panel Admin' },
                ].map(tab => (
                  <div key={tab.key}
                    className={`screen-tab ${screen === tab.key ? 'active' : ''}`}
                    onClick={() => setScreen(tab.key)}>
                    {tab.label}
                  </div>
                ))}
              </div>

              {screen === 'worklist'   && <WorklistScreen onSelectLot={handleSelectLot} />}
              {screen === 'lotDetail'  && <LotDetailScreen lot={selectedLot || WORKLIST_LOTS[0]} onBack={() => setScreen('worklist')} />}
              {screen === 'panelAdmin' && <PanelAdminScreen />}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
