<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-01 Vector Specimen Types & Taxonomy — OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .oe-header { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 1rem; border-bottom: 1px solid #393939; position: sticky; top: 0; z-index: 10; }
    .oe-header-title { font-size: 14px; font-weight: 600; }
    .oe-header-sep { width: 1px; height: 24px; background: #393939; margin: 0 1rem; }
    .oe-header-context { font-size: 14px; color: #c6c6c6; }
    .oe-header-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; font-size: 12px; color: #c6c6c6; }
    .oe-user-chip { display: flex; align-items: center; gap: 8px; }
    .oe-avatar { width: 28px; height: 28px; border-radius: 50%; background: #0f62fe; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; }
    .oe-layout { display: flex; min-height: calc(100vh - 48px - 28px); }
    .oe-sidenav { width: 256px; background: #262626; color: #f4f4f4; flex-shrink: 0; padding: 0; border-right: 1px solid #393939; }
    .oe-sidenav-header { font-size: 11px; letter-spacing: 0.4px; color: #8d8d8d; padding: 12px 1rem 8px; text-transform: uppercase; }
    .oe-sidenav-item { display: flex; align-items: center; gap: 12px; padding: 10px 1rem; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; color: #f4f4f4; }
    .oe-sidenav-item:hover { background: #353535; }
    .oe-sidenav-item.active { background: #393939; border-left-color: #0f62fe; color: #fff; font-weight: 600; }
    .oe-sidenav-item .chev { margin-left: auto; font-size: 11px; }
    .oe-sidenav-submenu { background: #1e1e1e; }
    .oe-sidenav-submenu .oe-sidenav-item { padding-left: 3.25rem; font-size: 13px; color: #c6c6c6; }
    .oe-sidenav-submenu .oe-sidenav-item.active { background: #393939; color: #fff; border-left-color: #0f62fe; }
    .oe-main { flex: 1; background: #f4f4f4; padding: 1.5rem 2rem; overflow-x: auto; }
    .oe-breadcrumb { font-size: 12px; color: #525252; margin-bottom: 8px; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-page-title { font-size: 24px; font-weight: 400; color: #161616; margin: 0 0 4px; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin-bottom: 1.25rem; max-width: 900px; }
    .oe-toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; background: #fff; padding: 0.75rem 1rem; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
    .oe-toolbar-search { flex: 1; max-width: 320px; display: flex; align-items: center; background: #f4f4f4; padding: 0 12px; border-bottom: 1px solid #8d8d8d; }
    .oe-toolbar-search input { border: 0; background: transparent; padding: 8px 0; flex: 1; font-size: 14px; outline: none; }
    .oe-filter-chip { padding: 4px 10px; font-size: 12px; border: 1px solid #c6c6c6; border-radius: 12px; background: #fff; cursor: pointer; }
    .oe-filter-chip.active { background: #0f62fe; color: #fff; border-color: #0f62fe; }
    .oe-table-wrap { background: #fff; border: 1px solid #e0e0e0; }
    table.oe-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.oe-table thead th { background: #e0e0e0; text-align: left; padding: 10px 1rem; font-size: 12px; font-weight: 600; letter-spacing: 0.16px; color: #161616; border-bottom: 1px solid #c6c6c6; }
    table.oe-table tbody td { padding: 12px 1rem; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    table.oe-table tbody tr:hover { background: #f4f4f4; }
    table.oe-table tbody tr.expanded { background: #edf5ff; }
    .oe-row-expand { background: #f4f4f4; padding: 1rem 1.5rem; }
    .cds--tag { margin: 0 4px 0 0; }
    .oe-accordion-panel { background: #fff; border: 1px solid #e0e0e0; margin-top: 1rem; }
    .oe-accordion-header { padding: 12px 1rem; cursor: pointer; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #161616; background: #f4f4f4; border-bottom: 1px solid #e0e0e0; }
    .oe-accordion-header .chev { margin-left: auto; transition: transform 0.2s; }
    .oe-accordion-header.open .chev { transform: rotate(180deg); }
    .oe-accordion-body { padding: 1rem 1.5rem; background: #fff; }
    .oe-field { margin-bottom: 1rem; }
    .oe-field label { display: block; font-size: 12px; color: #525252; margin-bottom: 4px; }
    .oe-field input, .oe-field select, .oe-field textarea { width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid #8d8d8d; background: #f4f4f4; font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .oe-field input:focus, .oe-field select:focus, .oe-field textarea:focus { outline: 2px solid #0f62fe; outline-offset: -2px; }
    .oe-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .oe-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .oe-help { font-size: 11px; color: #525252; margin-top: 4px; }
    .oe-banner { background: #fff; border-left: 3px solid #0f62fe; padding: 12px 1rem; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; }
    .oe-banner-icon { font-size: 16px; color: #0f62fe; }
    .oe-banner-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .oe-banner-body { font-size: 13px; color: #393939; }
    .oe-callout { background: #edf5ff; border: 1px solid #a6c8ff; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .oe-callout strong { color: #002d9c; }
    .preview-footer { background: #161616; color: #8d8d8d; padding: 4px 1rem; font-size: 11px; font-family: monospace; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — V-01 Vector Specimen Types & Taxonomy &nbsp;|&nbsp; OpenELIS Design Mockup &nbsp;|&nbsp; Option A: Integrated with Sample Type Management
  </div>
  <div id="root"></div>
  <div class="preview-footer">OpenELIS Global · v3.x design preview · Not a live application</div>

  <script type="text/babel">
    const { useState } = React;

    const SPECIES = [
      { id: 'sp1', genus: 'Aedes', species: 'aegypti', subspecies: null, group: 'MOSQUITO', pathogens: ['Dengue', 'Zika', 'Chikungunya'], stages: ['ADULT', 'LARVA', 'PUPA', 'EGG'], active: true },
      { id: 'sp2', genus: 'Aedes', species: 'albopictus', subspecies: null, group: 'MOSQUITO', pathogens: ['Dengue', 'Chikungunya'], stages: ['ADULT', 'LARVA'], active: true },
      { id: 'sp3', genus: 'Anopheles', species: 'sundaicus', subspecies: null, group: 'MOSQUITO', pathogens: ['Plasmodium falciparum', 'Plasmodium vivax'], stages: ['ADULT', 'LARVA'], active: true },
      { id: 'sp4', genus: 'Anopheles', species: 'maculatus', subspecies: null, group: 'MOSQUITO', pathogens: ['Plasmodium vivax'], stages: ['ADULT'], active: true },
      { id: 'sp5', genus: 'Culex', species: 'quinquefasciatus', subspecies: null, group: 'MOSQUITO', pathogens: ['Wuchereria bancrofti', 'JE virus'], stages: ['ADULT', 'LARVA'], active: true },
      { id: 'sp6', genus: 'Rhipicephalus', species: 'sanguineus', subspecies: null, group: 'TICK', pathogens: ['Ehrlichia canis', 'Babesia'], stages: ['ADULT', 'NYMPH', 'LARVA'], active: true },
      { id: 'sp7', genus: 'Haemaphysalis', species: 'bispinosa', subspecies: null, group: 'TICK', pathogens: ['Anaplasma'], stages: ['ADULT', 'NYMPH'], active: true },
      { id: 'sp8', genus: 'Rattus', species: 'rattus', subspecies: 'diardii', group: 'RODENT', pathogens: ['Leptospira', 'Rickettsia'], stages: ['ADULT'], active: true },
      { id: 'sp9', genus: 'Rattus', species: 'norvegicus', subspecies: null, group: 'RODENT', pathogens: ['Leptospira', 'Hantavirus'], stages: ['ADULT'], active: true },
      { id: 'sp10', genus: 'Bandicota', species: 'indica', subspecies: null, group: 'RODENT', pathogens: ['Leptospira'], stages: ['ADULT'], active: true },
    ];

    const TRAPS = [
      { id: 't1', name: 'BG-Sentinel Trap', target: 'MOSQUITO', description: 'CO\u2082-baited adult mosquito trap with electric fan; widely used for Aedes surveillance', active: true },
      { id: 't2', name: 'CDC Light Trap', target: 'MOSQUITO', description: 'UV-light trap for nocturnal mosquitoes, especially Culex and Anopheles', active: true },
      { id: 't3', name: 'Ovitrap', target: 'MOSQUITO', description: 'Oviposition trap with wooden paddle for Aedes egg collection in households', active: true },
      { id: 't4', name: 'Human Landing Catch', target: 'MOSQUITO', description: 'Manual collection on human bait; requires ethical approval; gold standard for EIR', active: true },
      { id: 't5', name: 'Drag Cloth', target: 'TICK', description: 'White flannel cloth dragged through vegetation to collect questing ticks', active: true },
      { id: 't6', name: 'CO\u2082 Tick Trap', target: 'TICK', description: 'Dry-ice baited trap for attracting host-seeking ticks', active: true },
      { id: 't7', name: 'Sherman Live Trap', target: 'RODENT', description: 'Folding aluminum live trap for small rodents; standard for urban Rattus surveillance', active: true },
      { id: 't8', name: 'Snap Trap', target: 'RODENT', description: 'Kill trap; used where ethics permit; simpler logistics than live traps', active: true },
    ];

    const SAMPLE_TYPES = [
      { id: 'st1', name: 'Serum', domain: 'CLINICAL', desc: 'Venous blood serum' },
      { id: 'st2', name: 'Surface Water', domain: 'ENVIRONMENTAL', desc: 'Surface water for potability or pollution testing' },
      { id: 'st3', name: 'Drinking Water', domain: 'BOTH', desc: 'Finished drinking water, POE/POU sampling' },
      { id: 'st4', name: 'Mosquito Pool \u2014 Aedes', domain: 'VECTOR', desc: 'Pool of up to 50 adult Aedes mosquitoes for arbovirus screening', vectorProfile: { strategy: 'POOL_FIXED', defaultPoolSize: 50, preservation: 'RNAlater', groups: ['MOSQUITO'], stages: ['ADULT'] } },
      { id: 'st5', name: 'Mosquito Pool \u2014 Anopheles', domain: 'VECTOR', desc: 'Variable pool for malaria vector identification', vectorProfile: { strategy: 'POOL_VARIABLE', defaultPoolSize: null, preservation: 'Silica gel', groups: ['MOSQUITO'], stages: ['ADULT'] } },
      { id: 'st6', name: 'Individual Rodent Tissue', domain: 'VECTOR', desc: 'Single rodent kidney/spleen for Leptospira testing', vectorProfile: { strategy: 'INDIVIDUAL', defaultPoolSize: null, preservation: 'Frozen (-80\u00b0C)', groups: ['RODENT'], stages: ['ADULT'] } },
      { id: 'st7', name: 'Tick Pool', domain: 'VECTOR', desc: 'Pool of ticks by species/stage', vectorProfile: { strategy: 'POOL_FIXED', defaultPoolSize: 25, preservation: '70% Ethanol', groups: ['TICK'], stages: ['ADULT', 'NYMPH'] } },
    ];

    const GROUP_COLORS = { MOSQUITO: 'green', TICK: 'blue', RODENT: 'purple', OTHER_ARTHROPOD: 'warm-gray', OTHER_ANIMAL: 'gray' };

    const STRATEGY_LABEL = {
      INDIVIDUAL: 'Individual (1 organism per sample)',
      POOL_FIXED: 'Pool \u2014 fixed size',
      POOL_VARIABLE: 'Pool \u2014 variable size',
    };

    function Header({ page }) {
      const crumbs = { species: 'Admin \u203a Vector Surveillance \u203a Species', traps: 'Admin \u203a Vector Surveillance \u203a Trap Types', sampleTypes: 'Admin \u203a Sample Types' };
      return (
        <div className="oe-header">
          <div className="oe-header-title">OpenELIS Global</div>
          <div className="oe-header-sep"></div>
          <div className="oe-header-context">{crumbs[page]}</div>
          <div className="oe-header-right">
            <span>EN / ID</span>
            <div className="oe-user-chip">
              <div className="oe-avatar">CI</div>
              <span>Casey I. \u00b7 Lab Admin</span>
            </div>
          </div>
        </div>
      );
    }

    function SideNav({ page, setPage }) {
      const [vectorOpen, setVectorOpen] = useState(true);
      return (
        <div className="oe-sidenav">
          <div className="oe-sidenav-header">Workflow</div>
          <div className="oe-sidenav-item">Dashboard</div>
          <div className="oe-sidenav-item">Order Entry</div>
          <div className="oe-sidenav-item">Results</div>
          <div className="oe-sidenav-item">Validation</div>
          <div className="oe-sidenav-item">Reports</div>

          <div className="oe-sidenav-header" style={{marginTop: '8px'}}>Admin</div>
          <div className={'oe-sidenav-item' + (page === 'sampleTypes' ? ' active' : '')} onClick={() => setPage('sampleTypes')}>Sample Types</div>
          <div className="oe-sidenav-item">Test Catalog</div>
          <div className="oe-sidenav-item">Compliance Standards</div>
          <div className="oe-sidenav-item">Sampling Sites</div>
          <div className="oe-sidenav-item">Analyzers</div>

          <div className="oe-sidenav-item" onClick={() => setVectorOpen(!vectorOpen)} style={{fontWeight: 600}}>
            Vector Surveillance
            <span className="chev">{vectorOpen ? '\u25be' : '\u25b8'}</span>
          </div>
          {vectorOpen && (
            <div className="oe-sidenav-submenu">
              <div className={'oe-sidenav-item' + (page === 'species' ? ' active' : '')} onClick={() => setPage('species')}>Species</div>
              <div className={'oe-sidenav-item' + (page === 'traps' ? ' active' : '')} onClick={() => setPage('traps')}>Trap Types</div>
            </div>
          )}

          <div className="oe-sidenav-item">Users &amp; Permissions</div>
          <div className="oe-sidenav-item">System Configuration</div>
        </div>
      );
    }

    function SpeciesPage() {
      const [expanded, setExpanded] = useState(null);
      const [groupFilter, setGroupFilter] = useState('ALL');
      const filtered = groupFilter === 'ALL' ? SPECIES : SPECIES.filter(s => s.group === groupFilter);
      return (
        <>
          <div className="oe-breadcrumb"><a href="#">Admin</a> \u203a <a href="#">Vector Surveillance</a> \u203a Species</div>
          <h1 className="oe-page-title">Species</h1>
          <div className="oe-page-subtitle">
            Manage the taxonomy of mosquitoes, ticks, rodents, and other vector organisms. Species defined here are selectable during vector specimen collection (V-02) and identification (V-03).
          </div>

          <div className="oe-callout">
            <strong>Seed data available.</strong> OpenELIS ships with ~40 pre-loaded species relevant to Indonesia (18 mosquitoes, 10 ticks, 7 rodents, 5 other). The seed import is idempotent.
            <button className="cds--btn cds--btn--ghost cds--btn--sm" style={{marginLeft: '8px'}}>Reload seed</button>
          </div>

          <div className="oe-toolbar">
            <div className="oe-toolbar-search"><span>\ud83d\udd0d</span><input placeholder="Search by genus, species, or pathogen..." /></div>
            {['ALL', 'MOSQUITO', 'TICK', 'RODENT', 'OTHER_ARTHROPOD', 'OTHER_ANIMAL'].map(g => (
              <span key={g} className={'oe-filter-chip' + (groupFilter === g ? ' active' : '')} onClick={() => setGroupFilter(g)}>
                {g === 'ALL' ? 'All groups' : g.replace('_', ' ')}
              </span>
            ))}
            <button className="cds--btn cds--btn--primary cds--btn--sm" style={{marginLeft: 'auto'}}>+ Add species</button>
          </div>

          <div className="oe-table-wrap">
            <table className="oe-table">
              <thead>
                <tr>
                  <th style={{width: '40px'}}></th>
                  <th>Genus</th><th>Species</th><th>Subspecies</th><th>Group</th><th>Pathogens of interest</th><th>Status</th><th style={{width: '80px'}}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(s => (
                  <React.Fragment key={s.id}>
                    <tr className={expanded === s.id ? 'expanded' : ''} onClick={() => setExpanded(expanded === s.id ? null : s.id)} style={{cursor: 'pointer'}}>
                      <td>{expanded === s.id ? '\u25be' : '\u25b8'}</td>
                      <td><em>{s.genus}</em></td>
                      <td><em>{s.species}</em></td>
                      <td>{s.subspecies ? <em>ssp. {s.subspecies}</em> : <span style={{color:'#8d8d8d'}}>\u2014</span>}</td>
                      <td><span className={'cds--tag cds--tag--' + GROUP_COLORS[s.group]}>{s.group}</span></td>
                      <td>{s.pathogens.slice(0, 2).join(', ')}{s.pathogens.length > 2 ? ` +${s.pathogens.length - 2}` : ''}</td>
                      <td>{s.active ? <span className="cds--tag cds--tag--green">Active</span> : <span className="cds--tag cds--tag--gray">Inactive</span>}</td>
                      <td><button className="cds--btn cds--btn--ghost cds--btn--sm">Edit</button></td>
                    </tr>
                    {expanded === s.id && (
                      <tr>
                        <td colSpan="8" className="oe-row-expand">
                          <div className="oe-grid-3">
                            <div className="oe-field"><label>Genus*</label><input defaultValue={s.genus} /></div>
                            <div className="oe-field"><label>Species*</label><input defaultValue={s.species} /></div>
                            <div className="oe-field"><label>Subspecies (optional)</label><input defaultValue={s.subspecies || ''} placeholder="e.g., diardii" /></div>
                          </div>
                          <div className="oe-grid-2">
                            <div className="oe-field">
                              <label>Organism group*</label>
                              <select defaultValue={s.group}>
                                <option>MOSQUITO</option><option>TICK</option><option>RODENT</option><option>OTHER_ARTHROPOD</option><option>OTHER_ANIMAL</option>
                              </select>
                            </div>
                            <div className="oe-field">
                              <label>Status</label>
                              <select defaultValue={s.active ? 'active' : 'inactive'}>
                                <option value="active">Active</option><option value="inactive">Inactive</option>
                              </select>
                            </div>
                          </div>

                          <div className="oe-accordion-panel">
                            <div className="oe-accordion-header open">Advanced: pathogens &amp; lifecycle stages<span className="chev">\u25be</span></div>
                            <div className="oe-accordion-body">
                              <div className="oe-field">
                                <label>Pathogens of interest</label>
                                <input defaultValue={s.pathogens.join(', ')} />
                                <div className="oe-help">Comma-separated. Selectable during vector testing (V-03).</div>
                              </div>
                              <div className="oe-field">
                                <label>Lifecycle stages collected</label>
                                <input defaultValue={s.stages.join(', ')} />
                                <div className="oe-help">e.g., ADULT, LARVA, PUPA, EGG, NYMPH</div>
                              </div>
                            </div>
                          </div>

                          <div style={{marginTop: '1rem', display: 'flex', gap: '8px'}}>
                            <button className="cds--btn cds--btn--primary cds--btn--sm">Save</button>
                            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setExpanded(null)}>Cancel</button>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </>
      );
    }

    function TrapTypesPage() {
      const [expanded, setExpanded] = useState(null);
      return (
        <>
          <div className="oe-breadcrumb"><a href="#">Admin</a> \u203a <a href="#">Vector Surveillance</a> \u203a Trap Types</div>
          <h1 className="oe-page-title">Trap Types</h1>
          <div className="oe-page-subtitle">Collection methods and devices used to capture vectors. Selectable when recording a Collection Lot (V-02).</div>

          <div className="oe-toolbar">
            <div className="oe-toolbar-search"><span>\ud83d\udd0d</span><input placeholder="Search trap name or description..." /></div>
            <button className="cds--btn cds--btn--primary cds--btn--sm" style={{marginLeft: 'auto'}}>+ Add trap type</button>
          </div>

          <div className="oe-table-wrap">
            <table className="oe-table">
              <thead>
                <tr>
                  <th style={{width: '40px'}}></th><th>Trap name</th><th>Target organism group</th><th>Description</th><th>Status</th><th style={{width: '80px'}}></th>
                </tr>
              </thead>
              <tbody>
                {TRAPS.map(t => (
                  <React.Fragment key={t.id}>
                    <tr className={expanded === t.id ? 'expanded' : ''} onClick={() => setExpanded(expanded === t.id ? null : t.id)} style={{cursor: 'pointer'}}>
                      <td>{expanded === t.id ? '\u25be' : '\u25b8'}</td>
                      <td style={{fontWeight: 600}}>{t.name}</td>
                      <td><span className={'cds--tag cds--tag--' + GROUP_COLORS[t.target]}>{t.target}</span></td>
                      <td style={{color: '#525252'}}>{t.description}</td>
                      <td><span className="cds--tag cds--tag--green">Active</span></td>
                      <td><button className="cds--btn cds--btn--ghost cds--btn--sm">Edit</button></td>
                    </tr>
                    {expanded === t.id && (
                      <tr>
                        <td colSpan="6" className="oe-row-expand">
                          <div className="oe-grid-2">
                            <div className="oe-field"><label>Trap name*</label><input defaultValue={t.name} /></div>
                            <div className="oe-field">
                              <label>Target organism group*</label>
                              <select defaultValue={t.target}>
                                <option>MOSQUITO</option><option>TICK</option><option>RODENT</option><option>OTHER_ARTHROPOD</option><option>OTHER_ANIMAL</option>
                              </select>
                            </div>
                          </div>
                          <div className="oe-field"><label>Description</label><textarea rows="3" defaultValue={t.description}></textarea></div>
                          <div style={{marginTop: '1rem', display: 'flex', gap: '8px'}}>
                            <button className="cds--btn cds--btn--primary cds--btn--sm">Save</button>
                            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setExpanded(null)}>Cancel</button>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </>
      );
    }

    function SampleTypesPage() {
      const [expanded, setExpanded] = useState('st4');
      const [domainFilter, setDomainFilter] = useState('ALL');
      const [vectorAccOpen, setVectorAccOpen] = useState(true);
      const filtered = domainFilter === 'ALL' ? SAMPLE_TYPES : SAMPLE_TYPES.filter(s => s.domain === domainFilter);
      const domainTag = (d) => {
        const kinds = { CLINICAL: 'blue', ENVIRONMENTAL: 'teal', BOTH: 'purple', VECTOR: 'green' };
        return <span className={'cds--tag cds--tag--' + kinds[d]}>{d}</span>;
      };
      return (
        <>
          <div className="oe-breadcrumb"><a href="#">Admin</a> \u203a Sample Types</div>
          <h1 className="oe-page-title">Sample Types</h1>
          <div className="oe-page-subtitle">Manage all sample types. Vector sample types (with pooling configuration) are edited here via the <strong>Vector Profile</strong> section that appears when domain = Vector.</div>

          <div className="oe-banner">
            <span className="oe-banner-icon">\u2139</span>
            <div>
              <div className="oe-banner-title">How V-01 integrates with Sample Type Management</div>
              <div className="oe-banner-body">
                V-01 extends the existing <em>Sample Type</em> entity by adding <code>VECTOR</code> to the <code>sampleDomain</code> enum introduced in S-04. When a sample type's domain is set to <strong>Vector</strong>, a <strong>Vector Profile</strong> accordion appears below Basic Info holding pooling strategy, preservation method, and allowed organism groups. This preserves a single source of truth and reuses the existing admin surface. Species and Trap Types remain separate admin pages because they are independent reference tables, not per\u2013sample-type configuration.
              </div>
            </div>
          </div>

          <div className="oe-toolbar">
            <div className="oe-toolbar-search"><span>\ud83d\udd0d</span><input placeholder="Search sample type name..." /></div>
            {['ALL', 'CLINICAL', 'ENVIRONMENTAL', 'VECTOR'].map(d => (
              <span key={d} className={'oe-filter-chip' + (domainFilter === d ? ' active' : '')} onClick={() => setDomainFilter(d)}>
                {d === 'ALL' ? 'All domains' : d}
              </span>
            ))}
            <button className="cds--btn cds--btn--primary cds--btn--sm" style={{marginLeft: 'auto'}}>+ Add sample type</button>
          </div>

          <div className="oe-table-wrap">
            <table className="oe-table">
              <thead>
                <tr>
                  <th style={{width: '40px'}}></th><th>Sample type</th><th>Domain</th><th>Description</th><th style={{width: '80px'}}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(s => (
                  <React.Fragment key={s.id}>
                    <tr className={expanded === s.id ? 'expanded' : ''} onClick={() => setExpanded(expanded === s.id ? null : s.id)} style={{cursor: 'pointer'}}>
                      <td>{expanded === s.id ? '\u25be' : '\u25b8'}</td>
                      <td style={{fontWeight: 600}}>{s.name}</td>
                      <td>{domainTag(s.domain)}</td>
                      <td style={{color:'#525252'}}>{s.desc}</td>
                      <td><button className="cds--btn cds--btn--ghost cds--btn--sm">Edit</button></td>
                    </tr>
                    {expanded === s.id && (
                      <tr>
                        <td colSpan="5" className="oe-row-expand">
                          <div className="oe-accordion-panel">
                            <div className="oe-accordion-header open">Basic Info<span className="chev">\u25be</span></div>
                            <div className="oe-accordion-body">
                              <div className="oe-grid-2">
                                <div className="oe-field"><label>Sample type name*</label><input defaultValue={s.name} /></div>
                                <div className="oe-field">
                                  <label>Domain* <span style={{color:'#0f62fe', fontSize:'11px'}}>(added by S-04)</span></label>
                                  <select defaultValue={s.domain}>
                                    <option>CLINICAL</option><option>ENVIRONMENTAL</option><option>BOTH</option><option>VECTOR</option>
                                  </select>
                                  <div className="oe-help">Selecting <strong>VECTOR</strong> reveals the Vector Profile section below.</div>
                                </div>
                              </div>
                              <div className="oe-field"><label>Description</label><textarea rows="2" defaultValue={s.desc}></textarea></div>
                            </div>
                          </div>

                          {s.domain === 'VECTOR' && s.vectorProfile && (
                            <div className="oe-accordion-panel" style={{borderColor:'#0f62fe', borderLeft:'3px solid #0f62fe'}}>
                              <div className={'oe-accordion-header' + (vectorAccOpen ? ' open' : '')} onClick={() => setVectorAccOpen(!vectorAccOpen)}>
                                \ud83e\udd9f Vector Profile <span style={{marginLeft:'8px', fontSize:'11px', color:'#0f62fe', fontWeight: 400}}>Added by V-01 \u00b7 appears only when domain = VECTOR</span>
                                <span className="chev">\u25be</span>
                              </div>
                              {vectorAccOpen && (
                                <div className="oe-accordion-body">
                                  <div className="oe-grid-2">
                                    <div className="oe-field">
                                      <label>Pooling strategy*</label>
                                      <select defaultValue={s.vectorProfile.strategy}>
                                        <option value="INDIVIDUAL">{STRATEGY_LABEL.INDIVIDUAL}</option>
                                        <option value="POOL_FIXED">{STRATEGY_LABEL.POOL_FIXED}</option>
                                        <option value="POOL_VARIABLE">{STRATEGY_LABEL.POOL_VARIABLE}</option>
                                      </select>
                                    </div>
                                    {s.vectorProfile.strategy === 'POOL_FIXED' && (
                                      <div className="oe-field">
                                        <label>Default pool size*</label>
                                        <input type="number" defaultValue={s.vectorProfile.defaultPoolSize} />
                                        <div className="oe-help">Prefilled as pool size when creating a Collection Lot.</div>
                                      </div>
                                    )}
                                  </div>
                                  <div className="oe-grid-2">
                                    <div className="oe-field">
                                      <label>Preservation method*</label>
                                      <input defaultValue={s.vectorProfile.preservation} placeholder="e.g., RNAlater, 70% Ethanol, Frozen (-80\u00b0C)" />
                                    </div>
                                    <div className="oe-field">
                                      <label>Allowed organism groups*</label>
                                      <input defaultValue={s.vectorProfile.groups.join(', ')} />
                                      <div className="oe-help">Multi-select: MOSQUITO, TICK, RODENT, OTHER_ARTHROPOD, OTHER_ANIMAL.</div>
                                    </div>
                                  </div>
                                  <div className="oe-field">
                                    <label>Allowed lifecycle stages</label>
                                    <input defaultValue={s.vectorProfile.stages.join(', ')} />
                                    <div className="oe-help">Constrains stage selection in V-02 collection entry.</div>
                                  </div>
                                </div>
                              )}
                            </div>
                          )}

                          <div style={{marginTop: '1rem', display: 'flex', gap: '8px'}}>
                            <button className="cds--btn cds--btn--primary cds--btn--sm">Save</button>
                            <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={() => setExpanded(null)}>Cancel</button>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </>
      );
    }

    function App() {
      const [page, setPage] = useState('species');
      return (
        <>
          <Header page={page} />
          <div className="oe-layout">
            <SideNav page={page} setPage={setPage} />
            <div className="oe-main">
              {page === 'species' && <SpeciesPage />}
              {page === 'traps' && <TrapTypesPage />}
              {page === 'sampleTypes' && <SampleTypesPage />}
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
