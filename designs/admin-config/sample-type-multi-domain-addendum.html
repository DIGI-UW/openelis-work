<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGC-296 Addendum: SampleType Multi-Domain Classification — OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', Arial, sans-serif; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .preview-content { padding: 1rem 2rem; max-width: 1100px; margin: 0 auto; }

    .tile { background: #fff; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .tile h3 { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; color: #161616; }
    .tile h4 { font-size: 16px; font-weight: 600; margin: 0 0 1rem 0; color: #161616; }
    .tile p.subtitle { font-size: 13px; color: #525252; margin: 0 0 1rem 0; }

    .scene-tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 0; background: #fff; border: 1px solid #e0e0e0; border-bottom: none; }
    .scene-tab { padding: 14px 24px; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: #525252; transition: all 0.15s; user-select: none; }
    .scene-tab:hover { color: #161616; background: #f4f4f4; }
    .scene-tab.active { color: #0f62fe; border-bottom-color: #0f62fe; background: #fff; }
    .scene-content { background: #fff; border: 1px solid #e0e0e0; padding: 0; }

    .page-header { background: #161616; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
    .page-header-title { font-size: 14px; font-weight: 500; }
    .page-header-crumb { font-size: 12px; color: #8d8d8d; }

    .inner-tabs { display: flex; border-bottom: 1px solid #e0e0e0; padding: 0 24px; background: #fff; }
    .inner-tab { padding: 10px 16px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: #525252; transition: all 0.15s; }
    .inner-tab.active { color: #0f62fe; border-bottom-color: #0f62fe; font-weight: 500; }
    .inner-tab:hover { color: #161616; }

    .form-section { padding: 24px; }
    .form-row { display: grid; gap: 20px; margin-bottom: 20px; }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { font-size: 12px; font-weight: 600; color: #161616; }
    .form-field .helper { font-size: 12px; color: #525252; }
    .form-field .error-msg { font-size: 12px; color: #da1e28; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .form-field input, .form-field select {
      padding: 10px 12px; border: none; border-bottom: 2px solid #8d8d8d;
      font-size: 14px; font-family: inherit; background: #f4f4f4; outline: none; width: 100%; box-sizing: border-box;
    }
    .form-field input:focus, .form-field select:focus { border-bottom-color: #0f62fe; background: #fff; }
    .form-field.has-error input, .form-field.has-error select { border-bottom-color: #da1e28; background: #fff8f8; }

    .toggle-wrapper { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .toggle { position: relative; width: 40px; height: 22px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #8d8d8d; border-radius: 11px; transition: 0.2s; }
    .toggle input:checked + .toggle-track { background: #0f62fe; }
    .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked ~ .toggle-thumb { left: 21px; }
    .toggle-label { font-size: 14px; color: #161616; }

    .checkbox-group { border: 1px solid #e0e0e0; padding: 12px 16px; background: #f4f4f4; }
    .checkbox-group.has-error { border-color: #da1e28; background: #fff8f8; }
    .checkbox-group-label { font-size: 12px; font-weight: 600; color: #161616; margin-bottom: 8px; display: block; }
    .checkbox-group-helper { font-size: 12px; color: #525252; margin-bottom: 10px; display: block; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
    .checkbox-item:hover { color: #0f62fe; }
    .checkbox-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0f62fe; cursor: pointer; }
    .checkbox-item .cb-label { font-size: 14px; color: #161616; user-select: none; }
    .checkbox-error { font-size: 12px; color: #da1e28; margin-top: 8px; display: flex; align-items: center; gap: 4px; }

    .radio-group { border: 1px solid #e0e0e0; padding: 12px 16px; background: #edf5ff; margin-bottom: 20px; }
    .radio-group.has-error { border-color: #da1e28; background: #fff8f8; }
    .radio-group-label { font-size: 12px; font-weight: 600; color: #161616; margin-bottom: 6px; display: block; }
    .radio-group-helper { font-size: 12px; color: #525252; margin-bottom: 10px; display: block; }
    .radio-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
    .radio-item input[type="radio"] { width: 16px; height: 16px; accent-color: #0f62fe; cursor: pointer; }
    .radio-item .rb-label { font-size: 14px; color: #161616; user-select: none; }
    .radio-error { font-size: 12px; color: #da1e28; margin-top: 8px; display: flex; align-items: center; gap: 4px; }

    .domain-section { border-left: 3px solid; padding: 16px 20px; margin-bottom: 16px; }
    .domain-section.clinical { border-color: #0f62fe; background: #f0f4ff; }
    .domain-section.environmental { border-color: #007d79; background: #f0fafa; }
    .domain-section.vector { border-color: #24a148; background: #f0fef4; }
    .domain-section h5 { font-size: 14px; font-weight: 600; margin: 0 0 12px 0; }
    .domain-section.clinical h5 { color: #0043ce; }
    .domain-section.environmental h5 { color: #005d5d; }
    .domain-section.vector h5 { color: #0e6027; }

    .tag { display: inline-block; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; vertical-align: middle; margin: 2px; }
    .tag-blue { background: #d0e2ff; color: #002d9c; }
    .tag-teal { background: #d9fbfb; color: #004144; }
    .tag-green { background: #defbe6; color: #0e6027; }
    .tag-gray { background: #e0e0e0; color: #161616; }
    .tag-red { background: #ffd7d9; color: #a2191f; }

    .btn { padding: 10px 20px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .btn-primary:hover { background: #0353e9; }
    .btn-secondary { background: #e0e0e0; color: #161616; }
    .btn-secondary:hover { background: #c6c6c6; }
    .btn-ghost { background: transparent; color: #0f62fe; font-size: 13px; padding: 6px 12px; }
    .btn-ghost:hover { background: rgba(15,98,254,0.08); }

    .actions-bar { padding: 16px 24px; background: #f4f4f4; border-top: 1px solid #e0e0e0; display: flex; gap: 12px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 16px; background: #e0e0e0; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 10px 16px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f4f4f4; }
    tr.highlight td { background: #edf5ff; }

    .toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .toolbar input[type="text"] { padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d; font-size: 14px; font-family: inherit; background: #f4f4f4; flex: 1; max-width: 280px; outline: none; }
    .toolbar input:focus { border-bottom-color: #0f62fe; background: #fff; }
    .toolbar select { padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d; font-size: 14px; font-family: inherit; background: #f4f4f4; outline: none; }

    .notice { padding: 12px 16px; border-left: 3px solid; margin-bottom: 16px; font-size: 13px; }
    .notice-info { border-color: #0f62fe; background: #edf5ff; color: #002d9c; }
    .notice-warning { border-color: #f1c21b; background: #fdf6e3; color: #5e4200; }
    .notice-success { border-color: #24a148; background: #defbe6; color: #0e6027; }

    .combobox-wrapper { position: relative; }
    .combobox-input { width: 100%; padding: 10px 12px; border: none; border-bottom: 2px solid #8d8d8d; font-size: 14px; font-family: inherit; background: #f4f4f4; outline: none; box-sizing: border-box; }
    .combobox-input:focus { border-bottom-color: #0f62fe; background: #fff; }
    .combobox-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e0e0e0; box-shadow: 0 4px 8px rgba(0,0,0,0.12); z-index: 100; }
    .combobox-option { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f4f4f4; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
    .combobox-option:hover { background: #e5f6ff; }
    .combobox-option.selected { background: #edf5ff; font-weight: 500; }

    .section-divider { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }

    .annotation { font-size: 11px; color: #0f62fe; font-style: italic; margin-top: 4px; }
  </style>
</head>
<body>

<div class="preview-banner">
  OpenELIS Global · Design Preview · OGC-296 Addendum: SampleType Multi-Domain Classification · 2026-04-20
</div>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ─── shared data ─────────────────────────────── */
const SAMPLE_TYPES_DATA = [
  { id: 1,  name: 'Whole Blood',        active: true,  domains: ['CLINICAL'] },
  { id: 2,  name: 'Serum',              active: true,  domains: ['CLINICAL'] },
  { id: 3,  name: 'Urine',              active: true,  domains: ['CLINICAL'] },
  { id: 4,  name: 'Water Sample',       active: true,  domains: ['ENVIRONMENTAL', 'CLINICAL'] },
  { id: 5,  name: 'Soil Sample',        active: true,  domains: ['ENVIRONMENTAL'] },
  { id: 6,  name: 'Mosquito Pool',      active: true,  domains: ['VECTOR'] },
  { id: 7,  name: 'Sediment',           active: true,  domains: ['ENVIRONMENTAL'] },
  { id: 8,  name: 'Arthropod Specimen', active: true,  domains: ['VECTOR', 'CLINICAL'] },
  { id: 9,  name: 'Air Filter',         active: false, domains: ['ENVIRONMENTAL'] },
];

const DOMAIN_TAG = {
  CLINICAL:      { kind: 'tag-blue',  label: 'Clinical' },
  ENVIRONMENTAL: { kind: 'tag-teal',  label: 'Environmental' },
  VECTOR:        { kind: 'tag-green', label: 'Vector' },
};

function DomainTags({ domains }) {
  return (
    <span>
      {domains.map(d => (
        <span key={d} className={`tag ${DOMAIN_TAG[d].kind}`}>{DOMAIN_TAG[d].label}</span>
      ))}
    </span>
  );
}

/* ─── Scene 1: Admin List View ────────────────── */
function AdminListView() {
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('');

  const filtered = SAMPLE_TYPES_DATA.filter(st => {
    const nameMatch = st.name.toLowerCase().includes(search.toLowerCase());
    const domainMatch = !filter || st.domains.includes(filter);
    return nameMatch && domainMatch;
  });

  return (
    <div>
      <div className="page-header">
        <span className="page-header-crumb">Admin</span>
        <span style={{color:'#525252'}}>›</span>
        <span className="page-header-title">Sample Type Management</span>
      </div>

      <div style={{padding:'16px 24px 0 24px', background:'#fff', borderBottom:'1px solid #e0e0e0', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div>
          <div style={{fontSize:20, fontWeight:600, color:'#161616'}}>Sample Types</div>
          <div style={{fontSize:13, color:'#525252', marginTop:2}}>Manage sample type definitions and domain classifications.</div>
        </div>
        <button className="btn btn-primary" style={{height:40}}>+ Add Sample Type</button>
      </div>

      <div className="toolbar">
        <input type="text" placeholder="Search sample types…" value={search} onChange={e=>setSearch(e.target.value)} />
        <select value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="">All domains</option>
          <option value="CLINICAL">Clinical only</option>
          <option value="ENVIRONMENTAL">Environmental only</option>
          <option value="VECTOR">Vector only</option>
        </select>
        <span style={{fontSize:12, color:'#525252', marginLeft:'auto'}}>{filtered.length} result{filtered.length!==1?'s':''}</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Domain</th>
            <th>Status</th>
            <th style={{width:80}}></th>
          </tr>
        </thead>
        <tbody>
          {filtered.map(st => (
            <tr key={st.id} className={st.domains.length > 1 ? 'highlight' : ''}>
              <td style={{fontWeight: st.domains.length > 1 ? 500 : 'normal'}}>{st.name}</td>
              <td><DomainTags domains={st.domains} /></td>
              <td>
                <span className={`tag ${st.active ? 'tag-green' : 'tag-gray'}`}>
                  {st.active ? 'Active' : 'Inactive'}
                </span>
              </td>
              <td>
                <button className="btn btn-ghost" style={{padding:'4px 10px',fontSize:12}}>Edit</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>

      <div style={{padding:'10px 16px', background:'#f4f4f4', borderTop:'1px solid #e0e0e0', fontSize:12, color:'#525252'}}>
        Rows highlighted in blue have multi-domain sample types — they appear in more than one order-entry context.
      </div>
    </div>
  );
}

/* ─── Scene 2: Admin Editor ───────────────────── */
function AdminEditorView() {
  const [name, setName] = useState('Water Sample');
  const [active, setActive] = useState(true);
  const [domains, setDomains] = useState({ CLINICAL: true, ENVIRONMENTAL: true, VECTOR: false });
  const [triedSave, setTriedSave] = useState(false);
  const [saved, setSaved] = useState(false);

  const noneSelected = !domains.CLINICAL && !domains.ENVIRONMENTAL && !domains.VECTOR;

  function toggleDomain(d) {
    setDomains(prev => ({ ...prev, [d]: !prev[d] }));
    setSaved(false);
  }

  function handleSave() {
    setTriedSave(true);
    if (!noneSelected && name.trim()) setSaved(true);
  }

  return (
    <div>
      <div className="page-header">
        <span className="page-header-crumb">Admin › Sample Type Management</span>
        <span style={{color:'#525252'}}>›</span>
        <span className="page-header-title">Edit Sample Type</span>
      </div>

      <div className="inner-tabs">
        <div className="inner-tab active">Basic Info</div>
        <div className="inner-tab" style={{color:'#8d8d8d', cursor:'not-allowed'}}>Usage History</div>
      </div>

      {saved && (
        <div style={{padding:'8px 24px', background:'#defbe6', borderBottom:'2px solid #24a148', fontSize:13, color:'#0e6027', display:'flex', alignItems:'center', gap:8}}>
          ✓ Sample type saved successfully.
        </div>
      )}

      <div className="form-section">

        <div className="form-row cols-2">
          <div className="form-field">
            <label>Name *</label>
            <input type="text" value={name} onChange={e=>{setName(e.target.value);setSaved(false);}} />
          </div>
          <div className="form-field">
            <label>Status</label>
            <div className="toggle-wrapper">
              <label className="toggle">
                <input type="checkbox" checked={active} onChange={()=>setActive(a=>!a)} />
                <div className="toggle-track"></div>
                <div className="toggle-thumb"></div>
              </label>
              <span className="toggle-label">{active ? 'Active' : 'Inactive'}</span>
            </div>
          </div>
        </div>

        <hr className="section-divider" />

        {/* ── NEW: Domain Context CheckboxGroup ── */}
        <div className="form-field" style={{maxWidth:500}}>
          <div className={`checkbox-group ${triedSave && noneSelected ? 'has-error' : ''}`}>
            <span className="checkbox-group-label">Domain context *</span>
            <span className="checkbox-group-helper">
              Select all workflow contexts this sample type appears in. At least one is required.
            </span>

            {['CLINICAL','ENVIRONMENTAL','VECTOR'].map(d => (
              <label className="checkbox-item" key={d} onClick={()=>toggleDomain(d)}>
                <input type="checkbox" readOnly checked={!!domains[d]} />
                <span className="cb-label">
                  {d === 'CLINICAL' ? 'Clinical' : d === 'ENVIRONMENTAL' ? 'Environmental' : 'Vector'}
                </span>
                {domains[d] && (
                  <span className={`tag ${DOMAIN_TAG[d].kind}`} style={{marginLeft:4}}>
                    {DOMAIN_TAG[d].label}
                  </span>
                )}
              </label>
            ))}

            {triedSave && noneSelected && (
              <div className="checkbox-error">
                ⚠ At least one domain context is required.
              </div>
            )}
          </div>
          <span className="helper annotation">
            ↑ New field — replaces the single-value sampleDomain enum (S-04 addendum)
          </span>
        </div>

      </div>

      <div className="actions-bar">
        <button className="btn btn-primary" onClick={handleSave}>Save</button>
        <button className="btn btn-secondary" onClick={()=>{setTriedSave(false);setSaved(false);}}>Cancel</button>
        {triedSave && noneSelected && (
          <span style={{fontSize:13, color:'#da1e28', display:'flex', alignItems:'center', gap:6}}>
            ⚠ Fix validation errors before saving.
          </span>
        )}
      </div>
    </div>
  );
}

/* ─── Scene 3: Order Entry — Sample Category Toggle ─── */

// Lab units: some are single-domain (toggle hidden), one is multi-domain (toggle shown)
const LAB_UNIT_CONFIGS = [
  { id: 1, name: 'Haematology',           domains: ['CLINICAL'] },
  { id: 2, name: 'Clinical Chemistry',    domains: ['CLINICAL'] },
  { id: 3, name: 'Microbiology',          domains: ['CLINICAL', 'ENVIRONMENTAL'] },
  { id: 4, name: 'Water Quality Lab',     domains: ['ENVIRONMENTAL'] },
  { id: 5, name: 'Entomology Unit',       domains: ['VECTOR'] },
];

function OrderEntryView() {
  const [selectedUnit, setSelectedUnit] = useState(null);
  const [domain,       setDomain]       = useState('');
  const [stSearch,     setStSearch]     = useState('');
  const [ddOpen,       setDdOpen]       = useState(false);
  const [selectedST,   setSelectedST]   = useState(null);

  function pickUnit(u) {
    setSelectedUnit(u);
    setSelectedST(null);
    setStSearch('');
    // Auto-select if single-domain
    if (u && u.domains.length === 1) setDomain(u.domains[0]);
    else setDomain('');
  }

  const isMultiDomainUnit = selectedUnit && selectedUnit.domains.length > 1;
  const resolvedDomain = domain;

  const stOptions = resolvedDomain
    ? SAMPLE_TYPES_DATA.filter(st =>
        st.active &&
        st.domains.includes(resolvedDomain) &&
        st.name.toLowerCase().includes(stSearch.toLowerCase())
      )
    : [];

  const showEnv    = resolvedDomain === 'ENVIRONMENTAL';
  const showVector = resolvedDomain === 'VECTOR';

  return (
    <div>
      <div className="page-header">
        <span className="page-header-crumb">Add Order</span>
        <span style={{color:'#525252'}}>›</span>
        <span className="page-header-title">New Sample Registration</span>
      </div>

      {/* Simulated page-level context strip */}
      <div style={{padding:'10px 24px', background:'#fff', borderBottom:'1px solid #e0e0e0', display:'flex', gap:32, fontSize:13}}>
        <div><span style={{color:'#525252', fontSize:11, textTransform:'uppercase', letterSpacing:0.5}}>Requester</span><br /><strong>Dr. Sari Dewi</strong></div>
        <div><span style={{color:'#525252', fontSize:11, textTransform:'uppercase', letterSpacing:0.5}}>Date</span><br /><strong>2026-04-20</strong></div>
        <div>
          <span style={{color:'#525252', fontSize:11, textTransform:'uppercase', letterSpacing:0.5}}>Lab Unit</span><br />
          <select
            style={{fontSize:13, border:'none', borderBottom:'1px solid #8d8d8d', background:'transparent', fontFamily:'inherit', fontWeight:500, outline:'none', paddingRight:8, cursor:'pointer'}}
            value={selectedUnit ? selectedUnit.id : ''}
            onChange={e => {
              const u = LAB_UNIT_CONFIGS.find(x => x.id === parseInt(e.target.value));
              pickUnit(u || null);
            }}
          >
            <option value="">— select unit —</option>
            {LAB_UNIT_CONFIGS.map(u => (
              <option key={u.id} value={u.id}>
                {u.name}{u.domains.length > 1 ? ' (multi-domain)' : ''}
              </option>
            ))}
          </select>
        </div>
      </div>

      <div style={{padding:'0 24px 24px', background:'#fff'}}>

        {/* ── Sample Category toggle — shown only when lab unit is multi-domain ── */}
        {selectedUnit && (
          <div style={{borderBottom:'1px solid #e0e0e0', paddingTop:20, paddingBottom:20}}>
            <div style={{fontWeight:600, fontSize:14, marginBottom:8}}>Sample Category</div>

            {isMultiDomainUnit ? (
              <>
                <div style={{display:'flex', gap:0, marginBottom:8}}>
                  {selectedUnit.domains.map(d => (
                    <button
                      key={d}
                      onClick={() => { setDomain(d); setSelectedST(null); setStSearch(''); }}
                      style={{
                        padding:'8px 20px',
                        border:'1px solid #c6c6c6',
                        borderRight: selectedUnit.domains.indexOf(d) < selectedUnit.domains.length - 1 ? 'none' : '1px solid #c6c6c6',
                        background: domain === d ? '#0f62fe' : '#fff',
                        color: domain === d ? '#fff' : '#161616',
                        fontSize:13,
                        cursor:'pointer',
                        fontFamily:'inherit',
                        fontWeight: domain === d ? 500 : 'normal',
                        transition:'all 0.15s',
                      }}
                    >
                      {d === 'CLINICAL' ? 'Clinical' : d === 'ENVIRONMENTAL' ? 'Environmental / Other' : 'Vector'}
                    </button>
                  ))}
                </div>
                <div style={{fontSize:11, color:'#525252'}}>
                  This toggle appears because <strong>{selectedUnit.name}</strong> is configured for multiple domains. For single-domain units (e.g., Haematology), the domain is set automatically and this toggle is hidden.
                </div>
              </>
            ) : (
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <DomainTags domains={selectedUnit.domains} />
                <span style={{fontSize:12, color:'#525252'}}>
                  Auto-selected — <strong>{selectedUnit.name}</strong> supports only this domain. No selection needed.
                </span>
              </div>
            )}
          </div>
        )}

        {!selectedUnit && (
          <div className="notice notice-info" style={{marginTop:20}}>
            Select a lab unit above to continue. If the unit supports only one domain, the sample category is set automatically.
          </div>
        )}

        {/* ── Sample Type — filtered by resolved domain ── */}
        {resolvedDomain && (
          <div style={{marginTop:20, maxWidth:540}}>
            <div className="form-field">
              <label>Sample Type *</label>
              <div className="combobox-wrapper">
                <input
                  className="combobox-input"
                  placeholder={`Search sample types for ${resolvedDomain.toLowerCase()}…`}
                  value={stSearch}
                  onFocus={() => setDdOpen(true)}
                  onChange={e => { setStSearch(e.target.value); setDdOpen(true); setSelectedST(null); }}
                />
                {ddOpen && stOptions.length > 0 && (
                  <div className="combobox-dropdown">
                    {stOptions.map(st => (
                      <div
                        key={st.id}
                        className={`combobox-option ${selectedST && selectedST.id === st.id ? 'selected' : ''}`}
                        onMouseDown={() => { setSelectedST(st); setStSearch(st.name); setDdOpen(false); }}
                      >
                        <span>{st.name}</span>
                        <DomainTags domains={st.domains} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <span style={{fontSize:12, color:'#525252', marginTop:4, display:'block'}}>
                {stOptions.length} active sample type{stOptions.length!==1?'s':''} available for <strong>{resolvedDomain}</strong>.
                {' '}Multi-domain types (e.g. Water Sample tagged CLINICAL+ENVIRONMENTAL) appear here because they include this domain in their set.
              </span>
            </div>
          </div>
        )}

        {/* ── Context-specific form sections ── */}
        {selectedST && (
          <>
            <hr className="section-divider" />

            <div className="domain-section clinical">
              <h5>Patient & Collection Details</h5>
              <div className="form-row cols-3">
                <div className="form-field">
                  <label>Patient ID</label>
                  <input type="text" placeholder="Search patient…" style={{background:'#fff'}} />
                </div>
                <div className="form-field">
                  <label>Collection Date</label>
                  <input type="date" style={{background:'#fff'}} defaultValue="2026-04-20" />
                </div>
                <div className="form-field">
                  <label>Test Panel</label>
                  <select style={{background:'#fff'}}>
                    <option>Select panel…</option>
                    <option>Malaria RDT</option>
                    <option>Full Blood Count</option>
                  </select>
                </div>
              </div>
            </div>

            {showEnv && (
              <div className="domain-section environmental">
                <h5>Environmental — Sampling Site & Compliance</h5>
                <div className="form-row cols-2">
                  <div className="form-field">
                    <label>Sampling Site</label>
                    <select style={{background:'#fff'}}>
                      <option>River Citarum — Station 4</option>
                      <option>Well Water — Desa Sukajadi</option>
                    </select>
                  </div>
                  <div className="form-field">
                    <label>Compliance Standard</label>
                    <select style={{background:'#fff'}}>
                      <option>WHO Drinking Water 2022</option>
                      <option>PerMenKes 32/2017</option>
                    </select>
                  </div>
                </div>
              </div>
            )}

            {showVector && (
              <div className="domain-section vector">
                <h5>Vector — Collection Lot & Trap Metadata</h5>
                <div className="form-row cols-2">
                  <div className="form-field">
                    <label>Collection Lot ID</label>
                    <input type="text" placeholder="Auto-generated on save" style={{background:'#fff'}} readOnly />
                  </div>
                  <div className="form-field">
                    <label>Trap Type</label>
                    <select style={{background:'#fff'}}>
                      <option>BG-Sentinel 2</option>
                      <option>CDC Light Trap</option>
                      <option>Gravid Trap</option>
                    </select>
                  </div>
                </div>
              </div>
            )}

            <div className="actions-bar" style={{background:'#f4f4f4', border:'1px solid #e0e0e0', marginTop:8}}>
              <button className="btn btn-primary">Submit Order</button>
              <button className="btn btn-secondary">Cancel</button>
            </div>
          </>
        )}

      </div>
    </div>
  );
}

/* ─── Scene 4: API & Filter Reference ────────── */
function ApiReferenceView() {
  const [domainFilter, setDomainFilter] = useState('');

  const filtered = SAMPLE_TYPES_DATA.filter(st =>
    st.active && (!domainFilter || st.domains.includes(domainFilter))
  );

  return (
    <div style={{padding:24}}>
      <div className="notice notice-info" style={{marginBottom:20}}>
        <strong>API Contract Demonstration</strong> — The <code>?domain=</code> query parameter drives all order-entry dropdown filtering. Try selecting a domain below to simulate how each module calls the endpoint.
      </div>

      <div style={{marginBottom:20}}>
        <div style={{fontWeight:600, fontSize:13, marginBottom:8}}>Simulate: <code>GET /api/v1/sample-types?domain=<strong>{domainFilter||'(none)'}</strong>&active=true</code></div>
        <div style={{display:'flex', gap:12, flexWrap:'wrap'}}>
          {['', 'CLINICAL', 'ENVIRONMENTAL', 'VECTOR'].map(d => (
            <button
              key={d}
              className={`btn ${domainFilter === d ? 'btn-primary' : 'btn-secondary'}`}
              onClick={() => setDomainFilter(d)}
              style={{fontSize:13, padding:'8px 16px'}}
            >
              {d === '' ? 'No filter (all)' : d === 'CLINICAL' ? 'Clinical (existing)' : d === 'ENVIRONMENTAL' ? 'Environmental (S-03)' : 'Vector (V-02)'}
            </button>
          ))}
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>name</th>
            <th>domains</th>
            <th>active</th>
          </tr>
        </thead>
        <tbody>
          {filtered.map(st => (
            <tr key={st.id} className={st.domains.length > 1 ? 'highlight' : ''}>
              <td style={{color:'#8d8d8d', fontSize:12}}>{st.id}</td>
              <td><code style={{fontSize:13}}>"{st.name}"</code></td>
              <td>
                <code style={{fontSize:12, color:'#525252'}}>
                  [{st.domains.map(d=>`"${d}"`).join(', ')}]
                </code>
              </td>
              <td><span className="tag tag-green">true</span></td>
            </tr>
          ))}
          {filtered.length === 0 && (
            <tr><td colSpan={4} style={{color:'#8d8d8d', textAlign:'center', padding:20}}>No sample types match this domain filter.</td></tr>
          )}
        </tbody>
      </table>

      <div style={{marginTop:20, background:'#f4f4f4', border:'1px solid #e0e0e0', padding:16, fontSize:12}}>
        <div style={{fontWeight:600, marginBottom:8}}>Filter Integration Map</div>
        <table style={{fontSize:12}}>
          <thead>
            <tr>
              <th>Module</th>
              <th>Jira</th>
              <th>Domain param passed</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Standard clinical order entry</td><td style={{color:'#525252'}}>(existing)</td><td><code>?domain=CLINICAL</code></td></tr>
            <tr><td>Environmental Order Entry (S-03)</td><td><a href="https://uwdigi.atlassian.net/browse/OGC-537" style={{color:'#0f62fe'}}>OGC-537</a></td><td><code>?domain=ENVIRONMENTAL</code></td></tr>
            <tr><td>Vector Collection Workflow (V-02)</td><td><a href="https://uwdigi.atlassian.net/browse/OGC-581" style={{color:'#0f62fe'}}>OGC-581</a></td><td><code>?domain=VECTOR</code></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ─── Root App ────────────────────────────────── */
function App() {
  const [scene, setScene] = useState(0);
  const scenes = [
    { label: 'Admin: Sample Type List',   component: <AdminListView /> },
    { label: 'Admin: Editor (new field)', component: <AdminEditorView /> },
    { label: 'Order Entry: Domain Resolution', component: <OrderEntryView /> },
    { label: 'API Filter Demo',           component: <ApiReferenceView /> },
  ];

  return (
    <div className="preview-content">
      <div className="tile" style={{padding:'1rem 1.5rem', marginBottom:12}}>
        <div className="header-row" style={{marginBottom:4}}>
          <div>
            <div style={{fontSize:11, color:'#525252', textTransform:'uppercase', letterSpacing:1, marginBottom:4}}>Design Preview</div>
            <div style={{display:'flex', alignItems:'center', gap:10}}>
              <h3>OGC-296 Addendum — SampleType Multi-Domain Classification</h3>
              <span className="tag tag-blue">Addendum to OGC-296</span>
              <span className="tag tag-gray">Draft</span>
            </div>
          </div>
        </div>
        <p style={{fontSize:13, color:'#525252', margin:0}}>
          Replaces the single-value <code>sampleDomain</code> enum with a multi-value checkbox set.
          Each SampleType can belong to any combination of Clinical / Environmental / Vector,
          with at least one required. This drives order-entry dropdown filtering and domain
          disambiguation when a sample type spans multiple workflow contexts.
        </p>
      </div>

      <div className="scene-tabs">
        {scenes.map((s, i) => (
          <div key={i} className={`scene-tab ${scene===i?'active':''}`} onClick={()=>setScene(i)}>
            {s.label}
          </div>
        ))}
      </div>
      <div className="scene-content">
        {scenes[scene].component}
      </div>

      <div style={{marginTop:12, fontSize:12, color:'#8d8d8d', textAlign:'center', padding:'8px 0'}}>
        FRS: <a href="OGC-296-sample-domain-addendum-frs.md" style={{color:'#0f62fe'}}>OGC-296-sample-domain-addendum-frs.md</a>
        &nbsp;·&nbsp;
        Jira: <a href="https://uwdigi.atlassian.net/browse/OGC-296" style={{color:'#0f62fe'}}>OGC-296</a>
        &nbsp;·&nbsp;
        Related: OGC-538, OGC-537, OGC-555, OGC-581
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
