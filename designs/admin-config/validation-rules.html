<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Validation Rules — Preview</title>
<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #f4f4f4; --surface: #ffffff; --surface-2: #f9f9f9; --surface-muted: #f4f4f4;
    --text: #161616; --text-secondary: #525252; --text-helper: #6f6f6f;
    --border: #e0e0e0; --border-strong: #8d8d8d;
    --accent-info: #0f62fe; --accent-success: #24a148; --accent-danger: #da1e28;
    --accent-info-bg: #edf5ff; --accent-success-bg: #defbe6;
    --row-dirty: #d0e2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--text); }
  .page-frame { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 6rem; }
  .crumbs { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
  .crumbs a { color: var(--accent-info); text-decoration: none; }
  h1 { font-size: 2rem; font-weight: 300; margin: 0 0 0.25rem; }
  h2 { font-size: 1.125rem; font-weight: 500; margin: 0; }
  .subtitle { color: var(--text-secondary); margin: 0 0 1.5rem; font-size: 0.875rem; max-width: 820px; line-height: 1.5; }

  .notice { margin-bottom: 1rem; padding: 0.875rem 1rem; border-left: 4px solid var(--accent-info); background: var(--accent-info-bg); border-radius: 2px; }
  .notice.success { border-color: var(--accent-success); background: var(--accent-success-bg); }
  .notice strong { font-size: 0.875rem; }
  .notice .sub { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--text-secondary); }
  .notice a { color: var(--accent-info); }

  .page-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .recent-trigger { background: transparent; border: 1px solid var(--border); padding: 0.375rem 0.75rem; border-radius: 2px; cursor: pointer; font: inherit; font-size: 0.8125rem; color: var(--accent-info); display: inline-flex; align-items: center; gap: 0.375rem; }
  .recent-trigger:hover { background: var(--surface-2); }

  .group-header { display: flex; align-items: baseline; gap: 0.75rem; margin: 1.5rem 0 0.625rem; }
  .group-header h2 { color: var(--text); }
  .group-desc { font-size: 0.8125rem; color: var(--text-secondary); }

  .charset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 1.25rem; margin-bottom: 0.875rem; transition: background 0.1s; }
  .charset-card.dirty { background: var(--row-dirty); }
  .charset-label { font-size: 0.9375rem; font-weight: 500; cursor: help; }
  .charset-helper { margin: 0.375rem 0 0; font-size: 0.8125rem; color: var(--text-helper); line-height: 1.5; max-width: 760px; }

  .field-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1rem; align-items: end; margin-top: 1rem; }
  .field-label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem; font-weight: 500; }
  .field-helper { font-size: 0.75rem; color: var(--text-helper); margin-top: 0.25rem; }
  .text-input, .select-input {
    width: 100%; padding: 0.5rem 0.75rem; font: inherit; font-size: 0.875rem;
    background: var(--surface-2); border: 0; border-bottom: 1px solid var(--border-strong);
    outline: 0; color: var(--text); font-family: inherit;
  }
  .text-input.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.8125rem; }
  .text-input:disabled { color: var(--text-secondary); background: var(--surface-muted); cursor: not-allowed; }
  .text-input:focus, .select-input:focus { border-bottom: 2px solid var(--accent-info); }
  .select-wrap { position: relative; }
  .select-input { appearance: none; padding-right: 2rem; cursor: pointer; }
  .select-wrap::after { content: '▾'; position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 0.75rem; pointer-events: none; }

  /* Try-a-value preview */
  .try-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 2px; padding: 0.875rem 1rem; margin-top: 1rem; }
  .try-title { font-size: 0.8125rem; font-weight: 600; }
  .try-helper { margin: 0.25rem 0 0.625rem; font-size: 0.75rem; color: var(--text-helper); }
  .try-row { display: flex; gap: 0.875rem; align-items: center; }
  .try-row .text-input { max-width: 400px; }
  .tag { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.625rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
  .tag.green { background: #defbe6; color: #044317; }
  .tag.red { background: #ffd7d9; color: #750e13; }
  .tag.warm-gray { background: #e0e0e0; color: #393939; }

  /* Sticky bottom action bar */
  .actions-bar {
    display: flex; gap: 0.75rem; align-items: center;
    position: sticky; bottom: 0;
    margin: 1.5rem -2rem -6rem;
    padding: 0.875rem 2rem; background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 6px rgba(0,0,0,0.04);
    z-index: 40;
  }
  .actions-bar .dirty-summary { margin-left: auto; font-size: 0.8125rem; color: var(--text-secondary); }
  .btn { padding: 0.625rem 1rem; font-size: 0.875rem; cursor: pointer; border: 0; font-family: inherit; border-radius: 2px; }
  .btn.primary { background: var(--accent-info); color: white; }
  .btn.primary:hover:not(:disabled) { background: #0050d9; }
  .btn.ghost { background: transparent; color: var(--accent-info); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Recent Changes drawer */
  .recent-drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 90; }
  .recent-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw; background: var(--surface); box-shadow: -2px 0 8px rgba(0,0,0,0.15); padding: 1.25rem; overflow: auto; z-index: 100; }
  .recent-row { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .recent-meta { font-size: 0.75rem; color: var(--text-secondary); }
  .recent-field { font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; margin: 0.25rem 0; }
  .recent-change { font-size: 0.75rem; word-break: break-all; }

  .meta-panel { margin-top: 2rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-info); border-radius: 2px; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.6; }
  .meta-panel strong { color: var(--text); }
  .meta-panel code { background: var(--surface-muted); padding: 0.0625rem 0.375rem; border-radius: 2px; font-size: 0.75rem; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const NAME_PRESETS = [
  { id: 'western', label: 'Latin + Western European accents (default)', charset: ".'a-zàâçéèêëîïôûùüÿñæœ -" },
  { id: 'latin',   label: 'Latin only (a-z, no accents)',                charset: ".'a-z -" },
  { id: 'latin-numeric', label: 'Latin + digits (no accents)',           charset: "a-z0-9 -" },
  { id: 'custom',  label: 'Custom — edit the pattern below',             charset: null },
];

const ID_PRESETS = [
  { id: 'alnum-slash', label: 'Alphanumeric + slash + accents (default for patient ID)', charset: 'a-z0-9/àâçéèêëîïôûùüÿñæœ' },
  { id: 'alnum',       label: 'Alphanumeric only',                                       charset: 'a-z0-9' },
  { id: 'email-style', label: 'Alphanumeric + email chars ._@- (default for username)',  charset: 'a-zàâçéèêëîïôûùüÿñæœ ._@-' },
  { id: 'custom',      label: 'Custom — edit the pattern below',                         charset: null },
];

const FIELDS = [
  { group: 'names', key: 'firstNameCharset', label: 'First name — allowed characters',
    helper: 'Restricts which characters can appear in the First Name field everywhere patients are registered or edited. Tightening this can reject legitimate names — existing patients with disallowed characters keep their name but cannot be edited until characters are added back. Default allows Latin letters, Western European accents, apostrophe, period, hyphen, and space.',
    presets: NAME_PRESETS, defaultValue: ".'a-zàâçéèêëîïôûùüÿñæœ -" },
  { group: 'names', key: 'lastNameCharset', label: 'Last name — allowed characters',
    helper: 'Same shape as First name — restricts characters in the Last Name field across patient registration. Usually kept identical to First name unless a lab has data-quality rules treating one differently.',
    presets: NAME_PRESETS, defaultValue: ".'a-zàâçéèêëîïôûùüÿñæœ -" },
  { group: 'identifiers', key: 'patientIdCharset', label: 'Patient ID — allowed characters',
    helper: 'Restricts characters in the lab\'s patient identifier (the lab-assigned patient ID, distinct from any external/national ID). Default permits alphanumeric, forward slash, and accented letters; no spaces or special punctuation. Tightening can reject existing IDs on edit.',
    presets: ID_PRESETS, defaultValue: 'a-z0-9/àâçéèêëîïôûùüÿñæœ' },
  { group: 'identifiers', key: 'userNameCharset', label: 'Username — allowed characters',
    helper: 'Restricts characters in OpenELIS user login names. Defaults are permissive — includes "@", ".", "_", and "-" so users can have email-style logins. Tightening this can block existing users from logging in until their username conforms.',
    presets: ID_PRESETS, defaultValue: 'a-zàâçéèêëîïôûùüÿñæœ ._@-' },
];

const GROUPS = [
  { id: 'names',       label: 'Name fields',       desc: 'Characters allowed in patient first and last names.' },
  { id: 'identifiers', label: 'Identifier fields', desc: 'Characters allowed in patient IDs and OpenELIS usernames.' },
];

const SAMPLE_RECENT = [
  { user: 'casey@example.org', at: '2026-05-13 14:22', field: 'firstNameCharset', before: 'a-z -',                                  after: ".'a-zàâçéèêëîïôûùüÿñæœ -" },
  { user: 'admin@example.org', at: '2026-05-10 09:15', field: 'patientIdCharset', before: 'a-z0-9',                                 after: 'a-z0-9/àâçéèêëîïôûùüÿñæœ' },
  { user: 'casey@example.org', at: '2026-05-08 11:48', field: 'userNameCharset',  before: 'a-z0-9._-',                              after: 'a-zàâçéèêëîïôûùüÿñæœ ._@-' },
];

function buildRegex(charset) {
  if (!charset) return /^.*$/;
  try {
    return new RegExp(`^[${charset}]*$`);
  } catch (e) { return null; }
}

function CharsetCard({ field, value, isDirty, onChange }) {
  const matchedPreset = field.presets.find(p => p.charset === value);
  const [preset, setPreset] = useState(matchedPreset ? matchedPreset.id : 'custom');
  const [testValue, setTestValue] = useState('');

  const onPresetChange = (newId) => {
    setPreset(newId);
    const p = field.presets.find(pp => pp.id === newId);
    if (p && p.charset !== null) onChange(p.charset);
  };

  const regex = buildRegex(value);
  const isValid = regex ? regex.test(testValue) : false;
  let firstBad = null;
  if (testValue && !isValid && regex) {
    for (const c of testValue) {
      try {
        if (!new RegExp(`^[${value}]$`).test(c)) { firstBad = c; break; }
      } catch { break; }
    }
  }

  return (
    <div className={`charset-card${isDirty ? ' dirty' : ''}`}>
      <label className="charset-label" title={`Key: ${field.key}`}>{field.label}</label>
      <p className="charset-helper">{field.helper}</p>

      <div className="field-grid">
        <div>
          <label className="field-label">Preset</label>
          <div className="select-wrap">
            <select className="select-input" value={preset} onChange={(e) => onPresetChange(e.target.value)}>
              {field.presets.map(p => (
                <option key={p.id} value={p.id}>{p.label}</option>
              ))}
            </select>
          </div>
        </div>
        <div>
          <label className="field-label">Allowed characters (regex character class)</label>
          <input className="text-input mono" value={value || ''}
                 disabled={preset !== 'custom'}
                 onChange={(e) => onChange(e.target.value)} />
          <div className="field-helper">
            {preset === 'custom'
              ? 'Type the characters and ranges allowed. Example: "a-z0-9 -" allows lowercase letters, digits, space, and hyphen.'
              : 'Locked to the preset above. Switch to Custom to edit.'}
          </div>
        </div>
      </div>

      {/* TRY-A-VALUE LIVE PREVIEW — the C051 fix */}
      <div className="try-tile">
        <div className="try-title">Try a value</div>
        <div className="try-helper">Type a sample value (e.g. a name or ID) to see whether it would be accepted under the current pattern.</div>
        <div className="try-row">
          <input className="text-input mono" placeholder="Type a sample value…"
                 value={testValue} onChange={(e) => setTestValue(e.target.value)} />
          {testValue && (isValid
            ? <span className="tag green">✓ Valid</span>
            : <span className="tag red">✕ Invalid{firstBad ? ` — "${firstBad}" not allowed` : ''}</span>)}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [values, setValues] = useState(() => {
    const m = {}; FIELDS.forEach(f => { m[f.key] = f.defaultValue; }); return m;
  });
  const [dirty, setDirty] = useState(new Set());
  const [savedNotice, setSavedNotice] = useState(false);
  const [recentOpen, setRecentOpen] = useState(false);

  const setValue = (key, v) => {
    setValues(prev => ({ ...prev, [key]: v }));
    setDirty(prev => { const n = new Set(prev); n.add(key); return n; });
  };
  const onSave = () => { setDirty(new Set()); setSavedNotice(true); setTimeout(() => setSavedNotice(false), 3000); };
  const onDiscard = () => {
    const m = {}; FIELDS.forEach(f => { m[f.key] = f.defaultValue; });
    setValues(m); setDirty(new Set());
  };

  const fieldsByGroup = useMemo(() => {
    const m = {}; GROUPS.forEach(g => { m[g.id] = []; });
    FIELDS.forEach(f => m[f.group].push(f));
    return m;
  }, []);

  return (
    <div className="page-frame">
      <div className="crumbs">
        <a href="#">Admin</a> &nbsp;/&nbsp; <a href="#">Workflow Tuning</a> &nbsp;/&nbsp; <span>Validation Rules</span>
      </div>

      <div className="page-header-row">
        <div>
          <h1>Validation Rules</h1>
          <p className="subtitle">
            Define which characters are allowed in patient names, patient IDs, and OpenELIS usernames. Use the "Try a value" preview under each pattern to see what would be accepted before saving.
          </p>
        </div>
        <button className="recent-trigger" onClick={() => setRecentOpen(true)}>🕐 Recent changes</button>
      </div>

      <div className="notice">
        <strong>ⓘ See also</strong>
        <div className="sub">
          Phone-number format pattern and the "Validate phone format on entry" toggle live on <a href="#">Site Information</a> under Locale & formats.
        </div>
      </div>

      {savedNotice && (
        <div className="notice success">
          <strong>✓ Validation rules saved.</strong>
          <div className="sub">Changes are live. Affects new patient/user entries and edits to existing records.</div>
        </div>
      )}
      {dirty.size > 0 && (
        <div className="notice">
          <strong>Unsaved changes</strong>
          <div className="sub">{dirty.size} pattern{dirty.size === 1 ? '' : 's'} pending. Save or discard before leaving.</div>
        </div>
      )}

      {GROUPS.map(group => (
        <div key={group.id}>
          <div className="group-header">
            <h2>{group.label}</h2>
            <span className="group-desc">{group.desc}</span>
          </div>
          {fieldsByGroup[group.id].map(field => (
            <CharsetCard key={field.key} field={field} value={values[field.key]}
              isDirty={dirty.has(field.key)} onChange={(v) => setValue(field.key, v)} />
          ))}
        </div>
      ))}

      <div className="actions-bar">
        <button className="btn primary" disabled={dirty.size === 0} onClick={onSave}>💾 Save changes</button>
        <button className="btn ghost" disabled={dirty.size === 0} onClick={onDiscard}>↺ Discard changes</button>
        <span className="dirty-summary">
          {dirty.size === 0 ? 'No unsaved changes.' : `${dirty.size} unsaved change${dirty.size === 1 ? '' : 's'}.`}
        </span>
      </div>

      {recentOpen && (
        <>
          <div className="recent-drawer-backdrop" onClick={() => setRecentOpen(false)} />
          <div className="recent-drawer">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
              <h3 style={{ margin: 0 }}>Recent changes</h3>
              <button className="btn ghost" onClick={() => setRecentOpen(false)}>Close</button>
            </div>
            <p style={{ margin: '0 0 0.75rem', fontSize: '0.8125rem', color: 'var(--text-secondary)' }}>
              Last 5 changes on this page. Full audit history is queued for Phase 6.
            </p>
            {SAMPLE_RECENT.map((r, i) => (
              <div key={i} className="recent-row">
                <div className="recent-meta">{r.at} · {r.user}</div>
                <div className="recent-field">{r.field}</div>
                <div className="recent-change">
                  <span className="tag warm-gray">{r.before}</span>
                  {' → '}
                  <span className="tag green">{r.after}</span>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      <div className="meta-panel">
        <strong>About this preview.</strong> Try:<br />
        • Under <strong>First name</strong>, type <code>O'Brien</code> in the Try-a-value box — see ✓ Valid<br />
        • Switch the preset to <strong>Latin only (a-z, no accents)</strong> — same input becomes ✕ Invalid because of the apostrophe<br />
        • Switch preset to <strong>Custom</strong> and edit the pattern to add <code>'</code> back — see the test value flip to ✓ again<br />
        • Under <strong>Patient ID</strong>, type <code>P-2026/0042</code> — invalid (hyphen not in default; the "-" only matters in name fields). Edit pattern to add <code>-</code> and watch it become valid<br />
        • Hover any field label — tooltip shows the raw key (<code>firstNameCharset</code>) for ops/dev debugging<br />
        • Click <strong>🕐 Recent changes</strong> — drawer with last 3 changes
        <br /><br />
        <strong>Story B.4 of the admin MVP.</strong> Retires legacy Validation Configuration page (audit C051 High — "admins edit charsets blind"). Lives in <em>Workflow Tuning</em> bucket at <code>/admin/workflow-tuning/validation-rules</code>.
        <br /><br />
        <strong>The C051 fix is the "Try a value" live preview.</strong> Each charset has its own test input that validates in real time, showing which character would fail. No more typing a regex and finding out at next patient registration that it broke. Admins can rehearse the change before saving.
        <br /><br />
        <strong>Verified data model</strong> (testing.openelis-global.org, 2026-05-14): only 4 properties. Smaller surface than other pages — single page, no Accordion needed. Two groups (Name fields, Identifier fields), 2 fields each. Presets cover the common cases; Custom unlocks raw regex editing for power users.
        <br /><br />
        <strong>Phase 6 follow-up:</strong> warn on save when a charset becomes more restrictive (admin removed characters that existing records use). E.g. "You removed 'à' from firstNameCharset. 47 existing patients have 'à' in their first name and will fail validation on their next edit." Requires a backend lookup, deferred.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
