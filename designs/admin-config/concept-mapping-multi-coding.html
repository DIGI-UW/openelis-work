  const [expanded, setExpanded] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [filterSys, setFilterSys] = useState('');
  const [confirmRemove, setConfirmRemove] = useState(null);
  const [notif, setNotif] = useState(null);
  const [addForm, setAddForm] = useState({systemUri:'http://loinc.org', conceptId:'', isPrimary:false, notes:''});

  React.useEffect(() => {
    if (injectedConceptId && CONCEPTS[injectedConceptId]) {
      setShowAdd(true);
      setAddForm({
        systemUri: CONCEPTS[injectedConceptId].systemUri,
        conceptId: String(injectedConceptId),
        isPrimary: false,
        notes: '',
      });
      onInjectedConsumed && onInjectedConsumed();
    }
  }, [injectedConceptId]);

  const visible = useMemo(()=>{
    if (!filterSys) return mappings;
    return mappings.filter(m => CONCEPTS[m.conceptId].systemUri === filterSys);
  }, [mappings, filterSys]);

  const makePrimary = (id) => {
    setMappings(prev => prev.map(m => ({...m, isPrimary: m.id === id})));
    setNotif({kind:'info', text:'Previous primary coding was demoted.'});
  };

  const saveAdd = () => {
    if (!addForm.conceptId) return;
    const newId = (mappings.length ? Math.max(...mappings.map(m=>m.id)) : 0) + 1;
    const newMap = {id:newId, conceptId:Number(addForm.conceptId), isPrimary:addForm.isPrimary, notes:addForm.notes, createdAt:new Date().toISOString()};
    setMappings(prev => {
      const demoted = addForm.isPrimary ? prev.map(m => ({...m, isPrimary:false})) : prev;
      return [...demoted, newMap];
    });
    setShowAdd(false);
    setAddForm({systemUri:'http://loinc.org', conceptId:'', isPrimary:false, notes:''});
    setNotif({kind:'success', text:'Coding saved.'});
  };

  const doRemove = () => {
    const removing = mappings.find(m => m.id === confirmRemove);
    let remaining = mappings.filter(m => m.id !== confirmRemove);
    let promoted = false;
    if (removing.isPrimary && remaining.length > 0) {
      remaining = [...remaining].sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
      remaining[0] = {...remaining[0], isPrimary:true};
      promoted = true;
    }
    setMappings(remaining);
    setConfirmRemove(null);
    setNotif(promoted
      ? {kind:'info', text:'The next coding was automatically promoted to primary.'}
      : {kind:'success', text:'Coding removed.'});
  };

  const primaryRemoving = confirmRemove && mappings.find(m => m.id === confirmRemove)?.isPrimary && mappings.length === 1;

  const conceptOptions = Object.values(CONCEPTS).filter(c => c.systemUri === addForm.systemUri && c.isActive);

  return (
    <>
      {notif && (
        <div className={'notif notif-'+notif.kind}>
          <Icon name={notif.kind === 'success' ? 'check' : 'info'}/>
          <span><strong className="notif-title">{notif.text}</strong></span>
          <button className="notif-close" onClick={()=>setNotif(null)}>×</button>
        </div>
      )}

      {primaryRequired && mappings.length === 0 && (
        <div className="notif notif-error">
          <Icon name="warn"/>
          <span><strong className="notif-title">At least one coding must be marked primary before saving.</strong></span>
        </div>
      )}

      <div className="card">
        <div className="card-hdr">
          <h3>Codings</h3>
          <p>Codings attached to this test. The primary coding appears first in outbound FHIR messages.</p>
        </div>
        <div className="toolbar">
          <select value={filterSys} onChange={(e)=>setFilterSys(e.target.value)}>
            <option value="">All code systems</option>
            {Object.keys(SYS_NAMES).map(uri => (
              <option key={uri} value={uri}>{SYS_NAMES[uri]}</option>
            ))}
          </select>
          <button className="btn btn-ghost btn-sm" onClick={onOpenDrawer}>
            <Icon name="search" size={14}/> Browse subscribed value sets...
          </button>
          <div className="spacer"/>
          {editable && (
            <button className="btn btn-primary btn-sm" onClick={()=>{setShowAdd(true); setExpanded(null);}}>
              <Icon name="plus" size={14}/> Add Coding
            </button>
          )}
        </div>

        <table className="data-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Display</th>
              <th>Code System</th>
              <th>Primary</th>
              <th>Source</th>
              <th style={{width:'100px'}}></th>
            </tr>
          </thead>
          <tbody>
            {showAdd && (
              <tr className="expanded">
                <td colSpan={6}>
                  <div className="form-panel">
                    <h4>Add Coding</h4>
                    <div className="form-grid">
                      <div className="form-field">
                        <label className="form-label">Code System</label>
                        <select className="form-select" value={addForm.systemUri}
                          onChange={(e)=>setAddForm(f=>({...f, systemUri:e.target.value, conceptId:''}))}>
                          {Object.keys(SYS_NAMES).map(uri => (
                            <option key={uri} value={uri}>{SYS_NAMES[uri]}</option>
                          ))}
                        </select>
                      </div>
                      <div className="form-field">
                        <label className="form-label">Concept</label>
                        <select className="form-select" value={addForm.conceptId}
                          onChange={(e)=>setAddForm(f=>({...f, conceptId:e.target.value}))}>
                          <option value="">Type to search concepts in {SYS_NAMES[addForm.systemUri]}...</option>
                          {conceptOptions.map(c => (
                            <option key={c.id} value={c.id}>{c.code} — {c.display}</option>
                          ))}
                        </select>
                      </div>
                      <label className="cbox-item">
                        <input type="checkbox" checked={addForm.isPrimary}
                          onChange={(e)=>setAddForm(f=>({...f, isPrimary:e.target.checked}))}/>
                        Mark as primary coding
                      </label>
                    </div>
                    <div className="form-grid-2">
                      <div className="form-field">
                        <label className="form-label">Notes</label>
                        <textarea className="form-textarea" rows={2} value={addForm.notes}
                          onChange={(e)=>setAddForm(f=>({...f, notes:e.target.value}))}/>
                      </div>
                    </div>
                    <div className="form-actions">
                      <button className="btn btn-primary btn-sm" onClick={saveAdd} disabled={!addForm.conceptId}>Save</button>
                      <button className="btn btn-ghost-gray btn-sm" onClick={()=>setShowAdd(false)}>Cancel</button>
                    </div>
                  </div>
                </td>
              </tr>
            )}

            {visible.length === 0 && !showAdd && (
              <tr><td colSpan={6}><div className="empty">No codings defined</div></td></tr>
            )}

            {visible.map(m => {
              const c = CONCEPTS[m.conceptId];
              const isExp = expanded === m.id;
              return (
                <React.Fragment key={m.id}>
                  <tr className={isExp ? 'expanded' : ''}>
                    <td><span className="code-pill">{c.code}</span></td>
                    <td>{c.display}</td>
                    <td><Tag kind={SYS_TAG_KIND[c.systemUri] || 'gray'}>{SYS_NAMES[c.systemUri]}</Tag></td>
                    <td>
                      {m.isPrimary
                        ? <Tag kind="green" icon="check">Primary</Tag>
                        : editable ? <button className="btn btn-ghost btn-xs" onClick={()=>makePrimary(m.id)}>Make Primary</button> : null}
                    </td>
                    <td>
                      <Tag kind={SOURCE_TAG_KIND[c.source]}>{SOURCE_LABEL[c.source]}</Tag>
                      {c.sourceName && <div style={{fontSize:'11px', color:'#6f6f6f', marginTop:3}}>{c.sourceName}</div>}
                    </td>
                    <td style={{textAlign:'right'}}>
                      {editable && <>
                        <button className="btn btn-ghost-gray btn-icon" title="Edit"
                          onClick={()=>setExpanded(isExp ? null : m.id)}>
                          <Icon name={isExp ? 'chevUp' : 'edit'} size={14}/>
                        </button>
                        <button className="btn btn-danger-ghost btn-icon" title="Remove"
                          onClick={()=>setConfirmRemove(m.id)}>
                          <Icon name="trash" size={14}/>
                        </button>
                      </>}
                    </td>
                  </tr>
                  {isExp && (
                    <tr className="expanded">
                      <td colSpan={6}>
                        <div className="form-panel">
                          <h4>Edit Coding</h4>
                          <div className="form-grid">
                            <div className="form-field">
                              <label className="form-label">Code System</label>
                              <input className="form-input" value={SYS_NAMES[c.systemUri]} readOnly/>
                            </div>
                            <div className="form-field">
                              <label className="form-label">Code</label>
                              <input className="form-input" value={c.code + ' — ' + c.display} readOnly/>
                            </div>
                            <label className="cbox-item">
                              <input type="checkbox" checked={m.isPrimary}
                                onChange={(e)=>{ if (e.target.checked) makePrimary(m.id); }}/>
                              Primary
                            </label>
                          </div>
                          <div className="form-grid-2">
                            <div className="form-field">
                              <label className="form-label">Notes</label>
                              <textarea className="form-textarea" rows={2} defaultValue={m.notes}/>
                            </div>
                          </div>
                          <div className="form-actions">
                            <button className="btn btn-primary btn-sm" onClick={()=>setExpanded(null)}>Save</button>
                            <button className="btn btn-ghost-gray btn-sm" onClick={()=>setExpanded(null)}>Cancel</button>
                          </div>
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Remove confirmation */}
      {confirmRemove !== null && (
        <div className="modal-backdrop">
          <div className="modal">
            <div className="modal-hdr"><h2>Remove coding?</h2></div>
            <div className="modal-body">
              {primaryRemoving
                ? <p>Removing the only coding on this entity will leave it uncoded in FHIR outbound messages. Continue?</p>
                : <p>This will detach the selected coding from this entity. Existing FHIR messages already emitted are unaffected.</p>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost-gray" onClick={()=>setConfirmRemove(null)}>Cancel</button>
              <button className="btn btn-secondary" style={{background:'#da1e28'}} onClick={doRemove}>Remove</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function ValueSetDrawer({open, onClose, alreadyMappedIds, onPickConcept}) {
  const [expanded, setExpanded] = useState(null);

  if (!open) return null;

  const filtered = VALUE_SETS.filter(vs => {

    if (search && !vs.name.toLowerCase().includes(search.toLowerCase())) return false;

    <>
      <div className="drawer-overlay" onClick={onClose}/>

                value={search} onChange={(e)=>setSearch(e.target.value)}/>

              <label className="form-label">Code System</label>
              <select className="form-select" value={sysFilter} onChange={(e)=>setSysFilter(e.target.value)}>

                {Object.keys(SYS_NAMES).map(uri => (
                  <option key={uri} value={uri}>{SYS_NAMES[uri]}</option>
                ))}
              </select>
            </div>
          </div>

          <table className="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Code System</th>
                <th>Source</th>
                <th>Members</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(vs => (
                <React.Fragment key={vs.id}>
                  <tr style={{cursor:'pointer'}} onClick={()=>setExpanded(expanded===vs.id ? null : vs.id)}>

                      </div>
                      <div className="url-text">{vs.canonicalUrl}</div>
                      <div style={{fontSize:'11px', color:'#6f6f6f', marginTop:2}}>v{vs.version}</div>
                    </td>
                    <td><Tag kind={SYS_TAG_KIND[vs.codeSystem]}>{SYS_NAMES[vs.codeSystem]}</Tag></td>
                    <td>{vs.source}</td>
                    <td>{vs.memberCount}</td>
                  </tr>
                  {expanded === vs.id && (
                    <tr className="expanded">
                      <td colSpan={4} style={{padding:'1rem'}}>
                        <div style={{marginBottom:'.5rem', fontSize:'13px', color:'#6f6f6f'}}>
                          Showing {vs.members.length} of {vs.memberCount} members
                        </div>
                        <table className="data-table" style={{background:'#fff'}}>
                          <thead>
                            <tr>
                              <th>Code</th>
                              <th>Display</th>
                              <th style={{width:'180px'}}></th>
                            </tr>
                          </thead>
                          <tbody>
                            {vs.members.map(mbr => {
                              const mapped = alreadyMappedIds.includes(mbr.conceptId);
                              return (
                                <tr key={mbr.conceptId}>
                                  <td><span className="code-pill">{mbr.code}</span></td>
                                  <td>{mbr.display}</td>
                                  <td style={{textAlign:'right'}}>
                                    <button className="btn btn-ghost btn-xs" disabled={mapped}
                                      title={mapped ? 'Already mapped — edit via the Terminology tab.' : ''}
                                      onClick={()=>{ if(!mapped) onPickConcept(mbr.conceptId); }}>
                                      {mapped ? 'Already mapped' : 'Use this code'}
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

                <td><span className="code-pill">{r.et}</span></td>
                <td>{r.eid}</td>
                <td><Tag kind={SYS_TAG_KIND[r.sys]}>{SYS_NAMES[r.sys]}</Tag></td>
                <td><span className="code-pill">{r.code}</span></td>
                <td>{r.pri ? <Tag kind="green" icon="check">Yes</Tag> : <span style={{color:'#6f6f6f'}}>—</span>}</td>
                <td>{statusTag[r.status]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {errorCount > 0 && (
        <div className="notif notif-warning">
          <Icon name="warn"/>
          <div>
            <div className="notif-title">{errorCount} row(s) could not be matched</div>
            <div style={{fontSize:'13px', color:'#525252', marginTop:2}}>Check "Skip error rows" to proceed with the remaining rows, or fix the CSV and re-upload.</div>
          </div>
        </div>
      )}

      <div style={{display:'flex', gap:'1rem', alignItems:'center', marginTop:'1rem'}}>
        <label className="cbox-item" style={{marginTop:0}}>
          <input type="checkbox" checked={skipErrors} onChange={(e)=>setSkipErrors(e.target.checked)}/>
          Skip error rows
        </label>
        <button className="btn btn-primary" disabled={errorCount > 0 && !skipErrors}>
          Apply Import
        </button>
      </div>
    </>
  );
}

function TerminologyAdminPage() {
  const [tab, setTab] = useState('concepts');

  return (
    <div className="admin-frame">
      <div className="breadcrumb">
        <a>Admin</a><span className="sep">/</span>
        <span>Terminology</span>
      </div>
      <div className="admin-hero">
        <h2>Terminology</h2>
        <p>Local Concept cache, cached Value Sets, and bulk import for multi-coding mappings.</p>
      </div>

      <div className="tabs">
        <div className={'tab-item' + (tab==='concepts' ? ' active' : '')} onClick={()=>setTab('concepts')}>Concepts</div>
        <div className={'tab-item' + (tab==='valueSets' ? ' active' : '')} onClick={()=>setTab('valueSets')}>Value Sets</div>
        <div className={'tab-item' + (tab==='bulk' ? ' active' : '')} onClick={()=>setTab('bulk')}>Bulk Mappings</div>
      </div>

      {tab === 'concepts' && <ConceptsTab/>}
      {tab === 'valueSets' && <ValueSetsTab/>}
      {tab === 'bulk' && <BulkMappingsTab/>}
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState('terminology-tab');

  const toggle = (
    <div className="view-switcher">
      <strong>Mockup view</strong>
      <button className={'btn btn-sm ' + (screen==='terminology-tab' ? 'btn-primary' : 'btn-ghost')}
        onClick={()=>setScreen('terminology-tab')}>
        Test Editor → Terminology Tab
      </button>
      <button className={'btn btn-sm ' + (screen==='admin-page' ? 'btn-primary' : 'btn-ghost')}
        onClick={()=>setScreen('admin-page')}>
        Admin → Terminology
      </button>
    </div>
  );

  return (
    <>
      {toggle}
      {screen === 'terminology-tab' && <TestEditorTerminologyTab/>}
      {screen === 'admin-page' && <TerminologyAdminPage/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
