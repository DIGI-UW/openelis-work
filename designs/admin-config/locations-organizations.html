        {showCompare && open && <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1px', background: '#e0e0e0', fontSize: '.875rem', marginTop: '.25rem' }}>

    // ---------- List view ----------
    function ListView({ view, data, setData, byId, notify, go, audit, historyOf }) {
      const cfg = VIEWS[view];
      const [q, setQ] = useState('');
      const [types, setTypes] = useState([]);
      const [cats, setCats] = useState([]);
      const [owns, setOwns] = useState([]);
      const [overdueOnly, setOverdueOnly] = useState(false);
      const [status, setStatus] = useState('active');
      const [expanded, setExpanded] = useState(null);
      const [adding, setAdding] = useState(false);
      const [sel, setSel] = useState([]);
      const [guard, setGuard] = useState(null);
      const [locFilter, setLocFilter] = useState('');
      const [sortBy, setSortBy] = useState('name');
      useEffect(() => {
        if (view !== 'facilities' || !q.trim()) return;
        const ql2 = q.trim().toLowerCase();
        const w = data.find(r => kindOf(r) === 'unit' && [r.name, r.code].some(v => v && v.toLowerCase().includes(ql2)));
        const directHit = data.some(r => kindOf(r) === 'facility' && [r.name, r.code].some(v => v && v.toLowerCase().includes(ql2)));
        if (w && !directHit) setExpanded(w.parent);
      }, [q]);

      const typeOptions = TYPES.filter(x => cfg.kinds.includes(x.kind));
      const ql = q.trim().toLowerCase();
      const has = v => v && v.toLowerCase().includes(ql);
      // Why a record matched: name/code first, then identifiers, former names, other-language names
      const matchNote = r => {
        if (!ql || has(r.name) || has(r.code) || has(r.shortName)) return null;
        const id = (r.ids || []).find(i => has(i.value)); if (id) return `${id.label} ${id.value}`;
        const fn = (r.formerNames || []).find(has); if (fn) return t('label.locations.history.formerly', `Formerly ${fn}`);
        return null;
      };
      const matches = r => !ql || has(r.name) || has(r.code) || has(r.shortName) || !!matchNote(r);
      const statusOk = r => status === 'all' || (status === 'active' ? r.active : !r.active);
      const childrenOf = id => data.filter(r => r.parent === id);
      const unitsOf = id => data.filter(r => r.parent === id && kindOf(r) === 'unit');

      let rows = data.filter(r => {
        const k = kindOf(r);
        if (!cfg.kinds.includes(k)) return false;
        if (types.length && !r.types.some(x => types.includes(x))) return false;
        if (cats.length && !cats.includes(r.cat)) return false;
        if (owns.length && !owns.includes(r.own)) return false;
        if (overdueOnly && !(refOverdue(r) || refExpired(r))) return false;
        if (!statusOk(r)) return false;
        if (locFilter && !pathIds(byId, r.parent).includes(locFilter)) return false;
        if (view === 'facilities' && ql) return matches(r) || unitsOf(r.id).some(matches);
        return matches(r);
      });
      const exact = r => ql && ((r.code || '').toLowerCase() === ql || (r.ids || []).some(i => i.value.toLowerCase() === ql)) ? 1 : 0;
      rows.sort((a, b) => exact(b) - exact(a) || (sortBy === 'location' ? pathText(byId, a.parent).localeCompare(pathText(byId, b.parent)) : 0) || a.name.localeCompare(b.name));

      const update = (id, patch) => setData(d => d.map(r => r.id === id ? { ...r, ...patch } : r));
      const setActive = (ids, on) => setData(d => d.map(r => ids.includes(r.id) ? { ...r, active: on } : r));
      // Every deactivation gets an Undo link (FR-E4)
      const deactivateWithUndo = (ids, label) => {

      };
      const askDeactivate = r => {
        const kids = childrenOf(r.id).filter(c => c.active);
        if ((r.open || 0) > 0 || kids.length) { setGuard({ r, kids }); } else deactivateWithUndo([r.id], r.name);

      const reactivate = r => {
        const p = byId[r.parent];
        if (p && !p.active) return notify(t('error.locations.reactivate.parentInactive', `Reactivate ${p.name} first.`), 'error');
        update(r.id, { active: true }); audit(r.id, 'Reactivated', [['Active', 'No', 'Yes']]); notify(`${r.name} reactivated.`);
      };
      const colsExtra = view === 'sites' ? 'siteType' : 'units';
      const nCols = 8;
      const kidLabel = r => kindOf(r) === 'facility' ? 'wards / depts' : 'records';
      const selRecs = sel.map(id => byId[id]).filter(Boolean);

      return (

            </>}

                <th style={{ cursor: 'pointer' }} onClick={() => setSortBy(sortBy === 'location' ? 'name' : 'location')} aria-sort={sortBy === 'location' ? 'ascending' : 'none'}>{t('label.locations.column.location', 'Location')} {sortBy === 'location' ? '▲' : <span className="sub">⇅</span>}</th>
                <th>{colsExtra === 'siteType' ? t('label.locations.column.siteType', 'Site type') : t('label.locations.column.wards', 'Wards / Depts')}</th>
                <th>{t('label.locations.column.inUse', 'In use')}</th><th style={{ width: 130 }}>{t('label.locations.column.active', 'Active')}</th><th style={{ width: 80 }}>{t('label.locations.column.actions', 'Actions')}</th>
              </tr></thead>
              <tbody>
                {adding && <tr><td colSpan={nCols + 1} className="expand-cell"><RecordForm isNew kind={view === 'sites' ? 'site' : 'facility'} data={data} byId={byId} notify={notify}
                  onCancel={() => setAdding(false)} onSave={rec => { const id = 'n' + (seq++); setData(d => [{ ...rec, id, inUse: 0, open: 0 }, ...d]); audit(id, 'Created'); setAdding(false); setExpanded(id); notify(`${rec.name} added.`); }} /></td></tr>}
                {rows.map(r => {
                  const isExp = expanded === r.id;
                  const k = kindOf(r);
                  const units = unitsOf(r.id);
                  const note = matchNote(r);
                  return (
                    <React.Fragment key={r.id}>
                      <tr className={`${isExp ? 'expanded' : ''}`}>
                        <td><input type="checkbox" aria-label={`Select ${r.name}`} checked={sel.includes(r.id)} onChange={() => setSel(sel.includes(r.id) ? sel.filter(x => x !== r.id) : [...sel, r.id])} /></td>
                        <td>{r.name} {r.registry && <span title={REG_HELP}><Tag kind="cyan">{t('label.locations.source.registry', 'Registry')} ⓘ</Tag></span>}
                          {refOverdue(r) && <Tag kind="red">{t('label.locations.referral.overdue', 'Review overdue')}</Tag>}
                          {refExpired(r) && <Tag kind="warm-gray">{t('label.locations.referral.expired', 'Accreditation expired')}</Tag>}
                          {note && <div className="sub">{note}</div>}</td>
                        <td className="code">{r.code || <span className="sub">none</span>}</td>
                        <td>{r.types.map(x => <Tag key={x} kind={typeById[x].kind === 'site' ? 'teal' : 'blue'}>{typeById[x].label}</Tag>)}{r.cat && <div className="sub">{r.cat}{r.own ? ` · ${r.own}` : ''}</div>}</td>
                        <td><LocationCell byId={byId} id={r.parent} /></td>
                        <td>{colsExtra === 'siteType' ? r.siteType : units.filter(u => u.active).length}</td>
                        <td>{r.inUse ? <span>{r.inUse.toLocaleString()} <span className="sub">({r.open || 0} open)</span></span> : <span className="sub">0</span>}</td>
                        <td title={r.active ? '' : INACTIVE_HELP}><Toggle name={r.name} on={r.active} label={r.active ? 'Active' : 'Inactive'} onChange={on => on ? reactivate(r) : askDeactivate(r)} /></td>
                        <td><Btn kind="ghost" aria-label={`${isExp ? 'Close' : 'Edit'} ${r.name}`} aria-expanded={isExp} onClick={() => { setExpanded(isExp ? null : r.id); setAdding(false); }}>{isExp ? t('button.close', 'Close') : t('button.edit', 'Edit')}</Btn></td>
                      </tr>
                      {isExp && <tr><td colSpan={nCols + 1} className="expand-cell">
                        <RecordForm rec={r} kind={k} data={data} byId={byId} highlight={ql} statusFilter={status} history={historyOf(r.id)}
                          onCancel={() => setExpanded(null)}
                          onSave={(rec, changes) => { update(r.id, rec); if (changes.length) audit(r.id, 'Edited', changes); setExpanded(null); notify(`${rec.name} saved.`); }}
                          onUnits={(fn) => setData(fn)} notify={notify} audit={audit} askDeactivate={askDeactivate} reactivate={reactivate} />
                      </td></tr>}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
            {rows.length === 0 && !adding && <div className="empty">
              <p>{data.some(r => cfg.kinds.includes(kindOf(r))) ? t('message.locations.empty.filtered', 'No records match these filters.') : t('message.locations.empty.none', 'No records yet. Add one, or import a file.')}</p>
              {ql && (() => { const other = Object.entries(VIEWS).filter(([k, v]) => k !== view && v.kinds).map(([k, v]) => [k, v, data.filter(r => v.kinds.includes(kindOf(r)) && matches(r)).length]).filter(x => x[2] > 0);
                return other.map(([k, v, n]) => <p key={k} style={{ marginTop: '.5rem' }}><a href="#" onClick={e => { e.preventDefault(); go(k); }}>{t('message.locations.search.elsewhere', `${n} match${n > 1 ? 'es' : ''} in ${v.label}`)}</a></p>); })()}
              <div style={{ marginTop: '1rem' }}><Btn kind="ghost" onClick={() => { setTypes([]); setCats([]); setOwns([]); setOverdueOnly(false); setStatus('active'); setQ(''); setLocFilter(''); }}>{t('label.locations.filter.clear', 'Clear filters')}</Btn></div>
            </div>}
            <div className="pager"><span>Items per page: 25 &nbsp;|&nbsp; 1 to {rows.length} of {rows.length} records</span><span>Page 1 of 1 &nbsp; ‹ ›</span></div>
          </div>
          {guard && <div className="modal-bg"><div className="modal" role="dialog" aria-modal="true" aria-labelledby="guard-title">
            <div className="hd"><div className="sub">Deactivate</div><h3 id="guard-title">Deactivate {guard.r.name}?</h3></div>
            <div className="bd">
              <p>{t('message.locations.deactivate.inUse', `${guard.r.name} has ${guard.r.open || 0} open orders and ${guard.kids.length} active ${kidLabel(guard.r)}.`)}</p>
              {guard.kids.length > 0 && <ul style={{ margin: '.75rem 0 .75rem 1.25rem', listStyle: 'disc' }}>{guard.kids.map(c => <li key={c.id}>{c.name} <span className="sub">({c.open || 0} open orders)</span></li>)}</ul>}
              {guard.r.registry && <p className="warntxt" style={{ marginBottom: '.5rem' }}>This record comes from the facility registry. The next sync may reactivate it; to close it for good, update the registry.</p>}
              <p className="sub">Open orders keep their {guard.r.name} reference. It stops appearing in order entry and other pickers. Nothing is deleted, and it can be reactivated.</p>
            </div>
            <div className="ft">
              <button className="sec-b" onClick={() => setGuard(null)}>Cancel</button>
              <button className="sec-b" onClick={() => { deactivateWithUndo([guard.r.id], guard.r.name); setGuard(null); }}>{t('button.locations.deactivate.only', `Deactivate ${guard.r.name} only`)}</button>
              {guard.kids.length > 0 && <button className="dan-b" onClick={() => { deactivateWithUndo([guard.r.id, ...guard.kids.map(c => c.id)], `${guard.r.name} and ${guard.kids.length} ${kidLabel(guard.r)}`); setGuard(null); }}>{t('button.locations.deactivate.withChildren', `Deactivate it and its ${guard.kids.length} ${kidLabel(guard.r)}`)}</button>}
            </div>
          </div></div>}
        </div>
      );
    }

    // ---------- Geographic Areas: nested tree table ----------
    function AreasTree({ data, setData, byId, notify, go, audit, historyOf }) {
      const areas = data.filter(r => kindOf(r) === 'area');
      const lvl = r => typeById[r.types[0]].level;
      const kids = id => areas.filter(r => r.parent === id).sort((a, b) => a.name.localeCompare(b.name));
      const placed = id => data.filter(r => r.parent === id && kindOf(r) !== 'area' && kindOf(r) !== 'unit');
      const [open, setOpen] = useState(new Set(areas.filter(r => lvl(r) === 1).map(r => r.id)));
      const [q, setQ] = useState('');
      const [status, setStatus] = useState('active');
      const [focus, setFocus] = useState(null);
      const [editing, setEditing] = useState(null);
      const [adding, setAdding] = useState(null);
      const [nf, setNf] = useState({ name: '', code: '' });
      const ql = q.trim().toLowerCase();
      const statusOk = r => status === 'all' || (status === 'active' ? r.active : !r.active);
      const hit = r => ql && [r.name, r.code, ...(r.formerNames || [])].some(v => v && v.toLowerCase().includes(ql));
      const ancestors = id => { const out = []; let c = byId[id]; while (c && c.parent) { out.push(c.parent); c = byId[c.parent]; } return out; };
      const subtreeSize = id => kids(id).reduce((n, c) => n + 1 + subtreeSize(c.id), 0);
      // When searching: show matches plus their ancestors, ancestors expanded
      const visibleSet = useMemo(() => {
        if (!ql) return null;
        const v = new Set();
        areas.filter(r => hit(r) && statusOk(r)).forEach(r => { v.add(r.id); ancestors(r.id).forEach(a => v.add(a)); });
        return v;
      }, [ql, data, status]);
      const isOpen = id => visibleSet ? visibleSet.has(id) : open.has(id);
      const toggle = id => { const n = new Set(open); n.has(id) ? n.delete(id) : n.add(id); setOpen(n); };
      const roots = focus ? [byId[focus]] : areas.filter(r => lvl(r) === 1);
      const rows = [];
      const walk = (r, depth) => {
        if (visibleSet && !visibleSet.has(r.id)) return;
        if (!visibleSet && !statusOk(r) && depth > 0) return;
        rows.push({ r, depth });
        if (isOpen(r.id)) kids(r.id).forEach(c => walk(c, depth + 1));
      };
      roots.forEach(r => walk(r, 0));
      const path = focus ? [...ancestors(focus).reverse(), focus] : [];
      const update = (id, patch) => setData(d => d.map(r => r.id === id ? { ...r, ...patch } : r));
      const deactivate = r => {
        const ch = kids(r.id).filter(c => c.active).length, pl = placed(r.id).filter(c => c.active).length;
        if (ch || pl) return notify(`${r.name} still has ${ch} active areas inside it and ${pl} active organizations or sites placed in it. Deactivate or move those first.`, 'warning');
        update(r.id, { active: false }); audit(r.id, 'Deactivated', [['Active', 'Yes', 'No']]);
        notify(`${r.name} deactivated.`, 'success', { label: 'Undo', fn: () => { update(r.id, { active: true }); audit(r.id, 'Reactivated (undo)', [['Active', 'No', 'Yes']]); } });
      };
      const canExpandAll = (focus ? subtreeSize(focus) : areas.length) < 500;
      const hl = txt => { if (!ql) return txt; const i = txt.toLowerCase().indexOf(ql); if (i < 0) return txt; return <>{txt.slice(0, i)}<mark style={{ background: '#d0e2ff' }}>{txt.slice(i, i + ql.length)}</mark>{txt.slice(i + ql.length)}</>; };

      return (
        <div>
          <div className="fence">Geographic areas are the same records the address-hierarchy loader creates. Patient address entry and every Location field read from them.</div>
          <div className="toolbar">
            <div className="fld grow"><label>Search</label><input className="inp" placeholder="Search areas by name or code" value={q} onChange={e => setQ(e.target.value)} /></div>
            <div className="fld" style={{ width: 150 }}><label>Status</label>
              <select className="inp" value={status} onChange={e => setStatus(e.target.value)}><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></div>
            <div style={{ display: 'flex', gap: '.5rem' }}>
              <Btn kind="ghost" size="md" disabled={!canExpandAll} title={canExpandAll ? '' : 'Too many areas: focus on a smaller branch first'} onClick={() => setOpen(new Set(areas.map(r => r.id)))}>{t('button.locations.area.expandAll', 'Expand all')}</Btn>
              <Btn kind="ghost" size="md" onClick={() => setOpen(new Set())}>{t('button.locations.area.collapseAll', 'Collapse all')}</Btn>
              <Btn kind="tertiary" size="md" onClick={() => go('import', 'values')}>Import</Btn>
              <Btn kind="tertiary" size="md" onClick={() => notify(`Exported ${focus ? subtreeSize(focus) + 1 : areas.length} areas as address-hierarchy values CSV (Name%Code).`, 'info')}>Export</Btn>
              <Btn size="md" onClick={() => { setAdding(focus || 'root'); setNf({ name: '', code: '' }); }}>+ Add {focus ? AREA_LEVELS[Math.min(lvl(byId[focus]), 3)].name : 'Region'}</Btn>
            </div>
          </div>
          <div style={{ background: '#fff', padding: '.5rem 1rem', fontSize: '.875rem', borderBottom: '1px solid #e0e0e0' }}>
            <span className="sub" style={{ float: 'right' }}>Levels: {AREA_LEVELS.map(l => l.name).join(' > ')}</span>
          </div>
          <div className="tbl-wrap">
            <table className="dt" role="treegrid" aria-label="Geographic areas" onKeyDown={e => {
                const rowsEl = [...e.currentTarget.querySelectorAll('tr[role=row][data-id]')]; const i = rowsEl.indexOf(document.activeElement); if (i < 0) return;
                const id = rowsEl[i].dataset.id;
                if (e.key === 'ArrowDown' && rowsEl[i + 1]) { e.preventDefault(); rowsEl[i + 1].focus(); }
                if (e.key === 'ArrowUp' && rowsEl[i - 1]) { e.preventDefault(); rowsEl[i - 1].focus(); }
                if (e.key === 'ArrowRight' && kids(id).length && !isOpen(id)) { e.preventDefault(); toggle(id); }
                if (e.key === 'ArrowLeft') { e.preventDefault(); if (isOpen(id) && kids(id).length) toggle(id); else { const p = byId[id].parent; const pe = rowsEl.find(r => r.dataset.id === p); if (pe) pe.focus(); } }
                if (e.key === 'Enter') { e.preventDefault(); setEditing(editing === id ? null : id); }
              }}>
              <thead><tr role="row"><th>Name</th><th>Code</th><th>Level</th><th>Child areas</th><th style={{ width: 140 }}>{t('label.locations.column.active', 'Active')}</th><th style={{ width: 200 }}>{t('label.locations.column.actions', 'Actions')}</th></tr></thead>
              <tbody>
                {adding === 'root' && <AddAreaRow depth={0} level={1} nf={nf} setNf={setNf} onCancel={() => setAdding(null)} onSave={() => { setData(d => [...d, { id: 'n' + (seq++), name: nf.name, code: nf.code, types: ['L1'], parent: null, active: true, inUse: 0 }]); setAdding(null); notify(`${nf.name} added.`); }} />}
                {rows.map(({ r, depth }) => {
                  const ch = kids(r.id), pl = placed(r.id), L = lvl(r);
                  return <React.Fragment key={r.id}>
                    <tr className="row" role="row" data-id={r.id} tabIndex={0} aria-level={L} aria-expanded={ch.length ? isOpen(r.id) : undefined} aria-label={`${r.name}, ${typeById[r.types[0]].label}${r.active ? '' : ', inactive'}`} style={hit(r) ? { background: '#edf5ff' } : {}} onClick={() => ch.length && !visibleSet && toggle(r.id)}>
                      <td style={{ paddingLeft: `${1 + depth * 1.5}rem` }}>
                        <span style={{ display: 'inline-block', width: 18, color: ch.length ? '#161616' : 'transparent' }}>{isOpen(r.id) ? '▾' : '▸'}</span>
                        {depth > 0 && <span style={{ color: '#c6c6c6', marginRight: 6 }}>└</span>}
                        <span style={L === 1 ? { fontWeight: 600 } : {}}>{hl(r.name)}</span>
                      </td>
                      <td className="code">{r.code ? hl(r.code) : <span className="sub">none</span>}</td>
                      <td><Tag kind="warm-gray">{L}. {typeById[r.types[0]].label}</Tag></td>
                      <td>{ch.length || <span className="sub">0</span>}</td>
                      <td onClick={e => e.stopPropagation()}><Toggle name={r.name} on={r.active} label={r.active ? 'Active' : 'Inactive'} onChange={on => on
                        ? (() => { const p = byId[r.parent]; if (p && !p.active) return notify(`Reactivate ${p.name} first.`, 'error'); update(r.id, { active: true }); notify(`${r.name} reactivated.`); })()
                        : deactivate(r)} /></td>
                      <td onClick={e => e.stopPropagation()}><span style={{ display: 'flex', gap: '.25rem' }}>
                        {L < 4 && r.active && <Btn kind="ghost" title={`Add a ${AREA_LEVELS[L].name} inside ${r.name}`} onClick={() => { setAdding(r.id); setNf({ name: '', code: '' }); const n = new Set(open); n.add(r.id); setOpen(n); }}>+ {AREA_LEVELS[L].name}</Btn>}
                        <Btn kind="ghost" aria-label={`Edit ${r.name}`} onClick={() => setEditing(editing === r.id ? null : r.id)}>{t('button.edit', 'Edit')}</Btn>
                      </span></td>
                    </tr>
                    {editing === r.id && <tr><td colSpan={7} className="expand-cell"><RecordForm rec={r} kind="area" data={data} byId={byId} notify={notify} audit={audit} history={historyOf(r.id)} onCancel={() => setEditing(null)} onSave={(rec, ch) => { update(r.id, rec); if (ch.length) audit(r.id, 'Edited', ch); setEditing(null); notify(`${rec.name} saved.${rec.formerNames && rec.formerNames.length > (r.formerNames || []).length ? ' The old name is kept in history and still matches in search.' : ''}`); }} /></td></tr>}
                    {adding === r.id && <AddAreaRow depth={depth + 1} level={L + 1} nf={nf} setNf={setNf} parentName={r.name} onCancel={() => setAdding(null)} onSave={() => { setData(d => [...d, { id: 'n' + (seq++), name: nf.name, code: nf.code, types: ['L' + (L + 1)], parent: r.id, active: true, inUse: 0 }]); setAdding(null); notify(`${nf.name} added under ${r.name}.`); }} />}
                  </React.Fragment>;
                })}
              </tbody>
            </table>
            {rows.length === 0 && <div className="empty"><p>No areas match "{q}".</p></div>}
            <div className="pager"><span>{ql ? `${areas.filter(r => hit(r) && statusOk(r)).length} matches, shown with the areas they sit in` : `${areas.length} areas across ${AREA_LEVELS.length} levels. Children load when a row is expanded.`}</span><span></span></div>
          </div>
        </div>
      );
    }
    function AddAreaRow({ depth, level, nf, setNf, onCancel, onSave, parentName }) {
      return <tr><td colSpan={7} style={{ background: '#f4f4f4', paddingLeft: `${1 + depth * 1.5}rem` }}>
        <div style={{ display: 'flex', gap: '.75rem', alignItems: 'flex-end' }}>
          <div className="fld" style={{ width: 280 }}><label>New {AREA_LEVELS[level - 1].name}{parentName ? ` in ${parentName}` : ''} *</label><input className="inp white" autoFocus value={nf.name} onChange={e => setNf({ ...nf, name: e.target.value })} /></div>
          <div className="fld" style={{ width: 160 }}><label>Code</label><input className="inp white code" value={nf.code} onChange={e => setNf({ ...nf, code: e.target.value })} /></div>
          <Btn disabled={!nf.name.trim()} onClick={onSave}>Save</Btn><Btn kind="ghost" onClick={onCancel}>Cancel</Btn>
        </div></td></tr>;
    }

    // ---------- History (audit trail) ----------
    function HistoryPanel({ name, entries }) {
      const [f, setF] = useState('all');
      const actions = [...new Set(entries.map(e => e.action))];
      const shown = f === 'all' ? entries : entries.filter(e => e.action === f);
      return <div className="sec" style={{ background: '#fff', padding: '1rem', border: '1px solid #e0e0e0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '.5rem' }}><h4 style={{ margin: 0, border: 'none' }}>{t('label.locations.history.title', `History of ${name}`)}</h4>
          <select className="inp" style={{ width: 220, height: 32 }} value={f} onChange={e => setF(e.target.value)} aria-label="Filter history by action"><option value="all">All changes</option>{actions.map(a => <option key={a}>{a}</option>)}</select>
          <span className="sub">Read-only. Kept for as long as the record exists.</span></div>
        <ol style={{ listStyle: 'none', margin: 0, padding: 0 }}>
          {shown.map((e, i) => <li key={i} style={{ borderLeft: '2px solid #0f62fe', padding: '.25rem 0 .75rem 1rem', position: 'relative' }}>
            <div style={{ fontSize: '.875rem' }}><b>{e.action}</b> <span className="sub">· {e.when} · {e.who}{e.note ? ` · ${e.note}` : ''}</span></div>
            {e.changes && e.changes.length > 0 && <table className="units" style={{ marginTop: '.25rem', width: 'auto' }}><tbody>{e.changes.map((c, j) => <tr key={j}><td style={{ paddingLeft: 0 }}>{c[0]}</td><td className="diff-old">{c[1] || '(empty)'}</td><td>→</td><td className="diff-new">{c[2] || '(empty)'}</td></tr>)}</tbody></table>}
          </li>)}
        </ol>
      </div>;
    }

    // ---------- Record form (inline expansion) ----------
    const FIELD_LABELS = { name: 'Name', code: 'Code', shortName: 'Short name', desc: 'Description', parent: 'Location', street: 'Street address', city: 'City', state: 'State / Province', lat: 'GPS latitude', lng: 'GPS longitude', contact: 'Contact name', phone: 'Phone', email: 'Email', web: 'Website', cat: 'Category', own: 'Ownership', siteType: 'Site type', subtype: 'Subtype', zone: 'Environmental zone' };
    function diffRecord(a, b, byId) {
      const out = [];
      Object.keys(FIELD_LABELS).forEach(k => { if ((a[k] || '') !== (b[k] || '')) out.push([FIELD_LABELS[k], k === 'parent' ? (a[k] ? byId[a[k]].name : '') : a[k], k === 'parent' ? (b[k] ? byId[b[k]].name : '') : b[k]]); });
      if (JSON.stringify(a.ids || []) !== JSON.stringify(b.ids || [])) out.push(['Identifiers', (a.ids || []).map(i => `${i.label} ${i.value}`).join(', '), (b.ids || []).map(i => `${i.label} ${i.value}`).join(', ')]);
      if (JSON.stringify(a.ref || {}) !== JSON.stringify(b.ref || {})) Object.keys({ ...(a.ref || {}), ...(b.ref || {}) }).forEach(k => { if (((a.ref || {})[k] || '') !== ((b.ref || {})[k] || '')) out.push([`Referral: ${k}`, (a.ref || {})[k], (b.ref || {})[k]]); });
      return out;
    }
    function RecordForm({ rec, isNew, kind, areaLevel, data, byId, onCancel, onSave, onUnits, notify, audit, highlight, statusFilter, askDeactivate, reactivate, history }) {
      const [f, setF] = useState(rec ? { ...rec, ids: [...(rec.ids || [])], ref: rec.ref ? { ...rec.ref } : undefined } : { name: '', code: '', ids: [], types: kind === 'site' ? ['ss'] : kind === 'area' ? ['L' + areaLevel] : ['rc'], parent: null, active: true });
      const [tried, setTried] = useState(false);
      const [showHist, setShowHist] = useState(false);
      const set = k => e => setF({ ...f, [k]: e && e.target ? (e.target.type === 'checkbox' ? e.target.checked : e.target.value) : e });
      const setRef = k => e => setF({ ...f, ref: { ...(f.ref || {}), [k]: e.target.value } });
      const areaOpts = data.filter(r => kindOf(r) === 'area').map(r => ({ id: r.id, label: r.name, sub: `${typeById[r.types[0]].label}${r.code ? ' · ' + r.code : ''}` }));
      const lvl = kind === 'area' ? typeById[f.types[0]].level : null;
      const parentOpts0 = kind === 'area' ? areaOpts.filter(o => typeById[byId[o.id].types[0]].level === lvl - 1) : areaOpts.filter(o => byId[o.id].active);
      const parentOpts = parentOpts0.map(o => ({ ...o, sub: `${o.sub} · ${pathText(byId, byId[o.id].parent) || 'top level'}` }));
      // Identifiers: reporting code is f.code; others in f.ids
      const allIds = [{ label: f.codeLabel || 'Code', value: f.code || '', reporting: true }, ...(f.ids || []).map(i => ({ ...i, reporting: false }))];
      const same = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
      const idClash = i => i.value && data.find(r => r.id !== f.id && kindOf(r) === kind && ((same(i.label, r.codeLabel || 'Code') && same(r.code, i.value)) || (r.ids || []).some(x => same(x.label, i.label) && same(x.value, i.value))));
      const suggestions = labelSuggestions(data);
      const dupName = f.name && data.find(r => r.id !== f.id && r.active && r.name.toLowerCase() === f.name.trim().toLowerCase() && r.types.some(x => f.types.includes(x)) && r.parent === f.parent);

                <td><input type="radio" name={`rep-${f.id || 'new'}`} checked={i.reporting} aria-label={`Use ${i.label || 'this identifier'} as reporting code`} onChange={() => { const others = allIds.filter((_, j) => j !== n).map(x => ({ label: x.label, value: x.value })).filter(x => x.value); setF({ ...f, code: i.value, codeLabel: i.label, ids: others }); }} /></td>

                    : <Btn kind="ghost" aria-label={`Edit ${u.name}`} onClick={() => { setEditing(u.id); setWf({ ...u }); }}>Edit</Btn>}</td>

                  <td className="sub">{rec.lat ? 'inherits' : ''}</td><td className="sub">new</td><td><Tag kind="blue">Draft</Tag></td>
                  <td><Btn kind="ghost" onClick={() => setNewUnits(newUnits.filter((_, j) => j !== i))}>Remove</Btn></td></tr>)}
              </tbody></table>
            <div className="actions">

              {newUnits.length > 0 && <Btn kind="secondary" disabled={newUnits.some(u => !u.name.trim() || !u.svc)} onClick={() => { const created = newUnits.map(u => ({ id: 'n' + (seq++), name: u.name.trim(), code: u.code.trim(), svc: u.svc, contact: u.contact.trim(), phone: u.phone.trim(), email: u.email.trim(), types: ['dept'], parent: rec.id, active: true, inUse: 0, open: 0 })); onUnits(d => [...d, ...created]); audit(created.map(c => c.id), 'Created'); notify(`${newUnits.length} ward / dept record(s) added to ${rec.name}.`); setNewUnits([]); }}>Save {newUnits.length} new ward / dept{newUnits.length > 1 ? 's' : ''}</Btn>}
            </div></div>}

          {showHist && history && <HistoryPanel name={rec.name} entries={history} />}

          <div className="sticky-bar">
            <Btn onClick={save}>{t('button.save', 'Save')}</Btn>
            <Btn kind="ghost" onClick={onCancel}>{t('button.cancel', 'Cancel')}</Btn>
            {!isNew && history && <Btn kind="ghost" aria-expanded={showHist} onClick={() => setShowHist(!showHist)}>{showHist ? 'Hide history' : `${t('button.locations.history', 'History')} (${history.length})`}</Btn>}
            {tried && !ok && <span className="errtxt" style={{ alignSelf: 'center' }}>Fix the highlighted fields to save.</span>}
            {!isNew && <span className="sub" style={{ alignSelf: 'center', marginLeft: 'auto' }}>Internal id {rec.id} · FHIR UUID kept on every change</span>}
          </div>
        </div>
      );
    }

    // ---------- Import / Export ----------
    const PREVIEW_ROWS = [
      { line: 2, outcome: 'updated', type: 'referring clinic', code: 'PMGH', name: 'Port Moresby General Hospital', match: 'code', target: 'f1', diffs: [['Phone', '+675 324 8200', '+675 324 8248'], ['Contact name', 'Dr. Anna Kila', 'Dr. Joseph Tamu']] },

      { line: 12, outcome: 'rejected', type: 'referring clinic', code: 'NCD-BAD', name: 'Badili Clinic', reason: 'GPS latitude "9,47" is not decimal degrees' },
      { line: 13, outcome: 'rename', type: 'referring clinic', code: '', name: 'Tokarara Urban Clinic', parent: 'Moresby North-West', pair: 'f3' },
      { line: 14, outcome: 'updated', type: 'referring clinic', code: 'MHPH', name: 'Mount Hagen Provincial Hospital', match: 'code', target: 'f7', registry: true, diffs: [['Name', 'Mount Hagen Provincial Hospital', 'Mt Hagen Provincial Hospital'], ['Phone', '(none)', '+675 542 1311']] },
    ];
    const CANDIDATES = {
      c1: { name: 'Outpatient Department', code: '', parent: 'Gerehu General Hospital', active: true, inUse: 1402 },
      c2: { name: 'Outpatient department', code: 'GGH-OPD-OLD', parent: 'Gerehu General Hospital', active: false, inUse: 96 },
      f8: { name: '9 Mile Urban Clinic', code: 'NCD-9MC', parent: 'Moresby North-East', active: true, inUse: 1377 },
      c3: { name: '9 Mile  Urban Clinic', code: '', parent: 'Moresby North-East', active: true, inUse: 26 },
    };

    function ImportPage({ data, setData, byId, notify, presetArea, audit }) {
      const [files, setFiles] = useState([]);
      const [mode, setMode] = useState('replace');
      const [stage, setStage] = useState('setup');
      const [filter, setFilter] = useState('all');
      const [open, setOpen] = useState(null);
      const [dec, setDec] = useState({});
      const [remember, setRemember] = useState({});
      const [ack, setAck] = useState(false);
      const [confirm, setConfirm] = useState(false);
      const [runs, setRuns] = useState([
        { when: '2026-09-02 10:14', who: 'admin.ndoh', files: 'png-levels.csv, png-values.csv', mode: 'Add & update', counts: '4 levels, 437 areas new' },
        { when: '2026-08-19 15:40', who: 'admin.ndoh', files: 'organizations-png-2026-08.csv', mode: 'Add & update', counts: '862 new, 0 updated, 3 rejected' },
      ]);
      const addSample = () => setFiles([
        { name: 'organizations-png-2026-09.csv', area: 'organizations', rows: 11 },
      ]);
      useEffect(() => { if (presetArea === 'values') setFiles([{ name: 'png-values.csv', area: 'values', rows: 412 }]); }, [presetArea]);

      // Replace scope: (a) types in the file, (b) wards / depts only under organizations with ward rows in the file, (c) never registry records
      const [ren, setRen] = useState({});
      const inFileTypes = ['rc', 'dept'];
      const wardParents = ['f1', 'f4']; // PMGH (lines 3-4) and Gerehu (line 9) have ward / dept rows
      const matched = new Set(PREVIEW_ROWS.map(r => r.target).filter(Boolean).concat(['f8', 'f9', 'u2', 'u3']));
      const renameRows = PREVIEW_ROWS.filter(r => r.outcome === 'rename');
      const pendingPair = new Set(renameRows.filter(r => ren[r.line] !== 'different').map(r => r.pair));
      const inScope = r => r.types.some(x => inFileTypes.includes(x)) && (kindOf(r) !== 'unit' || wardParents.includes(r.parent));
      const toDeactivate = mode === 'replace' ? data.filter(r => r.active && inScope(r) && !matched.has(r.id) && !r.registry && !pendingPair.has(r.id)) : [];
      const rows = PREVIEW_ROWS;
      const counts = {
        new: rows.filter(r => r.outcome === 'new').length + renameRows.filter(r => ren[r.line] === 'different').length,
        updated: rows.filter(r => r.outcome === 'updated').length + renameRows.filter(r => ren[r.line] === 'same').length,
        unchanged: rows.filter(r => r.outcome === 'unchanged').length + 38, reactivated: mode === 'replace' ? rows.filter(r => r.outcome === 'reactivated').length : 0,
        deactivated: toDeactivate.length, decision: rows.filter(r => r.outcome === 'decision' || r.outcome === 'rename').length, rejected: rows.filter(r => r.outcome === 'rejected').length,
      };
      const undecided = rows.filter(r => (r.outcome === 'decision' && !dec[r.line]) || (r.outcome === 'rename' && !ren[r.line])).length;
      const LBL = { new: 'New', updated: 'Updated', unchanged: 'Unchanged', reactivated: 'Reactivated', deactivated: 'Deactivated', decision: 'Needs decision', rejected: 'Rejected', rename: 'Possible rename' };
      const TAGK = { new: 'green', updated: 'blue', unchanged: 'gray', reactivated: 'teal', deactivated: 'warm-gray', decision: 'purple', rejected: 'red', rename: 'magenta' };
      const shown = filter === 'all' ? rows : filter === 'deactivated' ? [] : filter === 'decision' ? rows.filter(r => r.outcome === 'decision' || r.outcome === 'rename') : rows.filter(r => r.outcome === filter);
      const scopeSentence = mode === 'replace'
        ? t('label.locations.import.replaceScope', 'This file has Referring clinic and Ward / Dept rows. Referral labs, sampling sites and geographic areas will not change. Wards / depts will only be replaced at Port Moresby General Hospital and Gerehu General Hospital. Registry records are never deactivated.')
        : 'Only records in the file are added or updated. Nothing is deactivated.';

      const apply = () => {
        const touched = ['f1', 'f4', ...(mode === 'replace' ? ['f5'] : []), ...(ren[13] === 'same' ? ['f3'] : []), ...toDeactivate.map(x => x.id)];
        audit(touched, 'Changed by import run #14', []);
        setData(d => d.map(r => {
          if (toDeactivate.some(x => x.id === r.id)) return { ...r, active: false };
          if (r.id === 'f1') return { ...r, phone: '+675 324 8248', contact: 'Dr. Joseph Tamu' };
          if (r.id === 'f4') return { ...r, code: 'GGH' };
          if (r.id === 'f5' && mode === 'replace') return { ...r, active: true };
          if (r.id === 'f3' && ren[13] === 'same') return { ...r, name: 'Tokarara Urban Clinic' };
          return r;
        }).concat([
          { id: 'n' + (seq++), name: 'Eye Clinic', code: 'PMGH-EYE', types: ['dept'], parent: 'f1', active: true, inUse: 0, open: 0 },
          { id: 'n' + (seq++), name: 'Butibam Health Centre', code: 'LAE-BHC', types: ['rc'], parent: 'a22', active: true, inUse: 0, open: 0 },
        ]));
        setRuns([{ no: 14, when: '2026-09-27 14:02', who: 'casey', undoable: true, files: files.map(f => f.name).join(', '), mode: mode === 'replace' ? 'Replace' : 'Add & update', counts: `${counts.new} new, ${counts.updated} updated, ${counts.reactivated} reactivated, ${counts.deactivated} deactivated, ${counts.rejected} rejected` }, ...runs]);
        setConfirm(false); setStage('done');
      };

      if (stage === 'done') return (
        <div>
          <div className="panel">
            <h3>Import complete</h3>
            <p style={{ fontSize: '.875rem' }}>{counts.new} created, {counts.updated} updated, {counts.reactivated} reactivated, {counts.deactivated} deactivated, {counts.rejected} rows skipped. Decisions on {counts.decision} rows were applied{Object.values(remember).some(Boolean) ? ', and remembered names will resolve automatically next time' : ''}.</p>
            <div className="actions"><Btn kind="tertiary">{t('button.locations.import.report', 'Download result report')}</Btn><Btn kind="ghost" onClick={() => { setStage('setup'); setFiles([]); setDec({}); setAck(false); }}>Start another import</Btn></div>
          </div>
          <RecentRuns runs={runs} />

        </div>
      );

      return (
        <div>
          {stage === 'setup' && <>
            <div className="panel">
              <h3>1. Files</h3>
              <div className="drop" onClick={addSample}>Drag CSV files here or click to browse (click to add the sample file)<div className="sub" style={{ marginTop: '.25rem' }}>Same formats as the configuration loader: organizations-*.csv, *-levels.csv, *-values.csv</div></div>
              {files.length > 0 && <table className="units" style={{ marginTop: '.75rem' }}><thead><tr><th>File</th><th>{t('label.locations.import.area', 'Area')}</th><th>Rows</th><th></th></tr></thead><tbody>
                {files.map((f, i) => <tr key={f.name}><td>{f.name}</td><td><select className="inp" style={{ height: 32 }} value={f.area} onChange={e => setFiles(files.map((x, j) => j === i ? { ...x, area: e.target.value } : x))}>
                  <option value="organizations">{t('label.locations.import.area.organizations', 'Organizations, wards & sites')}</option><option value="levels">{t('label.locations.import.area.levels', 'Geographic levels')}</option><option value="values">{t('label.locations.import.area.values', 'Geographic areas')}</option></select></td><td>{f.rows}</td>
                  <td><Btn kind="ghost" onClick={() => setFiles(files.filter((_, j) => j !== i))}>Remove</Btn></td></tr>)}</tbody></table>}
              <div className="actions" style={{ marginTop: '.75rem' }}><Btn kind="ghost">{t('button.locations.template', 'Download template')}</Btn><Btn kind="ghost" onClick={() => notify('Exported 1,312 records (all kinds) as organizations CSV.', 'info')}>Export everything</Btn></div>
            </div>
            <div className="panel">
              <h3>2. {t('label.locations.import.mode', 'Import mode')}</h3>
              <div style={{ display: 'flex', gap: '1rem' }}>
                {[['merge', t('label.locations.import.mode.merge', 'Add & update'), t('help.locations.import.mode.merge', 'Add new records and update matching ones. Nothing else changes.')],
                  ['replace', t('label.locations.import.mode.replace', 'Replace'), t('help.locations.import.mode.replace', 'Also deactivate records of the types in this file that the file does not include. Nothing is deleted.')]].map(([k, l, h]) =>
                  <div key={k} className={`radio-card ${mode === k ? 'sel' : ''}`} onClick={() => setMode(k)}><label style={{ display: 'flex', gap: '.5rem', alignItems: 'center' }}><input type="radio" checked={mode === k} readOnly /><b>{l}</b></label><div className="sub" style={{ marginTop: '.25rem', marginLeft: '1.25rem' }}>{h}</div></div>)}
              </div>
              {files.length > 0 && <div className="cds--inline-notification cds--inline-notification--info" style={{ maxWidth: '100%', marginTop: '.75rem' }}><div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper"><div className="cds--inline-notification__subtitle"><b>For this file:</b> {scopeSentence}</div></div></div></div>}
              <p className="helper" style={{ marginTop: '.75rem' }}>Rows match existing records by code within type, then by name within type and parent. Matched records keep their internal identity. Blank cells leave stored values unchanged.</p>
            </div>
            <div className="actions"><Btn size="md" disabled={!files.length} onClick={() => setStage('preview')}>{t('button.locations.import.preview', 'Preview')}</Btn><span className="sub" style={{ alignSelf: 'center' }}>Preview saves nothing.</span></div>
            <RecentRuns runs={runs} />
          </>}

          {stage === 'preview' && <>
            <div className="cds--inline-notification cds--inline-notification--info" style={{ maxWidth: '100%', marginBottom: '1rem' }}><div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper"><div className="cds--inline-notification__subtitle">Preview of {files.map(f => f.name).join(', ')} in <b>{mode === 'replace' ? 'Replace' : 'Add & update'}</b> mode. {scopeSentence} Nothing has been saved.</div></div></div></div>
            <div className="tiles">
              {Object.keys(LBL).filter(k => k !== 'rename').map(k => <div key={k} className={`tile ${filter === k ? 'sel' : ''}`} onClick={() => setFilter(filter === k ? 'all' : k)}><div className="n">{counts[k]}</div><div className="l">{LBL[k]}</div></div>)}
            </div>

            {renameRows.length > 0 && <div className="panel" style={{ borderLeft: '3px solid #d02670' }}>
              <h3>{t('label.locations.import.rename.title', 'Possible renames')} ({renameRows.filter(r => !ren[r.line]).length} left)</h3>
              <p className="sub" style={{ marginBottom: '.75rem' }}>A new row looks like an existing record in the same place that the file does not otherwise include. If it is the same place with a new name, keep one record so its order history stays together.</p>
              {renameRows.map(r => { const old = byId[r.pair]; return <div key={r.line} style={{ borderTop: '1px solid #e0e0e0', padding: '.75rem 0' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: '1rem', alignItems: 'center', fontSize: '.875rem' }}>
                  <div className="tile" style={{ cursor: 'default', border: '1px solid #e0e0e0' }}><div className="sub">Existing record</div><b>{old.name}</b><div className="sub">{pathText(byId, old.parent)} · code {old.code || 'none'} · {old.inUse.toLocaleString()} orders ({old.open} open)</div></div>
                  <div className="sub">→</div>
                  <div className="tile" style={{ cursor: 'default', border: '1px solid #e0e0e0' }}><div className="sub">Line {r.line} in the file</div><b>{r.name}</b><div className="sub">{r.parent} · code {r.code || 'none'} · new</div></div>
                </div>
                <div style={{ display: 'flex', gap: '1.5rem', marginTop: '.5rem', fontSize: '.875rem' }}>
                  <label style={{ display: 'flex', gap: '.5rem', alignItems: 'center' }}><input type="radio" name={'rn' + r.line} checked={ren[r.line] === 'same'} onChange={() => setRen({ ...ren, [r.line]: 'same' })} />{t('label.locations.import.rename.same', 'Same place, renamed')} <span className="sub">(update {old.name}, keep its history)</span></label>
                  <label style={{ display: 'flex', gap: '.5rem', alignItems: 'center' }}><input type="radio" name={'rn' + r.line} checked={ren[r.line] === 'different'} onChange={() => setRen({ ...ren, [r.line]: 'different' })} />{t('label.locations.import.rename.different', 'Different places')} <span className="sub">(create new{mode === 'replace' ? `, deactivate ${old.name}` : ''})</span></label>
                </div>
              </div>; })}
            </div>}

            {rows.some(r => r.outcome === 'decision') && <div className="panel" style={{ borderLeft: '3px solid #8a3ffc' }}>
              <h3>{LBL.decision} ({rows.filter(r => r.outcome === 'decision' && !dec[r.line]).length} left)</h3>
              <p className="sub" style={{ marginBottom: '.75rem' }}>These rows have no code and their name matches more than one existing record. Choose what each row should do.</p>
              {rows.filter(r => r.outcome === 'decision').map(r => <div key={r.line} style={{ borderTop: '1px solid #e0e0e0', padding: '.75rem 0' }}>
                <div style={{ fontSize: '.875rem', marginBottom: '.5rem' }}><b>Line {r.line}:</b> {r.type} "{r.name}"{r.parent ? `, parent ${r.parent}` : ''}</div>
                <table className="units"><thead><tr><th></th><th>Candidate</th><th>Code</th><th>Parent / Location</th><th>In use</th><th>Status</th></tr></thead><tbody>
                  {r.candidates.map(c => { const x = CANDIDATES[c]; return <tr key={c}><td><input type="radio" name={'d' + r.line} checked={dec[r.line] === c} onChange={() => setDec({ ...dec, [r.line]: c })} /></td><td>{t('label.locations.import.decision.use', 'Use this record')}: {x.name}</td><td className="code">{x.code || <span className="sub">none</span>}</td><td>{x.parent}</td><td>{x.inUse}</td><td><Status r={x} /></td></tr>; })}
                  <tr><td><input type="radio" name={'d' + r.line} checked={dec[r.line] === 'new'} onChange={() => setDec({ ...dec, [r.line]: 'new' })} /></td><td colSpan={5}>{t('label.locations.import.decision.new', 'Create new')}</td></tr>
                  <tr><td><input type="radio" name={'d' + r.line} checked={dec[r.line] === 'skip'} onChange={() => setDec({ ...dec, [r.line]: 'skip' })} /></td><td colSpan={5}>{t('label.locations.import.decision.skip', 'Skip row')}</td></tr>
                </tbody></table>
                <label style={{ display: 'flex', gap: '.5rem', alignItems: 'center', fontSize: '.8125rem', marginTop: '.5rem' }}><input type="checkbox" disabled={!dec[r.line] || ['new', 'skip'].includes(dec[r.line])} checked={!!remember[r.line]} onChange={e => setRemember({ ...remember, [r.line]: e.target.checked })} />{t('label.locations.import.decision.remember', 'Remember this name')} <span className="sub">(resolves "{r.name}" to the chosen record on future imports)</span></label>
              </div>)}
            </div>}

            {mode === 'replace' && (filter === 'all' || filter === 'deactivated') && <div className="panel" style={{ borderLeft: '3px solid #8e6a00' }}>
              <h3>Will be deactivated ({toDeactivate.length})</h3>
              <p className="sub" style={{ marginBottom: '.5rem' }}>Active records in scope that no row matched: referring clinics, plus wards / depts at Port Moresby General Hospital and Gerehu General Hospital only. They stay on existing orders and reports and can be reactivated.</p>
              <table className="units"><thead><tr><th>Name</th><th>Code</th><th>Type</th><th>Location</th><th>In use</th></tr></thead><tbody>
                {toDeactivate.map(r => <tr key={r.id} style={r.open ? { background: '#fcf4d6' } : {}}><td>{r.name}</td><td className="code">{r.code || <span className="sub">none</span>}</td><td>{typeById[r.types[0]].label}</td><td>{kindOf(r) === 'unit' ? `Ward / dept of ${byId[r.parent].name}` : pathText(byId, r.parent)}</td><td>{r.inUse} {r.open ? <b style={{ color: '#8e6a00' }}>({r.open} open orders)</b> : ''}</td></tr>)}
              </tbody></table>
              <p className="helper" style={{ marginTop: '.5rem' }}>Not deactivated: registry records (Mount Hagen Provincial Hospital), wards / depts at organizations with no ward rows in this file (for example Angau's 4), and any record waiting on a rename decision.</p>
            </div>}

            {filter !== 'deactivated' && <div className="tbl-wrap"><table className="dt">
              <thead><tr><th style={{ width: 60 }}>Line</th><th>Outcome</th><th>Type</th><th>Code</th><th>Name</th><th>Matched by / Detail</th></tr></thead>
              <tbody>{shown.map(r => <React.Fragment key={r.line}>
                <tr className="row" onClick={() => setOpen(open === r.line ? null : r.line)}><td>{r.line}</td><td><Tag kind={TAGK[r.outcome]}>{LBL[r.outcome]}</Tag></td><td>{r.type}</td><td className="code">{r.code || <span className="sub">none</span>}</td><td>{r.name}</td>
                  <td className="sub">{r.outcome === 'rejected' ? <span style={{ color: '#da1e28' }}>{r.reason}</span> : r.match ? <>{`Matched by ${r.match}${r.diffs ? `, ${r.diffs.length} field(s) change` : ''}`}{r.registry && <span style={{ color: '#8e6a00' }}> · Registry record: {t('warning.locations.import.registryOverwrite', 'will be overwritten by the next registry sync')}</span>}</> : r.outcome === 'rename' ? (ren[r.line] ? (ren[r.line] === 'same' ? `Renames ${byId[r.pair].name}` : 'New, separate place') : `Looks like ${byId[r.pair].name}: waiting for decision`) : r.outcome === 'decision' ? (dec[r.line] ? 'Decided' : 'Waiting for decision') : r.parent ? `New, under ${r.parent}` : 'New'}</td></tr>
                {open === r.line && r.diffs && <tr><td colSpan={6} className="expand-cell"><div className="form"><table className="units"><thead><tr><th>Field</th><th>Current</th><th>From file</th></tr></thead><tbody>{r.diffs.map(d => <tr key={d[0]}><td>{d[0]}</td><td className="diff-old">{d[1]}</td><td className="diff-new">{d[2]}</td></tr>)}</tbody></table></div></td></tr>}
              </React.Fragment>)}</tbody></table></div>}

            <div className="actions" style={{ marginTop: '1rem' }}>
              <Btn size="md" disabled={undecided > 0} onClick={() => setConfirm(true)}>{t('button.locations.import.apply', 'Apply')}</Btn>
              <Btn kind="secondary" size="md" onClick={() => setStage('setup')}>Back</Btn>
              {undecided > 0 && <span className="sub" style={{ alignSelf: 'center' }}>Decide {undecided} row{undecided > 1 ? 's' : ''} (renames and ambiguous matches) to enable Apply.</span>}
            </div>
          </>}

          {confirm && <div className="modal-bg"><div className="modal">
            <div className="hd"><div className="sub">Import</div><h3>Apply this import?</h3></div>
            <div className="bd">
              <ul style={{ listStyle: 'disc', marginLeft: '1.25rem', lineHeight: 1.8 }}>
                <li>{counts.new} new records created</li><li>{counts.updated} records updated</li>
                {mode === 'replace' && <li>{counts.reactivated} reactivated, <b>{counts.deactivated} deactivated</b></li>}
                <li>{counts.rejected} rows skipped (in the result report)</li>
              </ul>
              {mode === 'replace' && <label style={{ display: 'flex', gap: '.5rem', alignItems: 'center', marginTop: '1rem' }}><input type="checkbox" checked={ack} onChange={e => setAck(e.target.checked)} />{t('label.locations.import.confirm.replace', `I understand ${counts.deactivated} records will be deactivated`)}</label>}

            </div>
            <div className="ft"><button className="sec-b" onClick={() => setConfirm(false)}>Cancel</button><button className="pri-b" disabled={mode === 'replace' && !ack} onClick={apply}>{t('button.locations.import.apply', 'Apply')}</button></div>
          </div></div>}
        </div>
      );
    }

    function RecentRuns({ runs, onUndo }) {
      return <div className="panel" style={{ marginTop: '1rem' }}><h3>{t('label.locations.import.recent', 'Recent imports')}</h3>
        <table className="units"><thead><tr><th>Run</th><th>When</th><th>By</th><th>Files</th><th>Mode</th><th>Outcome</th><th></th></tr></thead>
          <tbody>{runs.map((r, i) => <tr key={i}><td>#{r.no || 13 - i}</td><td>{r.when}</td><td>{r.who}</td><td>{r.files}</td><td>{r.mode}</td><td>{r.counts}</td>
            <td><a href="#">Report</a></td></tr>)}</tbody></table></div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
