<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Require requesting provider — OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background:#f4f4f4; margin:0; font-family:'IBM Plex Sans', sans-serif; color:#161616; }
    .preview-banner { background:#0f62fe; color:#fff; padding:6px 1rem; font-size:12px; font-family:monospace; }
    .preview-content { padding:1rem 2rem 4rem; max-width:1180px; margin:0 auto; }
    .crumb { font-size:12px; color:#525252; margin:12px 0 4px; }
    .crumb a { color:#0f62fe; text-decoration:none; }
    h1.page { font-size:28px; font-weight:400; margin:4px 0 16px; }
    .modify { background:#c6c6c6; color:#8d8d8d; border:none; padding:12px 40px 12px 16px;
      font-size:14px; margin-bottom:8px; cursor:not-allowed; }
    .modify.on { background:#0f62fe; color:#fff; cursor:pointer; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th { text-align:left; font-size:14px; font-weight:600; background:#e0e0e0; padding:14px 16px; }
    td { padding:14px 16px; font-size:14px; border-bottom:1px solid #e0e0e0; vertical-align:top; }
    tr.existing td { color:#a8a8a8; }
    tr.existing td .desc { color:#a8a8a8; }
    .desc { color:#525252; }
    tr.newrow { background:#edf5ff; }
    tr.newrow td { border-bottom:1px solid #d0e2ff; }
    tr.newrow.selected { background:#d0e2ff; }
    .radio { width:18px; height:18px; border:1px solid #8d8d8d; border-radius:50%; display:inline-block;
      position:relative; cursor:pointer; }
    tr.existing .radio { border-color:#c6c6c6; cursor:default; }
    .radio.checked { border-color:#0f62fe; }
    .radio.checked:after { content:''; position:absolute; width:10px; height:10px; border-radius:50%;
      background:#0f62fe; top:3px; left:3px; }
    .tag { font-size:11px; padding:1px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }
    .tag.existing { background:#e0e0e0; color:#6f6f6f; }
    .tag.new { background:#0f62fe; color:#fff; }
    .val { font-family:monospace; }
    .name { font-weight:600; }
    tr.existing .name { font-weight:400; }
    .note { background:#edf5ff; border-left:3px solid #0f62fe; padding:12px 16px; font-size:13px;
      margin-top:20px; line-height:1.45; }
    .note.warn { background:#fff8e1; border-left-color:#f1c21b; }
    .editor { background:#fff; border:1px solid #0f62fe; padding:16px; margin-top:0; }
    .editor h3 { margin:0 0 4px; font-size:15px; }
    .editor .d { color:#525252; font-size:13px; margin-bottom:12px; }
    .seg { display:inline-flex; border:1px solid #0f62fe; border-radius:2px; overflow:hidden; }
    .seg button { border:none; background:#fff; color:#0f62fe; padding:8px 18px; font-size:13px; cursor:pointer; }
    .seg button.sel { background:#0f62fe; color:#fff; }
    .ellipsis td { color:#a8a8a8; font-style:italic; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — Require requesting provider &nbsp;|&nbsp; /MasterListsPage/SampleEntryConfigurationMenu &nbsp;|&nbsp; adds ONE row to the existing table &nbsp;|&nbsp; Not a live application
  </div>
  <div class="preview-content" id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // A few real existing rows (greyed, for context only) — from the live page.
    const EXISTING = [
      { name: 'eqaEnabled', desc: 'If true, the EQA checkbox appears on Order Entry allowing a sample to be marked as an EQA sample', val: 'false' },
      { name: 'external orders', desc: 'Allow external sites to send electronic orders', val: 'false' },
      { name: 'restrictFreeTextProviderEntry', desc: 'Restrict Free Text Provider Entry', val: 'false' },
      { name: 'restrictFreeTextRefSiteEntry', desc: 'Users cannot enter new referring sites through sample entry', val: 'false' },
    ];

    function App() {
      const [selected, setSelected] = useState(false); // new row selected?
      const [editing, setEditing] = useState(false);
      const [value, setValue] = useState('true');      // default true = required

      return (
        <div>
          <div className="crumb">
            <a>Home</a> / <a>Admin Management</a> / <a>Sample Entry Configuration Menu</a> / Order Entry Configuration
          </div>
          <h1 className="page">Order Entry Configuration</h1>

          <button className={"modify" + (selected ? " on" : "")}
            onClick={() => selected && setEditing(true)}>Modify</button>

          <table>
            <thead>
              <tr><th style={{width:70}}>Select</th><th style={{width:260}}>Name</th><th>Description</th><th style={{width:120}}>Value</th></tr>
            </thead>
            <tbody>
              <tr className="ellipsis"><td></td><td>…existing settings…</td><td>auto-fill collection date/time, billingRefNumber, contactTracingEnabled, gpsCoordinatesEnabled, Program …</td><td></td></tr>
              {EXISTING.map((r, i) => (
                <tr className="existing" key={i}>
                  <td><span className="radio" /></td>
                  <td><span className="name">{r.name}</span><span className="tag existing">existing</span></td>
                  <td><span className="desc">{r.desc}</span></td>
                  <td><span className="val">{r.val}</span></td>
                </tr>
              ))}
              {/* --- The one new row this feature adds --- */}
              <tr className={"newrow" + (selected ? " selected" : "")}>
                <td>
                  <span className={"radio" + (selected ? " checked" : "")}
                    onClick={() => { setSelected(true); setEditing(false); }} />
                </td>
                <td>
                  <span className="name">Require requesting provider</span>
                  <span className="tag new">new</span>
                </td>
                <td>
                  <span className="desc">
                    When on, staff must select a requesting provider to save an order.
                    When off, the referring facility (Site Name) is required instead. (Default: on)
                  </span>
                </td>
                <td><span className="val">{value}</span></td>
              </tr>
            </tbody>
          </table>

          {editing && (
            <div className="editor">
              <h3>Modify — Require requesting provider</h3>
              <div className="d">Set the value. Default is <span className="val">true</span> (provider required).</div>
              <div className="seg">
                <button className={value === 'true' ? 'sel' : ''} onClick={() => setValue('true')}>true — provider required</button>
                <button className={value === 'false' ? 'sel' : ''} onClick={() => setValue('false')}>false — facility required instead</button>
              </div>
              <div style={{marginTop:14}}>
                <button className="cds--btn cds--btn--primary" style={{minHeight:40}} onClick={() => setEditing(false)}>Save</button>
                <button className="cds--btn cds--btn--ghost" style={{minHeight:40}} onClick={() => setEditing(false)}>Cancel</button>
              </div>
            </div>
          )}

          <div className="note">
            <strong>What this row does on the order form:</strong> at <span className="val">true</span> (default),
            the Requester → Provider field is required, exactly as today. At <span className="val">false</span>, Provider
            becomes optional (field stays visible) and Site Name becomes the required field — so every order still
            carries a requester of record.
          </div>

          <div className="note warn">
            <strong>Downstream data audit (implementation gate):</strong> because provider has always been required,
            setting it to <span className="val">false</span> requires null-safing every consumer that assumed a provider
            is present — order-entry validation (form + API), FHIR requester/Practitioner export, printed reports,
            Test Notification Provider Email/SMS channels, result routing, provider search/reports, DB nullability,
            labels, audit. See the FRS "Downstream Data Audit" section (completed by the developer + Claude Code as
            acceptance criteria).
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
