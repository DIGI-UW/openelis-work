<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Catalog Management — v2.5 v1 Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .preview-banner strong { background: #fff; color: #0f62fe; padding: 1px 6px; border-radius: 2px; margin: 0 4px; }
    .layout { display: grid; grid-template-columns: 256px 1fr; min-height: calc(100vh - 28px); }
    .sidenav { background: #fff; border-right: 1px solid #e0e0e0; padding: 0; }
    .sidenav-header { padding: 1rem; border-bottom: 1px solid #e0e0e0; font-weight: 600; font-size: 14px; color: #161616; }
    .sidenav-item { padding: 0.75rem 1rem; cursor: pointer; font-size: 14px; color: #161616; display: flex; align-items: center; justify-content: space-between; border-left: 3px solid transparent; }
    .sidenav-item:hover { background: #e5e5e5; }
    .sidenav-item-active { background: #e0e0e0; border-left-color: #0f62fe; font-weight: 600; }
    .sidenav-item-disabled { color: #a8a8a8; }
    .sidenav-item .v2-pill { font-size: 10px; background: #e8daff; color: #491d8b; padding: 1px 6px; border-radius: 10px; font-weight: 600; letter-spacing: 0.5px; }
    .main { padding: 1.5rem 2rem; overflow-x: auto; }
    .breadcrumb { font-size: 13px; color: #525252; margin-bottom: 0.75rem; }
    .breadcrumb a { color: #0f62fe; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .page-title { font-size: 28px; font-weight: 300; margin: 0 0 0.25rem 0; color: #161616; }
    .page-subtitle { font-size: 14px; color: #525252; margin-bottom: 1.5rem; }
    .section-card { background: #fff; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .section-title { font-size: 20px; font-weight: 400; margin: 0 0 0.5rem 0; color: #161616; }
    .section-helper { font-size: 13px; color: #525252; margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-field label { display: block; font-size: 12px; color: #525252; margin-bottom: 4px; font-weight: 400; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; font-size: 14px; border: 0; border-bottom: 1px solid #8d8d8d; background: #f4f4f4; font-family: inherit; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: 2px solid #0f62fe; outline-offset: -2px; }
    .form-field .helper { font-size: 12px; color: #6f6f6f; margin-top: 4px; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 14px; }
    .checkbox-row input[type="checkbox"] { margin: 0; }
    .radio-row { display: flex; gap: 1.5rem; margin: 0.5rem 0; font-size: 14px; }
    .radio-row label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .data-table-wrapper { border: 1px solid #e0e0e0; }
    .data-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    .data-table th { text-align: left; padding: 0.75rem 1rem; background: #f4f4f4; font-weight: 600; color: #161616; border-bottom: 1px solid #e0e0e0; font-size: 12px; }
    .data-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    .data-table tr.clickable { cursor: pointer; }
    .data-table tr.clickable:hover { background: #f4f4f4; }
    .data-table tr.row-selected { background: #e5e5e5; }
    .test-name-link { color: #0f62fe; font-weight: 400; cursor: pointer; }
    .test-name-link:hover { text-decoration: underline; }
    .filter-bar { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; margin-bottom: 1rem; padding: 1rem; background: #fff; border: 1px solid #e0e0e0; }
    .filter-bar .form-field { min-width: 160px; }
    .filter-bar .form-field-search { min-width: 280px; flex: 1; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; font-size: 14px; font-family: inherit; border: 1px solid transparent; cursor: pointer; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .btn-primary:hover { background: #0353e9; }
    .btn-secondary { background: #393939; color: #fff; }
    .btn-tertiary { background: transparent; color: #0f62fe; border-color: #0f62fe; }
    .btn-ghost { background: transparent; color: #0f62fe; }
    .btn-ghost:hover { background: #e5e5e5; }
    .btn-danger { background: transparent; color: #da1e28; border-color: #da1e28; }
    .btn-sm { padding: 0.25rem 0.75rem; font-size: 12px; }
    .pill, .tag-pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .tag-blue { background: #d0e2ff; color: #0043ce; }
    .tag-teal { background: #9ef0f0; color: #003a6d; }
    .tag-purple { background: #e8daff; color: #491d8b; }
    .tag-green { background: #a7f0ba; color: #044317; }
    .tag-red { background: #ffd7d9; color: #750e13; }
    .tag-magenta { background: #ffd6e8; color: #9f1853; }
    .tag-warm-gray { background: #e0e0e0; color: #525252; }
    .tag-yellow { background: #fdd13a; color: #161616; }
    .stage-pill { background: #d0e2ff; color: #0043ce; }
    .accordion-item { border-top: 1px solid #e0e0e0; }
    .accordion-header { padding: 0.75rem 1rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: #fff; font-weight: 400; }
    .accordion-header:hover { background: #f4f4f4; }
    .accordion-content { padding: 1rem; background: #f4f4f4; }
    .coverage-card { background: #fff; padding: 1rem; border: 1px solid #e0e0e0; }
    .coverage-card-complete { border-left: 3px solid #24a148; }
    .coverage-card-issues { border-left: 3px solid #da1e28; }
    .issue-card { background: #fff1f1; padding: 0.75rem; margin-top: 0.5rem; border-left: 3px solid #da1e28; }
    .info-banner { padding: 0.75rem 1rem; background: #edf5ff; border-left: 3px solid #0f62fe; font-size: 13px; color: #002d9c; margin-bottom: 1rem; }
    .info-banner-warning { background: #fcf4d6; border-left-color: #f1c21b; color: #684e00; }
    .info-banner-coming-soon { background: #f4f0ff; border-left-color: #8a3ffc; color: #491d8b; }
    .empty-state { text-align: center; padding: 3rem 1rem; background: #fff; border: 1px solid #e0e0e0; }
    .empty-state-title { font-size: 18px; margin-bottom: 0.5rem; color: #161616; }
    .empty-state-helper { font-size: 14px; color: #525252; margin-bottom: 1rem; }
    .pagination { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #fff; border: 1px solid #e0e0e0; border-top: 0; font-size: 13px; color: #525252; }
    .editor-header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 1.5rem; }
    .editor-header-actions { display: flex; gap: 0.5rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .small-label { font-size: 12px; color: #525252; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.25rem; }
    .badge-count { background: #393939; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 10px; }
    .sub-section { padding: 0.75rem 0; border-top: 1px dashed #e0e0e0; margin-top: 0.75rem; }
    .preview-help { background: #f4f4f4; padding: 0.75rem; border: 1px dashed #c6c6c6; font-size: 12px; color: #525252; margin-top: 0.5rem; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">
    ⚡ Visual Preview — Test Catalog Management <strong>v2.5 v1</strong> | OpenELIS Design Mockup | Not a live application | <strong>v1 ships 9 sections</strong>; v2 sections (Labels / Reagents / Alerts / Reflex &amp; Calc / Compliance) are hidden until v2 ships
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const t = (key, fallback) => fallback;

    // ============== MOCK DATA ==============
    const MOCK_TESTS = [
      { id: 1, name: 'Fasting Glucose', section: 'Chemistry', sampleType: 'Serum', resultType: 'Numeric', loinc: '1558-6', status: 'Active', domain: 'CLINICAL', amr: false },
      { id: 2, name: 'Hemoglobin A1c', section: 'Chemistry', sampleType: 'Whole Blood', resultType: 'Numeric', loinc: '4548-4', status: 'Active', domain: 'CLINICAL', amr: false },
      { id: 3, name: 'HIV Rapid Test', section: 'Serology', sampleType: 'Whole Blood', resultType: 'Select List', loinc: '68961-2', status: 'Active', domain: 'CLINICAL', amr: false },
      { id: 4, name: 'Ampicillin Susceptibility', section: 'Microbiology', sampleType: 'Isolate', resultType: 'Select List', loinc: '18864-9', status: 'Active', domain: 'CLINICAL', amr: true, whonet: 'AMP' },
      { id: 5, name: 'Ciprofloxacin Susceptibility', section: 'Microbiology', sampleType: 'Isolate', resultType: 'Select List', loinc: '18906-8', status: 'Active', domain: 'CLINICAL', amr: true, whonet: 'CIP' },
      { id: 6, name: 'Total Bilirubin (Neonatal)', section: 'Chemistry', sampleType: 'Serum', resultType: 'Numeric', loinc: '1975-2', status: 'Active', domain: 'CLINICAL', amr: false },
      { id: 7, name: 'Water Turbidity', section: 'Environmental', sampleType: 'Water', resultType: 'Numeric', loinc: '—', status: 'Active', domain: 'ENVIRONMENTAL', amr: false },
      { id: 8, name: 'Noise Pollution Survey', section: 'Environmental', sampleType: 'Air', resultType: 'Numeric', loinc: '—', status: 'Active', domain: 'ENVIRONMENTAL', amr: false },
      { id: 9, name: 'Aedes Pool RT-PCR Dengue', section: 'Molecular', sampleType: 'Mosquito Pool', resultType: 'Select List', loinc: '—', status: 'Active', domain: 'VECTOR', amr: false },
      { id: 10, name: 'CBC with Differential', section: 'Hematology', sampleType: 'Whole Blood', resultType: 'Numeric', loinc: '57021-8', status: 'Active', domain: 'CLINICAL', amr: false },
      { id: 11, name: 'Total Cholesterol', section: 'Chemistry', sampleType: 'Serum', resultType: 'Numeric', loinc: '2093-3', status: 'Inactive', domain: 'CLINICAL', amr: false },
      { id: 12, name: 'Blood Pressure', section: 'Vitals', sampleType: 'In-vivo', resultType: 'Numeric', loinc: '85354-9', status: 'Active', domain: 'CLINICAL', amr: false },
    ];

    // v1 SideNav: 9 sections. v2 entries (Labels, Reagents, Alerts, Reflex & Calc, Compliance) are hidden — they appear when v2 ships.
    const SECTIONS = [
      { id: 'basic', label: 'Basic Info' },
      { id: 'sample', label: 'Sample & Results' },
      { id: 'methods', label: 'Methods' },
      { id: 'ranges', label: 'Ranges' },
      { id: 'storage', label: 'Sample Storage' },
      { id: 'order', label: 'Display Order' },
      { id: 'panels', label: 'Panels' },
      { id: 'terminology', label: 'Terminology' },
      { id: 'analyzers', label: 'Analyzers' },
    ];

    // ============== ATOMS ==============
    function DomainTag({ domain }) {
      if (domain === 'CLINICAL') return <span className="pill tag-blue">CLINICAL</span>;
      if (domain === 'ENVIRONMENTAL') return <span className="pill tag-teal">ENVIRONMENTAL</span>;
      if (domain === 'VECTOR') return <span className="pill tag-purple">VECTOR</span>;
      return null;
    }
    function StatusTag({ status }) {
      if (status === 'Active') return <span className="pill tag-green">Active</span>;
      if (status === 'Inactive') return <span className="pill tag-warm-gray">Inactive</span>;
      return <span className="pill tag-warm-gray">{status}</span>;
    }
    function StagePill({ stage }) {
      return <span className={`pill stage-pill`} style={{ background: stage === 'v1' ? '#d0e2ff' : '#e8daff', color: stage === 'v1' ? '#0043ce' : '#491d8b' }}>{stage}</span>;
    }

    // ============== TEST LIST VIEW ==============
    function TestListView({ onOpen }) {
      const [filtersOpen, setFiltersOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [section, setSection] = useState('All');
      const [sampleType, setSampleType] = useState('All');
      const [resultType, setResultType] = useState('All');
      const [status, setStatus] = useState('All');
      const [domain, setDomain] = useState('All');
      const [amr, setAmr] = useState('All');

      const filtered = MOCK_TESTS.filter(test => {
        if (search && !test.name.toLowerCase().includes(search.toLowerCase())) return false;
        if (section !== 'All' && test.section !== section) return false;
        if (sampleType !== 'All' && test.sampleType !== sampleType) return false;
        if (resultType !== 'All' && test.resultType !== resultType) return false;
        if (status !== 'All' && test.status !== status) return false;
        if (domain !== 'All' && test.domain !== domain) return false;
        if (amr === 'AMR' && !test.amr) return false;
        if (amr === 'Non-AMR' && test.amr) return false;
        return true;
      });

      const activeFilters = [section, sampleType, resultType, status, domain, amr].filter(v => v !== 'All').length;

      return (
        <div>
          <div className="breadcrumb">
            <a>Admin</a> &nbsp;›&nbsp; Test Catalog Management
          </div>
          <div className="editor-header">
            <div>
              <h1 className="page-title">Test Catalog Management</h1>
              <div className="page-subtitle">Manage laboratory tests, panels, and configurations</div>
            </div>
            <div className="editor-header-actions">
              <button className="btn btn-tertiary btn-sm" onClick={() => setFiltersOpen(!filtersOpen)}>
                Filters {activeFilters > 0 && <span className="badge-count">{activeFilters}</span>}
              </button>
              <button className="btn btn-primary" onClick={() => onOpen('new')}>+ Add Test</button>
            </div>
          </div>

          <div className="form-field form-field-search" style={{ marginBottom: '1rem' }}>
            <input type="text" placeholder="Search tests..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          {filtersOpen && (
            <div className="filter-bar">
              <div className="form-field">
                <label>Section</label>
                <select value={section} onChange={e => setSection(e.target.value)}>
                  <option>All</option><option>Chemistry</option><option>Hematology</option><option>Serology</option><option>Microbiology</option><option>Molecular</option><option>Environmental</option><option>Vitals</option>
                </select>
              </div>
              <div className="form-field">
                <label>Sample Type</label>
                <select value={sampleType} onChange={e => setSampleType(e.target.value)}>
                  <option>All</option><option>Serum</option><option>Whole Blood</option><option>Isolate</option><option>Water</option><option>Air</option><option>Mosquito Pool</option><option>In-vivo</option>
                </select>
              </div>
              <div className="form-field">
                <label>Result Type</label>
                <select value={resultType} onChange={e => setResultType(e.target.value)}>
                  <option>All</option><option>Numeric</option><option>Select List</option><option>Multi-select</option><option>Free Text</option>
                </select>
              </div>
              <div className="form-field">
                <label>Status</label>
                <select value={status} onChange={e => setStatus(e.target.value)}>
                  <option>All</option><option>Active</option><option>Inactive</option>
                </select>
              </div>
              <div className="form-field">
                <label>Domain</label>
                <select value={domain} onChange={e => setDomain(e.target.value)}>
                  <option>All</option><option value="CLINICAL">Clinical</option><option value="ENVIRONMENTAL">Environmental</option><option value="VECTOR">Vector</option>
                </select>
              </div>
              <div className="form-field">
                <label>AMR</label>
                <select value={amr} onChange={e => setAmr(e.target.value)}>
                  <option>All</option><option value="AMR">AMR Only</option><option value="Non-AMR">Non-AMR</option>
                </select>
              </div>
              {activeFilters > 0 && (
                <button className="btn btn-ghost btn-sm" onClick={() => { setSection('All'); setSampleType('All'); setResultType('All'); setStatus('All'); setDomain('All'); setAmr('All'); }}>Clear All</button>
              )}
            </div>
          )}

          <div className="data-table-wrapper">
            <table className="data-table">
              <thead>
                <tr>
                  <th>Test Name</th>
                  <th>Domain</th>
                  <th>Section</th>
                  <th>Sample Type</th>
                  <th>Result Type</th>
                  <th>LOINC</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(test => (
                  <tr key={test.id} className="clickable" onClick={() => onOpen(test.id)}>
                    <td>
                      <span className="test-name-link">{test.name}</span>
                      {test.amr && <span className="pill tag-purple" title={`WHONET: ${test.whonet}`} style={{ marginLeft: 8 }}>AMR</span>}
                    </td>
                    <td><DomainTag domain={test.domain} /></td>
                    <td>{test.section}</td>
                    <td>{test.sampleType}</td>
                    <td>{test.resultType}</td>
                    <td><code style={{ fontSize: 12, color: '#525252' }}>{test.loinc}</code></td>
                    <td><StatusTag status={test.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="pagination">
              <span>Showing 1–{filtered.length} of {filtered.length} tests</span>
              <span>Page 1 of 1 · 25 per page</span>
            </div>
          </div>

          <div className="preview-help" style={{ marginTop: '1rem' }}>
            <strong>v1 behavior:</strong> Click any row to open the editor. No Actions column. Filter state and pagination reflected in the URL. Each row is keyboard-focusable; Enter opens the editor.
          </div>
        </div>
      );
    }

    // ============== BASIC INFO ==============
    function BasicInfoSection({ test, setTest, onActivateClick }) {
      const isAMR = !!test.amr;
      return (
        <div className="section-card">
          <h2 className="section-title">Basic Information <StagePill stage="v1" /></h2>
          <div className="form-row">
            <div className="form-field">
              <label>Test Name *</label>
              <input value={test.name} onChange={e => setTest({...test, name: e.target.value})} />
            </div>
            <div className="form-field">
              <label>Reporting Name</label>
              <input defaultValue={test.name} placeholder="Name for patient reports" />
            </div>
          </div>
          <div className="form-row">
            <div className="form-field">
              <label>Test Code *</label>
              <input defaultValue="GLU-F" placeholder="e.g., GLU-F" />
            </div>
            <div className="form-field">
              <label>Description</label>
              <input defaultValue="Fasting blood glucose measurement" />
            </div>
          </div>

          <div className="sub-section">
            <div className="small-label">Test Domain *</div>
            <div className="radio-row">
              <label><input type="radio" name="domain" checked={test.domain === 'CLINICAL'} onChange={() => setTest({...test, domain: 'CLINICAL'})} /> Clinical</label>
              <label><input type="radio" name="domain" checked={test.domain === 'ENVIRONMENTAL'} onChange={() => setTest({...test, domain: 'ENVIRONMENTAL'})} /> Environmental</label>
              <label><input type="radio" name="domain" checked={test.domain === 'VECTOR'} onChange={() => setTest({...test, domain: 'VECTOR'})} /> Vector</label>
            </div>
            <div className="helper" style={{ fontSize: 12, color: '#6f6f6f' }}>Patient-facing tests are Clinical. Water/air/soil/food = Environmental. Mosquito/tick/rodent surveillance = Vector. Changing domain after creation prompts a confirmation modal.</div>
          </div>

          <div className="sub-section">
            <div className="small-label">Status &amp; Visibility</div>
            <div className="checkbox-row"><input type="checkbox" defaultChecked /> Active</div>
            <div className="checkbox-row"><input type="checkbox" defaultChecked /> Orderable</div>
            <div className="checkbox-row"><input type="checkbox" /> Internal QA — No Results Release <span style={{ fontSize: 12, color: '#6f6f6f', marginLeft: 8 }}>(results will not appear on patient reports — not the EQA participant workflow surface)</span></div>
            <div className="preview-help" style={{ marginTop: 8 }}>
              <strong>Activation gate:</strong> if Coverage Validation has unresolved gaps when admin sets the test Active, the <em>Activation Acknowledgment modal</em> appears. Admin can either fill the gaps or proceed by explicitly acknowledging that the test won't be validated for the missing demographics (logged to <code>test_activation_acknowledgment</code>). <button className="btn btn-ghost btn-sm" onClick={onActivateClick}>Demo: trigger Activation modal</button>
            </div>
          </div>

          <div className="sub-section">
            <div className="small-label">Antimicrobial Resistance (AMR) Test</div>
            <div className="checkbox-row">
              <input type="checkbox" checked={isAMR} onChange={() => setTest({...test, amr: !isAMR})} />
              Enable for WHONET export and antimicrobial resistance surveillance
            </div>
            {isAMR && (
              <div style={{ marginTop: 12, padding: 12, background: '#f4f4f4', border: '1px solid #e0e0e0' }}>
                <div className="form-row-3">
                  <div className="form-field">
                    <label>WHONET Antibiotic Code *</label>
                    <select defaultValue="AMP"><option>AMP</option><option>CIP</option><option>GEN</option><option>VAN</option></select>
                  </div>
                  <div className="form-field">
                    <label>Antibiotic Class</label>
                    <select defaultValue="Penicillins"><option>Penicillins</option><option>Fluoroquinolones</option><option>Cephalosporins</option><option>Glycopeptides</option></select>
                  </div>
                  <div className="form-field">
                    <label>Test Method</label>
                    <select defaultValue="Disk Diffusion"><option>Disk Diffusion</option><option>MIC</option><option>E-test</option></select>
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-field">
                    <label>Breakpoint Standard</label>
                    <select defaultValue="CLSI 2024"><option>CLSI 2024</option><option>EUCAST 2024</option><option>Custom</option></select>
                  </div>
                  <div className="form-field">
                    <label>Disk Potency (µg)</label>
                    <input type="number" defaultValue="10" />
                  </div>
                </div>
                <div className="info-banner">This test will be included in WHONET exports.</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== SAMPLE & RESULTS ==============
    function SampleResultsSection({ test }) {
      const [components, setComponents] = useState(test.id === 12 ? [
        { code: 'SYSTOLIC', label: 'Systolic', type: 'NUMERIC', unit: 'mmHg', sigDigits: 0, defaultResult: '', multi: false, active: true, order: 1 },

        <div className="section-card">
          <h2 className="section-title">Display Order <StagePill stage="v1" /></h2>
          <div className="section-helper">Reorder tests within a sample type. This order determines the sequence in order entry, result entry, worklists, and reports. Drag the handle <code style={{ background: '#f4f4f4', padding: '0 4px' }}>≡</code> to reorder, or focus a row and use Arrow Up/Down. Changes auto-save on drop.</div>

          <div className="form-field" style={{ marginBottom: '1rem', maxWidth: 320 }}>
            <label>Sample Type</label>
            <div style={{ padding: '0.5rem 0.75rem', background: '#f4f4f4', borderBottom: '1px solid #8d8d8d', display: 'flex', alignItems: 'center' }}>
              <input type="text" value={sampleType} onChange={e => setSampleType(e.target.value)} style={{ flex: 1, border: 0, background: 'transparent', outline: 'none', fontSize: 14 }} />
              <span style={{ color: '#525252', fontSize: 12 }}>▾</span>
            </div>
            <div className="helper" style={{ fontSize: 12, color: '#6f6f6f', marginTop: 4 }}>Carbon `&lt;ComboBox&gt;` — typeahead.</div>
          </div>

          <div style={{ background: '#fff', border: '1px solid #e0e0e0' }}>
            {orderedTests.map((t, i) => (
              <div key={i} style={{ padding: '0.5rem 0.75rem', borderBottom: i < orderedTests.length - 1 ? '1px solid #e0e0e0' : 'none', display: 'flex', alignItems: 'center', gap: '0.75rem', cursor: 'grab' }}>
                <span style={{ color: '#0f62fe' }} title="Drag to reorder">≡</span>
                <span style={{ fontSize: 12, color: '#525252', width: 24, textAlign: 'right' }}>{i + 1}.</span>
                <span style={{ fontSize: 14 }}>{t}</span>
              </div>
            ))}
          </div>

          <div className="preview-help" style={{ marginTop: '1rem' }}><strong>Pulled into v1</strong> from v2 — drag-drop infrastructure already exists in OpenELIS, so there's no reason to defer this section. Order persists to <code>test_sample_type.display_order</code>. Auto-save on drop.</div>
        </div>
      );
    }

    // ============== TERMINOLOGY ==============
    function TerminologySection() {
      return (
        <div className="section-card">
          <h2 className="section-title">Terminology Mappings <StagePill stage="v1" /></h2>
          <div className="section-helper">Link this test to standard terminology codes for interoperability. <button className="btn btn-tertiary btn-sm">+ Add Mapping</button></div>
          <div className="data-table-wrapper">
            <table className="data-table">
              <thead><tr><th>Source</th><th>Code</th><th>Relationship</th><th></th></tr></thead>
              <tbody>
                <tr><td><span className="pill tag-blue">LOINC</span></td><td><code>1558-6</code></td><td>Same As</td><td><button className="btn btn-ghost btn-sm">Edit</button> <button className="btn btn-ghost btn-sm">Remove</button></td></tr>
                <tr><td><span className="pill tag-teal">SNOMED CT</span></td><td><code>271061004</code></td><td>Same As</td><td><button className="btn btn-ghost btn-sm">Edit</button> <button className="btn btn-ghost btn-sm">Remove</button></td></tr>
                <tr><td><span className="pill tag-purple">CIEL</span></td><td><code>887</code></td><td>Same As</td><td><button className="btn btn-ghost btn-sm">Edit</button> <button className="btn btn-ghost btn-sm">Remove</button></td></tr>
              </tbody>
            </table>
          </div>
          <div className="preview-help"><strong>v1:</strong> add/edit/delete individual mappings. <strong>v2:</strong> bulk import + mapping conflict detection across tests.</div>
        </div>
      );
    }

    // ============== ANALYZERS (read-only) ==============
    function AnalyzersSection() {
      return (
        <div className="section-card">
          <h2 className="section-title">Analyzers <StagePill stage="v1" /> <span className="pill tag-warm-gray" style={{ fontSize: 10, marginLeft: 8 }}>READ-ONLY</span></h2>
          <div className="section-helper">Analyzers that can run this test, derived from the analyzer test-code mappings. To add or remove an analyzer for this test, edit the analyzer's record at Administration → Master Lists → Analyzers.</div>
          <div className="data-table-wrapper">
            <table className="data-table">
              <thead><tr><th>Analyzer</th><th>Location</th><th>Serial Number</th><th>Status</th></tr></thead>
              <tbody>
                <tr><td><a className="test-name-link">Cobas C311</a></td><td>Chemistry Lab — Bench 2</td><td>SN-784512</td><td><span className="pill tag-green">Online</span></td></tr>
                <tr><td><a className="test-name-link">Architect c4000</a></td><td>Chemistry Lab — Bench 1</td><td>SN-998211</td><td><span className="pill tag-green">Online</span></td></tr>
                <tr><td><a className="test-name-link">Cobas Integra 400+</a></td><td>STAT Lab</td><td>SN-100455</td><td><span className="pill tag-warm-gray">Maintenance</span></td></tr>
              </tbody>
            </table>
          </div>
          <div className="info-banner" style={{ marginTop: '1rem' }}><strong>This list is read-only.</strong> The analyzer→test-code mapping is the source of truth and lives with each analyzer's record. To add or remove an analyzer for this test, go to <strong>Administration → Master Lists → Analyzers → [analyzer name] → test code mappings</strong>. Clicking an analyzer's name above takes you directly to its record.</div>
        </div>
      );
    }

    // ============== ACTIVATION ACKNOWLEDGMENT MODAL ==============
    function ActivationAckModal({ open, onClose, onConfirm, gaps }) {
      const [acknowledged, setAcknowledged] = useState(false);
      if (!open) return null;
      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(22,22,22,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
          <div style={{ background: '#fff', width: 560, maxWidth: '90vw' }}>
            <div style={{ padding: '1rem 1.5rem', borderBottom: '1px solid #e0e0e0' }}>
              <h3 style={{ margin: 0, fontSize: 20, fontWeight: 400 }}>Activate test with incomplete coverage?</h3>
            </div>
            <div style={{ padding: '1rem 1.5rem' }}>
              <p style={{ marginTop: 0, fontSize: 14, color: '#161616' }}>This test has unresolved Coverage Validation gaps:</p>
              <ul style={{ fontSize: 13, color: '#525252', paddingLeft: '1.25rem' }}>
                {gaps.map((g, i) => <li key={i}>{g}</li>)}
              </ul>
              <div className="info-banner info-banner-warning" style={{ marginTop: '1rem' }}>
                Results from patients in these demographics will not be evaluated against the missing ranges. No H/L flag will be applied; critical-range gaps will not trigger critical alerts. Acknowledgment is logged and re-presented if the gap pattern changes.
              </div>
              <div className="checkbox-row" style={{ marginTop: '1rem' }}>
                <input type="checkbox" checked={acknowledged} onChange={e => setAcknowledged(e.target.checked)} />
                I understand this test will not be validated against the listed demographics.
              </div>
            </div>
            <div style={{ padding: '0.75rem 1.5rem', borderTop: '1px solid #e0e0e0', display: 'flex', justifyContent: 'flex-end', gap: '0.5rem' }}>
              <button className="btn btn-tertiary" onClick={onClose}>Fill gaps now</button>
              <button className="btn btn-primary" disabled={!acknowledged} style={{ opacity: acknowledged ? 1 : 0.5 }} onClick={() => acknowledged && onConfirm()}>Activate anyway</button>
            </div>
          </div>
        </div>
      );
    }

    // ============== SAVE AS NEW TEST MODAL ==============
    function SaveAsNewModal({ open, onClose, originalName }) {
      const [name, setName] = useState(originalName + ' (copy)');
      const [code, setCode] = useState('');
      if (!open) return null;
      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(22,22,22,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
          <div style={{ background: '#fff', width: 480, maxWidth: '90vw' }}>
            <div style={{ padding: '1rem 1.5rem', borderBottom: '1px solid #e0e0e0' }}>
              <h3 style={{ margin: 0, fontSize: 20, fontWeight: 400 }}>Save as new test</h3>
            </div>
            <div style={{ padding: '1rem 1.5rem' }}>
              <p style={{ marginTop: 0, fontSize: 13, color: '#525252' }}>Clones the current test's configuration (Domain, AMR settings, components, ranges, methods, panels, terminology, analyzers, sample storage) into a new test. Enter the new identity below.</p>
              <div className="form-field" style={{ marginBottom: '1rem' }}>
                <label>New Test Name *</label>
                <input value={name} onChange={e => setName(e.target.value)} />
              </div>
              <div className="form-field">
                <label>New Test Code *</label>
                <input value={code} onChange={e => setCode(e.target.value)} placeholder="e.g., GLU-F-COPY" />
              </div>
            </div>
            <div style={{ padding: '0.75rem 1.5rem', borderTop: '1px solid #e0e0e0', display: 'flex', justifyContent: 'flex-end', gap: '0.5rem' }}>
              <button className="btn btn-tertiary" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" disabled={!name || !code} onClick={onClose}>Create new test</button>
            </div>
          </div>
        </div>
      );
    }

    // ============== TEST EDITOR ==============
    function TestEditor({ test, setTest, onBack }) {
      const [currentSection, setCurrentSection] = useState('basic');
      const [saveAsNewOpen, setSaveAsNewOpen] = useState(false);
      const [activationModalOpen, setActivationModalOpen] = useState(false);
      const currentSec = SECTIONS.find(s => s.id === currentSection);
      // Demo coverage-gap data for the Activation modal
      const demoGaps = ['Female · Normal range · 56 days to 1 year (not covered)'];

      return (
        <div>
          <div className="breadcrumb">
            <a onClick={onBack} style={{ cursor: 'pointer' }}>Admin</a> &nbsp;›&nbsp;
            <a onClick={onBack} style={{ cursor: 'pointer' }}>Test Catalog Management</a> &nbsp;›&nbsp;
            <strong>{test.name}</strong> &nbsp;›&nbsp;
            {currentSec.label}
          </div>
          <div className="editor-header">
            <div>
              <h1 className="page-title">Edit Test: {test.name}</h1>
              <div className="page-subtitle">Configure all test properties in one place</div>
            </div>
            <div className="editor-header-actions">
              <button className="btn btn-tertiary" onClick={onBack}>Cancel</button>
              <button className="btn btn-tertiary" onClick={() => setSaveAsNewOpen(true)}>Save as new test…</button>
              <button className="btn btn-primary">Save Test</button>
            </div>
          </div>

          <div className="layout">
            <div className="sidenav">
              <div className="sidenav-header">{test.name}</div>
              {SECTIONS.map(sec => (
                <div
                  key={sec.id}
                  className={`sidenav-item ${currentSection === sec.id ? 'sidenav-item-active' : ''}`}
                  onClick={() => setCurrentSection(sec.id)}
                >
                  <span>{sec.label}</span>
                </div>
              ))}
            </div>
            <div className="main" style={{ padding: '0 0 0 1.5rem' }}>
              {(test.domain === 'ENVIRONMENTAL' || test.domain === 'VECTOR') && currentSection === 'ranges' && (
                <div className="info-banner info-banner-warning">This is an {test.domain === 'ENVIRONMENTAL' ? 'Environmental' : 'Vector'} test. Compliance thresholds (v2) are typically the primary evaluation surface for this domain. Configure clinical reference ranges only if your lab also reports them for QA or staff use.</div>
              )}
              {currentSection === 'basic' && <BasicInfoSection test={test} setTest={setTest} onActivateClick={() => setActivationModalOpen(true)} />}
              {currentSection === 'sample' && <SampleResultsSection test={test} />}
              {currentSection === 'methods' && <MethodsSection />}
              {currentSection === 'ranges' && <RangesSection test={test} />}
              {currentSection === 'storage' && <SampleStorageSection />}
              {currentSection === 'order' && <DisplayOrderSection />}
              {currentSection === 'panels' && <PanelsSection />}
              {currentSection === 'terminology' && <TerminologySection />}
              {currentSection === 'analyzers' && <AnalyzersSection />}
            </div>
          </div>

          <SaveAsNewModal open={saveAsNewOpen} onClose={() => setSaveAsNewOpen(false)} originalName={test.name} />
          <ActivationAckModal open={activationModalOpen} onClose={() => setActivationModalOpen(false)} onConfirm={() => setActivationModalOpen(false)} gaps={demoGaps} />
        </div>
      );
    }

    // ============== APP ==============
    function App() {
      const [view, setView] = useState('list');
      const [openTestId, setOpenTestId] = useState(null);
      const initialTest = openTestId === 'new'
        ? { id: 'new', name: 'New Test', domain: 'CLINICAL', amr: false }
        : MOCK_TESTS.find(t => t.id === openTestId);
      const [editTest, setEditTest] = useState(initialTest);

      const openEditor = (testId) => {
        setOpenTestId(testId);
        const t = testId === 'new'
          ? { id: 'new', name: 'New Test', domain: 'CLINICAL', amr: false }
          : MOCK_TESTS.find(t => t.id === testId);
        setEditTest(t);
        setView('editor');
      };

      const backToList = () => { setView('list'); setOpenTestId(null); };

      return (
        <div style={{ padding: '1.5rem 2rem' }}>
          {view === 'list' && <TestListView onOpen={openEditor} />}
          {view === 'editor' && editTest && <TestEditor test={editTest} setTest={setEditTest} onBack={backToList} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
