<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GENERIC: Required-By Field — In Context</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #393939; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .oe-shell { background: #f4f4f4; min-height: 100vh; }
    .oe-topbar { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
    .oe-topbar .logo { font-weight: 600; font-size: 14px; }
    .oe-topbar .nav-item { font-size: 13px; opacity: 0.7; cursor: pointer; }
    .oe-topbar .nav-item:hover { opacity: 1; }
    .oe-topbar .spacer { flex: 1; }
    .oe-topbar .user { font-size: 12px; opacity: 0.7; }
    .oe-breadcrumb { background: #fff; padding: 8px 24px; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #525252; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-breadcrumb .sep { margin: 0 6px; color: #c6c6c6; }
    .oe-page { padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
    .oe-page-header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; }
    .oe-page-title { font-size: 28px; font-weight: 300; margin: 0; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin: 4px 0 0 0; }
    .tile { background: #fff; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 0.75rem 0; }
    .form-field { margin-bottom: 0.75rem; }
    .form-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d;
      font-size: 14px; background: #f4f4f4; outline: none; box-sizing: border-box;
    }
    .form-field input[readonly] { background: #e0e0e0; color: #525252; }
    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .helper { font-size: 12px; color: #525252; }
    .btn { padding: 6px 14px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: #0f62fe; }
    .btn-secondary { background: #393939; color: #fff; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
    .new-region { border: 2px dashed #f1c21b; border-radius: 6px; padding: 12px; position: relative; margin-bottom: 1rem; }
    .new-region::before {
      content: 'GENERIC NEW'; position: absolute; top: -11px; left: 12px;
      background: #f1c21b; color: #000; font-size: 11px; font-weight: 700;
      padding: 1px 8px; border-radius: 4px; z-index: 2;
    }
    .scenes { background: #393939; color: #fff; display: flex; padding: 0; }
    .scene { padding: 10px 16px; cursor: pointer; font-size: 13px; border-right: 1px solid #525252; }
    .scene:hover { background: #525252; }
    .scene.active { background: #0f62fe; font-weight: 600; }
    .toggle-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e0e0e0; }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row label { font-size: 14px; font-weight: 500; min-width: 120px; }
    .toggle { width: 48px; height: 24px; border-radius: 12px; background: #c6c6c6; position: relative; cursor: pointer; transition: background 0.15s; }
    .toggle.on { background: #24a148; }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .toggle.on::after { transform: translateX(24px); }
    .toggle-state { font-size: 12px; color: #525252; min-width: 60px; }
    .progress-bar { display: flex; gap: 0; margin-bottom: 1rem; background: #fff; border: 1px solid #e0e0e0; }
    .progress-step { flex: 1; padding: 12px 16px; font-size: 13px; border-right: 1px solid #e0e0e0; }
    .progress-step:last-child { border-right: none; }
    .progress-step.current { background: #d0e2ff; color: #002d9c; font-weight: 600; }
    .progress-step.pending { background: #f4f4f4; color: #525252; }
    .progress-step .step-label { display: block; font-weight: 600; }
    .progress-step .step-desc { font-size: 11px; color: #525252; margin-top: 2px; }
    .badge-row { display: flex; align-items: center; gap: 8px; }
    .domain-badge { padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }
    .domain-badge.purple { background: #e8daff; color: #491d8b; }
    .cds-tabs { display: flex; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .cds-tab { padding: 12px 20px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
    .cds-tab.active { border-bottom-color: #0f62fe; font-weight: 600; color: #161616; background: #f4f4f4; }
  </style>
</head>
<body>
  <div class="preview-banner">⚡ GENERIC — Required-By Field on Order Entry Step 1 — IN-CONTEXT preview (cross-cutting OE feature, not part of OGC-527)</div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function Topbar() {
      return (
        <div className="oe-topbar">
          <span className="logo">OpenELIS Global</span>
          <span className="nav-item">Home</span>
          <span className="nav-item">Order</span>
          <span className="nav-item">Patient</span>
          <span className="nav-item">Reports</span>
          <span className="nav-item">Admin</span>
          <span className="spacer"></span>
          <span className="user">caseyi · Reception Clerk</span>
        </div>
      );
    }

    function Breadcrumb({ trail }) {
      return (
        <div className="oe-breadcrumb">
          {trail.map((t, i) => (
            <span key={i}>
              {i > 0 && <span className="sep">›</span>}
              {i < trail.length - 1 ? <a href="#">{t}</a> : <strong>{t}</strong>}
            </span>
          ))}
        </div>
      );
    }

    function PageHeader({ title, subtitle }) {
      return (
        <div className="oe-page-header">
          <h1 className="oe-page-title">{title}</h1>
          {subtitle && <p className="oe-page-subtitle">{subtitle}</p>}
        </div>
      );
    }

    function Scene1_OrderEntry() {
      const [domainExample, setDomainExample] = useState('Environmental');
      return (
        <div>
          <Breadcrumb trail={['Order', 'Order Entry', 'New Order — Step 1']} />
          <PageHeader
            title={`Order Entry — Step 1`}
            subtitle={`Cross-cutting Required-By field. Renders on Step 1 for ALL order types — clinical, env, vector, EQA. Below shown for ${domainExample}.`}
          />
          <div className="oe-page">
            <div className="tile">
              <p className="helper" style={{ marginBottom: 8 }}>Switch the example to see how the field appears in any domain:</p>
              <div className="badge-row">
                {['Clinical', 'Environmental', 'Vector', 'EQA'].map(d => (
                  <button key={d}
                    className={`btn ${domainExample === d ? 'btn-primary' : 'btn-ghost'}`}
                    style={{ padding: '4px 12px', fontSize: 12 }}
                    onClick={() => setDomainExample(d)}>
                    {d}
                  </button>
                ))}
              </div>
            </div>

            <div className="progress-bar">
              <div className="progress-step current">
                <span className="step-label">1 — Order Setup</span>
                <span className="step-desc">In progress</span>
              </div>
              <div className="progress-step pending">
                <span className="step-label">2 — Sample Collection / Label</span>
                <span className="step-desc">Pending</span>
              </div>
              <div className="progress-step pending">
                <span className="step-label">3 — Review / Submit</span>
                <span className="step-desc">Pending</span>
              </div>
            </div>

            <div className="tile">
              <h5>Order Header (existing)</h5>
              <div className="grid grid-3">
                <div className="form-field"><label>Lab Number</label><input value={`${domainExample === 'Environmental' ? 'ENV' : domainExample === 'Vector' ? 'VEC' : domainExample === 'EQA' ? 'EQA' : 'CLN'}-2026-0428`} readOnly /></div>
                <div className="form-field"><label>Domain</label><input value={domainExample} readOnly /></div>
                <div className="form-field"><label>Priority</label>
                  <select defaultValue="Routine"><option>Routine</option><option>Urgent</option><option>STAT</option></select>
                </div>
              </div>
            </div>

            {domainExample !== 'EQA' && (
              <div className="tile">
                <h5>{domainExample === 'Environmental' || domainExample === 'Vector' ? 'Sampling Site / Source (existing)' : 'Patient Information (existing)'}</h5>
                <p className="helper">— existing form fields preserved as-is —</p>
              </div>
            )}

            <div className="new-region">
              <div className="tile" style={{ marginBottom: 0 }}>
                <h5>📅 Required By</h5>
                <p className="helper" style={{ marginBottom: 12 }}>
                  Optional by default. Required if your lab unit configures it for this domain.
                  When configured Required, Step 1 cannot submit without a value entered.
                </p>
                <div className="grid grid-3">
                  <div className="form-field"><label>Required-by date</label><input type="date" /></div>
                  <div className="form-field"><label>Time</label><input type="time" /></div>
                  <div></div>
                </div>
              </div>
            </div>

            <div className="tile">
              <h5>{domainExample === 'EQA' ? 'EQA Configuration (Tab 2)' : 'Tests'} (existing)</h5>
              {domainExample === 'EQA' && (
                <p className="helper" style={{ background: '#fff8e1', padding: 8, borderLeft: '3px solid #f1c21b' }}>
                  ⚠️ Migration note: existing EQA Tab 2 <code>testing_deadline</code> field is REMOVED — EQA now reads from the unified Required-By above.
                  Existing alert system (3-day, 1-day, 4-hour) reads from the new column unchanged.
                </p>
              )}
              <p className="helper">— existing form fields preserved as-is —</p>
            </div>

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">Cancel</button>
                <button className="btn btn-secondary">💾 Save Draft</button>
                <button className="btn btn-primary">Continue →</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Scene2_LabUnitAdmin() {
      const [config, setConfig] = useState({ Clinical: false, Env: true, Vector: true, EQA: true });
      return (
        <div>
          <Breadcrumb trail={['Admin', 'Configuration', 'Lab Units', 'Env Lab Jakarta']} />
          <PageHeader title="Lab Unit — Env Lab Jakarta" subtitle="Configuration for this lab unit." />
          <div className="oe-page">
            <div className="cds-tabs">
              <div className="cds-tab">Basic Info</div>
              <div className="cds-tab">Address & Contact</div>
              <div className="cds-tab active">Order Defaults</div>
              <div className="cds-tab">Permissions</div>
            </div>

            <div className="tile">
              <h5>Basic Configuration (existing)</h5>
              <div className="grid grid-2">
                <div className="form-field"><label>Name</label><input value="Env Lab Jakarta" readOnly /></div>
                <div className="form-field"><label>Domain Assignment</label><input value="Environmental" readOnly /></div>
                <div className="form-field"><label>Lab Number Prefix</label><input value="ENV-" readOnly /></div>
                <div className="form-field"><label>Default Workflow</label><input value="3-step Reception" readOnly /></div>
              </div>
            </div>

            <div className="new-region">
              <div className="tile" style={{ marginBottom: 0 }}>
                <h5>Required-By Field — Per-Domain Required Flag</h5>
                <p className="helper" style={{ marginBottom: 16 }}>
                  When toggled on, orders of that domain cannot submit Step 1 without a Required-By date entered.
                </p>
                {['Clinical', 'Env', 'Vector', 'EQA'].map(d => (
                  <div className="toggle-row" key={d}>
                    <label>{d}</label>
                    <div className={`toggle ${config[d] ? 'on' : ''}`}
                         onClick={() => setConfig(prev => ({ ...prev, [d]: !prev[d] }))} />
                    <span className="toggle-state">{config[d] ? 'Required' : 'Optional'}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">Cancel</button>
                <button className="btn btn-primary">💾 Save Lab Unit</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [scene, setScene] = useState(0);
      const scenes = [
        { label: '1 — Order Entry Step 1 (any domain)', cmp: <Scene1_OrderEntry /> },
        { label: '2 — Lab Unit Admin (per-domain config)', cmp: <Scene2_LabUnitAdmin /> },
      ];
      return (
        <div className="oe-shell">
          <Topbar />
          <div className="scenes">
            {scenes.map((s, i) => (
              <div key={i} className={`scene ${scene === i ? 'active' : ''}`} onClick={() => setScene(i)}>{s.label}</div>
            ))}
          </div>
          {scenes[scene].cmp}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
