<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S-09 v2.0: Eligibility Gate & Resampling — In Context</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #491d8b; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }

    /* OE chrome */
    .oe-shell { background: #f4f4f4; min-height: 100vh; }
    .oe-topbar { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
    .oe-topbar .logo { font-weight: 600; font-size: 14px; letter-spacing: 0.02em; }
    .oe-topbar .nav-item { font-size: 13px; opacity: 0.7; cursor: pointer; }
    .oe-topbar .nav-item:hover { opacity: 1; }
    .oe-topbar .spacer { flex: 1; }
    .oe-topbar .user { font-size: 12px; opacity: 0.7; }

    .oe-breadcrumb { background: #fff; padding: 8px 24px; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #525252; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-breadcrumb .sep { margin: 0 6px; color: #c6c6c6; }

    .oe-page { padding: 16px 24px; max-width: 1300px; margin: 0 auto; }
    .oe-page-header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; }
    .oe-page-title { font-size: 28px; font-weight: 300; margin: 0; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin: 4px 0 0 0; }

    .tile { background: #fff; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 0.75rem 0; }

    /* Form fields */
    .form-field { margin-bottom: 0.75rem; }
    .form-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d;
      font-size: 14px; background: #f4f4f4; outline: none; box-sizing: border-box;
    }
    .form-field input[readonly] { background: #e0e0e0; color: #525252; }
    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    /* Buttons */
    .btn { padding: 6px 14px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: #0f62fe; }
    .btn-primary { background: #0f62fe; color: #fff; }
    .btn-tertiary { background: #fff; color: #0f62fe; border: 1px solid #0f62fe; padding: 4px 12px; font-size: 12px; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; background: #f4f4f4; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e0e0e0; }
    th.new-col { background: #fcf4d6; }
    td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    td code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #f4f4f4; padding: 2px 6px; }

    /* Tags */
    .tag { display: inline-block; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }
    .tag-green { background: #defbe6; color: #0e6027; }
    .tag-warm-gray { background: #f7e9d0; color: #5e4118; }
    .tag-red { background: #ffd7d9; color: #a2191f; }
    .tag-blue { background: #d0e2ff; color: #002d9c; }
    .tag-purple { background: #e8daff; color: #491d8b; }
    .tag-gray { background: #e0e0e0; color: #161616; }

    /* Annotation regions */
    .new-region { border: 2px dashed #f1c21b; border-radius: 6px; padding: 12px; position: relative; margin-bottom: 1rem; }
    .new-region::before {
      content: attr(data-label); position: absolute; top: -11px; left: 12px;
      background: #f1c21b; color: #000; font-size: 11px; font-weight: 700;
      padding: 1px 8px; border-radius: 4px; z-index: 2;
    }

    /* Carbon-style tabs */
    .cds-tabs { display: flex; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .cds-tab {
      padding: 12px 20px; cursor: pointer; font-size: 14px;
      border-bottom: 2px solid transparent; position: relative;
    }
    .cds-tab.active { border-bottom-color: #0f62fe; font-weight: 600; color: #161616; background: #f4f4f4; }
    .cds-tab.new-tab::after {
      content: 'NEW';
      position: absolute; top: 4px; right: 6px;
      background: #f1c21b; color: #000; font-size: 9px; font-weight: 700;
      padding: 1px 4px; border-radius: 2px;
    }

    /* Scene navigation */
    .scenes { background: #393939; color: #fff; display: flex; padding: 0; }
    .scene { padding: 10px 16px; cursor: pointer; font-size: 13px; border-right: 1px solid #525252; }
    .scene:hover { background: #525252; }
    .scene.active { background: #0f62fe; font-weight: 600; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(22,22,22,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; max-width: 640px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .modal h3 { margin-top: 0; }
    .modal .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }

    /* Step progress bar (S-03 v2.0) */
    .progress-bar { display: flex; gap: 0; margin-bottom: 1rem; background: #fff; border: 1px solid #e0e0e0; }
    .progress-step { flex: 1; padding: 12px 16px; font-size: 13px; border-right: 1px solid #e0e0e0; }
    .progress-step:last-child { border-right: none; }
    .progress-step.current { background: #d0e2ff; color: #002d9c; font-weight: 600; }
    .progress-step.complete { background: #defbe6; color: #0e6027; }
    .progress-step.pending { background: #f4f4f4; color: #525252; }
    .progress-step .step-label { display: block; font-weight: 600; }
    .progress-step .step-desc { font-size: 11px; color: #525252; margin-top: 2px; }

    .helper { font-size: 12px; color: #525252; }
    .info-box { padding: 12px; background: #edf5ff; border-left: 3px solid #0f62fe; font-size: 13px; }
    .info-box ul { margin: 6px 0 0 16px; padding: 0; }
    textarea { min-height: 60px; resize: vertical; }
    .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
    .stack-h { display: flex; gap: 8px; align-items: center; }

    /* Domain badge area */
    .badge-row { display: flex; align-items: center; gap: 8px; }
    .domain-badge.purple { background: #e8daff; color: #491d8b; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }

    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; cursor: pointer; }
    .radio-row input[type="radio"] { margin-top: 2px; }

    .ack-box { margin-top: 16px; padding: 16px; border: 1px solid #e0e0e0; background: #fcf4d6; }

    /* Domain filter pills (Sample Type list) */
    .filter-pills { display: flex; gap: 8px; }
    .filter-pill { padding: 4px 12px; border: 1px solid #c6c6c6; background: #fff; cursor: pointer; font-size: 12px; }
    .filter-pill.active { background: #161616; color: #fff; border-color: #161616; }
  </style>
</head>
<body>
  <div class="preview-banner">⚡ S-09 v2.0 — Eligibility Gate & Resampling — IN-CONTEXT preview (label criterion removed; OE chrome included)</div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SAMPLES = [
      { id: 's-1', idx: 1, type: 'Surface Water', accession: 'ENV-2026-0412.001', transitH: 4, volMl: 500, tempC: 4.5, status: 'eligible' },
      { id: 's-2', idx: 2, type: 'Surface Water', accession: 'ENV-2026-0412.002', transitH: 26, volMl: 500, tempC: 6.0, status: 'review' },
      { id: 's-3', idx: 3, type: 'Groundwater',   accession: 'ENV-2026-0412.003', transitH: 8, volMl: 250, tempC: 18.0, status: 'review' },
    ];

    const CRITERIA = {
      'Surface Water': { transit: 24, volMin: 500, volMax: 1000, tempMin: 0, tempMax: 6 },
      'Groundwater':   { transit: 24, volMin: 500, volMax: 1000, tempMin: 0, tempMax: 6 },
    };

    function evaluate(s) {
      const c = CRITERIA[s.type] || {};
      return [
        { name: 'Transit time max',     pass: s.transitH <= c.transit, detail: `${s.transitH}h vs max ${c.transit}h` },
        { name: 'Volume in range',      pass: s.volMl >= c.volMin && s.volMl <= c.volMax, detail: `${s.volMl}mL vs ${c.volMin}–${c.volMax}mL` },
        { name: 'Receipt temp in range', pass: s.tempC >= c.tempMin && s.tempC <= c.tempMax, detail: `${s.tempC}°C vs ${c.tempMin}–${c.tempMax}°C` },
        { name: 'Container type valid', pass: true, detail: 'Sterile bottle (HDPE)' },
      ];
    }

    function Topbar() {
      return (
        <div className="oe-topbar">
          <span className="logo">OpenELIS Global</span>
          <span className="nav-item">Home</span>
          <span className="nav-item">Order</span>
          <span className="nav-item">Patient</span>
          <span className="nav-item">Reports</span>
          <span className="nav-item">Admin</span>
          <span className="spacer"></span>
          <span className="user">caseyi · Lab Manager</span>
        </div>
      );
    }

    function Breadcrumb({ trail }) {
      return (
        <div className="oe-breadcrumb">
          {trail.map((t, i) => (
            <span key={i}>
              {i > 0 && <span className="sep">›</span>}
              {i < trail.length - 1 ? <a href="#">{t}</a> : <strong>{t}</strong>}
            </span>
          ))}
        </div>
      );
    }

    function PageHeader({ title, subtitle }) {
      return (
        <div className="oe-page-header">
          <h1 className="oe-page-title">{title}</h1>
          {subtitle && <p className="oe-page-subtitle">{subtitle}</p>}
        </div>
      );
    }

    function Scene1_SampleTypeAdmin() {
      const [tab, setTab] = useState(5); // Acceptance Criteria tab is the new 6th
      return (
        <div>
          <Breadcrumb trail={['Admin', 'Test Catalog Management', 'Sample Type Management', 'Surface Water']} />
          <PageHeader
            title="Sample Type — Surface Water"
            subtitle="Edit sample type configuration. Used by 7 active tests across Environmental orders."
          />
          <div className="oe-page">
            <div className="cds-tabs">
              <div className={`cds-tab ${tab === 0 ? 'active' : ''}`} onClick={() => setTab(0)}>Basic Info</div>
              <div className={`cds-tab ${tab === 1 ? 'active' : ''}`} onClick={() => setTab(1)}>Display Order</div>
              <div className={`cds-tab ${tab === 2 ? 'active' : ''}`} onClick={() => setTab(2)}>Associated Tests</div>
              <div className={`cds-tab ${tab === 3 ? 'active' : ''}`} onClick={() => setTab(3)}>Storage & Disposal</div>
              <div className={`cds-tab ${tab === 4 ? 'active' : ''}`} onClick={() => setTab(4)}>WHONET Mapping</div>
              <div className={`cds-tab new-tab ${tab === 5 ? 'active' : ''}`} onClick={() => setTab(5)}>Acceptance Criteria</div>
            </div>

            {tab === 0 && (
              <div className="tile">
                <div className="grid grid-2">
                  <div className="form-field"><label>Name *</label><input value="Surface Water" readOnly /></div>
                  <div className="form-field"><label>Code</label><input value="WATER_SURFACE" readOnly /></div>
                  <div className="form-field"><label>Domain (S-04)</label><input value="ENVIRONMENTAL" readOnly /></div>
                  <div className="form-field"><label>Active</label><input value="Yes" readOnly /></div>
                </div>
                <p className="helper">Other tabs (Display Order, Associated Tests, Storage & Disposal, WHONET Mapping) preserved from existing OE Sample Type admin (OGC-296).</p>
              </div>
            )}
            {tab >= 1 && tab <= 4 && (
              <div className="tile"><p className="helper">Existing tab content preserved unchanged from OE Sample Type admin (OGC-296). Click "Acceptance Criteria" tab to see S-09 v2 additions.</p></div>
            )}
            {tab === 5 && (
              <div className="new-region" data-label="S-09 v2 NEW TAB">
                <div className="tile" style={{ marginBottom: 0 }}>
                  <h5>Acceptance Criteria — Surface Water</h5>
                  <p className="helper" style={{ marginBottom: 16 }}>
                    Optional rules that drive the eligibility checklist at S-03 v2.0 Step 3.
                    If empty, the gate is effectively skipped for this sample type.
                  </p>
                  <div className="grid grid-3">
                    <div className="form-field"><label>Transit time max (hours)</label><input type="number" defaultValue={24} min={0} /></div>
                    <div className="form-field"><label>Volume min (mL)</label><input type="number" defaultValue={500} /></div>
                    <div className="form-field"><label>Volume max (mL)</label><input type="number" defaultValue={1000} /></div>
                    <div className="form-field"><label>Receipt temp min (°C)</label><input type="number" defaultValue={0} step={0.1} /></div>
                    <div className="form-field"><label>Receipt temp max (°C)</label><input type="number" defaultValue={6} step={0.1} /></div>
                  </div>
                  <div className="form-field"><label>Required container types (comma-separated)</label><input defaultValue="Sterile bottle (HDPE), Brown glass" /></div>
                  <p className="helper" style={{ marginTop: 12, fontStyle: 'italic' }}>
                    Note: label-completeness checks are handled by the existing OE label management module — not configured here.
                  </p>
                </div>
              </div>
            )}

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">Cancel</button>
                <button className="btn btn-primary">💾 Save Sample Type</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Scene2_Step3() {
      const [openId, setOpenId] = useState(null);
      const open = SAMPLES.find(s => s.id === openId);
      const crit = open ? evaluate(open) : [];
      return (
        <div>
          <Breadcrumb trail={['Order', 'Order Entry', 'ENV-2026-0412 — Step 3']} />
          <PageHeader
            title="Order ENV-2026-0412 — Step 3 (QA/QC + Intake Acceptance)"
            subtitle="3 client samples + 0 QC samples. Site: WS-001 Ciliwung."
          />
          <div className="oe-page">
            <div className="progress-bar">
              <div className="progress-step complete">
                <span className="step-label">1 — Branch & Order Setup</span>
                <span className="step-desc">Done</span>
              </div>
              <div className="progress-step complete">
                <span className="step-label">2 — Label & Store</span>
                <span className="step-desc">Done</span>
              </div>
              <div className="progress-step current">
                <span className="step-label">3 — QA/QC + Intake</span>
                <span className="step-desc">In progress</span>
              </div>
            </div>

            <div className="tile">
              <div className="badge-row" style={{ marginBottom: 8 }}>
                <span className="domain-badge purple">Environmental</span>
                <span className="helper">Lab #: ENV-2026-0412</span>
              </div>
            </div>

            <div className="tile">
              <h5>Sample Intake (existing) + Eligibility (S-09 v2 new column)</h5>
              <table>
                <thead>
                  <tr>
                    <th>#</th><th>Sample Type</th><th>Accession</th>
                    <th className="new-col">Eligibility (new)</th>
                    <th>NCE Button</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {SAMPLES.map(s => (
                    <tr key={s.id}>
                      <td>{s.idx}</td>
                      <td>{s.type}</td>
                      <td><code>{s.accession}</code></td>
                      <td>
                        {s.status === 'eligible'
                          ? <span className="tag tag-green">✓ Eligible</span>
                          : <span className="tag tag-warm-gray">⚠ Review</span>}
                      </td>
                      <td><button className="btn btn-tertiary">⚠ Flag NCE</button></td>
                      <td><button className="btn btn-ghost" onClick={() => setOpenId(s.id)}>Open Eligibility →</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="helper" style={{ marginTop: 8 }}>⚠️ Yellow column = new from S-09 v2. NCE Button column from S-03 v2.0 §5.3.1 (existing).</p>
            </div>

            {open && (
              <div className="new-region" data-label="S-09 v2 SIDE PANEL">
                <div className="tile" style={{ marginBottom: 0 }}>
                  <h5>Eligibility Checklist — {open.accession} ({open.type})</h5>
                  <table>
                    <thead><tr><th style={{ width: 60 }}>Status</th><th>Criterion</th><th>Detail</th></tr></thead>
                    <tbody>
                      {crit.map(c => (
                        <tr key={c.name}>
                          <td>{c.pass ? <span className="tag tag-green">✓</span> : <span className="tag tag-red">✕</span>}</td>
                          <td>{c.name}</td>
                          <td><span style={{ fontSize: 12, color: c.pass ? '#525252' : '#a2191f' }}>{c.detail}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <p className="helper" style={{ marginTop: 12 }}>Failing criteria pre-populate the existing NCE dialog reason picklist when the operator clicks Flag NCE.</p>
                  <div className="actions">
                    <button className="btn btn-ghost" onClick={() => setOpenId(null)}>Close panel</button>
                  </div>
                </div>
              </div>
            )}

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">← Back to Step 2</button>
                <button className="btn btn-primary">Submit Batch →</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Scene3_NceDialog() {
      const [show, setShow] = useState(true);
      const [action, setAction] = useState('flag');
      const [reason, setReason] = useState('TRANSIT-EXCEEDED');
      return (
        <div>
          <Breadcrumb trail={['Order', 'Order Entry', 'ENV-2026-0412 — Step 3', 'Flag NCE']} />
          <PageHeader title="Order ENV-2026-0412 — Step 3 (NCE Dialog open)" />
          <div className="oe-page">
            <div className="tile">
              <p className="helper">
                Click below to re-open the NCE dialog. The dialog itself is overlaid on the existing Step 3 page.
                The S-09 v2 addition is the third radio option (Resample) and the on-commit notification flow.
              </p>
              <button className="btn btn-primary" onClick={() => setShow(true)}>Open NCE Dialog</button>
            </div>

            {show && (
              <div className="modal-overlay">
                <div className="modal">
                  <h3>Flag NCE — Sample ENV-2026-0412.002</h3>
                  <p className="helper" style={{ marginBottom: 16 }}>
                    The dialog itself, coded reason picklist, and Notes are <strong>existing OE NCE pattern</strong>.
                    The Sample Action radio group below has the new "Resample" option from S-09 v2.
                  </p>

                  <div className="form-field">
                    <label>NCE Reason (existing coded picklist)</label>
                    <select value={reason} onChange={(e) => setReason(e.target.value)}>
                      <option value="TRANSIT-EXCEEDED">Transit time exceeded</option>
                      <option value="COND-BROKEN">Cold-chain broken</option>
                      <option value="CONT-DAMAGED">Container damaged</option>
                      <option value="VOL-INSUFFICIENT">Volume insufficient</option>
                    </select>
                  </div>

                  <div className="new-region" data-label="S-09 v2 NEW">
                    <p className="helper" style={{ marginBottom: 8 }}>Sample Action (new third radio)</p>
                    <div className="radio-group">
                      <label className="radio-row">
                        <input type="radio" name="action" value="flag" checked={action === 'flag'} onChange={(e) => setAction(e.target.value)} />
                        Continue with NCE flag (existing)
                      </label>
                      <label className="radio-row">
                        <input type="radio" name="action" value="reject" checked={action === 'reject'} onChange={(e) => setAction(e.target.value)} />
                        Reject sample (existing)
                      </label>
                      <label className="radio-row">
                        <input type="radio" name="action" value="resample" checked={action === 'resample'} onChange={(e) => setAction(e.target.value)} />
                        <span><strong>Resample</strong> — create linked new order + notify customer (NEW)</span>
                      </label>
                    </div>

                    {action === 'resample' && (
                      <div className="info-box" style={{ marginTop: 12 }}>
                        <strong>On commit:</strong>
                        <ul>
                          <li>Original sample marked <code>REJECTED_RESAMPLING</code> (terminal)</li>
                          <li>New Draft order created with <code>resampled_from = ENV-2026-0412</code>; site, standard, sample types, tests pre-populated</li>
                          <li>✉️ Notification sent to original requester via configured channel (email or TextIt SMS)</li>
                        </ul>
                      </div>
                    )}
                  </div>

                  <div className="form-field">
                    <label>Notes (existing free-text)</label>
                    <textarea rows={2} placeholder="Additional context for the NCE record"></textarea>
                  </div>

                  <div className="actions">
                    <button className="btn btn-ghost" onClick={() => setShow(false)}>Cancel</button>
                    <button className="btn btn-primary" onClick={() => setShow(false)}>Commit NCE</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Scene4_LabUnitAdmin() {
      const [gate, setGate] = useState({ Clinical: 'Prompted', Env: 'Mandatory', Vector: 'Mandatory' });
      return (
        <div>
          <Breadcrumb trail={['Admin', 'Configuration', 'Lab Units', 'Env Lab Jakarta']} />
          <PageHeader title="Lab Unit — Env Lab Jakarta" subtitle="Configuration for this lab unit." />
          <div className="oe-page">
            <div className="tile">
              <h5>Basic Configuration (existing)</h5>
              <div className="grid grid-2">
                <div className="form-field"><label>Name</label><input value="Env Lab Jakarta" readOnly /></div>
                <div className="form-field"><label>Domain Assignment</label><input value="Environmental" readOnly /></div>
                <div className="form-field"><label>Address</label><input value="Jl. Sudirman No. 12, Jakarta" readOnly /></div>
                <div className="form-field"><label>Lab Number Prefix</label><input value="ENV-" readOnly /></div>
              </div>
            </div>

            <div className="new-region" data-label="S-09 v2 NEW SECTION">
              <div className="tile" style={{ marginBottom: 0 }}>
                <h5>Eligibility Gate Behavior (per domain)</h5>
                <p className="helper" style={{ marginBottom: 12 }}>
                  Mandatory: block submit if any sample failing criteria. Prompted: show but allow single-click override. Disabled: hide criteria checklist.
                </p>
                <table>
                  <thead><tr><th>Domain</th><th>Gate Behavior</th></tr></thead>
                  <tbody>
                    {['Clinical', 'Env', 'Vector'].map(d => (
                      <tr key={d}>
                        <td>{d}</td>
                        <td>
                          <select value={gate[d]} onChange={(e) => setGate(prev => ({ ...prev, [d]: e.target.value }))}>
                            <option value="Mandatory">Mandatory — block submit if any sample failing</option>
                            <option value="Prompted">Prompted — show but allow single-click override</option>
                            <option value="Disabled">Disabled — hide criteria checklist</option>
                          </select>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="tile">
              <div className="actions">
                <button className="btn btn-ghost">Cancel</button>
                <button className="btn btn-primary">💾 Save Lab Unit</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [scene, setScene] = useState(0);
      const scenes = [
        { label: '1 — Sample Type Admin (new tab)', cmp: <Scene1_SampleTypeAdmin /> },
        { label: '2 — Step 3 with Eligibility', cmp: <Scene2_Step3 /> },
        { label: '3 — NCE Dialog (Resample option)', cmp: <Scene3_NceDialog /> },
        { label: '4 — Lab Unit Admin (gate config)', cmp: <Scene4_LabUnitAdmin /> },
      ];
      return (
        <div className="oe-shell">
          <Topbar />
          <div className="scenes">
            {scenes.map((s, i) => (
              <div key={i} className={`scene ${scene === i ? 'active' : ''}`} onClick={() => setScene(i)}>{s.label}</div>
            ))}
          </div>
          {scenes[scene].cmp}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
