<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-App Help Viewer v1.2 | OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #525252; margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #161616; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 12px; background: #262626; color: #f4f4f4; font-size: 12px; }
    .controls .grp { display: flex; align-items: center; gap: 6px; }
    .controls .grp > span { color: #c6c6c6; }
    .controls button { background: #393939; color: #fff; border: 0; padding: 4px 10px; font-size: 11px; cursor: pointer; border-radius: 2px; }
    .controls button.on { outline: 2px solid #fff; background: #0f62fe; }

    .split { display: flex; gap: 8px; padding: 12px; height: calc(100vh - 92px); box-sizing: border-box; }
    .pane { background: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,.25); border-radius: 4px; overflow: hidden; min-width: 0; }
    .pane.oe { flex: 1; }
    .pane.help { flex: 1.3; }
    .pane.help.narrow { flex: 0 0 480px; }
    .chrome { background: #393939; padding: 6px 8px 0 8px; }
    .chrome .tab { display: inline-flex; align-items: center; gap: 6px; background: #f4f4f4; color: #161616; padding: 6px 12px 6px 10px; border-radius: 6px 6px 0 0; font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chrome .fav { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
    .chrome .url { background: #161616; color: #c6c6c6; padding: 4px 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 4px; border-radius: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .pane-body { flex: 1; overflow: auto; position: relative; display: flex; flex-direction: column; }

    /* ---- OpenELIS tab (left) ---- */
    .oe-header { color: #fff; height: 40px; display: flex; align-items: center; padding: 0 12px; position: sticky; top: 0; z-index: 5; }
    .oe-header .brand { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .oe-header .actions { margin-left: auto; display: flex; }
    .oe-header .actions button { background: transparent; border: 0; color: #fff; width: 40px; height: 40px; cursor: pointer; font-size: 13px; }
    .oe-header .actions button.on { background: rgba(255,255,255,.18); }
    .oe-help-panel { position: absolute; top: 40px; right: 0; width: 230px; background: #295785; color: #fff; padding: 4px 0; box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 6; }
    .oe-help-panel button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: #fff; padding: 10px 16px; font-size: 12px; cursor: pointer; }
    .oe-help-panel button:hover { background: rgba(255,255,255,.15); }
    .oe-help-panel .hint { font-size: 10px; color: #d0e2ff; padding: 0 16px 6px; }
    .oe-page { padding: 12px 16px; }
    .oe-page .crumb { font-size: 11px; color: #525252; margin-bottom: 8px; }
    .oe-page h2 { font-size: 16px; font-weight: 400; margin: 0 0 12px; }
    .oe-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border-bottom: 1px solid #e0e0e0; font-size: 11px; padding: 6px 0; }
    .oe-row.h { font-weight: 600; background: #f4f4f4; padding: 6px 4px; }

    /* ---- Help tab (right) ---- */
    .hh { color: #fff; height: 48px; display: flex; align-items: center; padding: 0 8px 0 12px; position: sticky; top: 0; z-index: 5; gap: 10px; flex: 0 0 auto; }
    .hh .menu { background: transparent; border: 0; color: #fff; width: 32px; height: 32px; font-size: 18px; cursor: pointer; }
    .hh .brand { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .hh .logo { width: 22px; height: 22px; border-radius: 4px; background: #fff; color: #161616; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .hh .search { flex: 1; max-width: 320px; min-width: 120px; }
    .hh .search input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.16); border: 0; border-bottom: 1px solid rgba(255,255,255,.5); color: #fff; padding: 0 10px; height: 32px; font-size: 13px; }
    .hh .search input::placeholder { color: #e0e0e0; }
    .hh .locale { font-size: 11px; border: 1px solid rgba(255,255,255,.6); padding: 2px 6px; border-radius: 10px; }
    .hh .return { margin-left: auto; background: transparent; border: 0; color: #fff; padding: 0 10px; height: 48px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .hh .return:hover { background: rgba(255,255,255,.15); }

    .hg { display: flex; flex: 1; min-height: 0; position: relative; }
    .rail { width: 270px; min-width: 270px; background: #f4f4f4; border-right: 1px solid #e0e0e0; overflow-y: auto; padding: 8px 0 24px; }
    .narrow .rail { position: absolute; top: 0; bottom: 0; left: 0; z-index: 8; box-shadow: 4px 0 12px rgba(0,0,0,.25); }
    .rail .sec { font-size: 11px; font-weight: 600; letter-spacing: .32px; color: #525252; text-transform: uppercase; padding: 12px 16px 4px; }
    .rail .folder { display: flex; align-items: center; justify-content: space-between; width: 100%; background: transparent; border: 0; text-align: left; padding: 8px 16px; font-size: 13px; color: #161616; cursor: pointer; font-weight: 600; }
    .rail .folder:hover { background: #e8e8e8; }
    .rail .item { display: block; padding: 7px 16px 7px 28px; font-size: 13px; color: #525252; text-decoration: none; border-left: 3px solid transparent; cursor: pointer; }
    .rail .item:hover { background: #e8e8e8; color: #161616; }
    .rail .item.active { background: #fff; color: #161616; font-weight: 600; border-left-color: var(--brand-primary); }
    .rail .result { display: block; padding: 8px 16px; cursor: pointer; border-bottom: 1px solid #e0e0e0; }
    .rail .result:hover { background: #e8e8e8; }
    .rail .result .t { font-size: 13px; color: #161616; font-weight: 600; }
    .rail .result .s { font-size: 12px; color: #525252; margin-top: 2px; }
    .rail .result mark { background: #fcf4d6; padding: 0 1px; }
    .rail .empty { padding: 12px 16px; font-size: 13px; color: #525252; }

    .main { flex: 1; overflow-y: auto; min-width: 0; }
    .main-inner { max-width: 920px; padding: 16px 24px 48px; }
    .bc { font-size: 12px; color: #525252; margin-bottom: 12px; }
    .bc a { color: var(--brand-primary); cursor: pointer; text-decoration: none; }
    .bc a:hover { text-decoration: underline; }
    .bc .sep { margin: 0 6px; color: #8d8d8d; }
    .titlerow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .titlerow h1 { font-size: 28px; font-weight: 400; line-height: 1.25; margin: 0; }
    .latest { display: inline-block; margin: 6px 0 14px; font-size: 13px; color: var(--brand-primary); cursor: pointer; text-decoration: none; }
    .latest:hover { text-decoration: underline; }
    .note { display: flex; gap: 10px; border-left: 3px solid #0043ce; background: #edf5ff; padding: 10px 14px; font-size: 13px; margin: 0 0 16px; }
    .note.err { border-left-color: #da1e28; background: #fff1f1; }
    .note b { white-space: nowrap; }

    .oe-help-content { font-size: 14px; line-height: 1.5; }
    .oe-help-content .oe-help-label { font-style: italic; color: #525252; margin: 0 0 12px; }
    .oe-help-content h2 { font-size: 20px; font-weight: 400; margin: 24px 0 8px; }
    .oe-help-content p { margin: 0 0 10px; }
    .oe-help-content ol, .oe-help-content ul { margin: 0 0 10px; padding-left: 22px; }
    .oe-help-content ol { list-style: decimal; }
    .oe-help-content ul { list-style: disc; }
    .titlerow .cds--tag { white-space: nowrap; }
    .oe-help-content li { margin-bottom: 4px; }
    .oe-help-content a { color: var(--brand-primary); }
    .oe-help-content a.oe-help-link--online::after { content: " \2197"; font-size: 11px; }
    .oe-help-content .oe-help-table-wrap { overflow-x: auto; margin: 8px 0 14px; }
    .oe-help-content table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .oe-help-content th { background: #e0e0e0; text-align: left; padding: 8px 12px; font-weight: 600; vertical-align: top; width: 30%; }
    .oe-help-content td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
    .oe-help-content thead th { width: auto; }
    .oe-help-content figure.oe-help-figure { margin: 10px 0 14px; }
    .oe-help-content .shot { background: repeating-linear-gradient(45deg, #f4f4f4, #f4f4f4 8px, #fff 8px, #fff 16px); border: 1px solid #c6c6c6; height: 150px; display: flex; align-items: center; justify-content: center; color: #6f6f6f; font-size: 12px; }
    .oe-help-content figcaption { font-size: 12px; font-style: italic; color: #525252; margin-top: 4px; }
    .oe-help-content aside.oe-help-callout { border-left: 3px solid; padding: 10px 14px; margin: 12px 0; font-size: 13px; }
    .oe-help-content aside.oe-help-callout p:last-child { margin-bottom: 0; }
    .oe-help-content .oe-help-callout--info { background: #edf5ff; border-left-color: #0043ce; }
    .oe-help-content .oe-help-callout--warning { background: #fcf4d6; border-left-color: #f1c21b; }
    .oe-help-content .oe-help-callout--success { background: #defbe6; border-left-color: #24a148; }

    .landing h1 { font-size: 28px; font-weight: 400; margin: 0 0 6px; }
    .landing .lead { color: #525252; margin: 0 0 20px; font-size: 14px; }
    .landing .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .landing .card { background: #f4f4f4; padding: 16px; }
    .landing .card h2 { font-size: 18px; font-weight: 400; margin: 0 0 10px; }
    .landing .card .f { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    .landing .card a { display: block; font-size: 13px; color: var(--brand-primary); cursor: pointer; padding: 2px 0; }

    .closed { flex: 1; background: #262626; color: #c6c6c6; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 14px; }
    .skel { height: 12px; background: linear-gradient(90deg,#e0e0e0,#f4f4f4,#e0e0e0); margin: 10px 0; }
  </style>
</head>
<body>
  <div class="preview-banner">
    Visual Preview | In-App Help Viewer (FRS v1.2, OGC-737) | Route: /help/:slug? | Opened from Main header Help (?) &rarr; User Manual | Not a live application
  </div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // ---------- UI strings (react-intl keys from FRS section 6) ----------
    const STRINGS = {
      en: {
        'help.viewer.title': 'Help',
        'help.viewer.brand': '{siteName} Help',
        'help.viewer.return-to-app': 'Return to OpenELIS',
        'help.viewer.search.placeholder': 'Search help…',
        'help.viewer.search.no-results': 'No results for "{query}"',
        'help.viewer.breadcrumb.home': 'Help',
        'help.viewer.section.user': 'User guide',
        'help.viewer.section.admin': 'Administrator guide',
        'help.viewer.menu.toggle': 'Show or hide contents',
        'help.viewer.fallback.tag': 'Available in English only',
        'help.viewer.wip.notice': 'This page is still being reviewed, so some details may change.',
        'help.viewer.link.latest': 'View the latest version online',
        'help.viewer.link.online': '(opens online documentation)',
        'help.viewer.error.not-found.title': 'Page not found',
        'help.viewer.error.not-found.body': 'The help page you requested does not exist.',
        'help.viewer.error.page.home': 'Back to help home',
        'help.viewer.landing.lead': 'Guides for this OpenELIS release. Pick a topic, or search above.',
      },
      fr: {
        'help.viewer.title': 'Aide',
        'help.viewer.brand': 'Aide {siteName}',
        'help.viewer.return-to-app': 'Retour à OpenELIS',
        'help.viewer.search.placeholder': 'Rechercher dans l’aide…',
        'help.viewer.search.no-results': 'Aucun résultat pour « {query} »',
        'help.viewer.breadcrumb.home': 'Aide',
        'help.viewer.section.user': 'Guide de l’utilisateur',
        'help.viewer.section.admin': 'Guide de l’administrateur',
        'help.viewer.menu.toggle': 'Afficher ou masquer le sommaire',
        'help.viewer.fallback.tag': 'Disponible en anglais uniquement',
        'help.viewer.wip.notice': 'Cette page est en cours de relecture ; certains détails peuvent changer.',
        'help.viewer.link.latest': 'Voir la dernière version en ligne',
        'help.viewer.link.online': '(ouvre la documentation en ligne)',
        'help.viewer.error.not-found.title': 'Page introuvable',
        'help.viewer.error.not-found.body': 'La page d’aide demandée n’existe pas.',
        'help.viewer.error.page.home': 'Retour à l’accueil de l’aide',
        'help.viewer.landing.lead': 'Guides pour cette version d’OpenELIS. Choisissez un sujet ou faites une recherche.',
      },
    };
    const tr = (locale, key, vars = {}) =>
      Object.entries(vars).reduce((s, [k, v]) => s.replace('{' + k + '}', v), STRINGS[locale][key] || STRINGS.en[key] || key);

    // ---------- Manifest (one per locale in production; merged here for the preview) ----------
    // Each page: slug (shared by locales), titles per locale, Confluence sourceUrl, wip flag, labels.
    const CONF = 'https://uwdigi.atlassian.net/wiki/spaces/OG/pages/';
    const TREE = [
      { section: 'user', folders: [
        { slug: 'getting-around-openelis', title: { en: 'Getting around OpenELIS', fr: 'Se repérer dans OpenELIS' }, pages: [
          { slug: 'log-in-and-change-your-language', title: { en: 'Log in and change your language', fr: 'Se connecter et changer de langue' }, pageId: '260931593' },
        ]},
        { slug: 'orders-and-samples', title: { en: 'Orders and samples', fr: 'Demandes et échantillons' }, pages: [
          { slug: 'enter-a-clinical-order', title: { en: 'Enter a clinical order' }, pageId: '261423127' },
        ]},
        { slug: 'results-validation-and-reports', title: { en: 'Results, validation and reports', fr: 'Résultats, validation et rapports' }, pages: [
          { slug: 'print-a-work-plan', title: { en: 'Print a work plan', fr: 'Imprimer un plan de travail' }, pageId: '272760837', wip: true },
          { slug: 'enter-and-save-results', title: { en: 'Enter and save results' }, pageId: '278626329' },
          { slug: 'results-entry-legacy-screen', title: { en: 'Results Entry (legacy screen)' }, pageId: '1653604361' },
          { slug: 'triage-and-release-results', title: { en: 'Triage and release results', fr: 'Trier et libérer les résultats' }, pageId: '1703641250' },
        ]},
      ]},
      { section: 'admin', folders: [
        { slug: 'site-and-system-settings', title: { en: 'Site and system settings', fr: 'Paramètres du site et du système' }, pages: [
          { slug: 'test-accreditation-and-report-logos', title: { en: 'Test accreditation and report logos' }, pageId: '1705246900', wip: true },
        ]},
        { slug: 'users-organizations-and-providers', title: { en: 'Users, organizations and providers', fr: 'Utilisateurs, structures et prescripteurs' }, pages: [
          { slug: 'admin-manage-sampling-sites', title: { en: 'Admin: Manage sampling sites' }, pageId: '1705083175', wip: true },
        ]},
        { slug: 'result-reporting-and-analyzers', title: { en: 'Result reporting and analyzers', fr: 'Transmission des résultats et analyseurs' }, pages: [
          { slug: 'set-up-an-analyzer', title: { en: 'Set up an analyzer' }, pageId: '1680637960' },
        ]},
      ]},
    ];

    // ---------- Page bodies, as the pipeline emits them (already sanitized) ----------
    const shot = (cap) => '<figure class="oe-help-figure"><div class="shot">Screenshot (bundled WebP)</div><figcaption>' + cap + '</figcaption></figure>';
    const glance = (rows) => '<h2 id="at-a-glance">' + rows.h + '</h2><div class="oe-help-table-wrap"><table class="oe-help-table"><tbody>' +
      rows.r.map(([k, v]) => '<tr><th>' + k + '</th><td>' + v + '</td></tr>').join('') + '</tbody></table></div>';

    const BODIES = {
      en: {
        'log-in-and-change-your-language':
          '<p class="oe-help-label">How-to · Lab staff</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Sign in to OpenELIS and choose the language the screens use.'], ['Who does this', 'Everyone with an OpenELIS account. Access is set by user permissions and can be configured by your administrator.'], ['Where', 'The login page, then the user menu in the top right.']] }) +
          '<h2 id="step-1-log-in">Step 1: Log in</h2><ol><li>Type your <strong>Username</strong> and <strong>Password</strong>.</li><li>Select <strong>Login</strong>.</li></ol>' + shot('Figure 1. The login page.') +
          '<h2 id="step-2-change-the-language">Step 2: Change the language</h2><ol start="3"><li>Open the user menu and choose a language. The screens, and this help, switch to that language.</li></ol>' +
          '<aside class="oe-help-callout oe-help-callout--info" role="note"><p><strong>Help follows your language.</strong> Pages that are not translated yet are shown in English.</p></aside>',
        'enter-a-clinical-order':
          '<p class="oe-help-label">How-to · Reception staff</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Register a patient’s order and the samples that came with it.'], ['You’ll end up with', 'A lab number for the order, ready for sample collection or testing.'], ['Where', 'Main menu → Order → Add Order']] }) +
          '<h2 id="step-1-find-the-patient">Step 1: Find or add the patient</h2><ol><li>Search by name, national ID or date of birth. If the patient is new, select <strong>New patient</strong>.</li></ol>' + shot('Figure 1. Patient search on the order page.') +
          '<h2 id="step-2-add-tests">Step 2: Add samples and tests</h2><ol start="2"><li>Add each sample type received, then the tests requested on it.</li><li>Select <strong>Save</strong>. <strong>Save</strong> stays disabled until every required field, marked with a red asterisk, has a value.</li></ol>' +
          '<p>Before release 3.3.0 this screen looked different. Sites on older releases can use <a class="oe-help-link--online" href="' + CONF + '1707114509" target="_blank" rel="noopener noreferrer">Enter a clinical order (before 3.3.0)</a>.</p>',
        'print-a-work-plan':
          '<p class="oe-help-label">How-to · Bench staff and lab supervisors</p>' +
          '<aside class="oe-help-callout oe-help-callout--info" role="note"><p><strong>OpenELIS 3.3.0.</strong> This page was rewritten for 3.3.0. Sites on earlier releases can use <a class="oe-help-link--online" href="' + CONF + '1705378043" target="_blank" rel="noopener noreferrer">PART 7: WORK PLANS (before 3.3.0)</a>.</p></aside>' +
          glance({ h: 'At a glance', r: [['Purpose', 'List the tests waiting to be done for one lab unit, one test, one panel or one priority, and print that list as the day’s work plan.'], ['You’ll end up with', 'A printed work plan (PDF) listing each lab number, its date of reception and the test to run.'], ['Who does this', 'Bench staff and supervisors who share out the work. Access is set by user permissions and can be configured by your administrator.'], ['Before you start', 'Samples must have been received and their tests not yet resulted.'], ['Where', 'Main menu → Workplan → By Test Type, By Panel, By Unit or By Priority']] }) +
          '<h2 id="step-1-choose-how-to-group-the-work">Step 1: Choose how to group the work</h2><ol><li>Open <strong>Main menu → Workplan</strong> and choose <strong>By Unit</strong>, <strong>By Test Type</strong>, <strong>By Panel</strong> or <strong>By Priority</strong>.</li><li>Pick a value in the list at the top of the screen. The table fills in straight away; there is no search button.</li></ol>' +
          '<h2 id="step-2-read-the-list">Step 2: Read the list</h2><ol start="3"><li>The table lists each waiting test with its <strong>Accession Number</strong>, <strong>Test Name</strong> and <strong>Received Date</strong>.</li></ol>' + shot('Figure 1. Workplan By Unit for Hematology: six waiting tests, with one row ticked under Remove.') +
          '<h2 id="step-4-print-the-work-plan">Step 4: Print the work plan</h2><ol start="6"><li>Select <strong>Print Workplan</strong>. OpenELIS opens the work plan as a PDF in a new browser tab.</li></ol>' +
          '<h2 id="tips">Tips</h2><ul><li>Work plans list tests that are still waiting for a result, so print a fresh one when you start a new batch.</li></ul>' +
          '<p>Next: <a href="/help/enter-and-save-results">Enter and save results</a>.</p>',
        'enter-and-save-results':
          '<p class="oe-help-label">How-to · Analyst</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Record test results for received samples.'], ['Where', 'Main menu → Results → Enter Results']] }) +
          '<h2 id="steps">Steps</h2><ol><li>Find the samples by lab number, unit or test.</li><li>Type each result and select <strong>Save</strong>.</li></ol>' + shot('Figure 1. Results entry, filtered to one lab unit.') +
          '<aside class="oe-help-callout oe-help-callout--warning" role="note"><p><strong>Known issue:</strong> results outside the valid range are saved but flagged; check the flag before release.</p></aside>' +
          '<p>Your site may still use the older screens; see <a href="/help/results-entry-legacy-screen">Results Entry (legacy screen)</a>.</p>',
        'results-entry-legacy-screen':
          '<p class="oe-help-label">How-to · Analyst</p>' +
          '<aside class="oe-help-callout oe-help-callout--warning" role="note"><p>This describes the legacy Results Entry screens: By Unit, By Patient and By Order. They are shown only when the setting <code>resultsEntryUnifiedRoute</code> is false. Current guidance: <a href="/help/enter-and-save-results">Enter and save results</a>.</p></aside>' +
          '<h2 id="steps">Steps</h2><ol><li>Open <strong>Main menu → Results → By Unit</strong> and pick the unit.</li><li>Enter each result and select <strong>Save</strong>.</li></ol>' + shot('Figure 1. Legacy Results Entry By Unit.'),
        'triage-and-release-results':
          '<p class="oe-help-label">How-to · Validator</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Review entered results and release the ones that are correct.'], ['Where', 'Main menu → Validation']] }) +
          '<h2 id="steps">Steps</h2><ol><li>Open the validation list and filter by unit.</li><li>Accept or reject each result, then select <strong>Save</strong>. Accepted results appear on the patient report.</li></ol>' + shot('Figure 1. Validation list for Chemistry.'),
        'test-accreditation-and-report-logos':
          '<p class="oe-help-label">How-to · Lab administrators</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Mark accredited tests and choose the logos printed on patient reports.'], ['Where', 'Main menu → Admin → Site and system settings']] }) +
          '<h2 id="steps">Steps</h2><ol><li>Open the report settings and upload the header logo.</li><li>Tick the tests covered by your accreditation and select <strong>Save</strong>.</li></ol>' + shot('Figure 1. Report logos and accreditation settings.'),
        'admin-manage-sampling-sites':
          '<p class="oe-help-label">How-to · Administrators</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Keep the list of sampling sites used on environmental and vector orders up to date.'], ['Where', 'Main menu → Admin → Locations & Organizations → Sampling sites']] }) +
          '<h2 id="steps">Steps</h2><ol><li>Select <strong>Add sampling site</strong>, fill in the name, code and location, and save.</li><li>To stop using a site, <strong>Deactivate</strong> it. Deactivated sites stay on past orders.</li></ol>' + shot('Figure 1. Sampling sites list with Show deactivated off.'),
        'set-up-an-analyzer':
          '<p class="oe-help-label">How-to · Lab administrators</p>' +
          glance({ h: 'At a glance', r: [['Purpose', 'Connect an instrument so its results arrive in OpenELIS.'], ['Where', 'Main menu → Analyzers → Configuration']] }) +
          '<h2 id="steps">Steps</h2><ol><li>Select <strong>Add analyzer</strong> and pick the analyzer type.</li><li>Map the instrument’s test codes to OpenELIS tests, then activate the analyzer.</li></ol>' + shot('Figure 1. Analyzer configuration.'),
      },
      fr: {
        'log-in-and-change-your-language':
          '<p class="oe-help-label">Guide pratique · Personnel du laboratoire</p>' +
          glance({ h: 'En bref', r: [['Objectif', 'Se connecter à OpenELIS et choisir la langue des écrans.'], ['Qui le fait', 'Toute personne disposant d’un compte OpenELIS. L’accès dépend des droits de l’utilisateur, configurables par votre administrateur.'], ['Où', 'La page de connexion, puis le menu utilisateur en haut à droite.']] }) +
          '<h2 id="step-1-log-in">Étape 1 : Se connecter</h2><ol><li>Saisissez votre <strong>nom d’utilisateur</strong> et votre <strong>mot de passe</strong>.</li><li>Sélectionnez <strong>Connexion</strong>.</li></ol>' + shot('Figure 1. La page de connexion.') +
          '<h2 id="step-2-change-the-language">Étape 2 : Changer de langue</h2><ol start="3"><li>Ouvrez le menu utilisateur et choisissez une langue. Les écrans, et cette aide, passent dans cette langue.</li></ol>',
        'print-a-work-plan':
          '<p class="oe-help-label">Guide pratique · Personnel de paillasse et responsables</p>' +
          '<aside class="oe-help-callout oe-help-callout--info" role="note"><p><strong>OpenELIS 3.3.0.</strong> Cette page a été réécrite pour la version 3.3.0. Les sites sur une version antérieure peuvent consulter <a class="oe-help-link--online" href="' + CONF + '1705378043" target="_blank" rel="noopener noreferrer">PART 7 : WORK PLANS (avant 3.3.0)</a>.</p></aside>' +
          glance({ h: 'En bref', r: [['Objectif', 'Lister les analyses en attente pour une unité, une analyse, un panel ou une priorité, et imprimer cette liste comme plan de travail du jour.'], ['Résultat', 'Un plan de travail imprimé (PDF) avec chaque numéro de laboratoire, sa date de réception et l’analyse à réaliser.'], ['Où', 'Menu principal → Plan de travail → Par type d’analyse, par panel, par unité ou par priorité']] }) +
          '<h2 id="step-1-choose-how-to-group-the-work">Étape 1 : Choisir le regroupement</h2><ol><li>Ouvrez <strong>Menu principal → Plan de travail</strong> et choisissez le regroupement.</li><li>Choisissez une valeur dans la liste en haut de l’écran. Le tableau se remplit aussitôt.</li></ol>' + shot('Figure 1. Plan de travail par unité pour l’hématologie.') +
          '<h2 id="step-4-print-the-work-plan">Étape 4 : Imprimer le plan de travail</h2><ol start="6"><li>Sélectionnez <strong>Imprimer le plan de travail</strong>. Le PDF s’ouvre dans un nouvel onglet.</li></ol>' +
          '<p>Étape suivante : <a href="/help/enter-and-save-results">Saisir et enregistrer les résultats</a>.</p>',
        'triage-and-release-results':
          '<p class="oe-help-label">Guide pratique · Validateur</p>' +
          glance({ h: 'En bref', r: [['Objectif', 'Relire les résultats saisis et libérer ceux qui sont corrects.'], ['Où', 'Menu principal → Validation']] }) +
          '<h2 id="steps">Étapes</h2><ol><li>Ouvrez la liste de validation et filtrez par unité.</li><li>Acceptez ou rejetez chaque résultat, puis sélectionnez <strong>Enregistrer</strong>.</li></ol>' + shot('Figure 1. Liste de validation pour la biochimie.'),
      },
    };

    // ---------- Helpers ----------
    const allPages = () => TREE.flatMap(s => s.folders.flatMap(f => f.pages.map(p => ({ ...p, folder: f, section: s.section }))));
    const findPage = (slug) => allPages().find(p => p.slug === slug) || null;
    const titleOf = (obj, locale) => (obj.title[locale] || obj.title.en);
    const stripTags = (h) => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');

    const BRANDS = {
      default:    { banner: 'OpenELIS Global', headerColor: '#295785', primaryColor: '#0f62fe', logo: 'OE' },
      madagascar: { banner: 'Madagascar OpenELIS', headerColor: '#0f5e3b', primaryColor: '#0f5e3b', logo: 'MG' },
      cphl:       { banner: 'CPHL OpenELIS', headerColor: '#7a1f2b', primaryColor: '#a2191f', logo: 'CP' },
    };

    // ---------- Left: the OpenELIS tab ----------
    function OpenELISTab({ brand, panelOpen, togglePanel, openManual }) {
      return (
        <div className="pane oe">
          <div className="chrome">
            <div className="tab"><span className="fav" style={{ background: brand.headerColor }}></span>{brand.banner}</div>
            <div className="url">https://openelis.example.org/validation</div>
          </div>
          <div className="pane-body">
            <header className="oe-header" style={{ background: brand.headerColor }}>
              <div className="brand"><span className="logo" style={{ width: 20, height: 20, borderRadius: 4, background: '#fff', color: '#161616', fontSize: 9, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{brand.logo}</span>{brand.banner}</div>
              <div className="actions">
                <button title="Search">Search</button>
                <button title="Help" className={panelOpen ? 'on' : ''} onClick={togglePanel} aria-label="Help">?</button>
              </div>
            </header>
            {panelOpen && (
              <div className="oe-help-panel">
                <button onClick={openManual}>User Manual</button>
                <div className="hint">Opens the in-app help in a new tab</div>
                <button>Video Tutorials</button>
                <button>Release Notes</button>
              </div>
            )}
            <div className="oe-page">
              <div className="crumb">Home / Validation</div>
              <h2>Validation: Chemistry</h2>
              <div className="oe-row h"><span>Lab number</span><span>Test</span><span>Result</span></div>
              <div className="oe-row"><span>DEV01260000000000112</span><span>Creatinine (Serum)</span><span>1.4 mg/dL</span></div>
              <div className="oe-row"><span>DEV01260000000000113</span><span>Glucose (Plasma)</span><span>5.6 mmol/L</span></div>
              <div className="oe-row"><span>DEV01260000000000117</span><span>ALT (Serum)</span><span>41 U/L</span></div>
              <p style={{ fontSize: 11, color: '#6f6f6f', marginTop: 12 }}>This tab stays exactly as it was while help is open beside it.</p>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Right: the Help tab ----------
    function HelpTab({ brand, locale, narrow, slug, hash, navigate, onReturn, opener }) {
      const [query, setQuery] = useState('');
      const [railOpen, setRailOpen] = useState(!narrow);
      const [openFolders, setOpenFolders] = useState({});
      const [loading, setLoading] = useState(false);
      useEffect(() => { setRailOpen(!narrow); }, [narrow]);
      useEffect(() => { setLoading(true); const id = setTimeout(() => setLoading(false), 250); return () => clearTimeout(id); }, [slug, locale]);
      const T = (k, v) => tr(locale, k, v);

      const page = slug ? findPage(slug) : null;
      const isFallback = page && locale !== 'en' && !BODIES[locale][slug];
      const body = page ? (BODIES[locale][slug] || BODIES.en[slug]) : null;

      // expand the active page's folder
      const activeFolder = page ? page.folder.slug : null;
      const isOpen = (f) => openFolders[f] !== undefined ? openFolders[f] : f === activeFolder;

      const results = useMemo(() => {
        if (query.trim().length < 2) return null;
        const q = query.toLowerCase();
        return allPages().map(p => {
          const title = titleOf(p, locale);
          const text = stripTags(BODIES[locale][p.slug] || BODIES.en[p.slug] || '');
          const inTitle = title.toLowerCase().includes(q);
          const at = text.toLowerCase().indexOf(q);
          if (!inTitle && at < 0) return null;
          let start = at >= 0 ? Math.max(0, at - 40) : 0;
          if (start > 0) { const sp = text.indexOf(' ', start); start = sp >= 0 && sp < at ? sp + 1 : start; }
          const snippet = text.slice(start, (at >= 0 ? at : 0) + 90).trim();
          return { p, title, snippet, score: inTitle ? 4 : 1 };
        }).filter(Boolean).sort((a, b) => b.score - a.score);
      }, [query, locale]);

      const hl = (s) => {
        const q = query.trim(); if (!q) return s;
        const i = s.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return s;
        return <>{s.slice(0, i)}<mark>{s.slice(i, i + q.length)}</mark>{s.slice(i + q.length)}</>;
      };

      const go = (s, h) => { navigate(s, h); setQuery(''); if (narrow) setRailOpen(false); };
      const onContentClick = (e) => {
        const a = e.target.closest('a'); if (!a) return;
        const href = a.getAttribute('href') || '';
        if (href.startsWith('/help/')) { e.preventDefault(); const [s, h] = href.slice(6).split('#'); go(s, h); }
      };
      useEffect(() => {
        if (!hash) return;
        const el = document.getElementById(hash); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, [hash, slug, loading]);

      const url = 'https://openelis.example.org/help' + (slug ? '/' + slug : '') + (hash ? '#' + hash : '');
      const sectionLabel = (s) => T(s === 'user' ? 'help.viewer.section.user' : 'help.viewer.section.admin');

      return (
        <div className={'pane help' + (narrow ? ' narrow' : '')}>
          <div className="chrome">
            <div className="tab"><span className="fav" style={{ background: brand.headerColor }}></span>{T('help.viewer.brand', { siteName: brand.banner })}</div>
            <div className="url">{url}</div>
          </div>
          <div className="pane-body">
            <header className="hh" style={{ background: brand.headerColor }}>
              {narrow && <button className="menu" aria-label={T('help.viewer.menu.toggle')} aria-expanded={railOpen} onClick={() => setRailOpen(!railOpen)}>&#9776;</button>}
              <span className="brand"><span className="logo">{brand.logo}</span>{!narrow && T('help.viewer.brand', { siteName: brand.banner })}</span>
              <div className="search"><input aria-label={T('help.viewer.search.placeholder')} placeholder={T('help.viewer.search.placeholder')} value={query}
                onChange={(e) => { setQuery(e.target.value); if (narrow) setRailOpen(true); }} onKeyDown={(e) => e.key === 'Escape' && setQuery('')} /></div>
              {!narrow && <span className="locale">{locale.toUpperCase()}</span>}
              <button className="return" onClick={onReturn} title={opener ? 'Closes this tab and focuses OpenELIS' : 'No opener: goes to /'}>{narrow ? '↩' : T('help.viewer.return-to-app')}</button>
            </header>
            <div className="hg">
              {railOpen && (
                <nav className="rail" aria-label="Help contents">
                  {results ? (
                    results.length === 0
                      ? <div className="empty">{T('help.viewer.search.no-results', { query })}</div>
                      : results.map(r => (
                          <a key={r.p.slug} className="result" onClick={() => go(r.p.slug)}>
                            <div className="t">{hl(r.title)}</div><div className="s">{hl(r.snippet)}…</div>
                          </a>))
                  ) : TREE.map(s => (
                    <div key={s.section}>
                      <div className="sec">{sectionLabel(s.section)}</div>
                      {s.folders.map(f => (
                        <div key={f.slug}>
                          <button className="folder" aria-expanded={isOpen(f.slug)} onClick={() => setOpenFolders({ ...openFolders, [f.slug]: !isOpen(f.slug) })}>
                            <span>{titleOf(f, locale)}</span><span style={{ fontWeight: 400 }}>{isOpen(f.slug) ? '−' : '+'}</span>
                          </button>
                          {isOpen(f.slug) && f.pages.map(p => (
                            <a key={p.slug} className={'item' + (p.slug === slug ? ' active' : '')} onClick={() => go(p.slug)}>{titleOf(p, locale)}</a>
                          ))}
                        </div>
                      ))}
                    </div>
                  ))}
                </nav>
              )}
              <main className="main">
                <div className="main-inner">
                  {!slug && (
                    <div className="landing">
                      <h1>{T('help.viewer.brand', { siteName: brand.banner })}</h1>
                      <p className="lead">{T('help.viewer.landing.lead')}</p>
                      <div className="cards">
                        {TREE.map(s => (
                          <div className="card" key={s.section}>
                            <h2>{sectionLabel(s.section)}</h2>
                            {s.folders.map(f => (
                              <div key={f.slug}><div className="f">{titleOf(f, locale)}</div>
                                {f.pages.map(p => <a key={p.slug} onClick={() => go(p.slug)}>{titleOf(p, locale)}</a>)}</div>
                            ))}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {slug && !page && (
                    <div className="note err" role="alert"><div><b>{T('help.viewer.error.not-found.title')}</b><div>{T('help.viewer.error.not-found.body')}</div>
                      <a className="latest" style={{ margin: '6px 0 0' }} onClick={() => go(null)}>{T('help.viewer.error.page.home')}</a></div></div>
                  )}
                  {page && (
                    <>
                      <div className="bc">
                        <a onClick={() => go(null)}>{T('help.viewer.breadcrumb.home')}</a><span className="sep">/</span>
                        <span>{sectionLabel(page.section)}</span><span className="sep">/</span>
                        <span>{titleOf(page.folder, locale)}</span>
                      </div>
                      <div className="titlerow">
                        <h1>{titleOf(page, locale)}</h1>
                        {isFallback && <span className="cds--tag cds--tag--gray">{T('help.viewer.fallback.tag')}</span>}
                      </div>
                      <a className="latest" href={CONF + page.pageId} target="_blank" rel="noopener noreferrer">
                        {T('help.viewer.link.latest')} &#8599;<span className="cds--visually-hidden"> {T('help.viewer.link.online')}</span>
                      </a>
                      {page.wip && <div className="note" role="status"><div>{T('help.viewer.wip.notice')}</div></div>}
                      {loading
                        ? <div><div className="skel" style={{ width: '40%' }} /><div className="skel" /><div className="skel" style={{ width: '85%' }} /><div className="skel" style={{ width: '70%' }} /></div>
                        : <div className="oe-help-content" onClick={onContentClick} dangerouslySetInnerHTML={{ __html: body }} />}
                    </>
                  )}
                </div>
              </main>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [brandKey, setBrandKey] = useState('madagascar');
      const [locale, setLocale] = useState('en');
      const [narrow, setNarrow] = useState(false);
      const [panelOpen, setPanelOpen] = useState(false);
      const [helpOpen, setHelpOpen] = useState(true);
      const [opener, setOpener] = useState(true);
      const [route, setRoute] = useState({ slug: 'print-a-work-plan', hash: null });
      const brand = BRANDS[brandKey];
      useEffect(() => { document.body.style.setProperty('--brand-primary', brand.primaryColor); }, [brand]);

      const navigate = (slug, hash) => setRoute({ slug, hash: hash || null });
      const openManual = () => { setPanelOpen(false); setOpener(true); setHelpOpen(true); setRoute({ slug: null, hash: null }); };
      const onReturn = () => { if (opener) setHelpOpen(false); else setRoute({ slug: null, hash: null }); };
      const Btn = ({ on, onClick, children }) => <button className={on ? 'on' : ''} onClick={onClick}>{children}</button>;

      return (
        <div>
          <div className="controls">
            <div className="grp"><span>Branding (GET /rest/site-branding + BANNER_TEXT):</span>
              {Object.entries(BRANDS).map(([k, b]) => <Btn key={k} on={k === brandKey} onClick={() => setBrandKey(k)}>{b.banner}</Btn>)}</div>
            <div className="grp"><span>Session language:</span>
              <Btn on={locale === 'en'} onClick={() => setLocale('en')}>English</Btn><Btn on={locale === 'fr'} onClick={() => setLocale('fr')}>Fran&ccedil;ais</Btn></div>
            <div className="grp"><span>Help tab width:</span>
              <Btn on={!narrow} onClick={() => setNarrow(false)}>Wide</Btn><Btn on={narrow} onClick={() => setNarrow(true)}>480 px</Btn></div>
            <div className="grp"><span>Try:</span>
              <Btn onClick={() => { setHelpOpen(true); setOpener(false); navigate('print-a-work-plan', 'step-4-print-the-work-plan'); }}>Bookmarked deep link</Btn>
              <Btn onClick={() => { setHelpOpen(true); navigate('enter-a-clinical-order'); }}>Page with no French</Btn>
              <Btn onClick={() => { setHelpOpen(true); navigate('old-renamed-page'); }}>Old bookmark (not found)</Btn></div>
          </div>
          <div className="split">
            <OpenELISTab brand={brand} panelOpen={panelOpen} togglePanel={() => setPanelOpen(!panelOpen)} openManual={openManual} />
            {helpOpen
              ? <HelpTab brand={brand} locale={locale} narrow={narrow} slug={route.slug} hash={route.hash} navigate={navigate} onReturn={onReturn} opener={opener} />
              : <div className="pane help"><div className="closed"><div>Help tab closed by <strong>Return to OpenELIS</strong>.<br/>Open it again from <strong>?</strong> &rarr; <strong>User Manual</strong> in the OpenELIS tab.</div></div></div>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
