<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing: OpenELIS Preview</title>
<link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  body { background:#f4f4f4; margin:0; font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif; color:#161616; }
  .preview-banner { background:#0f62fe; color:#fff; padding:6px 1rem; font-size:12px; font-family:'IBM Plex Mono',monospace; position:sticky; top:0; z-index:20; }
  .shell { display:flex; min-height:calc(100vh - 28px); }
  .nav { width:256px; background:#fff; border-right:1px solid #e0e0e0; flex-shrink:0; padding:8px 0; overflow-y:auto; }
  .nav h6 { margin:16px 16px 4px; font-size:12px; letter-spacing:.32px; color:#525252; font-weight:600; text-transform:uppercase; }
  .nav button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 16px 8px 24px; font-size:14px; color:#161616; cursor:pointer; border-left:3px solid transparent; }
  .nav button:hover { background:#e8e8e8; }
  .nav button.active { background:#e0e0e0; border-left-color:#0f62fe; font-weight:600; }
  .nav .sub { padding-left:40px; }
  .main { flex:1; padding:16px 32px 64px; max-width:1320px; }
  .crumbs { font-size:12px; color:#525252; margin:4px 0 8px; }
  .crumbs a { color:#0f62fe; text-decoration:none; }
  h1.page { font-size:28px; font-weight:400; margin:0 0 4px; }
  p.sub { color:#525252; margin:0 0 16px; font-size:14px; max-width:820px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .tile { background:#fff; padding:16px; border:1px solid #e0e0e0; }
  .kpi { min-width:200px; flex:1; cursor:pointer; }
  .kpi .v { font-size:28px; margin:8px 0 4px; }
  .kpi .l { font-size:12px; color:#525252; }
  .kpi .d { font-size:12px; color:#525252; }
  table.cds--data-table td.num, table.cds--data-table th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .toolbar { display:flex; gap:8px; align-items:center; background:#fff; padding:8px; border:1px solid #e0e0e0; border-bottom:0; flex-wrap:wrap; }
  .toolbar input, .toolbar select { height:32px; }
  .search { flex:1; min-width:220px; border:0; border-bottom:1px solid #8d8d8d; background:#f4f4f4; padding:0 12px; font-size:14px; }
  .sel { border:0; border-bottom:1px solid #8d8d8d; background:#f4f4f4; padding:0 8px; font-size:14px; }
  .expand { background:#f4f4f4; padding:16px; }
  .note { font-size:12px; color:#525252; }
  .panel { background:#fff; border:1px solid #e0e0e0; padding:16px; width:520px; flex-shrink:0; }
  .fieldrow { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .field { display:flex; flex-direction:column; min-width:160px; flex:1; }
  .field label { font-size:12px; color:#525252; margin-bottom:4px; }
  .field input, .field select, .field textarea { height:40px; border:0; border-bottom:1px solid #8d8d8d; background:#f4f4f4; padding:0 12px; font-size:14px; font-family:inherit; }
  .field textarea { height:64px; padding:8px 12px; }
  .field .helper { font-size:12px; color:#525252; margin-top:4px; }
  .field .err { font-size:12px; color:#da1e28; margin-top:4px; }
  .shiftbar { background:#e5f6ff; border-left:3px solid #0043ce; padding:8px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:14px; }
  .totals td { font-weight:600; }
  .fence { border:2px dashed #8d8d8d; padding:12px; margin:12px 0; background:#fafafa; }
  .fence .fl { font-size:11px; font-family:'IBM Plex Mono',monospace; color:#525252; margin-bottom:8px; }
  .chip { display:inline-block; background:#e0e0e0; padding:2px 8px; margin:2px; font-size:12px; border-radius:12px; }
  .rcpt { font-family:'IBM Plex Mono',monospace; font-size:12px; background:#fff; border:1px solid #c6c6c6; padding:12px; width:300px; white-space:pre; }
  .area { display:flex; gap:24px; }
  .area .left { width:220px; }
  .area .left div { padding:6px 8px; font-size:14px; cursor:default; }
  .area .left .on { background:#e0e0e0; font-weight:600; }
  .setting { border-bottom:1px solid #e0e0e0; padding:12px 0; display:flex; justify-content:space-between; gap:16px; }
  .setting .t { font-size:14px; }
  .setting .ds { font-size:12px; color:#525252; max-width:620px; }
  .mini { font-size:12px; }
  .bar { height:8px; background:#e0e0e0; position:relative; }
  .bar span { position:absolute; left:0; top:0; bottom:0; background:#0f62fe; }
  .modal-back { position:fixed; inset:0; background:rgba(22,22,22,.5); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal { background:#fff; width:520px; padding:16px 16px 0; }
  .modal .ft { display:flex; margin:24px -16px 0; }
  .modal .ft button { flex:1; height:64px; border:0; font-size:14px; text-align:left; padding:0 16px; cursor:pointer; }
</style>
</head>
<body class="cds--white">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const t = (key, fallback) => fallback || key;
const K = (n) => (n < 0 ? '-K' : 'K') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function Tag({ kind = 'gray', children }) { return <span className={`cds--tag cds--tag--${kind}`} style={{ margin: '0 4px 0 0' }}>{children}</span>; }
function PaymentChip({ state, amount, payer, canSee = true, canCollect = true, labNo }) {
  const m = { unpaid: ['red', canSee ? `Unpaid ${K(amount)}` : 'Unpaid'], partly: ['warm-gray', canSee ? `Partly paid, ${K(amount)} due` : 'Partly paid'], paid: ['green', 'Paid'], waived: ['teal', 'Waived'], payer: ['blue', `Billed to ${payer}`], emr: ['gray', 'Billed by EMR'], held: ['red', canSee ? `Held: unpaid ${K(amount)}` : 'Held: unpaid'] }[state];
  const tag = <span className={`cds--tag cds--tag--${m[0]}`} style={{ margin: 0, cursor: canCollect ? 'pointer' : 'default' }} title={canCollect ? `Open ${labNo} at the Cash Desk` : 'Set by Billing'}>{m[1]}</span>;
  return canCollect ? <a href="#" aria-label={`Open ${labNo} at the Cash Desk`} onClick={(e) => e.preventDefault()} style={{ textDecoration: 'none' }}>{tag}</a> : tag;
}
function Btn({ kind = 'primary', size = 'sm', onClick, children, disabled, aria }) {
  return <button aria-label={aria} disabled={disabled} className={`cds--btn cds--btn--${kind} cds--btn--${size}`} style={{ marginRight: 8 }} onClick={onClick}>{children}</button>;
}
function Notice({ kind = 'info', title, children }) {
  return (<div className={`cds--inline-notification cds--inline-notification--${kind} cds--inline-notification--low-contrast`} style={{ maxWidth: '100%', margin: '0 0 16px' }} role="status">
    <div className="cds--inline-notification__details"><div className="cds--inline-notification__text-wrapper" style={{ padding: '12px 0' }}>
      {title && <div className="cds--inline-notification__title">{title}</div>}<div className="cds--inline-notification__subtitle">{children}</div></div></div></div>);
}
function Table({ headers, rows, num = [], onRow, expanded, renderExpand, select }) {
  return (<div className="cds--data-table-container"><table className="cds--data-table cds--data-table--sm" style={{ width: '100%' }}>
    <thead><tr>{select && <th style={{ width: 32 }}></th>}{headers.map((h, i) => <th key={i} className={num.includes(i) ? 'num' : ''}><span className="cds--table-header-label">{h}</span></th>)}</tr></thead>
    <tbody>{rows.map((r, ri) => (<React.Fragment key={ri}>
      <tr onClick={onRow ? () => onRow(ri) : undefined} style={{ cursor: onRow ? 'pointer' : 'default' }}>
        {select && <td><input type="checkbox" aria-label="Select row" /></td>}
        {r.map((c, ci) => <td key={ci} className={num.includes(ci) ? 'num' : ''}>{c}</td>)}</tr>
      {expanded === ri && renderExpand && <tr><td colSpan={headers.length + (select ? 1 : 0)} className="expand">{renderExpand(ri)}</td></tr>}
    </React.Fragment>))}</tbody></table></div>);
}
function Field({ label, children, helper, err }) { return <div className="field"><label>{label}</label>{children}{helper && <div className="helper">{helper}</div>}{err && <div className="err">{err}</div>}</div>; }
function Header({ crumbs, title, sub }) {
  return (<div><div className="crumbs">{crumbs.map((c, i) => <span key={i}>{i > 0 && ' / '}{i < crumbs.length - 1 ? <a href="#">{c}</a> : c}</span>)}</div>
    <h1 className="page">{title}</h1>{sub && <p className="sub">{sub}</p>}</div>);
}
function Fence({ owner, children }) { return <div className="fence"><div className="fl">EXISTING COMPONENT, reuse, do not re-implement: {owner}. Abbreviated drawing; not a specification of its contents.</div>{children}</div>; }
function Toggle({ on, onChange, label }) {
  return <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 14, cursor: 'pointer' }}><input type="checkbox" checked={on} onChange={(e) => onChange && onChange(e.target.checked)} />{label}</label>;
}

/* ---------------- Overview ---------------- */
function Overview({ go }) {
  const tiles = [
    { l: t('billing.overview.collectedToday', 'Collected today'), v: K(3184.5), d: 'Cash K1,240.00 · Mobile money K1,594.50 · Card K350.00', to: 'reports' },
    { l: t('billing.overview.collectedMonth', 'Collected this month'), v: K(61420), d: 'Includes statements K18,600.00 and applied remittances K4,275.00', to: 'reports' },
    { l: t('billing.overview.unbilled', 'Unbilled work'), v: '7', d: '7 tests, K286.00 at list price', to: 'unbilled' },
    { l: t('billing.overview.releasedUnpaid', 'Released while unpaid'), v: '4', d: 'Last 30 days', to: 'reports' },
    { l: t('billing.overview.owed', 'Owed to the lab'), v: K(17339.5), d: 'K4,120.00 over 90 days · K787.00 from patients', to: 'reports' },
    { l: t('billing.overview.claimsAttention', 'Claims needing attention'), v: '4', d: '1 rejected · 2 with denied or underpaid lines · 1 deadline in 6 days', to: 'claims' },
    { l: t('billing.overview.denialRate', 'Claim denial rate (30 days)'), v: '6.8%', d: '14 of 206 claim lines denied', to: 'reports' },
    { l: t('billing.overview.daysToClaim', 'Days from release to claim (median)'), v: '1.0', d: 'Daily batch to Kumul Health Cover', to: 'claims' },
    { l: t('billing.overview.openShifts', 'Open shifts'), v: '2', d: 'J. Kaupa (Main reception) · R. Tau (Outpatients)', to: 'cash' },
  ];
  return (<div>
    <Header crumbs={['Home', 'Billing', 'Overview']} title="Overview" sub={t('billing.overview.subtitle', 'What the lab has collected, what it is owed, and where money may be leaking.')} />
    <Notice kind="warning" title="2 records not in Odoo yet">Statement ST-2026-0088 payment and receipt R-2026-004398: "Could not reach odoo.cphl.local". Retrying.</Notice>
    <div className="row">{tiles.map((x, i) => (<div key={i} className="tile kpi" role="link" tabIndex={0} onClick={() => go(x.to)}>
      <div className="l">{x.l}</div><div className="v">{x.v}</div><div className="d">{x.d}</div></div>))}</div>
    <div className="tile" style={{ marginTop: 16 }}><h4 style={{ margin: '0 0 8px' }}>Periods</h4>
      <div className="mini">September 2026 closed 03/10/2026 by L. Morea · August 2026 closed 02/09/2026 by L. Morea</div>
      <div className="mini" style={{ margin: '8px 0' }}>Before closing October 2026: 3 items are still open (2 shifts not closed, 1 remittance in Review, 1 draft statement).</div>
      <Btn kind="tertiary">Close October 2026</Btn><Btn kind="ghost">Reopen September 2026</Btn><span className="note">Billing managers only. Nothing dated in a closed month can be added or changed.</span></div>
    <p className="note" style={{ marginTop: 16 }}>Built on the shared dashboard pattern (management dashboard). Tiles for parts of Billing a lab has not switched on are not shown.</p>
  </div>);
}


/* ---------------- Cash Desk ---------------- */
const deskOrders = [
  { lab: 'CPHL-26-004188', name: 'Mary Kaupa', pid: 'PT-0041872', who: 'Female, 34 y', billTo: 'Patient', reg: '08:12',
    lines: [['CBC', 25, 25, 25, 0, ''], ['Malaria RDT', 10, 10, 10, 0, ''], ['Urinalysis', 12, 12, 12, 0, ''], ['Culture & sensitivity (added at bench)', 45, 28, 28, 0, 'Override: Hardship'], ['Malaria RDT (rerun)', 0, 0, 0, 0, 'free:Rerun']] },
  { lab: 'CPHL-26-004191', name: 'Peter Wari', pid: 'PT-0040356', who: 'Male, 51 y', billTo: 'Kumul Health Cover', reg: '08:31',
    lines: [['HIV viral load', 70, 70, 7, 63, "Patient's share 10%"], ['CD4 count', 55, 55, 5.5, 49.5, "Patient's share 10%"]] },
  { lab: 'CPHL-26-004195', name: 'Grace Lohia', pid: 'PT-0041990', who: 'Female, 27 y', billTo: 'Patient', reg: '08:44',
    lines: [['LFT panel', 55, 55, 55, 0, ''], ['Lipid panel', 40, 40, 40, 0, 'Panel price']] },
  { lab: 'CPHL-26-004199', name: 'John Oa', pid: 'PT-0042005', who: 'Male, 41 y', billTo: 'Patient', reg: '09:02',
    lines: [['Malaria RDT', 10, 10, 10, 0, ''], ['Typhoid RDT', 25, 25, 25, 0, '']] },
  { lab: 'CPHL-26-004203', name: 'Ruth Kila', pid: 'PT-0042011', who: 'Female, 66 y', billTo: 'Patient', reg: '09:10',
    lines: [['HbA1c', 66, 66, 33, 0, 'Exemption: Pensioners (50%)'], ['Glucose fasting', 54, 54, 27, 0, 'Exemption: Pensioners (50%)']] },
];
function CashDesk() {
  const [open, setOpen] = useState(0);
  const [mode, setMode] = useState('Cash');
  const [pay, setPay] = useState(false);
  const [paid, setPaid] = useState({});
  const [amount, setAmount] = useState('');
  const [tendered, setTendered] = useState('100.00');
  const [modal, setModal] = useState(null);
  const [refund, setRefund] = useState(false);
  const [pc, setPc] = useState(false);
  const o = deskOrders[open];
  const due = o.lines.reduce((a, l) => a + l[3], 0);
  const isPaid = !!paid[open];
  const amt = amount === '' ? due : parseFloat(amount) || 0;
  const st = (l) => l[5].startsWith('free:') ? <Tag kind="gray">Not charged</Tag> : l[3] === 0 && l[2] === 0 ? <Tag kind="teal">Waived</Tag> : isPaid ? <Tag kind="green">Paid</Tag> : <Tag kind="red">Unpaid</Tag>;
  const openOrder = (i) => { setOpen(i); setPay(false); setAmount(''); setRefund(false); };
  return (<div>
    <Header crumbs={['Home', 'Billing', 'Cash Desk']} title="Cash Desk" sub={t('billing.cashDesk.subtitle', 'Find an order, take the patient\'s payment and print the receipt.')} />
    <div className="shiftbar"><span>{`Shift open since 07:42 at Main reception. 23 payments, ${K(1240)} cash.`}</span><Btn kind="tertiary" onClick={() => setModal('close')}>{t('billing.shift.close', 'Close shift')}</Btn></div>
    <div className="row">
      <div style={{ flex: 1, minWidth: 420 }}>
        <div className="toolbar"><input className="search" placeholder={t('billing.cashDesk.search', 'Lab number, patient, patient ID, bill or quote number')} aria-label="Search" /><Btn kind="tertiary" onClick={() => setPc(!pc)}>{t('billing.cashDesk.priceCheck', 'Price check')}</Btn></div>
        {pc && (<div className="tile" style={{ marginTop: 8 }}><h5 style={{ margin: '0 0 8px' }}>Price check</h5>
          <div className="fieldrow"><Field label="Payer (search)"><input defaultValue="Kumul Health Cover" /></Field><Field label="Patient age (for exemptions)"><input defaultValue="58" /></Field><Field label="Tests, panels, services (search)"><div><span className="chip">HbA1c ×</span><span className="chip">Lipid panel ×</span></div></Field></div>
          <Table headers={['Item', 'Price', 'Applies', 'Tax', 'Patient pays']} num={[1, 3, 4]} rows={[['HbA1c', K(63), '', 'Exempt', K(6.3)], ['Lipid panel', K(49.5), 'Panel price', 'Exempt', K(4.95)], ['Total', K(112.5), '', K(0), K(11.25)]]} />
          <p className="note">Nothing is registered. From 01/11/2026 the Diabetes awareness month promotion halves HbA1c.</p><Btn kind="ghost">{t('billing.cashDesk.printEstimate', 'Print estimate')}</Btn></div>)}
        <h4 style={{ margin: '16px 0 8px', fontSize: 16 }}>{t('billing.cashDesk.waiting', 'Waiting to pay')}</h4>
        <Table headers={['Lab No', 'Patient', 'Bill to', 'Balance due', 'Registered']} num={[3]}
          rows={deskOrders.map((d, i) => [<a href="#" onClick={(e) => { e.preventDefault(); openOrder(i); }}>{d.lab}</a>, d.name, d.billTo, K(paid[i] ? 0 : d.lines.reduce((a, l) => a + l[3], 0)), d.reg])} />
        <p className="note">Peter Wari's row is his 10% share of an insured order. Orders billed to institutions, programs and clients are not listed here.</p>
      </div>
      <div className="panel" aria-label="Order panel">
        <div style={{ display: 'flex', justifyContent: 'space-between' }}><div><div className="mini">{o.lab}</div><h3 style={{ margin: '4px 0', fontWeight: 400 }}>{o.name}</h3>
          <div className="mini">Patient ID {o.pid} · {o.who} · Bill to: {o.billTo}</div></div>
          <div>{isPaid ? <Tag kind="green">Paid</Tag> : <Tag kind="red">Unpaid</Tag>}</div></div>
        <Table headers={['Item', 'List price', 'Charged', 'Patient pays', 'Payer pays', 'Status']} num={[1, 2, 3, 4]}
          rows={o.lines.map((l) => [<div>{l[0]}{l[5] && <div className="note">{l[5].replace('free:', '')}</div>}</div>, K(l[1]), K(l[2]), K(l[3]), K(l[4]), st(l)])} />
        <table style={{ width: '100%', fontSize: 14, marginTop: 8 }}><tbody>
          <tr><td>{t('billing.common.patientPays', 'Patient pays')}</td><td style={{ textAlign: 'right' }}>{K(due)}</td></tr>
          <tr><td>{t('billing.common.alreadyPaid', 'Already paid')}</td><td style={{ textAlign: 'right' }}>{isPaid ? K(due) : K(0)}</td></tr>
          <tr style={{ fontWeight: 600 }}><td>{t('billing.common.balanceDue', 'Balance due')}</td><td style={{ textAlign: 'right' }}>{isPaid ? K(0) : K(due)}</td></tr></tbody></table>
        {!isPaid && !pay && <div style={{ marginTop: 16 }}><Btn onClick={() => setPay(true)} aria={`Take payment, ${o.lab}`}>{t('billing.cashDesk.takePayment', 'Take payment')}</Btn><Btn kind="tertiary">{t('billing.cashDesk.printBill', 'Print bill')}</Btn><Btn kind="ghost">{t('billing.cashDesk.overridePrice', 'Override price')}</Btn></div>}
        {pay && !isPaid && (<div style={{ marginTop: 16, borderTop: '1px solid #e0e0e0', paddingTop: 12 }}>
          {open === 2 && <div style={{ marginBottom: 8 }}><Toggle on={true} label="Use K15.00 credit from receipt R-2026-004102" /></div>}
          <div className="fieldrow"><Field label={t('billing.cashDesk.amount', 'Amount')} helper={amt < due ? `Part payment. ${K(due - amt)} will still be due.` : amt > due ? `${K(amt - due)} more than due. It is kept as credit for this order.` : ''}><input value={amount === '' ? due.toFixed(2) : amount} onChange={(e) => setAmount(e.target.value)} /></Field>
            <Field label={t('billing.cashDesk.mode', 'Payment mode')}><select value={mode} onChange={(e) => setMode(e.target.value)}><option>Cash</option><option>Mobile money</option><option>Card</option><option>Bank transfer</option></select></Field></div>
          {mode === 'Cash' && <div className="fieldrow"><Field label={t('billing.cashDesk.tendered', 'Cash tendered')} helper={`Change due: ${K(Math.max(0, (parseFloat(tendered) || 0) - amt))}`}><input value={tendered} onChange={(e) => setTendered(e.target.value)} /></Field></div>}
          {mode === 'Mobile money' && <><div className="fieldrow"><Field label="Phone number (required)"><input defaultValue="+675 7012 3456" /></Field><Field label="Transaction reference (required)"><input placeholder="for example MP261020.0912.H45" /></Field></div>
            <div style={{ marginBottom: 12 }}><Btn kind="tertiary" onClick={() => setModal('mobile')}>{t('billing.cashDesk.mobile.request', 'Send payment request')}</Btn><span className="note">Uses the mobile money gateway when one is set up.</span></div></>}
          {mode === 'Card' && <div className="fieldrow"><Field label="Last four digits (required)"><input /></Field><Field label="Approval code (required)"><input /></Field></div>}
          {mode === 'Bank transfer' && <div className="fieldrow"><Field label="Reference (required)"><input placeholder="for example BSP-77120" /></Field></div>}
          <Btn onClick={() => { setPaid({ ...paid, [open]: true }); setPay(false); }}>{t('billing.cashDesk.saveAndPrint', 'Save and print receipt')}</Btn><Btn kind="ghost" onClick={() => setPay(false)}>Cancel</Btn>
        </div>)}
        {isPaid && (<div style={{ marginTop: 16 }}>
          <Notice kind="success">{`Payment saved. Receipt R-2026-0044${17 + open} printed.`}</Notice>
          <div className="row"><div className="rcpt">{`CENTRAL PUBLIC HEALTH LABORATORY
Results desk 325 6800
RECEIPT            R-2026-0044${17 + open}
20/10/2026 09:14   Main reception
Cashier: J. Kaupa
Patient: ${o.name}  ${o.pid}
Lab no:  ${o.lab}
-------------------------------
${o.lines.filter((l) => !l[5].startsWith('free:')).map((l) => `${l[0].slice(0, 24).padEnd(24)}${K(l[1]).padStart(7)}${l[2] !== l[1] ? `\n  Discount: ${l[5].replace('Override: ', '').slice(0, 18).padEnd(18)}${('-' + K(l[1] - l[2])).padStart(9)}` : ''}${l[5].startsWith('Exemption') ? `\n  Exemption: Pensioners${('-' + K(l[2] - l[3])).padStart(10)}` : ''}${l[4] ? `\n  Paid by ${o.billTo.slice(0, 15).padEnd(15)}${('-' + K(l[4])).padStart(9)}` : ''}`).join('\n')}
-------------------------------
TOTAL                   ${K(due).padStart(7)}
Paid  ${mode.padEnd(18)}${K(due).padStart(7)}
Balance left              K0.00`}</div>
            <div><h5 style={{ margin: '0 0 8px' }}>{t('billing.cashDesk.receipts', 'Receipts')}</h5>
              <div className="mini">{`R-2026-0044${17 + open} · 09:14 · ${K(due)} · ${mode}`}</div>
              <div style={{ marginTop: 8 }}><Btn kind="danger--tertiary" onClick={() => setModal('void')} aria={`Void receipt R-2026-0044${17 + open}`}>{t('billing.cashDesk.voidReceipt', 'Void receipt')}</Btn></div>
              <div style={{ marginTop: 8 }}><Btn kind="tertiary">{t('billing.cashDesk.sendReceipt', 'Send receipt')}</Btn><Btn kind="ghost" onClick={() => setRefund(true)}>{t('billing.cashDesk.refundOrCredit', 'Refund or credit')}</Btn></div>

          <Field label="Claim filing limit (days after release)"><input defaultValue="90" /></Field></div>
        <div className="fieldrow"><Field label="Patient's share default"><select defaultValue="10%"><option>None</option><option>10%</option><option>Fixed amount</option></select></Field>
          <Field label="Supports coverage check"><select><option>Yes</option><option>No</option></select></Field>
          <Field label="Requires coded diagnosis"><select><option>Yes</option><option>No</option></select></Field>
          <Field label="Overrides change the claimed amount" helper="Provisional: validate with the insurer"><select><option>No</option><option>Yes</option></select></Field></div></>)}
      {kind === 'Institution' && <div className="fieldrow"><Field label="Who bills orders from this referring facility"><select><option>Billed by the lab</option><option>Billed by the EMR</option></select></Field></div>}
      {row === 3 && <div className="fieldrow"><Field label="What they charge us" helper="Referral labs also have this cost list (FR-C11)"><select><option>Pacific Reference Laboratory (what they charge us)</option></select></Field></div>}
      <Btn>Save</Btn><Btn kind="ghost">Cancel</Btn></div>)} />
    
  </div>);
}

function PaidTag({ paid, why, src, link, labNo }) {
  if (paid === null) return <span className="mini" title={why}>None</span>;
  const tip = `${why ? why + '. ' : ''}${src}`;
  const tag = <span className={`cds--tag cds--tag--${paid ? 'green' : 'red'}`} style={{ margin: 0, whiteSpace: 'nowrap', cursor: link ? 'pointer' : 'default' }} title={link ? `${tip}. Open ${labNo} at the Cash Desk` : tip}>{paid ? 'Paid' : 'Not paid'}</span>;
  return link ? <a href="#" aria-label={`Not paid. ${tip}. Open ${labNo} at the Cash Desk`} onClick={(e) => e.preventDefault()} style={{ textDecoration: 'none' }}>{tag}</a> : tag;
}
function OrderDashboard() {
  const [f, setF] = useState('all');
  const [src, setSrc] = useState('billing');
  const [asCashier, setAsCashier] = useState(true);
  const base = [
    ['CPHL-26-004188', 'Mary Kaupa', 'Self-referred', ['green', 'Entered'], '5 (2 awaiting)', '3', '08:12'],
    ['CPHL-26-004191', 'Peter Wari', 'Kumul Health clinic', ['teal', 'Samples prepared'], '2', '1', '08:31'],
    ['CPHL-26-004195', 'Grace Lohia', 'Self-referred', ['green', 'Entered'], '2', '1', '08:44'],
    ['CPHL-26-004158', 'Martha Wani', 'Self-referred', ['teal', 'Samples prepared'], '3', '2', '07:22'],
    ['CPHL-26-004180', 'Simon Kaupa', 'Port Moresby General Hospital', ['teal', 'Samples prepared'], '4', '2', '07:58'],
    ['CPHL-26-004177', 'Lucy Bai', 'Self-referred', ['teal', 'Samples prepared'], '1', '1', '07:50'],
    ['CPHL-26-004172', 'Joseph Kila', 'Self-referred', ['teal', 'Samples prepared'], '3', '1', '07:41'],
    ['CPHL-26-004230', 'Anna Toua', 'PMGH Ward 4B (electronic order)', ['green', 'Entered'], '2', '1', '09:20'],
    ['CPHL-26-004166', 'Ben Oa', 'Self-referred', ['teal', 'Samples prepared'], '2', '1', '07:35'],
  ];
  // [paid, reason] per row. Billing: from charges. Odoo (Billing off): from the invoice's payment_state, read 10:40.
  const billing = [[false, 'Unpaid'], [false, 'Unpaid'], [false, 'Unpaid'], [false, 'Partly paid'], [true, 'Billed to Port Moresby General Hospital'], [true, 'Paid in full'], [false, 'Held by the payment gate'], [true, 'Billed by EMR'], [true, 'Waived']];
  const odoo = [[false, 'Invoice OE-CPHL-26-004188: not paid'], [true, 'Invoice OE-CPHL-26-004191: paid'], [false, 'Invoice OE-CPHL-26-004195: not paid'], [false, 'Invoice OE-CPHL-26-004158: partly paid'], [true, 'Invoice OE-CPHL-26-004180: paid'], [true, 'Invoice OE-CPHL-26-004177: in payment'], [false, 'Invoice OE-CPHL-26-004172: not paid'], [null, 'No invoice in Odoo'], [null, 'Invoice OE-CPHL-26-004166 cancelled in Odoo']];
  const st = src === 'billing' ? billing : odoo;
  const srcText = src === 'billing' ? 'Set by Billing' : 'Set by Odoo, read 10:40';
  const rows = base.map((r, k) => [...r, st[k][0], st[k][1]]);
  const notPaidCount = rows.filter((r) => r[7] === false).length;
  const shown = rows.filter((r) => f === 'all' || (f === 'paid' ? r[7] === true : r[7] === false));
  return (<div>
    <Header crumbs={['Home', 'Orders', 'Clinical Orders']} title="Clinical orders" sub="The order dashboard of Clinical Order Entry v4 (section H). Billing adds the Payment column and filter: Paid or Not paid only, with no amounts. Everything else on this page belongs to that spec." />
    <div className="toolbar"><span className="mini">Status source in this preview:</span>
      <select className="sel" aria-label="Status source" value={src} onChange={(e) => { setSrc(e.target.value); setF('all'); }}><option value="billing">Billing on (FR-D15)</option><option value="odoo">Billing off, Odoo connected (FR-J8)</option></select>
      {src === 'billing' && <Toggle on={asCashier} onChange={setAsCashier} label="Preview as a user with billing:collect" />}</div>
    <div className="toolbar"><span className="mini">Quick filters:</span>
      <Btn kind="ghost">In progress (14)</Btn><Btn kind="ghost">Awaiting sample (3)</Btn><Btn kind={f === 'notPaid' ? 'primary' : 'ghost'} onClick={() => setF(f === 'notPaid' ? 'all' : 'notPaid')}>{`Unpaid (${notPaidCount})`}</Btn><Btn kind="ghost">Cancelled</Btn>
      <select className="sel" aria-label="Payment" value={f} onChange={(e) => setF(e.target.value)}><option value="all">All payment states</option><option value="paid">Paid</option><option value="notPaid">Not paid</option></select></div>
    <Table headers={['Lab No', 'Patient', 'Facility', 'Progress', 'Tests', 'Samples', 'Entered', 'Payment', '']}
      rows={shown.map((r) => [r[0], r[1], r[2], <Tag kind={r[3][0]}>{r[3][1]}</Tag>, r[4], r[5], r[6], <PaidTag paid={r[7]} why={r[8]} src={srcText} link={src === 'billing' && asCashier && r[7] === false} labNo={r[0]} />, <Btn kind="ghost">Open</Btn>])} />
    <p className="note">{`URL: /order/clinical${f === 'all' ? '' : '?payment=' + f} · Hover a Payment tag for its reason and source; no amount is shown on this page for any user. Paid means nothing is left to collect at the counter, so orders billed to a payer, waived or billed by an EMR show Paid (BL-38; a setting to change this may come later).${src === 'odoo' ? ' With Billing off, the status comes from each order\'s Odoo invoice (ref OE-{lab number}): paid and in payment are Paid; not paid and partly paid are Not paid; no invoice or a cancelled one shows None. Odoo statuses never link to the Cash Desk.' : ' For users with billing:collect, a Not paid tag opens the order at the Cash Desk.'}`}</p>
  </div>);
}
function PatientRecord() {
  return (<div>
    <Header crumbs={['Home', 'Patients', 'Mary Kaupa']} title="Mary Kaupa: Billing section" sub="The Billing section of the patient record, for users with billing:view or billing:collect. The rest of the patient record belongs to the patient spec." />
    <Fence owner="Patient record (Patient Management): Demographics, Identifiers, Orders"><div className="mini">Mary Kaupa · PT-0041872 · F, 34 y · National ID 1992-0312-4471</div></Fence>
    <div className="row">

    <p className="note">Balance reminders are off in this lab (Configuration › Billing).</p>

  claims: ['/Billing/claims', Claims], remit: ['/Billing/remittances', Remittances], unbilled: ['/Billing/unbilled', Unbilled], reports: ['/Billing/reports', Reports],
  prices: ['/MasterListsPage/priceLists', PriceLists], services: ['/MasterListsPage/billableServices', Services], exempt: ['/MasterListsPage/exemptionRules', Exemptions], modes: ['/MasterListsPage/paymentModes', PaymentModes],
  config: ['/MasterListsPage/configuration?area=billing', Config], order: ['Order entry, section 7 (existing route)', OrderEntry], dash: ['/order/clinical (existing)', OrderDashboard], patient: ['Patient record, Billing section (existing route)', PatientRecord], tax: ['/MasterListsPage/taxRates', TaxRates], test: ['Test Catalog test editor (existing route)', TestCatalog],
  org: ['/MasterListsPage/locations (existing)', Organization], program: ['Programs (existing route)', Program],
};
function App() {
  const [v, setV] = useState('overview');
  const N = ({ id, children, sub }) => <button className={(v === id ? 'active ' : '') + (sub ? 'sub' : '')} onClick={() => setV(id)}>{children}</button>;
  const Comp = views[v][1];
  return (<div>
    <div className="preview-banner">Visual Preview: Billing (S-13) &nbsp;|&nbsp; OpenELIS Design Mockup &nbsp;|&nbsp; Not a live application &nbsp;|&nbsp; Route: {views[v][0]}</div>
    <div className="shell"><nav className="nav" aria-label="Preview navigation">
      <h6>Main menu: Billing</h6>
      <N id="overview">Overview</N><N id="cash">Cash Desk</N><N id="bills">Bills & Statements</N><N id="quotes">Quotes</N><N id="claims">Claims</N><N id="remit">Remittances</N><N id="unbilled">Unbilled Work</N><N id="reports">Reports</N>
      <h6>Admin: Resources › Billing</h6>

}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
