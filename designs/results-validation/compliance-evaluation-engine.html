<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S-05 v2.0: Regulation-Scoped Reference Ranges — In Context</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
    .preview-banner { background: #491d8b; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .oe-shell { background: #f4f4f4; min-height: 100vh; }
    .oe-topbar { background: #161616; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
    .oe-topbar .logo { font-weight: 600; font-size: 14px; }
    .oe-topbar .nav-item { font-size: 13px; opacity: 0.7; cursor: pointer; }
    .oe-topbar .spacer { flex: 1; }
    .oe-topbar .user { font-size: 12px; opacity: 0.7; }
    .oe-breadcrumb { background: #fff; padding: 8px 24px; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #525252; }
    .oe-breadcrumb a { color: #0f62fe; text-decoration: none; }
    .oe-breadcrumb .sep { margin: 0 6px; color: #c6c6c6; }
    .oe-page { padding: 16px 24px; max-width: 1300px; margin: 0 auto; }
    .oe-page-header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; }
    .oe-page-title { font-size: 28px; font-weight: 300; margin: 0; }
    .oe-page-subtitle { font-size: 14px; color: #525252; margin: 4px 0 0 0; }
    .tile { background: #fff; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e0e0e0; }
    .tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 0.75rem 0; }
    .form-field { margin-bottom: 0.75rem; }
    .form-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .form-field input, .form-field select {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 2px solid #8d8d8d;
      font-size: 14px; background: #f4f4f4; outline: none; box-sizing: border-box;
    }
    .form-field input[readonly] { background: #e0e0e0; color: #525252; }
    .grid { display: grid; gap: 1rem; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .helper { font-size: 12px; color: #525252; }
    .btn { padding: 6px 14px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: #0f62fe; }
    .btn-primary { background: #0f62fe; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; background: #f4f4f4; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e0e0e0; }
    th.new-col { background: #fcf4d6; }
    td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    td code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #f4f4f4; padding: 2px 6px; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 24px; font-size: 12px; font-weight: 500; }
    .tag-purple { background: #e8daff; color: #491d8b; }
    .tag-green { background: #defbe6; color: #0e6027; }
    .tag-magenta { background: #ffd6e8; color: #740937; }
    .tag-red { background: #ffd7d9; color: #a2191f; }
    .new-region { border: 2px dashed #f1c21b; border-radius: 6px; padding: 12px; position: relative; margin-bottom: 1rem; }
    .new-region::before {
      content: attr(data-label); position: absolute; top: -11px; left: 12px;
      background: #f1c21b; color: #000; font-size: 11px; font-weight: 700;
      padding: 1px 8px; border-radius: 4px; z-index: 2;
    }
    .existing-region { opacity: 0.72; position: relative; margin-bottom: 1rem; }
    .existing-region::before {
      content: 'EXISTING'; position: absolute; top: 4px; right: 8px; z-index: 1;
      background: #8d8d8d; color: #fff; font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 3px;
    }
    .scenes { background: #393939; color: #fff; display: flex; padding: 0; }
    .scene { padding: 10px 16px; cursor: pointer; font-size: 13px; border-right: 1px solid #525252; }
    .scene:hover { background: #525252; }
    .scene.active { background: #0f62fe; font-weight: 600; }
    .filter-bar { display: flex; gap: 12px; align-items: flex-end; padding: 12px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .info-tile { background: #edf5ff; border-left: 3px solid #0f62fe; padding: 12px 16px; margin-top: 16px; }
    .info-tile h5 { font-size: 14px; font-weight: 600; margin: 0 0 8px 0; }
    .info-tile ul { margin: 0; padding-left: 20px; font-size: 13px; }
    .expanded-row { background: #f4f4f4; padding: 0; }
    .expanded-content { padding: 16px; }
    .threshold-source { display: inline-flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .threshold-source-text { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="preview-banner">⚡ S-05 v2.0 — Regulation-Scoped Reference Ranges — IN-CONTEXT preview (reframed from v1.0 Compliance Evaluation Engine)</div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const STANDARDS = [
      { id: 'std-001', regNumber: 'PP No. 22/2021', version: '2021-01' },
      { id: 'std-003', regNumber: 'WHO-DWG-4', version: '2011-01' },
      { id: 'std-005', regNumber: 'PMK No. 32/2017', version: '2017-01' },
    ];

    // 2026-04-28 amendment: ranges gain optional `component` scope; results carry `sources[]` per regulation
    const RANGES = [
      { id: 1, test: 'Turbidity', component: null, sampleType: 'Surface Water', min: null, max: 25, unit: 'NTU', standard: 'PP No. 22/2021' },
      { id: 2, test: 'Turbidity', component: null, sampleType: 'Drinking Water', min: null, max: 5, unit: 'NTU', standard: 'WHO-DWG-4' },
      { id: 3, test: 'Turbidity', component: null, sampleType: '(any)', min: null, max: 25, unit: 'NTU', standard: '(generic)' },
      { id: 4, test: 'pH', component: null, sampleType: 'Surface Water', min: 6.0, max: 9.0, unit: '—', standard: 'PP No. 22/2021' },
      { id: 5, test: 'pH', component: null, sampleType: 'Drinking Water', min: 6.5, max: 8.5, unit: '—', standard: 'WHO-DWG-4' },
      { id: 6, test: 'Total Coliform', component: null, sampleType: 'Surface Water', min: null, max: 5000, unit: 'MPN/100mL', standard: 'PP No. 22/2021' },
      { id: 7, test: 'Total Coliform', component: null, sampleType: 'Drinking Water', min: 0, max: 0, unit: 'MPN/100mL', standard: 'WHO-DWG-4' },
      { id: 8, test: 'Noise Pollution Survey', component: 'Heading (°)', sampleType: 'Ambient Air', min: 0, max: 360, unit: '°', standard: '(no eval — informational)' },
      { id: 9, test: 'Noise Pollution Survey', component: 'Sound Pressure (dB)', sampleType: 'Ambient Air (Daytime)', min: null, max: 70, unit: 'dB', standard: 'PP No. 41/1999' },
      { id: 10, test: 'Noise Pollution Survey', component: 'Sound Pressure (dB)', sampleType: 'Ambient Air (Daytime)', min: null, max: 65, unit: 'dB', standard: 'WHO Env Noise' },
    ];

    const RESULTS = [
      { id: 1, accession: 'ENV-2026-0412.001', test: 'Turbidity', component: null, value: '18', unit: 'NTU',
        sources: [
          { reg: 'PP No. 22/2021', flag: 'Normal', label: '≤ 25 NTU' },
          { reg: 'WHO-DWG-4', flag: 'Critical', label: '≤ 5 NTU' },
        ]},
      { id: 2, accession: 'ENV-2026-0412.001', test: 'pH', component: null, value: '7.2', unit: '—',
        sources: [
          { reg: 'PP No. 22/2021', flag: 'Normal', label: '6.0 – 9.0' },
          { reg: 'WHO-DWG-4', flag: 'Normal', label: '6.5 – 8.5' },
        ]},
      { id: 3, accession: 'ENV-2026-0412.001', test: 'Total Coliform', component: null, value: '6800', unit: 'MPN/100mL',
        sources: [
          { reg: 'PP No. 22/2021', flag: 'Abnormal', label: '≤ 5000 MPN/100mL' },
          { reg: 'WHO-DWG-4', flag: 'Critical', label: '0 MPN/100mL' },
        ]},
      // Multi-component noise pollution with two reading groups
      { id: 100, accession: 'ENV-2026-0412.005', test: 'Noise Pollution Survey', component: 'Heading (°)',
        value: '90', unit: '°', readingGroupId: 'rg-1', readingLabel: 'Reading 1 — North face',
        sources: [{ reg: '(informational)', flag: null, label: 'no compliance threshold' }] },
      { id: 101, accession: 'ENV-2026-0412.005', test: 'Noise Pollution Survey', component: 'Sound Pressure (dB)',
        value: '72', unit: 'dB', readingGroupId: 'rg-1', readingLabel: 'Reading 1 — North face',
        sources: [
          { reg: 'PP No. 41/1999', flag: 'Abnormal', label: '≤ 70 dB' },
          { reg: 'WHO Env Noise', flag: 'Critical', label: '≤ 65 dB' },
        ]},
      { id: 102, accession: 'ENV-2026-0412.005', test: 'Noise Pollution Survey', component: 'Heading (°)',
        value: '180', unit: '°', readingGroupId: 'rg-2', readingLabel: 'Reading 2 — East face',
        sources: [{ reg: '(informational)', flag: null, label: 'no compliance threshold' }] },
      { id: 103, accession: 'ENV-2026-0412.005', test: 'Noise Pollution Survey', component: 'Sound Pressure (dB)',
        value: '64', unit: 'dB', readingGroupId: 'rg-2', readingLabel: 'Reading 2 — East face',
        sources: [
          { reg: 'PP No. 41/1999', flag: 'Normal', label: '≤ 70 dB' },
          { reg: 'WHO Env Noise', flag: 'Normal', label: '≤ 65 dB' },
        ]},
      { id: 4, accession: 'ENV-2026-0412.001', test: 'Field Notes (free text)', component: null,
        value: 'Collected 50m downstream', unit: '', sources: null },
    ];

    const FLAG_CLS = {
      Normal: { cls: 'tag-green', label: '✓ Normal' },
      Abnormal: { cls: 'tag-magenta', label: '⚠ Abnormal' },
      Critical: { cls: 'tag-red', label: '✕ Critical' },
    };

    function Topbar() {
      return (
        <div className="oe-topbar">
          <span className="logo">OpenELIS Global</span>
          <span className="nav-item">Home</span>
          <span className="nav-item">Order</span>
          <span className="nav-item">Results</span>
          <span className="nav-item">Validation</span>
          <span className="nav-item">Admin</span>
          <span className="spacer"></span>
          <span className="user">caseyi · Admin</span>
        </div>
      );
    }

    function Breadcrumb({ trail }) {
      return (
        <div className="oe-breadcrumb">
          {trail.map((t, i) => (
            <span key={i}>
              {i > 0 && <span className="sep">›</span>}
              {i < trail.length - 1 ? <a href="#">{t}</a> : <strong>{t}</strong>}
            </span>
          ))}
        </div>
      );
    }

    function PageHeader({ title, subtitle }) {
      return (
        <div className="oe-page-header">
          <h1 className="oe-page-title">{title}</h1>
          {subtitle && <p className="oe-page-subtitle">{subtitle}</p>}
        </div>
      );
    }

    function Scene1_RangeAdmin() {
      const [filter, setFilter] = useState('All');
      const filtered = useMemo(() => {
        if (filter === 'All') return RANGES;
        return RANGES.filter(r => r.standard === filter);
      }, [filter]);
      return (
        <div>
          <Breadcrumb trail={['Admin', 'Reference Data', 'Reference Ranges']} />
          <PageHeader title="Reference Range Management" subtitle="S-05 v2 adds Compliance Standard as one new scope dimension. NULL = generic clinical range. Non-NULL = regulation-scoped." />
          <div className="oe-page">
            <div className="existing-region">
              <div className="tile">
                <h5>Reference Range Admin (existing OE page)</h5>
                <p className="helper">Gates: <code>referenceRange.edit</code> · No new permission key</p>
              </div>
            </div>

            <div className="new-region" data-label="S-05 v2 NEW">
              <div className="tile" style={{ marginBottom: 0 }}>
                <div className="filter-bar" style={{ padding: 0, borderBottom: 'none' }}>
                  <div className="form-field" style={{ marginBottom: 0 }}>
                    <label>Compliance Standard (new filter)</label>
                    <select value={filter} onChange={(e) => setFilter(e.target.value)} style={{ minWidth: 240 }}>
                      <option value="All">All</option>
                      <option value="(generic)">(generic)</option>
                      {STANDARDS.map(s => <option key={s.id} value={s.regNumber}>{s.regNumber}</option>)}
                    </select>
                  </div>
                  <button className="btn btn-primary">+ Add Reference Range</button>
                </div>

                <table style={{ marginTop: 12 }}>
                  <thead>
                    <tr>
                      <th>Test</th>
                      <th className="new-col">Component (new col 2026-04-28)</th>
                      <th>Sample Type</th>
                      <th>Min</th>
                      <th>Max</th>
                      <th>Unit</th>
                      <th className="new-col">Compliance Standard (new col v2)</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map(r => (
                      <tr key={r.id}>
                        <td>{r.test}</td>
                        <td>
                          {r.component
                            ? <span className="tag" style={{ background:'#bae6ff', color:'#003a6d' }}>{r.component}</span>
                            : <span style={{ color: '#8d8d8d', fontSize: 12, fontStyle: 'italic' }}>(single-component)</span>}
                        </td>
                        <td>{r.sampleType}</td>
                        <td>{r.min ?? '—'}</td>
                        <td>{r.max ?? '—'}</td>
                        <td>{r.unit}</td>
                        <td>
                          {r.standard === '(generic)' || r.standard?.startsWith('(no eval')
                            ? <span style={{ color: '#525252', fontSize: 12, fontStyle: 'italic' }}>{r.standard}</span>
                            : <span className="tag tag-purple">{r.standard}</span>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <p className="helper" style={{ marginTop: 8 }}>
                  ⚠️ Yellow column = new from S-05 v2. Showing {filtered.length} of {RANGES.length} rows.
                </p>
              </div>
            </div>

            <div className="new-region" data-label="S-05 v2 form addition">
              <div className="tile" style={{ marginBottom: 0 }}>
                <h5>Add / Edit Reference Range — form gains one field</h5>
                <div className="grid grid-4">
                  <div className="form-field"><label>Test</label><input value="Turbidity" readOnly /></div>
                  <div className="form-field"><label>Sample Type</label><input value="Surface Water" readOnly /></div>
                  <div className="form-field"><label>Min</label><input type="number" /></div>
                  <div className="form-field"><label>Max</label><input type="number" defaultValue={25} /></div>
                </div>
                <div style={{ background: '#fcf4d6', padding: 8, borderRadius: 4, maxWidth: 400 }}>
                  <div className="form-field" style={{ marginBottom: 0 }}>
                    <label>Compliance Standard (new — optional)</label>
                    <select defaultValue="std-001">
                      <option value="">(generic — no compliance standard)</option>
                      {STANDARDS.map(s => <option key={s.id} value={s.id}>{s.regNumber}</option>)}
                    </select>
                  </div>
                </div>
                <p className="helper" style={{ marginTop: 8 }}>
                  ⚠️ Yellow field = new from S-05 v2. NULL = generic; non-NULL scopes the row to that standard.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Scene2_ResultsEntry() {
      const [expandedId, setExpandedId] = useState(3);
      return (
        <div>
          <Breadcrumb trail={['Results', 'Result Entry', 'ENV-2026-0412']} />
          <PageHeader
            title="Results Entry — Order ENV-2026-0412 (selected regulations: PP No. 22/2021 + WHO-DWG-4)"
            subtitle="2026-04-28 amendments: side-by-side per-regulation flags · threshold-source list (not single line) · multi-component rendering with reading-group headers."
          />
          <div className="oe-page">
            <div className="existing-region">
              <div className="tile">
                <h5>Existing Results Entry chrome — multi-regulation evaluation visible inline</h5>
                <p className="helper">Per-result inline flag is the existing OE Tag pattern; v2 amendment layers it once per applicable regulation.</p>
              </div>
            </div>

            <div className="existing-region">
              <div className="tile" style={{ marginBottom: 0 }}>
                <table>
                  <thead>
                    <tr>
                      <th>Accession</th>
                      <th>Test / Component</th>
                      <th>Result</th>
                      <th>Unit</th>
                      <th className="new-col">Flags — per regulation (new pattern)</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {RESULTS.map((r, i) => {
                      const isNewReadingGroup = r.readingGroupId && (i === 0 || RESULTS[i - 1].readingGroupId !== r.readingGroupId);
                      return (
                        <React.Fragment key={r.id}>
                          {isNewReadingGroup && (
                            <tr style={{ background: '#fff8e1' }}>
                              <td colSpan="6" style={{ fontSize: 12, fontWeight: 600, color: '#491d8b' }}>
                                ↳ {r.readingLabel} · reading group {r.readingGroupId}
                              </td>
                            </tr>
                          )}
                          <tr>
                            <td><code>{r.accession}</code></td>
                            <td>
                              {r.component ? (
                                <span>
                                  <span style={{ color:'#525252' }}>{r.test} ·</span>{' '}
                                  <span className="tag" style={{ background:'#bae6ff', color:'#003a6d' }}>{r.component}</span>
                                </span>
                              ) : r.test}
                            </td>
                            <td><strong>{r.value}</strong></td>
                            <td>{r.unit}</td>
                            <td>
                              {r.sources && r.sources.length > 0 ? (
                                <div style={{ display:'flex', flexWrap:'wrap', gap: 4 }}>
                                  {r.sources.map((src, j) => (
                                    <span key={j} style={{ fontSize: 11, whiteSpace: 'nowrap' }}>
                                      <span className="tag tag-purple">{src.reg}</span>{' '}
                                      {src.flag
                                        ? <span className={`tag ${FLAG_CLS[src.flag].cls}`}>{FLAG_CLS[src.flag].label}</span>
                                        : <span className="helper" style={{ fontStyle:'italic' }}>— informational</span>}
                                    </span>
                                  ))}
                                </div>
                              ) : (
                                <span className="helper">—</span>
                              )}
                            </td>
                            <td>
                              <button className="btn btn-ghost" onClick={() => setExpandedId(expandedId === r.id ? null : r.id)}>
                                {expandedId === r.id ? '▴ Collapse' : '▾ Expand'}
                              </button>
                            </td>
                          </tr>
                          {expandedId === r.id && (
                            <tr>
                              <td colSpan="6" className="expanded-row">
                                <div className="new-region" data-label="S-05 v2 expanded detail (2026-04-28: list, not single line)" style={{ margin: 8 }}>
                                  <div className="expanded-content">
                                    <h5>
                                      Result Detail — {r.test}
                                      {r.component && <span> · <span className="tag" style={{ background:'#bae6ff', color:'#003a6d' }}>{r.component}</span></span>}
                                      {r.readingLabel && <span style={{ fontSize: 12, color: '#525252' }}> · {r.readingLabel}</span>}
                                    </h5>
                                    {r.sources && r.sources.length > 0 ? (
                                      <div style={{ marginBottom: 8 }}>
                                        <span className="tag tag-purple">Threshold sources</span>
                                        <ul style={{ marginTop: 8, marginLeft: 16, fontSize: 13 }}>
                                          {r.sources.map((src, j) => (
                                            <li key={j} style={{ fontFamily: 'monospace' }}>
                                              <strong>{src.reg}</strong> — {src.label}
                                              {src.flag && <> · <span className={`tag ${FLAG_CLS[src.flag].cls}`}>{FLAG_CLS[src.flag].label}</span></>}
                                            </li>
                                          ))}
                                        </ul>
                                      </div>
                                    ) : (
                                      <p className="helper" style={{ fontStyle: 'italic' }}>No reference range matched — no flag applied.</p>
                                    )}
                                    <p className="helper">Existing override / comment / audit-trail fields below — unchanged.</p>
                                  </div>
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="info-tile">
              <h5>2026-04-28 amendments demonstrated above</h5>
              <ul>
                <li>✅ Side-by-side flags when ≥2 regulations apply (rows 1, 2, 3 — Turbidity / pH / Coliform)</li>
                <li>✅ Multi-component rendering with reading-group headers (rows 100–103 — noise pollution survey, 2 readings × 2 components)</li>
                <li>✅ Threshold-source LIST in expanded detail (was single line in v1)</li>
                <li>❌ Still no regulation banner at top — context lives in the order, not the screen</li>
                <li>❌ Still no new flag tier — existing Normal/Abnormal/Critical do the work</li>
                <li>❌ Categorical observations still in S-05a (OGC-639), separate ticket</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [scene, setScene] = useState(0);
      const scenes = [
        { label: '1 — Reference Range Admin (new filter + form field)', cmp: <Scene1_RangeAdmin /> },
        { label: '2 — Results Entry (expanded detail with threshold source)', cmp: <Scene2_ResultsEntry /> },
      ];
      return (
        <div className="oe-shell">
          <Topbar />
          <div className="scenes">
            {scenes.map((s, i) => (
              <div key={i} className={`scene ${scene === i ? 'active' : ''}`} onClick={() => setScene(i)}>{s.label}</div>
            ))}
          </div>
          {scenes[scene].cmp}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
