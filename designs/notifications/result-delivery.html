<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Delivery: OpenELIS Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { background: #f4f4f4; margin: 0; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; color: #161616; }
    .preview-banner { background: #0f62fe; color: #fff; padding: 6px 1rem; font-size: 12px; font-family: monospace; }
    .shell { display: flex; min-height: calc(100vh - 28px); }
    .switcher { width: 250px; background: #fff; border-right: 1px solid #e0e0e0; padding: 1rem 0; flex-shrink: 0; }
    .switcher h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .32px; color: #525252; margin: 1rem 1rem .5rem; }
    .switcher button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .5rem 1rem; font-size: 14px; cursor: pointer; color: #161616; border-left: 3px solid transparent; }
    .switcher button.active { background: #e8e8e8; border-left-color: #0f62fe; font-weight: 600; }
    .main { flex: 1; padding: 1.5rem 2rem; max-width: 1200px; }
    .crumb { font-size: 12px; color: #525252; margin-bottom: .25rem; }
    .crumb a { color: #0f62fe; text-decoration: none; }
    h1.page { font-size: 28px; font-weight: 400; margin: .25rem 0 .25rem; }
    .desc { color: #525252; font-size: 14px; margin: 0 0 1.25rem; max-width: 760px; }
    .route { font-family: monospace; font-size: 12px; color: #6f6f6f; margin-bottom: 1rem; }
    .toolbar { display: flex; gap: .5rem; align-items: center; background: #fff; padding: .5rem; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
    .toolbar input, .toolbar select { height: 32px; border: 0; border-bottom: 1px solid #8d8d8d; background: #f4f4f4; padding: 0 .5rem; font-size: 14px; }
    .batchbar { background: #0f62fe; color: #fff; display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; }
    .batchbar button { background: transparent; color: #fff; border: 0; font-size: 14px; cursor: pointer; padding: .25rem .5rem; }
    .batchbar button:hover { background: #0353e9; }
    table.cds--data-table { width: 100%; background: #fff; }
    table.cds--data-table td, table.cds--data-table th { vertical-align: top; }
    .expand { background: #f4f4f4; padding: 1rem 1.25rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 2rem; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem 2rem; }
    .field label { display: block; font-size: 12px; color: #525252; margin-bottom: .25rem; }
    .field input, .field select, .field textarea { width: 100%; box-sizing: border-box; height: 40px; border: 0; border-bottom: 1px solid #8d8d8d; background: #fff; padding: 0 .75rem; font-size: 14px; }
    .field textarea { height: 96px; padding: .5rem .75rem; font-family: inherit; }
    .helper { font-size: 12px; color: #6f6f6f; margin-top: .25rem; }
    .secret { display: flex; gap: .5rem; align-items: center; }
    .secret code { background: #fff; padding: .5rem .75rem; font-size: 15px; letter-spacing: 1px; min-width: 170px; border-bottom: 1px solid #8d8d8d; }
    .btnrow { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
    .mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .muted { color: #6f6f6f; font-size: 12px; }
    .modal-back { position: fixed; inset: 0; background: rgba(22,22,22,.5); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal { background: #fff; width: 860px; max-height: 88vh; overflow: auto; }
    .modal header { padding: 1rem 1rem .5rem; }
    .modal header h3 { margin: 0; font-size: 20px; font-weight: 400; }
    .modal .body { padding: 0 1rem 1rem; }
    .modal footer { display: flex; justify-content: flex-end; border-top: 1px solid #e0e0e0; }
    .modal footer button { flex: 0 0 50%; height: 56px; border: 0; font-size: 14px; text-align: left; padding: 0 1rem; cursor: pointer; }
    .group { border: 1px solid #e0e0e0; margin-bottom: .75rem; }
    .group h5 { margin: 0; padding: .5rem .75rem; background: #f4f4f4; font-size: 14px; }
    .reciprow { display: grid; grid-template-columns: 24px 1.4fr 1.3fr 1.2fr 1.4fr; gap: .5rem; align-items: center; padding: .5rem .75rem; border-top: 1px solid #e0e0e0; font-size: 14px; }
    .tile { background: #fff; padding: 1rem; margin-bottom: 1rem; }
    .section-title { font-size: 16px; font-weight: 600; margin: 0 0 .75rem; }
    .chip { display: inline-block; background: #e0e0e0; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin: 0 4px 4px 0; }
    .mf { display: inline-block; border: 1px solid #8d8d8d; padding: 2px 8px; font-size: 12px; margin: 0 4px 4px 0; cursor: pointer; background: #fff; font-family: monospace; }
    .previewbox { background: #fff; border: 1px dashed #8d8d8d; padding: .75rem; font-size: 13px; white-space: pre-wrap; }
    .toast { background: #defbe6; border-left: 3px solid #24a148; padding: .75rem 1rem; margin-bottom: 1rem; font-size: 14px; }
    .warn { background: #fcf4d6; border-left: 3px solid #f1c21b; padding: .75rem 1rem; font-size: 14px; margin: .5rem 0; }
    .info { background: #edf5ff; border-left: 3px solid #0f62fe; padding: .75rem 1rem; font-size: 14px; margin: .5rem 0; }
    .rowlink { color: #0f62fe; cursor: pointer; }
    .cds--tag { white-space: nowrap; }
  </style>
</head>
<body class="cds--white">
  <div class="preview-banner">Visual Preview: Result Delivery &nbsp;|&nbsp; OpenELIS Design Mockup &nbsp;|&nbsp; Not a live application &nbsp;|&nbsp; Routes: /ReportPrintQueue, /SentMessages, /MasterListsPage/notificationTriggerConfig/*</div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const Tag = ({ kind, children }) => <span className={`cds--tag cds--tag--${kind}`}>{children}</span>;
    const Btn = ({ kind = 'primary', size = 'sm', children, onClick, disabled }) => (
      <button className={`cds--btn cds--btn--${kind} cds--btn--${size}`} onClick={onClick} disabled={disabled}>{children}</button>
    );
    const Crumb = ({ items }) => (
      <div className="crumb">{items.map((c, i) => <span key={i}>{i > 0 && ' / '}{i < items.length - 1 ? <a href="#">{c}</a> : c}</span>)}</div>
    );
    const statusTag = (s) => ({ Sent: <Tag kind="green">Sent</Tag>, Failed: <Tag kind="red">Failed</Tag>, Queued: <Tag kind="blue">Queued</Tag>, Skipped: <Tag kind="gray">Skipped</Tag> }[s]);
    const stateTag = (s) => ({ Final: <Tag kind="green">Final</Tag>, Partial: <Tag kind="blue">Partial</Tag>, Amended: <Tag kind="magenta">Amended</Tag> }[s]);

    // ---------- 1. Report Print Queue with Send ----------
    const queueRows = [
      { id: 1, type: 'Patient report', lab: 'CPHL-26-004188', subj: 'M. K.', code: 'PT-77120', req: 'Port Moresby General Hospital / Ward 4B', ext: 'PMGH-88213', state: 'Final', print: 'Printed v2', sent: 'Sent v2 14:32' },
      { id: 2, type: 'Patient report', lab: 'CPHL-26-004191', subj: 'J. T.', code: 'PT-77134', req: 'Port Moresby General Hospital / Emergency', ext: 'PMGH-88219', state: 'Partial', print: 'Unprinted', sent: 'Queued: sends 14:52' },
      { id: 3, type: 'Patient report', lab: 'CPHL-26-004195', subj: 'A. W.', code: 'PT-77141', req: 'Port Moresby General Hospital / Maternity', ext: 'PMGH-88230', state: 'Amended', print: 'Printed v3', sent: 'Sent v2' },
      { id: 4, type: 'Patient report', lab: 'CPHL-26-004203', subj: 'S. N.', code: 'PT-77160', req: '9 Mile Urban Clinic', ext: '9M-2210', state: 'Final', print: 'Unprinted', sent: 'Not sent' },
      { id: 5, type: 'Patient report', lab: 'CPHL-26-004207', subj: 'P. B.', code: 'PT-77172', req: '9 Mile Urban Clinic', ext: '9M-2214', state: 'Final', print: 'Unprinted', sent: 'Not sent' },
      { id: 6, type: 'Environmental', lab: 'CPHL-26-E00412', subj: 'Sabama Water Intake', code: 'WS-014', req: 'Eda Ranu Water Utility', ext: 'ER-Q4-118', state: 'Final', print: 'Printed v1', sent: 'Not sent' },
      { id: 7, type: 'Patient report', lab: 'CPHL-26-004211', subj: 'D. K.', code: 'PT-77180', req: 'Gerehu General Hospital', ext: 'GGH-5521', state: 'Final', print: 'Unprinted', sent: 'Not sent' },
    ];

    function SendDialog({ selected, onClose, onSent }) {
      const [showPw, setShowPw] = useState(false);
      const [typed, setTyped] = useState('');
      const [addedTyped, setAddedTyped] = useState(false);
      const [maskPmgh, setMaskPmgh] = useState(false);
      return (
        <div className="modal-back"><div className="modal" role="dialog" aria-label="Send reports">
          <header><div className="muted">Report Print Queue</div><h3>Send reports</h3></header>
          <div className="body">
            <p style={{ fontSize: 14, marginTop: 0 }}>Each recipient gets one email with all its reports attached. Full reports are always password protected.</p>
            <div className="group">
              <h5>Port Moresby General Hospital &nbsp;<span className="muted">3 reports: CPHL-26-004188 v2, CPHL-26-004191 v1 (partial), CPHL-26-004195 v3 (amended)</span></h5>
              <div className="reciprow" style={{ fontWeight: 600, fontSize: 12, color: '#525252' }}><span></span><span>Recipient</span><span>Address</span><span>Format</span><span>Password</span></div>
              <div className="reciprow"><input type="checkbox" defaultChecked aria-label="Send to Port Moresby General Hospital lab office" /><span>Facility: Lab results office</span><span className="mono">results@pmgh.health.gov.pg</span>
                <select value={maskPmgh ? 'masked' : 'protected'} onChange={e => setMaskPmgh(e.target.value === 'masked')}><option value="protected">Protected full report</option><option value="masked">Masked copy</option></select>
                <span className="secret"><code>{showPw ? 'K7M-PQ4-RTW-9XF' : '•••-•••-•••-•••'}</code><Btn kind="ghost" onClick={() => setShowPw(!showPw)}>{showPw ? 'Hide' : 'Show'}</Btn></span></div>
              <div className="reciprow"><input type="checkbox" defaultChecked aria-label="Send to Ward 4B" /><span>Ward 4B</span><span className="mono">ward4b@pmgh.health.gov.pg</span><span>Protected full report</span><span className="muted">Facility password</span></div>
              <div className="reciprow"><input type="checkbox" aria-label="Send to Dr Kila" /><span>Clinician: Dr R. Kila</span><span className="mono">r.kila@pmgh.health.gov.pg</span><span>Protected full report</span><span className="muted">Facility password</span></div>
            </div>
            <div className="group">
              <h5>9 Mile Urban Clinic &nbsp;<span className="muted">2 reports: CPHL-26-004203 v1, CPHL-26-004207 v1</span></h5>
              <div className="reciprow"><input type="checkbox" defaultChecked aria-label="Send to 9 Mile Urban Clinic" /><span>Facility</span><span className="mono">9mile.clinic@gmail.com</span><span>Masked copy</span><span className="muted">No password: masked copy</span></div>
              {addedTyped && <div className="reciprow"><input type="checkbox" defaultChecked aria-label="Send to typed address" /><span>Added for this send</span><span className="mono">{typed}</span><span>Masked copy</span><span className="muted">Typed address: masked copy</span></div>}
              <div style={{ padding: '.5rem .75rem', borderTop: '1px solid #e0e0e0', display: 'flex', gap: '.5rem', alignItems: 'end' }}>
                <div className="field" style={{ flex: 1 }}><label>Add an address for this send</label><input value={typed} onChange={e => setTyped(e.target.value)} placeholder="name@example.org or +675 7xxx xxxx" /></div>
                <Btn kind="tertiary" onClick={() => typed && setAddedTyped(true)}>Add</Btn>
              </div>
              {addedTyped && <div className="warn">Send 2 reports to {typed} as masked copies? This address is not in the directory and will not be saved.</div>}
            </div>
            <div className="group">
              <h5>Eda Ranu Water Utility &nbsp;<span className="muted">1 certificate: CPHL-26-E00412 v1</span></h5>
              <div className="reciprow"><input type="checkbox" defaultChecked aria-label="Send to Eda Ranu" /><span>Client: Requestor contact (V. Gare)</span><span className="mono">v.gare@edaranu.com.pg</span><span>Masked copy</span><span className="muted">No password set</span></div>
            </div>
            <div className="group">
              <h5>Gerehu General Hospital &nbsp;<span className="muted">1 report: CPHL-26-004211 v1</span></h5>
              <div className="reciprow"><input type="checkbox" disabled aria-label="Gerehu has no address" /><span>Facility</span><span className="muted">No report email</span><span>-</span><span><Tag kind="gray">Will be skipped</Tag></span></div>
            </div>
          </div>
          <footer>
            <button className="cds--btn--secondary" style={{ background: '#393939', color: '#fff' }} onClick={onClose}>Cancel</button>
            <button style={{ background: '#0f62fe', color: '#fff' }} onClick={onSent}>Send {selected} reports to {addedTyped ? 6 : 5} recipients</button>
          </footer>
        </div></div>
      );
    }

    function PrintQueue() {
      const [sel, setSel] = useState([1, 2, 3, 4, 5, 6, 7]);
      const [open, setOpen] = useState(false);
      const [done, setDone] = useState(false);
      const [exp, setExp] = useState(1);
      const toggle = (id) => setSel(sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id]);
      return (
        <div>
          <Crumb items={['Home', 'Reports', 'Report Print Queue']} />
          <h1 className="page">Report Print Queue</h1>
          <p className="desc">Print, reprint, reissue and send released reports. Sending emails each recipient its reports as protected PDFs, or masked copies when it has no delivery password.</p>
          <div className="route">/ReportPrintQueue</div>
          {done && <div className="toast" role="status">7 reports queued to 4 recipients. 1 recipient skipped: no email for Gerehu General Hospital. <span className="rowlink">View in Sent Messages</span></div>}
          {sel.length > 0 && <div className="batchbar"><span>{sel.length} selected</span><span style={{ flex: 1 }}></span><button>Print selected</button><button>Download selected</button><button onClick={() => setOpen(true)}>Send selected</button><button onClick={() => setSel([])}>Cancel</button></div>}
          <div className="toolbar"><input placeholder="Search lab number, name, order number" style={{ width: 300 }} /><select><option>Type: All</option></select><select><option>State: All</option></select><select><option>Sent: All</option><option>Not sent</option></select><select><option>Last 7 days</option></select></div>
          <table className="cds--data-table cds--data-table--sm">
            <thead><tr><th></th><th></th><th>Type</th><th>Lab No</th><th>Subject</th><th>Requester / order no.</th><th>State</th><th>Print</th><th>Sent</th></tr></thead>
            <tbody>
              {queueRows.map(r => (
                <React.Fragment key={r.id}>
                  <tr>
                    <td><input type="checkbox" checked={sel.includes(r.id)} onChange={() => toggle(r.id)} aria-label={`Select ${r.lab}`} /></td>
                    <td><span className="rowlink" onClick={() => setExp(exp === r.id ? null : r.id)}>{exp === r.id ? '▾' : '▸'}</span></td>
                    <td>{r.type}</td><td className="mono">{r.lab}</td><td>{r.subj}<div className="muted">{r.code}</div></td>
                    <td>{r.req}<div className="muted mono">{r.ext}</div></td><td>{stateTag(r.state)}</td><td>{r.print}</td>
                    <td>{r.sent.startsWith('Sent') ? <Tag kind="green">{r.sent}</Tag> : r.sent.startsWith('Queued') ? <Tag kind="blue">{r.sent}</Tag> : <span className="muted">{r.sent}</span>}</td>
                  </tr>
                  {exp === r.id && r.id === 1 && (
                    <tr><td colSpan={9}><div className="expand">
                      <div className="section-title">Version history</div>
                      <table className="cds--data-table cds--data-table--xs" style={{ background: '#fff' }}>
                        <thead><tr><th>Version</th><th>Event</th><th>When</th><th>By</th><th>Detail</th></tr></thead>
                        <tbody>
                          <tr><td>v2</td><td>Sent</td><td>15/10/26 14:32</td><td>J. Kaupa</td><td>results@pmgh.health.gov.pg, protected (password set 02/09/26)</td></tr>
                          <tr><td>v2</td><td>Sent</td><td>15/10/26 14:32</td><td>J. Kaupa</td><td>ward4b@pmgh.health.gov.pg, protected</td></tr>
                          <tr><td>v2</td><td>Printed</td><td>15/10/26 14:20</td><td>J. Kaupa</td><td>Final. Added: Creatinine, Urea</td></tr>
                          <tr><td>v1</td><td>Sent</td><td>15/10/26 10:41</td><td>Automatic</td><td>results@pmgh.health.gov.pg, protected. Partial 4 of 6</td></tr>
                          <tr><td>v1</td><td>Printed</td><td>15/10/26 10:30</td><td>M. Aiwa</td><td>Partial 4 of 6</td></tr>
                        </tbody>
                      </table>
                      <div className="btnrow"><Btn kind="tertiary">Open PDF v2</Btn><Btn kind="tertiary" onClick={() => setOpen(true)}>Send</Btn><Btn kind="ghost">Reissue with correction</Btn></div>
                    </div></td></tr>
                  )}
                  {exp === r.id && r.id !== 1 && (
                    <tr><td colSpan={9}><div className="expand"><span className="muted">Version history: {r.print}. {r.sent}.</span><div className="btnrow"><Btn kind="tertiary">Print</Btn><Btn kind="tertiary" onClick={() => setOpen(true)}>Send</Btn></div></div></td></tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
          {open && <SendDialog selected={sel.length} onClose={() => setOpen(false)} onSent={() => { setOpen(false); setDone(true); }} />}
        </div>
      );
    }

    // ---------- 2. Sent Messages ----------
    const sent = [
      { t: '15/10/26 14:32', p: 'Report', lab: 'CPHL-26-004188', to: 'Port Moresby General Hospital', addr: 're••••@pmgh.health.gov.pg', ch: 'Email', fmt: 'Protected, v2', s: 'Sent', a: 1, by: 'J. Kaupa' },
      { t: '15/10/26 14:05', p: 'Alert', lab: 'CPHL-26-004211', to: 'Provincial Health Office: Cholera', addr: '3 members', ch: 'SMS + Email', fmt: 'Rule: Cholera RDT positive', s: 'Sent', a: 1, by: 'Automatic', ack: 'Acknowledged 14:19 by Dr L. Hasu' },
      { t: '15/10/26 13:50', p: 'Ready notice', lab: 'CPHL-26-004176', to: 'Patient', addr: '+675 7•••• 412', ch: 'SMS', fmt: 'No result', s: 'Sent', a: 1, by: 'Automatic' },
      { t: '15/10/26 13:12', p: 'Report', lab: 'CPHL-26-004160', to: 'Gerehu General Hospital', addr: 'No email', ch: 'Email', fmt: '-', s: 'Skipped', a: 0, by: 'Automatic', reason: 'No email address' },
      { t: '15/10/26 12:40', p: 'Report', lab: 'CPHL-26-E00398', to: 'Eda Ranu Water Utility', addr: 'v.••••@edaranu.com.pg', ch: 'Email', fmt: 'Masked, v1', s: 'Failed', a: 4, by: 'M. Aiwa', reason: 'Mailbox full (552)' },
      { t: '15/10/26 11:58', p: 'Ready notice', lab: 'CPHL-26-004150', to: 'Patient', addr: '+675 7•••• 088', ch: 'SMS', fmt: 'Result included (SARS-CoV-2 RDT)', s: 'Sent', a: 1, by: 'Automatic' },
      { t: '15/10/26 11:20', p: 'Notification', lab: 'CPHL-26-004102', to: 'Lae Provincial Lab', addr: 'la••••@lpl.health.gov.pg', ch: 'Email', fmt: 'Referral out', s: 'Sent', a: 1, by: 'Automatic' },
      { t: '15/10/26 10:41', p: 'Report', lab: 'CPHL-26-004188', to: 'Port Moresby General Hospital', addr: 're••••@pmgh.health.gov.pg', ch: 'Email', fmt: 'Protected, v1 partial', s: 'Sent', a: 1, by: 'Automatic' },
      { t: '15/10/26 10:39', p: 'Report', lab: 'CPHL-26-004201', to: 'Port Moresby General Hospital', addr: 're••••@pmgh.health.gov.pg', ch: 'Email', fmt: 'Protected, v1', s: 'Queued', a: 0, by: 'Automatic', reason: 'Waiting for the 10 minute hold' },
    ];
    function SentMessages() {
      const [exp, setExp] = useState(1);
      const [prod, setProd] = useState('All');
      const rows = sent.filter(r => prod === 'All' || r.p === prod);
      return (
        <div>
          <Crumb items={['Home', 'Reports', 'Sent Messages']} />
          <h1 className="page">Sent Messages</h1>
          <p className="desc">Every report, alert, patient notice and notification OpenELIS has sent or tried to send, with what was sent and to whom.</p>
          <div className="route">/SentMessages?product={prod === 'All' ? '' : prod.toLowerCase()}</div>
          <div className="toolbar">
            <input placeholder="Lab number or recipient" style={{ width: 240 }} />
            <select value={prod} onChange={e => setProd(e.target.value)}><option>All</option><option>Report</option><option>Alert</option><option>Ready notice</option><option>Notification</option></select>
            <select><option>Status: All</option><option>Failed</option><option>Skipped</option><option>Queued</option></select>
            <select><option>Channel: All</option><option>Email</option><option>SMS</option><option>WhatsApp</option></select>
            <select><option>Today</option><option>Last 7 days</option></select>
          </div>
          <table className="cds--data-table cds--data-table--sm">
            <thead><tr><th></th><th>Time</th><th>Product</th><th>Lab No</th><th>Recipient</th><th>Channel</th><th>Content</th><th>Status</th><th>Attempts</th><th>Sent by</th></tr></thead>
            <tbody>{rows.map((r, i) => (
              <React.Fragment key={i}>
                <tr>
                  <td><span className="rowlink" onClick={() => setExp(exp === i ? null : i)}>{exp === i ? '▾' : '▸'}</span></td>
                  <td>{r.t}</td><td>{r.p}</td><td className="mono">{r.lab}</td><td>{r.to}<div className="muted mono">{r.addr}</div></td><td>{r.ch}</td><td>{r.fmt}</td>
                  <td>{statusTag(r.s)}{r.reason && <div className="muted">{r.reason}</div>}</td><td>{r.a}</td><td>{r.by}</td>
                </tr>
                {exp === i && (
                  <tr><td colSpan={10}><div className="expand">
                    {r.p === 'Alert' ? (
                      <div className="grid2">
                        <div><div className="section-title">SMS sent</div><div className="previewbox">CPHL ALERT: Cholera RDT POSITIVE. Lab no CPHL-26-004211, order GGH-5521, Gerehu General Hospital. Collected 15/10/26 08:10, male 34 y. Confirm: 325 6800. Ack: cphl.health.gov.pg/a/7Hq2</div></div>
                        <div><div className="section-title">Members and acknowledgement</div><p style={{ fontSize: 14 }}>Dr L. Hasu (email, SMS): Sent, acknowledged 14:19<br />S. Moide (SMS): Sent<br />NDoH Surveillance desk (email): Sent</p><div className="info">Acknowledged within the rule's 60 minute limit. No escalation raised.</div></div>
                      </div>
                    ) : r.s === 'Failed' ? (
                      <div>

                  <div className="field"><label>Distribution lists</label><div><span className="chip">Provincial Health Office: Cholera ✕</span></div><input placeholder="Search lists" /></div>
                  <div style={{ fontSize: 14 }}>
                    <label><input type="checkbox" defaultChecked /> The order's facility</label><br />
                    <label><input type="checkbox" defaultChecked /> The ordering clinician</label><br />
                    <label><input type="checkbox" /> The patient (instruction)</label><br />
                    <label><input type="checkbox" /> A fixed address</label>
                  </div>
                </div>
                <div className="grid2" style={{ marginTop: '1rem' }}>
                  <div className="field"><label>Channels</label><select><option>SMS and email</option><option>Email</option><option>SMS</option><option>WhatsApp</option></select></div>
                  <div className="field"><label>Acknowledgement</label><select><option>Required within 60 minutes, then alert validators</option><option>Not required</option></select></div>
                </div>
                <div className="info">The list may receive patient identifiers, so its message includes the patient's name and village. The facility and clinician messages carry the lab number and their own order number instead.</div>
                <div className="btnrow"><Btn kind="primary">Save rule</Btn><Btn kind="ghost">Cancel</Btn><Btn kind="ghost">Turn off rule</Btn></div>
              </div></td></tr>
            </tbody>
          </table>
        </div>
      );
    }

    const screens = [
      { g: 'Reports (main menu)', items: [['queue', 'Report Print Queue: Send', PrintQueue], ['sent', 'Sent Messages', SentMessages]] },
      { g: 'Admin › Notifications', items: [['channels', 'Channels', Channels], ['templates', 'Templates', Templates], ['lists', 'Distribution Lists', Lists], ['settings', 'Delivery Settings', Settings]] },
      { g: 'Elsewhere', items: [['facility', 'Organization: Result delivery', Facility], ['alert', 'Test Catalog: Alert rule', AlertRule], ['order', 'Order entry: patient notices', OrderEntry]] },
    ];
    function App() {
      const [cur, setCur] = useState('queue');
      const Screen = screens.flatMap(s => s.items).find(i => i[0] === cur)[2];
      return (
        <div className="shell">
          <nav className="switcher" aria-label="Preview screens">
            {screens.map(s => <div key={s.g}><h4>{s.g}</h4>{s.items.map(([k, label]) => <button key={k} className={cur === k ? 'active' : ''} onClick={() => setCur(k)}>{label}</button>)}</div>)}
          </nav>
          <main className="main"><Screen /></main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
