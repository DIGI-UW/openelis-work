      { id: 3, name: 'TB Xpert Cross-Lab', type: 'inter_lab_split', discipline: 'TB', cycles: 2, participants: 8, status: 'Draft' },
    ];

    const participantFollowups = [
      { id: 1, participant: 'Kisumu County Lab', scheme: 'Malaria Microscopy Consortium', cycle: '2026-Q1', analyte: 'P. falciparum ID',
        perf: 'Unacceptable', triggerType: 'single', followupState: 'Notified', notifiedAt: '2026-04-10', response: null },
      { id: 2, participant: 'Mombasa Referral Hospital', scheme: 'EA Regional HIV VL EQA', cycle: '2026-02', analyte: 'HIV-1 VL',
        perf: 'Unacceptable', triggerType: 'repeat', followupState: 'Escalated', notifiedAt: '2026-03-22', response: 'Corrective action doc received 2026-04-02' },
      { id: 3, participant: 'Nakuru Regional Lab', scheme: 'Malaria Microscopy Consortium', cycle: '2026-Q1', analyte: 'Plasmodium species ID',
        perf: 'Questionable', triggerType: 'single', followupState: 'Response recorded', notifiedAt: '2026-04-05', response: 'Reanalyst training scheduled' },
      { id: 4, participant: 'Eldoret Central Lab', scheme: 'Malaria Microscopy Consortium', cycle: '2026-Q1', analyte: 'P. falciparum ID',
        perf: 'Unacceptable', triggerType: 'persistent', followupState: 'Flagged for repeat', notifiedAt: '2026-04-05', response: 'Auto-flagged: 2 of last 3 unacceptable' },
    ];

    // ---------- Helpers ----------
    const schemeTypeTag = (type) => {
      const map = {
        international_pt: { label: 'International PT', kind: 'blue' },
        regional_pt: { label: 'Regional PT', kind: 'teal' },
        inter_lab_split: { label: 'Split-Sample', kind: 'purple' },
        in_house: { label: 'In-House', kind: 'warm-gray' },
      };
      const m = map[type] || { label: type, kind: 'gray' };
      return <span className={`cds--tag cds--tag--${m.kind}`}>{m.label}</span>;
    };

    const statusTag = (status) => {
      const map = {
        planned: { label: 'Planned', kind: 'gray' },
        panel_received: { label: 'Panel received', kind: 'teal' },
        testing: { label: 'Testing', kind: 'blue' },
        ready_to_submit: { label: 'Ready to submit', kind: 'purple' },
        submitted: { label: 'Submitted', kind: 'cyan' },
        scored: { label: 'Scored', kind: 'green' },
        closed: { label: 'Closed', kind: 'gray' },
      };
      const m = map[status] || { label: status, kind: 'gray' };
      return <span className={`cds--tag cds--tag--${m.kind}`}>{m.label}</span>;
    };

    const perfTag = (label) => {
      const map = {
        'Acceptable': 'green',
        'Questionable': 'warm-gray',
        'Unacceptable': 'red',
      };
      return <span className={`cds--tag cds--tag--${map[label] || 'gray'}`}>{label}</span>;
    };

    const entryStatusDot = (status) => {
      if (status === 'entered') return <span className="progress-status"><span className="progress-dot entered" /> Entered</span>;
      if (status === 'in_progress') return <span className="progress-status"><span className="progress-dot in-progress" /> In progress</span>;
      return <span className="progress-status"><span className="progress-dot empty" /> Not entered</span>;
    };

    // ---------- V2.2 Participant: My Cycles (progress dashboard) ----------
    function MyCyclesScreen({ onReview, onReceivePanel }) {
      const [expanded, setExpanded] = useState(1); // WHO HIV expanded by default
      const [bucket, setBucket] = useState('active');   // status bucket: active | awaiting | completed | all
      const [typeFilter, setTypeFilter] = useState('all');
      const [search, setSearch] = useState('');

      // Lab-wide KPIs (NOT filtered — these describe the whole lab state)
      const activeCount = cycles.filter(c => cycleBuckets.active.statuses.includes(c.status)).length;
      const readyCount = cycles.filter(c => c.status === 'ready_to_submit').length;
      const awaitingCount = cycles.filter(c => c.status === 'submitted').length;
      const openNce = cycles.filter(c => c.hasNce).length;

      // Filter application
      const filteredCycles = cycles.filter(c => {
        if (!cycleBuckets[bucket].statuses.includes(c.status)) return false;
        if (typeFilter !== 'all' && c.schemeType !== typeFilter) return false;
        if (search && !(`${c.schemeName} ${c.provider} ${c.cycleNumber}`.toLowerCase().includes(search.toLowerCase()))) return false;
        return true;
      });

      const filtersApplied = bucket !== 'active' || typeFilter !== 'all' || search !== '';
      const clearFilters = () => { setBucket('active'); setTypeFilter('all'); setSearch(''); };

      return (
        <div>
          <div className="breadcrumb">
            <a>My EQA</a> / <span>My Cycles</span>
          </div>
          <h1 className="page-title">{t('eqa.participant.myCycles', 'My EQA Cycles')}</h1>
          <div className="page-subtitle">
            {t('eqa.participant.myCyclesSubtitle', 'Cycles your lab is participating in. Result entry and validation happen in the standard OpenELIS result pipeline — this page tracks progress and routes you there.')}

          <div className="kpi-row">
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.kpi.active', 'Active cycles')}</div>
              <div className="kpi-value">{activeCount}</div>
              <div className="kpi-delta">in flight</div>
            </div>
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.kpi.readyToSubmit', 'Ready to submit')}</div>
              <div className="kpi-value">{readyCount}</div>
              <div className="kpi-delta">with review flag on</div>
            </div>
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.kpi.awaiting', 'Awaiting scores')}</div>
              <div className="kpi-value">{awaitingCount}</div>
              <div className="kpi-delta">submitted to provider</div>
            </div>
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.kpi.openNce', 'Open EQA-linked NCE')}</div>
              <div className="kpi-value">{openNce}</div>
              <div className="kpi-delta" style={{color: openNce > 0 ? '#c21e56' : '#525252'}}>
                {openNce > 0 ? 'needs attention' : 'none open'}
              </div>
            </div>
          </div>

          <div className="cds--inline-notification cds--inline-notification--info" style={{padding:'0.75rem 1rem', background:'#edf5ff', borderLeft:'3px solid #0f62fe'}}>

            {t('eqa.participant.infoBody', 'Click a Lab No to open standard result entry for that sample, with the EQA flag and per-analyst column set. Once validation-complete, the cycle auto-advances to Submitted (or to Ready-to-submit if the scheme requires cycle-level review).')}

          <div className="filter-bar">
            <div className="filter-group">
              <div className="filter-label">Status</div>
              <select className="filter-select" value={bucket} onChange={e => { setBucket(e.target.value); setExpanded(null); }}>
                {Object.entries(cycleBuckets).map(([k, v]) => {
                  const count = cycles.filter(c => v.statuses.includes(c.status)).length;
                  return <option key={k} value={k}>{v.label} ({count})</option>;
                })}
              </select>
            </div>
            <div className="filter-group">
              <div className="filter-label">Scheme type</div>
              <select className="filter-select" value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>
                {schemeTypeOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </div>
            <div className="filter-group">
              <div className="filter-label">Search</div>
              <input className="filter-input" placeholder={t('eqa.search', 'Scheme, provider, cycle…')}
                     value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            {filtersApplied && (
              <button className="filter-clear" onClick={clearFilters}>Clear filters</button>
            )}
            <div className="filter-count">
              Showing <strong>{filteredCycles.length}</strong> of {cycles.length} cycles
            </div>
          </div>
          <div className="filter-hint">{cycleBuckets[bucket].hint}</div>
          <table className="data-table" style={{marginTop:'0.5rem'}}>
            <thead>
              <tr>
                <th>{t('eqa.col.scheme', 'Scheme')}</th>
                <th>{t('eqa.col.type', 'Type')}</th>
                <th>{t('eqa.col.cycle', 'Cycle')}</th>
                <th>{t('eqa.col.status', 'Status')}</th>
                <th>{t('eqa.col.deadline', 'Deadline')}</th>
                <th>{t('eqa.col.progress', 'Progress')}</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filteredCycles.length === 0 && (
                <tr>
                  <td colSpan="7" style={{padding:'2rem 1rem', textAlign:'center', color:'#525252', fontStyle:'italic'}}>
                    No cycles match these filters.
                    {filtersApplied && <> <a onClick={clearFilters} style={{color:'#0f62fe', cursor:'pointer', fontStyle:'normal'}}>Clear filters</a></>}
                  </td>
                </tr>
              )}
              {filteredCycles.map(c => (
                <React.Fragment key={c.id}>
                  <tr className="expand-trigger" onClick={() => setExpanded(expanded === c.id ? null : c.id)}>
                    <td>
                      <div style={{fontWeight:600}}>{c.schemeName}</div>
                      <div style={{fontSize:12, color:'#525252'}}>{c.provider}</div>
                      {c.hasNce && (
                        <div style={{marginTop:4}}>
                          <span className="cds--tag cds--tag--red">NCE-2026-042</span>
                        </div>
                      )}
                    </td>
                    <td>{schemeTypeTag(c.schemeType)}</td>
                    <td>{c.cycleNumber}</td>
                    <td>{statusTag(c.status)}</td>
                    <td>{c.deadline}</td>
                    <td>
                      <div style={{fontSize:13}}>{c.progress.entered} / {c.progress.total}</div>
                      <div className="progress-bar">

                          className={`progress-bar-fill${c.progress.entered === c.progress.total ? ' complete' : ''}`}
                          style={{width: `${(c.progress.entered/c.progress.total)*100}%`}}

                      </div>
                    </td>
                    <td>
                      <button className="cds--btn cds--btn--ghost cds--btn--sm">
                        {expanded === c.id ? '▲' : '▼'}
                      </button>
                    </td>
                  </tr>
                  {expanded === c.id && (
                    <tr className="expanded-content">
                      <td colSpan="7">
                        {c.hasNce && (
                          <div className="cds--inline-notification cds--inline-notification--warning" style={{padding:'0.75rem 1rem', background:'#fff8e1', borderLeft:'3px solid #f1c21b', marginBottom:'1rem'}}>
                            <strong>NCE-2026-042</strong> — Unacceptable score on {c.schemeName}. Auto-created on 2026-04-19, assigned to QA Officer. <a style={{color:'#0f62fe', marginLeft:8, cursor:'pointer'}}>View in NCE register →</a>
                          </div>
                        )}
                        {c.perAnalyst && (
                          <div style={{marginBottom:8}}>
                            <span className="chip" style={{background:'#a7f0ba'}}>Per-analyst required</span>
                            <span style={{fontSize:12, color:'#525252', marginLeft:6}}>
                              Analysts mapped at scheme enrollment. The per-analyst column will be visible on the standard result entry page.
                            </span>
                          </div>
                        )}
                        {c.requiresCycleReview && c.status === 'ready_to_submit' && (
                          <div className="cds--inline-notification cds--inline-notification--info" style={{padding:'0.75rem 1rem', background:'#edf5ff', borderLeft:'3px solid #0f62fe', marginBottom:'1rem'}}>
                            <strong>Optional cycle-level review enabled for this scheme.</strong>&nbsp;
                            All {c.progress.total} analytes validated. Open the pre-submission summary to confirm, then submit.
                          </div>
                        )}
                        {c.samples.length > 0 ? (
                          <>
                            <div style={{fontWeight:600, marginBottom:6}}>{t('eqa.progress.title', 'Sample progress')}</div>
                            <table className="nested-table">
                              <thead>
                                <tr>
                                  <th>Lab No</th>
                                  <th>Provider sample ID</th>
                                  <th>Analytes</th>
                                  {c.perAnalyst && <th>Assigned analyst</th>}
                                  <th>Entry status</th>
                                </tr>
                              </thead>
                              <tbody>
                                {c.samples.map(s => (
                                  <tr key={s.labNo}>
                                    <td>
                                      <a
                                        onClick={(e) => e.stopPropagation()}
                                        style={{color:'#0f62fe', cursor:'pointer', fontFamily:'IBM Plex Mono, monospace', fontSize:13}}
                                        title={t('eqa.labNo.tooltip', 'Open results entry for this lab number')}
                                      >
                                        {s.labNo}
                                      </a>
                                    </td>
                                    <td style={{fontSize:13, color:'#525252'}}>{s.id}</td>
                                    <td>{s.analytes.join(', ')}</td>
                                    {c.perAnalyst && <td>{s.analyst || '—'}</td>}
                                    <td>{entryStatusDot(s.entryStatus)}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                            <div className="btn-row">
                              {c.requiresCycleReview && c.status === 'ready_to_submit' && (
                                <button className="cds--btn cds--btn--primary cds--btn--sm" onClick={(e) => { e.stopPropagation(); onReview(c); }}>
                                  {t('eqa.btn.openReview', 'Open pre-submission summary')}
                                </button>
                              )}
                              <button className="cds--btn cds--btn--ghost cds--btn--sm" onClick={(e) => e.stopPropagation()}>
                                {t('eqa.btn.printPanel', 'Print panel worksheet')}
                              </button>
                            </div>
                          </>
                        ) : (
                          <div style={{color:'#525252', fontSize:13, fontStyle:'italic'}}>
                            {c.status === 'scored' && 'Scoring complete. See the NCE link above for corrective action, or view scored results in Lab Performance.'}
                            {c.status === 'submitted' && 'Submitted to provider — awaiting scores.'}
                            {c.status === 'planned' && (
                              <>
                                <div>{t('eqa.cycle.plannedCopy', 'Panel has not yet been received at this lab. Confirm receipt when the shipment arrives to advance the cycle to Testing.')}</div>
                                <div className="btn-row" style={{marginTop:8}}>
                                  <button
                                    className="cds--btn cds--btn--primary cds--btn--sm"
                                    onClick={(e) => { e.stopPropagation(); onReceivePanel && onReceivePanel(c); }}
                                    style={{fontStyle:'normal'}}
                                  >
                                    📦 {t('eqa.btn.receivePanel', 'Receive panel')}
                                  </button>
                                </div>
                              </>
                            )}
                            {c.status === 'panel_received' && 'Panel received. Proceed to standard result entry to begin testing.'}
                          </div>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ---------- V2.2 Participant: Cycle Review (read-only summary, no sign-off ceremony) ----------
    function CycleReviewScreen({ cycle, onBack }) {
      return (
        <div>
          <div className="breadcrumb">
            <a onClick={(e)=>{e.preventDefault(); onBack();}}>My Cycles</a> / <span>{cycle.schemeName} — {cycle.cycleNumber}</span>
          </div>
          <h1 className="page-title">{t('eqa.review.title', 'Pre-submission summary')}</h1>
          <div className="page-subtitle">
            {t('eqa.review.subtitle', 'Read-only summary of all validated results before FHIR submission. No additional sign-off is required — validation in the standard pipeline is the authoritative gate. This scheme has the optional cycle-review flag turned on.')}
          </div>

          <div className="cds--inline-notification cds--inline-notification--info" style={{padding:'0.75rem 1rem', background:'#edf5ff', borderLeft:'3px solid #0f62fe'}}>
            <strong>{t('eqa.review.ready', 'All results validated.')}</strong>&nbsp;
            {cycle.progress.total} of {cycle.progress.total} analytes validated in the standard pipeline. Submit via FHIR to {cycle.provider} below.

                <div style={{fontSize:12, color:'#525252'}}>{t('eqa.review.scheme', 'Scheme')}</div>
                <div style={{fontSize:16, fontWeight:600}}>{cycle.schemeName}</div>
              </div>
              <div>
                <div style={{fontSize:12, color:'#525252'}}>{t('eqa.review.cycle', 'Cycle')}</div>

              </div>
              <div>
                <div style={{fontSize:12, color:'#525252'}}>{t('eqa.review.provider', 'Provider')}</div>
                <div style={{fontSize:16, fontWeight:600}}>{cycle.provider}</div>

              <div>
                <div style={{fontSize:12, color:'#525252'}}>{t('eqa.review.deadline', 'Deadline')}</div>

              </div>
            </div>
          </div>

          <div className="review-section-title">{t('eqa.review.resultsBySample', 'Results summary')}</div>

                      <td>V. Chebet</td>
                      <td>2026-04-22 14:08</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}

          <div className="cds--inline-notification cds--inline-notification--success" style={{padding:'0.75rem 1rem', background:'#defbe6', borderLeft:'3px solid #24a148', marginTop:'1rem'}}>
            {t('eqa.review.auditFootnote', 'All results linked to their standard-pipeline validation audit record. No additional approval captured here — validation is the authoritative action.')}

          <div className="btn-row" style={{marginTop:'2rem', paddingTop:'1rem', borderTop:'1px solid #c6c6c6'}}>

              {t('eqa.btn.exportPdf', 'Export cycle summary (PDF)')}

                  <div className="kpi-delta">+6% vs. prior year</div>

                  <div className="kpi-delta">2 late of 24</div>
                </div>
                <a

                  style={{textDecoration:'none', color:'inherit', cursor:'pointer'}}

                  <div className="kpi-label">EQA-triggered NCEs (12 mo)</div>
                  <div className="kpi-value">3</div>
                  <div className="kpi-delta" style={{color:'#c21e56'}}>1 open &nbsp;→ NCE register</div>

                  <div className="kpi-value">1</div>
                  <div className="kpi-delta" style={{color:'#c21e56'}}>TB smear</div>

              </div>

              <div style={{fontSize:13, color:'#525252', margin:'1rem 0 0.75rem'}}>

                <span className="coverage-cell questionable" style={{verticalAlign:'middle'}}>?</span> Questionable &nbsp;
                <span className="coverage-cell unacceptable" style={{verticalAlign:'middle'}}>!</span> Unacceptable &nbsp;

                <tr key={i}>
                  <td><strong>{s.lab}</strong></td>
                  <td style={{fontFamily:'IBM Plex Mono, monospace', fontSize:13}}>{s.tracking}</td>
                  <td>{statusChip(s.status)}</td>
                  <td style={{fontSize:13}}>{s.shipped}</td>
                  <td style={{fontSize:13}}>{s.expected}</td>
                  <td>
                    {s.cold === 'OK' && <span className="chip" style={{background:'#a7f0ba'}}>OK</span>}
                    {s.cold === 'Pending' && <span className="chip" style={{background:'#e0e0e0'}}>Pending</span>}
                    {s.cold === 'Alert' && <span className="chip" style={{background:'#ffd7d9'}}>Alert</span>}
                    {s.cold === '—' && <span style={{color:'#525252'}}>—</span>}
                  </td>
                  <td><button className="cds--btn cds--btn--ghost cds--btn--sm">Details</button></td>
                </tr>
              ))}
            </tbody>
          </table>

          <div style={{fontSize:12, color:'#525252', marginTop:12}}>
            {t('eqa.provider.ship.noteV3', 'Structured cold-chain validators + panel rejection workflow land in V3.2 (see crosswalk §7.2.13). Cold-chain column here reflects participant-reported free-text receipt notes only.')}
          </div>
        </div>
      );
    }

    // ---------- V2.5 Provider Receipt Monitor (FR-V2.5-14) + cycle state banner (FR-V2.5-16) ----------
    function ProviderReceiptMonitor() {
      const receipts = [
        { lab: 'Central Lab Nairobi',    received: '2026-04-23 09:14', temp: 4.2, integrity: 'OK', state: 'received', overdue: false },
        { lab: 'Kisumu County Hospital', received: '2026-04-22 15:40', temp: 5.1, integrity: 'OK', state: 'received', overdue: false },
        { lab: 'Mombasa Reference Lab',  received: null,               temp: null, integrity: null, state: 'in_transit', overdue: false },
        { lab: 'Eldoret Regional Lab',   received: null,               temp: null, integrity: null, state: 'in_transit', overdue: false },
        { lab: 'Nakuru County Hospital', received: null,               temp: null, integrity: null, state: 'exception', overdue: true  },
        { lab: 'Garissa District Lab',   received: null,               temp: null, integrity: null, state: 'not_shipped', overdue: false },
      ];
      const receivedCount = receipts.filter(r => r.state === 'received').length;
      const totalCount = receipts.length;
      return (
        <div>
          <div className="breadcrumb">
            <a>EQA Program Management</a> / <a>Provider Cycles</a> / <span>Receipt Monitor</span>
          </div>
          <h1 className="page-title">{t('eqa.provider.receipt.title', 'Receipt monitor — EA HIV VL 2026-Q3')}</h1>
          <div className="page-subtitle">
            {t('eqa.provider.receipt.sub', 'Tracks participant-lab panel receipt confirmations (V2.2 FR-V2.2-12). Auto-advances the provider cycle from delivered → submissions_open when all participants have confirmed.')}
          </div>

          {/* Cycle-state banner + timeline (FR-V2.5-16) */}
          <div className="tile" style={{background:'#f4f4f4', padding:'1rem'}}>
            <div style={{fontSize:12, color:'#525252', textTransform:'uppercase', letterSpacing:0.5, marginBottom:6}}>
              Cycle state — auto-advances as side-effects land
            </div>
            <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap', fontSize:12}}>
              {['planned','prep_in_progress','ready_to_ship','shipped','delivered','submissions_open','submissions_closed','scoring','scored','closed'].map((s, i, arr) => {
                const current = 'delivered';
                const idx = arr.indexOf(current);
                const done = i <= idx;
                const isCurrent = s === current;
                return (
                  <React.Fragment key={s}>
                    <span
                      className="chip"
                      style={{
                        background: isCurrent ? '#0f62fe' : (done ? '#a7f0ba' : '#e0e0e0'),
                        color: isCurrent ? '#fff' : '#161616',
                        fontWeight: isCurrent ? 600 : 400,
                      }}
                    >
                      {s}
                    </span>
                    {i < arr.length - 1 && <span style={{color:'#8d8d8d'}}>→</span>}
                  </React.Fragment>
                );
              })}
            </div>
            <div style={{fontSize:12, color:'#525252', marginTop:8}}>
              Currently in <strong>delivered</strong>. Will auto-advance to <strong>submissions_open</strong> when {receivedCount} / {totalCount} receipts becomes {totalCount} / {totalCount}. Transition recorded in <code>eqa_cycle_state_transition</code> (FR-V2.1-21).
            </div>
          </div>

          <div className="kpi-row" style={{marginTop:'1rem'}}>
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.provider.receipt.confirmed', 'Confirmed receipts')}</div>
              <div className="kpi-value">{receivedCount} / {totalCount}</div>
              <div className="kpi-delta">{Math.round((receivedCount/totalCount)*100)}% complete</div>
            </div>
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.provider.receipt.overdue', 'Overdue')}</div>
              <div className="kpi-value" style={{color: receipts.filter(r => r.overdue).length > 0 ? '#c21e56' : '#161616'}}>
                {receipts.filter(r => r.overdue).length}
              </div>
              <div className="kpi-delta">past expected delivery</div>
            </div>
            <div className="kpi-tile">
              <div className="kpi-label">{t('eqa.provider.receipt.integrityAlerts', 'Integrity alerts')}</div>
              <div className="kpi-value">0</div>
              <div className="kpi-delta">none reported</div>
            </div>
          </div>

          <table className="data-table" style={{marginTop:'1rem'}}>
            <thead>
              <tr>
                <th>Participant lab</th>
                <th>Received at</th>
                <th>Received temp</th>
                <th>Integrity</th>
                <th>State</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {receipts.map((r, i) => (
                <tr key={i} style={r.overdue ? {background:'#fff1f1'} : {}}>
                  <td><strong>{r.lab}</strong>{r.overdue && <span className="chip" style={{background:'#ffd7d9', marginLeft:6}}>Overdue</span>}</td>
                  <td style={{fontSize:13}}>{r.received || <span style={{color:'#525252', fontStyle:'italic'}}>—</span>}</td>
                  <td style={{fontSize:13}}>{r.temp != null ? `${r.temp} °C` : '—'}</td>
                  <td>
                    {r.integrity === 'OK' && <span className="chip" style={{background:'#a7f0ba'}}>OK</span>}
                    {r.integrity === 'Issue' && <span className="chip" style={{background:'#ffd7d9'}}>Issue</span>}
                    {r.integrity === null && <span style={{color:'#525252'}}>—</span>}
                  </td>
                  <td>{statusTag(r.state)}</td>
                  <td>
                    {r.overdue
                      ? <button className="cds--btn cds--btn--tertiary cds--btn--sm">Contact lab</button>
                      : <button className="cds--btn cds--btn--ghost cds--btn--sm">Details</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <div style={{fontSize:12, color:'#525252', marginTop:12}}>
            {t('eqa.provider.receipt.noteFhir', 'Receipts arrive via participant-side V2.2 receipt modal + best-effort FHIR ShipmentDelivery inbound. Inbound FHIR failures fall back to manual entry on this screen.')}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
